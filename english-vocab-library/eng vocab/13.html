        let currentIndex = 0;
        let score = 0;
        let userAnswers = {}; // stores selected option index per question ID

        // DOM Elements
        const questionBadge = document.getElementById('question-badge');
        const categoryBadge = document.getElementById('category-badge');
        const examTag = document.getElementById('exam-tag');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hintToggleBtn = document.getElementById('hint-toggle-btn');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const scoreDisplay = document.getElementById('score-display');
        const totalScoreDisplay = document.getElementById('total-score-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const bottomPrev = document.getElementById('bottom-prev');
        const bottomNext = document.getElementById('bottom-next');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');
        const mobileJumpInput = document.getElementById('mobile-jump-input');
        const mobileJumpBtn = document.getElementById('mobile-jump-btn');
        const resetBtn = document.getElementById('reset-btn');
        const bottomResetBtn = document.getElementById('bottom-reset-btn');
        const progressStatusText = document.getElementById('progress-status-text');

        totalScoreDisplay.textContent = quizData.length;
        jumpInput.max = quizData.length;
        mobileJumpInput.max = quizData.length;

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Shuffle options for each question once upon initialization to ensure random position of correct answer
        const randomizedQuizData = quizData.map(q => {
            const shuffledOpts = shuffleArray(q.options);
            return { ...q, shuffledOptions: shuffledOpts };
        });

        function loadQuestion(index) {
            const q = randomizedQuizData[index];
            currentIndex = index;

            // Update badges & progress
            questionBadge.textContent = `Question ${index + 1} of ${quizData.length}`;
            categoryBadge.textContent = q.category;
            examTag.textContent = q.exam;
            progressStatusText.textContent = `Question ${index + 1} of ${quizData.length}`;
            
            const progressPercent = ((index + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            questionText.textContent = q.question;

            // Hint setup
            hintBox.textContent = q.hint;
            hintBox.classList.add('hidden');
            hintToggleBtn.textContent = "💡 Toggle Hint";

            // Explanation setup
            explanationBox.classList.add('hidden');

            // Render options
            optionsContainer.innerHTML = '';
            const savedAnswer = userAnswers[q.id];

            q.shuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl font-medium text-sm md:text-base option-btn flex items-center justify-between cursor-pointer`;
                
                const labelSpan = document.createElement('span');
                labelSpan.textContent = `${String.fromCharCode(65 + idx)}. ${opt.text}`;
                btn.appendChild(labelSpan);

                if (savedAnswer !== undefined) {
                    btn.disabled = true;
                    if (idx === savedAnswer) {
                        if (opt.correct) {
                            btn.classList.add('option-correct');
                            labelSpan.innerHTML += ` ✓ <span class="text-xs font-bold float-right">Correct</span>`;
                        } else {
                            btn.classList.add('option-incorrect');
                            labelSpan.innerHTML += ` ✗ <span class="text-xs font-bold float-right">Your Answer</span>`;
                        }
                    } else if (opt.correct) {
                        btn.classList.add('option-correct');
                        labelSpan.innerHTML += ` ✓ <span class="text-xs font-bold float-right">Correct Answer</span>`;
                    }
                } else {
                    btn.addEventListener('click', () => selectOption(index, idx, opt.correct, btn));
                }

                optionsContainer.appendChild(btn);
            });

            if (savedAnswer !== undefined) {
                showExplanation(q);
            }

            // Navigation button states
            prevBtn.disabled = index === 0;
            bottomPrev.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? "Finish Quiz 🏁" : "Next →";
            bottomNext.textContent = index === quizData.length - 1 ? "Finish 🏁" : "Next →";

            jumpInput.value = index + 1;
            mobileJumpInput.value = index + 1;
        }

        function selectOption(qIndex, optIdx, isCorrect, btnElement) {
            const q = randomizedQuizData[qIndex];
            userAnswers[q.id] = optIdx;

            // Disable all option buttons and highlight
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach((b, idx) => {
                b.disabled = true;
                const optObj = q.shuffledOptions[idx];
                if (optObj.correct) {
                    b.classList.add('option-correct');
                } else if (idx === optIdx && !isCorrect) {
                    b.classList.add('option-incorrect');
                }
            });

            if (isCorrect) {
                score++;
                scoreDisplay.textContent = score;
            }

            showExplanation(q);
        }

        function showExplanation(q) {
            explanationText.textContent = q.explanation;
            explanationBox.classList.remove('hidden');
            const hasUserCorrect = q.shuffledOptions[userAnswers[q.id]]?.correct;
            if (hasUserCorrect) {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-[#E2F8EC] border-[#28A745] text-[#155724]";
                document.getElementById('explanation-title').innerHTML = `<span>✅</span> Correct! Rationale & Exam Notes`;
            } else {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-[#FDE8E8] border-[#DC3545] text-[#721C24]";
                document.getElementById('explanation-title').innerHTML = `<span>❌</span> Incorrect. Rationale & Exam Notes`;
            }
        }

        // Hint Toggle
        hintToggleBtn.addEventListener('click', () => {
            hintBox.classList.toggle('hidden');
            hintToggleBtn.textContent = hintBox.classList.contains('hidden') ? "💡 Toggle Hint" : "💡 Hide Hint";
        });

        // Navigation Handlers
        function handleNext() {
            if (currentIndex < quizData.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                alert(`🎉 Quiz Completed! Your final score is ${score} out of ${quizData.length}. Great job mastering your Blackbook Vocabulary!`);
            }
        }

        function handlePrev() {
            if (currentIndex > 0) {
                loadQuestion(currentIndex - 1);
            }
        }

        nextBtn.addEventListener('click', handleNext);
        bottomNext.addEventListener('click', handleNext);
        prevBtn.addEventListener('click', handlePrev);
        bottomPrev.addEventListener('click', handlePrev);

        // Jump Handling
        function executeJump(inputEl) {
            const val = parseInt(inputEl.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                loadQuestion(val - 1);
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        jumpBtn.addEventListener('click', () => executeJump(jumpInput));
        mobileJumpBtn.addEventListener('click', () => executeJump(mobileJumpInput));

        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') executeJump(jumpInput);
        });
        mobileJumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') executeJump(mobileJumpInput);
        });

        // Reset Quiz
        function resetQuiz() {
            if (confirm("Are you sure you want to reset the quiz? All progress and answers will be cleared.")) {
                score = 0;
                scoreDisplay.textContent = 0;
                userAnswers = {};
                loadQuestion(0);
            }
        }

        resetBtn.addEventListener('click', resetQuiz);
        bottomResetBtn.addEventListener('click', resetQuiz);

        // Keyboard Navigation (Arrow Keys)
        document.addEventListener('keydown', (e) => {
            // Do not trigger if user is typing in inputs
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

            if (e.key === 'ArrowLeft') {
                handlePrev();
            } else if (e.key === 'ArrowRight') {
                handleNext();
            }
        });

        // Initial Load
        loadQuestion(0);
    </script>
