        let currentQuestionIndex = 0;
        let score = 0;
        let streak = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredQuestions = new Array(quizData.length).fill(false);

        // DOM Elements
        const questionBadge = document.getElementById('questionBadge');
        const progressBar = document.getElementById('progressBar');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const hintToggleBtn = document.getElementById('hintToggleBtn');
        const hintBtnText = document.getElementById('hintBtnText');
        const hintBox = document.getElementById('hintBox');
        const explanationBox = document.getElementById('explanationBox');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const jumpInput = document.getElementById('jumpInput');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const streakDisplay = document.getElementById('streakDisplay');
        const progressText = document.getElementById('progressText');
        const totalPossibleDisplay = document.getElementById('totalPossibleDisplay');

        totalPossibleDisplay.textContent = quizData.length;
        jumpInput.max = quizData.length;

        function loadQuestion(index) {
            currentQuestionIndex = index;
            const q = quizData[index];

            // Update badges and progress
            questionBadge.textContent = `Question ${index + 1} of ${quizData.length}`;
            progressText.textContent = `${index + 1} / ${quizData.length}`;
            const progressPercent = ((index + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Set question text
            questionText.textContent = q.q;

            // Reset hint & explanation
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            hintBtnText.textContent = "Show Hint";
            
            if (answeredQuestions[index]) {
                explanationBox.innerHTML = `<p class="font-bold mb-1 ${userAnswers[index] === q.correct ? 'text-successGreen' : 'text-errorRed'}">${userAnswers[index] === q.correct ? '✅ Correct!' : '❌ Incorrect.'}</p><p class="text-sm text-darkReference text-darkPurple">${q.explanation}</p>`;
                explanationBox.className = `mb-6 p-4 rounded-2xl border transition-all duration-300 ${userAnswers[index] === q.correct ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`;
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            // Render options
            optionsContainer.innerHTML = '';
            q.options.forEach((option, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-2xl border transition-all duration-200 font-medium text-sm sm:text-base flex items-center justify-between group ${
                    answeredQuestions[index]
                        ? i === q.correct
                            ? 'bg-green-100 border-green-400 text-darkPurple font-bold shadow-sm'
                            : userAnswers[index] === i
                                ? 'bg-red-100 border-red-400 text-darkPurple'
                                : 'bg-white/70 border-customBorder text-mutedText opacity-70'
                        : userAnswers[index] === i
                            ? 'bg-lightPurple border-primaryPurple text-darkPurple shadow-sm'
                            : 'bg-white/80 hover:bg-lightPurple/50 border-customBorder text-darkPurple hover:border-primaryPurple shadow-sm'
                }`;

                btn.disabled = answeredQuestions[index];

                const optionLetter = String.fromCharCode(65 + i);
                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-xl bg-lightPurple border border-customBorder flex items-center justify-center text-xs font-bold text-primaryPurple group-hover:bg-primaryPurple group-hover:text-white transition-colors">${optionLetter}</span>
                        <span>${option}</span>
                    </div>
                    ${answeredQuestions[index] && i === q.correct ? '<span class="text-successGreen font-bold">✓</span>' : ''}
                    ${answeredQuestions[index] && userAnswers[index] === i && i !== q.correct ? '<span class="text-errorRed font-bold">✗</span>' : ''}
                `;

                btn.onclick = () => selectOption(i);
                optionsContainer.appendChild(btn);
            });

            // Nav button states
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? 'Finish 🏁' : 'Next →';
        }

        function selectOption(optionIndex) {
            if (answeredQuestions[currentQuestionIndex]) return;

            const q = quizData[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = optionIndex;
            answeredQuestions[currentQuestionIndex] = true;

            if (optionIndex === q.correct) {
                score += 1;
                streak += 1;
            } else {
                streak = 0;
            }

            scoreDisplay.textContent = score;
            streakDisplay.textContent = streak;

            loadQuestion(currentQuestionIndex);
        }

        function toggleHint() {
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBtnText.textContent = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintBtnText.textContent = "Show Hint";
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
            } else {
                alert(`🎉 Quiz Completed!\nYour Final Score: ${score} / ${quizData.length}\nStreak: ${streak}`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                loadQuestion(currentQuestionIndex - 1);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                loadQuestion(val - 1);
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        function handleJumpKey(event) {
            if (event.key === 'Enter') {
                jumpToQuestion();
            }
        }

        function jumpToFirst() {
            loadQuestion(0);
        }

        function jumpToLast() {
            loadQuestion(quizData.length - 1);
        }

        function confirmReset() {
            if (confirm("Are you sure you want to reset the quiz? All your progress will be cleared.")) {
                score = 0;
                streak = 0;
                userAnswers = new Array(quizData.length).fill(null);
                answeredQuestions = new Array(quizData.length).fill(false);
                scoreDisplay.textContent = score;
                streakDisplay.textContent = streak;
                loadQuestion(0);
            }
        }

        // Keyboard Navigation Support
        document.addEventListener('keydown', (e) => {
            // Do not trigger if typing in input fields
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                return;
            }

            if (e.key === 'ArrowLeft') {
                prevQuestion();
            } else if (e.key === 'ArrowRight') {
                nextQuestion();
            }
        });

        // Initialize first question on load
        window.onload = () => {
            loadQuestion(0);
