                hint: "Single-ruler absolute system.",
                explanation: "Autocracy suppresses dissent under absolute rule."
            },
            {
                id: 99,
                badge: "Statement Analysis",
                subtopic: "Authentic",
                question: "Which documents require an 'authentic' certification when applying for official competitive examinations?",
                options: [
                    "Educational marksheets, identity proofs, and caste/category certificates.",
                    "Fictional novels and comic books.",
                    "Horoscope prediction charts.",
                    "Movie scripts and theatrical plays."
                ],
                correct: 0,
                hint: "Official exam paperwork.",
                explanation: "Option A correctly identifies official verified documents."
            },
            {
                id: 100,
                badge: "Comprehensive Review",
                subtopic: "Mastery Review",
                question: "Reflecting on all terms covered (Articulate to Autocracy), which of the following pairs correctly matches a vocabulary word with its precise definition?",
                options: [
                    "Ascetic: One who denies oneself ordinary bodily pleasures",
                    "Atheist: One who strongly believes in multiple gods",
                    "Auditor: One who forecasts future star events",
                    "Asylum: A commercial marketplace for trading stocks"
                ],
                correct: 0,
                hint: "Review ascetic definition from item 148.",
                explanation: "Ascetic correctly matches self-denial of bodily pleasures. The other options contain mismatched definitions."
            }
        ];

        // Quiz State Variables
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredQuestions = new Array(quizData.length).fill(false);

        // DOM Elements
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const scoreDisplayEl = document.getElementById('score-display');
        const totalScoreDisplayEl = document.getElementById('total-score-display');
        const progressPillEl = document.getElementById('progress-pill');
        const progressBarEl = document.getElementById('progress-bar');
        const questionBadgeEl = document.getElementById('question-badge');
        const questionCounterMetaEl = document.getElementById('question-counter-meta');
        const prevBtnEl = document.getElementById('prev-btn');
        const nextBtnEl = document.getElementById('next-btn');
        const jumpInputEl = document.getElementById('jump-input');
        const hintToggleBtnEl = document.getElementById('hint-toggle-btn');
        const hintBtnTextEl = document.getElementById('hint-btn-text');
        const hintBoxEl = document.getElementById('hint-box');
        const hintTextEl = document.getElementById('hint-text');
        const explanationBoxEl = document.getElementById('explanation-box');
        const explanationTextEl = document.getElementById('explanation-text');

        totalScoreDisplayEl.textContent = quizData.length;
        jumpInputEl.max = quizData.length;

        function loadQuestion(index) {
            if (index < 0 || index >= quizData.length) return;
            currentQuestionIndex = index;
            const q = quizData[currentQuestionIndex];

            // Update Meta & Badges (Subtopic badge omitted from UI)
            questionBadgeEl.textContent = q.badge;
            questionCounterMetaEl.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            progressPillEl.textContent = `Q ${currentQuestionIndex + 1} / ${quizData.length}`;
            
            // Progress Bar
            const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
            progressBarEl.style.width = `${progressPercent}%`;

            // Question Text
            questionTextEl.textContent = q.question;

            // Options Rendering & Shuffling persistence
            optionsContainerEl.innerHTML = '';
            
            q.options.forEach((option, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-2xl border transition-all duration-200 font-semibold text-sm sm:text-base flex items-center justify-between group `;
                
                const isSelected = userAnswers[currentQuestionIndex] === optIdx;
                const isAnswered = answeredQuestions[currentQuestionIndex];

                if (isAnswered) {
                    if (optIdx === q.correct) {
                        btn.className += `bg-emerald-50 border-emerald-300 text-emerald-900 shadow-sm`;
                    } else if (isSelected && optIdx !== q.correct) {
                        btn.className += `bg-rose-50 border-rose-300 text-rose-900 shadow-sm`;
                    } else {
                        btn.className += `bg-white/60 border-lavender-300 text-lavender-700 opacity-60`;
                    }
                    btn.disabled = true;
                } else {
                    if (isSelected) {
                        btn.className += `bg-lavender-200 border-lavender-500 text-lavender-900 shadow-md ring-2 ring-lavender-400`;
                    } else {
                        btn.className += `bg-white hover:bg-lavender-100/70 border-lavender-300 text-lavender-800 hover:border-lavender-400 shadow-sm`;
                    }
                    btn.disabled = false;
                }

                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 rounded-xl bg-lavender-100 group-hover:bg-lavender-200 text-lavender-800 flex items-center justify-center text-xs font-bold transition-colors">
                            ${String.fromCharCode(65 + optIdx)}
                        </span>
                        <span>${option}</span>
                    </div>
                    ${isAnswered && optIdx === q.correct ? '<span class="text-emerald-600 font-bold text-lg">✓</span>' : ''}
                    ${isAnswered && isSelected && optIdx !== q.correct ? '<span class="text-rose-600 font-bold text-lg">✗</span>' : ''}
                `;

                btn.onclick = () => selectOption(optIdx);
                optionsContainerEl.appendChild(btn);
            });

            // Hint Box State
            hintBoxEl.classList.add('hidden');
            hintBtnTextEl.textContent = 'Reveal Hint';
            hintTextEl.textContent = q.hint;

            // Explanation Box State
            if (answeredQuestions[currentQuestionIndex]) {
                explanationBoxEl.classList.remove('hidden');
                explanationTextEl.textContent = q.explanation;
            } else {
                explanationBoxEl.classList.add('hidden');
            }

            // Navigation Buttons State
            prevBtnEl.disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtnEl.innerHTML = `<span>Finish</span> <span>🎉</span>`;
            } else {
                nextBtnEl.innerHTML = `<span class="hidden sm:inline">Next</span> <span>→</span>`;
            }

            jumpInputEl.value = currentQuestionIndex + 1;
        }

        function selectOption(optIdx) {
            if (answeredQuestions[currentQuestionIndex]) return;

            userAnswers[currentQuestionIndex] = optIdx;
            answeredQuestions[currentQuestionIndex] = true;

            const q = quizData[currentQuestionIndex];
            if (optIdx === q.correct) {
                score++;
                scoreDisplayEl.textContent = score;
            }

            loadQuestion(currentQuestionIndex);
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
            } else {
                alert(`Quiz Completed! 🌟\nYour Final Score: ${score} / ${quizData.length}\nYou have successfully reviewed and mastered all key vocabulary terms for lifetime retention!`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                loadQuestion(currentQuestionIndex - 1);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInputEl.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                loadQuestion(val - 1);
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
                jumpInputEl.value = currentQuestionIndex + 1;
            }
        }

        function toggleHint() {
            if (hintBoxEl.classList.contains('hidden')) {
                hintBoxEl.classList.remove('hidden');
                hintBtnTextEl.textContent = 'Hide Hint';
            } else {
                hintBoxEl.classList.add('hidden');
                hintBtnTextEl.textContent = 'Reveal Hint';
            }
        }

        function confirmReset() {
            if (confirm("Are you sure you want to reset the quiz? All progress and scores will be cleared.")) {
                currentQuestionIndex = 0;
                score = 0;
                scoreDisplayEl.textContent = score;
                userAnswers = new Array(quizData.length).fill(null);
                answeredQuestions = new Array(quizData.length).fill(false);
                loadQuestion(0);
            }
        }

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                if (e.key === 'Enter' && document.activeElement === jumpInputEl) {
                    jumpToQuestion();
                }
                return;
            }

            if (e.key === 'ArrowLeft') {
                prevQuestion();
            } else if (e.key === 'ArrowRight') {
                nextQuestion();
            }
        });

        // Initial Load
        loadQuestion(0);
    </script>
</body>
</html>
