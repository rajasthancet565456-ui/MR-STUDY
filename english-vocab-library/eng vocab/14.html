                    </div>
                    ${selectedOpt !== undefined && opt.key === q.correctAnswer ? '<span class="text-green-600 font-bold text-sm">✓ Correct</span>' : ''}
                    ${selectedOpt !== undefined && opt.key === selectedOpt && selectedOpt !== q.correctAnswer ? '<span class="text-red-600 font-bold text-sm">✗ Your Choice</span>' : ''}
                `;
                optionsContainerEl.appendChild(btn);
            });

            // Explanation Box State
            if (selectedOpt !== undefined) {
                explanationBoxEl.classList.remove('hidden');
                if (selectedOpt === q.correctAnswer) {
                    explanationBoxEl.className = "p-4 rounded-2xl border bg-green-50 border-green-200 text-green-900 mb-6 transition-all duration-300";
                    explanationTitleEl.innerHTML = '<span>🎉 Brilliant! Correct Answer</span>';
                } else {
                    explanationBoxEl.className = "p-4 rounded-2xl border bg-red-50 border-red-200 text-red-900 mb-6 transition-all duration-300";
                    explanationTitleEl.innerHTML = '<span>❌ Incorrect. Learn the Correct Concept Below:</span>';
                }
                explanationTextEl.innerText = q.explanation;
            } else {
                explanationBoxEl.classList.add('hidden');
            }

            // Navigation Buttons State
            prevBtnEl.disabled = currentQuestionIndex === 0;
            bottomPrevBtnEl.disabled = currentQuestionIndex === 0;
            
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtnEl.innerText = "Finish 🏆";
                bottomNextBtnEl.innerText = "Finish 🏆";
            } else {
                nextBtnEl.innerText = "Next →";
                bottomNextBtnEl.innerText = "Next →";
            }

            updateScoreDisplay();
        }

        function selectOption(optionKey) {
            if (userAnswers[currentQuestionIndex] !== undefined) return; // already answered
            userAnswers[currentQuestionIndex] = optionKey;

            const q = quizData[currentQuestionIndex];
            if (optionKey === q.correctAnswer) {
                score++;
            }

            loadQuestion(currentQuestionIndex);
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert(`Quiz Completed! 🎉\nYour Final Score: ${score} / ${quizData.length}\nYou are now fully equipped with lifelong vocabulary mastery!`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                loadQuestion(currentQuestionIndex - 1);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function toggleHint() {
            if (hintBoxEl.classList.contains('hidden')) {
                hintBoxEl.classList.remove('hidden');
                hintToggleBtnEl.innerHTML = '<span>💡 Hide Hint</span>';
            } else {
                hintBoxEl.classList.add('hidden');
                hintToggleBtnEl.innerHTML = '<span>💡 Show Hint</span>';
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInputEl.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                loadQuestion(val - 1);
                jumpInputEl.value = '';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        function updateScoreDisplay() {
            headerScoreEl.innerText = score;
        }

        function resetQuiz() {
            if (confirm("Are you sure you want to reset your progress and restart the quiz?")) {
                userAnswers = {};
                score = 0;
                currentQuestionIndex = 0;
                loadQuestion(0);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Keyboard Navigation Support
        document.addEventListener('keydown', (e) => {
            // Do not trigger if typing in input
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                if (e.key === 'Enter') {
                    jumpToQuestion();
                }
                return;
            }

            if (e.key === 'ArrowLeft') {
                prevQuestion();
            } else if (e.key === 'ArrowRight') {
                nextQuestion();
            }
        });

        // Initialize first question on load
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
</body>
</html>
