<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master English Vocabulary Quiz - Exam Prep</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F0E6FF;
            background-image: linear-gradient(135deg, #F0E6FF 0%, #E5D5FA 100%);
            min-height: 100vh;
        }
        .quiz-card {
            background-color: #FBF7FF;
            border: 1px solid #DCCBF2;
        }
        .option-btn {
            background-color: #FBF7FF;
            border: 1px solid #DCCBF2;
            transition: all 0.2s ease-in-out;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #F0E5FF;
            border-color: #6542C8;
            transform: translateY(-1px);
        }
        /* Custom scrollbar for smooth feel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #E9DDF8;
        }
        ::-webkit-scrollbar-thumb {
            background: #7352C9;
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-[#30205D] flex flex-col min-h-screen justify-between pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-[#E5D5FA]/90 backdrop-blur-md border-b border-[#DCCBF2] shadow-sm px-4 py-3">
        <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div>
                <h1 class="text-lg md:text-xl font-bold text-[#30205D] flex items-center gap-2">
                    <span class="bg-[#6542C8] text-white p-1.5 rounded-lg text-sm shadow">✨</span>
                    Advanced Vocabulary Mastery
                </h1>
                <p class="text-xs text-[#716782]">Comprehensive Indian Competitive Exam Prep (SSC, RRB, State PCS)</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-[#FBF7FF] border border-[#DCCBF2] px-3 py-1 rounded-full text-xs font-semibold text-[#6542C8] shadow-sm">
                    Score: <span id="header-score">0</span> / <span id="header-total">100</span>
                </div>
                <div class="bg-[#FBF7FF] border border-[#DCCBF2] px-3 py-1 rounded-full text-xs font-semibold text-[#7352C9] shadow-sm">
                    Accuracy: <span id="header-accuracy">0%</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl w-full mx-auto px-4 mt-6 flex-grow">
        <!-- Quiz Card -->
        <div class="quiz-card rounded-2xl shadow-lg p-6 md:p-8 transition-all duration-300">
            
            <!-- Question Meta Header -->
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                <div class="flex items-center gap-2">
                    <span id="question-badge" class="bg-[#E9DDF8] text-[#6542C8] font-bold text-xs px-3 py-1 rounded-full uppercase tracking-wider">
                        Question 1 of 100
                    </span>
                    <span id="question-category" class="bg-[#F3A62A]/20 text-[#B8760B] font-medium text-xs px-2.5 py-1 rounded-full">
                        Synonym Analysis
                    </span>
                </div>
                <div class="text-xs text-[#716782] font-medium">
                    Exam Standard: <span class="text-[#30205D] font-bold">Tier-1 / Tier-2 Level</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-[#DDD9E8] rounded-full h-2.5 mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-[#6542C8] h-2.5 rounded-full transition-all duration-300" style="width: 1%;"></div>
            </div>

            <!-- Question Statement -->
            <div class="mb-6">
                <h2 id="question-text" class="text-lg md:text-xl font-bold text-[#30205D] leading-relaxed">
                    Loading question...
                </h2>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected option buttons -->
            </div>

            <!-- Hint Toggle & Box -->
            <div class="mb-6">
                <button id="hint-toggle" onclick="toggleHint()" class="text-xs font-semibold text-[#7352C9] hover:text-[#30205D] flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-[#6542C8] rounded px-1 py-0.5">
                    <span>💡</span> <span id="hint-btn-text">Reveal Concept Clue / Hint</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3.5 bg-[#E9DDF8]/50 border border-[#DCCBF2] rounded-xl text-xs text-[#30205D] leading-relaxed">
                    <!-- Hint text -->
                </div>
            </div>

            <!-- Explanation / Rationale Box (Revealed on choice selection) -->
            <div id="explanation-box" class="hidden p-4 rounded-xl border transition-all duration-300 mb-2">
                <div class="flex items-center gap-2 font-bold text-sm mb-1" id="explanation-header">
                    <!-- Correct/Incorrect badge -->
                </div>
                <p id="explanation-text" class="text-xs md:text-sm text-[#30205D] leading-relaxed">
                    <!-- Detailed rationale -->
                </p>
            </div>

        </div>
    </main>

    <!-- Sticky Bottom Navigation Panel -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-[#DCCBF2] shadow-lg py-3 px-4 z-40">
        <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-3">
            
            <!-- Left Controls: Prev / Next -->
            <div class="flex items-center gap-2">
                <button id="prev-btn" onclick="prevQuestion()" class="px-4 py-2 bg-[#E9DDF8] text-[#30205D] hover:bg-[#DCCBF2] font-semibold rounded-xl text-xs md:text-sm shadow-sm transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1">
                    <span>←</span> Previous
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="px-4 py-2 bg-[#6542C8] text-white hover:bg-[#30205D] font-semibold rounded-xl text-xs md:text-sm shadow-md transition flex items-center gap-1">
                    Next <span>→</span>
                </button>
            </div>

            <!-- Center Controls: Jump to Q & Reset -->
            <div class="flex items-center gap-2">
                <div class="flex items-center bg-[#FBF7FF] border border-[#DCCBF2] rounded-xl px-2.5 py-1 shadow-inner">
                    <span class="text-xs text-[#716782] mr-1.5 hidden sm:inline">Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="100" placeholder="Q#" 
                           class="w-12 text-center text-xs font-bold bg-transparent focus:outline-none text-[#30205D]"
                           onkeydown="handleJumpKey(event)">
                    <button onclick="jumpToQuestion()" class="ml-1 px-2 py-0.5 bg-[#7352C9] text-white rounded-lg text-xs hover:bg-[#6542C8] transition font-medium">
                        Go
                    </button>
                </div>
                <button onclick="confirmReset()" class="px-3 py-2 bg-red-100 text-red-700 hover:bg-red-200 font-semibold rounded-xl text-xs transition shadow-sm" title="Reset Quiz">
                    🔄 Reset
                </button>
            </div>

        </div>
    </nav>

        // Application State
        let currentQuestionIndex = 0;
        let score = 0;
        let answeredQuestions = new Array(quizData.length).fill(false);
        let userSelections = new Array(quizData.length).fill(null);
        let shuffledOptionsCache = {};

        // DOM Elements
        const questionBadge = document.getElementById("question-badge");
        const questionCategory = document.getElementById("question-category");
        const progressBar = document.getElementById("progress-bar");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const hintToggle = document.getElementById("hint-toggle");
        const hintBtnText = document.getElementById("hint-btn-text");
        const hintBox = document.getElementById("hint-box");
        const explanationBox = document.getElementById("explanation-box");
        const explanationHeader = document.getElementById("explanation-header");
        const explanationText = document.getElementById("explanation-text");
        const headerScore = document.getElementById("header-score");
        const headerTotal = document.getElementById("header-total");
        const headerAccuracy = document.getElementById("header-accuracy");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const jumpInput = document.getElementById("jump-input");

        window.onload = function() {
            headerTotal.textContent = quizData.length;
            loadQuestion(currentQuestionIndex);
            updateStats();
        };

        // Shuffle array helper (Fisher-Yates)
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function loadQuestion(index) {
            const q = quizData[index];
            questionBadge.textContent = `Question ${index + 1} of ${quizData.length}`;
            questionCategory.textContent = q.category;
            questionText.textContent = q.question;

            // Update Progress Bar
            const progressPercent = ((index + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Reset Hint
            hintBox.classList.add("hidden");
            hintBtnText.textContent = "Reveal Concept Clue / Hint";
            hintBox.textContent = q.hint;

            // Get or create shuffled options for this question
            if (!shuffledOptionsCache[index]) {
                shuffledOptionsCache[index] = shuffleArray(q.options);
            }
            const currentOptions = shuffledOptionsCache[index];

            // Render Options
            optionsContainer.innerHTML = "";
            currentOptions.forEach((opt, optIdx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn w-full text-left p-4 rounded-xl font-medium text-sm md:text-base flex items-center justify-between shadow-sm";
                btn.innerHTML = `<span>${String.fromCharCode(65 + optIdx)}. ${opt.text}</span>`;
                
                // Check if already answered
                if (answeredQuestions[index]) {
                    btn.disabled = true;
                    if (opt.correct) {
                        btn.classList.add("bg-green-100", "border-green-500", "text-green-900");
                        btn.innerHTML += `<span class="text-green-700 font-bold">✓ Correct</span>`;
                    } else if (userSelections[index] === opt.text) {
                        btn.classList.add("bg-red-100", "border-red-500", "text-red-900");
                        btn.innerHTML += `<span class="text-red-700 font-bold">✗ Your Choice</span>`;
                    } else {
                        btn.classList.add("opacity-60");
                    }
                } else {
                    btn.onclick = () => selectOption(opt, btn, currentOptions);
                }

                optionsContainer.appendChild(btn);
            });

            // Handle Explanation Box state
            if (answeredQuestions[index]) {
                showExplanation(index, userSelections[index]);
            } else {
                explanationBox.classList.add("hidden");
            }

            // Navigation Buttons State
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? "Finish Quiz 🏁" : "Next →";
        }

        function selectOption(selectedOpt, selectedBtn, currentOptions) {
            if (answeredQuestions[currentQuestionIndex]) return;

            answeredQuestions[currentQuestionIndex] = true;
            userSelections[currentQuestionIndex] = selectedOpt.text;

            const q = quizData[currentQuestionIndex];
            const isCorrect = selectedOpt.correct;

            if (isCorrect) {
                score++;
                selectedBtn.classList.add("bg-green-100", "border-green-500", "text-green-900");
                selectedBtn.innerHTML += `<span class="text-green-700 font-bold">✓ Correct</span>`;
            } else {
                selectedBtn.classList.add("bg-red-100", "border-red-500", "text-red-900");
                selectedBtn.innerHTML += `<span class="text-red-700 font-bold">✗ Incorrect</span>`;

                // Highlight correct option
                const allBtns = optionsContainer.getElementsByTagName("button");
                Array.from(allBtns).forEach((b, idx) => {
                    if (currentOptions[idx].correct) {
                        b.classList.add("bg-green-50", "border-green-400", "text-green-900");
                        b.innerHTML += `<span class="text-green-600 font-bold text-xs ml-2">(Correct Answer)</span>`;
                    }
                });
            }

            // Disable all option buttons after selection
            const allBtns = optionsContainer.getElementsByTagName("button");
            Array.from(allBtns).forEach(b => b.disabled = true);

            updateStats();
            showExplanation(currentQuestionIndex, selectedOpt.text);
        }

        function showExplanation(index, selectedText) {
            const q = quizData[index];
            const isCorrect = selectedText === q.options.find(o => o.correct).text;

            explanationBox.classList.remove("hidden");
            if (isCorrect) {
                explanationBox.className = "p-4 rounded-xl border border-green-300 bg-green-50 mb-2 transition-all duration-300";
                explanationHeader.innerHTML = `<span class="text-green-700">🎉 Correct! Excellent Mastery.</span>`;
            } else {
                explanationBox.className = "p-4 rounded-xl border border-red-300 bg-red-50 mb-2 transition-all duration-300";
                explanationHeader.innerHTML = `<span class="text-red-700">❌ Incorrect. Review the Rationale Below:</span>`;
            }
            explanationText.textContent = q.explanation;
        }

        function updateStats() {
            headerScore.textContent = score;
            const answeredCount = answeredQuestions.filter(Boolean).length;
            const accuracyVal = answeredCount > 0 ? Math.round((score / answeredCount) * 100) : 0;
            headerAccuracy.textContent = `${accuracyVal}%`;
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            } else {
                alert(`Quiz Completed! Final Score: ${score} / ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion(currentQuestionIndex);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentQuestionIndex = val - 1;
                loadQuestion(currentQuestionIndex);
                jumpInput.value = "";
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        function handleJumpKey(event) {
            if (event.key === "Enter") {
                jumpToQuestion();
            }
        }

        // Hint Toggle
        function toggleHint() {
            if (hintBox.classList.contains("hidden")) {
                hintBox.classList.remove("hidden");
                hintBtnText.textContent = "Hide Concept Clue / Hint";
            } else {
                hintBox.classList.add("hidden");
                hintBtnText.textContent = "Reveal Concept Clue / Hint";
            }
        }

        // Reset Quiz
        function confirmReset() {
            if (confirm("Are you sure you want to reset the quiz? All progress and scores will be cleared.")) {
                currentQuestionIndex = 0;
                score = 0;
                answeredQuestions = new Array(quizData.length).fill(false);
                userSelections = new Array(quizData.length).fill(null);
                shuffledOptionsCache = {};
                loadQuestion(0);
                updateStats();
                jumpInput.value = "";
            }
        }

        // Keyboard Navigation (Arrow Keys and Enter)
        document.addEventListener("keydown", function(event) {
            // Do not trigger if typing inside input
            if (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA") {
                return;
            }

            if (event.key === "ArrowLeft") {
                prevQuestion();
            } else if (event.key === "ArrowRight") {
                nextQuestion();
            }
        });
    </script>
