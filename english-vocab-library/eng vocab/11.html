        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let answeredState = new Array(questions.length).fill(false);

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const scoreDisplay = document.getElementById('score-display');
        const currentQBadge = document.getElementById('current-q-badge');
        const totalQBadge = document.getElementById('total-q-badge');
        const totalScoreDisplay = document.getElementById('total-score-display');
        const progressBar = document.getElementById('progress-bar');
        const questionNumberLabel = document.getElementById('question-number-label');
        const questionCategoryBadge = document.getElementById('question-category-badge');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const jumpInput = document.getElementById('jump-input');
        const bottomJumpInput = document.getElementById('bottom-jump-input');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        totalScoreDisplay.textContent = questions.length;
        totalQBadge.textContent = questions.length;

        function loadQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            currentIndex = index;
            const q = questions[currentIndex];

            questionNumberLabel.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
            currentQBadge.textContent = currentIndex + 1;
            questionCategoryBadge.textContent = q.category;
            questionText.textContent = q.question;

            // Progress bar update
            const progressPct = ((currentIndex + 1) / questions.length) * 100;
            progressBar.style.width = `${progressPct}%`;

            // Hint setup
            hintBox.textContent = q.hint;
            hintBox.classList.add('hidden');

            // Explanation setup
            if (answeredState[currentIndex]) {
                explanationText.textContent = q.explanation;
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            // Render Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-2xl border transition-all flex items-center justify-between font-medium text-sm md:text-base shadow-sm `;
                
                const isSelected = userAnswers[currentIndex] === i;
                const isAnswered = answeredState[currentIndex];

                if (isAnswered) {
                    if (i === q.answer) {
                        btn.className += `bg-green-50 border-green-300 text-green-900 shadow-md`;
                    } else if (isSelected) {
                        btn.className += `bg-red-50 border-red-300 text-red-900 shadow-md`;
                    } else {
                        btn.className += `bg-white/60 border-borderPurple text-darkPurple/60`;
                    }
                    btn.disabled = true;
                } else {
                    btn.className += `bg-white border-borderPurple text-darkPurple hover:bg-hoverBg hover:border-primaryPurple focus:outline-none focus:ring-2 focus:ring-primaryPurple`;
                    btn.onclick = () => selectOption(i);
                }

                btn.innerHTML = `
                    <span><strong class="mr-2 text-primaryPurple">${String.fromCharCode(65 + i)}.</strong> ${opt}</span>
                    <span class="text-xs font-bold">${isAnswered && i === q.answer ? '✅ Correct' : (isAnswered && isSelected ? '❌ Your Choice' : '')}</span>
                `;
                optionsContainer.appendChild(btn);
            });

            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === questions.length - 1 ? 'Finish 🏁' : 'Next →';
            jumpInput.value = currentIndex + 1;
            bottomJumpInput.value = currentIndex + 1;
        }

        function selectOption(selectedIndex) {
            if (answeredState[currentIndex]) return;
            userAnswers[currentIndex] = selectedIndex;
            answeredState[currentIndex] = true;

            const q = questions[currentIndex];
            if (selectedIndex === q.answer) {
                score++;
                scoreDisplay.textContent = score;
            }

            explanationText.textContent = q.explanation;
            explanationBox.classList.remove('hidden');

            loadQuestion(currentIndex);
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                alert(`Quiz Completed! 🎉 Your final score is ${score} out of ${questions.length}. Excellent work mastering your English Vocabulary!`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                loadQuestion(currentIndex - 1);
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= questions.length) {
                loadQuestion(val - 1);
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}.`);
            }
        }

        function bottomJump() {
            const val = parseInt(bottomJumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= questions.length) {
                loadQuestion(val - 1);
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}.`);
            }
        }

        function resetQuiz() {
            if (confirm("Are you sure you want to reset the quiz? All your progress will be cleared.")) {
                score = 0;
                scoreDisplay.textContent = score;
                userAnswers = new Array(questions.length).fill(null);
                answeredState = new Array(questions.length).fill(false);
                loadQuestion(0);
            }
        }

        // Keyboard Navigation Support
        document.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                if (e.key === 'Enter') {
                    if (document.activeElement === jumpInput) jumpToQuestion();
                    if (document.activeElement === bottomJumpInput) bottomJump();
                }
                return;
            }

            if (e.key === 'ArrowLeft') {
                prevQuestion();
            } else if (e.key === 'ArrowRight') {
                nextQuestion();
            }
        });

        // Initialize first question on load
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
</body>
</html>
