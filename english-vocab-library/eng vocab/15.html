        // Quiz Application State
        let currentIdx = 0;
        let score = 0;
        let selectedAnswers = new Array(quizData.length).fill(null);
        let answeredStatus = new Array(quizData.length).fill(false);

        // DOM Elements
        const questionNumberBadge = document.getElementById('question-number-badge');
        const questionCategoryBadge = document.getElementById('question-category-badge');
        const examTag = document.getElementById('exam-tag');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hintBtnText = document.getElementById('hint-btn-text');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const scoreDisplay = document.getElementById('score-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentIdx];
            
            // Header updates
            questionNumberBadge.textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
            questionCategoryBadge.textContent = q.type;
            examTag.textContent = q.exam;

            // Progress Bar update
            const progressPct = ((currentIdx + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPct}%`;
            progressText.textContent = `${Math.round(progressPct)}%`;

            // Question Text
            questionText.textContent = q.question;

            // Hint Reset
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            hintBtnText.textContent = "Show Hint / Root Word Clue";

            // Options Rendering
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-2xl text-sm sm:text-base font-medium flex items-center justify-between transition-all cursor-pointer`;
                
                const isSelected = selectedAnswers[currentIdx] === idx;
                const isAnswered = answeredStatus[currentIdx];

                if (isAnswered) {
                    btn.disabled = true;
                    if (idx === q.correct) {
                        btn.classList.add('option-correct');
                    } else if (isSelected && idx !== q.correct) {
                        btn.classList.add('option-incorrect');
                    } else {
                        btn.style.opacity = "0.6";
                    }
                } else {
                    if (isSelected) {
                        btn.classList.add('option-selected');
                    }
                }

                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-xl bg-[#E9DDF8] text-[#30205D] text-xs font-bold flex items-center justify-center shrink-0 border border-[#DCCBF2]">
                            ${String.fromCharCode(65 + idx)}
                        </span>
                        <span>${opt}</span>
                    </div>
                    ${isAnswered && idx === q.correct ? '<span class="text-xs font-bold px-2 py-1 bg-white/80 rounded-md">Correct ✓</span>' : ''}
                    ${isAnswered && isSelected && idx !== q.correct ? '<span class="text-xs font-bold px-2 py-1 bg-white/80 rounded-md">Your Answer ✗</span>' : ''}
                `;

                if (!isAnswered) {
                    btn.onclick = () => selectOption(idx);
                }

                optionsContainer.appendChild(btn);
            });

            // Explanation Box
            if (answeredStatus[currentIdx]) {
                explanationBox.classList.remove('hidden');
                const isCorrect = selectedAnswers[currentIdx] === q.correct;
                explanationBox.className = `mt-4 p-4 rounded-2xl border transition-all ${isCorrect ? 'bg-[#E6F4EA]/60 border-[#34A853]/40 text-[#137333]' : 'bg-[#FCE8E6]/60 border-[#EA4335]/40 text-[#C5221F]'}`;
                explanationBox.innerHTML = `
                    <div class="flex items-center gap-2 font-bold mb-1">
                        <span>${isCorrect ? '🎉 Correct!' : '❌ Incorrect!'}</span>
                    </div>
                    <div class="text-xs sm:text-sm leading-relaxed text-[#30205D]">
                        ${q.explanation}
                    </div>
                `;
            } else {
                explanationBox.classList.add('hidden');
            }

            // Navigation button states
            prevBtn.disabled = currentIdx === 0;
            nextBtn.textContent = currentIdx === quizData.length - 1 ? 'Finish 🏁' : 'Next →';
            scoreDisplay.textContent = `${score} / ${quizData.length}`;
            jumpInput.value = currentIdx + 1;
        }

        function selectOption(optionIndex) {
            if (answeredStatus[currentIdx]) return;

            selectedAnswers[currentIdx] = optionIndex;
            answeredStatus[currentIdx] = true;

            const q = quizData[currentIdx];
            if (optionIndex === q.correct) {
                score++;
            }

            scoreDisplay.textContent = `${score} / ${quizData.length}`;
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert(`Quiz Completed! Your Final Score: ${score} out of ${quizData.length}. You are now well-prepared for Indian competitive exams!`);
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIdx = val - 1;
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
            if (!hintBox.classList.contains('hidden')) {
                hintBtnText.textContent = "Hide Hint";
            } else {
                hintBtnText.textContent = "Show Hint / Root Word Clue";
            }
        }

        function resetQuiz() {
            if (confirm("Are you sure you want to reset the quiz? All progress and scores will be cleared.")) {
                currentIdx = 0;
                score = 0;
                selectedAnswers = new Array(quizData.length).fill(null);
                answeredStatus = new Array(quizData.length).fill(false);
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Keyboard Navigation Support
        document.addEventListener('keydown', (e) => {
            // Do not trigger if typing in input fields
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                if (e.key === 'Enter') {
                    jumpToQuestion();
                }
                return;
            }

            if (e.key === 'ArrowLeft') {
                prevQuestion();
            } else if (e.key === 'ArrowRight') {
                nextQuestion();
            }
        });

        // Initialize Quiz on load
        window.onload = () => {
            loadQuestion();
        };
    </script>
