            // --- BONFIRE (Q97 - Q100) ---
            {
                id: 97,
                word: "Bonfire",
                subtopic: "One Word Substitution",
                question: "Choose the correct one-word substitution for: 'A large open-air fire used for celebration, parties, or burning waste.'",
                options: ["Beverage", "Bonfire", "Biopsy", "Bibliography"],
                correct: 1,
                hint: "Huge outdoor fire.",
                explanation: "Correct Answer: Bonfire (N.). A large fire built outdoors for celebration or rubbish disposal."
            },
            {
                id: 98,
                word: "Bonfire",
                subtopic: "Synonym Analysis",
                question: "Which of the following is a close SYNONYM for 'Bonfire'?",
                options: ["Open-air blaze / Pyre", "Subterranean cave", "Cold beverage", "Book list"],
                correct: 0,
                hint: "Outdoor burning fire.",
                explanation: "Correct Answer: Open-air blaze / Pyre."
            },
            {
                id: 99,
                word: "Bonfire",
                subtopic: "Etymology & Roots",
                question: "Historically, what does the word 'Bonfire' derive from?",
                options: ["Bone fire (originally fires fueled by bones or public burnings)", "Books and fire", "Biological fire", "Bilingual fire"],
                correct: 0,
                hint: "Middle English bone-fire.",
                explanation: "Correct Answer: Bone fire (originally fires fueled by bones in medieval times)."
            },
            {
                id: 100,
                word: "Bonfire",
                subtopic: "Contextual MCQ",
                question: "Complete the sentence: 'During the winter solstice festival, villagers gathered around a massive ________ to sing and dance.'",
                options: ["Bonfire", "Biopsy", "Bibliography", "Bombard"],
                correct: 0,
                hint: "Huge outdoor celebration fire.",
                explanation: "Correct Answer: Bonfire."
            }
        ];

        // Quiz State Variables
        let currentIndex = 0;
        let score = 0;
        let selectedAnswers = new Array(quizData.length).fill(null); // stores selected option index
        let questionStatuses = new Array(quizData.length).fill('unanswered'); // 'correct', 'incorrect', 'unanswered'

        // DOM Elements
        const questionBadge = document.getElementById('question-badge');
        const subtopicBadge = document.getElementById('subtopic-badge');
        const statusPill = document.getElementById('status-pill');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hintToggle = document.getElementById('hint-toggle');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationTitle = document.getElementById('explanation-title');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const scoreDisplay = document.getElementById('score-display');
        const jumpInput = document.getElementById('jump-input');

        // Initialize Quiz
        function initQuiz() {
            loadQuestion(currentIndex);
            updateScoreDisplay();
        }

        // Load Question Function
        function loadQuestion(index) {
            const q = quizData[index];
            
            // Update Badges & Meta
            questionBadge.textContent = `Question ${index + 1} of ${quizData.length}`;
            subtopicBadge.textContent = q.subtopic;
            
            // Question Text
            questionText.textContent = q.question;

            // Hint
            hintText.textContent = q.hint;
            hintBox.classList.add('hidden');
            hintToggle.innerHTML = '<span>💡 Show Hint</span>';

            // Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-2xl border transition-all flex items-center justify-between font-medium text-sm sm:text-base shadow-sm`;
                
                const isSelected = selectedAnswers[index] === i;
                const isAnswered = selectedAnswers[index] !== null;

                if (isAnswered) {
                    if (i === q.correct) {
                        btn.classList.add('bg-emerald-50', 'border-emerald-400', 'text-emerald-900', 'font-semibold');
                    } else if (isSelected && i !== q.correct) {
                        btn.classList.add('bg-rose-50', 'border-rose-400', 'text-rose-900');
                    } else {
                        btn.classList.add('bg-white', 'border-borderPurple', 'text-darkPurple', 'opacity-60');
                    }
                    btn.disabled = true;
                } else {
                    btn.classList.add('bg-white', 'border-borderPurple', 'text-darkPurple', 'hover:bg-hoverPurple', 'hover:border-primaryPurple');
                    btn.onclick = () => selectOption(i);
                }

                btn.innerHTML = `
                    <span class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-full bg-lightPurple text-primaryPurple font-bold flex items-center justify-center text-xs border border-borderPurple">${String.fromCharCode(65 + i)}</span>
                        <span>${opt}</span>
                    </span>
                    ${isAnswered && i === q.correct ? '<span class="text-emerald-600 font-bold">✓ Correct</span>' : ''}
                    ${isAnswered && isSelected && i !== q.correct ? '<span class="text-rose-600 font-bold">✗ Your Answer</span>' : ''}
                `;
                optionsContainer.appendChild(btn);
            });

            // Explanation State
            if (selectedAnswers[index] !== null) {
                const isCorrect = selectedAnswers[index] === q.correct;
                explanationBox.classList.remove('hidden');
                if (isCorrect) {
                    explanationBox.className = 'mb-6 p-4 rounded-2xl border bg-emerald-50 border-emerald-200 text-emerald-900';
                    explanationTitle.innerHTML = '🎉 Correct! Excellent Exam Recall';
                } else {
                    explanationBox.className = 'mb-6 p-4 rounded-2xl border bg-rose-50 border-rose-200 text-rose-900';
                    explanationTitle.innerHTML = '❌ Incorrect. Review Rationale Below';
                }
                explanationText.textContent = q.explanation;
                statusPill.textContent = isCorrect ? 'Correct ✓' : 'Incorrect ✗';
                statusPill.className = isCorrect ? 'text-xs font-bold text-emerald-600' : 'text-xs font-bold text-rose-600';
            } else {
                explanationBox.classList.add('hidden');
                statusPill.textContent = 'Unanswered';
                statusPill.className = 'text-xs font-medium text-mutedText';
            }

            // Navigation Buttons State
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? 'Finish Quiz' : 'Next →';

            // Progress Bar & Percentage
            const progressVal = ((index + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressVal}%`;
            progressPercent.textContent = `${Math.round(progressVal)}%`;
        }

        // Option Selection Handler
        function selectOption(optionIndex) {
            const q = quizData[currentIndex];
            selectedAnswers[currentIndex] = optionIndex;
            
            const isCorrect = optionIndex === q.correct;
            if (isCorrect) {
                questionStatuses[currentIndex] = 'correct';
                score++;
            } else {
                questionStatuses[currentIndex] = 'incorrect';
            }

            updateScoreDisplay();
            loadQuestion(currentIndex);
        }

        // Update Score Display
        function updateScoreDisplay() {
            scoreDisplay.textContent = `${score} / ${quizData.length}`;
        }

        // Navigation Functions
        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert(`Quiz Completed! Your Final Score: ${score} / ${quizData.length}. You are well on your way to complete mastery!`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Jump to Question
        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion(currentIndex);
                jumpInput.value = '';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        // Hint Toggle
        function toggleHint() {
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintToggle.innerHTML = '<span>💡 Hide Hint</span>';
            } else {
                hintBox.classList.add('hidden');
                hintToggle.innerHTML = '<span>💡 Show Hint</span>';
            }
        }

        // Reset Quiz
        function confirmReset() {
            if (confirm('Are you sure you want to reset the quiz? All progress and scores will be cleared.')) {
                currentIndex = 0;
                score = 0;
                selectedAnswers = new Array(quizData.length).fill(null);
                questionStatuses = new Array(quizData.length).fill('unanswered');
                initQuiz();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Keyboard Navigation Event Listener
        document.addEventListener('keydown', (e) => {
            // Do not trigger if user is typing in inputs or textareas
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                if (e.key === 'Enter' && document.activeElement === jumpInput) {
                    jumpToQuestion();
                }
                return;
            }

            if (e.key === 'ArrowLeft') {
                prevQuestion();
            } else if (e.key === 'ArrowRight') {
                nextQuestion();
            }
        });

        // Run on page load
        window.onload = initQuiz;
    </script>
</body>
</html>
