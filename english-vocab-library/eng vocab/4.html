            // Navigation Button States
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Finish 🏁" : "Next →";

            // Update jump input placeholder
            jumpInput.value = '';
            jumpInput.placeholder = `1-${quizData.length}`;
        }

        function renderOptions(q) {
            optionsContainerEl.innerHTML = '';
            
            // To ensure correct option position varies across A, B, C, D without losing tracking,
            // we map original indices and shuffle them deterministically or per load session.
            let optionsWithIndices = q.options.map((opt, idx) => ({ text: opt, originalIdx: idx }));
            
            // Stable shuffle seeded or randomized on load
            // Using a reliable shuffle algorithm
            if (!q.shuffledIndices) {
                // Shuffle options once per question so it remains consistent during back/forth navigation
                for (let i = optionsWithIndices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithIndices[i], optionsWithIndices[j]] = [optionsWithIndices[j], optionsWithIndices[i]];
                }
                q.shuffledIndices = optionsWithIndices;
            } else {
                optionsWithIndices = q.shuffledIndices;
            }

            optionsWithIndices.forEach((item, displayIdx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-2xl font-semibold text-sm sm:text-base flex items-center justify-between cursor-pointer`;
                
                const optionLetters = ['A', 'B', 'C', 'D'];
                
                let stateClass = '';
                let isDisabled = answeredQuestions[currentQuestionIndex];

                if (isDisabled) {
                    if (item.originalIdx === q.correct) {
                        stateClass = 'option-correct';
                    } else if (userAnswers[currentQuestionIndex] === item.originalIdx) {
                        stateClass = 'option-incorrect';
                    } else {
                        stateClass = 'opacity-60';
                    }
                    btn.disabled = true;
                } else {
                    if (userAnswers[currentQuestionIndex] === item.originalIdx) {
                        stateClass = 'option-selected';
                    }
                }

                btn.className += ` ${stateClass}`;

                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 rounded-xl bg-[#E9DDF8] text-[#6542C8] flex items-center justify-center text-xs font-bold shrink-0">${optionLetters[displayIdx]}</span>
                        <span class="text-[#30205D]">${item.text}</span>
                    </div>
                `;

                if (!isDisabled) {
                    btn.onclick = () => selectOption(item.originalIdx);
                }

                optionsContainerEl.appendChild(btn);
            });
        }

        function selectOption(selectedOriginalIdx) {
            if (answeredQuestions[currentQuestionIndex]) return;

            const q = quizData[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = selectedOriginalIdx;
            answeredQuestions[currentQuestionIndex] = true;

            const isCorrect = selectedOriginalIdx === q.correct;
            if (isCorrect) {
                score++;
                scoreDisplayEl.textContent = score;
            }

            // Re-render options to show correct/incorrect colors
            renderOptions(q);

            // Show explanation
            showExplanationState(selectedOriginalIdx, q);

            // Check if all answered
            if (answeredQuestions.every(val => val === true)) {
                completionBadge.classList.remove('hidden');
            }
        }

        function showExplanationState(selectedIdx, q) {
            const isCorrect = selectedIdx === q.correct;
            explanationBox.classList.remove('hidden');
            
            if (isCorrect) {
                explanationBox.className = "mt-4 p-4 rounded-2xl border bg-emerald-50 border-emerald-200 text-emerald-900 transition-all duration-300 shadow-xs";
                explanationTitle.innerHTML = `<span>✅ Correct! Excellent grasp of the concept.</span>`;
            } else {
                explanationBox.className = "mt-4 p-4 rounded-2xl border bg-rose-50 border-rose-200 text-rose-900 transition-all duration-300 shadow-xs";
                explanationTitle.innerHTML = `<span>❌ Incorrect. Review the rationale below:</span>`;
            }
            explanationTextEl.textContent = q.explanation;
        }

        function toggleHint() {
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBtnText.textContent = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintBtnText.textContent = "Show Hint";
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert(`Quiz Completed! 🎉 Your Final Score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                loadQuestion(currentQuestionIndex - 1);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                loadQuestion(val - 1);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        function confirmReset() {
            if (confirm("Are you sure you want to reset the quiz? All progress and answers will be cleared.")) {
                score = 0;
                scoreDisplayEl.textContent = score;
                userAnswers = new Array(quizData.length).fill(null);
                answeredQuestions = new Array(quizData.length).fill(false);
                completionBadge.classList.add('hidden');
                quizData.forEach(q => delete q.shuffledIndices);
                loadQuestion(0);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Keyboard Navigation (Left/Right arrows)
        document.addEventListener('keydown', (e) => {
            // Ignore if typing inside input fields
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

            if (e.key === 'ArrowLeft') {
                prevQuestion();
            } else if (e.key === 'ArrowRight') {
                nextQuestion();
            }
        });

        // Initial Load
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
</body>
</html>
