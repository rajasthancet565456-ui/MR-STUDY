<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary Mastery Quiz - SSC & Competitive Exams</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F0E6FF;
            background-image: radial-gradient(circle at 10% 20%, #E9DDF8 0%, #F0E6FF 90%);
        }
        /* Custom scrollbar and smooth transitions */
        * {
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
        }
    </style>
</head>
<body class="min-h-screen text-[#30205D] flex flex-col justify-between selection:bg-[#E9DDF8] selection:text-[#6542C8]">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-50 bg-[#E5D5FA]/90 backdrop-blur-md border-b border-[#DCCBF2] px-4 py-3 shadow-sm">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-[#6542C8] text-white p-2 rounded-xl shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-[#30205D] leading-tight">Vocab Mastery Suite</h1>
                    <p class="text-xs text-[#716782]">Advanced One-Word Substitutions & Synonyms (SSC / RRB Level)</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 flex-wrap justify-center">
                <div class="bg-[#FBF7FF] border border-[#DCCBF2] px-3 py-1.5 rounded-full text-xs font-semibold shadow-inner flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Score: <span id="score-display" class="text-[#6542C8] font-bold">0</span> / <span id="total-score-display">0</span>
                </div>
                <div class="bg-[#FBF7FF] border border-[#DCCBF2] px-3 py-1.5 rounded-full text-xs font-semibold shadow-inner">
                    Accuracy: <span id="accuracy-display" class="text-[#6542C8] font-bold">0%</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl w-full mx-auto px-4 py-6 flex-grow flex flex-col justify-center">
        
        <!-- Quiz Card -->
        <div id="quiz-card" class="bg-[#FBF7FF] border border-[#DCCBF2] rounded-3xl shadow-xl p-6 sm:p-8 relative overflow-hidden">
            
            <!-- Question Meta Header -->
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                <div class="flex items-center gap-2">
                    <span id="question-number-badge" class="bg-[#E9DDF8] text-[#6542C8] text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Question 1 of 80</span>
                    <span id="question-category-badge" class="bg-purple-100 text-[#7352C9] text-xs font-medium px-2.5 py-0.5 rounded-full">Vocabulary & OWS</span>
                </div>
                <span id="difficulty-badge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800">Exam Level</span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-[#DDD9E8] rounded-full h-2 mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-[#6542C8] h-2 rounded-full transition-all duration-300" style="width: 1%;"></div>
            </div>

            <!-- Question Text -->
            <div class="mb-6">
                <h2 id="question-text" class="text-lg sm:text-xl font-bold text-[#30205D] leading-snug">
                    Loading question...
                </h2>
            </div>

            <!-- Answer Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected options -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button id="hint-toggle-btn" onclick="toggleHint()" class="text-xs font-semibold text-[#7352C9] hover:text-[#6542C8] flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-[#6542C8] rounded px-1 py-0.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                    <span>💡 Toggle Hint</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-purple-50 border border-purple-200 rounded-xl text-xs text-[#52446e] leading-relaxed">
                    <!-- Hint text -->
                </div>
            </div>

            <!-- Explanation / Rationale Box (Revealed on selection) -->
            <div id="explanation-box" class="hidden p-4 rounded-2xl border text-sm transition-all duration-300 mb-2">
                <div class="flex items-center gap-2 font-bold mb-1" id="explanation-header">
                    <!-- Correct/Incorrect icon & title -->
                </div>
                <p id="explanation-text" class="text-xs sm:text-sm text-[#4A3D66] leading-relaxed">
                    <!-- Detailed Rationale -->
                </p>
            </div>

            <!-- Navigation Controls inside Card for mobile convenience -->
            <div class="flex items-center justify-between pt-4 border-t border-[#DCCBF2] mt-6">
                <button id="prev-btn" onclick="prevQuestion()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-[#E9DDF8] text-[#30205D] hover:d-opacity-90 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1 shadow-sm">
                    ← Previous
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="px-5 py-2 rounded-xl text-xs font-semibold bg-[#6542C8] text-white hover:bg-[#5333a8] flex items-center gap-1 shadow-md">
                    Next →
                </button>
            </div>

        </div>

    </main>

    <!-- Sticky Bottom Navigation Panel -->
    <nav class="sticky bottom-0 z-40 bg-[#FBF7FF]/95 backdrop-blur-md border-t border-[#DCCBF2] px-4 py-3 shadow-lg">
        <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-3">
            
            <!-- Jump to Question -->
            <div class="flex items-center gap-2">
                <label for="jump-input" class="text-xs font-semibold text-[#716782] hidden sm:inline">Jump to Q:</label>
                <div class="flex items-center">
                    <input type="number" id="jump-input" min="1" max="80" placeholder="Q#" 
                        class="w-16 px-2.5 py-1.5 text-xs bg-white border border-[#DCCBF2] rounded-l-xl focus:outline-none focus:ring-2 focus:ring-[#6542C8] text-center font-medium"
                        onkeydown="if(event.key==='Enter') jumpToQuestionInput()">
                    <button onclick="jumpToQuestionInput()" class="bg-[#6542C8] text-white px-3 py-1.5 text-xs font-semibold rounded-r-xl hover:bg-[#5333a8] transition-colors">
                        Go
                    </button>
                </div>
            </div>

            <!-- Center quick status / navigation pills -->
            <div class="hidden md:flex items-center gap-1 text-xs text-[#716782] font-medium">
                <span>Use <kbd class="px-1.5 py-0.5 bg-white border border-purple-200 rounded text-[10px]">←</kbd> <kbd class="px-1.5 py-0.5 bg-white border border-purple-200 rounded text-[10px]">→</kbd> arrows to navigate</span>
            </div>

            <!-- Reset & Finish Controls -->
            <div class="flex items-center gap-2">
                <button onclick="resetQuizWithConfirmation()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-rose-100 text-rose-700 hover:bg-rose-200 transition-colors flex items-center gap-1 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Reset Quiz
                </button>
            </div>

        </div>
    </nav>

    <!-- Custom Modal for Alerts/Confirmations -->
    <div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#FBF7FF] border border-[#DCCBF2] rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center">
            <h3 id="modal-title" class="text-base font-bold text-[#30205D] mb-2">Confirmation</h3>
            <p id="modal-message" class="text-xs text-[#716782] mb-6">Are you sure you want to reset your progress?</p>
            <div class="flex items-center justify-center gap-3">
                <button id="modal-cancel-btn" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300">Cancel</button>

            </div>
        </div>
    </div>

                ],

                explanation: "Correct Answer: Both 1 and 2 are correct. Ambiguous instructions create confusion, and ambiguity is the corresponding noun."

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = {}; // Stores { questionIndex: selectedOptionIndex }
        let shuffledOptionsMap = {}; // Stores shuffled options order per question index

        // Initialize Quiz
        function initQuiz() {
            document.getElementById('total-score-display').textContent = quizData.length;
            document.getElementById('jump-input').max = quizData.length;
            
            // Pre-shuffle options for each question so order remains consistent during session navigation
            quizData.forEach((q, qIdx) => {
                let originalIndices = q.options.map((_, i) => i);
                // Fisher-Yates shuffle
                for (let i = originalIndices.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [originalIndices[i], originalIndices[j]] = [originalIndices[j], originalIndices[i]];
                }
                shuffledOptionsMap[qIdx] = originalIndices;
            });

            loadQuestion();
        }

        // Load Question into DOM
        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            
            // Update badges & progress
            document.getElementById('question-number-badge').textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            document.getElementById('question-category-badge').textContent = q.category;
            document.getElementById('difficulty-badge').textContent = q.difficulty;
            
            const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Question Text
            document.getElementById('question-text').textContent = q.question;

            // Hint
            const hintBox = document.getElementById('hint-box');
            hintBox.textContent = q.hint;
            hintBox.classList.add('hidden');

            // Render Shuffled Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const shuffledIndices = shuffledOptionsMap[currentQuestionIndex];
            const selectedOpt = userAnswers[currentQuestionIndex];

            shuffledIndices.forEach((originalOptIdx, displayIdx) => {
                const opt = q.options[originalOptIdx];
                const optionLetter = String.fromCharCode(65 + displayIdx); // A, B, C, D
                
                const isSelected = selectedOpt === originalOptIdx;
                let btnClasses = "w-full text-left p-4 rounded-2xl border transition-all duration-200 flex items-center justify-between text-sm sm:text-base font-medium shadow-sm ";
                
                if (selectedOpt !== undefined) {
                    // Answer already submitted for this question
                    if (opt.correct) {
                        btnClasses += "bg-emerald-50 border-emerald-300 text-emerald-900 shadow-emerald-100 ";
                    } else if (isSelected && !opt.correct) {
                        btnClasses += "bg-rose-50 border-rose-300 text-rose-900 shadow-rose-100 ";
                    } else {
                        btnClasses += "bg-[#FBF7FF] border-[#DCCBF2] text-[#30205D] opacity-60 ";
                    }
                } else {
                    btnClasses += "bg-[#FBF7FF] hover:bg-purple-50/70 border-[#DCCBF2] text-[#30205D] hover:border-[#7352C9]";
                }

                const button = document.createElement('button');
                button.className = btnClasses;
                button.disabled = selectedOpt !== undefined;
                button.onclick = () => selectOption(originalOptIdx);

                button.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-xl bg-[#E9DDF8] text-[#6542C8] flex items-center justify-center text-xs font-bold shrink-0">${optionLetter}</span>
                        <span>${opt.text}</span>
                    </div>
                    ${selectedOpt !== undefined && opt.correct ? '<span class="text-emerald-600 font-bold text-xs bg-emerald-100 px-2 py-1 rounded-lg">Correct ✓</span>' : ''}
                    ${selectedOpt !== undefined && isSelected && !opt.correct ? '<span class="text-rose-600 font-bold text-xs bg-rose-100 px-2 py-1 rounded-lg">Your Choice ✗</span>' : ''}
                `;
                optionsContainer.appendChild(button);
            });

            // Explanation Box
            const explanationBox = document.getElementById('explanation-box');
            if (selectedOpt !== undefined) {
                explanationBox.classList.remove('hidden');
                const isCorrect = q.options[selectedOpt].correct;
                const headerEl = document.getElementById('explanation-header');
                const textEl = document.getElementById('explanation-text');

                if (isCorrect) {
                    explanationBox.className = "p-4 rounded-2xl border border-emerald-200 bg-emerald-50/80 text-sm mb-2";
                    headerEl.innerHTML = '<span class="text-emerald-700 flex items-center gap-1.5"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg> Correct Answer!</span>';
                } else {
                    explanationBox.className = "p-4 rounded-2xl border border-rose-200 bg-rose-50/80 text-sm mb-2";
                    headerEl.innerHTML = '<span class="text-rose-700 flex items-center gap-1.5"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg> Incorrect Choice</span>';
                }
                textEl.textContent = q.explanation;
            } else {
                explanationBox.classList.add('hidden');
            }

            // Update Navigation buttons
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.textContent = "Finish Quiz 🎉";
            } else {
                nextBtn.textContent = "Next →";
            }
        }

        // Handle Option Selection
        function selectOption(optionIndex) {
            if (userAnswers[currentQuestionIndex] !== undefined) return; // Already answered

            userAnswers[currentQuestionIndex] = optionIndex;
            const q = quizData[currentQuestionIndex];

            if (q.options[optionIndex].correct) {
                score++;
            }

            updateScoreUI();
            loadQuestion(); // Reload to show correct/incorrect states and explanations
        }

        // Update Score and Accuracy display
        function updateScoreUI() {
            document.getElementById('score-display').textContent = score;
            const answeredCount = Object.keys(userAnswers).length;
            if (answeredCount > 0) {
                const accuracy = Math.round((score / answeredCount) * 100);
                document.getElementById('accuracy-display').textContent = `${accuracy}%`;
            } else {
                document.getElementById('accuracy-display').textContent = `0%`;
            }
        }

        // Navigation Functions
        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showCompletionModal();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestionInput() {
            const input = document.getElementById('jump-input');
            const qNum = parseInt(input.value);
            if (!isNaN(qNum) && qNum >= 1 && qNum <= quizData.length) {
                currentQuestionIndex = qNum - 1;
                loadQuestion();
                input.value = '';
            } else {
                showModal("Invalid Question", `Please enter a valid question number between 1 and ${quizData.length}.`, false);
            }
        }

        // Hint Toggle
        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        // Reset Quiz with Confirmation
        function resetQuizWithConfirmation() {
            showModal("Reset Quiz", "Are you sure you want to restart the quiz? All progress and answers will be cleared.", true, () => {
                score = 0;
                userAnswers = {};
                currentQuestionIndex = 0;
                updateScoreUI();
                initQuiz();
                closeModal();
            });
        }

        // Completion Modal
        function showCompletionModal() {
            const percentage = Math.round((score / quizData.length) * 100);
            let message = `You have completed the entire vocabulary mastery suite!<br><br>Final Score: <b>${score} / ${quizData.length}</b> (${percentage}%)`;
            if (percentage >= 85) {
                message += "<br><br>🌟 Outstanding mastery! You are fully prepared for competitive English vocabulary exams.";
            } else {
                message += "<br><br>💡 Good effort! Review the explanations and retry to achieve 100% mastery.";
            }
            showModal("Quiz Completed!", message, true, () => {
                score = 0;
                userAnswers = {};
                currentQuestionIndex = 0;
                updateScoreUI();
                initQuiz();
                closeModal();
            }, "Retake Quiz");
        }

        // Modal Helpers
        function showModal(title, message, showConfirm = true, onConfirm = null, confirmText = "Confirm") {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').innerHTML = message;
            
            const confirmBtn = document.getElementById('modal-confirm-btn');
            confirmBtn.textContent = confirmText;
            if (onConfirm) {
                confirmBtn.onclick = onConfirm;
            } else {
                confirmBtn.onclick = closeModal;
            }
            
            const cancelBtn = document.getElementById('modal-cancel-btn');
            cancelBtn.style.display = showConfirm ? 'block' : 'none';

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        // Keyboard Navigation (Arrow Keys & Enter)
        document.addEventListener('keydown', (e) => {
            // Ignore if typing inside input fields (except jump input enter)
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                return;
            }

            if (e.key === 'ArrowLeft') {
                prevQuestion();
            } else if (e.key === 'ArrowRight') {
                nextQuestion();
            }
        });

        // Window onload initialization
        window.onload = function() {
            initQuiz();
        };
    </script>
