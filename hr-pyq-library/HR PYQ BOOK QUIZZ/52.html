<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
        }
    </style>
<style id="cosmic-readable-quiz-theme">

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-emerald-400">Haryana GK Master Quiz</h1>
                <p class="text-xs text-slate-400">Bilingual (English & Hindi) | Pages 1 & 2 Exam Prep</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-slate-700 px-3 py-1.5 rounded-lg text-sm">
                    Score: <span id="score-display" class="font-bold text-emerald-400">0</span> / <span id="total-questions-top">90</span>
                </div>
                <div class="bg-slate-700 px-3 py-1.5 rounded-lg text-sm">
                    Q: <span id="current-q-num" class="font-bold text-sky-400">1</span> / <span id="total-q-num">90</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 my-auto">
        <!-- Progress Bar -->
        <div class="w-full bg-slate-800 rounded-full h-2.5 mb-6 overflow-hidden">
            <div id="progress-bar" class="bg-emerald-500 h-2.5 transition-all duration-300" style="width: 1.11%"></div>
        </div>

        <!-- Quiz Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl relative">
            
            <!-- Question Meta / Tag -->
            <div class="flex justify-between items-center mb-4">
                <span id="question-tag" class="bg-emerald-900/60 text-emerald-300 text-xs font-semibold px-2.5 py-1 rounded-full border border-emerald-700">Page 1 • Factual MCQ</span>
                <button id="hint-toggle-btn" onclick="toggleHint()" class="text-xs text-amber-400 hover:text-amber-300 flex items-center gap-1 bg-amber-950/40 border border-amber-800/60 px-2.5 py-1 rounded-lg transition-colors">
                    💡 Show Hint
                </button>
            </div>

            <!-- Hint Box (Hidden by default) -->
            <div id="hint-box" class="hidden mb-4 p-3 bg-amber-950/30 border border-amber-700/50 text-amber-200 text-xs rounded-xl">
                <strong>Hint:</strong> <span id="hint-text"></span>
            </div>

            <!-- Question Text (Bilingual) -->
            <div class="mb-6 space-y-2">
                <h2 id="question-hi" class="text-lg font-semibold text-slate-100 leading-relaxed">प्रश्न लोड हो रहा है...</h2>
                <h3 id="question-en" class="text-sm font-medium text-slate-400 italic">Question loading...</h3>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected options -->
            </div>

            <!-- Explanation Box (Revealed after selection) -->
            <div id="explanation-box" class="hidden mb-6 p-4 rounded-xl border text-sm transition-all">
                <div class="font-semibold mb-1 flex items-center gap-2" id="explanation-header"></div>
                <p id="explanation-text" class="text-slate-300 text-xs leading-relaxed"></p>
            </div>

            <!-- Controls / Navigation Bar -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-700">
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <button onclick="prevQuestion()" class="flex-1 sm:flex-none px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium rounded-xl transition-colors">
                        ← Previous
                    </button>
                    <button onclick="nextQuestion()" class="flex-1 sm:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium rounded-xl transition-colors">
                        Next →
                    </button>
                </div>

                <!-- Jump to Question -->
                <div class="flex items-center gap-2 text-xs w-full sm:w-auto justify-end">
                    <span class="text-slate-400">Jump to Q:</span>
                    <input type="number" id="jump-input" min="1" max="90" class="w-16 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-center text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="1-90">
                    <button onclick="jumpToQuestion()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg transition-colors font-medium">Go</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-400">
        Haryana GK Exam Preparation Suite &bull; Designed for SSC, RRB, HSSC & State Exams
    </footer>

        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        function loadQuestion() {
            const q = quizData[currentIndex];
            
            // Update metadata
            document.getElementById('question-tag').innerText = `${q.page} • ${q.type}`;
            document.getElementById('current-q-num').innerText = currentIndex + 1;
            document.getElementById('total-q-num').innerText = quizData.length;
            document.getElementById('total-questions-top').innerText = quizData.length;

            // Update progress bar
            const progressPercent = ((currentIndex + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Update Question text
            document.getElementById('question-hi').innerText = `${currentIndex + 1}. ${q.hi}`;
            document.getElementById('question-en').innerText = q.en;

            // Update Hint
            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('hint-box').classList.add('hidden');

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/50 hover:bg-slate-700/50 text-slate-200 text-sm transition-all flex items-center justify-between group";
                
                const isAnswered = userAnswers[currentIndex] !== null;
                const selectedOpt = userAnswers[currentIndex];

                if (isAnswered) {
                    btn.disabled = true;
                    if (idx === q.answer) {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-emerald-500 bg-emerald-950/40 text-emerald-200 text-sm flex items-center justify-between";
                    } else if (selectedOpt === idx) {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-rose-500 bg-rose-950/40 text-rose-200 text-sm flex items-center justify-between";
                    }
                }

                btn.innerHTML = `
                    <span><span class="font-semibold mr-2 text-slate-400 group-hover:text-emerald-400">${String.fromCharCode(65 + idx)}.</span> ${opt}</span>
                `;

                if (!isAnswered) {
                    btn.onclick = () => selectOption(idx);
                }

                optionsContainer.appendChild(btn);
            });

            // Handle Explanation Box
            const explanationBox = document.getElementById('explanation-box');
            if (userAnswers[currentIndex] !== null) {
                showExplanation(q, userAnswers[currentIndex] === q.answer);
            } else {
                explanationBox.classList.add('hidden');
            }
        }

        function selectOption(selectedIdx) {
            const q = quizData[currentIndex];
            userAnswers[currentIndex] = selectedIdx;

            const isCorrect = selectedIdx === q.answer;
            if (isCorrect) {
                score++;
                document.getElementById('score-display').innerText = score;
            }

            loadQuestion();
        }

        function showExplanation(q, isCorrect) {
            const box = document.getElementById('explanation-box');
            const header = document.getElementById('explanation-header');
            const text = document.getElementById('explanation-text');

            box.classList.remove('hidden');
            if (isCorrect) {
                box.className = "mb-6 p-4 rounded-xl border border-emerald-600/50 bg-emerald-950/30 text-emerald-200 text-sm transition-all";
                header.innerHTML = "✅ Correct Answer!";
            } else {
                box.className = "mb-6 p-4 rounded-xl border border-rose-600/50 bg-rose-950/30 text-rose-200 text-sm transition-all";
                header.innerHTML = `❌ Incorrect. Correct Option was: <span class="text-emerald-400 font-bold">${String.fromCharCode(65 + q.answer)}</span>`;
            }
            text.innerText = q.explanation;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const target = parseInt(input.value) - 1;
            if (!isNaN(target) && target >= 0 && target < quizData.length) {
                currentIndex = target;
                loadQuestion();
                input.value = '';
            } else {
                alert("Please enter a valid question number between 1 and 90.");
            }
        }

        // Initialize Quiz on load
        window.onload = loadQuestion;
    </script>
