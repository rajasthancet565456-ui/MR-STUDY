        // Dynamic Option Shuffling Algorithm (Fisher-Yates) for unpredictability
        let quizData = rawQuizData.map((q) => {
            let shuffledOptions = [...q.options];
            let correctOption = q.options[q.correct];
            
            for (let i = shuffledOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
            }
            
            let newCorrectIndex = shuffledOptions.findIndex(opt => opt.hi === correctOption.hi);
            
            return {
                ...q,
                options: shuffledOptions,
                correct: newCorrectIndex,
                userAnswer: null
            };
        });

        // App State Variables
        let currentIndex = 0;
        let score = 0;

        // Element References
        const questionHiEl = document.getElementById('question-hi');
        const questionEnEl = document.getElementById('question-en');
        const optionsContainer = document.getElementById('options-container');
        const questionBadge = document.getElementById('question-badge');
        const pageSourceBadge = document.getElementById('page-source-badge');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');

        const hintToggleBtn = document.getElementById('hint-toggle-btn');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationHi = document.getElementById('explanation-hi');
        const explanationEn = document.getElementById('explanation-en');

        // Function to Render Current Question
        function renderQuestion() {
            const currentQ = quizData[currentIndex];

            // Badges & Progress
            questionBadge.innerText = `Question ${currentIndex + 1} of ${quizData.length}`;
            pageSourceBadge.innerText = `${currentQ.page} (#${currentQ.id})`;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            scoreDisplay.innerText = `${score} / ${quizData.length}`;

            // Set Statements
            questionHiEl.innerText = `${currentIndex + 1}. ${currentQ.hi}`;
            questionEnEl.innerText = currentQ.en;

            // Reset/Set Hint Box
            hintBox.classList.add('hidden');
            hintBox.innerText = `💡 Hint: ${currentQ.hint}`;
            
            if (currentQ.userAnswer !== null) {
                showExplanation();
            } else {
                explanationBox.classList.add('hidden');
            }

            // Options Rendering
            optionsContainer.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];

            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-lg border text-sm font-medium transition-all flex items-center justify-between shadow-sm ";
                
                if (currentQ.userAnswer === null) {
                    btn.className += "border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 text-slate-700 bg-white cursor-pointer";
                    btn.onclick = () => handleAnswer(idx);
                } else {
                    btn.disabled = true;
                    if (idx === currentQ.correct) {
                        btn.className += "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
                    } else if (idx === currentQ.userAnswer) {
                        btn.className += "border-rose-500 bg-rose-50 text-rose-900";
                    } else {
                        btn.className += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
                    }
                }

                btn.innerHTML = `
                    <div class="flex items-start gap-3">
                        <span class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-xs font-bold shrink-0 text-slate-600 mt-0.5 border border-slate-200">${labels[idx]}</span>
                        <div>
                            <div class="text-slate-900 font-semibold">${opt.hi}</div>
                            <div class="text-xs text-slate-500 font-normal italic">${opt.en}</div>
                        </div>
                    </div>
                    ${currentQ.userAnswer !== null && idx === currentQ.correct ? '<span class="text-emerald-600 text-base font-bold">✓</span>' : ''}
                    ${currentQ.userAnswer !== null && idx === currentQ.userAnswer && idx !== currentQ.correct ? '<span class="text-rose-600 text-base font-bold">✕</span>' : ''}
                `;
                optionsContainer.appendChild(btn);
            });

            // Control Buttons State
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === quizData.length - 1;
        }

        // Handle Option Click
        function handleAnswer(selectedIndex) {
            const currentQ = quizData[currentIndex];
            currentQ.userAnswer = selectedIndex;

            if (selectedIndex === currentQ.correct) {
                score++;
            }

            showExplanation();
            renderQuestion();
        }

        function showExplanation() {
            const currentQ = quizData[currentIndex];
            explanationHi.innerText = currentQ.exp_hi;
            explanationEn.innerText = currentQ.exp_en;
            explanationBox.classList.remove('hidden');
        }

        // Navigation Handlers
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        });

        jumpBtn.addEventListener('click', () => {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                renderQuestion();
            }
        });

        hintToggleBtn.addEventListener('click', () => {
            hintBox.classList.toggle('hidden');
        });

        // Load Quiz
        renderQuestion();
    </script>
