        let filteredQuestions = [...questionsData];
        let currentIndex = 0;
        let score = 0;
        let answeredQuestions = new Set();
        let userAnswers = {};

        const questionEnEl = document.getElementById('question-en');
        const questionHiEl = document.getElementById('question-hi');
        const optionsContainer = document.getElementById('options-container');
        const counterEl = document.getElementById('question-counter');
        const sourceBadge = document.getElementById('source-page-badge');
        const scoreDisplay = document.getElementById('score-display');
        const totalAnsweredDisplay = document.getElementById('total-answered');
        const progressBar = document.getElementById('progress-bar');
        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const jumpInput = document.getElementById('jump-input');
        const pageFilter = document.getElementById('page-filter');

        function initQuiz() {
            filterQuestions();
            loadQuestion();
        }

        pageFilter.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'all') {
                filteredQuestions = [...questionsData];
            } else {
                filteredQuestions = questionsData.filter(q => q.page == val);
            }
            currentIndex = 0;
            loadQuestion();
        });

        function loadQuestion() {
            if (filteredQuestions.length === 0) return;
            const q = filteredQuestions[currentIndex];

            counterEl.textContent = `Question ${currentIndex + 1} of ${filteredQuestions.length}`;
            sourceBadge.textContent = `Page ${q.page}`;
            jumpInput.value = currentIndex + 1;
            jumpInput.max = filteredQuestions.length;

            questionEnEl.textContent = q.en;
            questionHiEl.textContent = q.hi;

            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            explanationBox.classList.add('hidden');

            // Render Options
            optionsContainer.innerHTML = '';
            
            let optionObjs = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            
            optionObjs.forEach((optObj, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-950/60 hover:bg-slate-800 transition-all text-sm sm:text-base font-medium flex items-center justify-between group";
                
                const span = document.createElement('span');
                span.textContent = optObj.text;
                btn.appendChild(span);

                const indicator = document.createElement('span');
                indicator.className = "w-6 h-6 rounded-full border border-slate-700 flex items-center justify-center text-xs text-slate-500 group-hover:border-slate-500";
                indicator.textContent = String.fromCharCode(65 + idx);
                btn.appendChild(indicator);

                const isAnswered = userAnswers[currentIndex] !== undefined;
                if (isAnswered) {
                    btn.disabled = true;
                    const selectedOpt = userAnswers[currentIndex];
                    if (optObj.originalIndex === q.answer) {
                        btn.classList.add('bg-emerald-950/40', 'border-emerald-600', 'text-emerald-200');
                        indicator.className = "w-6 h-6 rounded-full bg-emerald-600 text-slate-950 font-bold flex items-center justify-center text-xs";
                    } else if (selectedOpt === optObj.originalIndex) {
                        btn.classList.add('bg-rose-950/40', 'border-rose-600', 'text-rose-200');
                        indicator.className = "w-6 h-6 rounded-full bg-rose-600 text-white font-bold flex items-center justify-center text-xs";
                    } else {
                        btn.classList.add('opacity-50');
                    }
                    explanationBox.classList.remove('hidden');
                    explanationText.textContent = q.explanation;
                } else {
                    btn.onclick = () => selectOption(optObj.originalIndex, q.answer, q.explanation);
                }

                optionsContainer.appendChild(btn);
            });

            updateProgress();
        }

        function selectOption(selectedIndex, correctIndex, explanation) {
            if (userAnswers[currentIndex] !== undefined) return;

            userAnswers[currentIndex] = selectedIndex;
            answeredQuestions.add(currentIndex);

            if (selectedIndex === correctIndex) {
                score++;
            }

            scoreDisplay.textContent = score;
            totalAnsweredDisplay.textContent = answeredQuestions.size;

            loadQuestion();
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < filteredQuestions.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            let num = parseInt(val) - 1;
            if (num >= 0 && num < filteredQuestions.length) {
                currentIndex = num;
                loadQuestion();
            }
        }

        function updateProgress() {
            const pct = ((currentIndex + 1) / filteredQuestions.length) * 100;
            progressBar.style.width = `${pct}%`;
        }

        window.onload = initQuiz;
    </script>
