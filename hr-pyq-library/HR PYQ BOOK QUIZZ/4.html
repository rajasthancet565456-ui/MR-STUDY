        // State variables
        let currentQuestionIdx = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let activePageFilter = 0; // 0 = all, 10 = page 10, 11 = page 11

        // Initialize Application
        window.onload = function() {
            renderGrid();
            loadQuestion(0);
            updateScoreDisplay();
        };

        // Render Sidebar Navigation Grid
        function renderGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                if (activePageFilter !== 0 && q.page !== activePageFilter) return;

                const btn = document.createElement('button');
                btn.innerText = index + 1;
                btn.className = `h-8 w-8 text-xs font-semibold rounded-md border flex items-center justify-center transition-all ${getGridBtnStyle(index)}`;
                btn.onclick = () => loadQuestion(index);
                container.appendChild(btn);
            });
        }

        function getGridBtnStyle(index) {
            if (index === currentQuestionIdx) {
                return "border-indigo-600 bg-indigo-600 text-white shadow-sm ring-2 ring-indigo-200";
            }
            if (userAnswers[index] !== null) {
                return userAnswers[index].isCorrect 
                    ? "border-green-500 bg-green-50 text-green-700" 
                    : "border-red-400 bg-red-50 text-red-600";
            }
            return "border-slate-200 bg-white text-slate-700 hover:bg-slate-100";
        }

        // Filter Page View
        function filterPage(pageNum) {
            activePageFilter = pageNum;
            document.getElementById('btn-p10').className = pageNum === 10 
                ? "flex-1 py-1 text-xs font-semibold rounded bg-indigo-600 text-white" 
                : "flex-1 py-1 text-xs font-semibold rounded bg-slate-200 text-slate-700";
            document.getElementById('btn-p11').className = pageNum === 11 
                ? "flex-1 py-1 text-xs font-semibold rounded bg-indigo-600 text-white" 
                : "flex-1 py-1 text-xs font-semibold rounded bg-slate-200 text-slate-700";
            
            document.getElementById('page-indicator').innerText = `Page ${pageNum}`;
            
            // Jump to first question of page
            const targetIdx = questions.findIndex(q => q.page === pageNum);
            if (targetIdx !== -1) loadQuestion(targetIdx);
            renderGrid();
        }

        // Load Question into UI
        function loadQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            currentQuestionIdx = index;
            const q = questions[index];

            // Reset UI states
            document.getElementById('q-number').innerText = `Question ${String(index + 1).padStart(2, '0')} of ${questions.length}`;
            document.getElementById('q-source').innerText = `Source Ref: ${q.source}`;
            document.getElementById('q-text').innerText = q.question;
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-box').innerText = q.hint;
            document.getElementById('explanation-box').classList.add('hidden');

            // Render Options (Dynamically shuffled presentation reference)
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const optionLabels = ['A', 'B', 'C', 'D'];

            q.options.forEach((optText, optIdx) => {
                const optBtn = document.createElement('button');
                optBtn.className = `w-full text-left p-3.5 rounded-lg border text-sm transition-all flex items-start gap-3 ${getOptionStyle(index, optIdx)}`;
                optBtn.onclick = () => selectAnswer(index, optIdx);
                
                optBtn.innerHTML = `
                    <span class="font-bold text-xs px-2 py-0.5 rounded border bg-slate-50 text-slate-600 border-slate-200">${optionLabels[optIdx]}</span>
                    <span class="flex-grow">${optText}</span>
                `;
                optionsContainer.appendChild(optBtn);
            });

            // Show explanation if already answered
            if (userAnswers[index] !== null) {
                const expBox = document.getElementById('explanation-box');
                document.getElementById('explanation-text').innerText = q.explanation;
                expBox.classList.remove('hidden');
            }

            // Controls update
            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-next').innerText = index === questions.length - 1 ? "Finish" : "Next \u2192";

            renderGrid();
            updateProgressBar();
        }

        function getOptionStyle(qIdx, optIdx) {
            const answerState = userAnswers[qIdx];
            if (!answerState) {
                return "border-slate-200 hover:border-indigo-300 hover:bg-indigo-50/30 bg-white text-slate-700";
            }
            if (optIdx === questions[qIdx].correct) {
                return "border-green-500 bg-green-50 text-green-900 font-medium ring-1 ring-green-400";
            }
            if (answerState.selected === optIdx && !answerState.isCorrect) {
                return "border-red-400 bg-red-50 text-red-800 font-medium";
            }
            return "border-slate-100 bg-slate-50 text-slate-400 opacity-60";
        }

        // Handle Option Selection
        function selectAnswer(qIdx, optIdx) {
            if (userAnswers[qIdx] !== null) return; // Lock after selection

            const isCorrect = optIdx === questions[qIdx].correct;
            userAnswers[qIdx] = { selected: optIdx, isCorrect };

            // Reveal explanation
            document.getElementById('explanation-text').innerText = questions[qIdx].explanation;
            document.getElementById('explanation-box').classList.remove('hidden');

            updateScoreDisplay();
            loadQuestion(qIdx);
        }

        // Navigation
        function navigate(direction) {
            const nextIdx = currentQuestionIdx + direction;
            if (nextIdx >= 0 && nextIdx < questions.length) {
                loadQuestion(nextIdx);
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value);
            if (val >= 1 && val <= questions.length) {
                loadQuestion(val - 1);
                input.value = '';
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function updateScoreDisplay() {
            const score = userAnswers.filter(ans => ans && ans.isCorrect).length;
            document.getElementById('score-display').innerText = score;
        }

        function updateProgressBar() {
            const progress = ((currentQuestionIdx + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
