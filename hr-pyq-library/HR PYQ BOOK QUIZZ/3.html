        // State Variables
        let currentIdx = 0;
        let userAnswers = new Array(rawQuizData.length).fill(null);
        let currentOptions = [];

        // Utility: Fisher-Yates Shuffle
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize Question Render
        function loadQuestion(index) {
            currentIdx = index;
            const qData = rawQuizData[currentIdx];

            // Update UI Counters
            document.getElementById("q-number").innerText = `Q #${currentIdx + 1} OF ${rawQuizData.length}`;
            document.getElementById("progress-text").innerText = `${currentIdx + 1} / ${rawQuizData.length}`;
            document.getElementById("page-badge").innerText = `Page Source: ${qData.page}`;
            document.getElementById("question-text").innerText = qData.q;
            
            // Progress Bar
            const pct = ((currentIdx + 1) / rawQuizData.length) * 100;
            document.getElementById("progress-bar").style.width = `${pct}%`;

            // Reset Hints & Explanations
            document.getElementById("hint-box").classList.add("hidden");
            document.getElementById("hint-btn-text").innerText = "Show Hint";
            document.getElementById("hint-text").innerText = qData.hint;
            document.getElementById("explanation-text").innerText = qData.explanation;
            
            const expBox = document.getElementById("explanation-box");
            if (userAnswers[currentIdx] !== null) {
                expBox.classList.remove("hidden");
            } else {
                expBox.classList.add("hidden");
            }

            // Options Randomization & Display
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            // Shuffle options each time question is freshly loaded, but preserve if already answered
            currentOptions = shuffleArray(qData.options);

            currentOptions.forEach((opt, i) => {
                const optBtn = document.createElement("button");
                optBtn.className = "w-full text-left p-3.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 transition flex items-center justify-between text-sm md:text-base font-medium";
                
                const letter = String.fromCharCode(65 + i);
                optBtn.innerHTML = `<span><strong class="text-indigo-600 mr-2">${letter}.</strong> ${opt}</span> <span class="status-icon"></span>`;

                // Handle selected states
                if (userAnswers[currentIdx] !== null) {
                    optBtn.disabled = true;
                    if (opt === qData.answer) {
                        optBtn.classList.add("bg-green-100", "border-green-500", "text-green-900");
                        optBtn.querySelector(".status-icon").innerHTML = "✅";
                    }
                    if (userAnswers[currentIdx] === opt && opt !== qData.answer) {
                        optBtn.classList.add("bg-red-100", "border-red-500", "text-red-900");
                        optBtn.querySelector(".status-icon").innerHTML = "❌";
                    }
                } else {
                    optBtn.onclick = () => selectOption(opt);
                }

                optionsContainer.appendChild(optBtn);
            });

            // Update Nav Buttons
            document.getElementById("prev-btn").disabled = (currentIdx === 0);
            if (currentIdx === rawQuizData.length - 1) {
                document.getElementById("next-btn").innerText = "Finish Quiz";
            } else {
                document.getElementById("next-btn").innerText = "Next →";
            }

            updateScoreDisplay();
        }

        // Handle Option Selection
        function selectOption(selectedOpt) {
            if (userAnswers[currentIdx] !== null) return;

            userAnswers[currentIdx] = selectedOpt;
            const qData = rawQuizData[currentIdx];

            // Show explanation
            document.getElementById("explanation-box").classList.remove("hidden");

            // Re-render question options to show right/wrong styling
            loadQuestion(currentIdx);
        }

        // Update Score
        function updateScoreDisplay() {
            let score = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === rawQuizData[idx].answer) {
                    score++;
                }
            });
            document.getElementById("score-display").innerText = score;
        }

        // Navigation Actions
        function prevQuestion() {
            if (currentIdx > 0) {
                loadQuestion(currentIdx - 1);
            }
        }

        function nextQuestion() {
            if (currentIdx < rawQuizData.length - 1) {
                loadQuestion(currentIdx + 1);
            } else {
                alert(`Quiz Completed! Final Score: ${document.getElementById("score-display").innerText} / ${rawQuizData.length}`);
            }
        }

        function jumpToQuestion(qNum) {
            const target = parseInt(qNum) - 1;
            if (target >= 0 && target < rawQuizData.length) {
                loadQuestion(target);
            }
        }

        function handleJump() {
            const val = document.getElementById("jump-input").value;
            if (val) {
                jumpToQuestion(val);
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById("hint-box");
            const btnText = document.getElementById("hint-btn-text");
            if (hintBox.classList.contains("hidden")) {
                hintBox.classList.remove("hidden");
                btnText.innerText = "Hide Hint";
            } else {
                hintBox.classList.add("hidden");
                btnText.innerText = "Show Hint";
            }
        }

        // Init App on Load
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
