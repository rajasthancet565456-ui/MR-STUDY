<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-amber-400">Haryana GK Master Prep</h1>
                <p class="text-xs text-slate-400">HSSC / State Competitive Exams Exam Practice</p>
            </div>
            <div class="flex items-center space-x-6 text-sm font-semibold">
                <div class="bg-slate-700/80 px-3 py-1.5 rounded-lg border border-slate-600">
                    <span class="text-slate-400">Score: </span>
                    <span id="score-counter" class="text-emerald-400 text-base">0</span>
                    <span class="text-slate-500">/ 90</span>
                </div>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="w-full bg-slate-700 h-2">
            <div id="progress-bar" class="bg-amber-500 h-2 transition-all duration-300" style="width: 1.11%;"></div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col">

        <!-- Question Card -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-5 md:p-8 shadow-xl flex-grow flex flex-col justify-between">
            
            <!-- Question Header -->
            <div>
                <div class="flex justify-between items-center mb-4">
                    <span id="question-number" class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">
                        Question 1 of 90
                    </span>
                    <button id="hint-btn" onclick="toggleHint()" class="text-xs bg-slate-700 hover:bg-slate-600 text-amber-300 px-3 py-1 rounded-md transition border border-slate-600">
                        💡 Show Hint
                    </button>
                </div>

                <!-- Hint Content (Collapsible) -->
                <div id="hint-box" class="hidden mb-4 p-3 bg-amber-950/40 border border-amber-600/30 rounded-lg text-amber-200 text-xs md:text-sm">
                    <strong>Hint:</strong> <span id="hint-text">Loading hint...</span>
                </div>

                <!-- Question Text -->
                <div class="mb-6 space-y-2">
                    <p id="question-text-hi" class="text-lg md:text-xl font-medium text-slate-100 leading-relaxed"></p>
                    <p id="question-text-en" class="text-sm md:text-base text-slate-400 italic leading-relaxed"></p>
                </div>

                <!-- Options Grid -->
                <div id="options-container" class="grid grid-cols-1 gap-3 mb-6">
                    <!-- Dynamic Options -->
                </div>
            </div>

            <!-- Explanation Box (Revealed after answering) -->
            <div>
                <div id="explanation-box" class="hidden mb-6 p-4 rounded-xl text-sm leading-relaxed border">
                    <h4 id="explanation-title" class="font-bold mb-1 text-base"></h4>
                    <p id="explanation-text" class="text-slate-300"></p>
                </div>

                <!-- Footer Navigation Controls -->
                <div class="flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-slate-700">
                    <div class="flex items-center space-x-2">
                        <button id="prev-btn" onclick="navigate(-1)" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm font-semibold transition disabled:opacity-40 disabled:cursor-not-allowed">
                            ← Previous
                        </button>
                        <button id="next-btn" onclick="navigate(1)" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-lg text-sm font-semibold transition">
                            Next →
                        </button>
                    </div>

                    <!-- Jump To Question -->
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-slate-400">Jump to:</span>
                        <input type="number" id="jump-input" min="1" max="90" placeholder="#" class="w-16 bg-slate-900 border border-slate-600 rounded-lg px-2 py-1 text-center text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                        <button onclick="jumpToQuestion()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm rounded-lg border border-slate-600 transition">
                            Go
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

        // State variables
        let dataset = [];
        let currentIndex = 0;
        let score = 0;
        let answeredQuestions = new Set();

        // Utility: Fisher-Yates Shuffle Algorithm
        function shuffleOptions(item) {
            const options = [...item.opts];
            const correctAnswerText = options[item.ans];
            
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            
            const newCorrectIndex = options.indexOf(correctAnswerText);
            return {
                ...item,
                shuffledOpts: options,
                shuffledAns: newCorrectIndex
            };
        }

        // Initialize App
        function initApp() {
            // Process dataset with shuffled options
            dataset = rawDataset.map(item => shuffleOptions(item));
            renderQuestion();
        }

        // Render Current Question
        function renderQuestion() {
            const q = dataset[currentIndex];

            // Reset UI States
            document.getElementById("hint-box").classList.add("hidden");
            document.getElementById("explanation-box").classList.add("hidden");
            document.getElementById("hint-btn").innerText = "💡 Show Hint";

            // Update Progress & Badges
            document.getElementById("question-number").innerText = `Question ${currentIndex + 1} of ${dataset.length}`;
            document.getElementById("progress-bar").style.width = `${((currentIndex + 1) / dataset.length) * 100}%`;
            
            // Render Text
            document.getElementById("question-text-hi").innerText = `${currentIndex + 1}. ${q.hi}`;
            document.getElementById("question-text-en").innerText = q.en;
            document.getElementById("hint-text").innerText = q.hint;

            // Render Options
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            const isAnswered = answeredQuestions.has(currentIndex);

            q.shuffledOpts.forEach((optText, idx) => {
                const btn = document.createElement("button");
                btn.className = `option-btn w-full text-left p-4 rounded-xl border font-medium text-sm md:text-base flex justify-between items-center transition ${
                    isAnswered 
                        ? 'cursor-not-allowed opacity-80 border-slate-700 bg-slate-800/50' 
                        : 'border-slate-700 bg-slate-700/40 hover:bg-slate-700/80 hover:border-amber-500/50 text-slate-200'
                }`;
                btn.innerHTML = `<span><strong class="text-amber-400 mr-2">${String.fromCharCode(65 + idx)}.</strong> ${optText}</span>`;
                
                btn.disabled = isAnswered;
                btn.onclick = () => selectOption(idx);

                optionsContainer.appendChild(btn);
            });

            // Update Buttons State
            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").disabled = currentIndex === dataset.length - 1;

            // If already answered, show explanation
            if (isAnswered) {
                showExplanation(q.selectedIdx === q.shuffledAns, q.shuffledAns, q.selectedIdx);
            }
        }

        // Handle Option Selection
        function selectOption(selectedIndex) {
            if (answeredQuestions.has(currentIndex)) return;

            const q = dataset[currentIndex];
            q.selectedIdx = selectedIndex;
            answeredQuestions.add(currentIndex);

            const isCorrect = selectedIndex === q.shuffledAns;
            if (isCorrect) {
                score++;
                document.getElementById("score-counter").innerText = score;
            }

            // Disable all option buttons and highlight
            const buttons = document.querySelectorAll("#options-container button");
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.shuffledAns) {
                    btn.className = "option-btn w-full text-left p-4 rounded-xl border font-medium text-sm md:text-base flex justify-between items-center bg-emerald-950/60 border-emerald-500/80 text-emerald-200";
                    btn.innerHTML += ` <span class="text-emerald-400 font-bold">✓ Correct</span>`;
                } else if (idx === selectedIndex) {
                    btn.className = "option-btn w-full text-left p-4 rounded-xl border font-medium text-sm md:text-base flex justify-between items-center bg-rose-950/60 border-rose-500/80 text-rose-200";
                    btn.innerHTML += ` <span class="text-rose-400 font-bold">✗ Incorrect</span>`;
                } else {
                    btn.className = "option-btn w-full text-left p-4 rounded-xl border border-slate-800 bg-slate-800/30 text-slate-500 opacity-50";
                }
            });

            showExplanation(isCorrect, q.shuffledAns, selectedIndex);
        }

        // Display Explanation Box
        function showExplanation(isCorrect, correctIndex, selectedIndex) {
            const q = dataset[currentIndex];
            const expBox = document.getElementById("explanation-box");
            const expTitle = document.getElementById("explanation-title");
            const expText = document.getElementById("explanation-text");

            expBox.classList.remove("hidden", "bg-emerald-950/40", "border-emerald-500/40", "bg-rose-950/40", "border-rose-500/40");
            
            if (isCorrect) {
                expBox.classList.add("bg-emerald-950/40", "border-emerald-500/40");
                expTitle.className = "font-bold mb-1 text-base text-emerald-400";
                expTitle.innerText = " Correct Answer!";
            } else {
                expBox.classList.add("bg-rose-950/40", "border-rose-500/40");
                expTitle.className = "font-bold mb-1 text-base text-rose-400";
                expTitle.innerText = ` Incorrect (Correct Option: ${String.fromCharCode(65 + correctIndex)})`;
            }

            expText.innerText = q.exp;
        }

        // Toggle Hint Display
        function toggleHint() {
            const hintBox = document.getElementById("hint-box");
            const hintBtn = document.getElementById("hint-btn");
            if (hintBox.classList.contains("hidden")) {
                hintBox.classList.remove("hidden");
                hintBtn.innerText = "🙈 Hide Hint";
            } else {
                hintBox.classList.add("hidden");
                hintBtn.innerText = "💡 Show Hint";
            }
        }

        // Navigation Controls
        function navigate(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < dataset.length) {
                currentIndex = newIndex;
                renderQuestion();
            }
        }

        // Jump to Question
        function jumpToQuestion() {
            const input = document.getElementById("jump-input");
            const val = parseInt(input.value);
            if (val >= 1 && val <= dataset.length) {
                currentIndex = val - 1;
                renderQuestion();
                input.value = "";
            } else {
                alert(`Please enter a valid question number between 1 and ${dataset.length}`);
            }
        }

        // Keyboard Shortcut Support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft' && currentIndex > 0) {
                navigate(-1);
            } else if (e.key === 'ArrowRight' && currentIndex < dataset.length - 1) {
                navigate(1);
            }
        });

        // Start App
        window.onload = initApp;
    </script>
