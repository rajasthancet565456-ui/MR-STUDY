        // State variables
        let currentIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledQuestions = [];

        // Fisher-Yates Shuffle Algorithm for randomizing options
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize quiz questions with shuffled options (preserves correct answer reference)
        function initQuestions() {
            shuffledQuestions = quizData.map((q) => {
                const originalCorrectOption = q.options[q.correct];
                const shuffledOpts = shuffleArray(q.options);
                const newCorrectIndex = shuffledOpts.indexOf(originalCorrectOption);

                return {
                    ...q,
                    options: shuffledOpts,
                    correct: newCorrectIndex
                };
            });
        }

        // Render Question UI
        function renderQuestion() {
            const q = shuffledQuestions[currentIndex];

            // Source Tag
            document.getElementById('page-tag').textContent = `Source Material: Page ${q.page} (Q ${currentIndex + 1} of 90)`;

            // Question Text
            document.getElementById('question-text-hi').textContent = `${currentIndex + 1}. ${q.qHi}`;
            document.getElementById('question-text-en').textContent = q.qEn;

            // Progress Bar & Percentage
            const total = shuffledQuestions.length;
            const percentage = Math.round(((currentIndex + 1) / total) * 100);
            document.getElementById('progress-text').textContent = `Question ${currentIndex + 1} of ${total}`;
            document.getElementById('progress-percent').textContent = `${percentage}%`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            // Render Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const isAnswered = userAnswers[currentIndex] !== null;

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border text-sm font-medium transition flex items-center justify-between shadow-sm `;
                
                if (!isAnswered) {
                    btn.className += `border-slate-200 bg-white hover:bg-indigo-50/50 hover:border-indigo-300 text-slate-700`;
                    btn.onclick = () => selectOption(idx);
                } else {
                    const selected = userAnswers[currentIndex];
                    if (idx === q.correct) {
                        btn.className += `border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold ring-1 ring-emerald-500`;
                    } else if (idx === selected && selected !== q.correct) {
                        btn.className += `border-rose-500 bg-rose-50 text-rose-900 ring-1 ring-rose-500`;
                    } else {
                        btn.className += `border-slate-200 bg-slate-50 text-slate-400 opacity-60`;
                    }
                }

                const prefix = String.fromCharCode(65 + idx); // A, B, C, D
                btn.innerHTML = `<span><strong class="mr-2.5 text-indigo-600 font-bold">${prefix}.</strong> ${opt}</span>`;
                container.appendChild(btn);
            });

            // Reset Hint Box
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-box').textContent = q.hint;

            // Handle Explanation Box visibility
            const expBox = document.getElementById('explanation-box');
            if (isAnswered) {
                expBox.classList.remove('hidden');
                document.getElementById('explanation-text').textContent = q.explanation;
            } else {
                expBox.classList.add('hidden');
            }

            // Prev / Next Buttons enable/disable state
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === total - 1;
        }

        // Option Selection Event
        function selectOption(index) {
            userAnswers[currentIndex] = index;
            updateScore();
            renderQuestion();
        }

        // Calculate & Display Live Score
        function updateScore() {
            let score = 0;
            userAnswers.forEach((ans, i) => {
                if (ans !== null && ans === shuffledQuestions[i].correct) {
                    score++;
                }
            });
            document.getElementById('score').textContent = `${score} / ${shuffledQuestions.length}`;
        }

        // Event Listeners for UI Navigation
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentIndex < shuffledQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        });

        document.getElementById('hint-btn').addEventListener('click', () => {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        });

        document.getElementById('jump-btn').addEventListener('click', () => {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val && val >= 1 && val <= shuffledQuestions.length) {
                currentIndex = val - 1;
                renderQuestion();
            }
        });

        // Initialize Quiz App
        initQuestions();
        renderQuestion();
    </script>
