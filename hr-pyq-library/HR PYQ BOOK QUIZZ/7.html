        // Shuffle Options Helper Function
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Process questions: Create deterministic shuffled options per session
        const questions = rawDataset.map((q, idx) => {
            const shuffled = shuffleArray(q.options);
            return {
                id: idx + 1,
                page: q.page,
                hi: q.hi,
                en: q.en,
                options: shuffled,
                correct: q.answer,
                hint: q.hint,
                rationale: q.rationale,
                userSelected: null
            };
        });

        let currentIndex = 0;
        let score = 0;

        function renderQuestion() {
            const q = questions[currentIndex];
            
            // Update Text
            document.getElementById('question-text-hi').innerHTML = `<span class="text-amber-400 font-bold mr-2">Q${q.id}.</span> ${q.hi}`;
            document.getElementById('question-text-en').innerHTML = q.en;
            document.getElementById('page-source-indicator').innerText = q.page;

            // Render Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const optionLabels = ['A', 'B', 'C', 'D'];

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-lg border border-slate-700 bg-slate-700/50 hover:bg-slate-700 transition flex items-start gap-3 text-sm sm:text-base font-medium";
                
                // Styling if already selected
                if (q.userSelected !== null) {
                    btn.disabled = true;
                    if (opt === q.correct) {
                        btn.className = "w-full text-left p-3.5 rounded-lg border border-emerald-500 bg-emerald-950/60 text-emerald-200 flex items-start gap-3 text-sm sm:text-base font-medium";
                    } else if (opt === q.userSelected) {
                        btn.className = "w-full text-left p-3.5 rounded-lg border border-rose-500 bg-rose-950/60 text-rose-200 flex items-start gap-3 text-sm sm:text-base font-medium";
                    } else {
                        btn.className = "w-full text-left p-3.5 rounded-lg border border-slate-800 bg-slate-800/40 text-slate-500 flex items-start gap-3 text-sm sm:text-base font-medium opacity-60";
                    }
                } else {
                    btn.onclick = () => selectOption(opt);
                }

                btn.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-xs text-amber-400 font-bold shrink-0 mt-0.5">${optionLabels[idx]}</span>
                    <span>${opt}</span>
                `;
                container.appendChild(btn);
            });

            // Reset/Set Hint Box
            const hintBox = document.getElementById('hint-box');
            hintBox.innerText = q.hint;
            hintBox.classList.add('hidden');

            // Reset/Set Rationale Box
            const rationaleBox = document.getElementById('rationale-box');
            if (q.userSelected !== null) {
                rationaleBox.classList.remove('hidden');
                const isCorrect = q.userSelected === q.correct;
                rationaleBox.className = `p-4 rounded-lg text-sm border ${isCorrect ? 'bg-emerald-950/30 border-emerald-700/50 text-emerald-200' : 'bg-rose-950/30 border-rose-700/50 text-rose-200'}`;
                rationaleBox.innerHTML = `
                    <div class="font-bold mb-1">${isCorrect ? '✓ Correct Answer' : '✗ Incorrect Answer'}</div>
                    <div class="text-xs text-slate-300"><strong>Correct Answer:</strong> ${q.correct}</div>
                    <div class="mt-2 text-xs leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</div>
                `;
            } else {
                rationaleBox.classList.add('hidden');
            }

            // Controls & Progress Update
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').innerText = currentIndex === questions.length - 1 ? 'Finish' : 'Next \u2192';
            
            const progressPercent = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${questions.length}`;
            document.getElementById('score-display').innerText = `${score} / ${questions.length}`;
        }

        function selectOption(selectedOpt) {
            const q = questions[currentIndex];
            if (q.userSelected !== null) return;

            q.userSelected = selectedOpt;
            if (selectedOpt === q.correct) {
                score++;
            }
            renderQuestion();
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function navigate(dir) {
            const newIndex = currentIndex + dir;
            if (newIndex >= 0 && newIndex < questions.length) {
                currentIndex = newIndex;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val && val >= 1 && val <= questions.length) {
                currentIndex = val - 1;
                renderQuestion();
            }
        }

        // Initialize Quiz
        window.onload = () => {
            renderQuestion();
        };
    </script>
