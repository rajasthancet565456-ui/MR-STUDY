        // App State
        let currentIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledQuestions = [];

        // Utility: Fisher-Yates Shuffle algorithm for options
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize and shuffle options for all questions uniquely
        function initQuestions() {
            shuffledQuestions = quizData.map((q) => {
                const originalCorrectOption = q.options[q.correct];
                const shuffledOpts = shuffleArray(q.options);
                const newCorrectIndex = shuffledOpts.indexOf(originalCorrectOption);

                return {
                    ...q,
                    options: shuffledOpts,
                    correct: newCorrectIndex
                };
            });
        }

        // Render Question
        function renderQuestion() {
            const q = shuffledQuestions[currentIndex];

            // Update Page indicator tag
            document.getElementById('page-tag').textContent = `Source Material: Page ${q.page} (Q ${currentIndex + 1} of 90)`;

            // Texts
            document.getElementById('question-text-hi').textContent = `${currentIndex + 1}. ${q.qHi}`;
            document.getElementById('question-text-en').textContent = q.qEn;

            // Progress Bar
            const total = shuffledQuestions.length;
            const percentage = Math.round(((currentIndex + 1) / total) * 100);
            document.getElementById('progress-text').textContent = `Question ${currentIndex + 1} of ${total}`;
            document.getElementById('progress-percent').textContent = `${percentage}%`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            // Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const isAnswered = userAnswers[currentIndex] !== null;

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border text-sm font-medium transition flex items-center justify-between `;
                
                if (!isAnswered) {
                    btn.className += `border-slate-200 bg-white hover:bg-slate-50 text-slate-700 hover:border-indigo-300 shadow-sm`;
                    btn.onclick = () => selectOption(idx);
                } else {
                    const selected = userAnswers[currentIndex];
                    if (idx === q.correct) {
                        btn.className += `border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold`;
                    } else if (idx === selected && selected !== q.correct) {
                        btn.className += `border-rose-500 bg-rose-50 text-rose-900`;
                    } else {
                        btn.className += `border-slate-200 bg-slate-50 text-slate-400 opacity-60`;
                    }
                }

                const prefix = String.fromCharCode(65 + idx); // A, B, C, D
                btn.innerHTML = `<span><strong class="mr-2 text-indigo-600">${prefix}.</strong> ${opt}</span>`;
                container.appendChild(btn);
            });

            // Hint Box reset
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-box').textContent = q.hint;

            // Explanation Box
            const expBox = document.getElementById('explanation-box');
            if (isAnswered) {
                expBox.classList.remove('hidden');
                document.getElementById('explanation-text').textContent = q.explanation;
            } else {
                expBox.classList.add('hidden');
            }

            // Prev/Next buttons state
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === total - 1;
        }

        // Option selection handler
        function selectOption(index) {
            userAnswers[currentIndex] = index;
            updateScore();
            renderQuestion();
        }

        // Update score
        function updateScore() {
            let score = 0;
            userAnswers.forEach((ans, i) => {
                if (ans !== null && ans === shuffledQuestions[i].correct) {
                    score++;
                }
            });
            document.getElementById('score').textContent = `${score} / ${shuffledQuestions.length}`;
        }

        // Navigation Event Listeners
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentIndex < shuffledQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        });

        document.getElementById('hint-btn').addEventListener('click', () => {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        });

        document.getElementById('jump-btn').addEventListener('click', () => {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val && val >= 1 && val <= shuffledQuestions.length) {
                currentIndex = val - 1;
                renderQuestion();
            }
        });

        // Initialize quiz on load
        initQuestions();
        renderQuestion();
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
