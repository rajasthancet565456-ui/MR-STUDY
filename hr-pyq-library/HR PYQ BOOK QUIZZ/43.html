        // Application State
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let userAnswers = {}; // track answered status: { index: { selectedOption, isCorrect } }

        // Fisher-Yates Shuffle Algorithm to randomize options without breaking correct key mapping
        function prepareDataset() {
            questions = rawDataset.map((q) => {
                const originalOptions = [...q.options];
                const correctAnswerText = originalOptions[q.correct];
                
                // Create an array of option objects
                let optionObjs = originalOptions.map(opt => ({ text: opt }));
                
                // Shuffle array
                for (let i = optionObjs.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionObjs[i], optionObjs[j]] = [optionObjs[j], optionObjs[i]];
                }

                // Find new correct index
                const newCorrectIndex = optionObjs.findIndex(opt => opt.text === correctAnswerText);

                return {
                    id: q.id,
                    en: q.en,
                    hi: q.hi,
                    options: optionObjs.map(o => o.text),
                    correct: newCorrectIndex,
                    hint: q.hint,
                    explanation: q.explanation
                };
            });
        }

        // Initialize UI
        function initQuiz() {
            prepareDataset();
            document.getElementById('total-qs').innerText = questions.length;
            document.getElementById('max-score').innerText = questions.length;
            renderQuestion();
        }

        // Render Current Question
        function renderQuestion() {
            const q = questions[currentIndex];

            // Updates Text
            document.getElementById('current-q-num').innerText = currentIndex + 1;
            document.getElementById('q-id').innerText = `QID: ${q.id}`;
            document.getElementById('question-en').innerText = `${currentIndex + 1}. ${q.en}`;
            document.getElementById('question-hi').innerText = q.hi;
            
            // Progress Bar
            const progressPercent = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Reset Boxes
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-box').innerText = q.hint;
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('explanation-text').innerText = q.explanation;

            // Render Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const answered = userAnswers[currentIndex];

            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-lg border text-sm font-medium transition flex items-start gap-3 `;
                
                if (answered !== undefined) {
                    btn.disabled = true;
                    if (optIdx === q.correct) {
                        btn.classList.add('bg-emerald-950/60', 'border-emerald-500', 'text-emerald-200');
                    } else if (optIdx === answered.selectedOption) {
                        btn.classList.add('bg-rose-950/60', 'border-rose-500', 'text-rose-200');
                    } else {
                        btn.classList.add('bg-slate-800/50', 'border-slate-700/60', 'text-slate-400', 'opacity-60');
                    }
                } else {
                    btn.classList.add('bg-slate-750', 'border-slate-700', 'hover:bg-slate-700', 'hover:border-slate-500', 'text-slate-200');
                    btn.onclick = () => selectOption(optIdx);
                }

                const prefix = String.fromCharCode(65 + optIdx); // A, B, C, D
                btn.innerHTML = `<span class="bg-slate-900/80 px-2 py-0.5 rounded text-xs font-mono font-bold text-slate-300 border border-slate-700">${prefix}</span> <span>${optText}</span>`;
                container.appendChild(btn);
            });

            // Show explanation if already answered
            if (answered !== undefined) {
                document.getElementById('explanation-box').classList.remove('hidden');
            }

            // Button States
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === questions.length - 1;
        }

        // Handle Option Click
        function selectOption(optionIndex) {
            if (userAnswers[currentIndex] !== undefined) return;

            const q = questions[currentIndex];
            const isCorrect = optionIndex === q.correct;

            if (isCorrect) {
                score++;
                document.getElementById('score').innerText = score;
            }

            userAnswers[currentIndex] = {
                selectedOption: optionIndex,
                isCorrect: isCorrect
            };

            renderQuestion();
        }

        // Navigation Controls
        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value);
            if (val >= 1 && val <= questions.length) {
                currentIndex = val - 1;
                renderQuestion();
                input.value = '';
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        // Keyboard Shortcuts Navigation
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'ArrowLeft') prevQuestion();
        });

        // Initialize on load
        window.onload = initQuiz;
    </script>
