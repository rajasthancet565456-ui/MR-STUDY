        // State variables
        let questions = [];
        let currentIndex = 0;
        let userAnswers = {};
        let score = 0;

        // Fisher-Yates Shuffle Algorithm to randomize options without losing track of correct answer
        function shuffleOptions(questionObj) {
            let options = [...questionObj.options];
            let correctAnswerText = options[questionObj.correct];
            
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            
            let newCorrectIndex = options.indexOf(correctAnswerText);
            
            return {
                ...questionObj,
                shuffledOptions: options,
                shuffledCorrect: newCorrectIndex
            };
        }

        // Initialize Data
        function initQuiz() {
            questions = rawDataset.map(q => shuffleOptions(q));
            renderQuestion();
        }

        // Render Current Question
        function renderQuestion() {
            const q = questions[currentIndex];
            
            // Header Info
            document.getElementById("question-source-tag").textContent = q.source;
            document.getElementById("question-num-tag").textContent = `Q. ID: ${q.id}`;
            document.getElementById("progress-text").textContent = `${currentIndex + 1} / ${questions.length}`;
            document.getElementById("progress-bar").style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
            
            // Question Texts
            document.getElementById("question-hi").textContent = `${currentIndex + 1}. ${q.q_hi}`;
            document.getElementById("question-en").textContent = q.q_en;

            // Hint
            document.getElementById("hint-box").classList.add("hidden");
            document.getElementById("hint-box").textContent = q.hint;

            // Explanation Box
            const expBox = document.getElementById("explanation-box");
            if (userAnswers[currentIndex] !== undefined) {
                document.getElementById("explanation-text").textContent = q.exp;
                expBox.classList.remove("hidden");
            } else {
                expBox.classList.add("hidden");
            }

            // Options Container
            const container = document.getElementById("options-container");
            container.innerHTML = "";

            const labels = ["A", "B", "C", "D"];
            
            q.shuffledOptions.forEach((optText, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn w-full text-left p-3.5 rounded-lg border text-sm font-medium flex items-center gap-3 transition-all ";
                
                const labelSpan = document.createElement("span");
                labelSpan.className = "w-7 h-7 flex items-center justify-center rounded-full bg-slate-700 text-xs font-bold shrink-0";
                labelSpan.textContent = labels[idx];

                const textSpan = document.createElement("span");
                textSpan.textContent = optText;
                textSpan.className = "flex-1";

                btn.appendChild(labelSpan);
                btn.appendChild(textSpan);

                // Option State Styling
                if (userAnswers[currentIndex] !== undefined) {
                    btn.disabled = true;
                    if (idx === q.shuffledCorrect) {
                        btn.classList.add("bg-emerald-950/80", "border-emerald-500", "text-emerald-200");
                        labelSpan.classList.add("bg-emerald-600", "text-white");
                    } else if (userAnswers[currentIndex] === idx) {
                        btn.classList.add("bg-rose-950/80", "border-rose-500", "text-rose-200");
                        labelSpan.classList.add("bg-rose-600", "text-white");
                    } else {
                        btn.classList.add("bg-slate-800/40", "border-slate-700/50", "text-slate-500");
                    }
                } else {
                    btn.classList.add("bg-slate-800", "border-slate-700", "text-slate-200", "hover:bg-slate-700/80", "hover:border-sky-500");
                    btn.onclick = () => selectOption(idx);
                }

                container.appendChild(btn);
            });

            // Button States
            document.getElementById("prev-btn").disabled = (currentIndex === 0);
            document.getElementById("next-btn").disabled = (currentIndex === questions.length - 1);
        }

        // Handle Selection
        function selectOption(optionIdx) {
            if (userAnswers[currentIndex] !== undefined) return;

            userAnswers[currentIndex] = optionIdx;
            const q = questions[currentIndex];

            if (optionIdx === q.shuffledCorrect) {
                score++;
                document.getElementById("score-display").textContent = score;
            }

            renderQuestion();
        }

        // Toggle Hint
        function toggleHint() {
            const hintBox = document.getElementById("hint-box");
            hintBox.classList.toggle("hidden");
        }

        // Navigation
        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById("jump-input");
            const val = parseInt(input.value);
            if (val >= 1 && val <= questions.length) {
                currentIndex = val - 1;
                renderQuestion();
                input.value = "";
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}`);
            }
        }

        // On Load
        window.onload = initQuiz;
    </script>
