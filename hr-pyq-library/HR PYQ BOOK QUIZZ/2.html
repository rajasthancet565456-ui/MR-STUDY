        // State variables
        let currentFilteredQuestions = [...masterDataset];
        let currentIndex = 0;
        let userAnswers = {}; // { qId: selectedOption }
        let score = 0;

        // Shuffle Options Helper (Ensures answer position varies predictably per load)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Initialize Options shuffling on load
        masterDataset.forEach(q => {
            if (!q.shuffledOptions) {
                let opts = [...q.options];
                q.shuffledOptions = shuffleArray(opts);
            }
        });

        // DOM elements
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionBadge = document.getElementById('question-badge');
        const pageBadge = document.getElementById('page-badge');
        const hintBox = document.getElementById('hint-box');
        const hintBtnText = document.getElementById('hint-btn-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const liveScore = document.getElementById('live-score');
        const totalAnswered = document.getElementById('total-answered');
        const progressBar = document.getElementById('progress-bar');
        const jumpInput = document.getElementById('jump-input');

        // Render Current Question
        function renderQuestion() {
            if (currentFilteredQuestions.length === 0) return;

            const q = currentFilteredQuestions[currentIndex];

            // Reset boxes
            hintBox.classList.add('hidden');
            hintBtnText.innerText = "Show Hint";
            explanationBox.classList.add('hidden');

            // Set Meta
            questionBadge.innerText = `Q ${currentIndex + 1} of ${currentFilteredQuestions.length}`;
            pageBadge.innerText = `Source: Page ${q.page}`;
            questionText.innerText = q.question;
            hintBox.innerText = q.hint;
            explanationText.innerText = q.explanation;

            // Render Options
            optionsContainer.innerHTML = '';
            const isAnswered = userAnswers[q.id] !== undefined;

            q.shuffledOptions.forEach((opt, idx) => {
                const optBtn = document.createElement('button');
                optBtn.className = "w-full text-left p-3.5 border rounded-xl text-sm transition-all duration-150 flex items-start gap-3 focus:outline-none";
                
                const letterSpan = document.createElement('span');
                letterSpan.className = "w-6 h-6 rounded-full bg-slate-100 border border-slate-300 text-slate-600 flex items-center justify-center text-xs font-bold shrink-0";
                letterSpan.innerText = String.fromCharCode(65 + idx);

                const textSpan = document.createElement('span');
                textSpan.className = "mt-0.5 leading-snug";
                textSpan.innerText = opt;

                optBtn.appendChild(letterSpan);
                optBtn.appendChild(textSpan);

                if (isAnswered) {
                    optBtn.disabled = true;
                    if (opt === q.correct) {
                        optBtn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900', 'font-medium');
                        letterSpan.classList.add('bg-emerald-500', 'text-white', 'border-emerald-500');
                    } else if (userAnswers[q.id] === opt) {
                        optBtn.classList.add('bg-rose-50', 'border-rose-400', 'text-rose-900');
                        letterSpan.classList.add('bg-rose-500', 'text-white', 'border-rose-500');
                    } else {
                        optBtn.classList.add('bg-slate-50', 'border-slate-200', 'opacity-60');
                    }
                } else {
                    optBtn.classList.add('bg-white', 'border-slate-200', 'hover:border-amber-400', 'hover:bg-amber-50/30', 'text-slate-800');
                    optBtn.onclick = () => selectOption(q.id, opt);
                }

                optionsContainer.appendChild(optBtn);
            });

            // Show explanation if already answered
            if (isAnswered) {
                explanationBox.classList.remove('hidden');
            }

            // Update Navigation state
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === currentFilteredQuestions.length - 1;

            // Update Progress Bar
            const progressPercent = ((currentIndex + 1) / currentFilteredQuestions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Update Jump Input Max
            jumpInput.max = currentFilteredQuestions.length;
        }

        // Option Selection Handler
        function selectOption(qId, selectedOpt) {
            const q = masterDataset.find(item => item.id === qId);
            userAnswers[qId] = selectedOpt;

            if (selectedOpt === q.correct) {
                score++;
            }

            updateScorecard();
            renderQuestion();
        }

        // Scorecard update
        function updateScorecard() {
            const answeredCount = Object.keys(userAnswers).length;
            liveScore.innerText = score;
            totalAnswered.innerText = answeredCount;
        }

        // Navigation Actions
        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentIndex < currentFilteredQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= currentFilteredQuestions.length) {
                currentIndex = val - 1;
                renderQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${currentFilteredQuestions.length}.`);
            }
        }

        function toggleHint() {
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBtnText.innerText = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintBtnText.innerText = "Show Hint";
            }
        }

        // Page Filtering
        function filterPage(pageNum) {
            // Update Active Filter UI
            ['all', 4, 5, 6].forEach(p => {
                const btn = document.getElementById(`btn-page-${p}`);
                if (p === pageNum) {
                    btn.className = "px-3 py-1 text-xs font-medium rounded-full bg-amber-500 text-white";
                } else {
                    btn.className = "px-3 py-1 text-xs font-medium rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700";
                }
            });

            if (pageNum === 'all') {
                currentFilteredQuestions = [...masterDataset];
            } else {
                currentFilteredQuestions = masterDataset.filter(q => q.page === pageNum);
            }

            currentIndex = 0;
            renderQuestion();
        }

        // Key Navigation Listener
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'ArrowLeft') prevQuestion();
        });

        // Initial Load
        renderQuestion();
        updateScorecard();
    </script>
