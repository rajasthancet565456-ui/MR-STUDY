    // State Variables
    let currentIdx = 0;
    let userAnswers = new Array(rawDataset.length).fill(null);
    let shuffledOptions = [];

    // Utility: Fisher-Yates Shuffle
    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Pre-shuffle option positions for all questions to guarantee dynamic variation
    function initializeQuizData() {
      shuffledOptions = rawDataset.map(q => shuffleArray(q.opts));
    }

    // UI Rendering
    function renderQuestion() {
      const q = rawDataset[currentIdx];
      const opts = shuffledOptions[currentIdx];

      // Update Header & Progress
      document.getElementById('current-q-num').innerText = currentIdx + 1;
      document.getElementById('total-q-num').innerText = rawDataset.length;
      
      const pct = ((currentIdx + 1) / rawDataset.length) * 100;
      document.getElementById('progress-bar').style.width = `${pct}%`;

      // Update Texts
      document.getElementById('q-text-en').innerText = `Q${currentIdx + 1} (Ref #${q.id}). ${q.en}`;
      document.getElementById('q-text-hi').innerText = `प्रश्न ${currentIdx + 1}: ${q.hi}`;

      // Update Hint
      const hintBox = document.getElementById('hint-box');
      hintBox.classList.add('hidden');
      hintBox.innerHTML = `<strong>Hint (English):</strong> ${q.hint_en}<br><strong>संकेत (हिंदी):</strong> ${q.hint_hi}`;

      // Options Rendering
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const userSelected = userAnswers[currentIdx];

      opts.forEach((optText, index) => {
        const optionBtn = document.createElement('button');
        optionBtn.className = "w-full text-left p-4 rounded-lg border transition-all duration-200 flex items-start justify-between font-medium text-sm md:text-base cursor-pointer ";
        
        const optionLabel = String.fromCharCode(65 + index); // A, B, C, D

        if (userSelected === null) {
          // Unanswered State
          optionBtn.className += "bg-slate-700/50 hover:bg-slate-700 border-slate-600 text-slate-200";
          optionBtn.onclick = () => selectOption(optText);
        } else {
          // Answered State
          optionBtn.disabled = true;
          if (optText === q.ans) {
            // Correct answer
            optionBtn.className += "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-semibold";
          } else if (optText === userSelected) {
            // Incorrectly picked answer
            optionBtn.className += "bg-rose-950/80 border-rose-500 text-rose-200 font-semibold";
          } else {
            // Neutral unselected options
            optionBtn.className += "bg-slate-800 border-slate-700 text-slate-400 opacity-60";
          }
        }

        optionBtn.innerHTML = `
          <span><strong class="text-amber-400 mr-2">${optionLabel}.</strong> ${optText}</span>
          ${userSelected !== null && optText === q.ans ? '<span class="text-emerald-400 font-bold ml-2">✓</span>' : ''}
          ${userSelected !== null && optText === userSelected && optText !== q.ans ? '<span class="text-rose-400 font-bold ml-2">✗</span>' : ''}
        `;

        container.appendChild(optionBtn);
      });

      // Explanation / Rationale Box
      const expBox = document.getElementById('explanation-box');
      if (userSelected !== null) {
        expBox.classList.remove('hidden');
        document.getElementById('explanation-text').innerText = q.exp;
      } else {
        expBox.classList.add('hidden');
      }

      // Update Nav Buttons
      document.getElementById('prev-btn').disabled = (currentIdx === 0);
      document.getElementById('next-btn').innerText = (currentIdx === rawDataset.length - 1) ? "Finish Quiz" : "Next ›";

      // Update Score Card
      calculateScore();
    }

    // Handle Option Selection
    function selectOption(selectedOpt) {
      if (userAnswers[currentIdx] !== null) return; // Prevent double clicks
      userAnswers[currentIdx] = selectedOpt;
      renderQuestion();
    }

    // Score Calculation
    function calculateScore() {
      let score = 0;
      let answered = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans !== null) {
          answered++;
          if (ans === rawDataset[idx].ans) {
            score++;
          }
        }
      });
      document.getElementById('score-counter').innerText = score;
      document.getElementById('total-answered').innerText = answered;
    }

    // Event Listeners
    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentIdx < rawDataset.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        alert(`Quiz Finished!\nYour final score is ${document.getElementById('score-counter').innerText} out of ${rawDataset.length}.`);
      }
    });

    document.getElementById('jump-btn').addEventListener('click', () => {
      const val = parseInt(document.getElementById('jump-input').value);
      if (val >= 1 && val <= rawDataset.length) {
        currentIdx = val - 1;
        renderQuestion();
      } else {
        alert(`Please enter a valid question number between 1 and ${rawDataset.length}`);
      }
    });

    document.getElementById('hint-btn').addEventListener('click', () => {
      const hintBox = document.getElementById('hint-box');
      hintBox.classList.toggle('hidden');
    });

    // Initialize Quiz
    initializeQuizData();
    renderQuestion();
  </script>
