        function shuffleArray(array) {
            let currentIndex = array.length, temporaryValue, randomIndex;
            while (0 !== currentIndex) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex -= 1;
                temporaryValue = array[currentIndex];
                array[currentIndex] = array[randomIndex];
                array[randomIndex] = temporaryValue;

            return array;

                explanationBox.textContent = q.explanation;
                explanationBox.className = userAnswers[index].isCorrect || currentOptions[userAnswers[index]].correct ? 
                    "mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-800 text-sm block" :
                    "mb-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-800 text-sm block";
            } else {
                explanationBox.classList.add("hidden");
            }

            // Update navigation buttons
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? "Finish" : "Next";

            // Update Progress bar & counter
            progressText.textContent = `${index + 1} / ${quizData.length}`;
            progressBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
            scoreDisplay.textContent = score;
        }

        function selectOption(selectedIndex, isCorrect, selectedBtn) {
            userAnswers[currentIndex] = selectedIndex;
            
            const currentOptions = randomizedOptionsCache[currentIndex];
            
            // Disable all option buttons after selection
            const buttons = optionsContainer.getElementsByTagName("button");
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (currentOptions[i].correct) {
                    buttons[i].classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-900");
                }
            }

            if (isCorrect) {
                selectedBtn.classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-900");
                score++;
                scoreDisplay.textContent = score;
            } else {
                selectedBtn.classList.add("bg-rose-50", "border-rose-500", "text-rose-900");
            }

            // Show explanation
            explanationBox.textContent = quizData[currentIndex].explanation;
            explanationBox.className = isCorrect ? 
                "mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-800 text-sm block" :
                "mb-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-800 text-sm block";
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                showCompletionSummary();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion(currentIndex);
                jumpInput.value = "";
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function toggleHint() {
            hintBox.classList.toggle("hidden");
        }

        function showCompletionSummary() {
            const card = document.getElementById("quiz-card");
            card.innerHTML = `
                <div class="text-center py-8 space-y-4">
                    <h2 class="text-2xl font-bold text-slate-900">Quiz Completed! 🎉</h2>
                    <p class="text-slate-600">You have successfully completed all 90 bilingual questions from Pages 72 & 73.</p>
                    <div class="inline-block bg-indigo-50 border border-indigo-200 px-6 py-4 rounded-2xl my-4">
                        <div class="text-xs text-indigo-600 font-semibold uppercase tracking-wider">Final Score</div>
                        <div class="text-3xl font-bold text-indigo-700">${score} / ${quizData.length}</div>
                    </div>
                    <div>
                        <button onclick="location.reload()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow transition">
                            Restart Quiz
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize first question on load
        loadQuestion(currentIndex);
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
