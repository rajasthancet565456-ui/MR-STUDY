<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-amber-400">Haryana GK Revision Portal</h1>
                <p class="text-xs text-slate-400">SSC, HSSC & State Exam Mock Practice</p>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">Score</span>
                    <span id="score-display" class="text-lg font-bold text-emerald-400">0 / 78</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 flex flex-col gap-4">

        <!-- Progress Bar & Quick Jump Navigation -->
        <div class="bg-slate-800 rounded-xl p-4 shadow-md border border-slate-700">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-2">
                <span id="question-tracker" class="text-sm font-semibold text-amber-400">Question 1 of 78</span>
                
                <div class="flex items-center space-x-2">
                    <label for="jump-input" class="text-xs text-slate-300">Jump to Q:</label>
                    <input type="number" id="jump-input" min="1" max="78" class="w-16 bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-center text-slate-100 focus:outline-none focus:border-amber-400">
                    <button id="jump-btn" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-xs px-3 py-1.5 rounded transition">Go</button>
                </div>
            </div>
            
            <div class="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-amber-400 h-2.5 rounded-full transition-all duration-300" style="width: 1.28%"></div>
            </div>
        </div>

        <!-- Question Card -->
        <div class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700 flex-grow flex flex-col justify-between">
            <div>
                <!-- Question Text (Bilingual) -->
                <div class="mb-6">
                    <h2 id="question-text-en" class="text-lg sm:text-xl font-semibold text-slate-100 mb-2 leading-relaxed">Loading Question...</h2>
                    <h3 id="question-text-hi" class="text-base sm:text-lg text-slate-300 font-normal leading-relaxed">प्रश्न लोड हो रहा है...</h3>
                </div>

                <!-- Options List -->
                <div id="options-container" class="grid grid-cols-1 gap-3 mb-4">
                    <!-- Dynamic Options Inserted Here -->
                </div>
            </div>

            <!-- Interactivity: Hint & Explanation -->
            <div class="mt-4 border-t border-slate-700 pt-4">
                <div class="flex flex-wrap gap-2 mb-3">
                    <button id="hint-btn" class="bg-slate-700 hover:bg-slate-600 text-amber-300 text-xs px-3 py-1.5 rounded-md border border-amber-500/30 transition">
                        💡 Show Hint / संकेत
                    </button>
                </div>

                <div id="hint-box" class="hidden mb-3 p-3 bg-amber-950/40 border border-amber-500/40 rounded-lg text-sm text-amber-200">
                    <!-- Dynamic Hint -->
                </div>

                <div id="explanation-box" class="hidden p-4 bg-slate-900 border border-slate-700 rounded-lg text-sm leading-relaxed">
                    <h4 class="font-bold text-emerald-400 mb-1">Explanation / व्याख्या:</h4>
                    <p id="explanation-text" class="text-slate-300"></p>
                </div>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between items-center gap-4">
            <button id="prev-btn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-5 py-2.5 rounded-lg font-medium shadow transition disabled:opacity-40 disabled:cursor-not-allowed">
                ← Previous
            </button>
            <button id="next-btn" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-6 py-2.5 rounded-lg font-bold shadow transition">
                Next →
            </button>
        </div>

    </main>

        // Process questions to randomly shuffle options dynamically for zero-repetition pattern
        let quizData = [];
        let currentIndex = 0;
        let score = 0;
        let userAnswers = {};

        function initQuizData() {
            quizData = rawQuestions.map((q) => {
                let optionsWithOriginalIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                
                // Fisher-Yates shuffle options
                for (let i = optionsWithOriginalIndex.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithOriginalIndex[i], optionsWithOriginalIndex[j]] = [optionsWithOriginalIndex[j], optionsWithOriginalIndex[i]];
                }

                const newCorrectIndex = optionsWithOriginalIndex.findIndex(o => o.originalIndex === q.correct);

                return {
                    id: q.id,
                    en: q.en,
                    hi: q.hi,
                    options: optionsWithOriginalIndex.map(o => o.text),
                    correct: newCorrectIndex,
                    hint: q.hint,
                    explanation: q.explanation
                };
            });
            userAnswers = {};
            score = 0;
        }

        // UI Element References
        const questionTextEn = document.getElementById('question-text-en');
        const questionTextHi = document.getElementById('question-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const questionTracker = document.getElementById('question-tracker');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');

        function loadQuestion(index) {
            const currentQ = quizData[index];
            questionTracker.textContent = `Question ${index + 1} of ${quizData.length}`;
            progressBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
            
            questionTextEn.textContent = `${index + 1}. ${currentQ.en}`;
            questionTextHi.textContent = `${currentQ.hi}`;

            optionsContainer.innerHTML = '';
            hintBox.classList.add('hidden');
            hintBox.textContent = currentQ.hint;

            const hasAnswered = userAnswers.hasOwnProperty(index);

            currentQ.options.forEach((opt, optIndex) => {
                const button = document.createElement('button');
                button.className = `w-full text-left p-3.5 rounded-lg border text-sm sm:text-base font-medium transition flex items-center justify-between `;
                
                if (!hasAnswered) {
                    button.className += `bg-slate-700/60 border-slate-600 hover:bg-slate-700 hover:border-amber-400 text-slate-200`;
                    button.onclick = () => selectOption(index, optIndex);
                } else {
                    const selectedOpt = userAnswers[index];
                    if (optIndex === currentQ.correct) {
                        button.className += `bg-emerald-900/60 border-emerald-500 text-emerald-200 font-bold`;
                    } else if (optIndex === selectedOpt) {
                        button.className += `bg-rose-900/60 border-rose-500 text-rose-200`;
                    } else {
                        button.className += `bg-slate-800 border-slate-700 text-slate-500 opacity-60`;
                    }
                    button.disabled = true;
                }

                const prefix = String.fromCharCode(65 + optIndex);
                button.innerHTML = `<span><strong class="text-amber-400 mr-2">${prefix}.</strong> ${opt}</span>`;
                optionsContainer.appendChild(button);
            });

            if (hasAnswered) {
                explanationText.textContent = currentQ.explanation;
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            prevBtn.disabled = index === 0;
            if (index === quizData.length - 1) {
                nextBtn.textContent = 'Finish Quiz';
            } else {
                nextBtn.textContent = 'Next →';
            }
        }

        function selectOption(qIndex, selectedOptIndex) {
            userAnswers[qIndex] = selectedOptIndex;
            if (selectedOptIndex === quizData[qIndex].correct) {
                score++;
            }
            scoreDisplay.textContent = `${score} / ${quizData.length}`;
            loadQuestion(qIndex);
        }

        // Event Listeners
        hintBtn.addEventListener('click', () => {
            hintBox.classList.toggle('hidden');
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`Quiz Completed! Final Score: ${score} out of ${quizData.length}`);
            }
        });

        jumpBtn.addEventListener('click', () => {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion(currentIndex);
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        });

        // Initialize application
        initQuizData();
        loadQuestion(0);
    </script>
