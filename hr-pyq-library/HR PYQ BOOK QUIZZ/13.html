                q_en: "Who wrote the culturally rich book 'Apne Reeti-Riwaj' on Haryana's traditions?",
                correct: "सुगेर चंद (सोनीपत)",
                wrong: ["राजकुमार भारद्वाज", "मुरारी लाल", "राजाराम शास्त्री"],
                hint_hi: "इनका संबंध सोनीपत जिले से है।",
                hint_en: "The author belongs to Sonipat district.",
                exp_hi: "हरियाणा के रीति-रिवाजों पर रचित प्रसिद्ध पुस्तक 'अपने रीति-रिवाज' के लेखक सुगेर चंद (सोनीपत) हैं।",
                exp_en: "The book 'Apne Reeti-Riwaj' detailing Haryanvi customs was authored by Suger Chand of Sonipat."
            },
            {
                page: 29,
                q_hi: "हरियाणा सरकार का प्रथम पूर्णतः 'पेपरलेस विभाग' (Paperless Department) कौन सा है?",
                q_en: "Which was the first fully 'Paperless Department' of the Haryana Government?",
                correct: "औद्योगिक प्रशिक्षण विभाग (Industrial Training Dept)",
                wrong: ["राजस्व विभाग", "शिक्षा विभाग", "वित्त विभाग"],
                hint_hi: "यह ITI और तकनीकी कौशल विकास से संबंधित विभाग है।",
                hint_en: "Department dealing with ITI and technical skill development.",
                exp_hi: "हरियाणा का औद्योगिक प्रशिक्षण विभाग (Industrial Training Department / ITI) राज्य का पहला 100% पेपरलेस विभाग बना।",
                exp_en: "The Industrial Training Department became the first department in Haryana to operate completely paperless."
            }
        ];

        // Process questions into active state (Shuffle Options per Question)
        let allQuestions = [];
        let currentFilteredQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let answeredQuestions = new Set();
        let currentFilter = 'all';

        function initializeQuizData() {
            allQuestions = rawQuestionsData.map((q, idx) => {
                // Build options array
                let opts = [
                    { text: q.correct, isCorrect: true },
                    ...q.wrong.map(w => ({ text: w, isCorrect: false }))
                ];
                
                // Shuffle options programmatically
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }

                return {
                    id: idx + 1,
                    page: q.page,
                    q_hi: q.q_hi,
                    q_en: q.q_en,
                    options: opts,
                    hint_hi: q.hint_hi,
                    hint_en: q.hint_en,
                    exp_hi: q.exp_hi,
                    exp_en: q.exp_en,
                    userSelected: null
                };
            });

            currentFilteredQuestions = [...allQuestions];
            renderQuestion();
        }

        function filterQuestions(filterType) {
            currentFilter = filterType;
            const btnAll = document.getElementById('btn-filter-all');
            const btnP28 = document.getElementById('btn-filter-p28');
            const btnP29 = document.getElementById('btn-filter-p29');

            // Reset button styles
            [btnAll, btnP28, btnP29].forEach(btn => {
                btn.className = "px-3 py-1.5 text-xs font-semibold rounded-md bg-slate-200 text-slate-700 hover:bg-slate-300 transition";
            });

            if (filterType === 'all') {
                btnAll.className = "px-3 py-1.5 text-xs font-bold rounded-md bg-indigo-600 text-white transition";
                currentFilteredQuestions = [...allQuestions];
                document.getElementById('current-source-badge').innerText = "Page 28 & 29";
            } else if (filterType === 'p28') {
                btnP28.className = "px-3 py-1.5 text-xs font-bold rounded-md bg-indigo-600 text-white transition";
                currentFilteredQuestions = allQuestions.filter(q => q.page === 28);
                document.getElementById('current-source-badge').innerText = "Page 28";
            } else if (filterType === 'p29') {
                btnP29.className = "px-3 py-1.5 text-xs font-bold rounded-md bg-indigo-600 text-white transition";
                currentFilteredQuestions = allQuestions.filter(q => q.page === 29);
                document.getElementById('current-source-badge').innerText = "Page 29";
            }

            currentIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            if (currentFilteredQuestions.length === 0) return;

            const q = currentFilteredQuestions[currentIndex];

            // Badges & Labels
            document.getElementById('question-index-badge').innerText = `Q ${currentIndex + 1} / ${currentFilteredQuestions.length}`;
            document.getElementById('source-page-tag').innerText = `Source: Page ${q.page}`;
            document.getElementById('jump-input').max = currentFilteredQuestions.length;
            document.getElementById('jump-input').value = currentIndex + 1;

            // Update Progress Bar
            const pct = ((currentIndex + 1) / currentFilteredQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            // Question Texts
            document.getElementById('q-text-hi').innerText = q.q_hi;
            document.getElementById('q-text-en').innerText = q.q_en;

            // Hints
            document.getElementById('hint-text-hi').innerText = q.hint_hi;
            document.getElementById('hint-text-en').innerText = q.hint_en;
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-btn-label').innerText = "Show Hint / संकेत देखें";

            // Explanations
            document.getElementById('exp-text-hi').innerText = q.exp_hi;
            document.getElementById('exp-text-en').innerText = q.exp_en;

            // Status Badge Reset
            const statusTag = document.getElementById('status-tag');
            const expBox = document.getElementById('exp-box');

            if (q.userSelected !== null) {
                expBox.classList.remove('hidden');
                statusTag.classList.remove('hidden');
                if (q.userSelected.isCorrect) {
                    statusTag.className = "text-xs font-bold px-3 py-1 rounded-md bg-emerald-100 text-emerald-800 border border-emerald-300";
                    statusTag.innerHTML = `<i class="fa-solid fa-[#008080] fa-circle-check mr-1"></i> Correct`;
                } else {
                    statusTag.className = "text-xs font-bold px-3 py-1 rounded-md bg-rose-100 text-rose-800 border border-rose-300";
                    statusTag.innerHTML = `<i class="fa-solid fa-[#008080] fa-circle-xmark mr-1"></i> Incorrect`;
                }
            } else {
                expBox.classList.add('hidden');
                statusTag.classList.add('hidden');
            }

            // Options Container
            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';

            const optionLabels = ['A', 'B', 'C', 'D'];

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-400 bg-white hover:bg-indigo-50/50 transition flex items-center justify-between group`;
                
                let optStateClass = "";
                if (q.userSelected !== null) {
                    btn.disabled = true;
                    if (opt.isCorrect) {
                        optStateClass = "correct-opt font-semibold";
                    } else if (q.userSelected === opt && !opt.isCorrect) {
                        optStateClass = "incorrect-opt font-semibold";
                    }
                }

                if (optStateClass) {
                    btn.className = `w-full text-left p-4 rounded-xl border-2 transition flex items-center justify-between ${optStateClass}`;
                }

                btn.onclick = () => selectOption(opt);

                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-8 h-8 rounded-lg bg-slate-100 text-slate-700 font-bold text-sm flex items-center justify-center border border-slate-300 group-hover:bg-indigo-600 group-hover:text-white transition">${optionLabels[idx]}</span>
                        <span class="text-sm md:text-base text-slate-800 font-medium leading-snug">${opt.text}</span>
                    </div>
                    ${q.userSelected === opt && opt.isCorrect ? '<i class="fa-solid fa-[#008080] fa-circle-check text-emerald-600 text-lg"></i>' : ''}
                    ${q.userSelected === opt && !opt.isCorrect ? '<i class="fa-solid fa-[#008080] fa-circle-xmark text-rose-600 text-lg"></i>' : ''}
                `;

                optsContainer.appendChild(btn);
            });

            // Update Nav Buttons
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === currentFilteredQuestions.length - 1;

            updateScoreDisplay();
        }

        function selectOption(selectedOpt) {
            const q = currentFilteredQuestions[currentIndex];
            if (q.userSelected !== null) return; // Prevent re-selection

            q.userSelected = selectedOpt;

            if (!answeredQuestions.has(q.id)) {
                answeredQuestions.add(q.id);
                if (selectedOpt.isCorrect) {
                    score++;
                }
            }

            renderQuestion();
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            const hintBtnLabel = document.getElementById('hint-btn-label');
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBtnLabel.innerText = "Hide Hint / संकेत छिपाएं";
            } else {
                hintBox.classList.add('hidden');
                hintBtnLabel.innerText = "Show Hint / संकेत देखें";
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentIndex < currentFilteredQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val >= 1 && val <= currentFilteredQuestions.length) {
                currentIndex = val - 1;
                renderQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${currentFilteredQuestions.length}`);
            }
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = `${score} / ${answeredQuestions.size}`;
        }

        // Keyboard Navigation Support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'ArrowLeft') prevQuestion();
        });

        // Initialize Application
        window.onload = initializeQuizData;
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
