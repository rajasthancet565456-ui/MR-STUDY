<style id="cosmic-readable-quiz-theme">
:root{--space:#e8dcff;--panel:#f3eaff;--panel2:#dcc6ff;--edge:#6a45bf;--glow:#d28b28;--accent:#d15f9f;--ink:#2c1b4d;--muted:#66547c;--mist:rgba(106,69,191,.2)}html{background:var(--space)}body{background:radial-gradient(ellipse 62% 45% at 90% -5%,rgba(209,95,159,.28),transparent 62%),radial-gradient(ellipse 55% 40% at 8% 100%,rgba(65,164,207,.26),transparent 64%),var(--space)!important;color:var(--ink)!important;min-height:100vh}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.78;background-image:radial-gradient(circle at 9% 18%,var(--glow) 0 1px,transparent 1.7px),radial-gradient(circle at 26% 69%,var(--edge) 0 .8px,transparent 1.5px),radial-gradient(circle at 68% 24%,var(--accent) 0 1px,transparent 1.8px),radial-gradient(circle at 88% 73%,#47a8d3 0 .8px,transparent 1.5px);background-size:220px 190px,300px 270px,260px 230px,340px 310px;z-index:-1}header{background:linear-gradient(105deg,var(--panel),var(--panel2))!important;border-color:rgba(106,69,191,.25)!important;box-shadow:0 7px 24px rgba(84,48,142,.14)!important}header h1{color:var(--edge)!important;text-shadow:none!important}header p,header .text-slate-400,header .text-indigo-200,header .text-indigo-300{color:var(--muted)!important}main>div,#quiz-card,.bg-slate-800,.bg-slate-900,.bg-indigo-900,.bg-indigo-950{background:linear-gradient(145deg,#f8f0ff,var(--panel))!important;border-color:rgba(106,69,191,.22)!important;color:var(--ink)!important;box-shadow:0 14px 35px rgba(84,48,142,.12)!important}.bg-slate-700,.bg-slate-100,.bg-slate-50{background:#eadffd!important;color:var(--ink)!important}.text-slate-100,.text-slate-200,.text-slate-300,.text-slate-400,.text-white,.text-slate-800,.text-slate-700,.text-slate-600{color:var(--ink)!important}.text-indigo-400,.text-indigo-300,.text-emerald-400,.text-yellow-300{color:var(--edge)!important}.border-slate-700,.border-slate-700\/60,.border-indigo-700,.border-slate-200{border-color:rgba(106,69,191,.25)!important}button:not(.bg-green-600):not(.bg-red-600){background:#f9f2ff!important;color:var(--ink)!important;border:1px solid rgba(106,69,191,.25)!important;box-shadow:0 3px 10px rgba(84,48,142,.09)!important}button.bg-indigo-600,button.bg-slate-800,button.bg-slate-900,button.bg-indigo-900{background:linear-gradient(120deg,var(--edge),var(--accent))!important;color:#fff!important;border:0!important}button.bg-indigo-600 *,button.bg-slate-800 *,button.bg-slate-900 *,button.bg-indigo-900 *{color:#fff!important}button:hover{filter:brightness(1.04);transform:translateY(-1px)}input,select,textarea{background:#f9f2ff!important;border-color:rgba(106,69,191,.35)!important;color:var(--ink)!important}input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--edge)!important;box-shadow:0 0 0 3px var(--mist)!important}.bg-indigo-500,#progress-bar{background:linear-gradient(90deg,var(--edge),var(--accent),var(--glow))!important}.rounded-2xl{border-radius:1.25rem!important}
</style></head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-amber-400">Haryana GK Quiz Portal</h1>
                <p class="text-xs text-slate-400">Questions 1783-1888 (90 Unique Exam Questions)</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">Score</span>
                    <span id="score-display" class="text-lg font-bold text-emerald-400">0 / 0</span>
                </div>
                <div class="w-24 bg-slate-700 h-3 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-amber-500 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow flex flex-col justify-center">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
            
            <!-- Question Top Nav -->
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-700 text-sm">
                <span id="question-number" class="font-semibold text-amber-400">Question 1 of 90</span>
                <div class="flex items-center gap-2">
                    <label for="jump-input" class="text-xs text-slate-400">Jump to:</label>
                    <input type="number" id="jump-input" min="1" max="90" class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-center text-xs focus:outline-none focus:border-amber-500">
                    <button id="jump-btn" class="bg-amber-600 hover:bg-amber-500 text-white px-2 py-1 rounded text-xs transition">Go</button>
                </div>
            </div>

            <!-- Question Text -->
            <div class="mb-6">
                <h2 id="question-en" class="text-lg font-semibold text-white mb-2"></h2>
                <h3 id="question-hi" class="text-base font-medium text-slate-300"></h3>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                <!-- Dynamic options generated by JS -->
            </div>

            <!-- Actions & Hint -->
            <div class="flex flex-wrap justify-between items-center gap-3 pt-2">
                <button id="hint-btn" class="text-xs text-amber-400 hover:underline focus:outline-none">💡 Show Hint</button>
                <div class="flex gap-2">
                    <button id="prev-btn" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm font-medium transition disabled:opacity-50">Previous</button>
                    <button id="next-btn" class="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded text-sm font-medium transition disabled:opacity-50">Next</button>
                </div>
            </div>

            <!-- Hint Box -->
            <div id="hint-box" class="hidden mt-4 p-3 bg-slate-900 border border-amber-500/30 rounded text-xs text-amber-300">
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden mt-4 p-4 bg-slate-900 border border-slate-700 rounded text-sm">
                <span class="font-bold block mb-1" id="result-status"></span>
                <p id="explanation-text" class="text-slate-300"></p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-3 text-center text-xs text-slate-500">
        HSSC & Railway Exam Prep Quiz &bull; Bilingual Data Engine
    </footer>

    <script>
        const rawDataset = [
            // Page 1 (45 Questions: 1783 - 1840)
            { id: 1783, en: "To whom did Appaji Khanderao give Jhajjar area after adopting him?", hi: "अप्पाजी खांडवी ने किसे गोद लेकर झज्जर का क्षेत्र सौंपा?", ans: "George Thomas / जॉर्ज थॉमस", hint: "An Irish adventurer who carved out an independent kingdom in Haryana.", exp: "Appaji Khanderao adopted George Thomas as his son and handed over the administration of the Jhajjar region to him." },
            { id: 1784, en: "Where is Navdeep Stadium located in Haryana?", hi: "नवदीप स्टेडियम कहाँ स्थित है?", ans: "Jind / जींद", hint: "Located in the heart of Haryana.", exp: "Navdeep Stadium is situated in the Jind district of Haryana." },
            { id: 1785, en: "Which place was the city of King Ikshvaku during the Mahabharata period?", hi: "महाभारत काल में राजा इक्ष्वाकु की नगरी कौन-सी थी?", ans: "Ramrai / रामराय", hint: "Situated in Jind district.", exp: "Ramrai (in Jind district) was associated with King Ikshvaku during the Mahabharata era." },
            { id: 1787, en: "With which Rishi is the Aasan Tirth of Jind associated?", hi: "जींद का आसन तीर्थ किस ऋषि से संबंधित है?", ans: "Jamadagni / जमदग्नि", hint: "Father of Lord Parashurama.", exp: "Aasan Tirth in Jind district is historically connected to Maharishi Jamadagni." },
            { id: 1788, en: "When was Bhuteshwar Temple built by Raghubir Singh?", hi: "रघुवीर सिंह द्वारा भूतेश्वर मंदिर का निर्माण कब किया गया?", ans: "1864 AD / 1864 ई.", hint: "Built in the 1860s.", exp: "Raja Raghubir Singh constructed the famous Bhuteshwar Temple in Jind in 1864." },
            { id: 1789, en: "Where is the famous Khwaja ki Sarai located in Haryana?", hi: "हरियाणा में प्रसिद्ध ख्वाजा की सराय कहाँ है?", ans: "Faridabad / फरीदाबाद", hint: "An industrial hub near Delhi.", exp: "Khwaja ki Sarai is an ancient monument located in the Faridabad district." },
            { id: 1790, en: "Where is the famous Chitta Mandir located?", hi: "प्रसिद्ध चिट्टा मंदिर कहाँ है?", ans: "Yamunanagar / यमुनानगर", hint: "Located near the banks of the Yamuna river.", exp: "Chitta Mandir, known for its white Hanuman idol, is in Yamunanagar." },
            { id: 1791, en: "Hariras book belongs to which 14th-century writer?", hi: "14वीं शताब्दी के साहित्यकार ईसरदास की पुस्तक कौन सी है?", ans: "Hariras / हरिरस", hint: "Written by Isardas.", exp: "Isardas, a prominent literary figure of the 14th century, authored the religious text 'Hariras'." },
            { id: 1792, en: "Which city was known by the name 'Udaya Nagari' during Ashoka's time?", hi: "अशोक के समय उदया नगरी के नाम से किसे जाना जाता था?", ans: "Fatehabad / फतेहाबाद", hint: "Founded by Firoz Shah Tughlaq later on.", exp: "Fatehabad was historically known as 'Udaya Nagari' during the Ashokan period." },
            { id: 1793, en: "Sheikh Usman Zinda Peer is associated with which place?", hi: "शेख उरमान जिंदा पीर का संबंध कहाँ से है?", ans: "Panipat / पानीपत", hint: "The city of weavers.", exp: "The tomb/shrine of Sheikh Usman Zinda Peer is located in Panipat." },
            { id: 1794, en: "Where is Chilli Wala Shri Krishna Temple located?", hi: "चिल्ली वाला श्री कृष्ण मंदिर कहाँ स्थित है?", ans: "Fatehabad / फतेहाबाद", hint: "Also known for the Firoz Shah Palace.", exp: "Chilli Wala Shri Krishna Mandir is situated in Fatehabad district." },
            { id: 1795, en: "When did the war between Najib ad-Dawlah and Jat King Jawahar Singh take place?", hi: "नजीबुद्दौला और जाट राजा जवाहर सिंह के मध्य युद्ध कब हुआ?", ans: "1764 AD / 1764 ई.", hint: "Same year as the Battle of Buxar.", exp: "The battle between Rohilla chief Najib ad-Dawlah and Maharaja Jawahar Singh occurred in 1764." },
            { id: 1796, en: "When did the Tilpat War take place between Aurangzeb and Gokula Jat?", hi: "औरंगजेब व गोकुला जाट के मध्य तिलपत का युद्ध कब हुआ?", ans: "1669 AD / 1669 ई.", hint: "Late 17th century.", exp: "The Battle of Tilpat was fought between Mughal Emperor Aurangzeb and Gokula Jat in 1669." },
            { id: 1798, en: "Where is the tomb of Pranpir Badshah located?", hi: "प्राणपीर बादशाह का मकबरा कहाँ है?", ans: "Hisar / हिसार", hint: "City founded by Firoz Shah Tughlaq.", exp: "The tomb of Pranpir Badshah is a notable historic monument in Hisar." },
            { id: 1799, en: "Which Haryana musical instrument is shaped like two brass-jointed cups?", hi: "हरियाणा का यह वाद्य यंत्र पीतल के बने दो झांझ वाले कप की आकृति का होता है?", ans: "Manjira / मंजीरा", hint: "Used during devotional bhajans.", exp: "Manjira is a traditional percussion instrument made of two brass cymbals/cups." },
            { 1800: 1800, en: "Who built Shri Digambar Jain Mandir in Hisar?", hi: "श्री दिगंबर जैन मंदिर हिसार का निर्माण किसने करवाया?", ans: "Shuganchand / शुगनचंद", hint: "Built by a prominent Jain devotee.", exp: "Shri Digambar Jain Mandir in Hisar was constructed by Shuganchand." },
            { id: 1801, en: "Where is Shri Kaleshwar Mahadev Math located in Haryana?", hi: "हरियाणा में श्री कालेश्वर महादेव मठ कहाँ है?", ans: "Yamunanagar / यमुनानगर", hint: "Near Kalesar National Park.", exp: "Shri Kaleshwar Mahadev Math is located near the Kalesar region in Yamunanagar." },
            { id: 1802, en: "What is 'Rupya Potda' in Haryanvi tradition?", hi: "हरियाणा में 'रुपया पोतडा' क्या है?", ans: "Ritual on child birth / बच्चा पैदा होने की रस्म", hint: "A cultural tradition following childbirth.", exp: "'Rupya Potda' is a traditional gift/custom observed upon the birth of a newborn in Haryana." },
            { id: 1803, en: "Pathwari Mata is associated with which ritual?", hi: "पथवारी माता का संबंध है?", ans: "Unmarried girls seeking a suitable spouse / कुआरी कन्या पति कामना के लिए", hint: "Worshipped for marital bliss.", exp: "Pathwari Mata is traditionally worshipped by unmarried girls praying for a good husband." },
            { id: 1804, en: "When was the Archaeological Museum of Jhajjar established?", hi: "झज्जर का पुरातात्विक संग्रहालय कब बनाया गया?", ans: "1959 AD / 1959 ई.", hint: "Established by Swami Omanand Saraswati.", exp: "The Jhajjar Archaeological Museum, the largest in Haryana, was established in 1959." },
            { id: 1805, en: "Which place is known as the 'City of 360 Bridges/Vehicles'?", hi: "360 गाड़ियों/बावड़ियों का शहर किसे कहा जाता है?", ans: "Pinjore / पिंजौर", hint: "Famous for Yadavindra Gardens.", exp: "Pinjore is traditionally referred to as the city of 360 baolis/vehicles." },
            { id: 1806, en: "Where is the Dargah of Syed Sharif located?", hi: "सैयद शरीफ की दरगाह कहाँ स्थित है?", ans: "Hodal / होडल", hint: "Located in Palwal district.", exp: "The shrine of Syed Sharif is situated at Hodal." },
            { id: 1807, en: "What is the new name of Mustafabad in Haryana?", hi: "मुस्तफाबाद का नया नाम क्या है?", ans: "Saraswati Nagar / सरस्वती नगर", hint: "Renamed after the holy river.", exp: "Mustafabad in Yamunanagar district was officially renamed Saraswati Nagar." },
            { id: 1809, en: "Where is Chabutra-e-Fateh Mubarak situated?", hi: "चबूतरा ए फतेह मुबारक कहाँ स्थित है?", ans: "Panipat / पानीपत", hint: "Historic battleground city.", exp: "Chabutra-e-Fateh Mubarak is a historical platform located in Panipat." },
            { id: 1810, en: "Sheikh Anamullah is associated with which region?", hi: "शेख अनाम उल्ला का संबंध है?", ans: "Panipat / पानीपत", hint: "Famous for Sufi saints.", exp: "Sufi saint Sheikh Anamullah is historically linked to Panipat." },
            { id: 1811, en: "Who settled the town of Samalkha?", hi: "समालखां किसके द्वारा बसाया गया?", ans: "Ismail Khan / इस्माइल खां", hint: "Named after its founder.", exp: "The town of Samalkha in Panipat district was founded by Ismail Khan." },
            { id: 1812, en: "Who was the Chairman of Haryana Staff Selection Commission (HSSC)?", hi: "हरियाणा कर्मचारी चयन आयोग के अध्यक्ष (पूर्व) कौन रहे?", ans: "Himmat Singh / हिम्मत सिंह", hint: "Prominent administrative appointment.", exp: "Himmat Singh served as the Chairman of HSSC." },
            { id: 1813, en: "When was the foundation of Mahatma Gandhi Ashram laid in Palwal by Netaji Subhash Chandra Bose?", hi: "नेताजी सुभाष चंद्र बोस द्वारा महात्मा गांधी आश्रम की नींव पलवल में कब रखी गई?", ans: "1938 AD / 1938 ई.", hint: "Late 1930s.", exp: "Netaji Subhash Chandra Bose laid the foundation stone of Mahatma Gandhi Ashram in Palwal in 1938." },
            { id: 1814, en: "From whom did the King of Sirmour buy Pinjore Garden, and who was the ruler of Patiala then?", hi: "सिरमौर के राजा से अमर सिंह ने पिंजौर गार्डन को खरीदा, अमर सिंह कहाँ के शासक थे?", ans: "Patiala / पटियाला", hint: "Princely state of Punjab/Haryana.", exp: "Raja Amar Singh, ruler of Patiala, acquired the historic Pinjore Garden." },
            { id: 1815, en: "In which ancient book is Kalka referred to as 'Kalkuta'?", hi: "कालका को (कालकुटा) किस पुस्तक में कहा गया है?", ans: "Ashtadhyayi / अष्टाध्यायी", hint: "Authored by Panini.", exp: "Panini's Sanskrit treatise 'Ashtadhyayi' refers to modern Kalka as Kalkuta." },
            { id: 1816, en: "On the pattern of which garden was the Mughal Garden (Pinjore) designed?", hi: "मुगल गार्डन किस गार्डन के तर्ज पर बनाया गया था?", ans: "Shalimar Bagh, Lahore / शालीमार बाग, लाहौर", hint: "Famous Mughal garden in Lahore.", exp: "The Pinjore Mughal Garden was modeled after the Shalimar Bagh of Lahore." },
            { id: 1817, en: "For which industry is the Gurugram-Manesar-Bawal region famous?", hi: "हरियाणा का गुरुग्राम-मानसर-बावल क्षेत्र किस उत्पाद हेतु प्रसिद्ध है?", ans: "Automobile / ऑटोमोबाइल", hint: "Hub for Maruti Suzuki and major OEMs.", exp: "The Gurugram-Manesar-Bawal belt is world-renowned as an automobile manufacturing hub." },
            { id: 1818, en: "Where is the cluster of seven tombs located in Haryana?", hi: "हरियाणा में सात मकबरों का समूह कहाँ विद्यमान है?", ans: "Jhajjar / झज्जर", hint: "City of martyrs.", exp: "The famous cluster of seven historical tombs is situated in Jhajjar." },
            { id: 1819, en: "In 1861, King Karam Singh of Patiala built a temple at which place in Haryana?", hi: "पटियाला के रियासत के राजा कर्मसिंह ने 1861 में कहाँ मंदिर बनवाया?", ans: "Panchkula (Mata Mansa Devi) / पंचकूला", hint: "Near Chandigarh.", exp: "Raja Karam Singh of Patiala constructed the main temple at Mata Mansa Devi complex in Panchkula in 1861." },
            { id: 1820, en: "What is the geographical shape of Haryana state?", hi: "हरियाणा की आकृति कैसी है?", ans: "Rhomboid / विषमबाहु चतुर्भुज", hint: "Irregular quadrilateral.", exp: "The outline map of Haryana resembles an irregular quadrilateral or rhomboid shape." },
            { id: 1821, en: "When did the construction of Markanda Nangal Dam begin?", hi: "हरियाणा में मारकंडा नांगल बांध का निर्माण कब शुरू हुआ?", ans: "1963 AD / 1963 ई.", hint: "Early 1960s.", exp: "Construction on the Markanda Nangal Dam initiated in the year 1963." },
            { id: 1822, en: "In which district is the famous Crafts Fair (Surajkund) held in Haryana?", hi: "हरियाणा में लगने वाला हस्तशिल्प मेला (सूरजकुंड) किस जिले में लगता है?", ans: "Faridabad / फरीदाबाद", hint: "Annual international craft fair.", exp: "The world-famous Surajkund International Crafts Mela takes place in Faridabad." },

            { id: 1825, en: "Where is Bibi Pur Lake situated in Haryana?", hi: "हरियाणा में बीबीपुर झील कहाँ है?", ans: "Kurukshetra / कुरुक्षेत्र", hint: "Holy city of Haryana.", exp: "Bibi Pur Lake is located in the Kurukshetra district." },

            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }

            return {
                ...item,
                options: options
            };
        });

        // App State
        let currentIndex = 0;
        let score = 0;
        let answeredQuestions = {};

        // DOM Elements
        const questionNumberEl = document.getElementById('question-number');
        const questionEnEl = document.getElementById('question-en');
        const questionHiEl = document.getElementById('question-hi');
        const optionsContainerEl = document.getElementById('options-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const resultStatusEl = document.getElementById('result-status');
        const explanationTextEl = document.getElementById('explanation-text');
        const scoreDisplayEl = document.getElementById('score-display');
        const progressBarEl = document.getElementById('progress-bar');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');

        function loadQuestion(index) {
            const q = questions[index];
            questionNumberEl.innerText = `Question ${index + 1} of ${questions.length} (ID: #${q.id})`;
            questionEnEl.innerText = `${index + 1}. ${q.en}`;
            questionHiEl.innerText = `${q.hi}`;

            // Reset Boxes
            hintBox.classList.add('hidden');
            hintBox.innerText = '';
            explanationBox.classList.add('hidden');

            // Render Options
            optionsContainerEl.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-3 rounded-lg border border-slate-700 bg-slate-900/50 hover:bg-slate-700 transition flex items-start gap-3 text-sm text-slate-200`;
                btn.innerHTML = `<span class="font-bold text-amber-400 bg-slate-800 border border-slate-600 rounded px-2 py-0.5 text-xs">${labels[idx]}</span> <span>${opt}</span>`;
                
                if (answeredQuestions[index] !== undefined) {
                    btn.disabled = true;
                    if (opt === q.ans) {
                        btn.classList.add('border-emerald-500', 'bg-emerald-950/40', 'text-emerald-300');
                    }
                    if (answeredQuestions[index] === opt && opt !== q.ans) {
                        btn.classList.add('border-rose-500', 'bg-rose-950/40', 'text-rose-300');
                    }
                } else {
                    btn.onclick = () => selectOption(index, opt);
                }

                optionsContainerEl.appendChild(btn);
            });

            // Show explanation if already answered
            if (answeredQuestions[index] !== undefined) {
                showExplanation(index, answeredQuestions[index] === q.ans);
            }

            // Update Navigation Buttons
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === questions.length - 1;

            // Update Progress Bar
            progressBarEl.style.width = `${((index + 1) / questions.length) * 100}%`;
        }

        function selectOption(index, selectedOpt) {
            const q = questions[index];
            const isCorrect = selectedOpt === q.ans;
            
            answeredQuestions[index] = selectedOpt;

            if (isCorrect) {
                score++;
            }

            updateScore();
            loadQuestion(index);
        }

        function showExplanation(index, isCorrect) {
            const q = questions[index];
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                resultStatusEl.innerText = "✓ Correct Answer!";
                resultStatusEl.className = "font-bold text-emerald-400 block mb-1";
            } else {
                resultStatusEl.innerText = `✗ Incorrect! Correct Answer: ${q.ans}`;
                resultStatusEl.className = "font-bold text-rose-400 block mb-1";
            }
            explanationTextEl.innerText = q.exp;
        }

        function updateScore() {
            const totalAnswered = Object.keys(answeredQuestions).length;
            scoreDisplayEl.innerText = `${score} / ${totalAnswered}`;
        }

        // Event Listeners
        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        };

        nextBtn.onclick = () => {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            }
        };

        hintBtn.onclick = () => {
            const q = questions[currentIndex];
            hintBox.innerText = `Hint: ${q.hint}`;
            hintBox.classList.toggle('hidden');
        };

        jumpBtn.onclick = () => {
            const target = parseInt(jumpInput.value) - 1;
            if (target >= 0 && target < questions.length) {
                currentIndex = target;
                loadQuestion(currentIndex);
            }
        };

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            } else if (e.key === 'ArrowRight' && currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            }
        });

        // Initialize First Question
        loadQuestion(0);
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
