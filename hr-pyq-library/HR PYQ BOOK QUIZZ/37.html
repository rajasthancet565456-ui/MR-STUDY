                <h1 class="text-2xl font-bold tracking-wide text-amber-400">Haryana GK Quiz</h1>

                <div class="h-4 w-[1px] bg-slate-700"></div>
                <div class="text-sm">Progress: <span id="progress-text" class="font-bold text-amber-400">1/90</span></div>

            <div id="progress-bar" class="bg-amber-400 h-full transition-all duration-300" style="width: 1.11%;"></div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl mx-auto w-full p-4 sm:p-6 my-auto">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl relative">
            
            <!-- Question Meta Header -->
            <div class="flex justify-between items-center mb-4 text-xs font-semibold uppercase tracking-wider text-slate-400">
                <span id="q-source-tag" class="bg-slate-700 px-2.5 py-1 rounded text-amber-300">Question 1</span>
                <span id="q-category-tag" class="text-slate-400">Haryana General Knowledge</span>
            </div>

            <!-- Question Statements (Bilingual) -->
            <div class="mb-6 space-y-2">
                <h2 id="q-text-en" class="text-lg sm:text-xl font-semibold text-white leading-snug"></h2>
                <h3 id="q-text-hi" class="text-base sm:text-lg font-medium text-amber-200/90 leading-snug"></h3>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected option buttons -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs text-amber-400 hover:text-amber-300 flex items-center gap-1 underline focus:outline-none">
                    <span>💡 Toggle Hint</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-slate-900/60 border border-slate-700/60 rounded-lg text-xs text-slate-300">
                    <p id="hint-text"></p>
                </div>
            </div>

            <!-- Explanation Box (Hidden initially) -->
            <div id="explanation-box" class="hidden mb-6 p-4 rounded-xl border transition-all">
                <h4 id="explanation-title" class="font-bold text-sm mb-1 flex items-center gap-2"></h4>
                <p id="explanation-text" class="text-xs sm:text-sm text-slate-300 leading-relaxed"></p>
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-700">
                <div class="flex items-center gap-2 w-full sm:w-auto justify-between">
                    <button onclick="prevQuestion()" id="prev-btn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:cursor-not-allowed text-sm font-medium rounded-lg transition">
                        ← Previous
                    </button>
                    <button onclick="nextQuestion()" id="next-btn" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold text-sm rounded-lg transition">
                        Next →
                    </button>
                </div>

                <!-- Jump to Question Input -->
                <div class="flex items-center gap-2 text-xs text-slate-400">
                    <span>Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="90" class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-center text-white focus:outline-none focus:border-amber-400" onchange="jumpToQuestion(this.value)">
                    <span>/ 90</span>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">

                hi: "उत्तरी हरियाणा के जिलों में शिवालिक तलहटी से जुड़ी एक प्रमुख सामान्य भौगोलिक विशेषता क्या है?",
                options: ["Seasonal hill streams locally known as Chos / मौसमी नदियां (चो)", "Desert sand dunes / मरे हुए रेत के टीले", "Extensive laterite plateau / लैटेराइट पठार", "Deep perennial fjords / गहरी बारहमासी फोजर्ड"],
                correct: 0,
                hint: "Seasonal torrents flowing down the hills called Chos.",
                explanation: "Correct Answer: Seasonal hill streams locally known as Chos (मौसमी नदियां)."
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        // DOM Elements
        const qSourceTag = document.getElementById('q-source-tag');
        const qTextEn = document.getElementById('q-text-en');
        const qTextHi = document.getElementById('q-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationTitle = document.getElementById('explanation-title');
        const explanationText = document.getElementById('explanation-text');
        const scoreDisplay = document.getElementById('score-display');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentIndex];
            qSourceTag.textContent = `Question ${currentIndex + 1} (${q.source})`;
            qTextEn.textContent = q.en;
            qTextHi.textContent = q.hi;
            hintText.textContent = q.hint;
            hintBox.classList.add('hidden');
            explanationBox.classList.add('hidden');

            // Render options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/50 hover:bg-slate-700/50 text-slate-200 text-sm sm:text-base font-medium transition flex items-center justify-between group";
                
                let optionLetter = String.fromCharCode(65 + idx);
                btn.innerHTML = `<span><strong class="text-amber-400 mr-2">${optionLetter}.</strong> ${opt}</span>`;
                
                // If already answered, show state
                if (userAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                    if (idx === q.correct) {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-green-500 bg-green-950/40 text-green-200 text-sm sm:text-base font-medium flex items-center justify-between";
                    } else if (userAnswers[currentIndex] === idx) {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-red-500 bg-red-950/40 text-red-200 text-sm sm:text-base font-medium flex items-center justify-between";
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                optionsContainer.appendChild(btn);
            });

            // If already answered, reveal explanation
            if (userAnswers[currentIndex] !== null) {
                showExplanation(userAnswers[currentIndex] === q.correct, q.explanation);
            }

            // Update Navigation state
            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? "Finish / Review" : "Next →";
            progressText.textContent = `${currentIndex + 1}/${quizData.length}`;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            jumpInput.value = currentIndex + 1;
            scoreDisplay.textContent = score;
        }

        function selectOption(selectedIndex) {
            const q = quizData[currentIndex];
            userAnswers[currentIndex] = selectedIndex;
            const isCorrect = selectedIndex === q.correct;

            if (isCorrect) {
                score++;
                scoreDisplay.textContent = score;
            }

            // Disable all option buttons and highlight correct/incorrect
            const buttons = optionsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === q.correct) {
                    buttons[i].className = "w-full text-left p-3.5 rounded-xl border border-green-500 bg-green-950/40 text-green-200 text-sm sm:text-base font-medium flex items-center justify-between";
                } else if (i === selectedIndex) {
                    buttons[i].className = "w-full text-left p-3.5 rounded-xl border border-red-500 bg-red-950/40 text-red-200 text-sm sm:text-base font-medium flex items-center justify-between";
                }
            }

            showExplanation(isCorrect, q.explanation);
        }

        function showExplanation(isCorrect, explanationString) {
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mb-6 p-4 rounded-xl border border-green-600/50 bg-green-950/20 transition-all";
                explanationTitle.className = "font-bold text-sm mb-1 flex items-center gap-2 text-green-400";
                explanationTitle.innerHTML = "✅ Correct Answer!";
            } else {
                explanationBox.className = "mb-6 p-4 rounded-xl border border-red-600/50 bg-red-950/20 transition-all";
                explanationTitle.className = "font-bold text-sm mb-1 flex items-center gap-2 text-red-400";
                explanationTitle.innerHTML = "❌ Incorrect Answer";
            }
            explanationText.textContent = explanationString;
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            let qNum = parseInt(val);
            if (qNum >= 1 && qNum <= quizData.length) {
                currentIndex = qNum - 1;
                loadQuestion();
            } else {
                jumpInput.value = currentIndex + 1;
            }
        }

        // Initial Load
        window.onload = loadQuestion;
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
