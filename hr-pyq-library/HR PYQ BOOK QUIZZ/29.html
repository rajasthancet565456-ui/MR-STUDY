<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', 'Hind', sans-serif;
        }
        .option-btn {
            transition: all 0.2s ease-in-out;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header & Navigation Bar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-amber-400">Haryana GK Interactive Quiz</h1>
                <p class="text-xs text-slate-400">Based on Authentic Exam Source (Pages 60 & 61)</p>
            </div>
            
            <!-- Filter & Score Tracker -->
            <div class="flex items-center gap-3">
                <select id="page-filter" onchange="filterQuestions()" class="bg-slate-700 text-slate-200 text-sm rounded-lg px-3 py-1.5 border border-slate-600 focus:outline-none focus:border-amber-400">
                    <option value="all">All Pages (90 Questions)</option>
                    <option value="60">Page 60 (Q1 - Q45)</option>
                    <option value="61">Page 61 (Q46 - Q90)</option>
                </select>

                <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-semibold flex items-center gap-2">
                    <span class="text-emerald-400">✓ <span id="score-correct">0</span></span>
                    <span class="text-rose-400">✗ <span id="score-wrong">0</span></span>
                    <span class="text-slate-400">| <span id="score-progress">0/90</span></span>
                </div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-700 h-1.5">
            <div id="progress-bar" class="bg-amber-400 h-1.5 transition-all duration-300" style="width: 0%"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">
        <!-- Question Card Container -->
        <div id="quiz-card" class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl">
            <!-- Question Metadata Header -->
            <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-4">
                <span id="question-badge" class="bg-amber-500/10 text-amber-400 text-xs font-semibold px-3 py-1 rounded-full border border-amber-500/30">
                    Question 1 of 90
                </span>
                <span id="page-badge" class="text-xs text-slate-400 font-medium">
                    Source: Page 60 (Item #2581)
                </span>
            </div>

            <!-- Question Statements (Bilingual) -->
            <div class="mb-6 space-y-2">
                <h2 id="q-text-en" class="text-lg md:text-xl font-semibold text-slate-100 leading-snug">
                    Loading Question...
                </h2>
                <h3 id="q-text-hi" class="text-base md:text-lg font-medium text-amber-200/90 leading-relaxed font-serif">
                    प्रश्न लोड हो रहा है...
                </h3>
            </div>

            <!-- Hint Section (Collapsible) -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs bg-slate-700/60 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-md border border-slate-600 flex items-center gap-1.5 transition-colors">
                    💡 <span id="hint-btn-label">Show Hint / संकेत देखें</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-950/30 border border-amber-500/30 rounded-lg text-xs text-amber-200/90">
                    <p id="hint-en"></p>
                    <p id="hint-hi" class="mt-1"></p>
                </div>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="grid grid-cols-1 gap-3 mb-6">
                <!-- Options populated dynamically -->
            </div>

            <!-- Explanation / Rationale Box -->
            <div id="explanation-box" class="hidden p-4 rounded-xl border transition-all">
                <h4 id="explanation-title" class="font-bold text-sm mb-2 flex items-center gap-2"></h4>
                <p id="exp-text-en" class="text-sm text-slate-200 mb-1"></p>
                <p id="exp-text-hi" class="text-sm text-slate-300 font-serif"></p>
            </div>
        </div>
    </main>

    <!-- Navigation & Jump Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 px-4 sticky bottom-0">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <button onclick="prevQuestion()" id="prev-btn" class="bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:hover:bg-slate-700 text-slate-100 text-sm font-semibold px-4 py-2 rounded-lg transition-colors">
                    ← Previous
                </button>
                <button onclick="nextQuestion()" id="next-btn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm px-5 py-2 rounded-lg transition-colors">
                    Next →
                </button>
            </div>

            <!-- Jump to Question Input -->
            <div class="flex items-center gap-2">
                <label for="jump-input" class="text-xs text-slate-400">Jump to:</label>
                <input type="number" id="jump-input" min="1" max="90" placeholder="1" class="w-16 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-center text-slate-200 focus:outline-none focus:border-amber-400">
                <button onclick="jumpToQuestion()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg transition-colors text-slate-200">
                    Go
                </button>
                <button onclick="resetQuiz()" class="bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800 text-xs px-3 py-1.5 rounded-lg transition-colors ml-2">
                    Reset
                </button>
            </div>
        </div>
    </footer>

        // App State
        let currentQuestions = [...rawDataset];
        let currentIndex = 0;
        let userAnswers = {}; // { qIndex: selectedOptionIndex }

        // Initialize App
        window.onload = function() {
            loadQuestion();
            updateScorecard();
        };

        function filterQuestions() {
            const filterValue = document.getElementById('page-filter').value;
            if (filterValue === '60') {
                currentQuestions = rawDataset.filter(q => q.page === 60);
            } else if (filterValue === '61') {
                currentQuestions = rawDataset.filter(q => q.page === 61);
            } else {
                currentQuestions = [...rawDataset];
            }
            currentIndex = 0;
            userAnswers = {};
            loadQuestion();
            updateScorecard();
        }

        function loadQuestion() {
            if (currentQuestions.length === 0) return;

            const q = currentQuestions[currentIndex];

            // Badges & Counters
            document.getElementById('question-badge').innerText = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
            document.getElementById('page-badge').innerText = `Source: Page ${q.page} (Ref #${q.item})`;

            // Question Texts
            document.getElementById('q-text-en').innerText = `${currentIndex + 1}. ${q.q_en}`;
            document.getElementById('q-text-hi').innerText = `प्रश्न: ${q.q_hi}`;

            // Reset Hint
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-en').innerText = `EN: ${q.hint_en}`;
            document.getElementById('hint-hi').innerText = `HI: ${q.hint_hi}`;

            // Options Container
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const isAnswered = userAnswers.hasOwnProperty(currentIndex);
            const selectedOpt = isAnswered ? userAnswers[currentIndex] : null;

            // Generate Options A, B, C, D
            q.options_en.forEach((optEn, idx) => {
                const optHi = q.options_hi[idx];
                const letter = String.fromCharCode(65 + idx);

                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border flex items-start gap-3 text-sm transition-all `;
                
                if (!isAnswered) {
                    btn.className += `bg-slate-700/50 hover:bg-slate-700 border-slate-600 text-slate-100`;
                    btn.onclick = () => selectOption(idx);
                } else {
                    btn.disabled = true;
                    if (idx === q.answer) {
                        // Correct Answer Style
                        btn.className += `bg-emerald-950/60 border-emerald-500 text-emerald-200 font-medium`;
                    } else if (idx === selectedOpt) {
                        // Wrong Choice Style
                        btn.className += `bg-rose-950/60 border-rose-500 text-rose-200`;
                    } else {
                        btn.className += `bg-slate-800/40 border-slate-700/60 text-slate-400 opacity-60`;
                    }
                }

                btn.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-slate-600 text-slate-200 text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">
                        ${letter}
                    </span>
                    <div class="space-y-0.5">
                        <p class="font-medium">${optEn}</p>
                        <p class="text-xs text-slate-300 font-serif">${optHi}</p>
                    </div>
                `;
                container.appendChild(btn);
            });

            // Handle Explanation Display
            const expBox = document.getElementById('explanation-box');
            if (isAnswered) {
                expBox.classList.remove('hidden');
                const isCorrect = selectedOpt === q.answer;
                
                expBox.className = `p-4 rounded-xl border ${isCorrect ? 'bg-emerald-950/30 border-emerald-500/40 text-emerald-100' : 'bg-rose-950/30 border-rose-500/40 text-rose-100'}`;
                
                document.getElementById('explanation-title').innerText = isCorrect ? '✓ Correct Answer / सही उत्तर!' : '✗ Incorrect Answer / गलत उत्तर!';
                document.getElementById('exp-text-en').innerText = `Explanation: ${q.exp_en}`;
                document.getElementById('exp-text-hi').innerText = `व्याख्या: ${q.exp_hi}`;
            } else {
                expBox.classList.add('hidden');
            }

            // Update Nav Buttons State
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === currentQuestions.length - 1;

            // Update Progress Bar
            const progPercent = ((currentIndex + 1) / currentQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progPercent}%`;
        }

        function selectOption(optIndex) {
            userAnswers[currentIndex] = optIndex;
            loadQuestion();
            updateScorecard();
        }

        function toggleHint() {
            const box = document.getElementById('hint-box');
            box.classList.toggle('hidden');
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function nextQuestion() {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val >= 1 && val <= currentQuestions.length) {
                currentIndex = val - 1;
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${currentQuestions.length}`);
            }
        }

        function updateScorecard() {
            let correct = 0;
            let wrong = 0;

            Object.keys(userAnswers).forEach(qIdx => {
                const q = currentQuestions[qIdx];
                if (q) {
                    if (userAnswers[qIdx] === q.answer) {
                        correct++;
                    } else {
                        wrong++;
                    }
                }
            });

            document.getElementById('score-correct').innerText = correct;
            document.getElementById('score-wrong').innerText = wrong;
            document.getElementById('score-progress').innerText = `${Object.keys(userAnswers).length}/${currentQuestions.length}`;
        }

        function resetQuiz() {
            if (confirm("Are you sure you want to reset all answers and start again?")) {
                userAnswers = {};
                currentIndex = 0;
                loadQuestion();
                updateScorecard();
            }
        }
    </script>
