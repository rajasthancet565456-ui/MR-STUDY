                    { text: "Jhajjar / झज्जर", correct: true },
                    { text: "Rewari / रेवाड़ी", correct: false },
                    { text: "Rohtak / रोहतक", correct: false },
                    { text: "Panipat / पानीपत", correct: false }
                ],
                hint: "Jhajjar district.",
                explanation: "Jhajjar district is renowned for crafting traditional earthen pottery known as 'Surahi'."
            },
            {
                page: "Page 4",
                eng: "Which dance form of Haryana is dedicated to Lord Shiva and Parvati? (Gangor Dance)",
                hin: "हरियाणा का कौन-सा नृत्य रूप शिव और पार्वती को समर्पित गणगौर नृत्य है?",
                options: [
                    { text: "Gangor Dance / गणगौर नृत्य", correct: true },
                    { text: "Loor Dance / लूर नृत्य", correct: false },
                    { text: "Phag Dance / फाग नृत्य", correct: false },
                    { text: "Dhamal Dance / धमाल नृत्य", correct: false }
                ],
                hint: "Gangor dance.",
                explanation: "Gangor dance is a traditional festive dance form of Haryana dedicated to Lord Shiva and Goddess Parvati."
            },
            {
                page: "Page 4",
                eng: "How many players from Haryana participated in the 2024 Paralympic Games? (22 players - won 8 medals: 5 gold & 3 silver)",
                hin: "2024 पैराओलंपिक खेलों में हरियाणा के कितने खिलाड़ियों ने हिस्सा लिया? 22 (8 पदक जीते - 5 स्वर्ण और 3 सिल्वर)",
                options: [
                    { text: "22 players (Won 8 medals: 5 Gold & 3 Silver) / 22 (8 पदक जीते - 5 स्वर्ण और 3 सिल्वर)", correct: true },
                    { text: "15 players / 15 खिलाड़ी", correct: false },
                    { text: "30 players / 30 खिलाड़ी", correct: false },
                    { text: "18 players / 18 खिलाड़ी", correct: false }
                ],
                hint: "22 players winning 8 medals.",
                explanation: "22 athletes from Haryana participated in the 2024 Paralympic Games, securing an impressive 8 medals including 5 golds and 3 silvers."
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        // DOM Element References
        const totalQuestionsEl = document.getElementById('total-questions');
        const currentScoreEl = document.getElementById('current-score');
        const progressBarEl = document.getElementById('progress-bar');
        const questionNumTag = document.getElementById('question-number-tag');
        const sourcePageLabel = document.getElementById('source-page-label');
        const currentPageTag = document.getElementById('current-page-tag');
        const questionEngEl = document.getElementById('question-eng');
        const questionHinEl = document.getElementById('question-hin');
        const optionsContainer = document.getElementById('options-container');
        const hintToggleBtn = document.getElementById('hint-toggle-btn');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationTitle = document.getElementById('explanation-title');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        totalQuestionsEl.textContent = quizData.length;

        // Shuffle function for options randomization
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Pre-shuffle options for each question once to keep position stable during review but random overall
        quizData.forEach(q => {
            if (!q.shuffledOptions) {
                q.shuffledOptions = shuffleArray([...q.options]);
            }
        });

        function loadQuestion(index) {
            const q = quizData[index];
            questionNumTag.textContent = `Question ${index + 1} of ${quizData.length}`;
            sourcePageLabel.textContent = `Source: ${q.page}`;
            currentPageTag.textContent = q.page;
            questionEngEl.textContent = `${index + 1}. ${q.eng}`;
            questionHinEl.textContent = q.hin;

            // Reset UI states
            hintBox.classList.add('hidden');
            hintToggleBtn.textContent = "💡 Show Hint / संकेत दिखाएँ";
            explanationBox.classList.add('hidden');

            // Render options
            optionsContainer.innerHTML = '';
            q.shuffledOptions.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-700/50 hover:bg-slate-700 text-slate-200 text-sm sm:text-base font-medium transition-all flex items-center justify-between group focus:outline-none";
                btn.innerHTML = `<span>${opt.text}</span>`;
                
                // Check if already answered
                if (userAnswers[index] !== null) {
                    btn.disabled = true;
                    if (opt.correct) {
                        btn.classList.remove('bg-slate-700/50', 'hover:bg-slate-700', 'border-slate-700');
                        btn.classList.add('bg-emerald-950/80', 'border-emerald-600', 'text-emerald-200');
                    } else if (userAnswers[index] === optIdx) {
                        btn.classList.remove('bg-slate-700/50', 'hover:bg-slate-700', 'border-slate-700');
                        btn.classList.add('bg-rose-950/80', 'border-rose-600', 'text-rose-200');
                    }
                } else {
                    btn.onclick = () => selectOption(optIdx, btn, q);
                }

                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation
            if (userAnswers[index] !== null) {
                showExplanation(q, userAnswers[index]);
            }

            // Update Progress & Controls
            progressBarEl.style.width = `${((index + 1) / quizData.length) * 100}%`;
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? "Finish / Review" : "Next →";
            jumpInput.value = index + 1;
        }

        function selectOption(optIdx, selectedBtn, q) {
            userAnswers[currentIndex] = optIdx;
            const isCorrect = q.shuffledOptions[optIdx].correct;

            if (isCorrect) {
                score++;
                currentScoreEl.textContent = score;
                selectedBtn.classList.remove('bg-slate-700/50', 'hover:bg-slate-700', 'border-slate-700');
                selectedBtn.classList.add('bg-emerald-950/80', 'border-emerald-600', 'text-emerald-200');
            } else {
                selectedBtn.classList.remove('bg-slate-700/50', 'hover:bg-slate-700', 'border-slate-700');
                selectedBtn.classList.add('bg-rose-950/80', 'border-rose-600', 'text-rose-200');
                
                // Highlight correct option
                const allBtns = optionsContainer.children;
                q.shuffledOptions.forEach((opt, idx) => {
                    if (opt.correct) {
                        allBtns[idx].classList.remove('bg-slate-700/50', 'hover:bg-slate-700', 'border-slate-700');
                        allBtns[idx].classList.add('bg-emerald-950/80', 'border-emerald-600', 'text-emerald-200');
                    }
                });
            }

            // Disable all option buttons after selection
            Array.from(optionsContainer.children).forEach(b => b.disabled = true);

            showExplanation(q, optIdx);
        }

        function showExplanation(q, chosenOptIdx) {
            const isCorrect = q.shuffledOptions[chosenOptIdx].correct;
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mt-4 p-4 rounded-xl border bg-emerald-950/40 border-emerald-800 text-emerald-200 transition-all duration-300";
                explanationTitle.textContent = "✔ Correct Answer / सही उत्तर!";
            } else {
                explanationBox.className = "mt-4 p-4 rounded-xl border bg-rose-950/40 border-rose-800 text-rose-200 transition-all duration-300";
                explanationTitle.textContent = "✖ Incorrect Answer / गलत उत्तर!";
            }
            explanationText.textContent = q.explanation;
        }

        function toggleHint() {
            const q = quizData[currentIndex];
            hintText.textContent = q.hint;
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintToggleBtn.textContent = "💡 Hide Hint / संकेत छुपाएं";
            } else {
                hintBox.classList.add('hidden');
                hintToggleBtn.textContent = "💡 Show Hint / संकेत दिखाएँ";
            }
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} / ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion(currentIndex);
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Initialize first question
        loadQuestion(currentIndex);
    </script>
<script src="../../quiz-question-controls.js"></script>
