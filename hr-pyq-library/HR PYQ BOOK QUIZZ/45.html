<body class="bg-slate-100 min-h-screen text-slate-800 font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Haryana GK Interactive Exam Quiz</h1>
                <p class="text-xs text-indigo-200">Based on Page 94 & 95 Material (90 Unique Questions)</p>
            </div>
            <div class="flex items-center gap-4 bg-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-600 text-sm">
                <span>Score: <strong id="live-score" class="text-green-400 font-bold">0</strong> / <span id="total-questions">90</span></span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- Progress Bar & Top Nav -->
        <div class="bg-white rounded-xl p-4 shadow-md mb-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-3">
                <span id="question-tracker" class="text-sm font-semibold text-indigo-700 uppercase tracking-wider">Question 1 of 90</span>
                <div class="flex items-center gap-2 text-sm">
                    <label for="jump-input" class="text-slate-600">Jump to:</label>

            <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 1.11%;"></div>
            </div>
        </div>

        <!-- Question Card -->
        <div class="bg-white rounded-xl p-6 shadow-md mb-6">

            <!-- Options Grid -->

                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border-l-4 border-amber-500 text-amber-800 text-sm rounded">

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden p-4 bg-blue-50 border-l-4 border-blue-600 text-blue-900 rounded-lg text-sm">
                <h4 class="font-bold text-blue-950 mb-1">Detailed Explanation / व्याख्या:</h4>
                <p id="explanation-text"></p>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between items-center">
            <button id="prev-btn" class="bg-slate-300 hover:bg-slate-400 text-slate-800 font-semibold px-5 py-2.5 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed">

            <button id="next-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                Next &rarr;
            </button>
        </div>

    </main>

    <script>
        // Raw dataset extracted from Page 94 and Page 95
        const baseQuestions = [
            // PAGE 94 (1 to 45)
            { id: 1, text_en: "Where did Firoz Shah Tughlaq imprison and kill worshippers after taking them captive from a temple?", text_hi: "फिरोजशाह तुगलक ने किस नगर के मंदिर में पूजा करने वालों को बन्दी बनाकर उनकी हत्या करवा दी?", options: ["Gohana (गोहाना)", "Narnaul (नारनौल)", "Hisar (हिसार)", "Sirsa (सिरसा)"], answer: 0, hint: "Located in Sonipat district.", explanation: "Firoz Shah Tughlaq took worshippers captive from a temple in Gohana and killed them." },
            { id: 2, text_en: "Where was Sher Shah Suri born in 1486?", text_hi: "शेरशाह सूरी का जन्म कहाँ हुआ? (1486 में)", options: ["Narnaul (नारनौल)", "Mahendragarh (महेंद्रगढ़)", "Rewari (रेवाड़ी)", "Bhiwani (भिवानी)"], answer: 0, hint: "Famous for Jal Mahal and Ibrahim Suri's tomb.", explanation: "Sher Shah Suri was born in Narnaul in the year 1486." },
            { id: 3, text_en: "Which century is considered the Golden Age of Saint Tradition in Haryana?", text_hi: "कौन सी सदी को हरियाणा में सन्त सम्प्रदाय का स्वर्णकाल माना जाता है?", options: ["18th Century (अठारहवीं)", "16th Century (सोलहवीं)", "17th Century (सत्रहवीं)", "19th Century (उन्नीसवीं)"], answer: 0, hint: "18th century.", explanation: "The 18th century is recognized as the Golden Age (स्वर्णकाल) of Saint Tradition in Haryana." },
            { id: 4, text_en: "How many total texts/books were authored by Pushpadanta?", text_hi: "पुष्पदंत में कुल ग्रन्थ कितने हैं?", options: ["4 (चार)", "2 (दो)", "6 (छह)", "8 (आठ)"], answer: 0, hint: "A single digit even number less than 5.", explanation: "Pushpadanta authored a total of 4 texts." },
            { id: 5, text_en: "Where did Rao Tula Ram go after the 1857 Revolt?", text_hi: "राव तुलाराम क्रांति के बाद कहाँ चले गए?", options: ["Afghanistan (अफगानिस्तान)", "Nepal (नेपाल)", "Burma (बर्मा)", "Iran (ईरान)"], answer: 0, hint: "North-west neighboring country.", explanation: "After the 1857 revolution, Rao Tula Ram moved to Afghanistan where he passed away in Kabul." },
            { id: 6, text_en: "By which year was Congress established in every district of Haryana?", text_hi: "किस वर्ष तक हरियाणा में प्रत्येक जिले में कांग्रेस की स्थापना हो चुकी थी?", options: ["1907", "1886", "1919", "1942"], answer: 0, hint: "Year of Surat split.", explanation: "By the year 1907, branches of Congress had been established across all districts of Haryana." },
            { id: 7, text_en: "On 30th July 1919, from which district was Mahatma Gandhi arrested?", text_hi: "30 जुलाई 1919 को गाँधी जी को किस जिले से गिरफ्तार किया गया?", options: ["Hisar (हिसार)", "Palwal (पलवल)", "Rohtak (रोहतक)", "Ambala (अम्बाला)"], answer: 0, hint: "Known as the Steel City of Haryana.", explanation: "Mahatma Gandhi was arrested from Hisar on 30th July 1919 (His first arrest in Haryana was at Palwal in April 1919)." },
            { id: 8, text_en: "Where is the Ankai Marsh (Ankai Daldal) located in Haryana?", text_hi: "हरियाणा में अनकाई दलदल कहाँ पाया जाता है?", options: ["Sirsa (सिरसा)", "Panchkula (पंचकुला)", "Yamunanagar (यमुनानगर)", "Kaithal (कैथल)"], answer: 0, hint: "Westernmost district of Haryana.", explanation: "The lowest region/marshy land called Ankai Daldal is situated in Sirsa district." },
            { id: 9, text_en: "In which era did the major geological structural changes occur in Haryana?", text_hi: "किस काल में हरियाणा की भू-गर्भिक संरचना में परिवर्तन हुए?", options: ["Mesozoic Era (मेसोजोइक काल)", "Cenozoic Era (सेनोजोइक काल)", "Paleozoic Era (पैलियोजोइक काल)", "Archaean Era (आर्कियन काल)"], answer: 0, hint: "Mesozoic Era.", explanation: "Geological structural changes in Haryana took place during the Mesozoic Era." },
            { id: 10, text_en: "Geographically, into how many units is Haryana divided?", text_hi: "भौगोलिक दृष्टि से हरियाणा को कितनी इकाइयों में बाँटा गया है?", options: ["3 Units: Kurukshetra, Haryana, Bhatiana", "4 Units", "5 Units", "2 Units"], answer: 0, hint: "3 broad units.", explanation: "Geographically Haryana is divided into 3 units: Kurukshetra, Haryana, and Bhatiana." },
            { id: 11, text_en: "What is light soil called in Haryana local dialect?", text_hi: "हल्की मृदा को हरियाणा में क्या कहा जाता है?", options: ["Rausli (रौसली)", "Dahar (डाहर)", "Bangar (बांगर)", "Kandi (कांडी)"], answer: 0, hint: "Starts with 'R'.", explanation: "Light soil is locally known as 'Rausli' in Haryana." },
            { id: 12, text_en: "When is Farmer's Day (Kisan Diwas) celebrated?", text_hi: "किसान दिवस कब मनाया जाता है?", options: ["23 December (Chaudhary Charan Singh Birth Anniversary)", "15 August", "2 October", "26 November"], answer: 0, hint: "Birthday of former PM Ch. Charan Singh.", explanation: "Kisan Diwas is celebrated on 23rd December in memory of Chaudhary Charan Singh." },
            { id: 13, text_en: "On the lines of Andhra Pradesh, a temple for which deity is being constructed in Kurukshetra?", text_hi: "आन्ध्र प्रदेश की तर्ज पर कुरुक्षेत्र में किस देवता का मंदिर बनाया जा रहा है?", options: ["Tirupati Balaji (तिरुपति बालाजी)", "Lord Venkateswara", "Jagannath", "Mallikarjuna"], answer: 0, hint: "Tirupati Balaji.", explanation: "A temple dedicated to Lord Tirupati Balaji is being constructed in Kurukshetra mirroring Andhra Pradesh." },
            { id: 14, text_en: "Where was Haryana's first gas-based crematorium (Gas Subdah Grih) opened?", text_hi: "हरियाणा का पहला गैस शवदाह गृह कहाँ खोला गया?", options: ["Sonipat (सोनीपत)", "Gurugram (गुरुग्राम)", "Faridabad (फरीदाबाद)", "Karnal (करनाल)"], answer: 0, hint: "Famous for cycle industry/Ghevar.", explanation: "The first gas crematorium of Haryana was established in Sonipat." },
            { id: 15, text_en: "Where was India's second Sakhi Center (One Stop Center) opened?", text_hi: "भारत का दूसरा सखी केन्द्र कहाँ खोला गया?", options: ["Karnal (करनाल)", "Rohtak (रोहतक)", "Hisar (हिसार)", "Ambala (अम्बाला)"], answer: 0, hint: "CM city/Rice bowl.", explanation: "India's second Sakhi Center was opened in Karnal." },
            { id: 16, text_en: "Which date was designated by the Haryana Govt to celebrate Constitution Day in schools?", text_hi: "हरियाणा सरकार ने प्रदेश में संविधान दिवस मनाने के लिए किस तारीख को निर्धारित किया?", options: ["26 November", "26 January", "15 August", "26 December"], answer: 0, hint: "National Law Day date.", explanation: "26th November was designated to celebrate Constitution Day across schools in Haryana." },
            { id: 17, text_en: "'Manohar Jyoti Yojana' is related to which of the following?", text_hi: "मनोहर ज्योति योजना से संबंधित है?", options: ["Solar Lighting System (सौर प्रकाश प्रणाली)", "Free Education", "Clean Drinking Water", "Micro Irrigation"], answer: 0, hint: "Solar energy based.", explanation: "Manohar Jyoti Yojana is aimed at providing home solar lighting systems." },
            { id: 18, text_en: "How many soldiers from Haryana were martyred in the Azad Hind Fauj (INA)?", text_hi: "हरियाणा के आजाद हिन्द फौज में शहीद हुए जवान कितने थे?", options: ["346 Soldiers (346 जवान)", "500 Soldiers", "250 Soldiers", "412 Soldiers"], answer: 0, hint: "Between 300 and 400.", explanation: "A total of 346 soldiers from Haryana sacrificed their lives in Netaji's Azad Hind Fauj." },
            { id: 19, text_en: "When is Martyrs' Day (Shaheed Diwas) celebrated in Haryana?", text_hi: "हरियाणा में शहीद दिवस मनाया जाता है?", options: ["23 September (Death anniversary of Rao Tula Ram in 1863)", "23 March", "30 January", "15 August"], answer: 0, hint: "Honoring Rao Tula Ram.", explanation: "Haryana Martyrs' Day is observed on 23rd September marking the death of Rao Tula Ram in 1863." },
            { id: 20, text_en: "Who was the first leader captured during Balban's initial campaign against the Mewatis?", text_hi: "मेवाियों के विरुद्ध अपने पहले अभियान के दौरान बलबन द्वारा पकड़ा गया पहला नेता कौन था?", options: ["Malka (मल्का)", "Mewati Khan", "Hasan Khan", "Nahar Khan"], answer: 0, hint: "Starts with M.", explanation: "Malka was the first Mewati leader captured during Balban's military offensive." },
            { id: 21, text_en: "Where will the Martyrs' Memorial honoring the martyrs of the First War of Independence (1857) be built?", text_hi: "भारत में प्रथम स्वतंत्र संग्राम 1857 के शहीदों के सम्मान में शहीद स्मारक कहाँ बनेगा?", options: ["Ambala NH-1 (अम्बाला NH-1)", "Panipat", "Rohtak", "Kurukshetra"], answer: 0, hint: "On NH-1 in Ambala.", explanation: "A grand 1857 War Memorial is constructed along NH-1 in Ambala." },
            { id: 22, text_en: "Under 'Operation Sanjay', where will the installation of CCTV cameras across India begin?", text_hi: "ऑपरेशन संजय के तहत पूरे भारत में सी. सी. टीवी कैमरे लगाने की शुरुआत कहाँ से होगी?", options: ["Hisar (हिसार)", "Gurugram (गुरुग्राम)", "Chandigarh (चंडीगढ़)", "Delhi (दिल्ली)"], answer: 0, hint: "Hisar.", explanation: "The CCTV setup initiative under Operation Sanjay originates/starts from Hisar." },
            { id: 23, text_en: "At which location in Rewari is slate stone found?", text_hi: "रेवाड़ी के किस स्थान पर से स्लेट पाया जाता है?", options: ["Kund (कुण्ड)", "Khol", "Bawal", "Dharuhera"], answer: 0, hint: "Kund village.", explanation: "Kund village in Rewari is globally famous for slate stone deposits." },
            { id: 24, text_en: "Where was the princely state of Mohan Singh Mandhar located?", text_hi: "मोहन सिंह मन्डार की रियासत किस स्थान पर थी?", options: ["Kaithal (कैथल)", "Jhind", "Karnal", "Panipat"], answer: 0, hint: "Chhatrapati of Kaithal region.", explanation: "Mohan Singh Mandhar ruled the princely area centered at Kaithal." },
            { id: 25, text_en: "Where was the High Court of Punjab established after partition?", text_hi: "विभाजन के बाद पंजाब का पूर्वी न्यायालय कहाँ स्थापित किया गया था?", options: ["Shimla (शिमला)", "Chandigarh (चंडीगढ़)", "Jalandhar (जालंधर)", "Ambala (अम्बाला)"], answer: 0, hint: "Capital of HP.", explanation: "After Partition, the East Punjab High Court was set up at Shimla before shifting to Chandigarh." },
            { id: 26, text_en: "When was the High Court of Punjab at Lahore established?", text_hi: "पंजाब और हरियाणा उच्च न्यायालय जो पहले लाहौर उच्च कहलाता था की स्थापना कब हुई?", options: ["1919 in Lahore", "1935", "1947", "1950"], answer: 0, hint: "Government of India Act 1915 led to creation in 1919.", explanation: "The High Court at Lahore was established under the Letters Patent in 1919." },
            { id: 27, text_en: "To which district did Poet Tulsidas Sharma 'Dinesh' belong?", text_hi: "कवि तुलसीदास शर्मा 'दिनेश' किस जिले के निवासी थे?", options: ["Bhiwani (भिवानी)", "Rohtak (रोहतक)", "Hisar (हिसार)", "Jhajjar (झज्जर)"], answer: 0, hint: "Kashi of Haryana.", explanation: "Pandit Tulsidas Sharma 'Dinesh' hailed from Bhiwani." },
            { id: 28, text_en: "Who is the Chairman of Haryana Saraswati Heritage Development Board?", text_hi: "हरियाणा सरस्वती हैरिटेज डेवलपमेंट बोर्ड का चेयरमैन कौन है?", options: ["Shri Nayab Singh Saini (Chief Minister)", "Manohar Lal Khattar", "Bandaru Dattatreya", "Kanwar Pal Gujjar"], answer: 0, hint: "Current Chief Minister of Haryana.", explanation: "The Chief Minister (Shri Nayab Singh Saini) serves ex-officio Chairman of the Saraswati Heritage Board." },
            { id: 29, text_en: "Pandit Ramkrishna Vyas is famous in which field?", text_hi: "प. रामकृष्ण व्यास किस क्षेत्र में प्रसिद्ध थे?", options: ["Haryanvi Swang (हरियाणवी स्वांग)", "Classical Singing", "Wrestling", "Painting"], answer: 0, hint: "Folk theater form.", explanation: "Pandit Ramkrishna Vyas was a highly renowned artist of Haryanvi Swang." },
            { id: 30, text_en: "Vande Mataram Yojana is related to whom?", text_hi: "वन्दे मातरम् योजना का संबंध है?", options: ["Pregnant Women / Females (महिलाओं से)", "Farmers", "Unemployed Youth", "Ex-servicemen"], answer: 0, hint: "Healthcare for expectant mothers.", explanation: "Vande Mataram Scheme provides healthcare services to pregnant women." },
            { id: 31, text_en: "Where is the Western Command Headquarters of the Indian Army located?", text_hi: "भारतीय सेना के पश्चिमी कमांड का मुख्यालय है?", options: ["Chandi Mandir (चंडी मंदिर)", "Ambala Cantonment", "Delhi Cantt", "Jalandhar"], answer: 0, hint: "Near Panchkula.", explanation: "Western Command HQ of Indian Army is at Chandi Mandir, Panchkula." },
            { id: 32, text_en: "Ch. Devi Lal Award is given in which field?", text_hi: "चौ. देवीलाल अवार्ड किस क्षेत्र में दिया जाता है?", options: ["Maximum Agricultural Production (अधिकतम कृषि उत्पादन)", "Sports Excellence", "Literary Contribution", "Social Service"], answer: 0, hint: "Farmer community reward.", explanation: "Ch. Devi Lal Award is awarded for achieving maximum agricultural yield/production." },
            { id: 33, text_en: "What is the cost of the railway line project between Hansi, Meham, and Rohtak?", text_hi: "हांसी महम और रोहतक के मध्य रेलवे लाइन परियोजना की लागत है?", options: ["500 Crore (500 करोड़)", "200 Crore", "1000 Crore", "750 Crore"], answer: 0, hint: "500 Crore.", explanation: "The sanctioned budget for the Hansi-Meham-Rohtak railway line project is 500 Crore rupees." },
            { id: 34, text_en: "Where was Haryana's first Digital Post Office built?", text_hi: "हरियाणा का पहला डिजिटल पोस्ट ऑफिस बना?", options: ["Gurugram (गुरुग्राम)", "Faridabad", "Panchkula", "Ambala"], answer: 0, hint: "Cyber City.", explanation: "The state's first Digital Post Office was launched in Gurugram." },
            { id: 35, text_en: "Where will Haryana's second largest flyover bridge (5 km long) be built?", text_hi: "हरियाणा का दूसरा बड़ा सबसे उपरागामी पुल बनेगा?", options: ["Gurugram (5 KM)", "Faridabad", "Panipat", "Sonipat"], answer: 0, hint: "Gurugram.", explanation: "The 5 km flyover at Gurugram is designated as the second longest in the state." },
            { id: 36, text_en: "PM Matru Vandana Yojana was created for whom?", text_hi: "PM मातृ वन्दना योजना बनी?", options: ["Pregnant Women (गर्भवती महिलाओं के लिए)", "Elderly Women", "School Girls", "Widows"], answer: 0, hint: "Maternal benefit scheme.", explanation: "Pradhan Mantri Matru Vandana Yojana provides financial assistance to pregnant and lactating mothers." },
            { id: 37, text_en: "Which is the oldest Harappan site?", text_hi: "सबसे पुराना हड़प्पा स्थल कौन सा है?", options: ["Bhirrana, Fatehabad (भिड़ाना)", "Rakhigarhi", "Banawali", "Mithathal"], answer: 0, hint: "Bhirrana in Fatehabad district.", explanation: "Bhirrana (Fatehabad) is verified as the oldest Harappan settlement. (Note: Kunal is also considered ancient)." },
            { id: 38, text_en: "How much reward money was given to Haryana trainers acting as Olympic referees?", text_hi: "ओलंपिक में रेफरी के रूप में भाग लेने वाले हरियाणा के प्रशिक्षकों को कितने रुपये मिले?", options: ["13 Lakh (13 लाख)", "10 Lakh", "5 Lakh", "20 Lakh"], answer: 0, hint: "Thirteen Lakhs.", explanation: "Haryana coaches officiating as referees in Olympics received 13 Lakh rupees." },
            { id: 39, text_en: "In which district is Vibha Bhardwaj, elected as a senator in Argentina, a native of?", text_hi: "अर्जेंटीना में सीनेट का सदस्य चुनी गई विभा भारद्वाज किस जिले की निवासी है?", options: ["Bhiwani (भिवानी)", "Rohtak", "Hisar", "Sirsa"], answer: 0, hint: "Bhiwani.", explanation: "Vibha Bhardwaj who gained prominence in Argentina originates from Bhiwani district." },
            { id: 40, text_en: "Where is the headquarters of Haryana Tourism Corporation Limited located?", text_hi: "HR पर्यटन निगम लिमिटेड का मुख्यालय कहाँ स्थित हैं?", options: ["Chandigarh (चंडीगढ़)", "Panchkula", "Gurugram", "Faridabad"], answer: 0, hint: "Joint Capital City.", explanation: "Haryana Tourism Corporation Ltd HQ is located in Chandigarh." },
            { id: 41, text_en: "Where is the Honeybee Development Center (मधुमक्खी विकास केन्द्र) situated?", text_hi: "मधुमक्खी विकास केन्द्र कहाँ हैं?", options: ["Shahbad, Kurukshetra (शाहबाद)", "Ladwa", "Thanesar", "Nilokheri"], answer: 0, hint: "Shahbad.", explanation: "The Bee Keeping / Honeybee Development Center is located at Shahbad (Kurukshetra)." },
            { id: 42, text_en: "Which famous lake is mentioned in Baburnama?", text_hi: "बाबरनामा में वर्णित प्रसिद्ध झील है..", options: ["Kotla Lake (कोटला झील)", "Badkhal Lake", "Karna Lake", "Damdama Lake"], answer: 0, hint: "Located in Nuh/Mewat.", explanation: "Kotla Lake situated in Nuh district is explicitly described in Babur's memoirs (Baburnama)." },
            { id: 43, text_en: "Karate player Rajneesh Chaudhary is a resident of which district?", text_hi: "कराटे खिलाड़ी रजनीश चौधरी किस जिले के निवासी हैं?", options: ["Jhajjar (झज्जर)", "Rohtak", "Bhiwani", "Sonipat"], answer: 0, hint: "Jhajjar.", explanation: "Rajneesh Chaudhary, noted karate player, belongs to Jhajjar district." },
            { id: 44, text_en: "Where is the organic farming training center (जैविक खेती प्रशिक्षण केन्द्र) established?", text_hi: "जैविक खेती का प्रशिक्षण केन्द्र कहाँ खोला गया?", options: ["Kurukshetra (कुरुक्षेत्र)", "Karnal", "Hisar", "Fatehabad"], answer: 0, hint: "Holy City Kurukshetra.", explanation: "The training center for organic farming operates at Kurukshetra." },
            { id: 45, text_en: "Where is the Speech and Hearing Impaired University (मूक बधिर विश्वविद्यालय) being established?", text_hi: "मूक बधिर विश्वविद्यालय कहाँ खोला जा रहा है?", options: ["Karnal (करनाल)", "Sonipat", "Rohtak", "Gurugram"], answer: 0, hint: "Karnal.", explanation: "The university/institution for speech and hearing impaired individuals is set up in Karnal." },

            // PAGE 95 (46 to 90)
            { id: 46, text_en: "Where is the Secretariat of International Solar Alliance (ISA) located?", text_hi: "121 देशों का सौर गठबंधन सचिवालय कहाँ है?", options: ["Gurugram (गुरुग्राम)", "Noida", "Faridabad", "New Delhi"], answer: 0, hint: "Cyber City Gurugram.", explanation: "The headquarters/secretariat of 121-nation International Solar Alliance is in Gurugram." },
            { id: 47, text_en: "In which district of Haryana do 'Dwikaji' cows belong?", text_hi: "द्विकाजी गायें हरियाणा के किस जिले में आती हैं?", options: ["Rohtak (रोहतक)", "Hisar", "Bhiwani", "Sirsa"], answer: 0, hint: "Rohtak.", explanation: "Dwikaji breed cows are prominently associated with Rohtak district." },
            { id: 48, text_en: "What is the ancient name of Tarain?", text_hi: "तराइन का प्राचीन नाम क्या है?", options: ["Azamabad (आजमाबाद)", "Tarawari", "Staneshwar", "Sarhan"], answer: 0, hint: "Azamabad.", explanation: "Historically, Tarain was also referred to as Azamabad." },
            { id: 49, text_en: "Where was Acharya Kulam foundation laid by Swami Ramdev?", text_hi: "स्वामी रामदेव द्वारा आचार्य कुलम का शिलान्यास कहाँ किया गया?", options: ["Legha, Bhiwani (लेघाँ - भिवानी)", "Haridwar", "Mahendragarh", "Patan"], answer: 0, hint: "Legha village in Bhiwani.", explanation: "Swami Ramdev laid the foundation of Acharya Kulam at Legha in Bhiwani district." },
            { id: 50, text_en: "Who is known as the 'Lata Mangeshkar of Haryana'?", text_hi: "हरियाणा की लता मंगेशकर किसे कहा जाता हैं?", options: ["Monika Soni from Rewari (रेवाड़ी की मोनिका सोनी)", "Richa Sharma", "Mamta Sharma", "Shivani Saini"], answer: 0, hint: "Monika Soni from Rewari.", explanation: "Monika Soni of Rewari is affectionately nicknamed the 'Lata Mangeshkar of Haryana'." },
            { id: 51, text_en: "Where are the Swinging Minarets (Jhulti Minar) and Tomb of Sheikh Musa located?", text_hi: "हरियाणा में झूलती मीनार और शेख मूसा की दरगाह कहाँ हैं?", options: ["Nuh, Mewat (नूंह - मेवात)", "Hansi", "Panipat", "Kaithal"], answer: 0, hint: "Nuh (Mewat).", explanation: "The Jhulti Minar and Sheikh Musa Dargah are historical monuments located in Nuh." },
            { id: 52, text_en: "Which ruler is known by the name Rai Pithora?", text_hi: "राय पिथौरा के नाम से कौन-सा शासक जाना जाता हैं?", options: ["Prithviraj Chauhan (पृथ्वीराज चौहान)", "Anangpal Tomar", "Harshavardhana", "Hemchandra Vikramaditya"], answer: 0, hint: "Famous Rajput king who fought battles of Tarain.", explanation: "Prithviraj Chauhan III was widely known as Rai Pithora." },
            { id: 53, text_en: "Where was Haryana's first Child-Friendly Police Station 'Phulwari' set up?", text_hi: "हरियाणा का पहला चाइल्ड फ्रेंडली पुलिस थाना 'फूलवारी' कहाँ बनाया गया?", options: ["Gurugram (गुरुग्राम)", "Panchkula", "Faridabad", "Karnal"], answer: 0, hint: "Gurugram.", explanation: "The first child-friendly police station 'Phulwari' was established in Gurugram." },
            { id: 54, text_en: "Which tree species is referred to as the 'Sandalwood Tree of Haryana'?", text_hi: "हरियाणा का चंदन वृक्ष किसे कहा जाता है?", options: ["Janti / Khejri (जांटी)", "Peepal", "Neem", "Sheesham"], answer: 0, hint: "Janti / Shami tree.", explanation: "Janti (Khejri tree) holds immense ecological value and is called the Sandalwood of Haryana." },
            { id: 55, text_en: "Where is Appu Ghar amusement park located in Haryana State?", text_hi: "अप्पूघर राज्य में कहाँ है?", options: ["Gurugram (गुरुग्राम)", "Faridabad", "Noida", "Rohtak"], answer: 0, hint: "Gurugram.", explanation: "Appu Ghar (Water Kingdom/Amusement Park) is situated in Gurugram." },
            { id: 56, text_en: "What is the daily wage paid per day under MGNREGA in Haryana?", text_hi: "राज्य में मनरेगा में प्रतिदिन कितने रूपये मेहताना दिया जाता हैं?", options: ["374 Rupees (374 रुपये)", "357 Rupees", "315 Rupees", "400 Rupees"], answer: 0, hint: " highest daily wage among Indian states (374 Rs as per textbook data).", explanation: "Haryana provides one of the highest MGNREGA wages (374 Rs as per book reference)." },
            { id: 57, text_en: "Where was the state's first Women Power Substation started?", text_hi: "प्रदेश का पहला महिला बिजली सब स्टेशन कहाँ शुरू किया गया है?", options: ["Panipat (पानीपत)", "Karnal", "Ambala", "Hisar"], answer: 0, hint: "Textile city Panipat.", explanation: "The first all-women operated power sub-station was initiated in Panipat." },
            { id: 58, text_en: "How much premium is deposited for Bull, Buffalo, and Camel under Pashudhan Bima Yojana?", text_hi: "हरियाणा में पशुधन बीमा योजना के तहत बैल, भैंस व ऊंट के लिए कितने रुपये बीमा राशि के रूप में जमा करनी होती है?", options: ["25 Rupees for 3 years period (25 रुपये और इसकी अवधि 3 वर्ष होती है)", "100 Rupees for 1 year", "50 Rupees for 2 years", "Free of cost"], answer: 0, hint: "Nominal 25 Rupees.", explanation: "Under Pashudhan Bima Yojana, a nominal fee of Rs 25 provides insurance coverage for 3 years." },
            { id: 59, text_en: "Who is the author of the book 'Swarn Jayanti' written on anti-defection law in Haryana?", text_hi: "दल-बदल हरियाणा की 'स्वर्ण जयंती' नामक पुस्तक के लेखक कौन हैं?", options: ["Deepkamal Saharan (दीपकमल सहारण)", "Vijay Vardhan", "Raghuvendra Tanwar", "K C Yadav"], answer: 0, hint: "Deepkamal Saharan.", explanation: "Deepkamal Saharan authored the work detailing defection political history in Haryana." },
            { id: 60, text_en: "Where is North India's largest Integrated Logistics Park being constructed?", text_hi: "उत्तर भारत का सबसे बड़ा लॉजिस्टिक पार्क हरियाणा में कहाँ बनेगा?", options: ["Narnaul, Mahendragarh (नारनौल - महेन्द्रगढ़)", "Manesar", "Saha", "Bawal"], answer: 0, hint: "Narnaul.", explanation: "The mega Integrated Multi-Modal Logistics Hub is developed at Narnaul (Mahendragarh)." },
            { id: 61, text_en: "Jhanvi, known as 'Wonder Girl' at age 13, belongs to which place?", text_hi: "वंडर गर्ल के नाम से जानी जाने वाली 13 वर्ष की जानहवी किस जिले से है?", options: ["Samalkha, Panipat (समालखा - पानीपत)", "Gharaunda", "Bahadurgarh", "Kalka"], answer: 0, hint: "Samalkha in Panipat district.", explanation: "Wonder Girl Jahnavi hails from Samalkha in Panipat." },
            { id: 62, text_en: "What was the main center of cotton textiles during Harshavardhana's reign?", text_hi: "हर्षवर्धन के काल में सूती वस्त्रों का प्रमुख केन्द्र था?", options: ["Mathura (मथुरा)", "Thanesar", "Kannauj", "Ujjain"], answer: 0, hint: "Mathura.", explanation: "Mathura was famed as a premier hub for cotton textiles during the Vardhana empire." },
            { id: 63, text_en: "Where did Mahabharata warrior Duryodhana hide himself?", text_hi: "महाभारत के योद्धा दुर्योधन ने अपने आप को कहाँ छुपा लिया था?", options: ["Parasar's Bahlolpur pond (परासर के बहलोल पुर ताल में)", "Brahma Sarovar", "Sannihit Sarovar", "Jyotisar"], answer: 0, hint: "Bahlolpur pond.", explanation: "Duryodhana hid inside the waters of Bahlolpur pond (Parasar)." },
            { id: 64, text_en: "What was the Swachh Bharat Abhiyan toll-free helpline number listed?", text_hi: "स्वच्छ भारत अभियान टोल फ्री हेल्पलाइन न. है?", options: ["1969", "1091", "112", "1075"], answer: 0, hint: "Year of Gandhi's centenary birth.", explanation: "1969 was launched as the dedicated Swachh Bharat helpline." },
            { id: 65, text_en: "Where does famous Kabaddi player Pradeep Narwal (Dubki King) reside?", text_hi: "डुबकी किंग के नाम से प्रसिद्ध कबड्डी खिलाड़ी प्रदीप नरवाल कहाँ के रहने वाले हैं?", options: ["Sonipat (सोनीपत)", "Rohtak", "Jhajjar", "Jhind"], answer: 0, hint: "Sonipat district.", explanation: "Pro Kabaddi superstar Pradeep Narwal hails from Rindhana village in Sonipat." },
            { id: 66, text_en: "Which state became the first in India to enable Aadhar-enabled birth registration?", text_hi: "आधार सक्षम जन्म पंजीकरण करने वाला हरियाणा भारत का कौन सा राज्य बना?", options: ["First State (पहला)", "Second State", "Third State", "Fifth State"], answer: 0, hint: "Rank 1.", explanation: "Haryana was the 1st state to implement Aadhaar-linked digital birth registration." },
            { id: 67, text_en: "Which was the first university to run entirely on Solar Energy?", text_hi: "सोलार एनर्जी वाला पहला विश्वविद्यालय कहाँ है?", options: ["SUPVA Rohtak (सुपवा - रोहतक)", "MDU Rohtak", "KU Kurukshetra", "HAU Hisar"], answer: 0, hint: "State University of Performing and Visual Arts in Rohtak.", explanation: "SUPVA in Rohtak established complete solar campus energy systems." },
            { id: 68, text_en: "Who was the Leader of Opposition in the Haryana Legislative Assembly in 1966?", text_hi: "1966 में हरियाणा विधानसभा के प्रतिपक्षी दल का नेता कौन थे?", options: ["Shri Pratap Singh Daulatabad (श्री प्रताप सिंह दौलताबाद)", "Ch. Devi Lal", "Bansi Lal", "Bhagwat Dayal Sharma"], answer: 0, hint: "Pratap Singh Daulatabad.", explanation: "Pratap Singh Daulatabad served as the first opposition leader in 1966." },
            { id: 69, text_en: "On which date did the 1857 Revolt begin in Ambala?", text_hi: "अम्बाला में किस दिन 1857 ई. के विद्रोह की शुरुआत हुई?", options: ["10 May (10 मई)", "13 May", "24 May", "10 June"], answer: 0, hint: "10th May 1857.", explanation: "The revolt broke out in Ambala Cantonment simultaneously on 10th May 1857." },
            { id: 70, text_en: "Who was the traitorous soldier who leaked the secret plans of Ambala soldiers to the British?", text_hi: "अम्बाला के सैनिकों की गुप्त योजना को अंग्रेजों तक पहुँचाने वाला गद्दार सैनिक कौन था?", options: ["Shyam Singh (श्याम सिंह)", "Hira Singh", "Suja Khan", "Lal Singh"], answer: 0, hint: "Shyam Singh.", explanation: "Shyam Singh betrayed the local mutineers by informing British officers in advance." },
            { id: 71, text_en: "Who is the author of 'Shivshambu ke Chitte'?", text_hi: "'शिवशम्भू का चिट्ठा' के लेखक कौन हैं?", options: ["Balmukund Gupta (बालमुकुंद गुप्ता)", "Lala Lajpat Rai", "Altaf Hussain Hali", "Neki Ram Sharma"], answer: 0, hint: "Great Haryanvi Hindi essayist.", explanation: "Balmukund Gupta wrote the famous satirical essays titled 'Shivshambu ke Chitte'." },
            { id: 72, text_en: "Who was the founder of 'Rifa-e-Aam Society'?", text_hi: "रिफ़ा ए आम सोसाइटी का संस्थापक कौन थे?", options: ["Pt. Deendayal Sharma (प. दीनदयाल शर्मा)", "Lala Deshbandhu", "Shriram Sharma", "Murari Lal"], answer: 0, hint: "Pt. Deendayal Sharma.", explanation: "Pandit Deendayal Sharma established the Rifa-e-Aam Society." },
            { id: 73, text_en: "Until 1825 AD, what was the source of political power in Haryana?", text_hi: "1825 ई. तक हरियाणा की राजनीतिक शक्तियों का स्रोत था?", options: ["Governor (गवर्नर)", "Resident", "Commissioner", "Collector"], answer: 0, hint: "Governor.", explanation: "The Governor retained top administrative and political authority over the region till 1825." },
            { id: 74, text_en: "Who was the court poet of Prithviraj Chauhan?", text_hi: "पृथ्वीराज चौहान का दरबारी कवि कौन था?", options: ["Chand Bardai - Author of Prithviraj Raso (चन्दरवरदाई)", "Banabhatta", "Hemchandra", "Surdas"], answer: 0, hint: "Wrote Prithviraj Raso.", explanation: "Chand Bardai was the court poet and author of the epic epic Prithviraj Raso." },
            { id: 75, text_en: "Who was the father of Sanyogita, wife of Prithviraj Chauhan?", text_hi: "पृथ्वीराज चौहान की पत्नी संयोगिता किसकी पुत्री थी?", options: ["Jaichand (जयचंद की)", "Anangpal", "Rana Sanga", "Maharana Pratap"], answer: 0, hint: "Ruler of Kannauj.", explanation: "Sanyogita was the daughter of King Jaichand of Kannauj." },
            { id: 76, text_en: "Where is soil with neutral reaction (उदासीन प्रतिक्रिया वाली मिट्टी) found in the state?", text_hi: "उदासीन प्रतिक्रिया वाली मिट्टी किस जिले में पाई जाती है?", options: ["Yamunanagar (यमुनानगर)", "Hisar", "Bhiwani", "Sirsa"], answer: 0, hint: "Yamunanagar.", explanation: "Neutral reaction soils are predominantly distributed in Yamunanagar." },
            { id: 77, text_en: "Who saved the life of Ghori in the First Battle of Tarain?", text_hi: "तराइन के I युद्ध में गोरी की जान किसने बचाई?", options: ["Khalji Sardar (खिलजी सरदार)", "Qutb-ud-din Aibak", "Taj-ud-din Yildiz", "Baha-ud-din"], answer: 0, hint: "A loyal Khalji horseman/soldier.", explanation: "A Khalji trooper rescued the severely wounded Muhammad Ghori from the battlefield." },
            { id: 78, text_en: "What geometrical shape does Haryana state approximate?", text_hi: "हरियाणा कैसी आकृति धारण किए हुए है?", options: ["Irregular Quadrilateral / Scalene (विषमबाहु चतुर्भुज)", "Rectangular", "Triangular", "Circular"], answer: 0, hint: "Vishambahu Chaturbhuj.", explanation: "Geographically, Haryana's map resembles an irregular quadrilateral (विषमबाहु चतुर्भुज)." },
            { id: 79, text_en: "Who edited the weekly magazine 'Bharat Nirman'?", text_hi: "साप्ताहिक पत्रिका 'भारत निर्माण' का सम्पादन किसने किया?", options: ["Lala Chandrayan Gupta (लाला चन्द्रयान गुप्ता)", "Ch. Matu Ram", "Lala Lajpat Rai", "Pt. Neki Ram"], answer: 0, hint: "Lala Chandrayan Gupta.", explanation: "Lala Chandrayan Gupta was the chief editor of 'Bharat Nirman'." },
            { id: 80, text_en: "Who was the advocate representing revolutionaries in the Lahore Conspiracy Case?", text_hi: "लाहौर षड्यंत्र केस में क्रांतिकारियों के वकील कौन थे?", options: ["Lala Shyam Lal (लाला श्यामलाल)", "Asaf Ali", "Bhulabhai Desai", "Pt. Neki Ram"], answer: 0, hint: "Lala Shyam Lal.", explanation: "Prominent nationalist lawyer Lala Shyam Lal defended political revolutionaries in court." },
            { id: 81, text_en: "When and by whom was the Marketing Board established?", text_hi: "मार्केटिंग बोर्ड का गठन कब और किसने किया?", options: ["1938 by Sir Chhotu Ram (1938 में सर छोटूराम ने)", "1923 by Ch. Lal Chand", "1942 by Ch. Devi Lal", "1952 by Rao Birender Singh"], answer: 0, hint: "Sir Chhotu Ram in 1938.", explanation: "Sir Chhotu Ram championed the creation of the Agricultural Produce Marketing Board in 1938." },
            { id: 82, text_en: "Which Mughal emperor established 'Chakla' as an administrative unit?", text_hi: "चकला नामक प्रशासनिक इकाई कौन से मुगल शासक की थी?", options: ["Shah Jahan (शाहजहां की)", "Akbar", "Aurangzeb", "Jahangir"], answer: 0, hint: "Builder of Taj Mahal.", explanation: "Shah Jahan reorganized territorial revenue divisions into units termed 'Chakla'." },
            { id: 83, text_en: "From which direction did Timur (ruler of Iran/Samarkand) enter Haryana in 1398?", text_hi: "1398 में ईरान का बादशाह तैमूर हरियाणा में किस तरफ से प्रविष्ट हुआ?", options: ["Rajasthan direction (राजस्थान)", "Punjab direction", "Delhi direction", "Himachal direction"], answer: 0, hint: "Entered via Rajasthan border (Bhatner/Sirsa area).", explanation: "Timur invaded Haryana entering through the southwestern Rajasthan approach." },
            { id: 84, text_en: "In how many days must a Sarpanch vacate office after an election program is published?", text_hi: "राज्य में सरपंच को चुनाव कार्यक्रम प्रकाशित होने के बाद कितने दिनों में अपना पद छोड़ना होता है?", options: ["7 Days (7 दिन)", "15 Days", "30 Days", "Immediately (0 Days)"], answer: 0, hint: "One week.", explanation: "Statutory rules mandate handing over charge within 7 days of election notification." },
            { id: 85, text_en: "How much monetary grant is provided to open-defecation free (ODF) villages in Haryana?", text_hi: "हरियाणा में खुले में शौच से मुक्त गांव को कितनी धनराशि दी जाती है?", options: ["5 Lakh Rupees (5 लाख)", "2 Lakh", "10 Lakh", "1 Lakh"], answer: 0, hint: "5 Lakhs.", explanation: "Gram Panchayats achieving ODF status are awarded financial incentive of 5 Lakh rupees." },
            { id: 86, text_en: "Assertion (A): Firoz Shah Tughlaq founded the city of Hisar-e-Firoza.\nReason (R): Hisar served as an administrative garrison military fort.", options: ["Both A and R are correct and R is correct explanation of A", "Both A and R are correct but R is NOT the explanation", "A is true but R is false", "A is false but R is true"], answer: 0, hint: "Historical fact.", explanation: "Firoz Shah Tughlaq built the fort complex Hisar-e-Firoza in 1354 AD." },
            { id: 87, text_en: "Which of the following pair is INCORRECTLY matched?", options: ["Lata Mangeshkar of Haryana - Richa Sharma", "Wonder Girl - Jahnavi", "Dubki King - Pradeep Narwal", "Rai Pithora - Prithviraj Chauhan"], answer: 0, hint: "Monika Soni is Lata Mangeshkar of HR, not Richa Sharma.", explanation: "Monika Soni of Rewari is called Haryana's Lata Mangeshkar." },
            { id: 88, text_en: "Match List-I with List-II:\nList-I (Place) | List-II (Famous for)\nA. Kund | 1. Slate Stone\nB. Narnaul | 2. Logistics Park\nC. Shahbad | 3. Bee Keeping Center", options: ["A-1, B-2, C-3", "A-2, B-1, C-3", "A-3, B-2, C-1", "A-1, B-3, C-2"], answer: 0, hint: "Direct match.", explanation: "Kund is famous for slate, Narnaul for Logistics Hub, and Shahbad for Bee keeping." },
            { id: 89, text_en: "Which of the following statements regarding the 1857 revolution in Haryana is TRUE?", options: ["It started from Ambala Cantt on 10th May 1857", "Rao Tula Ram led from Hisar only", "Shyam Singh was a freedom fighter leader", "It ended on 15th August 1857"], answer: 0, hint: "Ambala outbreak date.", explanation: "The revolution in Haryana officially broke out at Ambala Cantonment on May 10, 1857." },
            { id: 90, text_en: "Consider the following statements:\n1. International Solar Alliance HQ is in Gurugram.\n2. Haryana Tourism HQ is in Panchkula.\nWhich statement(s) is/are correct?", options: ["Only 1 is correct", "Only 2 is correct", "Both 1 and 2 are correct", "Neither 1 nor 2"], answer: 0, hint: "Tourism HQ is in Chandigarh.", explanation: "ISA HQ is in Gurugram (Correct). Haryana Tourism Corp HQ is in Chandigarh, not Panchkula (Statement 2 is incorrect)." }
        ];

        // State Management
        let questions = [];
        let currentIndex = 0;
        let userAnswers = {}; // { qIndex: { selectedOptionIndex, isCorrect } }
        let score = 0;

        // Shuffle Helper (Fisher-Yates)
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize Prepared Data with Randomized Option Positions
        function initDataset() {
            questions = baseQuestions.map(q => {
                const correctAnswerText = q.options[q.answer];
                const shuffledOpts = shuffleArray(q.options);
                const newCorrectIndex = shuffledOpts.indexOf(correctAnswerText);
                return {
                    ...q,
                    shuffledOptions: shuffledOpts,
                    correctIndex: newCorrectIndex
                };
            });
        }

        // DOM Elements
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const questionTrackerEl = document.getElementById('question-tracker');
        const progressBarEl = document.getElementById('progress-bar');
        const liveScoreEl = document.getElementById('live-score');
        const totalQuestionsEl = document.getElementById('total-questions');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');
        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');

        // Render Question
        function renderQuestion() {
            const q = questions[currentIndex];

            // Reset UI States
            hintBox.classList.add('hidden');
            explanationBox.classList.add('hidden');
            optionsContainerEl.innerHTML = '';

            // Update Trackers
            questionTrackerEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
            progressBarEl.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
            prevBtn.disabled = currentIndex === 0;

            // Render Text (Bilingual)
            questionTextEl.innerHTML = `
                <div class="text-indigo-900 mb-1">Q${q.id}. ${q.text_en}</div>
                <div class="text-slate-600 text-base font-normal">${q.text_hi}</div>
            `;

            // Setup Hint
            hintBox.innerHTML = `<strong>Hint:</strong> ${q.hint}`;

            // Render Options
            const optionLabels = ['A', 'B', 'C', 'D'];
            const existingAnswer = userAnswers[currentIndex];

            q.shuffledOptions.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `option-card w-full text-left p-4 rounded-xl border-2 flex items-start gap-3 transition-all ${
                    existingAnswer 
                        ? 'cursor-default disabled' 
                        : 'hover:border-indigo-500 hover:bg-indigo-50/50 border-slate-200 bg-white'
                }`;

                let badgeColor = 'bg-slate-100 text-slate-600';
                
                if (existingAnswer) {
                    if (optIdx === q.correctIndex) {
                        btn.classList.add('border-green-500', 'bg-green-50');
                        badgeColor = 'bg-green-600 text-white';
                    } else if (existingAnswer.selected === optIdx) {
                        btn.classList.add('border-red-500', 'bg-red-50');
                        badgeColor = 'bg-red-600 text-white';
                    } else {
                        btn.classList.add('border-slate-200', 'bg-slate-50', 'opacity-60');
                    }
                }

                btn.innerHTML = `
                    <span class="w-7 h-7 rounded-full ${badgeColor} flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">${optionLabels[optIdx]}</span>
                    <span class="text-slate-800 text-sm sm:text-base font-medium">${optText}</span>
                `;

                if (!existingAnswer) {
                    btn.addEventListener('click', () => handleOptionSelect(optIdx));
                }

                optionsContainerEl.appendChild(btn);
            });

            // Show explanation if already answered
            if (existingAnswer) {
                showExplanation();
            }
        }

        // Handle Option Click
        function handleOptionSelect(selectedIdx) {
            const q = questions[currentIndex];
            const isCorrect = selectedIdx === q.correctIndex;

            if (isCorrect) {
                score++;
            }

            userAnswers[currentIndex] = {
                selected: selectedIdx,
                isCorrect: isCorrect
            };

            liveScoreEl.textContent = score;
            renderQuestion();
        }

        // Show Explanation
        function showExplanation() {
            const q = questions[currentIndex];
            explanationText.textContent = q.explanation;
            explanationBox.classList.remove('hidden');
        }

        // Event Listeners
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        });

        jumpBtn.addEventListener('click', () => {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= questions.length) {
                currentIndex = val - 1;
                renderQuestion();
            }
        });

        hintBtn.addEventListener('click', () => {
            hintBox.classList.toggle('hidden');
        });

        // Initialize App
        initDataset();
        totalQuestionsEl.textContent = questions.length;
        renderQuestion();
    </script>
