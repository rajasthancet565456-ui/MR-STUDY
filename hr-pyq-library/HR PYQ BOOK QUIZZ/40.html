            </div>

            <div id="options-container" class="space-y-3 mb-6">

            </div>

            <!-- Hint Section -->

                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/50 hover:bg-slate-700/50 text-slate-200 text-sm sm:text-base font-medium transition flex items-center justify-between group";
                
                let optionLetter = String.fromCharCode(65 + idx);
                btn.innerHTML = `<span><strong class="text-amber-400 mr-2">${optionLetter}.</strong> ${opt}</span>`;
                
                // If already answered, show state
                if (userAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                    if (idx === q.correct) {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-green-500 bg-green-950/40 text-green-200 text-sm sm:text-base font-medium flex items-center justify-between";
                    } else if (userAnswers[currentIndex] === idx) {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-red-500 bg-red-950/40 text-red-200 text-sm sm:text-base font-medium flex items-center justify-between";
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                optionsContainer.appendChild(btn);
            });

            // If already answered, reveal explanation
            if (userAnswers[currentIndex] !== null) {
                showExplanation(userAnswers[currentIndex] === q.correct, q.explanation);
            }

            // Update Navigation state
            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? "Finish / Review" : "Next →";
            progressText.textContent = `${currentIndex + 1}/${quizData.length}`;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            jumpInput.value = currentIndex + 1;
            scoreDisplay.textContent = score;
        }

        function selectOption(selectedIndex) {
            const q = quizData[currentIndex];
            userAnswers[currentIndex] = selectedIndex;
            const isCorrect = selectedIndex === q.correct;

            if (isCorrect) {
                score++;
                scoreDisplay.textContent = score;
            }

            // Disable all option buttons and highlight correct/incorrect
            const buttons = optionsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === q.correct) {
                    buttons[i].className = "w-full text-left p-3.5 rounded-xl border border-green-500 bg-green-950/40 text-green-200 text-sm sm:text-base font-medium flex items-center justify-between";
                } else if (i === selectedIndex) {
                    buttons[i].className = "w-full text-left p-3.5 rounded-xl border border-red-500 bg-red-950/40 text-red-200 text-sm sm:text-base font-medium flex items-center justify-between";
                }
            }

            showExplanation(isCorrect, q.explanation);
        }

        function showExplanation(isCorrect, explanationString) {
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mb-6 p-4 rounded-xl border border-green-600/50 bg-green-950/20 transition-all";
                explanationTitle.className = "font-bold text-sm mb-1 flex items-center gap-2 text-green-400";
                explanationTitle.innerHTML = "✅ Correct Answer!";
            } else {
                explanationBox.className = "mb-6 p-4 rounded-xl border border-red-600/50 bg-red-950/20 transition-all";
                explanationTitle.className = "font-bold text-sm mb-1 flex items-center gap-2 text-red-400";
                explanationTitle.innerHTML = "❌ Incorrect Answer";
            }
            explanationText.textContent = explanationString;
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            let qNum = parseInt(val);
            if (qNum >= 1 && qNum <= quizData.length) {
                currentIndex = qNum - 1;
                loadQuestion();
            } else {
                jumpInput.value = currentIndex + 1;
            }
        }

        // Initial Load
        window.onload = loadQuestion;
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
