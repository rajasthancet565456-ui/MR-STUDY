        // App State
        let filteredQuestions = [...rawQuestions];
        let currentIndex = 0;
        let userAnswers = {}; // { qId: selectedOptionIndex }
        let score = 0;

        // Initialize App
        window.onload = function() {
            shuffleOptionsAll();
            renderQuestion();
        };

        // Fisher-Yates Shuffle for Options
        function shuffleOptionsAll() {
            rawQuestions.forEach(q => {
                const options = [...q.options];
                const correctAns = q.ans;
                
                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }
                
                q.shuffledOptions = options;
            });
        }

        function filterByPage() {
            const pageVal = document.getElementById('page-select').value;
            if (pageVal === 'all') {
                filteredQuestions = [...rawQuestions];
            } else {
                const pageNum = parseInt(pageVal);
                filteredQuestions = rawQuestions.filter(q => q.page === pageNum);
            }
            currentIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            if (filteredQuestions.length === 0) return;

            const q = filteredQuestions[currentIndex];

            // Badges & Labels
            document.getElementById('question-badge').innerText = `Question ${currentIndex + 1} of ${filteredQuestions.length}`;
            document.getElementById('page-badge').innerText = `Page ${q.page}`;
            document.getElementById('question-text').innerText = `${q.id}. ${q.q}`;

            // Progress Bar
            const progPercent = ((currentIndex + 1) / filteredQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progPercent}%`;

            // Reset Hint & Explanation
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-text').innerText = q.hint;
            
            const expBox = document.getElementById('explanation-box');
            expBox.classList.add('hidden');

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const isAnswered = userAnswers.hasOwnProperty(q.id);
            const selectedOpt = userAnswers[q.id];

            q.shuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-card w-full text-left p-4 rounded-xl border-2 font-medium flex items-center justify-between transition-all duration-150`;

                let optionLetter = String.fromCharCode(65 + idx); // A, B, C, D

                if (!isAnswered) {
                    btn.className += ` border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700`;
                    btn.onclick = () => selectOption(q, opt, idx);
                } else {
                    btn.classList.add('disabled', 'cursor-default');
                    if (opt === q.ans) {
                        btn.className += ` border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold`;
                    } else if (opt === selectedOpt) {
                        btn.className += ` border-rose-500 bg-rose-50 text-rose-900 font-semibold`;
                    } else {
                        btn.className += ` border-slate-200 bg-slate-100 opacity-60 text-slate-500`;
                    }
                }

                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 flex items-center justify-center rounded-lg bg-white border border-slate-300 text-xs font-bold text-slate-600 shadow-sm">${optionLetter}</span>
                        <span class="text-sm md:text-base">${opt}</span>
                    </div>
                `;

                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation immediately
            if (isAnswered) {
                showExplanation(q, selectedOpt === q.ans);
            }

            // Update Navigation Buttons
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === filteredQuestions.length - 1;

            // Update Score Display
            document.getElementById('score-display').innerText = `${score} / ${Object.keys(userAnswers).length}`;
        }

        function selectOption(q, selectedOpt, idx) {
            userAnswers[q.id] = selectedOpt;

            if (selectedOpt === q.ans) {
                score++;
            }

            renderQuestion();
        }

        function showExplanation(q, isCorrect) {
            const expBox = document.getElementById('explanation-box');
            const expTitle = document.getElementById('explanation-title');
            const expText = document.getElementById('explanation-text');

            expBox.classList.remove('hidden');

            if (isCorrect) {
                expBox.className = "p-4 rounded-xl border border-emerald-300 bg-emerald-50 text-emerald-900";
                expTitle.innerHTML = `<svg class="w-5 h-5 text-emerald-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg> Correct Answer!`;
            } else {
                expBox.className = "p-4 rounded-xl border border-rose-300 bg-rose-50 text-rose-900";
                expTitle.innerHTML = `<svg class="w-5 h-5 text-rose-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg> Incorrect! Correct Answer: ${q.ans}`;
            }

            expText.innerText = q.exp;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function navigate(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < filteredQuestions.length) {
                currentIndex = newIndex;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const targetId = parseInt(input.value);

            if (isNaN(targetId)) return;

            const idx = filteredQuestions.findIndex(q => q.id === targetId);
            if (idx !== -1) {
                currentIndex = idx;
                renderQuestion();
                input.value = '';
            } else {
                alert(`Question #${targetId} not found in the current view/filter.`);
            }
        }
    </script>
