        </div>
    </header>

        <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-md">
            <!-- Question Header -->
            <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-4">
                <span id="question-number" class="text-xs font-semibold uppercase tracking-wider text-amber-400 bg-amber-400/10 px-2.5 py-1 rounded">Question 1 of 96</span>
                <span id="question-id" class="text-xs text-slate-400">ID: Q1687</span>
            </div>

            <!-- Question Text -->
            <div class="mb-6 space-y-2">
                <h2 id="question-text-en" class="text-lg font-medium text-slate-100">Loading question...</h2>
                <p id="question-text-hi" class="text-base text-slate-300 font-normal">लोड हो रहा है...</p>
            </div>

            <!-- Options -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamic options generated via JS -->
            </div>

            <!-- Hint Section -->
            <div class="mb-4">
                <button id="hint-btn" onclick="toggleHint()" class="text-xs text-amber-400 hover:text-amber-300 flex items-center gap-1 font-medium focus:outline-none">
                    💡 <span>Show Hint</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-950/30 border border-amber-800/40 rounded-lg text-xs text-amber-200">
                </div>
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden p-4 rounded-lg bg-slate-900 border border-slate-700 space-y-2">
                <div class="flex items-center gap-2 font-semibold text-sm text-slate-200">
                    <span id="explanation-icon"></span>
                    <span id="explanation-status"></span>
                </div>
                <p id="explanation-text-en" class="text-xs text-slate-300"></p>
                <p id="explanation-text-hi" class="text-xs text-slate-400"></p>
            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="mt-6 flex flex-wrap items-center justify-between gap-4 bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div class="flex gap-2">
                <button id="prev-btn" onclick="prevQuestion()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Previous
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-lg text-sm font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Next
                </button>
            </div>

            <!-- Jump to Question -->
            <div class="flex items-center gap-2">
                <label for="jump-input" class="text-xs text-slate-400">Go to:</label>
                <input type="number" id="jump-input" min="1" max="96" class="w-16 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-center focus:outline-none focus:border-amber-400" placeholder="1-96">
                <button onclick="jumpToQuestion()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-medium">Jump</button>
            </div>
        </div>
    </main>

                hintHi: "जींद में जयंती देवी मंदिर के पास की चेतंग नहर।",
                expEn: "Jayanti Devi Temple (Jind) stands on the banks of the ancient Chetang stream/canal channel.",
                expHi: "जयंती देवी मंदिर जींद में चेतंग नहर के पूर्वी तट पर स्थित है।"
            },
            {
                id: 1781,
                qEn: "Where was a fort made of bricks constructed during the reign of Mughal Emperor Akbar?",
                qHi: "बादशाह अकबर के समय ईंटों का किला कहाँ बनाया गया?",
                options: [
                    { textEn: "Safidon (Jind)", textHi: "सफीदों (जींद)", correct: true },
                    { textEn: "Hansi", textHi: "हाँसी", correct: false },
                    { textEn: "Kaithal", textHi: "कैथल", correct: false },
                    { textEn: "Karnal", textHi: "करनाल", correct: false }
                ],
                hintEn: "Historic town Sarpadaman / Safidon in Jind district.",
                hintHi: "जींद जिले के सफीदों में।",
                expEn: "During Akbar's reign, a brick fort (Inton ka Qila) was erected at Safidon.",
                expHi: "अकबर के शासनकाल के दौरान ईंटों का किला सफीदों (जींद) में बनाया गया था।"
            },
            {
                id: 1782,
                qEn: "Where is the Hansraj Tirtha associated with Rishi Barbarik located?",
                qHi: "हंसराज तीर्थ जो बर्बरीक से संबंधित है, कहाँ स्थित है?",
                options: [
                    { textEn: "Safidon (Jind)", textHi: "सफीदों (जींद)", correct: true },
                    { textEn: "Pehowa", textHi: "पेहोवा", correct: false },
                    { textEn: "Kurukshetra", textHi: "कुरुक्षेत्र", correct: false },
                    { textEn: "Hansi", textHi: "हाँसी", correct: false }
                ],
                hintEn: "Located in Jind district at Safidon.",
                hintHi: "जींद जिले के सफीदों क्षेत्र में।",
                expEn: "Hansraj Tirtha (linked to Barbarik of Mahabharata fame) is situated in Safidon, Jind district.",
                expHi: "बर्बरीक से संबंधित हंसराज तीर्थ सफीदों (जींद) में स्थित है।"
            }
        ];

        // Unique Scrambled Options Generator & State Management
        let currentIdx = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledQuestions = [];

        // Fisher-Yates Shuffle helper
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize quiz with randomized option positions for each question
        function initQuiz() {
            shuffledQuestions = quizData.map(q => {
                return {
                    ...q,
                    shuffledOptions: shuffle(q.options)
                };
            });
            renderQuestion();
        }

        function renderQuestion() {
            const q = shuffledQuestions[currentIdx];
            
            // Text updates
            document.getElementById('question-number').innerText = `Question ${currentIdx + 1} of ${shuffledQuestions.length}`;
            document.getElementById('question-id').innerText = `Source ID: Q${q.id}`;
            document.getElementById('question-text-en').innerText = q.qEn;
            document.getElementById('question-text-hi').innerText = q.qHi;
            
            // Progress Bar & Score
            const progressPct = ((currentIdx + 1) / shuffledQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;
            updateScoreDisplay();

            // Hint setup
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-box').innerText = `${q.hintEn} \n ${q.hintHi}`;

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const letters = ['A', 'B', 'C', 'D'];
            const userChoice = userAnswers[currentIdx];

            q.shuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-3.5 rounded-lg border text-sm flex items-start gap-3 transition-all `;
                
                // Color formatting based on selection state
                if (userChoice !== null) {
                    btn.disabled = true;
                    if (opt.correct) {
                        btn.classList.add('bg-emerald-950/50', 'border-emerald-500', 'text-emerald-200');
                    } else if (userChoice === idx) {
                        btn.classList.add('bg-rose-950/50', 'border-rose-500', 'text-rose-200');
                    } else {
                        btn.classList.add('bg-slate-800/50', 'border-slate-700', 'opacity-50');
                    }
                } else {
                    btn.classList.add('bg-slate-900', 'border-slate-700', 'hover:border-amber-400', 'text-slate-200');
                    btn.onclick = () => selectOption(idx);
                }

                btn.innerHTML = `
                    <span class="font-bold text-amber-400 text-xs px-2 py-0.5 bg-slate-800 border border-slate-700 rounded shrink-0">${letters[idx]}</span>
                    <div>
                        <div class="font-medium">${opt.textEn}</div>
                        <div class="text-xs text-slate-400 font-normal mt-0.5">${opt.textHi}</div>
                    </div>
                `;
                optionsContainer.appendChild(btn);
            });

            // Explanation box setup
            const expBox = document.getElementById('explanation-box');
            if (userChoice !== null) {
                const isCorrect = q.shuffledOptions[userChoice].correct;
                document.getElementById('explanation-icon').innerText = isCorrect ? '✅' : '❌';
                document.getElementById('explanation-status').innerText = isCorrect ? 'Correct Answer!' : 'Incorrect Answer!';
                document.getElementById('explanation-status').className = isCorrect ? 'font-semibold text-sm text-emerald-400' : 'font-semibold text-sm text-rose-400';
                document.getElementById('explanation-text-en').innerText = q.expEn;
                document.getElementById('explanation-text-hi').innerText = q.expHi;
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            // Controls state
            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').disabled = currentIdx === shuffledQuestions.length - 1;
        }

        function selectOption(optionIndex) {
            userAnswers[currentIdx] = optionIndex;
            renderQuestion();
        }

        function updateScoreDisplay() {
            let correctCount = 0;
            let answeredCount = 0;
            userAnswers.forEach((ans, i) => {
                if (ans !== null) {
                    answeredCount++;
                    if (shuffledQuestions[i].shuffledOptions[ans].correct) {
                        correctCount++;
                    }
                }
            });
            document.getElementById('score').innerText = correctCount;
            document.getElementById('total-answered').innerText = answeredCount;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIdx < shuffledQuestions.length - 1) {
                currentIdx++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value);
            if (val >= 1 && val <= shuffledQuestions.length) {
                currentIdx = val - 1;
                renderQuestion();
                input.value = '';
            }
        }

        // Start Quiz on page load
        window.onload = initQuiz;
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
