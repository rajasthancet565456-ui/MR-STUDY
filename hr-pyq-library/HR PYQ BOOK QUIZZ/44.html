        // Application State
        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredState = new Array(quizData.length).fill(false);

        // DOM Elements
        const questionSourceTag = document.getElementById('question-source-tag');
        const questionTypeTag = document.getElementById('question-type-tag');
        const questionTextEn = document.getElementById('question-text-en');
        const questionTextHi = document.getElementById('question-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const hintToggleBtn = document.getElementById('hint-toggle-btn');
        const hintBtnText = document.getElementById('hint-btn-text');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationIcon = document.getElementById('explanation-icon');
        const explanationTitle = document.getElementById('explanation-title');
        const explanationTextEn = document.getElementById('explanation-text-en');
        const explanationTextHi = document.getElementById('explanation-text-hi');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const resetBtn = document.getElementById('reset-btn');

        // Initialize Quiz
        function initQuiz() {
            loadQuestion(currentIndex);
            updateProgress();
        }

        // Shuffle helper to randomize options per requirements
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Pre-shuffle options for each question once during startup to keep them stable during navigation
        quizData.forEach(q => {
            if (!q.shuffledOptions) {
                // Attach original index reference or map
                q.originalOptionsWithIndex = q.options.map((opt, idx) => ({ ...opt, originalIdx: idx }));
                q.shuffledOptions = shuffleArray([...q.originalOptionsWithIndex]);
            }
        });

        // Load Question into UI
        function loadQuestion(index) {
            const q = quizData[index];
            
            // Meta tags
            questionSourceTag.textContent = `${q.page} • Q${index + 1}`;
            questionTypeTag.textContent = q.type;

            // Text
            questionTextEn.textContent = `${index + 1}. ${q.qEn}`;
            questionTextHi.textContent = q.qHi;

            // Clear hint and explanation
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            hintBtnText.textContent = "Show Hint";
            
            // Render options
            optionsContainer.innerHTML = '';
            q.shuffledOptions.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between text-sm sm:text-base font-medium bg-slate-700/50 border-slate-600 hover:bg-slate-700 hover:border-slate-500 text-slate-200`;
                
                const spanText = document.createElement('span');
                spanText.innerHTML = `<span class="font-bold text-pink-400 mr-2">${String.fromCharCode(65 + optIdx)}.</span> ${opt.en} <br/><span class="text-xs text-pink-200/80 font-serif ml-5">${opt.hi}</span>`;
                btn.appendChild(spanText);

                // Check if already answered
                if (answeredState[index]) {
                    btn.disabled = true;
                    if (opt.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between text-sm sm:text-base font-medium bg-emerald-950/60 border-emerald-600 text-emerald-200";
                    } else if (userAnswers[index] === optIdx) {
                        btn.className = "w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between text-sm sm:text-base font-medium bg-rose-950/60 border-rose-600 text-rose-200";
                    } else {
                        btn.className = "w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between text-sm sm:text-base font-medium bg-slate-800/40 border-slate-700 text-slate-500 opacity-60";
                    }
                } else {
                    btn.onclick = () => selectOption(index, optIdx);
                }

                optionsContainer.appendChild(btn);
            });

            // Handle Explanation box state
            if (answeredState[index]) {
                showExplanationBox(index);
            } else {
                explanationBox.classList.add('hidden');
            }

            // Button controls state
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? "Finish" : "Next";
            jumpInput.value = index + 1;
        }

        // Option Selection Handler
        function selectOption(qIdx, optIdx) {
            if (answeredState[qIdx]) return;

            answeredState[qIdx] = true;
            userAnswers[qIdx] = optIdx;

            const selectedOpt = quizData[qIdx].shuffledOptions[optIdx];
            if (selectedOpt.correct) {
                score++;
            }

            scoreDisplay.textContent = `${score} / ${quizData.length}`;
            updateProgress();
            loadQuestion(qIdx); // Reload to apply color styling to options
        }

        // Show Explanation Box
        function showExplanationBox(index) {
            const q = quizData[index];
            const userAnsIdx = userAnswers[index];
            const selectedOpt = q.shuffledOptions[userAnsIdx];
            const isCorrect = selectedOpt && selectedOpt.correct;

            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-emerald-950/40 border-emerald-700/60 text-emerald-200 transition-all";
                explanationIcon.innerHTML = `<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                explanationTitle.textContent = "Correct Answer! / सही उत्तर!";
                explanationTitle.className = "font-bold text-sm text-emerald-400";
            } else {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-rose-950/40 border-rose-700/60 text-rose-200 transition-all";
                explanationIcon.innerHTML = `<svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                explanationTitle.textContent = "Incorrect Answer / गलत उत्तर";
                explanationTitle.className = "font-bold text-sm text-rose-400";
            }

            explanationTextEn.innerHTML = `<strong>Explanation:</strong> ${q.expEn}`;
            explanationTextHi.innerHTML = `<strong>स्पष्टीकरण:</strong> ${q.expHi}`;
        }

        // Update Progress Bar
        function updateProgress() {
            const answeredCount = answeredState.filter(Boolean).length;
            const percentage = (answeredCount / quizData.length) * 100;
            progressBar.style.width = `${percentage}%`;
        }

        // Event Listeners for Navigation
        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        };

        nextBtn.onclick = () => {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`Quiz Completed! Your Final Score is: ${score} / ${quizData.length}`);
            }
        };

        jumpBtn.onclick = () => {
            const val = parseInt(jumpInput.value) - 1;
            if (val >= 0 && val < quizData.length) {
                currentIndex = val;
                loadQuestion(currentIndex);
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        };

        jumpInput.onkeypress = (e) => {
            if (e.key === 'Enter') {
                jumpBtn.click();
            }
        };

        hintToggleBtn.onclick = () => {
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBtnText.textContent = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintBtnText.textContent = "Show Hint";
            }
        };

        resetBtn.onclick = () => {
            if (confirm("Are you sure you want to reset your quiz progress?")) {
                currentIndex = 0;
                score = 0;
                userAnswers = new Array(quizData.length).fill(null);
                answeredState = new Array(quizData.length).fill(false);
                scoreDisplay.textContent = `0 / ${quizData.length}`;
                initQuiz();
            }
        };

        // Initialize on load
        window.onload = initQuiz;
    </script>
