                    <!-- Options injected dynamically -->
                </div>

                <!-- Action Controls (Hint, Explanation) -->
                <div class="flex flex-wrap items-center gap-3 pt-2">
                    <button id="hint-btn" onclick="toggleHint()" class="text-xs md:text-sm font-medium px-3.5 py-2 rounded-lg border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 flex items-center gap-1.5 transition">

                    <span class="font-bold">Hint:</span> <span id="hint-text"></span>
                </div>

                <!-- Explanation Box -->
                <div id="explanation-box" class="hidden mt-4 p-4 bg-blue-50 border-l-4 border-blue-500 text-blue-900 rounded-r-md">
                    <p class="font-bold text-sm mb-1">Explanation / Rationale:</p>

                </div>
            </div>

                <button id="prev-btn" onclick="prevQuestion()" class="px-5 py-2.5 bg-slate-200 text-slate-700 rounded-lg font-semibold hover:bg-slate-300 disabled:opacity-50 disabled:cursor-not-allowed text-sm transition">

                    Next →
                </button>
            </div>
        </div>
    </main>

        // Shuffle Options Helper Function
        function shuffleArray(array) {
            let cur = array.length, rIndex;
            let cloned = [...array];
            while (cur !== 0) {
                rIndex = Math.floor(Math.random() * cur);
                cur--;
                [cloned[cur], cloned[rIndex]] = [cloned[rIndex], cloned[cur]];
            }
            return cloned;
        }

        // State Management Variables
        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(rawQuestions.length).fill(null);
        let processedQuestions = [];

        // Initialize and shuffle options per question
        function initQuestions() {
            processedQuestions = rawQuestions.map((q) => {
                const shuffledOpts = shuffleArray(q.options);
                return {
                    ...q,
                    shuffledOptions: shuffledOpts
                };
            });
            document.getElementById('total-questions').innerText = processedQuestions.length;
            renderQuestion();
        }

        // Render current question to UI
        function renderQuestion() {
            const q = processedQuestions[currentIndex];
            
            // Text updates
            document.getElementById('current-num').innerText = currentIndex + 1;
            document.getElementById('question-source').innerText = `${q.page} - Q#${q.num}`;
            document.getElementById('question-hi').innerText = `${currentIndex + 1}. ${q.hi}`;
            document.getElementById('question-en').innerText = q.en;
            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('explanation-text').innerText = q.exp;

            // Reset collapsible elements
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('explanation-box').classList.add('hidden');

            // Render options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const selected = userAnswers[currentIndex];

            q.shuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border border-slate-200 font-medium text-slate-800 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 transition-all flex justify-between items-center text-sm md:text-base shadow-sm`;
                
                const charCode = String.fromCharCode(65 + idx);
                btn.innerHTML = `<span class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-700 text-xs flex items-center justify-center font-bold">${charCode}</span>
                    <span>${opt}</span>
                </span>`;

                if (selected !== null) {
                    btn.disabled = true;
                    if (opt === q.correct) {
                        btn.classList.remove('bg-slate-50', 'border-slate-200');
                        btn.classList.add('bg-green-100', 'border-green-500', 'text-green-900', 'font-semibold');
                        btn.innerHTML += `<span class="text-green-600 font-bold">✓</span>`;
                    } else if (opt === selected) {
                        btn.classList.remove('bg-slate-50', 'border-slate-200');
                        btn.classList.add('bg-red-100', 'border-red-500', 'text-red-900', 'font-semibold');
                        btn.innerHTML += `<span class="text-red-600 font-bold">✗</span>`;
                    }
                } else {
                    btn.onclick = () => handleSelectOption(opt);
                }

                container.appendChild(btn);
            });

            if (selected !== null) {
                document.getElementById('explanation-box').classList.remove('hidden');
            }

            // Update Controls
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === processedQuestions.length - 1;
            
            // Progress Bar Update
            const pct = ((currentIndex + 1) / processedQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        // Option Selection Handler
        function handleSelectOption(opt) {
            const q = processedQuestions[currentIndex];
            userAnswers[currentIndex] = opt;

            if (opt === q.correct) {
                score++;
                document.getElementById('score').innerText = score;
            }

            renderQuestion();
        }

        // Controls Logic
        function nextQuestion() {
            if (currentIndex < processedQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value);
            if (val >= 1 && val <= processedQuestions.length) {
                currentIndex = val - 1;
                renderQuestion();
                input.value = '';
            }
        }

        function toggleHint() {
            const box = document.getElementById('hint-box');
            box.classList.toggle('hidden');
        }

        // Initialize quiz on page load
        window.onload = initQuestions;
    </script>
