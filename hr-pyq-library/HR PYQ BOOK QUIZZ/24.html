<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-xl md:text-2xl font-bold">Haryana GK Prep Master (हरियाणा सामान्य ज्ञान)</h1>
                <p class="text-xs md:text-sm text-indigo-200">Based on Official PYQ Dataset | 78 Unique Bilingual Questions</p>
            </div>
            <div class="flex items-center gap-4 bg-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-700">
                <span class="text-xs text-indigo-200">Score:</span>
                <span id="score-display" class="text-lg font-bold text-green-400">0 / 0</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- Control Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-wrap items-center justify-between gap-4">
            <!-- Progress Bar -->
            <div class="w-full md:w-1/2">
                <div class="flex justify-between text-xs text-slate-500 mb-1">
                    <span id="progress-text">Question 1 of 78</span>
                    <span id="progress-percent">1% Completed</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 1.28%"></div>
                </div>
            </div>

            <!-- Jump to Question Input -->
            <div class="flex items-center gap-2">
                <label for="jump-input" class="text-sm font-medium text-slate-600">Go to Q#:</label>
                <input type="number" id="jump-input" min="1" max="78" placeholder="1" class="w-16 px-2 py-1 border rounded text-center text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="jumpToQuestion()" class="px-3 py-1 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition">Go</button>
            </div>
        </div>

        <!-- Question Card -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            
            <!-- Language Tab Toggle -->
            <div class="flex border-b border-slate-200 mb-4">
                <button id="tab-hi" onclick="switchLang('hi')" class="tab-btn active px-4 py-2 text-sm focus:outline-none">हिंदी (Hindi)</button>
                <button id="tab-en" onclick="switchLang('en')" class="tab-btn px-4 py-2 text-sm focus:outline-none">English</button>
            </div>

            <!-- Question Number Tag -->
            <div class="flex justify-between items-center mb-3">
                <span id="q-badge" class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-indigo-200">Q. 2293 / Page 52</span>
            </div>

            <!-- Question Text -->
            <div id="question-text" class="text-base md:text-lg font-medium text-slate-900 mb-6 leading-relaxed">
                <!-- Injected dynamically -->
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="grid grid-cols-1 gap-3 mb-6">
                <!-- Injected dynamically -->
            </div>

            <!-- Collapsible Hint Button -->
            <div class="mb-4">
                <button onclick="toggleHint()" class="inline-flex items-center text-xs font-medium text-amber-600 hover:text-amber-700 focus:outline-none">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Need a Hint? / संकेत देखें
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-800">
                    <!-- Injected dynamically -->
                </div>
            </div>

            <!-- Rationale / Explanation Box -->
            <div id="explanation-box" class="hidden p-4 rounded-lg bg-slate-50 border-l-4 border-indigo-500 text-sm">
                <h4 class="font-bold text-slate-800 mb-1 flex items-center">
                    <svg class="w-4 h-4 mr-1.5 text-indigo-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
                    Explanation / व्याख्या:
                </h4>
                <p id="explanation-text" class="text-slate-600 leading-normal">
                    <!-- Injected dynamically -->
                </p>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between items-center">
            <button id="prev-btn" onclick="prevQuestion()" class="px-5 py-2.5 bg-slate-200 text-slate-700 font-medium text-sm rounded-lg hover:bg-slate-300 disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Previous
            </button>
            <button id="next-btn" onclick="nextQuestion()" class="px-5 py-2.5 bg-indigo-600 text-white font-medium text-sm rounded-lg hover:bg-indigo-700 transition flex items-center">
                Next <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>

    </main>

        // Shuffle Array utility
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize Quiz
        function loadQuestion(index) {
            const item = dataset[index];
            const data = item[currentLang];

            // Badge & Meta
            document.getElementById('q-badge').innerText = `Q. ${item.id} / Page ${item.page}`;
            document.getElementById('progress-text').innerText = `Question ${index + 1} of ${dataset.length}`;
            const pct = Math.round(((index + 1) / dataset.length) * 100);
            document.getElementById('progress-percent').innerText = `${pct}% Completed`;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            // Text
            document.getElementById('question-text').innerText = `${index + 1}. ${data.q}`;

            // Hint
            document.getElementById('hint-box').innerText = data.hint;
            document.getElementById('hint-box').classList.add('hidden');

            // Explanation
            document.getElementById('explanation-text').innerText = data.exp;
            document.getElementById('explanation-box').classList.add('hidden');

            // Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // Shuffle options for predictability prevention
            currentShuffledOptions = shuffleArray(data.options);

            currentShuffledOptions.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = "option-card w-full text-left p-3.5 border border-slate-200 rounded-lg hover:bg-indigo-50 hover:border-indigo-300 focus:outline-none transition flex items-center justify-between";
                btn.innerHTML = `<span class="text-sm md:text-base font-medium">${opt}</span><span class="indicator text-xs font-semibold px-2 py-0.5 rounded"></span>`;
                btn.onclick = () => selectOption(btn, opt, data.ans);
                optionsContainer.appendChild(btn);
            });

            // Button States
            document.getElementById('prev-btn').disabled = (index === 0);
            if (index === dataset.length - 1) {
                document.getElementById('next-btn').innerText = 'Finish Quiz';

            buttons.forEach(btn => btn.disabled = true);

            const isCorrect = (selectedOpt === correctAns);

            buttons.forEach(btn => {
                const optText = btn.querySelector('span').innerText;
                if (optText === correctAns) {
                    btn.classList.remove('border-slate-200');
                    btn.classList.add('bg-green-100', 'border-green-500', 'text-green-900');

            if (!answeredQuestions.has(currentIndex)) {
                answeredQuestions.add(currentIndex);
                if (isCorrect) score++;
                document.getElementById('score-display').innerText = `${score} / ${answeredQuestions.size}`;
            }

            // Show Rationale
            document.getElementById('explanation-box').classList.remove('hidden');
        }

        // Language Switcher
        function switchLang(lang) {
            currentLang = lang;
            document.getElementById('tab-hi').classList.toggle('active', lang === 'hi');
            document.getElementById('tab-en').classList.toggle('active', lang === 'en');
            loadQuestion(currentIndex);
        }

        // Navigation
        function nextQuestion() {
            if (currentIndex < dataset.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val >= 1 && val <= dataset.length) {
                currentIndex = val - 1;
                loadQuestion(currentIndex);
            }
        }

        function toggleHint() {
            const box = document.getElementById('hint-box');
            box.classList.toggle('hidden');
        }

        // Init App
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
