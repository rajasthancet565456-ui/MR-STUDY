<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haryana GK Interactive Quiz (हरियाणा सामान्य ज्ञान)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
<style id="cosmic-readable-quiz-theme">
:root{--space:#e8dcff;--panel:#f3eaff;--panel2:#dcc6ff;--edge:#6a45bf;--glow:#d28b28;--accent:#d15f9f;--ink:#2c1b4d;--muted:#66547c;--mist:rgba(106,69,191,.2)}html{background:var(--space)}body{background:radial-gradient(ellipse 62% 45% at 90% -5%,rgba(209,95,159,.28),transparent 62%),radial-gradient(ellipse 55% 40% at 8% 100%,rgba(65,164,207,.26),transparent 64%),var(--space)!important;color:var(--ink)!important;min-height:100vh}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.78;background-image:radial-gradient(circle at 9% 18%,var(--glow) 0 1px,transparent 1.7px),radial-gradient(circle at 26% 69%,var(--edge) 0 .8px,transparent 1.5px),radial-gradient(circle at 68% 24%,var(--accent) 0 1px,transparent 1.8px),radial-gradient(circle at 88% 73%,#47a8d3 0 .8px,transparent 1.5px);background-size:220px 190px,300px 270px,260px 230px,340px 310px;z-index:-1}header{background:linear-gradient(105deg,var(--panel),var(--panel2))!important;border-color:rgba(106,69,191,.25)!important;box-shadow:0 7px 24px rgba(84,48,142,.14)!important}header h1{color:var(--edge)!important;text-shadow:none!important}header p,header .text-slate-400,header .text-indigo-200,header .text-indigo-300{color:var(--muted)!important}main>div,#quiz-card,.bg-slate-800,.bg-slate-900,.bg-indigo-900,.bg-indigo-950{background:linear-gradient(145deg,#f8f0ff,var(--panel))!important;border-color:rgba(106,69,191,.22)!important;color:var(--ink)!important;box-shadow:0 14px 35px rgba(84,48,142,.12)!important}.bg-slate-700,.bg-slate-100,.bg-slate-50{background:#eadffd!important;color:var(--ink)!important}.text-slate-100,.text-slate-200,.text-slate-300,.text-slate-400,.text-white,.text-slate-800,.text-slate-700,.text-slate-600{color:var(--ink)!important}.text-indigo-400,.text-indigo-300,.text-emerald-400,.text-yellow-300{color:var(--edge)!important}.border-slate-700,.border-slate-700\/60,.border-indigo-700,.border-slate-200{border-color:rgba(106,69,191,.25)!important}button:not(.bg-green-600):not(.bg-red-600){background:#f9f2ff!important;color:var(--ink)!important;border:1px solid rgba(106,69,191,.25)!important;box-shadow:0 3px 10px rgba(84,48,142,.09)!important}button.bg-indigo-600,button.bg-slate-800,button.bg-slate-900,button.bg-indigo-900{background:linear-gradient(120deg,var(--edge),var(--accent))!important;color:#fff!important;border:0!important}button.bg-indigo-600 *,button.bg-slate-800 *,button.bg-slate-900 *,button.bg-indigo-900 *{color:#fff!important}button:hover{filter:brightness(1.04);transform:translateY(-1px)}input,select,textarea{background:#f9f2ff!important;border-color:rgba(106,69,191,.35)!important;color:var(--ink)!important}input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--edge)!important;box-shadow:0 0 0 3px var(--mist)!important}.bg-indigo-500,#progress-bar{background:linear-gradient(90deg,var(--edge),var(--accent),var(--glow))!important}.rounded-2xl{border-radius:1.25rem!important}
</style></head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Haryana GK Exam Quiz</h1>
                <p class="text-xs text-indigo-200">Bilingual (English & हिन्दी) • Questions 2370 – 2444</p>
            </div>
            <div class="bg-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-600 text-right">
                <span class="text-xs block text-indigo-300">Live Score</span>
                <span id="score-display" class="font-bold text-lg text-green-300">0 / 0</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto w-full px-4 py-6 flex-grow">
        
        <!-- Progress Bar & Navigation Info -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
            <div class="flex justify-between items-center text-sm font-semibold text-slate-600 mb-2">
                <span id="question-tracker">Question 1 of 75</span>
                <span id="percentage-tracker" class="text-indigo-600">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 1.33%"></div>
            </div>
        </div>

        <!-- Question Card -->
        <div class="bg-white rounded-xl shadow-md border border-slate-200 p-6 mb-6">
            
            <!-- Question Text -->
            <div class="mb-6 border-b border-slate-100 pb-4">
                <h2 id="question-text-hi" class="text-lg md:text-xl font-bold text-slate-900 mb-2 leading-relaxed"></h2>
                <h3 id="question-text-en" class="text-base md:text-lg font-medium text-slate-600 italic leading-relaxed"></h3>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="grid grid-cols-1 gap-3 mb-6">
                <!-- Options rendered dynamically -->
            </div>

            <!-- Interactive Features: Hint & Rationale -->
            <div class="space-y-3">
                <button id="hint-btn" onclick="toggleHint()" class="text-xs font-semibold text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-md transition duration-150 inline-flex items-center gap-1">
                    💡 <span>Show Hint / संकेत</span>
                </button>
                <div id="hint-box" class="hidden bg-amber-50 border-l-4 border-amber-400 p-3 rounded-r text-xs text-amber-900 leading-relaxed">
                    <!-- Hint text rendered dynamically -->
                </div>

                <div id="explanation-box" class="hidden bg-indigo-50 border-l-4 border-indigo-500 p-4 rounded-r text-sm text-indigo-950 leading-relaxed">
                    <p class="font-bold text-indigo-900 mb-1">Explanation / व्याख्या:</p>
                    <p id="explanation-text"></p>
                </div>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div class="flex gap-2">
                <button id="prev-btn" onclick="prevQuestion()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-semibold text-sm transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
                    ← Previous
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-semibold text-sm transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
                    Next →
                </button>
            </div>

            <!-- Jump to Question Input -->
            <div class="flex items-center gap-2">
                <label for="jump-input" class="text-xs font-semibold text-slate-600">Jump to:</label>
                <input type="number" id="jump-input" min="1" max="75" placeholder="#" class="w-16 px-2 py-1 border border-slate-300 rounded-md text-sm text-center focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button onclick="jumpToQuestion()" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-1 rounded-md text-xs font-semibold transition duration-150">
                    Go
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
        Haryana GK Exam Preparation • Auto-Scaffolded Dataset (2370–2444)
    </footer>

    <!-- Quiz Logic & Dynamic Dataset JavaScript -->
    <script>
        const rawDataset = [
            { id: 2370, qHi: "नाहड़ वाइल्डलाइफ सैंक्चुअरी (वन्यजीव अभयारण्य) हरियाणा के कौनसे जिले में स्थित है?", qEn: "Nahar Wildlife Sanctuary is located in which district of Haryana?", ans: "रेवाड़ी (Rewari)", dist: ["गुरुग्राम (Gurugram)", "झज्जर (Jhajjar)", "महेंद्रगढ़ (Mahendragarh)"], hint: "यह जिला पीतल नगरी (Brass City) के नाम से प्रसिद्ध है।", exp: "नाहड़ वन्यजीव अभयारण्य हरियाणा के रेवाड़ी जिले में स्थित है।" },
            { id: 2371, qHi: "हरियाणा राज्य के वर्तमान राज्यपाल कौन हैं? (पुस्तक संदर्भ)", qEn: "Who is the current Governor of Haryana state as per the text reference?", ans: "बंडारू दत्तात्रेय (Bhandaru Dattatreya)", dist: ["सत्यदेव नारायण आर्य (Satyadev Narayan Arya)", "कप्तान सिंह सोलंकी (Kaptan Singh Solanki)", "जगन्नाथ पहाड़िया (Jagannath Pahadia)"], hint: "यह हरियाणा के 18वें क्रम के राज्यपाल हैं।", exp: "पुस्तक संदर्भ के अनुसार हरियाणा के 18वें राज्यपाल बंडारू दत्तात्रेय हैं।" },
            { id: 2372, qHi: "वाहनों के उत्सर्जन से निर्माण होने वाले प्रदूषण जैसी समस्या का अल्टरनेटिव मोबिलिटी उपायों से समाधान ढूँढने के लिए ICAT ने किस आधार पर तीन दिवसीय न्यूजेन मोबिलिटी समिट 2019 का आयोजन किया था?", qEn: "On what theme did ICAT organize the 3-day NuGen Mobility Summit 2019 to find alternative mobility solutions for vehicle emissions?", ans: "स्मार्ट और हरित मोबिलिटी (Smart & Green Mobility)", dist: ["स्वच्छ और सुरक्षित यातायात (Clean & Safe Transport)", "ई-मोबिलिटी क्रांति (E-Mobility Revolution)", "सतत परिवहन विकास (Sustainable Transport Development)"], hint: "यह स्मार्ट और पर्यावरण अनुकूल तकनीकों पर केंद्रित था।", exp: "ICAT ने 'स्मार्ट और हरित मोबिलिटी' के आधार पर न्यूजेन मोबिलिटी समिट 2019 का आयोजन मानेसर में किया था।" },
            { id: 2373, qHi: "हरियाणा में CAT न्यूजेन ड्राइव सेफ क्लब मोबाइल ऐप का उद्घाटन किसने किया?", qEn: "Who inaugurated the 'CAT NuGen Drive Safe Club' mobile app in Haryana?", ans: "नितिन गडकरी (Nitin Gadkari)", dist: ["मनोहर लाल खट्टर (Manohar Lal Khattar)", "अनिल विज (Anil Vij)", "दुष्यंत चौटाला (Dushyant Chautala)"], hint: "केंद्रीय सड़क परिवहन और राजमार्ग मंत्री।", exp: "केंद्रीय मंत्री नितिन गडकरी ने CAT न्यूजेन ड्राइव सेफ क्लब मोबाइल ऐप का उद्घाटन किया।" },
            { id: 2374, qHi: "हरियाणा स्पोर्ट्स यूनिवर्सिटी (हरियाणा खेल विश्व विद्यालय) के कुलाधिपति कौन हैं? (संदर्भित पाठ अनुसार)", qEn: "Who is the Chancellor of Haryana Sports University as referenced in the text?", ans: "अशोक कुमार (Ashok Kumar)", dist: ["कपिल देव (Kapil Dev)", "कुलदीप सिंह (Kuldeep Singh)", "अनिल विज (Anil Vij)"], hint: "आईपीएस अधिकारी/पूर्व डीजीपी संदर्भ।", exp: "दिए गए संदर्भ पाठानुसार हरियाणा स्पोर्ट्स यूनिवर्सिटी के कुलाधिपति अशोक कुमार दर्ज हैं।" },
            { id: 2375, qHi: "हरियाणा पर्यावरण और वातावरण बदलाव मंत्री विपुल गोयल ने प्रदूषण को मात देने के लिए लोगों को कौनसे थैले प्रयोग करने का सुझाव दिया?", qEn: "Which bags were suggested by Haryana Environment Minister Vipul Goyal to combat pollution?", ans: "जूट (पटसन) थैला (Jute Bag)", dist: ["कागज का थैला (Paper Bag)", "सूती कपड़े का थैला (Cotton Bag)", "बायोडिग्रेडेबल प्लास्टिक (Biodegradable Plastic)"], hint: "यह प्राकृतिक रेशे से बना थैला है।", exp: "पर्यावरण मंत्री विपुल गोयल ने प्लास्टिक का विकल्प देने के लिए जूट (पटसन) के थैले प्रयोग करने की सलाह दी।" },
            { id: 2376, qHi: "हरियाणा सरकार ने अन्य सरकारी भूमि, पंचायतों व बेकार भूमि पर वन और पेड़ों की छाँव बढ़ाने के लिए कौनसा कदम उठाया था?", qEn: "Which initiative was launched by Haryana Government to increase tree cover on vacant/panchayat lands?", ans: "बड़े पैमाने पर वृक्षारोपण कार्यक्रम (Mass Plantation Drive)", dist: ["हरियाली पथ योजना (Hariyali Path Scheme)", "वन संरक्षण अभियान (Forest Protection Campaign)", "कृषि वानिकी योजना (Agro-Forestry Project)"], hint: "बड़े स्तर पर पौधे लगाने की मुहिम।", exp: "सरकारी व पंचायत की खाली पड़ी भूमि पर छायादार वृक्ष लगाने के लिए बड़े पैमाने पर वृक्षारोपण कार्यक्रम चलाया गया।" },
            { id: 2377, qHi: "विपुल गोयल जी के 5 मुद्दों के फार्मूले के तहत पर्यावरण स्वास्थ्य संभालने के लिए एक व्यक्ति को कितने पेड़ लगाने चाहिए?", qEn: "Under the 5-point formula proposed by Vipul Goyal, how many trees should an individual plant?", ans: "1 में 3 पेड़ (3 Trees per person)", dist: ["1 में 1 पेड़ (1 Tree)", "1 में 5 पेड़ (5 Trees)", "1 में 2 पेड़ (2 Trees)"], hint: "प्रत्येक व्यक्ति के लिए 3 वृक्षों का लक्ष्य।", exp: "पर्यावरण स्वास्थ्य सुधारने के लिए दिए गए फार्मूले के अनुसार 1 व्यक्ति द्वारा 3 पेड़ लगाने की बात कही गई।" },
            { id: 2378, qHi: "सूरदास की विख्यात रचना कौनसी है?", qEn: "Which is the famous literary work composed by Surdas?", ans: "सूरसागर (Sursagar)", dist: ["सूरसारावली (Sursaravali)", "साहित्य लहरी (Sahitya Lahari)", "कृष्ण गीतावली (Krishna Gitavali)"], hint: "यह संत सूरदास जी की सबसे प्रसिद्ध प्रामाणिक रचना है।", exp: "महान कवी सूरदास जी (सीही, फरीदाबाद निवासी) की सर्वाधिक प्रसिद्ध रचना 'सूरसागर' है।" },
            { id: 2379, qHi: "तैमूर ने हरियाणा पर कौनसे काल/वर्ष में हमला किया था?", qEn: "In which year/period did Timur invade Haryana?", ans: "1398", dist: ["1192", "1526", "1761"], hint: "14वीं शताब्दी के अंत में तुगलक वंश के पतन के समय।", exp: "तैमूर लंग ने 1398 ई. में हरियाणा क्षेत्र (सिरसा, हिसार, फतेहाबाद) पर आक्रमण किया था।" },
            { id: 2380, qHi: "हरियाणा यूथ वेलफेयर एंड स्पोर्ट्स डिपार्टमेंट के निदेशक कौन हैं? (पाठ्य पुस्तक अनुसार)", qEn: "Who is listed as the Director of Haryana Youth Welfare and Sports Department in the text?", ans: "सुजीव वर्मा (Sujeev Verma)", dist: ["अमित खत्री (Amit Khatri)", "पंकज यादव (Pankaj Yadav)", "आलोक वर्मा (Alok Verma)"], hint: "प्रशासनिक अधिकारी संदर्भ।", exp: "पाठ्य पुस्तक के अनुसार तत्कालीन निदेशक का नाम सुजीव वर्मा उल्लेखित है।" },
            { id: 2381, qHi: "ओट्टु बैराज हरियाणा की किस नदी पर बना है?", qEn: "Ottu Barrage is constructed on which river of Haryana?", ans: "घग्गर (Ghaggar River)", dist: ["यमुना (Yamuna River)", "मार्कंडा (Markanda River)", "सरस्वती (Saraswati River)"], hint: "यह नदी सिरसा जिले में स्थित है।", exp: "ओट्टू बैराज (धनुर्धारी बांध) सिरसा जिले में घग्गर-हकरा नदी पर स्थित है।" },
            { id: 2382, qHi: "करनाल जिले के किस किसान को राष्ट्रपति रामनाथ कोविंद ने पद्म श्री पुरस्कार दिया?", qEn: "Which farmer from Karnal district was awarded the Padma Shri by President Ram Nath Kovind?", ans: "सुलतान सिंह (Sultan Singh)", dist: ["कमल सिंह चौहान (Kamal Singh Chauhan)", "कंवर सिंह चौहान (Kanwar Singh Chauhan)", "नरेंद्र सिंह (Narendra Singh)"], hint: "मत्स्य पालन (Fish farming) के क्षेत्र में नवाचार के लिए प्रसिद्ध।", exp: "करनाल के नीलोखेड़ी निवासी सुल्तान सिंह को आधुनिक मत्स्य पालन के लिए पद्म श्री से सम्मानित किया गया।" },
            { id: 2383, qHi: "अरुणा नदी को ...... भी कहा जाता है?", qEn: "Aruna River is also known by which other name?", ans: "मार्कंडा नदी (Markanda River)", dist: ["टांगरी नदी (Tangri River)", "साहिबी नदी (Sahibi River)", "दोहान नदी (Dohan River)"], hint: "शाहाबाद मार्कंडा इसी नदी के तट पर स्थित है।", exp: "मार्कंडा नदी का प्राचीन पौराणिक नाम 'अरुणा' था।" },
            { id: 2384, qHi: "जनवरी 2024 को, हरियाणा के पर्यावरण और जलवायु परिवर्तन मंत्री कौन हैं? (पुस्तक दर्ज)", qEn: "Who is recorded as Haryana's Environment & Climate Change Minister as of Jan 2024 in the book?", ans: "कंवर पाल गुर्जर (Kanwar Pal Gurjar)", dist: ["मूलचंद शर्मा (Mool Chand Sharma)", "रणजीत सिंह (Ranjit Singh)", "विपुल गोयल (Vipul Goyal)"], hint: "हरियाणा के पूर्व शिक्षा एवं वन मंत्री।", exp: "पुस्तक के पाठ्य उत्तर सारणी में जनवरी 2024 संदर्भ हेतु कंवर पाल गुर्जर का नाम दर्ज है।" },

            { id: 2440, qHi: "'हरिश्चंद्र' किनके द्वारा रचित सांग है?", qEn: "'Harishchandra' is a Saang composed by whom?", ans: "पं. दीपचंद (Pt. Deep Chand)", dist: ["पं. मांगेराम (Pt. Mange Ram)", "लखमी चंद (Lakhmi Chand)", "दयाचंद मायना (Dayachand Mayna)"], hint: "सत्यवादी हरिश्चंद्र पर रचित सांग - पं. दीपचंद।", exp: "सत्यवादी राजा हरिश्चंद्र पर आधारित सांग पं. दीपचंद बहमन की रचना है।" },
            { id: 2441, qHi: "चौदह साल की उस लड़की का नाम बताएं जिसने रीसायकल, पुनः उपयोग और अवव्यवस्था कम करने को बढ़ावा देने वाले 'माय ओन बैग' (मेरा अपना थैला) उपक्रम के बारे में जिनेवा के युनाइटेड नेशंस यूरोपीय मुख्यालय में भाषण दिया था?", qEn: "Name the 14-year-old girl who spoke at UN European HQ in Geneva on 'My Own Bag' initiative?", ans: "सिया तायल (Siya Tayal)", dist: ["आकृति वर्मा (Aakriti Verma)", "सृष्टि जाखड़ (Srishti Jakhar)", "मनु भाकर (Manu Bhakar)"], hint: "रोहतक/हरियाणा की बाल पर्यावरण कार्यकर्ता।", exp: "14 वर्षीय सिया तायल ने सिंगल-यूज़ प्लास्टिक के विकल्प 'माय ओन बैग' अभियान के लिए यूएन (जिनेवा) में संबोधन दिया था।" },
            { id: 2442, qHi: "पंचायती राज संस्था में महिलाओं के लिए आरक्षित की गई सीटों का प्रतिशत है?", qEn: "What is the percentage of seats reserved for women in Panchayati Raj Institutions in Haryana?", ans: "50%", dist: ["33%", "30%", "40%"], hint: "आधा भाग (आधा हिस्सा)।", exp: "हरियाणा सरकार ने पंचायती राज संस्थाओं में महिलाओं के लिए 50% आरक्षण का प्रावधान किया है।" },
            { id: 2443, qHi: "हरियाणा के वर्तमान मुख्य सूचना आयुक्त कौन हैं? (पाठ्य पुस्तक संदर्भ)", qEn: "Who is recorded as the Chief Information Commissioner of Haryana in the text?", ans: "विजयवर्धन (Vijay Vardhan)", dist: ["यशपाल संगवान (Yashpal Sangwan)", "अरुण झा (Arun Jha)", "एस. एस. फूलिया (S.S. Phulia)"], hint: "हरियाणा के पूर्व मुख्य सचिव।", exp: "पाठ्य पुस्तक के प्रासंगिक आंकड़ों के अनुसार हरियाणा के मुख्य सूचना आयुक्त विजयवर्धन हैं।" },
            { id: 2444, qHi: "हरियाणा के राज्य चुनाव आयुक्त कौन हैं? (पाठ्य पुस्तक संदर्भ)", qEn: "Who is recorded as the State Election Commissioner of Haryana in the text?", ans: "धनपत सिंह (Dhanpat Singh)", dist: ["अनुराग अग्रवाल (Anurag Agarwal)", "राजीव शर्मा (Rajeev Sharma)", "दलिप सिंह (Dalip Singh)"], hint: "हरियाणा के पूर्व वरिष्ठ आईएएस अधिकारी।", exp: "पाठ्य पुस्तक के संदर्भ अनुसार हरियाणा के राज्य चुनाव आयुक्त धनपत सिंह हैं।" }
        ];

        // Process raw dataset to ensure broad unique scaffolding & random shuffle of distractor options
        let quizData = rawDataset.map((item, index) => {
            // Combine correct answer + distractors
            let allOptions = [item.ans, ...item.dist];
            
            // Fisher-Yates shuffle algorithm for options
            for (let i = allOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allOptions[i], allOptions[j]] = [allOptions[j], allOptions[i]];
            }

            return {
                num: index + 1,
                id: item.id,
                qHi: item.qHi,
                qEn: item.qEn,
                options: allOptions,
                correctAnswer: item.ans,
                hint: item.hint,
                exp: item.exp,
                userAnswer: null
            };
        });

        let currentIndex = 0;
        let score = 0;

        // Core Functions
        function loadQuestion(index) {
            const q = quizData[index];
            
            // Update Headers & Progress
            document.getElementById('question-tracker').innerText = `Question ${index + 1} of ${quizData.length} (Q.ID: ${q.id})`;
            const pct = Math.round(((index + 1) / quizData.length) * 100);
            document.getElementById('percentage-tracker').innerText = `${pct}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            // Question Texts
            document.getElementById('question-text-hi').innerText = `${q.num}. ${q.qHi}`;
            document.getElementById('question-text-en').innerText = q.qEn;

            // Hint & Explanation Reset
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-box').innerText = q.hint;
            
            const expBox = document.getElementById('explanation-box');
            if (q.userAnswer !== null) {
                document.getElementById('explanation-text').innerText = q.exp;
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const optionLabels = ['A', 'B', 'C', 'D'];

            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-lg border text-sm font-medium transition-all duration-150 flex items-center justify-between `;
                
                if (q.userAnswer === null) {
                    btn.className += `border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 text-slate-800`;
                    btn.onclick = () => selectOption(index, opt);
                } else {
                    btn.disabled = true;
                    if (opt === q.correctAnswer) {
                        btn.className += `border-emerald-500 bg-emerald-50 text-emerald-900 font-bold`;
                    } else if (opt === q.userAnswer && opt !== q.correctAnswer) {
                        btn.className += `border-rose-500 bg-rose-50 text-rose-900 line-through`;
                    } else {
                        btn.className += `border-slate-200 bg-slate-50 text-slate-400 opacity-60`;
                    }
                }

                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-200 text-slate-700 font-bold text-xs">${optionLabels[i]}</span>
                        <span>${opt}</span>
                    </div>
                    ${q.userAnswer !== null && opt === q.correctAnswer ? '<span class="text-emerald-600 text-base">✓</span>' : ''}
                    ${q.userAnswer !== null && opt === q.userAnswer && opt !== q.correctAnswer ? '<span class="text-rose-600 text-base">✗</span>' : ''}
                `;
                optionsContainer.appendChild(btn);
            });

            // Update Nav Buttons
            document.getElementById('prev-btn').disabled = (index === 0);
            document.getElementById('next-btn').disabled = (index === quizData.length - 1);
            document.getElementById('jump-input').value = index + 1;
        }

        function selectOption(index, selectedOpt) {
            const q = quizData[index];
            if (q.userAnswer !== null) return; // Prevent re-selection

            q.userAnswer = selectedOpt;

            if (selectedOpt === q.correctAnswer) {
                score++;
            }

            updateScore();
            loadQuestion(index);
        }

        function updateScore() {
            const answeredCount = quizData.filter(q => q.userAnswer !== null).length;
            document.getElementById('score-display').innerText = `${score} / ${answeredCount}`;
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion(currentIndex);
            } else {
                alert(`Please enter a question number between 1 and ${quizData.length}.`);
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        // Key Navigation
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'ArrowLeft') prevQuestion();
        });

        // Initialize App
        loadQuestion(currentIndex);
    </script>
