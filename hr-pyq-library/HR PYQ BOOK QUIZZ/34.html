        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const scoreDisplay = document.getElementById('score-display');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function getShuffledOptions(qIndex, options, correctOpt) {
            if (shuffledOptionsCache[qIndex]) {
                return shuffledOptionsCache[qIndex];
            }
            let shuffled = [...options];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            shuffledOptionsCache[qIndex] = shuffled;
            return shuffled;
        }

        function loadQuestion(index) {
            const q = quizData[index];
            questionTag.innerText = `प्रश्न ${index + 1} / ${quizData.length}`;
            pageSourceTag.innerText = `Source: ${q.page}`;
            questionHi.innerText = q.questionHi;
            questionEn.innerText = q.questionEn;
            
            hintBox.classList.add('hidden');
            hintBox.innerText = q.hint;

            optionsContainer.innerHTML = '';
            const currentShuffledOptions = getShuffledOptions(index, q.options, q.correct);

            currentShuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition-all duration-200 text-sm sm:text-base flex items-center justify-between group ${
                    userAnswers[index] !== null 
                        ? (opt === q.correct 
                            ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-200' 
                            : (userAnswers[index] === opt 
                                ? 'bg-rose-500/20 border-rose-500/50 text-rose-200' 
                                : 'bg-slate-900/40 border-slate-700/60 text-slate-300 opacity-60'))
                        : 'bg-slate-900/60 border-slate-700/80 text-slate-200 hover:bg-slate-700/50 hover:border-slate-600'
                }`;
                
                const optionLabel = String.fromCharCode(65 + idx);
                btn.innerHTML = `<span class="flex items-center gap-3"><span class="w-6 h-6 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-semibold text-slate-400 group-hover:border-indigo-500">${optionLabel}</span> <span>${opt}</span></span>`;
                
                if (userAnswers[index] === null) {
                    btn.onclick = () => selectOption(opt, q.correct, index);
                } else {
                    btn.disabled = true;
                }
                optionsContainer.appendChild(btn);
            });

            if (userAnswers[index] !== null) {
                explanationBox.classList.remove('hidden');
                explanationText.innerText = q.explanation;
            } else {
                explanationBox.classList.add('hidden');
            }

            prevBtn.disabled = index === 0;
            nextBtn.innerText = index === quizData.length - 1 ? "समाप्त (Finish)" : "अगला (Next) →";
            jumpInput.value = index + 1;
            progressText.innerText = `${index + 1} / ${quizData.length}`;
            progressBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
            scoreDisplay.innerText = score;
        }

        function selectOption(selectedOpt, correctOpt, index) {
            userAnswers[index] = selectedOpt;
            if (selectedOpt === correctOpt) {
                score += 1;
            }
            loadQuestion(index);
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`क्विज़ समाप्त! आपका कुल स्कोर: ${score} / ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion(val) {
            let qNum = parseInt(val);
            if (qNum >= 1 && qNum <= quizData.length) {
                currentIndex = qNum - 1;
                loadQuestion(currentIndex);
            } else {
                jumpInput.value = currentIndex + 1;
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        loadQuestion(currentIndex);
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
