        // Shuffle Options Helper function to keep track of correct option after dynamic shuffle
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        // Process data to randomize choices unpredictable across A, B, C, D
        const processedDataset = rawData.map(q => {
            const originalOptions = [...q.options];
            const correctAnswerText = originalOptions[q.correct];
            
            // Create option objects
            let optionObjects = originalOptions.map(opt => ({ text: opt }));
            // Shuffle
            optionObjects = shuffleArray(optionObjects);
            
            // Find new index of correct answer
            const newCorrectIndex = optionObjects.findIndex(opt => opt.text === correctAnswerText);

            return {
                ...q,
                shuffledOptions: optionObjects.map(o => o.text),
                correctIndex: newCorrectIndex
            };
        });

        // App State Variables
        let currentIndex = 0;
        let userAnswers = new Array(processedDataset.length).fill(null);
        let score = 0;

        // DOM Element Selectors
        const totalQNumEl = document.getElementById('total-q-num');
        const currentQNumEl = document.getElementById('current-q-num');
        const scoreEl = document.getElementById('score');
        const totalScoreEl = document.getElementById('total-scrore');
        const progressBarEl = document.getElementById('progress-bar');
        
        const qSourceEl = document.getElementById('q-source');
        const qEnEl = document.getElementById('question-en');
        const qHiEl = document.getElementById('question-hi');
        const optionsContainer = document.getElementById('options-container');

        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const hintEnEl = document.getElementById('hint-text-en');
        const hintHiEl = document.getElementById('hint-text-hi');

        const explanationBox = document.getElementById('explanation-box');
        const explanationEnEl = document.getElementById('explanation-en');
        const explanationHiEl = document.getElementById('explanation-hi');

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');

        // Initialize App
        function initApp() {
            totalQNumEl.textContent = processedDataset.length;
            totalScoreEl.textContent = processedDataset.length;
            jumpInput.max = processedDataset.length;
            renderQuestion();
        }

        // Render Current Question
        function renderQuestion() {
            const qData = processedDataset[currentIndex];

            // Set Meta & Text
            currentQNumEl.textContent = currentIndex + 1;
            qSourceEl.textContent = `Ref: ${qData.ref}`;
            qEnEl.textContent = `${currentIndex + 1}. ${qData.question_en}`;
            qHiEl.textContent = qData.question_hi;

            // Set Hints
            hintEnEl.textContent = qData.hint_en;
            hintHiEl.textContent = qData.hint_hi;
            hintBox.classList.add('hidden'); // default hide

            // Set Explanations
            explanationEnEl.textContent = qData.exp_en;
            explanationHiEl.textContent = qData.exp_hi;

            // Update Progress Bar
            const progressPct = ((currentIndex + 1) / processedDataset.length) * 100;
            progressBarEl.style.width = `${progressPct}%`;

            // Render Options
            optionsContainer.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];

            qData.shuffledOptions.forEach((optText, optIdx) => {
                const button = document.createElement('button');
                button.className = `w-full text-left p-3.5 rounded-xl border transition flex items-start gap-3 text-sm sm:text-base font-medium border-slate-200 hover:bg-slate-50 text-slate-800`;
                
                button.innerHTML = `
                    <span class="w-7 h-7 flex items-center justify-center rounded-lg bg-slate-100 text-slate-700 font-semibold text-xs border border-slate-300 flex-shrink-0">${labels[optIdx]}</span>
                    <span class="mt-0.5">${optText}</span>
                `;

                // Check if user already answered this question
                if (userAnswers[currentIndex] !== null) {
                    button.disabled = true;
                    if (optIdx === qData.correctIndex) {
                        button.classList.remove('border-slate-200', 'hover:bg-slate-50');
                        button.classList.add('bg-green-50', 'border-green-500', 'text-green-900');
                        button.querySelector('span').classList.add('bg-green-600', 'text-white', 'border-green-600');
                    }
                    if (userAnswers[currentIndex] === optIdx && optIdx !== qData.correctIndex) {
                        button.classList.remove('border-slate-200', 'hover:bg-slate-50');
                        button.classList.add('bg-red-50', 'border-red-500', 'text-red-900');
                        button.querySelector('span').classList.add('bg-red-600', 'text-white', 'border-red-600');
                    }
                } else {
                    button.onclick = () => selectOption(optIdx);
                }

                optionsContainer.appendChild(button);
            });

            // Handle Explanation display state
            if (userAnswers[currentIndex] !== null) {
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            // Button Nav States
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === processedDataset.length - 1;
        }

        // Handle Option Click
        function selectOption(selectedIdx) {
            if (userAnswers[currentIndex] !== null) return;

            userAnswers[currentIndex] = selectedIdx;
            const qData = processedDataset[currentIndex];

            if (selectedIdx === qData.correctIndex) {
                score++;
                scoreEl.textContent = score;
            }

            renderQuestion();
        }

        // Toggle Hint Box
        hintBtn.addEventListener('click', () => {
            hintBox.classList.toggle('hidden');
        });

        // Previous Question Navigation
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        });

        // Next Question Navigation
        nextBtn.addEventListener('click', () => {
            if (currentIndex < processedDataset.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        });

        // Jump to Question
        jumpBtn.addEventListener('click', () => {
            const targetQ = parseInt(jumpInput.value, 10);
            if (targetQ >= 1 && targetQ <= processedDataset.length) {
                currentIndex = targetQ - 1;
                renderQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${processedDataset.length}`);
            }
        });

        // Initialize layout on load
        window.onload = initApp;
    </script>
