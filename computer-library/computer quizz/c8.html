        // Application State Variables
        let currentQuestionIndex = 0;
        let score = 0;
        const userAnswers = new Array(questionsData.length).fill(null);
        const answeredStatus = new Array(questionsData.length).fill(false);

        // DOM Elements
        const totalQCountEl = document.getElementById('total-q-count');
        const scoreDisplayEl = document.getElementById('score-display');
        const progressTextEl = document.getElementById('progress-text');
        const progressBarEl = document.getElementById('progress-bar');
        const jumpInputEl = document.getElementById('jump-input');
        const jumpBtnEl = document.getElementById('jump-btn');
        const questionBadgeEl = document.getElementById('question-badge');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const explanationContainerEl = document.getElementById('explanation-container');
        const explanationIconEl = document.getElementById('explanation-icon');
        const explanationTitleEl = document.getElementById('explanation-title');
        const explanationTextEl = document.getElementById('explanation-text');
        const hintToggleBtnEl = document.getElementById('hint-toggle-btn');
        const hintBoxEl = document.getElementById('hint-box');
        const hintTextEl = document.getElementById('hint-text');
        const prevBtnEl = document.getElementById('prev-btn');
        const nextBtnEl = document.getElementById('next-btn');

        // Initialize App
        totalQCountEl.textContent = questionsData.length;
        jumpInputEl.max = questionsData.length;

        // Shuffle options per question while keeping track of correct answer
        // To prevent breaking correct index, we map original options with their correctness
        const processedQuestions = questionsData.map((q, qIdx) => {
            const indexedOptions = q.options.map((opt, idx) => ({
                text: opt,
                isCorrect: idx === q.correctIndex
            }));

            // Shuffle options array deterministically or pseudo-randomly based on question index to keep it fixed per question load
            // Simple Fisher-Yates shuffle seeded or fixed per question index so options don't jump around on re-render
            const shuffled = [...indexedOptions];
            // Seeded shuffle using qIdx to ensure consistency
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = (qIdx * 13 + i * 7) % (i + 1);
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            const newCorrectIndex = shuffled.findIndex(opt => opt.isCorrect);

            return {
                ...q,
                shuffledOptions: shuffled,
                correctIndex: newCorrectIndex
            };
        });

        function loadQuestion(index) {
            currentQuestionIndex = index;
            const q = processedQuestions[index];

            // Update Progress & UI
            progressTextEl.textContent = `Question ${index + 1} of ${questionsData.length}`;
            const progressPercent = ((index + 1) / questionsData.length) * 100;
            progressBarEl.style.width = `${progressPercent}%`;
            jumpInputEl.value = index + 1;

            // Metadata & Hint
            questionBadgeEl.textContent = q.topic;
            hintTextEl.textContent = q.hint;
            hintBoxEl.classList.add('hidden');
            hintToggleBtnEl.textContent = "💡 View Hint";

            // Question Text
            questionTextEl.textContent = `${index + 1}. ${q.question}`;

            // Render Options
            optionsContainerEl.innerHTML = '';
            q.shuffledOptions.forEach((optObj, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition-all text-xs sm:text-sm font-medium flex items-center justify-between ${getOptionStyle(index, optIdx)}`;
                btn.innerHTML = `<span><span class="font-bold mr-2">${String.fromCharCode(65 + optIdx)}.</span> ${optObj.text}</span>`;
                
                if (!answeredStatus[index]) {
                    btn.addEventListener('click', () => selectOption(index, optIdx));
                } else {
                    btn.disabled = true;
                }
                optionsContainerEl.appendChild(btn);
            });

            // Explanation Box Handling
            if (answeredStatus[index]) {
                showExplanationBox(index);
            } else {
                explanationContainerEl.classList.add('hidden');
            }

            // Navigation Buttons state
            prevBtnEl.disabled = index === 0;
            nextBtnEl.textContent = index === questionsData.length - 1 ? "Finish / Review" : "Next \u2192";
        }

        function getOptionStyle(qIdx, optIdx) {
            const isAnswered = answeredStatus[qIdx];
            const userChoice = userAnswers[qIdx];
            const correctChoice = processedQuestions[qIdx].correctIndex;

            if (!isAnswered) {
                return "bg-slate-900/50 border-slate-700 hover:border-indigo-500 hover:bg-slate-900 text-slate-200 cursor-pointer shadow-sm";
            }

            if (optIdx === correctChoice) {
                return "bg-emerald-950/60 border-emerald-500 text-emerald-200 shadow-md font-semibold";
            }

            if (optIdx === userChoice && userChoice !== correctChoice) {
                return "bg-rose-950/60 border-rose-500 text-rose-200 shadow-md";
            }

            return "bg-slate-900/30 border-slate-800 text-slate-500 opacity-60";
        }

        function selectOption(qIdx, optIdx) {
            if (answeredStatus[qIdx]) return;

            answeredStatus[qIdx] = true;
            userAnswers[qIdx] = optIdx;

            const correctChoice = processedQuestions[qIdx].correctIndex;
            if (optIdx === correctChoice) {
                score += 1;
                scoreDisplayEl.textContent = score;
            }

            loadQuestion(qIdx);
        }

        function showExplanationBox(qIdx) {
            const q = processedQuestions[qIdx];
            const userChoice = userAnswers[qIdx];
            const correctChoice = q.correctIndex;
            const isCorrect = userChoice === correctChoice;

            explanationContainerEl.classList.remove('hidden');
            if (isCorrect) {
                explanationContainerEl.className = "mt-6 p-4 rounded-xl border bg-emerald-950/40 border-emerald-500/50 text-emerald-100 transition-all shadow-lg";
                explanationIconEl.textContent = "✅";
                explanationTitleEl.textContent = "Correct Answer!";
            } else {
                explanationContainerEl.className = "mt-6 p-4 rounded-xl border bg-rose-950/40 border-rose-500/50 text-rose-100 transition-all shadow-lg";
                explanationIconEl.textContent = "❌";
                explanationTitleEl.textContent = `Incorrect. The correct option was (${String.fromCharCode(65 + correctChoice)}).`;
            }
            explanationTextEl.textContent = q.explanation;
        }

        // Event Listeners
        prevBtnEl.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                loadQuestion(currentQuestionIndex - 1);
            }
        });

        nextBtnEl.addEventListener('click', () => {
            if (currentQuestionIndex < questionsData.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${questionsData.length}.`);
            }
        });

        jumpBtnEl.addEventListener('click', () => {
            const target = parseInt(jumpInputEl.value) - 1;
            if (!isNaN(target) && target >= 0 && target < questionsData.length) {
                loadQuestion(target);
            } else {
                alert(`Please enter a valid question number between 1 and ${questionsData.length}.`);
            }
        });

        jumpInputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                jumpBtnEl.click();
            }
        });

        hintToggleBtnEl.addEventListener('click', () => {
            const isHidden = hintBoxEl.classList.contains('hidden');
            if (isHidden) {
                hintBoxEl.classList.remove('hidden');
                hintToggleBtnEl.textContent = "💡 Hide Hint";
            } else {
                hintBoxEl.classList.add('hidden');
                hintToggleBtnEl.textContent = "💡 View Hint";
            }
        });

        // Load the first question on startup
        loadQuestion(0);
    </script>
