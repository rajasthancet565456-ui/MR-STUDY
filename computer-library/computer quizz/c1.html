        // --- Shuffle Options Dynamically to Ensure Randomization ---
        // Function to shuffle array and maintain correct answer mapping
        function prepareQuestions(questions) {
            return questions.map((item, index) => {
                // Copy options array
                let opts = [...item.options];
                // Fisher-Yates shuffle algorithm
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return {
                    id: index + 1,
                    question: item.q,
                    options: opts,
                    correctAnswer: item.answer,
                    topic: item.topic,
                    hint: item.hint,
                    explanation: item.explanation,
                    userAnswer: null,
                    isCorrect: false
                };
            });
        }

        const quizData = prepareQuestions(rawQuestions);

        // Application State
        let currentQuestionIndex = 0;
        let score = 0;
        let attemptedCount = 0;

        // DOM Elements
        const currentQNumEl = document.getElementById('current-q-num');
        const topicTagEl = document.getElementById('topic-tag');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const hintToggleBtn = document.getElementById('hint-toggle-btn');
        const hintBox = document.getElementById('hint-box');
        const hintTextEl = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');
        const scoreCounterEl = document.getElementById('score-counter');
        const totalAttemptedEl = document.getElementById('total-attempted');
        const progressBar = document.getElementById('progress-bar');

        // Render Current Question
        function renderQuestion() {
            const q = quizData[currentQuestionIndex];

            // Update UI Header
            currentQNumEl.textContent = q.id;
            topicTagEl.textContent = q.topic;
            questionTextEl.textContent = q.question;

            // Reset Hint
            hintBox.classList.add('hidden');
            hintTextEl.textContent = q.hint;

            // Reset Explanation
            if (q.userAnswer === null) {
                explanationBox.classList.add('hidden');
            } else {
                showExplanation(q);
            }

            // Update Progress Bar
            const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Render Options
            optionsContainerEl.innerHTML = '';
            q.options.forEach((optText, idx) => {
                const optBtn = document.createElement('button');
                optBtn.className = "w-full text-left p-3.5 rounded-lg border border-slate-200 transition flex items-center justify-between text-sm md:text-base font-medium focus:outline-none";

                // Option Letter mapping (A, B, C, D)
                const letter = String.fromCharCode(65 + idx);
                
                optBtn.innerHTML = `<span><strong class="text-indigo-600 mr-2">${letter}.</strong> ${optText}</span>`;

                // If already answered
                if (q.userAnswer !== null) {
                    optBtn.disabled = true;
                    if (optText === q.correctAnswer) {
                        optBtn.classList.add('bg-green-100', 'border-green-500', 'text-green-900');
                        optBtn.innerHTML += `<span class="text-green-600 font-bold ml-2">✓ Correct</span>`;
                    } else if (optText === q.userAnswer) {
                        optBtn.classList.add('bg-red-100', 'border-red-500', 'text-red-900');
                        optBtn.innerHTML += `<span class="text-red-600 font-bold ml-2">✗ Your Choice</span>`;
                    } else {
                        optBtn.classList.add('bg-slate-50', 'text-slate-500', 'opacity-60');
                    }
                } else {
                    // Hover state for unanswered
                    optBtn.classList.add('hover:bg-indigo-50', 'hover:border-indigo-300', 'bg-white', 'text-slate-700');
                    optBtn.addEventListener('click', () => handleOptionSelect(optText));
                }

                optionsContainerEl.appendChild(optBtn);
            });

            // Update Nav Buttons
            prevBtn.disabled = (currentQuestionIndex === 0);
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.textContent = 'Finish Quiz';
            } else {
                nextBtn.textContent = 'Next →';
            }
        }

        // Handle User Option Click
        function handleOptionSelect(selectedOption) {
            const q = quizData[currentQuestionIndex];
            if (q.userAnswer !== null) return; // Prevent re-selection

            q.userAnswer = selectedOption;
            q.isCorrect = (selectedOption === q.correctAnswer);

            if (q.isCorrect) {
                score++;
            }
            attemptedCount++;

            // Update Header Counters
            scoreCounterEl.textContent = score;
            totalAttemptedEl.textContent = attemptedCount;

            // Re-render UI
            renderQuestion();
        }

        // Show Explanation Box
        function showExplanation(q) {
            explanationBox.classList.remove('hidden');
            if (q.isCorrect) {
                explanationBox.className = "mt-6 p-4 rounded-lg border bg-green-50 border-green-300 text-green-900";
                explanationHeader.textContent = "Correct Answer!";
            } else {
                explanationBox.className = "mt-6 p-4 rounded-lg border bg-red-50 border-red-300 text-red-900";
                explanationHeader.textContent = `Incorrect! Correct Answer: ${q.correctAnswer}`;
            }
            explanationText.textContent = q.explanation;
        }

        // Hint Toggle Listener
        hintToggleBtn.addEventListener('click', () => {
            hintBox.classList.toggle('hidden');
        });

        // Navigation Handlers
        prevBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                alert(`Quiz Completed!\nYour Score: ${score} / ${quizData.length}`);
            }
        });

        // Jump to Question Handler
        jumpBtn.addEventListener('click', () => {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentQuestionIndex = val - 1;
                renderQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        });

        // Initial Load
        renderQuestion();
    </script>
