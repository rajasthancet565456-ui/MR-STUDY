    // Array to store shuffled active question datasets
    let questions = [];
    let currentIdx = 0;
    let score = 0;
    let answeredQuestions = new Set();
    let userAnswers = {}; // track selected answer per question index

    // Utility: Fisher-Yates Shuffle Algorithm to shuffle options and track correct answer position
    function prepareDataset(data) {
      return data.map((item, index) => {
        // Create an array of option objects with original state
        let opts = item.options.map((optText, origIdx) => ({
          text: optText,
          isCorrect: origIdx === item.correct
        }));

        // Shuffle options programmatically
        for (let i = opts.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [opts[i], opts[j]] = [opts[j], opts[i]];
        }

        // Find new index of correct answer
        const newCorrectIdx = opts.findIndex(o => o.isCorrect);

        return {
          id: index + 1,
          subtopic: item.subtopic,
          question: item.question,
          options: opts.map(o => o.text),
          correct: newCorrectIdx,
          hint: item.hint,
          explanation: item.explanation
        };
      });
    }

    // Initialize Quiz
    function initQuiz() {
      questions = prepareDataset(rawQuestions);
      document.getElementById('total-q-count').innerText = questions.length;
      document.getElementById('jump-input').max = questions.length;
      renderQuestion();
    }

    // Render current question
    function renderQuestion() {
      const q = questions[currentIdx];

      // Update Header/Meta
      document.getElementById('current-q-num').innerText = currentIdx + 1;
      document.getElementById('subtopic-badge').innerText = q.subtopic;
      document.getElementById('question-text').innerText = `${currentIdx + 1}. ${q.question}`;
      
      // Update Progress Bar
      const progressPercent = ((currentIdx + 1) / questions.length) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;

      // Reset Hint & Explanation Boxes
      document.getElementById('hint-box').classList.add('hidden');
      document.getElementById('hint-btn-text').innerText = "Show Hint";
      document.getElementById('hint-text').innerText = q.hint;
      
      document.getElementById('explanation-text').innerText = q.explanation;
      
      const expBox = document.getElementById('explanation-box');
      if (answeredQuestions.has(currentIdx)) {
        expBox.classList.remove('hidden');
      } else {
        expBox.classList.add('hidden');
      }

      // Render Options
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const labels = ['A', 'B', 'C', 'D'];
      const hasAnswered = answeredQuestions.has(currentIdx);
      const selectedOption = userAnswers[currentIdx];

      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-4 rounded-lg border text-sm font-medium transition flex items-start gap-3 `;
        
        if (!hasAnswered) {
          btn.className += `border-gray-200 hover:border-indigo-500 hover:bg-indigo-50 text-gray-700 bg-white`;
          btn.onclick = () => selectOption(optIdx);
        } else {
          btn.disabled = true;
          if (optIdx === q.correct) {
            btn.className += `border-green-500 bg-green-50 text-green-900 font-bold`;
          } else if (optIdx === selectedOption) {
            btn.className += `border-red-500 bg-red-50 text-red-900`;
          } else {
            btn.className += `border-gray-200 bg-gray-50 text-gray-400 opacity-60`;
          }
        }

        btn.innerHTML = `
          <span class="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center text-xs font-bold text-gray-600 shrink-0">
            ${labels[optIdx]}
          </span>
          <span class="mt-0.5">${optText}</span>
        `;
        container.appendChild(btn);
      });

      // Navigation Buttons state
      document.getElementById('prev-btn').disabled = (currentIdx === 0);
      if (currentIdx === questions.length - 1) {
        document.getElementById('next-btn').innerText = "Finish Quiz";
      } else {
        document.getElementById('next-btn').innerText = "Next \u2192";
      }
    }

    // Handle Option Selection
    function selectOption(optIdx) {
      if (answeredQuestions.has(currentIdx)) return;

      const q = questions[currentIdx];
      userAnswers[currentIdx] = optIdx;
      answeredQuestions.add(currentIdx);

      if (optIdx === q.correct) {
        score++;
      }

      // Update UI Score
      document.getElementById('score-display').innerText = score;
      document.getElementById('answered-count').innerText = answeredQuestions.size;

      // Re-render question to show correct/incorrect state and explanation
      renderQuestion();
    }

    // Navigation Logic
    function nextQuestion() {
      if (currentIdx < questions.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        alert(`Quiz Completed!\nYour Final Score: ${score} out of ${questions.length}`);
      }
    }

    function prevQuestion() {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    }

    function jumpToQuestion() {
      const input = document.getElementById('jump-input');
      const val = parseInt(input.value);
      if (val >= 1 && val <= questions.length) {
        currentIdx = val - 1;
        renderQuestion();
      } else {
        alert(`Please enter a question number between 1 and ${questions.length}.`);
      }
    }

    // Toggle Hint Display
    function toggleHint() {
      const hintBox = document.getElementById('hint-box');
      const hintTextBtn = document.getElementById('hint-btn-text');
      if (hintBox.classList.contains('hidden')) {
        hintBox.classList.remove('hidden');
        hintTextBtn.innerText = "Hide Hint";
      } else {
        hintBox.classList.add('hidden');
        hintTextBtn.innerText = "Show Hint";
      }
    }

    // Start Quiz on Load
    window.onload = initQuiz;
  </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
