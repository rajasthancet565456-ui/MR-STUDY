                category: "DBMS - DDL/DML",

            },
            {
                q: "Which SQL command is used to add a new column to an existing database table?",

                correct: 0,
                hint: "Modifying schema structure requires a DDL command.",
                category: "DBMS - SQL Commands",
                rationale: "The standard SQL DDL syntax to add a column is 'ALTER TABLE table_name ADD column_name datatype;'."

            {
                q: "Match List-I (SQL Commands) with List-II (Command Category):\nList-I:\n(P) GRANT\n(Q) COMMIT\n(R) MERGE\n(S) DROP\n\nList-II:\n(1) DML\n(2) DDL\n(3) DCL\n(4) TCL\n\nSelect the correct option:",
                options: ["P-3, Q-4, R-1, S-2", "P-4, Q-3, R-2, S-1", "P-3, Q-1, R-4, S-2", "P-1, Q-2, R-3, S-4"],
                correct: 0,
                hint: "GRANT deals with privileges; COMMIT deals with transaction savepoints; MERGE manipulates rows; DROP destroys objects.",
                category: "DBMS - SQL Categories",
                rationale: "GRANT = DCL, COMMIT = TCL, MERGE = DML, DROP = DDL."
            },
            {
                q: "What is the primary operational difference between the DELETE and TRUNCATE commands in SQL?",
                options: ["DELETE is a DML command that can be filtered with a WHERE clause; TRUNCATE is a DDL command that removes all rows without individual row logging.", "DELETE is faster than TRUNCATE because it does not record log transactions.", "TRUNCATE permits a WHERE clause to remove specific rows, while DELETE removes all rows.", "DELETE auto-commits the transaction immediately, whereas TRUNCATE allows ROLLBACK."],
                correct: 0,
                hint: "Consider logging overhead and WHERE clause support.",
                category: "DBMS - DDL vs DML",
                rationale: "DELETE is a DML statement supporting WHERE filtering and logs each deleted row. TRUNCATE is a DDL operation that deallocates data pages quickly."
            },
            {
                q: "Which of the following commands is used to remove a user privilege previously assigned via the GRANT command?",
                options: ["REVOKE", "REMOVE", "DENY", "CANCEL"],

                category: "DBMS - DCL",
                rationale: "REVOKE is the DCL command used to retract rights granted by the GRANT statement."

            {

                options: ["HAVING", "WHERE", "ORDER BY", "GROUP FILTER"],
                correct: 0,
                hint: "WHERE filters individual rows prior to grouping, while this clause filters groups.",
                category: "DBMS - SQL SELECT",
                rationale: "The HAVING clause filters aggregated results produced by the GROUP BY clause."
            },
            {
                q: "Consider the statement: 'SELECT * FROM Employees WHERE Salary > ALL (SELECT Salary FROM Employees WHERE Dept = 'IT');'. What does this query retrieve?",

                hint: "'ALL' requires the left value to satisfy the condition against every element in the subquery set.",
                category: "DBMS - SQL Subqueries",
                rationale: "Condition '> ALL' evaluates to true only if the salary is greater than every value returned by the subquery, meaning greater than the maximum salary in IT."
            },
            {
                q: "Which SQL command is used to discard all transactions executed since the last COMMIT or SAVEPOINT in a session?",
                options: ["ROLLBACK", "REVOKE", "ABORT", "RESTORE"],
                correct: 0,
                hint: "A TCL command that reverts uncommitted changes.",
                category: "DBMS - TCL",
                rationale: "ROLLBACK restores the database state to the last committed state or specified SAVEPOINT."
            },
            {
                q: "In Relational Database Design, a database table is said to be in First Normal Form (1NF) if and only if:",

                hint: "Non-prime attributes must depend on the ENTIRE candidate key, not just a proper subset.",

            {

        // Global State Variables
        let questions = [];
        let currentIndex = 0;
        let userAnswers = new Array(150).fill(null);
        let score = 0;

        // Initialize & Programmatically Shuffle Options
        function initQuiz() {
            // Deep copy & shuffle options for each question so correct answer positions vary unpredictably (A, B, C, D)
            questions = rawQuestions.map((item, index) => {
                let optionsWithOriginalIndex = item.options.map((opt, idx) => ({
                    text: opt,
                    isCorrect: idx === item.correct
                }));

                // Fisher-Yates Shuffle for options
                for (let i = optionsWithOriginalIndex.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithOriginalIndex[i], optionsWithOriginalIndex[j]] = [optionsWithOriginalIndex[j], optionsWithOriginalIndex[i]];
                }

                return {
                    id: index + 1,
                    q: item.q,
                    options: optionsWithOriginalIndex.map(o => o.text),
                    correctIndex: optionsWithOriginalIndex.findIndex(o => o.isCorrect),
                    hint: item.hint,
                    category: item.category,
                    rationale: item.rationale
                };
            });

            renderQuestion();
            renderPaletteModal();
            updateScoreboard();
        }

        // Render Current Question
        function renderQuestion() {
            const current = questions[currentIndex];

            // Header Elements
            document.getElementById('q-number').innerText = `Question ${currentIndex + 1} of 150`;
            document.getElementById('q-category').innerText = current.category;
            document.getElementById('q-text').innerText = current.q;

            // Reset Hint
            document.getElementById('hint-box').innerText = current.hint;
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-btn-text').innerText = "Show Hint";

            // Explanation Box
            const expBox = document.getElementById('explanation-box');
            const expText = document.getElementById('explanation-text');
            
            if (userAnswers[currentIndex] !== null) {
                expText.innerText = current.rationale;
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            // Options Grid Container
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const letters = ['A', 'B', 'C', 'D'];
            const userAns = userAnswers[currentIndex];

            current.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700/80 transition-all flex items-start gap-3 focus:outline-none";

                // Answered vs Unanswered Option Styling
                if (userAns !== null) {
                    btn.disabled = true;
                    if (idx === current.correctIndex) {
                        btn.className = "w-full text-left p-4 rounded-lg border-2 border-emerald-500 bg-emerald-950/40 text-emerald-200 flex items-start gap-3";
                    } else if (idx === userAns) {
                        btn.className = "w-full text-left p-4 rounded-lg border-2 border-rose-500 bg-rose-950/40 text-rose-200 flex items-start gap-3";
                    } else {
                        btn.className += " opacity-50";
                    }
                }

                btn.onclick = () => selectOption(idx);

                btn.innerHTML = `
                    <span class="w-6 h-6 rounded-full border border-slate-500 flex items-center justify-center text-xs font-bold shrink-0 ${userAns === idx ? (idx === current.correctIndex ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-rose-500 text-white border-rose-500') : 'text-slate-400'}">${letters[idx]}</span>
                    <span class="text-sm md:text-base leading-snug">${optText}</span>
                `;

                container.appendChild(btn);
            });

            // Update Nav Controls
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === questions.length - 1;

            // Update Progress Bar
            const progress = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        // Option Selection Handler
        function selectOption(index) {
            if (userAnswers[currentIndex] !== null) return; // Locked once answered

            userAnswers[currentIndex] = index;

            if (index === questions[currentIndex].correctIndex) {
                score++;
            }

            updateScoreboard();
            renderQuestion();
            updatePaletteModal();
        }

        // Navigation
        function navigate(step) {
            const newIndex = currentIndex + step;
            if (newIndex >= 0 && newIndex < questions.length) {
                currentIndex = newIndex;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val >= 1 && val <= 150) {
                currentIndex = val - 1;
                renderQuestion();
                document.getElementById('jump-input').value = '';
            } else {
                alert('Please enter a valid question number between 1 and 150.');
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            const hintBtnText = document.getElementById('hint-btn-text');
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBtnText.innerText = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintBtnText.innerText = "Show Hint";
            }
        }

        // Update Counter Display
        function updateScoreboard() {
            const attempted = userAnswers.filter(a => a !== null).length;
            document.getElementById('score-display').innerText = `${score} / ${attempted}`;
            document.getElementById('attempted-display').innerText = `${attempted} / 150`;
        }

        // Palette Modal Controls
        function openGridModal() {
            document.getElementById('grid-modal').classList.remove('hidden');
        }

        function closeGridModal() {
            document.getElementById('grid-modal').classList.add('hidden');
        }

        function renderPaletteModal() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            questions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.id = `palette-btn-${idx}`;
                btn.onclick = () => {
                    currentIndex = idx;
                    renderQuestion();
                    closeGridModal();
                };

                updatePaletteBtnStyle(btn, idx);
                container.appendChild(btn);
            });
        }

        function updatePaletteModal() {
            questions.forEach((q, idx) => {
                const btn = document.getElementById(`palette-btn-${idx}`);
                if (btn) updatePaletteBtnStyle(btn, idx);
            });
        }

        function updatePaletteBtnStyle(btn, idx) {
            const userAns = userAnswers[idx];
            let baseStyle = "w-8 h-8 rounded text-xs font-bold flex items-center justify-center transition-all ";

            if (userAns !== null) {
                if (userAns === questions[idx].correctIndex) {
                    baseStyle += "bg-emerald-600 hover:bg-emerald-500 text-white";
                } else {
                    baseStyle += "bg-rose-600 hover:bg-rose-500 text-white";
                }
            } else {
                baseStyle += "bg-slate-700 hover:bg-slate-600 text-slate-300 border border-slate-600";
            }

            if (idx === currentIndex) {
                baseStyle += " ring-2 ring-indigo-400 ring-offset-2 ring-offset-slate-800";
            }

            btn.className = baseStyle;
            btn.innerText = idx + 1;
        }

        // Run application initialization on load
        window.onload = initQuiz;
    </script>
