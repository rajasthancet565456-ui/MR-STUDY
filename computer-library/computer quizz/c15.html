        let currentIndex = 0;

        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptionsCache = [];

        // Pre-shuffle options once so positions remain consistent during navigation
        function initQuiz() {
            quizData.forEach((q, qIdx) => {
                let originalOptions = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                // Shuffle options
                let shuffled = [...originalOptions].sort(() => Math.random() - 0.5);
                let newCorrectIndex = shuffled.findIndex(item => item.originalIndex === q.correct);
                shuffledOptionsCache.push({
                    shuffledOpts: shuffled,
                    correctIndex: newCorrectIndex
                });
            });
            loadQuestion(currentIndex);
            updateScoreboard();
        }

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const currentQNum = document.getElementById('current-q-num');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const scoreDisplay = document.getElementById('score-display');
        const attemptedDisplay = document.getElementById('attempted-display');
        const progressBar = document.getElementById('progress-bar');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');
        const hintToggle = document.getElementById('hint-toggle');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');

        function loadQuestion(index) {
            currentIndex = index;
            const qObj = quizData[index];
            const cacheObj = shuffledOptionsCache[index];

            currentQNum.textContent = index + 1;
            jumpInput.value = index + 1;
            questionText.textContent = `${index + 1}. ${qObj.q}`;

            // Reset hint & explanation visibility
            hintBox.classList.add('hidden');
            hintBox.textContent = qObj.hint;

            if (userAnswers[index] !== null) {
                showExplanationBox(userAnswers[index], cacheObj.correctIndex, qObj.explanation);
            } else {
                explanationBox.classList.add('hidden');
            }

            // Render options
            optionsContainer.innerHTML = '';
            cacheObj.shuffledOpts.forEach((optItem, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-900/50 hover:bg-slate-700/50 transition-all text-slate-200 font-medium flex items-center gap-3';
                
                const letterSpan = document.createElement('span');
                letterSpan.className = 'w-7 h-7 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-xs font-bold text-slate-400 shrink-0';
                letterSpan.textContent = String.fromCharCode(65 + optIdx);

                const textSpan = document.createElement('span');
                textSpan.textContent = optItem.text;

                btn.appendChild(letterSpan);
                btn.appendChild(textSpan);

                // If already answered, highlight states
                if (userAnswers[index] !== null) {
                    btn.disabled = true;
                    if (optIdx === cacheObj.correctIndex) {
                        btn.classList.remove('bg-slate-900/50', 'hover:bg-slate-700/50');
                        btn.classList.add('bg-emerald-950/60', 'border-emerald-600', 'text-emerald-200');
                        letterSpan.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
                    } else if (optIdx === userAnswers[index]) {
                        btn.classList.remove('bg-slate-900/50', 'hover:bg-slate-700/50');
                        btn.classList.add('bg-rose-950/60', 'border-rose-600', 'text-rose-200');
                        letterSpan.classList.add('bg-rose-600', 'text-white', 'border-rose-500');
                    } else {
                        btn.classList.add('opacity-50');
                    }
                } else {
                    btn.onclick = () => selectOption(optIdx, cacheObj.correctIndex, qObj.explanation);
                }

                optionsContainer.appendChild(btn);
            });

            // Update pagination buttons
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? 'Finish' : 'Next';

            // Update Progress Bar
            let progressPercent = ((index + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
        }

        function selectOption(selectedOptIdx, correctOptIdx, explanationText) {
            if (userAnswers[currentIndex] !== null) return;

            userAnswers[currentIndex] = selectedOptIdx;
            attempted++;

            if (selectedOptIdx === correctOptIdx) {
                score++;
            }

            updateScoreboard();
            loadQuestion(currentIndex); // Reload to apply disabled styles and show explanation
        }

        function showExplanationBox(selectedIdx, correctIdx, explanationText) {
            explanationBox.classList.remove('hidden');
            const isCorrect = selectedIdx === correctIdx;
            if (isCorrect) {
                explanationBox.className = 'mt-6 p-4 rounded-xl border bg-emerald-950/40 border-emerald-800 text-emerald-200 text-sm';
                explanationBox.innerHTML = `<strong class="block font-semibold mb-1 flex items-center gap-1.5"><svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Correct! Rationale:</strong> ${explanationText}`;
            } else {
                explanationBox.className = 'mt-6 p-4 rounded-xl border bg-rose-950/40 border-rose-800 text-rose-200 text-sm';
                explanationBox.innerHTML = `<strong class="block font-semibold mb-1 flex items-center gap-1.5"><svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> Incorrect. Rationale:</strong> ${explanationText}`;
            }
        }

        function updateScoreboard() {
            scoreDisplay.textContent = score;
            attemptedDisplay.textContent = attempted;
        }

        // Event Listeners
        prevBtn.onclick = () => {
            if (currentIndex > 0) loadQuestion(currentIndex - 1);
        };

        nextBtn.onclick = () => {
            if (currentIndex < quizData.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}`);
            }
        };

        jumpBtn.onclick = () => {
            let target = parseInt(jumpInput.value) - 1;
            if (target >= 0 && target < quizData.length) {
                loadQuestion(target);
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        };

        hintToggle.onclick = () => {
            hintBox.classList.toggle('hidden');
        };

        window.onload = initQuiz;
