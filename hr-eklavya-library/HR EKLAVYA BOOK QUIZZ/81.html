        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptionsMap = {};

        function initQuiz() {
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentIndex];
            document.getElementById('current-q-num').innerText = currentIndex + 1;
            document.getElementById('source-badge').innerText = q.page;
            document.getElementById('question-text').innerText = q.q;
            
            // Progress Bar update
            const progress = ((currentIndex + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('progress-percent').innerText = progress.toFixed(1) + '%';

            // Reset and load hint
            const hintBox = document.getElementById('hint-box');
            hintBox.innerText = q.hint;
            hintBox.classList.add('hidden');

            // Reset explanation
            const expBox = document.getElementById('explanation-box');
            expBox.classList.add('hidden');
            expBox.innerHTML = '';

            // Shuffle options deterministically per question index
            if (!shuffledOptionsMap[currentIndex]) {
                let originalOptions = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.answer }));
                for (let i = originalOptions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [originalOptions[i], originalOptions[j]] = [originalOptions[j], originalOptions[i]];
                }
                shuffledOptionsMap[currentIndex] = originalOptions;
            }

            let currentOptions = shuffledOptionsMap[currentIndex];
            let optionsHTML = '';
            
            currentOptions.forEach((opt, idx) => {
                let isSelected = userAnswers[currentIndex] === idx;
                let ringClass = isSelected ? 'border-indigo-600 bg-indigo-50/50 ring-2 ring-indigo-500' : 'border-slate-200 hover:bg-slate-50';
                
                if (userAnswers[currentIndex] !== null) {
                    if (opt.isCorrect) {
                        ringClass = 'border-emerald-500 bg-emerald-50 text-emerald-900';
                    } else if (isSelected && !opt.isCorrect) {
                        ringClass = 'border-rose-500 bg-rose-50 text-rose-900';
                    } else {
                        ringClass = 'border-slate-200 opacity-60';
                    }
                }

                optionsHTML += `
                    <div onclick="selectOption(${idx})" class="p-4 border rounded-xl cursor-pointer transition flex items-center justify-between font-medium text-sm sm:text-base ${ringClass}">
                        <span><span class="font-bold mr-2 text-slate-400">${String.fromCharCode(65 + idx)}.</span> ${opt.text}</span>
                        <span class="option-indicator">${isSelected ? (opt.isCorrect ? '✅' : '❌') : ''}</span>
                    </div>
                `;
            });

            document.getElementById('options-container').innerHTML = optionsHTML;

            if (userAnswers[currentIndex] !== null) {
                showExplanationState();
            }

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').innerText = currentIndex === quizData.length - 1 ? 'Finish' : 'Next →';
        }

        function selectOption(optionIdx) {
            if (userAnswers[currentIndex] !== null) return;

            userAnswers[currentIndex] = optionIdx;
            let currentOptions = shuffledOptionsMap[currentIndex];
            let selectedOpt = currentOptions[optionIdx];

            if (selectedOpt.isCorrect) {
                score++;
                document.getElementById('score').innerText = score;
            }

            loadQuestion();
        }

        function showExplanationState() {
            let currentOptions = shuffledOptionsMap[currentIndex];
            let userAnsIdx = userAnswers[currentIndex];
            let isUserCorrect = userAnsIdx !== null && currentOptions[userAnsIdx].isCorrect;

            const expBox = document.getElementById('explanation-box');
            expBox.classList.remove('hidden');
            
            if (isUserCorrect) {
                expBox.className = "mt-4 p-4 rounded-xl text-sm border bg-emerald-50 border-emerald-200 text-emerald-900";
                expBox.innerHTML = `<strong class="block font-bold mb-1">Correct! 🎉</strong> ${quizData[currentIndex].explanation}`;
            } else {
                expBox.className = "mt-4 p-4 rounded-xl text-sm border bg-rose-50 border-rose-200 text-rose-900";
                expBox.innerHTML = `<strong class="block font-bold mb-1">Incorrect.</strong> ${quizData[currentIndex].explanation}`;
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} / 80.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const jumpInput = document.getElementById('jump-input');
            const target = parseInt(jumpInput.value) - 1;
            if (target >= 0 && target < quizData.length) {
                currentIndex = target;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert('Please enter a valid question number between 1 and 80.');
            }
        }

        window.onload = initQuiz;
    </script>
