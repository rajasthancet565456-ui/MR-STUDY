        const hintToggleTextEl = document.getElementById('hint-toggle-text');
        const explanationBoxEl = document.getElementById('explanation-box');
        const scoreEl = document.getElementById('score');
        const totalQuestionsEl = document.getElementById('total-questions');
        const progressBarEl = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const quizCard = document.getElementById('quiz-card');
        const completionCard = document.getElementById('completion-card');
        const jumpInput = document.getElementById('jump-input');

        totalQuestionsEl.textContent = quizData.length;

        function loadQuestion() {
            const q = quizData[currentIdx];
            questionCounterEl.textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
            questionSourceEl.textContent = q.source;
            questionTextEnEl.textContent = q.en;
            questionTextHiEl.textContent = q.hi;

            // Progress bar
            progressBarEl.style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;

            // Reset Hint & Explanation
            hintBoxEl.classList.add('hidden');
            hintBoxEl.textContent = q.hint;
            hintToggleTextEl.textContent = "Show Hint / संकेत देखें";

            explanationBoxEl.classList.add('hidden');

            // Render Options
            optionsContainerEl.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-lg border text-sm sm:text-base font-medium transition flex justify-between items-center ${
                    userAnswers[currentIdx] !== null 
                        ? (idx === q.correct 
                            ? 'bg-emerald-100 border-emerald-500 text-emerald-900' 
                            : (userAnswers[currentIdx] === idx ? 'bg-rose-100 border-rose-500 text-rose-900' : 'bg-white border-slate-200 text-slate-700'))
                        : 'bg-white hover:bg-indigo-50 border-slate-200 text-slate-700 hover:border-indigo-300'
                }`;
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${opt}</span>`;
                
                if (userAnswers[currentIdx] === null) {
                    btn.onclick = () => selectOption(idx);
                } else {
                    btn.disabled = true;
                }
                optionsContainerEl.appendChild(btn);
            });

            // Show explanation if already answered
            if (userAnswers[currentIdx] !== null) {
                showExplanation(userAnswers[currentIdx] === q.correct, q.explanation);
            }

            prevBtn.disabled = currentIdx === 0;
            nextBtn.textContent = currentIdx === quizData.length - 1 ? "Finish Quiz" : "Next →";
        }

        function selectOption(selectedIdx) {
            const q = quizData[currentIdx];
            userAnswers[currentIdx] = selectedIdx;

            const isCorrect = selectedIdx === q.correct;
            if (isCorrect) {
                score++;
                scoreEl.textContent = score;
            }

            // Refresh UI options
            loadQuestion();
            showExplanation(isCorrect, q.explanation);
        }

        function showExplanation(isCorrect, explanationText) {
            explanationBoxEl.classList.remove('hidden');
            if (isCorrect) {
                explanationBoxEl.className = "mb-6 p-4 rounded-lg border bg-emerald-50 border-emerald-300 text-emerald-900 text-sm";
                explanationBoxEl.innerHTML = `<strong>✅ Correct! / सही उत्तर!</strong><p class="mt-1">${explanationText}</p>`;
            } else {
                explanationBoxEl.className = "mb-6 p-4 rounded-lg border bg-rose-50 border-rose-300 text-rose-900 text-sm";
                explanationBoxEl.innerHTML = `<strong>❌ Incorrect! / गलत उत्तर!</strong><p class="mt-1">${explanationText}</p>`;
            }
        }

        function toggleHint() {
            if (hintBoxEl.classList.contains('hidden')) {
                hintBoxEl.classList.remove('hidden');
                hintToggleTextEl.textContent = "Hide Hint / संकेत छिपाएँ";
            } else {
                hintBoxEl.classList.add('hidden');
                hintToggleTextEl.textContent = "Show Hint / संकेत देखें";
            }
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showCompletion();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIdx = val - 1;
                jumpInput.value = '';
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function showCompletion() {
            quizCard.classList.add('hidden');
            completionCard.classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            userAnswers = new Array(quizData.length).fill(null);
            scoreEl.textContent = score;
            completionCard.classList.add('hidden');
            quizCard.classList.remove('hidden');
            loadQuestion();
        }

        // Initial Load
        loadQuestion();
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
