        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let timerSeconds = 0;
        let timerInterval = null;
        let hintVisible = false;

        // DOM Elements
        const qTextEn = document.getElementById('qTextEn');
        const qTextHi = document.getElementById('qTextHi');
        const optionsContainer = document.getElementById('optionsContainer');
        const questionCounter = document.getElementById('questionCounter');
        const pageIndicator = document.getElementById('pageIndicator');
        const progressBar = document.getElementById('progressBar');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const hintBox = document.getElementById('hintBox');
        const hintToggleText = document.getElementById('hintToggleText');
        const explanationBox = document.getElementById('explanationBox');
        const jumpInput = document.getElementById('jumpInput');

        function initQuiz() {
            startTimer();
            loadQuestion(currentIndex);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timerSeconds++;
                let mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                let secs = (timerSeconds % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `Time: ${mins}:${secs}`;
            }, 1000);
        }

        function loadQuestion(index) {
            const q = questions[index];
            questionCounter.textContent = `Question ${index + 1} of ${questions.length}`;
            pageIndicator.textContent = `Page ${q.page} Syllabus Range`;
            progressBar.style.width = `${((index + 1) / questions.length) * 100}%`;

            qTextEn.textContent = `${index + 1}. ${q.qTextEn}`;
            qTextHi.textContent = `${index + 1}. ${q.qTextHi}`;

            // Reset hint and explanation state
            hintVisible = false;
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            hintToggleText.textContent = "Show Hint";

            explanationBox.classList.add('hidden');
            explanationBox.textContent = "";
            explanationBox.className = "hidden mt-4 p-4 rounded-lg border text-sm";

            // Render Options
            optionsContainer.innerHTML = '';
            q.optionsEn.forEach((optEn, i) => {
                const optHi = q.optionsHi[i];
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1 font-medium ${
                    userAnswers[index] === i 
                        ? (i === q.answer ? 'bg-emerald-50 border-emerald-300 text-emerald-900 ring-2 ring-emerald-400' : 'bg-rose-50 border-rose-300 text-rose-900 ring-2 ring-rose-400')
                        : 'bg-white border-slate-200 hover:bg-slate-50 text-slate-700'
                }`;

                btn.innerHTML = `
                    <span class="text-sm font-semibold">${String.fromCharCode(65 + i)}. ${optEn}</span>
                    <span class="text-xs text-indigo-700 font-normal sm:text-right">${optHi}</span>
                `;

                if (userAnswers[index] !== null) {
                    btn.disabled = true;
                    if (i === q.answer) {
                        btn.className = 'w-full text-left p-3.5 rounded-xl border bg-emerald-50 border-emerald-300 text-emerald-900 font-medium flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1';
                    }
                } else {
                    btn.onclick = () => selectOption(i);
                }

                optionsContainer.appendChild(btn);
            });

            if (userAnswers[index] !== null) {
                showExplanation(index);
            }

            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === questions.length - 1 ? 'Finish' : 'Next';
            jumpInput.value = index + 1;
        }

        function selectOption(selectedIndex) {
            const q = questions[currentIndex];
            userAnswers[currentIndex] = selectedIndex;

            if (selectedIndex === q.answer) {
                score++;
                scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
            }

            loadQuestion(currentIndex);
        }

        function showExplanation(index) {
            const q = questions[index];
            const isCorrect = userAnswers[index] === q.answer;

            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mt-4 p-4 rounded-lg border bg-emerald-50 border-emerald-200 text-emerald-900 text-sm";
                explanationBox.innerHTML = `<strong>Correct! 🎉</strong><p class="mt-1">${q.explanation}</p>`;
            } else {
                explanationBox.className = "mt-4 p-4 rounded-lg border bg-rose-50 border-rose-200 text-rose-900 text-sm";
                explanationBox.innerHTML = `<strong>Incorrect. ❌</strong> Correct Answer was <strong>Option ${String.fromCharCode(65 + q.answer)}</strong>.<p class="mt-1">${q.explanation}</p>`;
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${questions.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion() {
            let val = parseInt(jumpInput.value);
            if (val >= 1 && val <= questions.length) {
                currentIndex = val - 1;
                loadQuestion(currentIndex);
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}`);
            }
        }

        function toggleHint() {
            hintVisible = !hintVisible;
            if (hintVisible) {
                hintBox.classList.remove('hidden');
                hintToggleText.textContent = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintToggleText.textContent = "Show Hint";
            }
        }

        window.onload = initQuiz;
    </script>
