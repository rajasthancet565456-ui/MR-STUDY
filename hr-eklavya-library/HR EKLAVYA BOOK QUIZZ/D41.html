        </div>

        <!-- Quiz Card -->
        <div id="quiz-card" class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-6 sm:p-8 relative">
            <!-- Question Header -->
            <div class="flex justify-between items-start gap-4 mb-4">
                <span id="question-tag" class="bg-amber-500/10 text-amber-400 text-xs font-semibold px-3 py-1 rounded-full border border-amber-500/20">
                    Sub-topic
                </span>
                <button id="hint-btn" onclick="toggleHint()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5 border border-slate-600">
                    💡 <span id="hint-text-label">Show Hint</span>
                </button>
            </div>

            <!-- Hint Box -->
            <div id="hint-box" class="hidden mb-4 p-3 bg-amber-950/40 border border-amber-700/50 text-amber-200 text-sm rounded-lg">
                <strong>Hint / संकेत:</strong> <span id="hint-content"></span>
            </div>

            <!-- Question Text (Bilingual) -->
            <div class="mb-6 space-y-2">
                <h2 id="question-en" class="text-lg sm:text-xl font-semibold text-white"></h2>
                <h3 id="question-hi" class="text-base sm:text-lg font-medium text-amber-200/90 font-hindi"></h3>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected options -->
            </div>

            <!-- Explanation Box (Revealed on choice) -->
            <div id="explanation-box" class="hidden mt-6 p-4 rounded-xl border transition-all">
                <div class="font-semibold text-sm mb-1 flex items-center gap-2" id="explanation-title">
                    <!-- Correct/Incorrect Status -->
                </div>
                <p id="explanation-text" class="text-sm text-slate-300 leading-relaxed"></p>
            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-6">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="prevQuestion()" id="prev-btn" class="flex-1 sm:flex-none px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl border border-slate-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    ← Previous
                </button>
                <button onclick="nextQuestion()" id="next-btn" class="flex-1 sm:flex-none px-6 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-xl transition-colors shadow-lg shadow-amber-500/10">

            </div>

            </div>
        </div>
    </main>

        let currentIndex = 0;
        let score = 0;
        let answered = new Array(quizData.length).fill(false);
        let userSelections = new Array(quizData.length).fill(null);

        function shuffleOptions(options) {
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            return options;
        }

        // Shuffle options for each question on load
        quizData.forEach(q => {
            shuffleOptions(q.options);
        });

        const totalQuestions = quizData.length;
        document.getElementById('total-questions-display').textContent = totalQuestions;
        document.getElementById('total-q-num').textContent = totalQuestions;
        document.getElementById('jump-input').max = totalQuestions;

        function loadQuestion(index) {
            const q = quizData[index];
            document.getElementById('current-q-num').textContent = index + 1;
            document.getElementById('jump-input').value = index + 1;
            document.getElementById('question-tag').textContent = q.tag;
            document.getElementById('question-en').textContent = `${index + 1}. ${q.en}`;
            document.getElementById('question-hi').textContent = q.hi;

            // Progress bar
            const progress = ((index + 1) / totalQuestions) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Hint
            document.getElementById('hint-content').textContent = q.hint;
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-text-label').textContent = "Show Hint";

            // Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-900/50 hover:bg-slate-700/50 text-slate-200 transition-all font-medium flex items-center justify-between group";
                
                let optionLetter = String.fromCharCode(65 + i);
                btn.innerHTML = `<span><strong class="text-amber-400 mr-2">${optionLetter}.</strong> ${opt.text}</span>`;

                if (answered[index]) {
                    btn.disabled = true;
                    if (opt.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-green-500/50 bg-green-500/10 text-green-200 font-medium flex items-center justify-between";
                    } else if (userSelections[index] === i) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-red-500/50 bg-red-500/10 text-red-200 font-medium flex items-center justify-between";
                    }
                } else {
                    btn.onclick = () => selectOption(index, i);
                }
                container.appendChild(btn);
            });

            // Explanation box
            const expBox = document.getElementById('explanation-box');
            if (answered[index]) {
                expBox.classList.remove('hidden');
                const isCorrect = q.options[userSelections[index]].correct;
                expBox.className = `mt-6 p-4 rounded-xl border ${isCorrect ? 'bg-green-950/40 border-green-700/50 text-green-200' : 'bg-red-950/40 border-red-700/50 text-red-200'}`;
                document.getElementById('explanation-title').innerHTML = isCorrect ? '✅ Correct Answer! / सही उत्तर!' : '❌ Incorrect Answer! / गलत उत्तर!';
                document.getElementById('explanation-text').textContent = q.explanation;
            } else {
                expBox.classList.add('hidden');
            }

            // Buttons state
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').textContent = index === totalQuestions - 1 ? 'Finish / View Summary' : 'Next →';
        }

        function selectOption(qIndex, optIndex) {
            if (answered[qIndex]) return;
            answered[qIndex] = true;
            userSelections[qIndex] = optIndex;

            const selectedOpt = quizData[qIndex].options[optIndex];
            if (selectedOpt.correct) {
                score++;
                document.getElementById('score-display').textContent = score;
            }

            loadQuestion(qIndex);
        }

        function nextQuestion() {
            if (currentIndex < totalQuestions - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                showSummary();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion(val) {
            const qNum = parseInt(val) - 1;
            if (qNum >= 0 && qNum < totalQuestions) {
                currentIndex = qNum;
                loadQuestion(currentIndex);
            } else {
                document.getElementById('jump-input').value = currentIndex + 1;
            }
        }

        function toggleHint() {
            const box = document.getElementById('hint-box');
            const label = document.getElementById('hint-text-label');
            if (box.classList.contains('hidden')) {
                box.classList.remove('hidden');
                label.textContent = "Hide Hint";
            } else {
                box.classList.add('hidden');
                label.textContent = "Show Hint";
            }
        }

        function showSummary() {
            const card = document.getElementById('quiz-card');
            const percentage = Math.round((score / totalQuestions) * 100);
            card.innerHTML = `
                <div class="text-center py-8 space-y-4">
                    <h2 class="text-2xl sm:text-3xl font-bold text-amber-400">Quiz Completed! / क्विज़ समाप्त!</h2>
                    <p class="text-slate-300">You have successfully completed the Rohtak District Haryana GK practice set (90 Questions).</p>
                    <div class="text-4xl font-extrabold text-white my-4">
                        ${score} / ${totalQuestions} <span class="text-lg font-normal text-slate-400">(${percentage}%)</span>
                    </div>
                    <p class="text-sm text-slate-400">Review your answers using the Previous button or restart below.</p>
                    <button onclick="restartQuiz()" class="mt-4 px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-xl transition-colors shadow-lg">
                        Restart Quiz / पुनः आरंभ करें
                    </button>
                </div>
            `;
            document.getElementById('progress-bar').style.width = '100%';
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            answered.fill(false);
            userSelections.fill(null);
            document.getElementById('score-display').textContent = score;
            quizData.forEach(q => shuffleOptions(q.options));
            loadQuestion(currentIndex);
        }

        // Initialize first question
        loadQuestion(0);
    </script>
