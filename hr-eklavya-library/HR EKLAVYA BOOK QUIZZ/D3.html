                exp: "The complete set of questions focuses thoroughly on the district study of Kaithal, Haryana, covering its geography, history, temples, shrines, and administration."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const totalQuestionsEl = document.getElementById('total-questions');
        const currentQNumEl = document.getElementById('current-q-num');
        const questionTextEl = document.getElementById('question-text');
        const questionTextHiEl = document.getElementById('question-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const progressBar = document.getElementById('progress-bar');
        const scoreEl = document.getElementById('score');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const jumpInput = document.getElementById('jump-input');

        totalQuestionsEl.textContent = quizData.length;

        function loadQuestion() {
            const q = quizData[currentQuestion];
            currentQNumEl.textContent = currentQuestion + 1;
            questionTextEl.textContent = q.q;
            questionTextHiEl.textContent = q.qHi;
            
            progressBar.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;
            jumpInput.value = currentQuestion + 1;

            optionsContainer.innerHTML = '';
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            explanationBox.classList.add('hidden');
            explanationText.textContent = q.exp;

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-lg border text-sm font-medium transition flex items-center justify-between ${
                    userAnswers[currentQuestion] !== null
                        ? index === q.answer
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-900'
                            : userAnswers[currentQuestion] === index
                            ? 'bg-rose-50 border-rose-300 text-rose-900'
                            : 'bg-white border-slate-200 text-slate-700'
                        : 'bg-white border-slate-200 hover:bg-slate-50 text-slate-700'
                }`;
                btn.innerHTML = `<span>${opt}</span>`;
                btn.disabled = userAnswers[currentQuestion] !== null;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentQuestion] !== null) {
                explanationBox.classList.remove('hidden');
            }

            prevBtn.disabled = currentQuestion === 0;
            nextBtn.textContent = currentQuestion === quizData.length - 1 ? 'Finish' : 'Next';
        }

        function selectOption(index) {
            const q = quizData[currentQuestion];
            userAnswers[currentQuestion] = index;

            if (index === q.answer) {
                score++;
                scoreEl.textContent = score;
            }

            loadQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                alert(`Quiz completed! Your final score is ${score} / ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            const num = parseInt(val) - 1;
            if (num >= 0 && num < quizData.length) {
                currentQuestion = num;
                loadQuestion();
            } else {
                jumpInput.value = currentQuestion + 1;
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        // Initialize first question
        loadQuestion();
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
