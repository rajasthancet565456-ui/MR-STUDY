<body class="bg-slate-50 text-slate-800 min-p-4 flex flex-col items-center justify-center min-h-screen">

    <div class="w-full max-w-3xl bg-white shadow-xl rounded-2xl p-6 md:p-8 my-6 border border-slate-100">
        <!-- Header -->

                </div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2.5 rounded-full mb-6 overflow-hidden">
            <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%;"></div>
        </div>

        <!-- Navigation Jump Bar -->
        <div class="flex flex-wrap items-center justify-between gap-2 mb-6 bg-slate-50 p-3 rounded-xl border border-slate-200">
            <div class="text-sm font-medium text-slate-600">
                Question <span id="current-q-num">1</span> of <span id="total-q-num">65</span>
            </div>
            <div class="flex items-center gap-2">
                <label for="jump-input" class="text-xs text-slate-500">Jump to:</label>
                <input type="number" id="jump-input" min="1" max="65" class="w-16 px-2 py-1 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="1-65">
                <button onclick="jumpToQuestion()" class="bg-indigo-600 text-white px-3 py-1 text-sm rounded-lg hover:bg-indigo-700 transition">Go</button>
            </div>
        </div>

        <!-- Question Container -->
        <div id="quiz-container" class="mb-6">
            <!-- Bilingual Question Text -->
            <div class="mb-4">
                <h2 id="question-text-en" class="text-lg font-semibold text-slate-900 mb-2"></h2>
                <h2 id="question-text-hi" class="text-base font-medium text-indigo-900 bg-indigo-50/50 p-3 rounded-lg border border-indigo-100"></h2>
            </div>

            <!-- Hint Section -->
            <div class="mb-4">
                <button onclick="toggleHint()" class="text-xs font-semibold text-amber-600 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                    💡 Show Hint / संकेत देखें
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg">
                    <span id="hint-text"></span>
                </div>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically generated options -->
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden p-4 rounded-xl border transition-all duration-300">
                <h3 id="explanation-title" class="font-bold text-sm mb-1"></h3>
                <p id="explanation-text" class="text-sm"></p>
            </div>
        </div>

        <!-- Footer Navigation Controls -->
        <div class="flex justify-between items-center border-t pt-4">
            <button id="prev-btn" onclick="prevQuestion()" class="px-5 py-2.5 bg-slate-200 text-slate-700 font-medium text-sm rounded-xl hover:bg-slate-300 transition disabled:opacity-50 disabled:cursor-not-allowed">
                ← Previous

                Next →
            </button>
        </div>
    </div>

        let currentQuestion = 0;
        let score = 0;
        let answered = new Array(quizData.length).fill(false);
        let userSelections = new Array(quizData.length).fill(null);

        function loadQuestion() {
            const q = quizData[currentQuestion];
            document.getElementById('current-q-num').innerText = currentQuestion + 1;
            document.getElementById('total-q-num').innerText = quizData.length;
            document.getElementById('total-questions').innerText = quizData.length;
            
            document.getElementById('question-text-en').innerText = `${currentQuestion + 1}. ${q.en}`;
            document.getElementById('question-text-hi').innerText = q.hi;

            // Hint
            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('hint-box').classList.add('hidden');

            // Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const button = document.createElement('button');
                button.className = `w-full text-left p-3.5 rounded-xl border text-sm font-medium transition flex items-center justify-between ${
                    answered[currentQuestion]
                        ? index === q.answer
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-semibold'
                            : userSelections[currentQuestion] === index
                                ? 'bg-rose-50 border-rose-300 text-rose-900'
                                : 'bg-white border-slate-200 text-slate-600 opacity-60'
                        : 'bg-white border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/30 text-slate-700'
                }`;
                button.innerHTML = `<span>${opt}</span>`;
                button.disabled = answered[currentQuestion];
                button.onclick = () => selectOption(index);
                optionsContainer.appendChild(button);
            });

            // Explanation Box
            const expBox = document.getElementById('explanation-box');
            if (answered[currentQuestion]) {
                showExplanationUI(userSelections[currentQuestion] === q.answer);
            } else {
                expBox.classList.add('hidden');
            }

            // Progress bar
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Buttons state
            document.getElementById('prev-btn').disabled = currentQuestion === 0;
            document.getElementById('next-btn').innerText = currentQuestion === quizData.length - 1 ? 'Finish / Score' : 'Next →';
        }

        function selectOption(index) {
            if (answered[currentQuestion]) return;
            answered[currentQuestion] = true;
            userSelections[currentQuestion] = index;

            const q = quizData[currentQuestion];
            const isCorrect = index === q.answer;
            if (isCorrect) {
                score++;
                document.getElementById('score').innerText = score;
            }

            loadQuestion();
            showExplanationUI(isCorrect);
        }

        function showExplanationUI(isCorrect) {
            const q = quizData[currentQuestion];
            const expBox = document.getElementById('explanation-box');
            const expTitle = document.getElementById('explanation-title');
            const expText = document.getElementById('explanation-text');

            expBox.classList.remove('hidden');
            if (isCorrect) {
                expBox.className = 'p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900';
                expTitle.innerText = '✅ Correct Answer / सही उत्तर!';
            } else {
                expBox.className = 'p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900';
                expTitle.innerText = '❌ Incorrect Answer / गलत उत्तर!';
            }
            expText.innerText = q.explanation;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value) - 1;
            if (val >= 0 && val < quizData.length) {
                currentQuestion = val;
                loadQuestion();
                input.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        // Initial Load
        window.onload = loadQuestion;
    </script>
