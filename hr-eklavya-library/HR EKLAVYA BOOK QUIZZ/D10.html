        const scoreDisplay = document.getElementById('score-display');
        const totalQuestionsDisplay = document.getElementById('total-questions-display');
        const progressBar = document.getElementById('progress-bar');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');

        rdqTotal = quizData.length;
        totalQuestionsDisplay.textContent = rdqTotal;

        // Shuffle options helper keeping track of correct option
        function getShuffledOptions(q) {
            const optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                const j = (currentIndex * 7 + i) % optionsWithIndex.length;
                [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
            }
            return optionsWithIndex;
        }

        function loadQuestion() {
            const q = quizData[currentIndex];
            questionCounterEl.textContent = `Question ${currentIndex + 1} of ${quizData.length} (Page ${q.page})`;
            questionTextEnEl.textContent = q.en;
            questionTextHiEl.textContent = q.hi;

            // Reset hint and explanation views
            showHintState = false;
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            hintToggleBtn.innerHTML = `<span>💡 Show Hint</span>`;

            const userSelected = userAnswers[currentIndex];
            if (userSelected !== null) {
                explanationBox.classList.remove('hidden');
                if (userSelected === q.correct) {
                    explanationBox.className = "p-4 rounded-xl border border-emerald-500/40 bg-emerald-950/30 text-emerald-200 mb-6 transition-all duration-300";
                    explanationTitle.innerHTML = "✅ Correct Answer";
                } else {
                    explanationBox.className = "p-4 rounded-xl border border-rose-500/40 bg-rose-950/30 text-rose-200 mb-6 transition-all duration-300";
                    explanationTitle.innerHTML = "❌ Incorrect Answer";
                }
                explanationText.textContent = q.explanation;
            } else {
                explanationBox.classList.add('hidden');
            }

            // Render options
            optionsContainerEl.innerHTML = '';
            const shuffled = getShuffledOptions(q);

            shuffled.forEach((optObj, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition-all duration-200 flex items-center justify-between text-sm md:text-base font-medium `;
                
                const optionLabel = String.fromCharCode(65 + idx); // A, B, C, D
                
                if (userSelected !== null) {
                    if (optObj.originalIndex === q.correct) {
                        btn.className += "bg-emerald-900/40 border-emerald-500 text-emerald-200";
                    } else if (optObj.originalIndex === userSelected) {
                        btn.className += "bg-rose-900/40 border-rose-500 text-rose-200";
                    } else {
                        btn.className += "bg-slate-900/40 border-slate-700 text-slate-400 opacity-60";
                    }
                    btn.disabled = true;
                } else {
                    btn.className += "bg-slate-900/60 border-slate-700 hover:border-emerald-500 hover:bg-slate-900 text-slate-200 cursor-pointer";
                    btn.onclick = () => selectOption(optObj.originalIndex);
                }

                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-bold text-slate-300">${optionLabel}</span>
                        <span>${optObj.text}</span>
                    </div>
                `;
                optionsContainerEl.appendChild(btn);
            });

            // Update Nav controls & Progress
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === quizData.length - 1;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            scoreDisplay.textContent = score;
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentIndex] !== null) return;
            
            userAnswers[currentIndex] = selectedIndex;
            const q = quizData[currentIndex];

            if (selectedIndex === q.correct) {
                score++;
                explanationBox.className = "p-4 rounded-xl border border-emerald-500/40 bg-emerald-950/30 text-emerald-200 mb-6 transition-all duration-300";
                explanationTitle.innerHTML = "✅ Correct Answer";
            } else {
                explanationBox.className = "p-4 rounded-xl border border-rose-500/40 bg-rose-950/30 text-rose-200 mb-6 transition-all duration-300";
                explanationTitle.innerHTML = "❌ Incorrect Answer";
            }
            explanationText.textContent = q.explanation;
            explanationBox.classList.remove('hidden');

            scoreDisplay.textContent = score;
            loadQuestion();
        }

        // Hint Toggle
        hintToggleBtn.onclick = () => {
            showHintState = !showHintState;
            if (showHintState) {
                hintBox.classList.remove('hidden');
                hintToggleBtn.innerHTML = `<span>💡 Hide Hint</span>`;
            } else {
                hintBox.classList.add('hidden');
                hintToggleBtn.innerHTML = `<span>💡 Show Hint</span>`;
            }
        };

        // Navigation Handlers
        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        };

        nextBtn.onclick = () => {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        };

        jumpBtn.onclick = () => {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                jumpInput.value = '';
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        };

        // Initial Load
        loadQuestion();
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
