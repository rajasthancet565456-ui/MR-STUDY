        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredQuestions = new Array(quizData.length).fill(false);

        const questionCounterEl = document.getElementById('question-counter');
        const sourcePageTagEl = document.getElementById('source-page-tag');
        const questionEnEl = document.getElementById('question-en');
        const questionHiEl = document.getElementById('question-hi');
        const optionsContainerEl = document.getElementById('options-container');
        const hintBoxEl = document.getElementById('hint-box');
        const hintTextEl = document.getElementById('hint-text');
        const hintBtnTextEl = document.getElementById('hint-btn-text');
        const explanationBoxEl = document.getElementById('explanation-box');
        const explanationTextEl = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBarEl = document.getElementById('progress-bar');
        const progressPercentEl = document.getElementById('progress-percent');
        const scoreDisplayEl = document.getElementById('score-display');
        const totalDisplayEl = document.getElementById('total-display');
        const jumpInput = document.getElementById('jump-input');

        totalDisplayEl.textContent = quizData.length;

        function loadQuestion() {
            const currentQ = quizData[currentIndex];
            questionCounterEl.textContent = `Question ${currentIndex + 1} of ${quizData.length}`;
            sourcePageTagEl.textContent = `Source: Page ${currentQ.page}`;
            questionEnEl.textContent = currentQ.en;
            questionHiEl.textContent = currentQ.hi;

            // Hide hint and explanation initially for the new question
            hintBoxEl.classList.add('hidden');
            hintBtnTextEl.textContent = 'Show Hint / संकेत देखें';
            explanationBoxEl.classList.add('hidden');

            // Render options
            optionsContainerEl.innerHTML = '';
            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition flex justify-between items-center text-sm sm:text-base font-medium `;
                
                const isAnswered = answeredQuestions[currentIndex];
                const userSelected = userAnswers[currentIndex] === idx;

                if (!isAnswered) {
                    btn.className += `bg-slate-700/50 border-slate-600 hover:bg-slate-700 text-white`;
                    btn.onclick = () => selectOption(idx);
                } else {
                    // Already answered state
                    if (opt.correct) {
                        btn.className += `bg-emerald-950/80 border-emerald-600 text-emerald-200`;
                    } else if (userSelected && !opt.correct) {
                        btn.className += `bg-rose-950/80 border-rose-600 text-rose-200`;
                    } else {
                        btn.className += `bg-slate-800/60 border-slate-700 text-slate-400 opacity-60`;
                    }
                    btn.disabled = true;
                }

                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${opt.text}</span>`;
                optionsContainerEl.appendChild(btn);
            });

            if (answeredQuestions[currentIndex]) {
                explanationTextEl.textContent = currentQ.explanation;
                explanationBoxEl.classList.remove('hidden');
            }

            hintTextEl.textContent = currentQ.hint;

            // Update nav buttons & progress
            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? 'Finish Quiz' : 'Next →';

            updateProgress();
        }

        function selectOption(optionIndex) {
            if (answeredQuestions[currentIndex]) return;

            answeredQuestions[currentIndex] = true;
            userAnswers[currentIndex] = optionIndex;

            const currentQ = quizData[currentIndex];
            if (currentQ.options[optionIndex].correct) {
                score++;
                scoreDisplayEl.textContent = score;
            }

            // Show explanation
            explanationTextEl.textContent = currentQ.explanation;
            explanationBoxEl.classList.remove('hidden');

            loadQuestion(); // Reload to apply styling colors
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                jumpInput.value = '';
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        function toggleHint() {
            if (hintBoxEl.classList.contains('hidden')) {
                hintBoxEl.classList.remove('hidden');
                hintBtnTextEl.textContent = 'Hide Hint / संकेत छुपाएं';
            } else {
                hintBoxEl.classList.add('hidden');
                hintBtnTextEl.textContent = 'Show Hint / संकेत देखें';
            }
        }

        function updateProgress() {
            const answeredCount = answeredQuestions.filter(Boolean).length;
            const percent = Math.round((answeredCount / quizData.length) * 100);
            progressBarEl.style.width = percent + '%';
            progressPercentEl.textContent = percent + '%';
        }

        // Initial Load
        loadQuestion();
    </script>
