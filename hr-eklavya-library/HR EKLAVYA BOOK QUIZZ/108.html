            timerInterval = setInterval(() => {
                timerSeconds++;
                let mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                let secs = (timerSeconds % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `Time: ${mins}:${secs}`;
            }, 1000);

            progressBar.style.width = `${((index + 1) / questions.length) * 100}%`;

            qTextHi.textContent = `${index + 1}. ${q.qTextHi}`;

            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;

                showExplanation(index);
            }

            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === questions.length - 1 ? 'Finish' : 'Next';
            jumpInput.value = index + 1;
        }

        function selectOption(selectedIndex) {
            const q = questions[currentIndex];
            userAnswers[currentIndex] = selectedIndex;

            if (selectedIndex === q.answer) {
                score++;
                scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
            }

            loadQuestion(currentIndex);
        }

        function showExplanation(index) {
            const q = questions[index];
            const isCorrect = userAnswers[index] === q.answer;

            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mt-4 p-4 rounded-lg border bg-emerald-50 border-emerald-200 text-emerald-900 text-sm";
                explanationBox.innerHTML = `<strong>Correct! 🎉</strong><p class="mt-1">${q.explanation}</p>`;
            } else {
                explanationBox.className = "mt-4 p-4 rounded-lg border bg-rose-50 border-rose-200 text-rose-900 text-sm";
                explanationBox.innerHTML = `<strong>Incorrect. ❌</strong> Correct Answer was <strong>Option ${String.fromCharCode(65 + q.answer)}</strong>.<p class="mt-1">${q.explanation}</p>`;
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${questions.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion() {
            let val = parseInt(jumpInput.value);
            if (val >= 1 && val <= questions.length) {
                currentIndex = val - 1;
                loadQuestion(currentIndex);
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}`);
            }
        }

        function toggleHint() {
            hintVisible = !hintVisible;
            if (hintVisible) {
                hintBox.classList.remove('hidden');
                hintToggleText.textContent = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintToggleText.textContent = "Show Hint";
            }
        }

        window.onload = initQuiz;
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
