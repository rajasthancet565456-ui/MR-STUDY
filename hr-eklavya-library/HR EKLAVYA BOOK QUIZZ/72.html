        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(questionsData.length).fill(null);
        let shuffledOptionsCache = {};

        // DOM Elements
        const scoreValElem = document.getElementById('score-val');
        const pageIndicatorElem = document.getElementById('page-indicator');
        const progressBarElem = document.getElementById('progress-bar');
        const qBadgeElem = document.getElementById('q-badge');
        const sourcePageBadgeElem = document.getElementById('source-page-badge');
        const questionTextEnElem = document.getElementById('question-text-en');
        const questionTextHiElem = document.getElementById('question-text-hi');
        const optionsContainerElem = document.getElementById('options-container');
        const hintBtnElem = document.getElementById('hint-btn');
        const hintBoxElem = document.getElementById('hint-box');
        const hintTextElem = document.getElementById('hint-text');
        const explanationBoxElem = document.getElementById('explanation-box');
        const explanationTextElem = document.getElementById('explanation-text');
        const prevBtnElem = document.getElementById('prev-btn');
        const nextBtnElem = document.getElementById('next-btn');
        const jumpInputElem = document.getElementById('jump-input');

        function getShuffledOptions(qIndex) {
            if (shuffledOptionsCache[qIndex]) {
                return shuffledOptionsCache[qIndex];
            }
            const q = questionsData[qIndex];
            const optionsWithOriginalIndices = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            
            // Deterministic pseudo-shuffle based on question id to ensure stability across navigation
            for (let i = optionsWithOriginalIndices.length - 1; i > 0; i--) {
                let j = (q.id * 17 + i * 31) % (i + 1);
                [optionsWithOriginalIndices[i], optionsWithOriginalIndices[j]] = [optionsWithOriginalIndices[j], optionsWithOriginalIndices[i]];
            }
            
            shuffledOptionsCache[qIndex] = optionsWithOriginalIndices;
            return optionsWithOriginalIndices;
        }

        function loadQuestion(index) {
            currentIndex = index;
            const q = questionsData[index];

            // Update Badges & Meta
            qBadgeElem.innerText = `Question ${index + 1} of 80`;
            sourcePageBadgeElem.innerText = `Source: Page ${q.page} (${q.page === 1 ? 'Q1-40' : 'Q41-80'})`;
            pageIndicatorElem.innerText = `Page ${q.page}`;
            
            // Progress Bar & Score
            progressBarElem.style.width = `${((index + 1) / 80) * 100}%`;
            scoreValElem.innerText = score;

            // Question Text
            questionTextEnElem.innerText = `${index + 1}. ${q.en}`;
            questionTextHiElem.innerText = q.hi;

            // Hide Hint & Explanation initially or restore state
            hintBoxElem.classList.add('hidden');
            hintBtnElem.innerHTML = "<span>💡 Show Hint</span>";
            hintTextElem.innerText = q.hint;
            explanationTextElem.innerText = q.explanation;

            const shuffledOpts = getShuffledOptions(index);
            optionsContainerElem.innerHTML = '';

            const selectedOption = userAnswers[index];
            if (selectedOption !== null) {
                explanationBoxElem.classList.remove('hidden');
            } else {
                explanationBoxElem.classList.add('hidden');
            }

            shuffledOpts.forEach((optObj, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition-all flex items-center justify-between text-sm sm:text-base font-medium `;
                
                let btnStyle = "bg-slate-900/50 border-slate-700 hover:border-slate-500 text-slate-200";
                
                if (selectedOption !== null) {
                    btn.disabled = true;
                    if (optObj.originalIndex === q.answer) {
                        btnStyle = "bg-emerald-900/40 border-emerald-500 text-emerald-200 font-semibold";
                    } else if (selectedOption === optObj.originalIndex) {
                        btnStyle = "bg-rose-900/40 border-rose-500 text-rose-200";
                    } else {
                        btnStyle = "bg-slate-900/30 border-slate-800 text-slate-500 opacity-50";
                    }
                }

                btn.className += btnStyle;
                btn.innerHTML = `<span><span class="inline-block w-6 font-bold text-slate-400">${String.fromCharCode(65 + idx)}.</span> ${optObj.text}</span>`;
                
                if (selectedOption === null) {
                    btn.onclick = () => selectOption(optObj.originalIndex);
                }

                optionsContainerElem.appendChild(btn);
            });

            prevBtnElem.disabled = currentIndex === 0;
            nextBtnElem.innerText = currentIndex === questionsData.length - 1 ? "Finish Quiz" : "Next";
            jumpInputElem.value = currentIndex + 1;
        }

        function selectOption(originalIndex) {
            if (userAnswers[currentIndex] !== null) return;
            
            userAnswers[currentIndex] = originalIndex;
            const q = questionsData[currentIndex];

            if (originalIndex === q.answer) {
                score++;
                scoreValElem.innerText = score;
            }

            explanationBoxElem.classList.remove('hidden');
            loadQuestion(currentIndex);
        }

        function toggleHint() {
            if (hintBoxElem.classList.contains('hidden')) {
                hintBoxElem.classList.remove('hidden');
                hintBtnElem.innerHTML = "<span>💡 Hide Hint</span>";
            } else {
                hintBoxElem.classList.add('hidden');
                hintBtnElem.innerHTML = "<span>💡 Show Hint</span>";
            }
        }

        function nextQuestion() {
            if (currentIndex < questionsData.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                showCompletionSummary();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                loadQuestion(currentIndex - 1);
            }
        }

        function jumpToQuestion() {
            let val = parseInt(jumpInputElem.value) - 1;
            if (val >= 0 && val < questionsData.length) {
                loadQuestion(val);
            } else {
                alert("Please enter a valid question number between 1 and 80.");
            }
        }

        function showCompletionSummary() {
            const card = document.getElementById('quiz-card');
            card.innerHTML = `
                <div class="text-center py-8 space-y-4 fade-in">
                    <div class="inline-flex p-4 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-full text-4xl mb-2">🏆</div>
                    <h2 class="text-2xl font-bold text-white">Quiz Completed Successfully!</h2>
                    <p class="text-slate-300">You have completed all 80 examination-level bilingual questions based on the provided images.</p>
                    <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-xs mx-auto my-6">
                        <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Final Score</div>
                        <div class="text-4xl font-extrabold text-emerald-400">${score} <span class="text-slate-500 text-2xl">/ 80</span></div>
                        <div class="text-xs text-slate-400 mt-2">Percentage: ${((score / 80) * 100).toFixed(1)}%</div>
                    </div>
                    <button onclick="resetQuiz()" class="px-6 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition-colors shadow-lg">Retake Quiz</button>
                </div>
            `;
        }

        function resetQuiz() {
            location.reload();
        }

        // Initialize First Question
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
