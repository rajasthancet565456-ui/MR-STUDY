            },
            {
                hi: "मौसम संबंधी जानकारी देने वाली संस्था 'हरेसक' (HARESA) की स्थापना हिसार में किस वर्ष हुई?",
                en: "In which year was 'HARESA' established in Hisar?",
                options: ["1982", "1986", "1995", "2002"],
                answer: 1,
                hint: "यह वर्ष 1986 है।",
                explanation: "हरेसक की स्थापना 1986 में की गई थी।"
            },
            {
                hi: "हिसार छावनी (Hisar Cantt) की स्थापना किस वर्ष की गई थी?",
                en: "Hisar Cantonment was established in which year?",
                options: ["1982", "1985", "1986", "1997"],
                answer: 0,
                hint: "यह 15 नवंबर 1982 है।",
                explanation: "हिसार कैंट की स्थापना 15 नवम्बर, 1982 को की गई थी।"
            },
            {
                hi: "अंतर्राष्ट्रीय ख्याति प्राप्त बैडमिंटन खिलाड़ी सायना नेहवाल और अभिनेत्री मल्लिका सहरावत का जन्म किस जिले में हुआ था?",
                en: "In which district were internationally renowned badminton player Saina Nehwal and actress Mallika Sherawat born?",
                options: ["रोहतक", "हिसार", "सिरसा", "भिवानी"],
                answer: 1,
                hint: "यह दोनों इस पाठ के मुख्य जिले से हैं।",
                explanation: "सायना नेहवाल और मल्लिका सहरावत दोनों का जन्म हिसार में हुआ था।"
            },
            {
                hi: "वैश्य समाज का प्राचीन उद्गम स्थल इनमें से किसे माना जाता है?",
                en: "Which of the following is considered the ancient place of origin for the Vaishya community?",
                options: ["अग्रोहा", "हांसी", "बरवाला", "सिवानी"],
                answer: 0,
                hint: "यह हिसार का ऐतिहासिक अग्रोहा क्षेत्र है।",
                explanation: "वैश्य समाज का उद्गम स्थल अग्रोहा माना जाता है।"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswers = new Array(quizData.length).fill(null);

        const totalQCountEl = document.getElementById('total-q-count');
        const currentQNumEl = document.getElementById('current-q-num');
        const totalQNumEl = document.getElementById('total-q-num');
        const progressBar = document.getElementById('progress-bar');
        const questionTextHi = document.getElementById('question-text-hi');
        const questionTextEn = document.getElementById('question-text-en');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const scoreTracker = document.getElementById('score-tracker');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            currentQNumEl.textContent = currentQuestionIndex + 1;
            totalQNumEl.textContent = quizData.length;
            totalQCountEl.textContent = quizData.length;
            
            // Progress Bar
            const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Text
            questionTextHi.textContent = `${currentQuestionIndex + 1}. ${q.hi}`;
            questionTextEn.textContent = q.en;

            // Hint & Explanation Reset
            hintBox.classList.add('hidden');
            hintText.textContent = q.hint;
            
            if (selectedAnswers[currentQuestionIndex] !== null) {
                explanationBox.classList.remove('hidden');
                explanationText.textContent = q.explanation;
            } else {
                explanationBox.classList.add('hidden');
            }

            // Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-xl border border-slate-200 transition font-medium text-sm sm:text-base flex items-center justify-between `;
                
                const userChoice = selectedAnswers[currentQuestionIndex];
                
                if (userChoice !== null) {
                    btn.disabled = true;
                    if (idx === q.answer) {
                        btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                    } else if (idx === userChoice) {
                        btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-900');
                    } else {
                        btn.classList.add('bg-white', 'text-slate-600', 'opacity-60');
                    }
                } else {
                    btn.classList.add('bg-white', 'hover:bg-slate-50', 'text-slate-700');
                    btn.onclick = () => selectOption(idx);
                }

                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${opt}</span>`;
                optionsContainer.appendChild(btn);
            });

            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "समाप्त (Finish)" : "अगला (Next) →";
        }

        function selectOption(selectedIndex) {
            selectedAnswers[currentQuestionIndex] = selectedIndex;
            const q = quizData[currentQuestionIndex];
            
            if (selectedIndex === q.answer) {
                score += 1;
            }
            
            scoreTracker.textContent = `Score: ${score}`;
            explanationBox.classList.remove('hidden');
            explanationText.textContent = q.explanation;
            
            loadQuestion();
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                alert(`क्विज़ समाप्त! आपका कुल स्कोर: ${score} / ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value) - 1;
            if (!isNaN(val) && val >= 0 && val < quizData.length) {
                currentQuestionIndex = val;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`कृपया 1 से ${quizData.length} के बीच वैध प्रश्न संख्या दर्ज करें।`);
            }
        }

        // Initialize First Question
        loadQuestion();
    </script>
