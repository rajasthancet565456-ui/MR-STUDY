<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">Haryana GK Master Quiz</h1>
                <p class="text-xs text-indigo-200">Bilingual (English & Hindi) | 100 Examination-Level Questions</p>
            </div>
            <div class="bg-indigo-800 px-4 py-2 rounded-lg text-sm font-semibold border border-indigo-600">
                Score: <span id="score-display">0</span> / <span id="total-display">100</span>
            </div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 my-6 bg-white rounded-2xl shadow-xl flex-grow flex flex-col justify-between">
        
        <!-- Top Navigation & Progress -->
        <div>
            <div class="flex justify-between items-center mb-3 text-sm text-slate-500 font-medium">
                <span id="question-counter">Question 1 of 100</span>
                <span id="source-page-tag" class="bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full text-xs font-semibold border border-indigo-200">Page 1</span>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 h-2.5 rounded-full mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 1%;"></div>
            </div>

            <!-- Question Card -->
            <div class="mb-6">
                <div id="question-text-en" class="text-lg font-semibold text-slate-900 mb-2">Loading English question...</div>
                <div id="question-text-hi" class="text-base font-medium text-indigo-900 bg-indigo-50/60 p-3 rounded-xl border border-indigo-100">Loading Hindi question...</div>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="grid grid-cols-1 gap-3 mb-6">
                <!-- Dynamic Options Will Load Here -->
            </div>

            <!-- Hint Section -->
            <div class="mb-4">
                <button onclick="toggleHint()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition border border-indigo-200 flex items-center gap-1.5">
                    <span>💡 Toggle Hint</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-xl">
                    <span class="font-bold">Hint:</span> <span id="hint-text"></span>
                </div>
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden p-4 rounded-xl border text-sm mb-4">
                <h4 class="font-bold mb-1 flex items-center gap-1.5" id="explanation-title"></h4>
                <p id="explanation-text" class="text-slate-700"></p>
            </div>
        </div>

        <!-- Bottom Controls & Jump Section -->
        <div class="pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-start">
                <button id="prev-btn" onclick="prevQuestion()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed text-sm">
                    ← Previous
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition text-sm shadow-sm">
                    Next →
                </button>
            </div>

            <!-- Jump to Question -->
            <div class="flex items-center gap-2 text-sm text-slate-600">
                <span>Jump to:</span>
                <input type="number" id="jump-input" min="1" max="100" class="w-16 px-2 py-1 border border-slate-300 rounded-lg text-center focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="1-100">
                <button onclick="jumpToQuestion()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg transition border border-slate-300">Go</button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500">
        Haryana GK Examination Prep Suite &copy; 2026 | Unique 100 Question Architecture
    </footer>

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptionsCache = {};

        // DOM Elements
        const questionCounterEl = document.getElementById('question-counter');
        const sourcePageTagEl = document.getElementById('source-page-tag');
        const progressBarEl = document.getElementById('progress-bar');
        const questionTextEnEl = document.getElementById('question-text-en');
        const questionTextHiEl = document.getElementById('question-text-hi');
        const optionsContainerEl = document.getElementById('options-container');
        const hintBoxEl = document.getElementById('hint-box');
        const hintTextEl = document.getElementById('hint-text');
        const explanationBoxEl = document.getElementById('explanation-box');
        const explanationTitleEl = document.getElementById('explanation-title');
        const explanationTextEl = document.getElementById('explanation-text');
        const scoreDisplayEl = document.getElementById('score-display');
        const totalDisplayEl = document.getElementById('total-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        totalDisplayEl.textContent = quizData.length;

        // Shuffle options once per question index to keep state stable during navigation
        function getShuffledOptions(index) {
            if (shuffledOptionsCache[index]) {
                return shuffledOptionsCache[index];
            }
            const q = quizData[index];
            let optionsWithIndex = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
            
            // Deterministic pseudo-random shuffle based on index to prevent mismatch bugs on re-render
            optionsWithIndex.sort((a, b) => {
                let seedA = Math.sin(index + a.originalIndex * 99) * 10000;
                let seedB = Math.sin(index + b.originalIndex * 99) * 10000;
                return (seedA - Math.floor(seedA)) - (seedB - Math.floor(seedB));
            });

            shuffledOptionsCache[index] = optionsWithIndex;
            return optionsWithIndex;
        }

        function loadQuestion(index) {
            currentQuestionIndex = index;
            const q = quizData[index];

            // Update header trackers
            questionCounterEl.textContent = `Question ${index + 1} of ${quizData.length}`;
            sourcePageTagEl.textContent = `Page ${q.page}`;
            progressBarEl.style.width = `${((index + 1) / quizData.length) * 100}%`;

            // Set question text
            questionTextEnEl.textContent = `${index + 1}. ${q.en}`;
            questionTextHiEl.textContent = q.hi;

            // Hint setup
            hintTextEl.textContent = q.hint;
            hintBoxEl.classList.add('hidden');

            // Render Options
            optionsContainerEl.innerHTML = '';
            const shuffled = getShuffledOptions(index);
            const savedAnswer = userAnswers[index];

            shuffled.forEach((item, pos) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 font-medium text-slate-700 flex items-center justify-between shadow-sm`;
                
                const labelSpan = document.createElement('span');
                labelSpan.textContent = item.text;
                btn.appendChild(labelSpan);

                const letterSpan = document.createElement('span');
                letterSpan.className = 'text-xs font-bold uppercase bg-slate-100 text-slate-500 px-2 py-1 rounded-md border border-slate-200';
                letterSpan.textContent = String.fromCharCode(65 + pos);
                btn.appendChild(letterSpan);

                if (savedAnswer !== null) {
                    btn.disabled = true;
                    if (item.originalIndex === q.answer) {
                        btn.className = "option-btn w-full text-left p-4 rounded-xl border border-emerald-300 bg-emerald-50 text-emerald-900 font-medium flex items-center justify-between shadow-sm";
                        letterSpan.className = "text-xs font-bold uppercase bg-emerald-200 text-emerald-800 px-2 py-1 rounded-md";
                    } else if (savedAnswer === item.originalIndex) {
                        btn.className = "option-btn w-full text-left p-4 rounded-xl border border-rose-300 bg-rose-50 text-rose-900 font-medium flex items-center justify-between shadow-sm";
                        letterSpan.className = "text-xs font-bold uppercase bg-rose-200 text-rose-800 px-2 py-1 rounded-md";
                    }
                } else {
                    btn.onclick = () => selectOption(item.originalIndex);
                }

                optionsContainerEl.appendChild(btn);
            });

            // Explanation box handling
            if (savedAnswer !== null) {
                explanationBoxEl.classList.remove('hidden');
                if (savedAnswer === q.answer) {
                    explanationBoxEl.className = "p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900 mb-4";
                    explanationTitleEl.innerHTML = "✅ Correct Answer!";
                } else {
                    explanationBoxEl.className = "p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900 mb-4";
                    explanationTitleEl.innerHTML = "❌ Incorrect Answer.";
                }
                explanationTextEl.textContent = q.explanation;
            } else {
                explanationBoxEl.classList.add('hidden');
            }

            // Button controls state
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? "Finish / Summary" : "Next →";
            jumpInput.value = index + 1;
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentQuestionIndex] !== null) return; // Already answered

            userAnswers[currentQuestionIndex] = selectedIndex;
            const q = quizData[currentQuestionIndex];

            if (selectedIndex === q.answer) {
                score++;
                scoreDisplayEl.textContent = score;
            }

            loadQuestion(currentQuestionIndex);
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                loadQuestion(currentQuestionIndex - 1);
            }
        }

        function jumpToQuestion() {
            let val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                loadQuestion(val - 1);
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function toggleHint() {
            hintBoxEl.classList.toggle('hidden');
        }

        // Initialize first question on load
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
