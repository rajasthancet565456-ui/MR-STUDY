        // Shuffle options for each question while keeping track of the correct answer
        let processedQuestions = questions.map(q => {
            let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            // Simple shuffle
            for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
            }
            let newCorrectIndex = optionsWithIndex.findIndex(opt => opt.originalIndex === q.correct);
            return {
                ...q,
                options: optionsWithIndex.map(o => o.text),
                correct: newCorrectIndex
            };
        });

        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(processedQuestions.length).fill(null);

        const totalQuestions = processedQuestions.length;
        document.getElementById('total-score').innerText = totalQuestions;
        document.getElementById('total-q-num').innerText = totalQuestions;
        document.getElementById('jump-input').max = totalQuestions;

        function loadQuestion() {
            const q = processedQuestions[currentIndex];
            
            // Badges & Counters
            document.getElementById('current-q-num').innerText = currentIndex + 1;
            document.getElementById('question-source-badge').innerText = q.page;
            document.getElementById('jump-input').value = currentIndex + 1;

            // Progress Bar
            const progress = ((currentIndex + 1) / totalQuestions) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Text
            document.getElementById('q-text-hi').innerText = `${currentIndex + 1}. ${q.hi}`;
            document.getElementById('q-text-en').innerText = q.en;

            // Hint
            const hintBox = document.getElementById('hint-box');
            hintBox.innerText = q.hint;
            hintBox.classList.add('hidden');

            // Explanation
            const expBox = document.getElementById('explanation-box');
            expBox.classList.add('hidden');
            expBox.innerHTML = '';

            // Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 font-medium text-sm sm:text-base transition-all flex items-center gap-3 group`;
                
                const isSelected = userAnswers[currentIndex] === idx;
                const isAnswered = userAnswers[currentIndex] !== null;

                let badgeClass = "bg-slate-100 text-slate-600 group-hover:bg-brand-500 group-hover:text-white";
                
                if (isAnswered) {
                    if (idx === q.correct) {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-emerald-500 bg-emerald-50 font-medium text-sm sm:text-base flex items-center gap-3";
                        badgeClass = "bg-emerald-600 text-white";
                    } else if (isSelected && idx !== q.correct) {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-rose-500 bg-rose-50 font-medium text-sm sm:text-base flex items-center gap-3";
                        badgeClass = "bg-rose-600 text-white";
                    } else {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 bg-slate-50 opacity-60 font-medium text-sm sm:text-base flex items-center gap-3";
                    }
                }

                btn.innerHTML = `
                    <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 transition-colors ${badgeClass}">${letters[idx]}</span>
                    <span>${opt}</span>
                `;

                if (!isAnswered) {
                    btn.onclick = () => selectOption(idx);
                } else {
                    btn.disabled = true;
                }

                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation
            if (userAnswers[currentIndex] !== null) {
                showExplanation(q);
            }

            // Buttons state
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').innerText = currentIndex === totalQuestions - 1 ? "Finish / Summary" : "Next →";
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentIndex] !== null) return; // already answered

            userAnswers[currentIndex] = selectedIndex;
            const q = processedQuestions[currentIndex];

            if (selectedIndex === q.correct) {
                score++;
                document.getElementById('score').innerText = score;
            }

            loadQuestion();
        }

        function showExplanation(q) {
            const expBox = document.getElementById('explanation-box');
            const isCorrect = userAnswers[currentIndex] === q.correct;

            expBox.className = `mb-6 p-4 rounded-xl border text-sm ${isCorrect ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'}`;
            expBox.innerHTML = `
                <div class="font-bold mb-1 flex items-center gap-1.5">
                    <span>${isCorrect ? '✅ Correct Answer!' : '❌ Incorrect Answer.'}</span>
                </div>
                <p class="text-xs sm:text-sm leading-relaxed"><strong class="font-semibold">Explanation / Rationale:</strong> ${q.explanation}</p>
            `;
            expBox.classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentIndex < totalQuestions - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            let qNum = parseInt(val);
            if (qNum >= 1 && qNum <= totalQuestions) {
                currentIndex = qNum - 1;
                loadQuestion();
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function showSummary() {
            const card = document.getElementById('quiz-card');
            const percentage = Math.round((score / totalQuestions) * 100);
            
            card.innerHTML = `
                <div class="text-center py-8 space-y-4">
                    <div class="w-20 h-20 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold shadow-inner">
                        ${percentage}%
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900">Quiz Completed!</h2>
                    <p class="text-slate-600 text-sm max-w-md mx-auto">
                        You have successfully completed the 80-question Haryana GK Bilingual Master Quiz based on Page 1 & Page 2 material.
                    </p>
                    <div class="text-lg font-semibold text-slate-800 bg-slate-50 py-3 px-6 rounded-xl inline-block border border-slate-200">
                        Final Score: <span class="text-brand-600 font-bold">${score}</span> / ${totalQuestions}
                    </div>
                    <div class="pt-4 flex justify-center gap-4">
                        <button onclick="restartQuiz()" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm transition-colors shadow-sm">
                            Restart Quiz 🔄
                        </button>
                    </div>
                </div>
            `;
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            userAnswers = new Array(processedQuestions.length).fill(null);
            document.getElementById('score').innerText = 0;
            // Re-render card skeleton if needed or reload page structure
            window.location.reload();
        }

        // Initialize first question on load
        window.onload = loadQuestion;
    </script>
