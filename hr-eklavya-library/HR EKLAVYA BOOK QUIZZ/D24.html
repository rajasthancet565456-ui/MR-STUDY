        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredCurrent = false;

        const questionTitle = document.getElementById('question-title');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const scoreDisplay = document.getElementById('score-display');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const questionTag = document.getElementById('question-tag');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentIndex];
            questionTag.textContent = q.section;
            questionTitle.textContent = `Q${currentIndex + 1}. ${q.questionEn}`;
            
            hintBox.textContent = q.hint;
            hintBox.classList.add('hidden');
            explanationBox.classList.add('hidden');
            explanationText.textContent = q.explanationEn;

            optionsContainer.innerHTML = '';
            answeredCurrent = userAnswers[currentIndex] !== null;

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border text-sm sm:text-base font-medium transition flex items-center justify-between ${
                    userAnswers[currentIndex] === null 
                        ? 'border-slate-200 bg-white hover:bg-indigo-50/50 hover:border-indigo-300 text-slate-700 shadow-xs' 
                        : idx === q.correct 
                            ? 'border-emerald-300 bg-emerald-50 text-emerald-900 font-semibold' 
                            : idx === userAnswers[currentIndex] 
                                ? 'border-rose-300 bg-rose-50 text-rose-900 font-semibold' 
                                : 'border-slate-200 bg-white text-slate-400 opacity-60'
                }`;
                btn.innerHTML = `<span>${opt}</span>`;
                
                if (userAnswers[currentIndex] === null) {
                    btn.onclick = () => selectOption(idx);
                } else {
                    btn.disabled = true;
                }
                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentIndex] !== null) {
                explanationBox.classList.remove('hidden');
            }

            // Update UI Counters
            progressText.textContent = `Q ${currentIndex + 1} of ${quizData.length}`;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            scoreDisplay.textContent = `Score: ${score} / ${quizData.length}`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? 'Finish Quiz 🎉' : 'Next →';
        }

        function selectOption(selectedIdx) {
            if (userAnswers[currentIndex] !== null) return;
            
            const q = quizData[currentIndex];
            userAnswers[currentIndex] = selectedIdx;
            
            if (selectedIdx === q.correct) {
                score++;
            }
            
            loadQuestion();
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                jumpInput.value = '';
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Initial Load
        loadQuestion();
    </script>
