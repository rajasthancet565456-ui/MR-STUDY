        // DOM Elements
        const qCatEl = document.getElementById('question-category');

        const qTextHiEl = document.getElementById('q-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const scoreDisplay = document.getElementById('score-display');
        const currentQNum = document.getElementById('current-q-num');
        const progressBar = document.getElementById('progress-bar');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationEn = document.getElementById('explanation-en');
        const explanationHi = document.getElementById('explanation-hi');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = questions[currentIndex];
            qCatEl.textContent = q.cat;
            qTextEnEl.textContent = q.en;
            qTextHiEl.textContent = q.hi;
            currentQNum.textContent = currentIndex + 1;
            progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

            // Hint setup
            hintText.textContent = q.hint;
            hintBox.classList.add('hidden');

            // Explanation setup
            explanationEn.textContent = q.expEn;
            explanationHi.textContent = q.expHi;

            if (userAnswers[currentIndex] !== null) {
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            // Render Options
            optionsContainer.innerHTML = '';
            q.optionsEn.forEach((optEn, idx) => {
                const optHi = q.optionsHi[idx];
                const button = document.createElement('button');
                
                let btnClass = "w-full text-left p-4 rounded-xl border transition-all flex justify-between items-center font-medium ";
                
                const isAnswered = userAnswers[currentIndex] !== null;
                const selectedOpt = userAnswers[currentIndex];

                if (!isAnswered) {
                    btnClass += "bg-white border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 text-slate-700";
                } else {
                    if (idx === q.correct) {
                        btnClass += "bg-emerald-50 border-emerald-500 text-emerald-900 font-semibold";
                    } else if (selectedOpt === idx) {
                        btnClass += "bg-rose-50 border-rose-500 text-rose-900";
                    } else {
                        btnClass += "bg-white border-slate-200 text-slate-400 opacity-60";
                    }
                }

                button.className = btnClass;
                button.innerHTML = `
                    <div>
                        <span class="font-bold mr-2 text-indigo-600">${String.fromCharCode(65 + idx)}.</span> 
                        <span>${optEn}</span>
                        <span class="block text-xs text-indigo-900 mt-0.5 font-normal">${optHi}</span>
                    </div>
                `;

                if (!isAnswered) {
                    button.onclick = () => selectOption(idx);
                } else {
                    button.disabled = true;
                }

                optionsContainer.appendChild(button);
            });

            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === questions.length - 1 ? "Finish Quiz" : "Next →";
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentIndex] !== null) return;

            userAnswers[currentIndex] = selectedIndex;
            const q = questions[currentIndex];

            if (selectedIndex === q.correct) {
                score++;
                scoreDisplay.textContent = score;
            }

            explanationBox.classList.remove('hidden');
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} / ${questions.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= questions.length) {
                currentIndex = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}`);
            }
        }

        // Initialize Quiz
        window.onload = loadQuestion;
    </script>
