        </div>
    </header>

            </div>

            <!-- Question Box -->
            <div class="mb-6">
                <h2 id="question-text" class="text-lg sm:text-xl font-bold text-slate-900 leading-snug mb-2">
                    <!-- Loaded dynamically -->
                </h2>
                <p id="question-text-hi" class="text-base sm:text-lg font-medium text-indigo-900 leading-snug">
                    <!-- Loaded dynamically in Hindi -->
                </p>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected options -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1 focus:outline-none">

                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border border-amber-200 rounded-lg text-sm text-amber-800">
                    <!-- Hint text -->
                </div>
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden mb-6 p-4 rounded-xl border text-sm">
                <!-- Rationale loaded dynamically -->
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-slate-100">
                <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-start">
                    <button onclick="prevQuestion()" id="prev-btn" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-300 transition disabled:opacity-50 disabled:cursor-not-allowed">
                        Previous
                    </button>
                    <button onclick="nextQuestion()" id="next-btn" class="px-5 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition">
                        Next
                    </button>
                </div>

                <!-- Jump to Question -->
                <div class="flex items-center gap-2 text-sm text-slate-600 w-full sm:w-auto justify-end">
                    <span>Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="80" class="w-16 px-2 py-1 border border-slate-300 rounded-md text-center focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="1-80">
                    <button onclick="jumpToQuestion()" class="px-3 py-1 bg-slate-700 text-white rounded-md hover:bg-slate-800 transition">Go</button>
                </div>
            </div>

        </div>
    </main>

        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        // DOM elements
        const qSourceTag = document.getElementById('question-source-tag');
        const currentQNum = document.getElementById('current-q-num');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const questionTextHi = document.getElementById('question-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const scoreDisplay = document.getElementById('score-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentIndex];
            qSourceTag.textContent = q.page;
            currentQNum.textContent = currentIndex + 1;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            
            questionText.textContent = `${currentIndex + 1}. ${q.qEn}`;
            questionTextHi.textContent = q.qHi;

            // Hide boxes initially per question change or restore state if answered
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;

            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition font-medium text-sm sm:text-base flex items-center justify-between `;
                
                const isSelected = userAnswers[currentIndex] === idx;
                const isAnswered = userAnswers[currentIndex] !== null;

                if (isAnswered) {
                    if (idx === q.correct) {
                        btn.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
                    } else if (isSelected) {
                        btn.classList.add('bg-rose-50', 'border-rose-300', 'text-rose-900');
                    } else {
                        btn.classList.add('bg-slate-50', 'border-slate-200', 'text-slate-600', 'opacity-70');
                    }
                    btn.disabled = true;
                } else {
                    btn.classList.add('bg-white', 'border-slate-200', 'hover:border-indigo-400', 'hover:bg-indigo-50/30', 'text-slate-700');
                    btn.onclick = () => selectOption(idx);
                }

                btn.innerHTML = `<span>${opt}</span>`;
                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentIndex] !== null) {
                explanationBox.innerHTML = `<strong>Explanation / Rationale:</strong><br>${q.explanation}`;
                explanationBox.className = userAnswers[currentIndex] === q.correct ? 
                    "mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-800 text-sm block" :
                    "mb-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-800 text-sm block";
            } else {
                explanationBox.classList.add('hidden');
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? "Finish" : "Next";
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentIndex] !== null) return;

            userAnswers[currentIndex] = selectedIndex;
            const q = quizData[currentIndex];

            if (selectedIndex === q.correct) {
                score++;
                scoreDisplay.textContent = score;
            }

            loadQuestion();
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Initialize quiz
        loadQuestion();
    </script>
