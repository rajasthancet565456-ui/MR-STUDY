<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Haryana GK Master Quiz (80 Qs)</h1>
            <div class="mt-2 sm:mt-0 flex items-center space-x-4">
                <span id="score-display" class="bg-indigo-800 px-3 py-1 rounded-full text-sm font-semibold">Score: 0 / 80</span>
                <span id="progress-text" class="text-sm">Q 1 of 80</span>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="max-w-4xl mx-auto w-full bg-indigo-900 h-2 rounded-full mt-3 overflow-hidden">
            <div id="progress-bar" class="bg-amber-400 h-full transition-all duration-300" style="width: 1.25%;"></div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl mx-auto w-full p-4 sm:p-6 my-auto">
        <div id="quiz-card" class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100 relative">
            
            <!-- Question Source Tag & Number -->
            <div class="flex justify-between items-center mb-4 text-xs font-semibold uppercase tracking-wider text-indigo-600">
                <span id="q-source-tag">Page 1 Source</span>
                <span id="q-number-tag">Question 1</span>
            </div>

            <!-- Question Statement (Bilingual) -->
            <h2 id="question-text" class="text-lg sm:text-xl font-bold text-slate-900 mb-6 leading-relaxed">
                Loading question...
            </h2>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected options -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button onclick="toggleHint()" id="hint-btn" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1 focus:outline-none">
                    💡 Show Hint
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border-l-4 border-amber-400 text-amber-900 text-sm rounded-r-lg">
                    <!-- Hint text -->
                </div>
            </div>

            <!-- Explanation Box (Revealed on Answer Selection) -->
            <div id="explanation-box" class="hidden mb-6 p-4 rounded-xl border text-sm">
                <!-- Explanation text -->
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-wrap justify-between items-center gap-4 pt-4 border-t border-slate-100">
                <button onclick="prevQuestion()" id="prev-btn" class="px-4 py-2 bg-slate-200 text-slate-700 font-medium rounded-lg hover:bg-slate-300 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    ← Previous
                </button>

                <!-- Jump to Question Input -->
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-500 font-medium">Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="80" class="w-16 px-2 py-1 text-center border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="1-80">
                    <button onclick="jumpToQuestion()" class="px-3 py-1 bg-indigo-600 text-white text-xs font-medium rounded-lg hover:bg-indigo-700 transition">Go</button>
                </div>

                <button onclick="nextQuestion()" id="next-btn" class="px-5 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition">
                    Next →
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-100 text-slate-500 text-center py-4 text-xs border-t border-slate-200">
        Haryana General Knowledge Interactive Exam Portal &bull; Exam Level Standard (HSSC/SSC/State PCS)
    </footer>

        let currentIndex = 0;
        let score = 0;
        let userSelections = new Array(questions.length).fill(null);

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const scoreDisplay = document.getElementById("score-display");
        const progressText = document.getElementById("progress-text");
        const progressBar = document.getElementById("progress-bar");
        const qSourceTag = document.getElementById("q-source-tag");
        const qNumberTag = document.getElementById("q-number-tag");
        const hintBox = document.getElementById("hint-box");
        const explanationBox = document.getElementById("explanation-box");
        const jumpInput = document.getElementById("jump-input");

        function loadQuestion() {
            const q = questions[currentIndex];
            qSourceTag.innerText = q.source + " (Exam Level)";
            qNumberTag.innerText = `Question ${currentIndex + 1} of 80`;
            questionText.innerText = q.q;

            // Reset UI states
            hintBox.classList.add("hidden");
            hintBox.innerText = q.hint;
            explanationBox.classList.add("hidden");

            // Render Options
            optionsContainer.innerHTML = "";
            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3 rounded-xl border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 transition font-medium text-slate-700 flex justify-between items-center";
                btn.innerHTML = `<span>${opt}</span> <span class="text-xs text-slate-400 font-normal">Option ${String.fromCharCode(65 + idx)}</span>`;
                
                // Check if user already answered this question
                if (userSelections[currentIndex] !== null) {
                    btn.disabled = true;
                    if (idx === q.answer) {
                        btn.classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-900");
                    } else if (userSelections[currentIndex] === idx) {
                        btn.classList.add("bg-rose-50", "border-rose-500", "text-rose-900");
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }
                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation
            if (userSelections[currentIndex] !== null) {
                showExplanationBox(userSelections[currentIndex] === q.answer, q.explanation);
            }

            // Update Progress
            progressText.innerText = `Q ${currentIndex + 1} of 80`;
            progressBar.style.width = `${((currentIndex + 1) / 80) * 100}%`;
            scoreDisplay.innerText = `Score: ${score} / 80`;

            // Button states
            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").innerText = currentIndex === 79 ? "Finish Quiz" : "Next →";
        }

        function selectOption(selectedIdx) {
            const q = questions[currentIndex];
            userSelections[currentIndex] = selectedIdx;
            
            const isCorrect = selectedIdx === q.answer;
            if (isCorrect) {
                score++;
            }

            scoreDisplay.innerText = `Score: ${score} / 80`;
            showExplanationBox(isCorrect, q.explanation);
            loadQuestion(); // Reload to apply disabled state and colors
        }

        function showExplanationBox(isCorrect, explanationText) {
            explanationBox.classList.remove("hidden");
            if (isCorrect) {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900 text-sm";
                explanationBox.innerHTML = `<strong>✅ Correct!</strong><br>${explanationText}`;
            } else {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900 text-sm";
                explanationBox.innerHTML = `<strong>❌ Incorrect.</strong><br>${explanationText}`;
            }
        }

        function toggleHint() {
            hintBox.classList.toggle("hidden");
        }

        function nextQuestion() {
            if (currentIndex < 79) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of 80.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= 80) {
                currentIndex = val - 1;
                loadQuestion();
                jumpInput.value = "";
            } else {
                alert("Please enter a valid question number between 1 and 80.");
            }
        }

        // Initialize first load
        loadQuestion();
    </script>
