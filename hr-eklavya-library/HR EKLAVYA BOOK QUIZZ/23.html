        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let shuffledOptionsList = [];
        let timerSeconds = 0;
        let timerInterval = null;

        // Start Timer
        function startTimer() {
            timerInterval = setInterval(() => {
                timerSeconds++;
                let mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                let secs = (timerSeconds % 60).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `Time: ${mins}:${secs}`;
            }, 1000);
        }

        // Initialize shuffled options for each question once to maintain consistency on navigation
        function initQuiz() {
            questions.forEach((q, qIdx) => {
                let optionsWithIndices = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                // Shuffle options
                for (let i = optionsWithIndices.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [optionsWithIndices[i], optionsWithIndices[j]] = [optionsWithIndices[j], optionsWithIndices[i]];
                }
                shuffledOptionsList.push(optionsWithIndices);
            });
            startTimer();
            loadQuestion(0);
        }

        function loadQuestion(index) {
            currentIndex = index;
            const q = questions[index];
            const shuffledOpts = shuffledOptionsList[index];

            // Update UI headers
            document.getElementById('question-counter').innerText = `Question ${index + 1} of ${questions.length}`;
            document.getElementById('source-badge').innerText = `Page ${q.page} Source`;
            document.getElementById('question-text').innerText = q.question;

            // Update progress bar
            let progress = ((index + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Render options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            let userAns = userAnswers[index];

            shuffledOpts.forEach((optObj, idx) => {
                let btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 font-medium text-slate-700 transition flex items-center justify-between";
                
                let optionLetter = String.fromCharCode(65 + idx); // A, B, C, D
                btn.innerHTML = `<span><strong class="mr-2 text-indigo-600">${optionLetter}.</strong> ${optObj.text}</span>`;

                if (userAns !== null) {
                    // Already answered
                    btn.disabled = true;
                    if (optObj.originalIndex === q.answer) {
                        btn.classList.remove('bg-white', 'hover:bg-slate-50');
                        btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                    } else if (userAns === optObj.originalIndex) {
                        btn.classList.remove('bg-white', 'hover:bg-slate-50');
                        btn.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                    }
                } else {
                    btn.onclick = () => selectOption(optObj.originalIndex, index);
                }

                optionsContainer.appendChild(btn);
            });

            // Hint box handling
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-box').innerText = q.hint;

            // Explanation box handling
            const expContainer = document.getElementById('explanation-container');
            if (userAns !== null) {
                expContainer.classList.remove('hidden');
                document.getElementById('explanation-text').innerText = q.explanation;
            } else {
                expContainer.classList.add('hidden');
            }

            // Navigation buttons state
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').innerText = index === questions.length - 1 ? 'Finish 🏁' : 'Next →';
            document.getElementById('jump-input').value = index + 1;
        }

        function selectOption(selectedOriginalIndex, qIdx) {
            userAnswers[qIdx] = selectedOriginalIndex;
            const q = questions[qIdx];

            if (selectedOriginalIndex === q.answer) {
                score++;
            }

            document.getElementById('score-display').innerText = `Score: ${score} / ${questions.length}`;
            loadQuestion(qIdx);
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${questions.length}.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                loadQuestion(currentIndex - 1);
            }
        }

        function jumpToQuestion() {
            const inputVal = parseInt(document.getElementById('jump-input').value);
            if (inputVal >= 1 && inputVal <= questions.length) {
                loadQuestion(inputVal - 1);
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}.`);
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        // Initialize quiz on load
        window.onload = initQuiz;
    </script>
