        // Shuffle options for each question securely while keeping track of the correct answer
        function initializeQuiz() {
            quizData.forEach((q, idx) => {
                // Shuffle options
                let optionsWithIndex = q.optionsEn.map((optEn, i) => ({
                    en: optEn,
                    hi: q.optionsHi[i],
                    isCorrect: (i === q.correct)
                }));

                // Shuffle array
                for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
                }

                q.shuffledOptions = optionsWithIndex;
                q.newCorrectIdx = optionsWithIndex.findIndex(o => o.isCorrect);
            });
            loadQuestion();
        }

                qEnEl.style.display = 'none';
                qHiEl.style.display = 'block';
                qHiEl.innerText = `${currentIdx + 1}. ${q.qHi}`;
            } else if (currentLang === 'en') {
                qEnEl.style.display = 'block';
                qHiEl.style.display = 'none';
                qEnEl.innerText = `${currentIdx + 1}. ${q.qEn}`;
            } else {
                qEnEl.style.display = 'block';
                qHiEl.style.display = 'block';
                qEnEl.innerText = `${currentIdx + 1}. ${q.qEn}`;
                qHiEl.innerText = q.qHi;
            }

            // Render Hint
            document.getElementById('hintBox').classList.add('hidden');
            document.getElementById('hintBtnText').innerText = currentLang === 'hi' ? 'संकेत देखें (Show Hint)' : 'Show Hint / संकेत देखें';
            document.getElementById('hintTextEn').innerText = `💡 Hint: ${q.hintEn}`;

            // Render Options

            optionsContainer.innerHTML = '';

                btn.className = `w-full text-left p-4 rounded-xl border transition flex items-center justify-between text-sm sm:text-base font-medium `;
                
                let textDisplay = '';
                if (currentLang === 'hi') textDisplay = opt.hi;
                else if (currentLang === 'en') textDisplay = opt.en;
                else textDisplay = `${opt.en} / <span class="text-emerald-300">${opt.hi}</span>`;

                btn.innerHTML = `<span><strong class="mr-2 text-slate-400">${String.fromCharCode(65 + idx)}.</strong> ${textDisplay}</span>`;

                if (userAns !== undefined) {
                    // Already answered
                    btn.disabled = true;
                    if (idx === q.newCorrectIdx) {
                        btn.className += `bg-emerald-950/60 border-emerald-500 text-white`;
                        btn.innerHTML += `<span class="text-emerald-400 font-bold">✓ Correct</span>`;
                    } else if (idx === userAns.selectedIndex && userAns.selectedIndex !== q.newCorrectIdx) {
                        btn.className += `bg-rose-950/60 border-rose-500 text-white`;
                        btn.innerHTML += `<span class="text-rose-400 font-bold">✗ Your Answer</span>`;
                    } else {
                        btn.className += `bg-slate-900/50 border-slate-700 text-slate-400 opacity-60`;
                    }
                } else {
                    btn.className += `bg-slate-900/80 hover:bg-slate-700/80 border-slate-700 text-slate-200`;
                    btn.onclick = () => selectOption(idx);
                }

                optionsContainer.appendChild(btn);
            });

            // Render Explanation if answered
            const expBox = document.getElementById('explanationBox');
            if (userAns !== undefined) {
                expBox.classList.remove('hidden');
                const isCorrect = userAns.selectedIndex === q.newCorrectIdx;
                expBox.className = `mb-6 p-4 rounded-xl border text-sm transition-all ` + 
                    (isCorrect ? 'bg-emerald-950/30 border-emerald-600/50 text-emerald-100' : 'bg-rose-950/30 border-rose-600/50 text-rose-100');
                
                document.getElementById('explanationTitle').innerHTML = isCorrect ? 
                    `<span class="text-emerald-400">✅ Correct Answer! / सही उत्तर!</span>` : 
                    `<span class="text-rose-400">❌ Incorrect! / गलत उत्तर!</span>`;
                
                document.getElementById('explanationTextEn').innerText = `Explanation: ${q.expEn}`;
                document.getElementById('explanationTextHi').innerText = `स्पष्टीकरण: ${q.expHi}`;
            } else {
                expBox.classList.add('hidden');
            }

            // Navigation Buttons State
            document.getElementById('prevBtn').disabled = currentIdx === 0;
            document.getElementById('nextBtn').disabled = currentIdx === quizData.length - 1;
        }

        function selectOption(selectedIndex) {
            if (answeredState[currentIdx] !== undefined) return; // Prevent multiple clicks

            const q = quizData[currentIdx];
            const isCorrect = selectedIndex === q.newCorrectIdx;

            answeredState[currentIdx] = { selectedIndex, isCorrect };
            if (isCorrect) {
                score++;
                document.getElementById('scoreDisplay').innerText = score;
            }

            loadQuestion();
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            let qNum = parseInt(val);
            if (!isNaN(qNum) && qNum >= 1 && qNum <= 80) {
                currentIdx = qNum - 1;
                loadQuestion();
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hintBox');
            hintBox.classList.toggle('hidden');
        }

        function toggleLanguage() {
            if (currentLang === 'both') currentLang = 'en';
            else if (currentLang === 'en') currentLang = 'hi';
            else currentLang = 'both';
            loadQuestion();
        }

        // Initialize on page load
        window.onload = initializeQuiz;
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
