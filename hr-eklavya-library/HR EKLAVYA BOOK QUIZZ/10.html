        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let hintVisible = false;

        const questionCategoryEl = document.getElementById("question-category");
        const questionNumberTagEl = document.getElementById("question-number-tag");
        const questionEnEl = document.getElementById("question-en");
        const questionHiEl = document.getElementById("question-hi");
        const optionsContainerEl = document.getElementById("options-container");
        const hintBtnTextEl = document.getElementById("hint-btn-text");
        const hintBoxEl = document.getElementById("hint-box");
        const hintTextEl = document.getElementById("hint-text");
        const explanationBoxEl = document.getElementById("explanation-box");
        const explanationTitleEl = document.getElementById("explanation-title");
        const explanationTextEl = document.getElementById("explanation-text");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const scoreDisplay = document.getElementById("score-display");
        const progressText = document.getElementById("progress-text");
        const progressBar = document.getElementById("progress-bar");
        const quizCard = document.getElementById("quiz-card");
        const completionScreen = document.getElementById("completion-screen");
        const finalScoreText = document.getElementById("final-score-text");
        const jumpInput = document.getElementById("jump-input");

        function loadQuestion() {
            const q = questions[currentIndex];
            questionCategoryEl.textContent = q.category;
            questionNumberTagEl.textContent = `Q. ${currentIndex + 1} of 80`;
            questionEnEl.textContent = `${currentIndex + 1}. ${q.en}`;
            questionHiEl.textContent = q.hi;

            optionsContainerEl.innerHTML = "";
            hintVisible = false;
            hintBoxEl.classList.add("hidden");
            hintBtnTextEl.textContent = "Show Hint";

            // Check if already answered
            const selectedOpt = userAnswers[currentIndex];
            const isAnswered = selectedOpt !== null;

            if (isAnswered) {
                explanationBoxEl.classList.remove("hidden");
                if (selectedOpt === q.correct) {
                    explanationBoxEl.className = "mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900 text-sm transition-all";
                    explanationTitleEl.innerHTML = "✅ Correct Answer!";
                } else {
                    explanationBoxEl.className = "mb-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900 text-sm transition-all";
                    explanationTitleEl.innerHTML = "❌ Incorrect Answer. Correct option: " + q.options[q.correct];
                }
                explanationTextEl.textContent = q.explanation;
            } else {
                explanationBoxEl.classList.add("hidden");
            }

            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = `w-full text-left p-3.5 rounded-xl border text-sm sm:text-base font-medium transition-all flex items-center justify-between cursor-pointer `;
                
                if (isAnswered) {
                    btn.disabled = true;
                    if (idx === q.correct) {
                        btn.className += "bg-emerald-100 border-emerald-400 text-emerald-900 font-semibold";
                    } else if (idx === selectedOpt) {
                        btn.className += "bg-rose-100 border-rose-400 text-rose-900";
                    } else {
                        btn.className += "bg-white border-slate-200 text-slate-500 opacity-60";
                    }
                } else {
                    btn.className += "bg-white border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 text-slate-700 shadow-sm";
                    btn.onclick = () => selectOption(idx);
                }

                btn.innerHTML = `<span><strong class="mr-2">${String.fromCharCode(65 + idx)}.</strong> ${opt}</span>`;
                optionsContainerEl.appendChild(btn);
            });

            // Update Header status
            scoreDisplay.textContent = `Score: ${score} / 80`;
            progressText.textContent = `Question ${currentIndex + 1} of 80`;
            progressBar.style.width = `${((currentIndex + 1) / 80) * 100}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === questions.length - 1 ? "Finish Quiz →" : "Next →";
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentIndex] !== null) return; // already answered

            userAnswers[currentIndex] = selectedIndex;
            const q = questions[currentIndex];

            if (selectedIndex === q.correct) {
                score++;
                explanationBoxEl.className = "mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900 text-sm transition-all";
                explanationTitleEl.innerHTML = "✅ Correct Answer!";
            } else {
                explanationBoxEl.className = "mb-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900 text-sm transition-all";
                explanationTitleEl.innerHTML = "❌ Incorrect Answer. Correct option: " + q.options[q.correct];
            }

            explanationTextEl.textContent = q.explanation;
            explanationBoxEl.classList.remove("hidden");

            scoreDisplay.textContent = `Score: ${score} / 80`;

            // Refresh options styling
            const optionButtons = optionsContainerEl.children;
            for (let i = 0; i < optionButtons.length; i++) {
                optionButtons[i].disabled = true;
                if (i === q.correct) {
                    optionButtons[i].className = "w-full text-left p-3.5 rounded-xl border text-sm sm:text-base font-semibold bg-emerald-100 border-emerald-400 text-emerald-900 flex items-center justify-between";
                } else if (i === selectedIndex) {
                    optionButtons[i].className = "w-full text-left p-3.5 rounded-xl border text-sm sm:text-base bg-rose-100 border-rose-400 text-rose-900 flex items-center justify-between";
                } else {
                    optionButtons[i].className = "w-full text-left p-3.5 rounded-xl border text-sm sm:text-base bg-white border-slate-200 text-slate-500 opacity-60 flex items-center justify-between";
                }
            }
        }

        function toggleHint() {
            hintVisible = !hintVisible;
            if (hintVisible) {
                hintTextEl.textContent = questions[currentIndex].hint;
                hintBoxEl.classList.remove("hidden");
                hintBtnTextEl.textContent = "Hide Hint";
            } else {
                hintBoxEl.classList.add("hidden");
                hintBtnTextEl.textContent = "Show Hint";
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showCompletionScreen();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= 80) {
                currentIndex = val - 1;
                jumpInput.value = "";
                loadQuestion();
            } else {
                alert("Please enter a valid question number between 1 and 80.");
            }
        }

        function showCompletionScreen() {
            quizCard.classList.add("hidden");
            completionScreen.classList.remove("hidden");
            finalScoreText.innerHTML = `You scored <strong>${score}</strong> out of <strong>80</strong> (${Math.round((score/80)*100)}%).`;
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            userAnswers = new Array(questions.length).fill(null);
            completionScreen.classList.add("hidden");
            quizCard.classList.remove("hidden");
            loadQuestion();
        }

        // Initial Load
        loadQuestion();
    </script>
