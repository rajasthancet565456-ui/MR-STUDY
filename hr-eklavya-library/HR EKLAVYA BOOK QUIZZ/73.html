        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        // DOM Elements
        const qBadge = document.getElementById('question-badge');
        const qTextEn = document.getElementById('q-text-en');
        const qTextHi = document.getElementById('q-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');
        const scoreDisplay = document.getElementById('score-display');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');

        function loadQuestion(index) {
            const q = quizData[index];
            qBadge.innerText = `Page ${q.page} • Question ${index + 1} of ${quizData.length}`;
            qTextEn.innerText = `${index + 1}. ${q.en}`;
            qTextHi.innerText = `${index + 1}. ${q.hi}`;
            hintText.innerText = q.hint;
            explanationText.innerText = q.explanation;

            // Reset UI states
            hintBox.classList.add('hidden');
            if (userAnswers[index] !== null) {
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            // Populate Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-lg border transition font-medium flex justify-between items-center ${getOptionClass(index, i)}`;
                btn.innerHTML = `<span>${String.fromCharCode(65 + i)}. ${opt}</span>`;
                btn.onclick = () => selectOption(index, i);
                optionsContainer.appendChild(btn);
            });

            // Update Nav buttons & progress
            prevBtn.disabled = index === 0;
            nextBtn.innerText = index === quizData.length - 1 ? "Finish" : "Next";
            progressText.innerText = `${index + 1} / ${quizData.length}`;
            progressBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
            scoreDisplay.innerText = `${score} / ${quizData.length}`;
            jumpInput.value = index + 1;
        }

        function getOptionClass(qIndex, optIndex) {
            const selected = userAnswers[qIndex];
            const correct = quizData[qIndex].answer;

            if (selected === null) {
                return 'bg-white border-slate-200 hover:bg-slate-50 text-slate-700';
            }
            if (optIndex === correct) {
                return 'bg-blue-50 border-blue-500 text-blue-800 font-semibold';
            }
            if (optIndex === selected && selected !== correct) {
                return 'bg-rose-50 border-rose-500 text-rose-800';
            }
            return 'bg-white border-slate-200 text-slate-400 opacity-60';
        }

        function selectOption(qIndex, optIndex) {
            if (userAnswers[qIndex] !== null) return; // already answered

            userAnswers[qIndex] = optIndex;
            const correct = quizData[qIndex].answer;

            if (optIndex === correct) {
                score++;
            }

            explanationBox.classList.remove('hidden');
            loadQuestion(qIndex);
        }

        // Event Listeners
        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        };

        nextBtn.onclick = () => {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`Quiz Completed! Your final score is ${score} / ${quizData.length}`);
            }
        };

        hintBtn.onclick = () => {
            hintBox.classList.toggle('hidden');
        };

        jumpBtn.onclick = () => {
            const val = parseInt(jumpInput.value) - 1;
            if (val >= 0 && val < quizData.length) {
                currentIndex = val;
                loadQuestion(currentIndex);
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        };

        jumpInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
                jumpBtn.click();
            }
        };

        // Initialize First Question
        loadQuestion(currentIndex);
    </script>
