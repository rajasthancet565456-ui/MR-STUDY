        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        // DOM Elements
        const questionTextEl = document.getElementById('question-text');
        const questionTextHiEl = document.getElementById('question-text-hi');
        const optionsContainerEl = document.getElementById('options-container');
        const progressTextEl = document.getElementById('progress-text');
        const progressBarEl = document.getElementById('progress-bar');
        const sourcePageIndicatorEl = document.getElementById('source-page-indicator');
        const scoreDisplayEl = document.getElementById('score-display');
        const prevBtnEl = document.getElementById('prev-btn');
        const nextBtnEl = document.getElementById('next-btn');
        const hintBoxEl = document.getElementById('hint-box');
        const hintBtnTextEl = document.getElementById('hint-btn-text');
        const explanationBoxEl = document.getElementById('explanation-box');
        const jumpInputEl = document.getElementById('jump-input');

        function loadQuestion() {
            const currentQ = quizData[currentIndex];
            
            // Update Progress & Headers
            progressTextEl.innerText = `Question ${currentIndex + 1} of ${quizData.length}`;
            progressBarEl.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            sourcePageIndicatorEl.innerText = `Page ${currentQ.page} (Q ${currentQ.page === 1 ? '1-40' : '41-80'})`;

            // Set Questions (English & Hindi)
            questionTextEl.innerText = `${currentIndex + 1}. ${currentQ.qEn}`;
            questionTextHiEl.innerText = currentQ.qHi;

            // Reset Hint & Explanation
            hintBoxEl.classList.add('hidden');
            hintBoxEl.innerText = currentQ.hint;
            hintBtnTextEl.innerText = "Show Hint";
            explanationBoxEl.classList.add('hidden');
            explanationBoxEl.innerHTML = "";

            // Render Options
            optionsContainerEl.innerHTML = '';
            
            // Randomize options order securely while tracking correct answer
            // To ensure correct answer mapping doesn't break, we pair option text with its original index
            let optionPairs = currentQ.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            
            // Shuffle option pairs deterministically/pseudorandomly per question index to vary correct position
            optionPairs.sort((a, b) => {
                // simple hash based on currentIndex and indices to shuffle consistently yet variably across A,B,C,D
                return (Math.sin(currentIndex + a.originalIndex) - Math.sin(currentIndex + b.originalIndex));
            });

            optionPairs.forEach((pair, displayIdx) => {
                const btn = document.createElement('button');
                const isSelected = userAnswers[currentIndex] !== null;
                const isThisCorrect = pair.originalIndex === currentQ.correct;
                const wasChosen = userAnswers[currentIndex] === pair.originalIndex;

                let btnClass = "w-full text-left p-3.5 rounded-xl border text-sm sm:text-base font-medium transition flex items-center justify-between ";

                if (!isSelected) {
                    btnClass += "bg-slate-700/50 border-slate-600 hover:bg-slate-700 hover:border-indigo-500 text-slate-200 cursor-pointer";
                    btn.onclick = () => selectOption(pair.originalIndex, currentQ.correct);
                } else {
                    // Already answered state
                    if (isThisCorrect) {
                        btnClass += "bg-emerald-950/60 border-emerald-500 text-emerald-200 font-semibold";
                    } else if (wasChosen && !isThisCorrect) {
                        btnClass += "bg-rose-950/60 border-rose-500 text-rose-200";
                    } else {
                        btnClass += "bg-slate-800/40 border-slate-700 text-slate-400 opacity-60";
                    }
                    btn.disabled = true;
                }

                btn.className = btnClass;
                
                const letterBadge = String.fromCharCode(65 + displayIdx); // A, B, C, D
                btn.innerHTML = `
                    <span class="flex items-center gap-3">
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-lg bg-slate-800 border border-slate-600 text-xs text-slate-300 font-bold">${letterBadge}</span>
                        <span>${pair.text}</span>
                    </span>
                `;
                optionsContainerEl.appendChild(btn);
            });

            // If already answered, show explanation automatically
            if (userAnswers[currentIndex] !== null) {
                showExplanation(currentQ, userAnswers[currentIndex] === currentQ.correct);
            }

            // Button states
            prevBtnEl.disabled = currentIndex === 0;
            nextBtnEl.innerText = currentIndex === quizData.length - 1 ? "Finish / Review" : "Next →";
        }

        function selectOption(selectedIndex, correctIndex) {
            userAnswers[currentIndex] = selectedIndex;
            const isCorrect = selectedIndex === correctIndex;
            
            if (isCorrect) {
                score++;
            }
            scoreDisplayEl.innerText = `Score: ${score} / ${quizData.length}`;

            // Reload to display color highlights and explanation
            loadQuestion();
        }

        function showExplanation(currentQ, isCorrect) {
            explanationBoxEl.classList.remove('hidden');
            if (isCorrect) {
                explanationBoxEl.className = "mt-4 p-4 rounded-lg border bg-emerald-950/40 border-emerald-800/60 text-emerald-200 text-sm";
                explanationBoxEl.innerHTML = `<strong>✅ Correct!</strong><br><span class="mt-1 block">${currentQ.explanation}</span>`;
            } else {
                explanationBoxEl.className = "mt-4 p-4 rounded-lg border bg-rose-950/40 border-rose-800/60 text-rose-200 text-sm";
                explanationBoxEl.innerHTML = `<strong>❌ Incorrect.</strong><br><span class="mt-1 block">${currentQ.explanation}</span>`;
            }
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInputEl.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion();
                jumpInputEl.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function toggleHint() {
            if (hintBoxEl.classList.contains('hidden')) {
                hintBoxEl.classList.remove('hidden');
                hintBtnTextEl.innerText = "Hide Hint";
            } else {
                hintBoxEl.classList.add('hidden');
                hintBtnTextEl.innerText = "Show Hint";
            }
        }

        function resetQuiz() {
            if (confirm("Are you sure you want to reset the quiz? All progress will be lost.")) {
                currentIndex = 0;
                score = 0;
                userAnswers = new Array(quizData.length).fill(null);
                scoreDisplayEl.innerText = `Score: 0 / ${quizData.length}`;
                loadQuestion();
            }
        }

        // Initialize Quiz on Load
        window.onload = loadQuestion;
    </script>
