<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center">

            <div id="score-display" class="mt-2 sm:mt-0 bg-indigo-800 px-3 py-1 rounded-full text-sm font-semibold">
                Score: 0 / 80
            </div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-2xl w-full mx-auto p-4 sm:p-6 my-auto">
        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 rounded-full h-2.5 mb-6">
            <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>

        <div id="quiz-card" class="bg-white rounded-xl shadow-lg p-6 relative border border-slate-100">
            <!-- Question Meta -->
            <div class="flex justify-between items-center text-xs text-slate-500 mb-3 font-semibold uppercase tracking-wider">
                <span id="question-counter">Question 1 of 80</span>
                <span id="source-tag" class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded">Page 1</span>
            </div>

            <!-- Question Text -->
            <h2 id="question-text" class="text-lg sm:text-xl font-bold text-slate-900 mb-4"></h2>

            <!-- Options List -->
            <div id="options-container" class="space-y-3 mb-6"></div>

            <!-- Hint Section -->
            <div class="mb-4">
                <button onclick="toggleHint()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium underline focus:outline-none">
                    💡 संकेत देखें / View Hint
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-lg"></div>
            </div>

            <!-- Explanation Section -->
            <div id="explanation-box" class="hidden mb-6 p-4 bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm rounded-lg">
                <h4 class="font-bold mb-1">व्याख्या / Rationale:</h4>
                <p id="explanation-text"></p>
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-wrap justify-between items-center gap-2 pt-4 border-t border-slate-100">
                <button id="prev-btn" onclick="prevQuestion()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-300 transition disabled:opacity-50">
                    ← पिछला / Prev
                </button>
                
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-500">Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="80" class="w-16 px-2 py-1 text-center border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" onchange="jumpToQuestion(this.value)">
                </div>

                <button id="next-btn" onclick="nextQuestion()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition">
                    अगला / Next →
                </button>
            </div>
        </div>

        <!-- Completion Modal / Screen -->
        <div id="completion-screen" class="hidden bg-white rounded-xl shadow-lg p-8 text-center">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">🎉 Quiz Completed!</h2>
            <p id="final-score-text" class="text-lg text-slate-600 mb-6"></p>
            <button onclick="restartQuiz()" class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition">
                पुनः आरंभ करें / Restart Quiz
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400">
        Interactive Haryana GK Quiz Application &copy; 2026

        let currentIdx = 0;
        let score = 0;
        let answered = new Array(questions.length).fill(false);
        let userAnswers = new Array(questions.length).fill(null);

        const questionCounter = document.getElementById('question-counter');
        const sourceTag = document.getElementById('source-tag');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const quizCard = document.getElementById('quiz-card');
        const completionScreen = document.getElementById('completion-screen');

        function loadQuestion() {
            const q = questions[currentIdx];
            questionCounter.innerText = `Question ${currentIdx + 1} of ${questions.length}`;
            sourceTag.innerText = q.page;
            questionText.innerText = q.question;
            jumpInput.value = currentIdx + 1;

            // Reset hint and explanation
            hintBox.classList.add('hidden');
            hintBox.innerText = q.hint;
            explanationBox.classList.add('hidden');
            explanationText.innerText = q.explanation;

            // Render options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-lg border text-sm sm:text-base font-medium transition flex justify-between items-center ${getOptionStyle(index, q.answer)}`;
                btn.innerText = `${String.fromCharCode(65 + index)}. ${opt}`;
                
                if (answered[currentIdx]) {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => selectOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            // Update navigation buttons
            prevBtn.disabled = currentIdx === 0;
            nextBtn.innerText = currentIdx === questions.length - 1 ? 'समाप्त / Finish →' : 'अगला / Next →';

            // Update Progress Bar
            const progress = ((currentIdx + 1) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;
            scoreDisplay.innerText = `Score: ${score} / ${questions.length}`;
        }

        function getOptionStyle(index, correctIndex) {
            if (!answered[currentIdx]) {
                return 'bg-white border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer';
            }
            if (index === correctIndex) {
                return 'bg-emerald-100 border-emerald-400 text-emerald-900 font-semibold';
            }
            if (index === userAnswers[currentIdx] && index !== correctIndex) {
                return 'bg-rose-100 border-rose-400 text-rose-900';
            }
            return 'bg-white border-slate-200 text-slate-400 opacity-60';
        }

        function selectOption(index) {
            if (answered[currentIdx]) return;
            answered[currentIdx] = true;
            userAnswers[currentIdx] = index;

            if (index === questions[currentIdx].answer) {
                score++;
            }

            explanationBox.classList.remove('hidden');
            loadQuestion();
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showCompletion();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            let num = parseInt(val);
            if (num >= 1 && num <= questions.length) {
                currentIdx = num - 1;
                loadQuestion();
            } else {
                jumpInput.value = currentIdx + 1;
            }
        }

        function showCompletion() {
            quizCard.classList.add('hidden');
            completionScreen.classList.remove('hidden');
            document.getElementById('final-score-text').innerText = `You scored ${score} out of ${questions.length} (${Math.round((score/questions.length)*100)}%)`;
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            answered.fill(false);
            userAnswers.fill(null);
            completionScreen.classList.add('hidden');
            quizCard.classList.remove('hidden');
            loadQuestion();
        }

        // Initialize quiz on load
        loadQuestion();
    </script>
