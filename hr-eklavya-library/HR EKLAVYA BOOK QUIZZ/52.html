                en: "Which district has the highest humidity/moisture level (सर्वाधिक आर्द्रता वाला जिला)?",
                hi: "राज्य का सर्वाधिक आर्द्रता वाला जिला कौन सा है?",
                options: ["पंचकूला", "यमुनानगर", "हिसार", "सिरसा"],

                hint: "Panchkula.",
                explanation: "Panchkula has the highest moisture/humidity level."

            {

                options: ["झज्जर", "रोहतक", "हिसार", "सिरसा"],
                correct: 0,
                hint: "Jhajjar.",
                explanation: "Jhajjar has 16,000 acres of severely waterlogged land."
            },
            {
                page: 132,
                en: "What historic significance is associated with the Tomar dynasty and Anangpur as covered in Page 2 context?",
                hi: "पेज 2 के संदर्भ के अनुसार तोमर वंश और अनंगपुर से क्या ऐतिहासिक महत्व जुड़ा है?",
                options: ["तोमर वंश के राजा अनंगपाल द्वारा 8वीं शताब्दी में अनंगपुर बांध का निर्माण किया गया था", "अनंगपुर में गुप्त साम्राज्य की राजधानी थी", "तोमर राजाओं ने सबसे पहले पानीपत की लड़ाई लड़ी", "अनंगपुर में अशोक का स्तंभ मिला है"],
                correct: 0,
                hint: "Anangpur Dam built by Tomar king Anangpal in 8th century.",
                explanation: "Anangpur Dam was built in the 8th century by Tomar king Anangpal."
            },
            {

                en: "What conclusion highlights the historical transition of Haryana from ancient republics to medieval sultanate?",
                hi: "प्राचीन गणों से लेकर मध्यकालीन सल्तनत तक हरियाणा के ऐतिहासिक संक्रमण को क्या मुख्य बात दर्शाती है?",
                options: ["प्राचीन काल में योधेय/अग्र जैसे गणराज्यों का उदय हुआ, जबकि मध्यकाल में थानेसर, हांसी और दिल्ली सल्तनत के केंद्रों के रूप में यह सत्ता का मुख्य केंद्र बना",
                          "हरियाणा में कभी कोई राजा या गणराज्य नहीं रहा",

                          "मध्यकाल में यहाँ केवल विदेशी व्यापारी रहते थे"],
                correct: 0,
                hint: "Transition from Yaudheyas/Agreyas to Thanesar, Hansi and Delhi Sultanate centers.",
                explanation: "Ancient Haryana saw powerful republics like Yaudheya/Agreya, which later transitioned into major medieval administrative centers like Thanesar, Hansi, and Delhi Sultanate nodes."
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let attempted = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptionsCache = {};

        const qTextEn = document.getElementById('q-text-en');
        const qTextHi = document.getElementById('q-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const scoreVal = document.getElementById('score-val');
        const totalVal = document.getElementById('total-val');
        const attemptedVal = document.getElementById('attempted-val');
        const questionTracker = document.getElementById('question-tracker');
        const sectionTag = document.getElementById('section-tag');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const jumpInput = document.getElementById('jump-input');

        totalVal.textContent = quizData.length;

        function getShuffledOptions(qIndex) {
            if (shuffledOptionsCache[qIndex]) {
                return shuffledOptionsCache[qIndex];
            }
            const q = quizData[qIndex];
            const originalOptions = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            
            let seed = qIndex + 1;
            function pseudoRandom() {
                let x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            }

            for (let i = originalOptions.length - 1; i > 0; i--) {
                const j = Math.floor(pseudoRandom() * (i + 1));
                [originalOptions[i], originalOptions[j]] = [originalOptions[j], originalOptions[i]];
            }

            const newCorrectMapping = originalOptions.findIndex(item => item.originalIndex === q.correct);
            
            shuffledOptionsCache[qIndex] = {
                options: originalOptions,
                correctIndex: newCorrectMapping
            };
            return shuffledOptionsCache[qIndex];
        }

        function loadQuestion() {
            const q = quizData[currentIdx];
            questionTracker.textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
            sectionTag.textContent = `Page ${q.page} Source`;
            sectionTag.className = q.page === 131 
                ? "bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded text-[10px]" 
                : "bg-blue-900 text-blue-300 px-2 py-0.5 rounded text-[10px]";
            
            progressBar.style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;

            qTextEn.textContent = `${currentIdx + 1}. ${q.en}`;
            qTextHi.textContent = q.hi;

            hintText.textContent = q.hint;
            hintBox.classList.add('hidden');
            explanationText.textContent = q.explanation;
            explanationBox.classList.add('hidden');

            optionsContainer.innerHTML = '';
            const shuffleData = getShuffledOptions(currentIdx);
            const selectedOpt = userAnswers[currentIdx];

            shuffleData.options.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border text-sm sm:text-base font-medium transition-all flex items-center justify-between ${
                    selectedOpt !== null 
                        ? (idx === shuffleData.correctIndex 
                            ? 'bg-emerald-950/60 border-emerald-500 text-emerald-200' 
                            : (idx === selectedOpt ? 'bg-rose-950/60 border-rose-500 text-rose-200' : 'bg-slate-900 border-slate-700 text-slate-300 opacity-60'))
                        : 'bg-slate-900 border-slate-700 hover:border-slate-500 text-slate-200 hover:bg-slate-800'
                }`;
                
                btn.innerHTML = `<span><strong class="mr-2 text-slate-400">${String.fromCharCode(65 + idx)}.</strong> ${item.text}</span>`;
                
                if (selectedOpt === null) {
                    btn.onclick = () => selectOption(idx);
                } else {
                    btn.disabled = true;
                }

                optionsContainer.appendChild(btn);
            });

            if (selectedOpt !== null) {
                explanationBox.classList.remove('hidden');
            }

            prevBtn.disabled = currentIdx === 0;
            nextBtn.textContent = currentIdx === quizData.length - 1 ? 'Finish' : 'Next';
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentIdx] !== null) return;

            const shuffleData = getShuffledOptions(currentIdx);
            userAnswers[currentIdx] = selectedIndex;
            attempted++;
            attemptedVal.textContent = attempted;

            if (selectedIndex === shuffleData.correctIndex) {
                score++;
                scoreVal.textContent = score;
            }

            loadQuestion();
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIdx = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        loadQuestion();
    </script>
