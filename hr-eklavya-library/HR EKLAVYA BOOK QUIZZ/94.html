        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl w-full mx-auto p-4 md:p-6 my-6 flex-grow">
        <div id="quiz-card" class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-6 md:p-8 relative">
            
            <!-- Question Meta Header -->
            <div class="flex justify-between items-center mb-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                <span id="question-tag">Question 1 of 80</span>
                <span id="source-page-tag" class="bg-slate-700 text-emerald-300 px-2.5 py-1 rounded-md">Page 1 Source</span>
            </div>

            <!-- Question Text (Bilingual) -->
            <div class="mb-6 space-y-3">
                <h2 id="q-text-en" class="text-lg md:text-xl font-semibold text-slate-100 leading-snug"></h2>
                <h2 id="q-text-hi" class="text-base md:text-lg font-medium text-emerald-300 leading-snug"></h2>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected options -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5">
                    <span>💡 Toggle Hint</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-sm text-amber-300 italic">
                    <!-- Hint text -->
                </div>
            </div>

            <!-- Explanation Box (Revealed on Answer Selection) -->
            <div id="explanation-box" class="hidden mb-6 p-4 bg-slate-900/80 border border-emerald-500/30 rounded-xl">
                <h4 class="text-sm font-bold text-emerald-400 mb-1 flex items-center gap-1">📘 Explanation / Rationale:</h4>
                <p id="explanation-text" class="text-sm text-slate-300 leading-relaxed"></p>
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-700">
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <button onclick="prevQuestion()" id="prev-btn" class="flex-1 sm:flex-none px-4 py-2 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl font-medium text-sm transition-colors">Previous</button>
                    <button onclick="nextQuestion()" id="next-btn" class="flex-1 sm:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-medium text-sm transition-colors text-white">Next</button>
                </div>

                <!-- Jump to Question -->
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <span class="text-xs text-slate-400">Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="80" class="w-16 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-center text-sm text-slate-200 focus:outline-none focus:border-emerald-500" placeholder="1-80">
                    <button onclick="jumpToQuestion()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-medium">Go</button>
                </div>
            </div>

        </div>
    </main>

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredQuestions = new Array(quizData.length).fill(false);

        const qTextEn = document.getElementById("q-text-en");
        const qTextHi = document.getElementById("q-text-hi");
        const optionsContainer = document.getElementById("options-container");
        const questionTag = document.getElementById("question-tag");
        const sourcePageTag = document.getElementById("source-page-tag");
        const scoreVal = document.getElementById("score-val");
        const totalVal = document.getElementById("total-val");
        const progressVal = document.getElementById("progress-val");
        const progressBar = document.getElementById("progress-bar");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const hintBox = document.getElementById("hint-box");
        const explanationBox = document.getElementById("explanation-box");
        const explanationText = document.getElementById("explanation-text");
        const jumpInput = document.getElementById("jump-input");

        totalVal.textContent = quizData.length;

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            questionTag.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            sourcePageTag.textContent = q.page;
            qTextEn.textContent = `${currentQuestionIndex + 1}. ${q.en}`;
            qTextHi.textContent = q.hi;

            // Hint setup
            hintBox.textContent = q.hint;
            hintBox.classList.add("hidden");

            // Explanation setup
            if (answeredQuestions[currentQuestionIndex]) {
                explanationText.textContent = q.explanation;
                explanationBox.classList.remove("hidden");
            } else {
                explanationBox.classList.add("hidden");
            }

            // Render Options
            optionsContainer.innerHTML = "";
            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/50 hover:bg-slate-700/50 transition-all duration-200 text-sm md:text-base flex items-center justify-between group";
                
                const spanText = document.createElement("span");
                spanText.textContent = opt;
                btn.appendChild(spanText);

                const badge = document.createElement("span");
                badge.className = "text-xs px-2 py-1 rounded bg-slate-800 text-slate-400 group-hover:bg-slate-700 group-hover:text-slate-200";
                badge.textContent = String.fromCharCode(65 + idx);
                btn.appendChild(badge);

                if (answeredQuestions[currentQuestionIndex]) {
                    btn.disabled = true;
                    if (idx === q.answer) {
                        btn.classList.add("bg-emerald-900/40", "border-emerald-500", "text-emerald-200");
                        badge.classList.add("bg-emerald-600", "text-white");
                    } else if (userAnswers[currentQuestionIndex] === idx) {
                        btn.classList.add("bg-rose-900/40", "border-rose-500", "text-rose-200");
                        badge.classList.add("bg-rose-600", "text-white");
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                optionsContainer.appendChild(btn);
            });

            // Nav buttons state
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Finish" : "Next";

            updateProgress();
        }

        function selectOption(selectedIdx) {
            if (answeredQuestions[currentQuestionIndex]) return;

            answeredQuestions[currentQuestionIndex] = true;
            userAnswers[currentQuestionIndex] = selectedIdx;

            const q = quizData[currentQuestionIndex];
            if (selectedIdx === q.answer) {
                score++;
                scoreVal.textContent = score;
            }

            explanationText.textContent = q.explanation;
            explanationBox.classList.remove("hidden");

            loadQuestion();
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentQuestionIndex = val - 1;
                loadQuestion();
                jumpInput.value = "";
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function toggleHint() {
            hintBox.classList.toggle("hidden");
        }

        function updateProgress() {
            const answeredCount = answeredQuestions.filter(Boolean).length;
            const percentage = Math.round((answeredCount / quizData.length) * 100);
            progressVal.textContent = `${percentage}%`;
            progressBar.style.width = `${percentage}%`;
        }

        // Initialize Quiz on Load
        window.onload = loadQuestion;
    </script>
