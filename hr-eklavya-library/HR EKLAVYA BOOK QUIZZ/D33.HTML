        const questionSource = document.getElementById("question-source");

        totalQEl.textContent = quizData.length;

        function loadQuestion() {
            const q = quizData[currentIndex];
            currentQEl.textContent = currentIndex + 1;
            scoreEl.textContent = score;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            questionSource.textContent = q.source;

            // Bilingual display (English + Hindi)
            questionText.innerHTML = `<span class="block text-slate-900">${currentIndex + 1}. ${q.qEn}</span><span class="block text-indigo-700 mt-1 font-normal text-base">हिंदी: ${q.qHi}</span>`;

            optionsContainer.innerHTML = "";
            hintBox.classList.add("hidden");
            hintBtnText.textContent = "Show Hint";
            explanationBox.classList.add("hidden");

            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition font-medium text-slate-700 flex items-center justify-between text-sm sm:text-base";
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${opt}</span>`;
                
                const isAlreadyAnswered = selectedAnswers[currentIndex] !== null;

                if (isAlreadyAnswered) {
                    btn.disabled = true;
                    if (idx === q.answer) {
                        btn.classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-900");
                        btn.innerHTML += `<span class="text-emerald-600 font-bold">✓</span>`;
                    } else if (idx === selectedAnswers[currentIndex]) {
                        btn.classList.add("bg-rose-50", "border-rose-500", "text-rose-900");
                        btn.innerHTML += `<span class="text-rose-600 font-bold">✗</span>`;
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }
                optionsContainer.appendChild(btn);
            });

            if (selectedAnswers[currentIndex] !== null) {
                showExplanation(selectedAnswers[currentIndex] === q.answer);
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? "Finish Quiz" : "Next →";
        }

        function selectOption(selectedIndex) {
            const q = quizData[currentIndex];
            selectedAnswers[currentIndex] = selectedIndex;
            const isCorrect = selectedIndex === q.answer;

            if (isCorrect) {
                score++;
            }
            scoreEl.textContent = score;

            // Update option styles
            const buttons = optionsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === q.answer) {
                    buttons[i].classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-900");
                    buttons[i].innerHTML += `<span class="text-emerald-600 font-bold">✓</span>`;
                } else if (i === selectedIndex && !isCorrect) {
                    buttons[i].classList.add("bg-rose-50", "border-rose-500", "text-rose-900");
                    buttons[i].innerHTML += `<span class="text-rose-600 font-bold">✗</span>`;
                }
            }

            showExplanation(isCorrect);
        }

        function showExplanation(isCorrect) {
            const q = quizData[currentIndex];
            explanationBox.classList.remove("hidden");
            if (isCorrect) {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900 text-sm";
                explanationBox.innerHTML = `<strong>Correct! / सही उत्तर!</strong><br>${q.explanation}`;
            } else {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900 text-sm";
                explanationBox.innerHTML = `<strong>Incorrect. / गलत उत्तर।</strong><br>${q.explanation}`;
            }
        }

        function toggleHint() {
            const q = quizData[currentIndex];
            if (hintBox.classList.contains("hidden")) {
                hintBox.textContent = q.hint;
                hintBox.classList.remove("hidden");
                hintBtnText.textContent = "Hide Hint";
            } else {
                hintBox.classList.add("hidden");
                hintBtnText.textContent = "Show Hint";
            }
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const target = parseInt(jumpInput.value) - 1;
            if (target >= 0 && target < quizData.length) {
                currentIndex = target;
                loadQuestion();
                jumpInput.value = "";
            } else {
                alert("Please enter a valid question number between 1 and 90.");
            }
        }

        // Initialize first question
        loadQuestion();
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
