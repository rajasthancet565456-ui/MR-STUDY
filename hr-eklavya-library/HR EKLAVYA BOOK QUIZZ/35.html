                    if (item.originalIdx === q.answer) {
                        btn.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
                        btn.querySelector('span').classList.remove('bg-slate-100', 'text-slate-600');
                        btn.querySelector('span').classList.add('bg-emerald-200', 'text-emerald-800');
                    } else if (item.originalIdx === selectedOriginalIdx) {
                        btn.classList.add('bg-rose-50', 'border-rose-300', 'text-rose-900');
                        btn.querySelector('span').classList.remove('bg-slate-100', 'text-slate-600');
                        btn.querySelector('span').classList.add('bg-rose-200', 'text-rose-800');
                    }
                } else {
                    btn.onclick = () => selectOption(item.originalIdx, q.answer);
                }

                optionsContainer.appendChild(btn);
            });

            // Explanation box state
            if (userAnswers[currentIndex] !== null) {
                const isCorrect = userAnswers[currentIndex] === q.answer;
                explanationBox.classList.remove('hidden');
                if (isCorrect) {
                    explanationBox.className = "mt-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900 text-sm transition-all";
                    explanationTitle.innerHTML = "✅ Correct Answer!";
                } else {
                    explanationBox.className = "mt-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900 text-sm transition-all";
                    explanationTitle.innerHTML = "❌ Incorrect Answer.";
                }
                explanationText.textContent = q.explanation;
            } else {
                explanationBox.classList.add('hidden');
            }

            // Buttons state
            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? 'Finish Quiz 🏁' : 'Next →';
        }

        function stringHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function selectOption(selectedOriginalIdx, correctOriginalIdx) {
            userAnswers[currentIndex] = selectedOriginalIdx;
            
            const isCorrect = selectedOriginalIdx === correctOriginalIdx;
            if (isCorrect) {
                score++;
            }
            scoreDisplay.textContent = `${score} / ${quizData.length}`;

            loadQuestion();
        }

        hintToggle.onclick = () => {
            hintBox.classList.toggle('hidden');
        };

        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        };

        nextBtn.onclick = () => {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}. Excellent work preparing for your Haryana GK exams!`);
            }
        };

        jumpBtn.onclick = () => {
            let val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        };

        // Initial load
        loadQuestion();
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
