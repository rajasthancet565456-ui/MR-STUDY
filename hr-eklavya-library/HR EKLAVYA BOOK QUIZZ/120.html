        let currentIndex = 0;
        let score = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let answeredState = new Array(questions.length).fill(false);
        let selectedOptions = new Array(questions.length).fill(null);

        function loadQuestion() {
            const q = questions[currentIndex];
            
            // Update Page Tag & Numbers
            document.getElementById('page-tag').innerText = q.page;
            document.getElementById('current-q-num').innerText = currentIndex + 1;
            
            // Update Progress Bar
            const progressPercent = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = progressPercent + '%';

            // Update Texts
            document.getElementById('q-text-en').innerText = (currentIndex + 1) + ". " + q.en;
            document.getElementById('q-text-hi').innerText = q.hi;

            // Reset Hint Box
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('hint-toggle-text').innerText = "Show Hint";

            // Reset Explanation Box
            document.getElementById('explanation-box').classList.add('hidden');

            // Render Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition font-medium text-sm sm:text-base flex items-center justify-between group";
                
                const span = document.createElement('span');
                span.innerText = opt;
                btn.appendChild(span);

                // If already answered, style appropriately
                if (answeredState[currentIndex]) {
                    btn.disabled = true;
                    if (idx === q.correct) {
                        btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                    } else if (selectedOptions[currentIndex] === idx) {
                        btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-900');
                    } else {
                        btn.classList.add('opacity-60');
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                container.appendChild(btn);
            });

            // If already answered, show explanation
            if (answeredState[currentIndex]) {
                showExplanationUI(q, selectedOptions[currentIndex] === q.correct);
            }

            // Update Navigation Buttons
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').innerText = currentIndex === questions.length - 1 ? "Finish" : "Next";
        }

        function selectOption(selectedIdx) {
            if (answeredState[currentIndex]) return;

            answeredState[currentIndex] = true;
            selectedOptions[currentIndex] = selectedIdx;

            const q = questions[currentIndex];
            const isCorrect = selectedIdx === q.correct;

            if (isCorrect) {
                score += 1;
                correctAnswers += 1;
            } else {
                incorrectAnswers += 1;
            }

            // Update Header Stats
            document.getElementById('score-val').innerText = score;
            document.getElementById('correct-count').innerText = correctAnswers;
            document.getElementById('incorrect-count').innerText = incorrectAnswers;

            loadQuestion();
        }

        function showExplanationUI(q, isCorrect) {
            const expBox = document.getElementById('explanation-box');
            const expTitle = document.getElementById('explanation-title');
            const expText = document.getElementById('explanation-text');

            expBox.classList.remove('hidden');
            if (isCorrect) {
                expBox.className = "mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-sm";
                expTitle.className = "font-bold mb-1 text-emerald-800";
                expTitle.innerText = "Correct! 🎉 Rationale:";
            } else {
                expBox.className = "mb-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-sm";
                expTitle.className = "font-bold mb-1 text-rose-800";
                expTitle.innerText = "Incorrect. ❌ Rationale:";
            }
            expText.innerText = q.explanation;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            const hintToggleText = document.getElementById('hint-toggle-text');
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintToggleText.innerText = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintToggleText.innerText = "Show Hint";
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} / 80.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const qNum = parseInt(input.value);
            if (!isNaN(qNum) && qNum >= 1 && qNum <= questions.length) {
                currentIndex = qNum - 1;
                loadQuestion();
                input.value = '';
            } else {
                alert("Please enter a valid question number between 1 and 80.");
            }
        }

        // Initialize Quiz on Load
        window.onload = function() {
            document.getElementById('total-q-count').innerText = questions.length;
            loadQuestion();
        };
    </script>
