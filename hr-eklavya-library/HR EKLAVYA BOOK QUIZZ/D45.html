        let currentQuestion = 0;
        let score = 0;
        let answered = new Array(quizData.length).fill(false);
        let userSelections = new Array(quizData.length).fill(null);

        function loadQuestion() {
            const q = quizData[currentQuestion];
            document.getElementById('current-q-num').innerText = currentQuestion + 1;
            document.getElementById('total-q-num').innerText = quizData.length;
            document.getElementById('total-questions').innerText = quizData.length;
            
            document.getElementById('question-text-en').innerText = `${currentQuestion + 1}. ${q.en}`;
            document.getElementById('question-text-hi').innerText = q.hi;

            // Hint
            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('hint-box').classList.add('hidden');

            // Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const button = document.createElement('button');
                button.className = `w-full text-left p-3.5 rounded-xl border text-sm font-medium transition flex items-center justify-between ${
                    answered[currentQuestion]
                        ? index === q.answer
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-semibold'
                            : userSelections[currentQuestion] === index
                                ? 'bg-rose-50 border-rose-300 text-rose-900'
                                : 'bg-white border-slate-200 text-slate-600 opacity-60'
                        : 'bg-white border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/30 text-slate-700'
                }`;
                button.innerHTML = `<span>${opt}</span>`;
                button.disabled = answered[currentQuestion];
                button.onclick = () => selectOption(index);
                optionsContainer.appendChild(button);
            });

            // Explanation Box
            const expBox = document.getElementById('explanation-box');
            if (answered[currentQuestion]) {
                showExplanationUI(userSelections[currentQuestion] === q.answer);
            } else {
                expBox.classList.add('hidden');
            }

            // Progress bar
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Buttons state
            document.getElementById('prev-btn').disabled = currentQuestion === 0;
            document.getElementById('next-btn').innerText = currentQuestion === quizData.length - 1 ? 'Finish / Score' : 'Next →';
        }

        function selectOption(index) {
            if (answered[currentQuestion]) return;
            answered[currentQuestion] = true;
            userSelections[currentQuestion] = index;

            const q = quizData[currentQuestion];
            const isCorrect = index === q.answer;
            if (isCorrect) {
                score++;
                document.getElementById('score').innerText = score;
            }

            loadQuestion();
            showExplanationUI(isCorrect);
        }

        function showExplanationUI(isCorrect) {
            const q = quizData[currentQuestion];
            const expBox = document.getElementById('explanation-box');
            const expTitle = document.getElementById('explanation-title');
            const expText = document.getElementById('explanation-text');

            expBox.classList.remove('hidden');
            if (isCorrect) {
                expBox.className = 'p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900';
                expTitle.innerText = '✅ Correct Answer / सही उत्तर!';
            } else {
                expBox.className = 'p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900';
                expTitle.innerText = '❌ Incorrect Answer / गलत उत्तर!';
            }
            expText.innerText = q.explanation;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value) - 1;
            if (val >= 0 && val < quizData.length) {
                currentQuestion = val;
                loadQuestion();
                input.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        // Initial Load
        window.onload = loadQuestion;
    </script>
