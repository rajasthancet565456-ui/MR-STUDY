<body class="bg-slate-50 text-slate-800 min-p-4 md:p-8 flex flex-col items-center min-h-screen">

                </div>
            </div>

            <!-- Question Text -->

                <p id="question-hindi" class="text-sm md:text-base text-slate-600 font-medium"></p>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamic Options -->
            </div>

            <!-- Hint Box Button & Content -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded transition inline-flex items-center gap-1">

            </div>

            <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                <button onclick="prevQuestion()" id="prev-btn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2 rounded-lg font-medium text-sm transition disabled:opacity-50 disabled:cursor-not-allowed">

                    Next Question

        function loadQuestion() {
            const q = quizData[currentIdx];
            questionCounter.innerText = `Question ${currentIdx + 1} of ${quizData.length}`;
            questionText.innerText = q.q;
            questionHindi.innerText = q.qHi;
            
            hintText.innerText = q.hint;
            hintBox.classList.add('hidden');
            
            explanationText.innerText = q.explanation;
            if (userAnswers[currentIdx] !== null) {
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3 rounded-xl border text-sm font-medium transition flex items-center justify-between ${getOptionStyle(idx, q.correct)}`;
                btn.innerHTML = `<span>${opt}</span> <span class="text-xs font-bold">${getOptionMarker(idx, q.correct)}</span>`;
                btn.disabled = userAnswers[currentIdx] !== null;
                btn.onclick = () => selectOption(idx);
                optionsContainer.appendChild(btn);
            });

            prevBtn.disabled = currentIdx === 0;
            nextBtn.innerText = currentIdx === quizData.length - 1 ? 'Finish Quiz' : 'Next Question';
            progressBar.style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;
        }

        function getOptionStyle(idx, correctIdx) {
            const selected = userAnswers[currentIdx];
            if (selected === null) {
                return 'bg-white border-slate-200 hover:bg-slate-50 text-slate-700';
            }
            if (idx === correctIdx) {
                return 'bg-emerald-100 border-emerald-400 text-emerald-800 font-semibold';
            }
            if (selected === idx && idx !== correctIdx) {
                return 'bg-rose-100 border-rose-400 text-rose-800';
            }
            return 'bg-white border-slate-200 opacity-60 text-slate-500';
        }

        function getOptionMarker(idx, correctIdx) {
            const selected = userAnswers[currentIdx];
            if (selected === null) return '';
            if (idx === correctIdx) return '✓ Correct';
            if (selected === idx) return '✗ Your Choice';
            return '';
        }

        function selectOption(idx) {
            if (userAnswers[currentIdx] !== null) return;
            userAnswers[currentIdx] = idx;
            if (idx === quizData[currentIdx].correct) {
                score++;
                scoreDisplay.innerText = score;
            }
            explanationBox.classList.remove('hidden');
            loadQuestion();
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentIdx = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Initialize quiz
        loadQuestion();
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
