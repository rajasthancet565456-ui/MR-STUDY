        let currentFilter = 'all';
        let filteredQuestions = [...questionsData];
        let currentIndex = 0;
        let userAnswers = {}; // index -> selectedOptionIndex
        let score = 0;

        // Shuffle helper function
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Pre-shuffle options for each question so correct answer position varies unpredictably
        let randomizedQuestions = questionsData.map(q => {
            let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIdx: idx }));
            shuffleArray(optionsWithIndex);
            let newCorrectIdx = optionsWithIndex.findIndex(item => item.originalIdx === q.answer);
            return {
                ...q,
                shuffledOptions: optionsWithIndex.map(item => item.text),
                newCorrectAnswer: newCorrectIdx
            };
        });

        let activeQuestions = [...randomizedQuestions];

        function filterQuestions(type) {
            currentFilter = type;
            document.getElementById('filter-all').className = type === 'all' ? 'px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-indigo-600 text-white transition' : 'px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition';
            document.getElementById('filter-p1').className = type === 'p1' ? 'px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-indigo-600 text-white transition' : 'px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition';
            document.getElementById('filter-p2').className = type === 'p2' ? 'px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-indigo-600 text-white transition' : 'px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition';

            if (type === 'all') {
                activeQuestions = [...randomizedQuestions];
            } else {
                activeQuestions = randomizedQuestions.filter(q => q.page === type);
            }
            currentIndex = 0;
            loadQuestion();
        }

        function loadQuestion() {
            if (activeQuestions.length === 0) return;
            const q = activeQuestions[currentIndex];
            
            // Update Header & Tags
            document.getElementById('question-tag').innerText = `Page ${q.page === 'p1' ? '1' : '2'} • Question ${currentIndex + 1} of ${activeQuestions.length} (Global ID: ${q.id})`;
            document.getElementById('progress-text').innerText = `${currentIndex + 1}/${activeQuestions.length}`;
            const progressPercent = ((currentIndex + 1) / activeQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Question Text
            document.getElementById('question-hindi').innerText = q.hindi;
            document.getElementById('question-english').innerText = q.english;

            // Hint
            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('hint-box').classList.add('hidden');

            // Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const selectedOption = userAnswers[q.id];
            const isAnswered = selectedOption !== undefined;

            q.shuffledOptions.forEach((optionText, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 font-medium text-sm sm:text-base transition flex items-center justify-between ";
                
                let btnStyle = "bg-white hover:bg-slate-50 hover:border-indigo-300 text-slate-700";
                
                if (isAnswered) {
                    btn.disabled = true;
                    if (idx === q.newCorrectAnswer) {
                        btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-semibold";
                    } else if (idx === selectedOption) {
                        btnStyle = "bg-rose-50 border-rose-500 text-rose-900 font-semibold";
                    } else {
                        btnStyle = "bg-white border-slate-200 text-slate-400 opacity-60";
                    }
                }

                btn.className += btnStyle;
                btn.innerHTML = `<span><span class="inline-block w-6 font-bold text-slate-400">${String.fromCharCode(65 + idx)}.</span> ${optionText}</span>`;
                
                if (!isAnswered) {
                    btn.onclick = () => selectOption(idx);
                }
                container.appendChild(btn);
            });

            // Explanation Box
            const expBox = document.getElementById('explanation-box');
            if (isAnswered) {
                expBox.classList.remove('hidden');
                const isCorrect = selectedOption === q.newCorrectAnswer;
                expBox.className = `mt-6 p-4 rounded-xl border transition-all ${isCorrect ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'}`;
                document.getElementById('explanation-header').innerHTML = isCorrect ? '<span>✅ Correct Answer!</span>' : '<span>❌ Incorrect Answer</span>';
                document.getElementById('explanation-text').innerText = q.explanation;
            } else {
                expBox.classList.add('hidden');
            }

            // Navigation buttons
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').innerText = currentIndex === activeQuestions.length - 1 ? 'Finish 🏁' : 'Next →';
        }

        function selectOption(optionIndex) {
            const q = activeQuestions[currentIndex];
            userAnswers[q.id] = optionIndex;

            if (optionIndex === q.newCorrectAnswer) {
                score++;
            }
            document.getElementById('score-display').innerText = `${score} / 90`;
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIndex < activeQuestions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score: ${score} / 90`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (!isNaN(val) && val >= 1 && val <= activeQuestions.length) {
                currentIndex = val - 1;
                loadQuestion();
                document.getElementById('jump-input').value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${activeQuestions.length}`);
            }
        }

        // Initial Load
        loadQuestion();
    </script>
