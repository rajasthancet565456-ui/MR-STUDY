            // Update Header status
            questionIndicator.innerText = `Question ${currentIndex + 1} of ${quizData.length}`;
            scoreCounter.innerText = `Score: ${score}`;
            
            // Progress Bar
            const progressPercent = ((currentIndex + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Source Tag
            sourceBadge.innerText = `Source: Page ${q.page}`;

            // Questions Text
            questionTextEng.innerText = `${currentIndex + 1}. ${q.eng}`;
            questionTextHin.innerText = q.hin;

            // Hint Reset
            hintBox.classList.add('hidden');
            hintBox.innerText = q.hint;

            // Options generation with stable deterministic mapping
            optionsContainer.innerHTML = '';
            
            let optionList = q.options.map((optText, optIdx) => {
                return { text: optText, originalIdx: optIdx };
            });

            // Deterministic shuffle based on question index
            optionList.sort((a, b) => {
                let seed = (currentIndex + 1) * 7;
                return ((seed + a.originalIdx) % 3) - ((seed + b.originalIdx) % 3);
            });

            optionList.forEach((opt, displayIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border border-slate-200 font-medium text-sm transition-all flex items-center justify-between bg-white hover:bg-slate-50`;
                
                const labelSpan = document.createElement('span');
                labelSpan.innerText = opt.text;
                btn.appendChild(labelSpan);

                const letterSpan = document.createElement('span');
                letterSpan.className = 'w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs flex items-center justify-center font-bold';
                letterSpan.innerText = String.fromCharCode(65 + displayIdx);
                btn.prepend(letterSpan);

                // If already answered, style accordingly
                if (userAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                    if (opt.originalIdx === q.correct) {
                        btn.classList.remove('bg-white', 'hover:bg-slate-50');
                        btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                        letterSpan.classList.add('bg-emerald-200', 'text-emerald-800');
                    } else if (userAnswers[currentIndex] === opt.originalIdx) {
                        btn.classList.remove('bg-white', 'hover:bg-slate-50');
                        btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-900');
                        letterSpan.classList.add('bg-rose-200', 'text-rose-800');
                    }
                } else {
                    btn.onclick = () => selectOption(opt.originalIdx, q.correct);
                }

                optionsContainer.appendChild(btn);
            });

            // Explanation Section Handler
            if (userAnswers[currentIndex] !== null) {
                explanationContainer.classList.remove('hidden');
                explanationText.innerText = q.explanation;
            } else {
                explanationContainer.classList.add('hidden');
            }

            // Navigation buttons state
            prevBtn.disabled = currentIndex === 0;
            nextBtn.innerText = currentIndex === quizData.length - 1 ? "Finish Quiz 🏁" : "Next →";
        }

        // Option Selection Handler
        function selectOption(selectedOptIdx, correctOptIdx) {
            if (userAnswers[currentIndex] !== null) return;

            userAnswers[currentIndex] = selectedOptIdx;
            
            if (selectedOptIdx === correctOptIdx) {
                score += 1;
            }

            scoreCounter.innerText = `Score: ${score}`;
            loadQuestion(currentIndex);
        }

        // Navigation Actions
        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                showCompletionScreen();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                loadQuestion(currentIndex - 1);
            }
        }

        function jumpToQuestion() {
            let val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                loadQuestion(val - 1);
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function showCompletionScreen() {
            const quizCard = document.getElementById('quiz-card');
            const percentage = Math.round((score / quizData.length) * 100);
            
            let feedbackMsg = "Outstanding mastery of Haryana Village and District GK!";
            if (percentage < 50) {
                feedbackMsg = "Keep revising Pages 87 and 88 to improve your score!";
            } else if (percentage < 80) {
                feedbackMsg = "Good job! Review the weaker geographical facts.";
            }

            quizCard.innerHTML = `
                <div class="text-center py-8">
                    <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto mb-4">
                        🏆
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">Quiz Completed!</h2>
                    <p class="text-slate-600 mb-6">${feedbackMsg}</p>
                    
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-6 max-w-sm mx-auto mb-6">
                        <div class="text-4xl font-extrabold text-indigo-600 mb-1">${score} / ${quizData.length}</div>
                        <div class="text-sm font-semibold text-slate-500">Your Final Score (${percentage}%)</div>
                    </div>

                    <div class="flex justify-center gap-4">
                        <button onclick="restartQuiz()" class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-semibold text-sm hover:bg-indigo-700 transition-all shadow-sm">
                            Restart Quiz 🔄
                        </button>
                    </div>
                </div>
            `;
        }

        function restartQuiz() {
            location.reload(); 
        }

        // Initial Load on startup
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
