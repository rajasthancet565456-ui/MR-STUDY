        let currentIndex = 0;
        let score = 0;
        const userAnswers = new Array(quizData.length).fill(null);

        function loadQuestion() {
            const q = quizData[currentIndex];
            
            // Update metadata
            document.getElementById('question-counter').innerText = `Question ${currentIndex + 1} of ${quizData.length}`;
            const badge = document.getElementById('source-badge');
            badge.innerText = `Page ${q.page} Syllabus`;
            badge.className = q.page === 1 
                ? "px-2.5 py-1 bg-brand-100 text-brand-700 rounded-full text-xs font-bold"
                : "px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold";

            // Update text
            document.getElementById('question-text-hi').innerText = `${currentIndex + 1}. ${q.hi}`;
            document.getElementById('question-text-en').innerText = q.en;

            // Update progress bar
            const progressPercent = ((currentIndex + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Update jump input
            document.getElementById('jump-input').value = currentIndex + 1;

            // Hint box
            const hintBox = document.getElementById('hint-box');
            hintBox.innerText = q.hint;
            hintBox.classList.add('hidden');

            // Explanation box
            const expBox = document.getElementById('explanation-box');
            expBox.classList.add('hidden');

            // Render options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // Shuffle options for randomization or keep order if pre-shuffled; let's shuffle deterministically or use original array order
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 sm:p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/30 transition text-sm sm:text-base font-medium flex items-center justify-between group focus:outline-none";
                
                const span = document.createElement('span');
                span.innerText = opt.text;
                btn.appendChild(span);

                const letterSpan = document.createElement('span');
                letterSpan.className = "text-xs font-bold px-2 py-1 bg-slate-100 group-hover:bg-brand-100 group-hover:text-brand-700 rounded-md text-slate-500";
                letterSpan.innerText = String.fromCharCode(65 + idx);
                btn.appendChild(letterSpan);

                // If already answered
                if (userAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                    if (opt.correct) {
                        btn.className = "w-full text-left p-3 sm:p-4 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-900 font-medium flex items-center justify-between";
                    } else if (userAnswers[currentIndex] === idx) {
                        btn.className = "w-full text-left p-3 sm:p-4 rounded-xl border border-red-500 bg-red-50 text-red-900 font-medium flex items-center justify-between";
                    } else {
                        btn.className = "w-full text-left p-3 sm:p-4 rounded-xl border border-slate-200 opacity-60 font-medium flex items-center justify-between";
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation automatically
            if (userAnswers[currentIndex] !== null) {
                showExplanationBox(q, userAnswers[currentIndex]);
            }

            // Navigation buttons state
            document.getElementById('prev-btn').disabled = currentIndex === 0;
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentIndex] !== null) return;

            userAnswers[currentIndex] = selectedIndex;
            const q = quizData[currentIndex];
            const isCorrect = q.options[selectedIndex].correct;

            if (isCorrect) {
                score++;
                document.getElementById('score-display').innerText = score;
            }

            loadQuestion();
        }

        function showExplanationBox(q, selectedIndex) {
            const expBox = document.getElementById('explanation-box');
            const expTitle = document.getElementById('explanation-title');
            const expText = document.getElementById('explanation-text');
            const isCorrect = q.options[selectedIndex].correct;

            expBox.classList.remove('hidden');
            if (isCorrect) {
                expBox.className = "p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900 text-sm transition-all duration-200";
                expTitle.innerHTML = "✅ Correct! / सही उत्तर!";
            } else {
                expBox.className = "p-4 rounded-xl border bg-red-50 border-red-200 text-red-900 text-sm transition-all duration-200";
                expTitle.innerHTML = "❌ Incorrect! / गलत उत्तर!";
            }
            expText.innerText = q.explanation;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            const qNum = parseInt(val);
            if (qNum >= 1 && qNum <= quizData.length) {
                currentIndex = qNum - 1;
                loadQuestion();
            }
        }

        // Initialize quiz on load
        window.onload = () => {
            loadQuestion();
        };
    </script>
