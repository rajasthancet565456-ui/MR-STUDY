                <div class="space-y-3">

                    </div>

                    </div>

                    <!-- Options injected dynamically -->
                </div>

                <!-- Hint Section -->

                    <button onclick="toggleHint()" class="text-xs text-amber-400 hover:text-amber-300 flex items-center gap-1 font-medium transition">

                    </button>
                    <div id="hint-box" class="hidden mt-2 p-3 bg-amber-950/30 border border-amber-700/40 rounded-lg text-xs text-amber-200">

                    </div>

                    </div>
                    <p id="explanation-text" class="text-xs sm:text-sm text-slate-300 leading-relaxed">

                    </p>
                </div>
            </div>

        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptionsCache = {};

        // Randomize options for each question securely while keeping track of correct answer
        function getShuffledOptions(index) {
            if (shuffledOptionsCache[index]) {
                return shuffledOptionsCache[index];
            }
            const q = quizData[index];
            const optionsWithOriginalIndex = q.options.map((opt, i) => ({ opt, originalIndex: i }));
            
            // Fisher-Yates shuffle
            for (let i = optionsWithOriginalIndex.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsWithOriginalIndex[i], optionsWithOriginalIndex[j]] = [optionsWithOriginalIndex[j], optionsWithOriginalIndex[i]];
            }

            const shuffledOptions = optionsWithOriginalIndex.map(item => item.opt);
            const newCorrectIndex = optionsWithOriginalIndex.findIndex(item => item.originalIndex === q.correct);

            shuffledOptionsCache[index] = {
                shuffledOptions,
                newCorrectIndex
            };
            return shuffledOptionsCache[index];
        }

        function loadQuestion() {
            const q = quizData[currentQuestion];
            const cache = getShuffledOptions(currentQuestion);

            // Update Header & Progress
            document.getElementById('question-counter').innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;
            
            // Update Text Bilingual
            document.getElementById('question-text-en').innerText = `${currentQuestion + 1}. ${q.en}`;
            document.getElementById('question-text-hi').innerText = q.hi;

            // Update Hint
            const hintBox = document.getElementById('hint-box');
            hintBox.innerText = q.hint;
            hintBox.classList.add('hidden');

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            cache.shuffledOptions.forEach((optionText, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition-all duration-200 flex items-center justify-between text-sm sm:text-base font-medium `;
                
                const optionLetter = String.fromCharCode(65 + i); // A, B, C, D
                
                let btnStyle = "bg-slate-900/60 border-slate-700 hover:border-indigo-500 hover:bg-slate-900 text-slate-200";
                
                const selectedAnswer = userAnswers[currentQuestion];
                if (selectedAnswer !== null) {
                    // Disable further clicks if already answered
                    btn.disabled = true;
                    if (i === cache.newCorrectIndex) {
                        btnStyle = "bg-emerald-950/50 border-emerald-500 text-emerald-200 shadow-lg shadow-emerald-900/20";
                    } else if (i === selectedAnswer) {
                        btnStyle = "bg-rose-950/50 border-rose-500 text-rose-200 shadow-lg shadow-rose-900/20";
                    } else {
                        btnStyle = "bg-slate-900/40 border-slate-800 text-slate-500 opacity-60";
                    }
                }

                btn.className += btnStyle;
                btn.innerHTML = `
                    <span class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-bold text-indigo-400">${optionLetter}</span>
                        <span>${optionText}</span>
                    </span>
                `;

                if (selectedAnswer === null) {
                    btn.onclick = () => selectOption(i);
                }

                optionsContainer.appendChild(btn);
            });

            // Handle Explanation Box
            const explanationBox = document.getElementById('explanation-box');
            if (userAnswers[currentQuestion] !== null) {
                showExplanationUI(userAnswers[currentQuestion] === cache.newCorrectIndex);
            } else {
                explanationBox.classList.add('hidden');
            }

            // Navigation Buttons State
            document.getElementById('prev-btn').disabled = currentQuestion === 0;
            document.getElementById('next-btn').innerText = currentQuestion === quizData.length - 1 ? 'Finish Quiz' : 'Next →';
            
            // Update Attempted Counter
            updateStats();
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentQuestion] !== null) return; // already answered

            userAnswers[currentQuestion] = selectedIndex;
            const cache = getShuffledOptions(currentQuestion);
            const isCorrect = selectedIndex === cache.newCorrectIndex;

            if (isCorrect) {
                score++;
            }

            loadQuestion();
        }

        function showExplanationUI(isCorrect) {
            const explanationBox = document.getElementById('explanation-box');
            const explanationTitle = document.getElementById('explanation-title');
            const explanationText = document.getElementById('explanation-text');
            const q = quizData[currentQuestion];

            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mt-4 p-4 rounded-xl border bg-emerald-950/30 border-emerald-600/50 text-emerald-200";
                explanationTitle.innerHTML = `<span class="text-emerald-400 text-base">✓ Correct! / सही उत्तर!</span>`;
            } else {
                explanationBox.className = "mt-4 p-4 rounded-xl border bg-rose-950/30 border-rose-600/50 text-rose-200";
                explanationTitle.innerHTML = `<span class="text-rose-400 text-base">✕ Incorrect / गलत उत्तर</span>`;
            }
            explanationText.innerHTML = `<strong>Explanation / व्याख्या:</strong> ${q.explanation}`;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showFinalScore();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentQuestion = val - 1;
                input.value = '';
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function updateStats() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('total-qs-display').innerText = quizData.length;
            const attemptedCount = userAnswers.filter(ans => ans !== null).length;
            document.getElementById('attempted-display').innerText = attemptedCount;
        }

        function showFinalScore() {
            const percentage = Math.round((score / quizData.length) * 100);
            const container = document.querySelector('main > div');
            container.innerHTML = `
                <div class="p-8 text-center space-y-6 my-auto">
                    <div class="w-20 h-20 bg-indigo-600/20 border border-indigo-500 rounded-full flex items-center justify-center mx-auto text-3xl text-indigo-400 font-bold shadow-xl">
                        ${percentage}%
                    </div>
                    <h2 class="text-2xl font-bold text-slate-100">Quiz Completed Successfully!</h2>
                    <p class="text-slate-300 text-sm max-w-md mx-auto">
                        You have completed the 100-question Haryana Administrative Divisions & Karnal District comprehensive exam module.
                    </p>
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 max-w-xs mx-auto space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-slate-400">Total Questions:</span>
                            <span class="font-bold text-slate-200">${quizData.length}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400">Correct Answers:</span>
                            <span class="font-bold text-emerald-400">${score}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400">Incorrect / Skipped:</span>
                            <span class="font-bold text-rose-400">${quizData.length - score}</span>
                        </div>
                    </div>
                    <button onclick="location.reload()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30 text-sm">
                        Restart Quiz ↺
                    </button>
                </div>
            `;
        }

        // Initialize first question on load
        window.onload = () => {
            loadQuestion();
        };
