                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-emerald-50 hover:border-emerald-300 transition font-medium text-slate-700 flex justify-between items-center";
                btn.innerHTML = `<span>${opt.text}</span>`;

                if (selectedAnswers[index] !== null) {
                    btn.disabled = true;
                    if (opt.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-100 font-medium text-emerald-900 flex justify-between items-center";
                        btn.innerHTML += `<span>✅</span>`;
                    } else if (selectedAnswers[index].selectedIndex === optIndex) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-100 font-medium text-rose-900 flex justify-between items-center";
                        btn.innerHTML += `<span>❌</span>`;
                    }
                } else {
                    btn.onclick = () => selectOption(optIndex, opt.correct);
                }

                optionsContainer.appendChild(btn);
            });

            // Update progress & controls
            progressText.textContent = `Q ${index + 1} of 80`;
            progressBar.style.width = `${((index + 1) / 80) * 100}%`;
            scoreDisplay.textContent = `Score: ${score} / 80`;
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? "Finish Quiz 🏁" : "Next →";
        }

        function selectOption(optIndex, isCorrect) {
            selectedAnswers[currentIndex] = { selectedIndex: optIndex, isCorrect: isCorrect };
            if (isCorrect) {
                score++;
            }
            scoreDisplay.textContent = `Score: ${score} / 80`;
            loadQuestion(currentIndex);
        }

        hintToggle.onclick = () => {
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintToggle.textContent = "💡 Hide Hint / संकेत छुपाएं";
            } else {
                hintBox.classList.add('hidden');
                hintToggle.textContent = "💡 Show Hint / संकेत देखें";
            }
        };

        nextBtn.onclick = () => {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                quizCard.classList.add('hidden');
                completionCard.classList.remove('hidden');
                finalScore.textContent = score;
            }
        };

        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        };

        jumpBtn.onclick = () => {
            const target = parseInt(jumpInput.value) - 1;
            if (target >= 0 && target < quizData.length) {
                currentIndex = target;
                loadQuestion(currentIndex);
                jumpInput.value = '';
            } else {
                alert("Please enter a valid question number between 1 and 80.");
            }
        };

        restartBtn.onclick = () => {
            currentIndex = 0;
            score = 0;
            selectedAnswers = new Array(quizData.length).fill(null);
            completionCard.classList.add('hidden');
            quizCard.classList.remove('hidden');
            loadQuestion(currentIndex);
        };

        // Initialize first question
        loadQuestion(currentIndex);
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
