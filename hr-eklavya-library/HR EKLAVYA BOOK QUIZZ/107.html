        let currentIdx = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        // DOM Elements
        const questionTextHi = document.getElementById('question-text-hi');
        const questionTextEn = document.getElementById('question-text-en');
        const optionsContainer = document.getElementById('options-container');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const scoreDisplay = document.getElementById('score-display');
        const pageSourceBadge = document.getElementById('page-source-badge');
        const hintToggleBtn = document.getElementById('hint-toggle-btn');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');

        // Shuffle options for each question securely while keeping track of the correct answer string or index
        let shuffledQuizData = quizData.map((q) => {
            let originalOptions = [...q.options];
            
            let indexedOptions = originalOptions.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            
            // Fisher-Yates shuffle
            for (let i = indexedOptions.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [indexedOptions[i], indexedOptions[j]] = [indexedOptions[j], indexedOptions[i]];
            }

            let newCorrectIndex = indexedOptions.findIndex(opt => opt.isCorrect);

            return {
                ...q,
                shuffledOptions: indexedOptions,
                newCorrect: newCorrectIndex
            };
        });

        function loadQuestion(idx) {
            currentIdx = idx;
            const q = shuffledQuizData[currentIdx];

            // Update header info & progress
            progressText.innerText = `Question ${currentIdx + 1} of ${shuffledQuizData.length}`;
            progressBar.style.width = `${((currentIdx + 1) / shuffledQuizData.length) * 100}%`;
            
            if(q.page === 1) {
                pageSourceBadge.innerText = "Source: Page 1 (Sports & Policies, Q 1-40)";
                pageSourceBadge.className = "bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-xs font-semibold";
            } else {
                pageSourceBadge.innerText = "Source: Page 2 (Stadiums & Academies, Q 41-80)";
                pageSourceBadge.className = "bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-xs font-semibold";
            }

            // Set question text
            questionTextHi.innerText = `${currentIdx + 1}. ${q.hi}`;
            questionTextEn.innerText = q.en;

            // Clear hint and explanation
            hintBox.classList.add('hidden');
            hintText.innerText = q.hint;
            explanationBox.classList.add('hidden');
            explanationText.innerText = q.explanation;

            // Render options
            optionsContainer.innerHTML = '';
            q.shuffledOptions.forEach((optObj, oIdx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-3.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 font-medium text-slate-700 flex items-center justify-between shadow-sm";
                
                const optionLabel = String.fromCharCode(65 + oIdx); // A, B, C, D
                btn.innerHTML = `<span><span class="font-bold mr-2 text-emerald-600">${optionLabel}.</span> ${optObj.text}</span>`;
                
                // Check if user already answered this question
                if (userAnswers[currentIdx] !== null) {
                    btn.disabled = true;
                    if (oIdx === q.newCorrect) {
                        btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                    } else if (oIdx === userAnswers[currentIdx]) {
                        btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-900');
                    }
                } else {
                    btn.onclick = () => selectOption(oIdx);
                }

                optionsContainer.appendChild(btn);
            });

            // Show explanation if already answered
            if (userAnswers[currentIdx] !== null) {
                explanationBox.classList.remove('hidden');
            }

            // Button states
            prevBtn.disabled = currentIdx === 0;
            nextBtn.innerText = currentIdx === shuffledQuizData.length - 1 ? "Finish / समाप्त" : "Next / अगला";
            jumpInput.value = currentIdx + 1;
        }

        function selectOption(selectedIdx) {
            const q = shuffledQuizData[currentIdx];
            userAnswers[currentIdx] = selectedIdx;

            const optionButtons = optionsContainer.children;
            
            if (selectedIdx === q.newCorrect) {
                score++;
                scoreDisplay.innerText = score;
            }

            // Highlight options
            for (let i = 0; i < optionButtons.length; i++) {
                optionButtons[i].disabled = true;
                if (i === q.newCorrect) {
                    optionButtons[i].classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                } else if (i === selectedIdx) {
                    optionButtons[i].classList.add('bg-rose-50', 'border-rose-500', 'text-rose-900');
                }
            }

            explanationBox.classList.remove('hidden');
        }

        // Event Listeners for Navigation
        nextBtn.onclick = () => {
            if (currentIdx < shuffledQuizData.length - 1) {
                loadQuestion(currentIdx + 1);
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of 80.`);
            }
        };

        prevBtn.onclick = () => {
            if (currentIdx > 0) {
                loadQuestion(currentIdx - 1);
            }
        };

        jumpBtn.onclick = () => {
            let val = parseInt(jumpInput.value) - 1;
            if (val >= 0 && val < shuffledQuizData.length) {
                loadQuestion(val);
            } else {
                alert(`Please enter a valid question number between 1 and ${shuffledQuizData.length}`);
            }
        };

        jumpInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
                jumpBtn.click();
            }
        };

        hintToggleBtn.onclick = () => {
            hintBox.classList.toggle('hidden');
            hintToggleBtn.innerText = hintBox.classList.contains('hidden') ? "Show Hint / संकेत देखें" : "Hide Hint / संकेत छुपाएं";
        };

        // Initial Load
        loadQuestion(0);
    </script>
