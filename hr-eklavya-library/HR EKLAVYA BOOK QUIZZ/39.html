            questionEnEl.textContent = q.en;
            questionCategory.textContent = q.category;
            questionSourceTag.textContent = q.page;

            hintText.textContent = q.hint;
            hintBox.classList.add('hidden');
            explanationText.textContent = q.explanation;

            if (userAnswers[currentIndex] !== null) {
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border text-sm sm:text-base font-medium transition flex justify-between items-center ${getOptionStyle(idx, q.correct)}`;
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${opt}</span>`;
                btn.onclick = () => selectOption(idx);
                if (userAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                }
                optionsContainer.appendChild(btn);
            });

            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? 'समाप्त / Finish' : 'अगला / Next ➡';
        }

        function getOptionStyle(optIndex, correctIndex) {
            const userAns = userAnswers[currentIndex];
            if (userAns === null) {
                return 'bg-white border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700';
            }
            if (optIndex === correctIndex) {
                return 'bg-emerald-100 border-emerald-500 text-emerald-900 font-semibold';
            }
            if (optIndex === userAns && userAns !== correctIndex) {
                return 'bg-rose-100 border-rose-500 text-rose-900 font-semibold';
            }
            return 'bg-slate-50 border-slate-200 text-slate-400 opacity-60';
        }

        function selectOption(idx) {
            if (userAnswers[currentIndex] !== null) return;
            userAnswers[currentIndex] = idx;
            const q = quizData[currentIndex];
            if (idx === q.correct) {
                score++;
            }
            scoreDisplay.textContent = `स्कोर / Score: ${score} / 80`;
            explanationBox.classList.remove('hidden');
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`क्विज़ समाप्त! आपका कुल स्कोर: ${score} / 80`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= 80) {
                currentIndex = val - 1;
                jumpInput.value = '';
                loadQuestion();
            } else {
                alert('कृपया 1 से 80 के बीच वैध प्रश्न संख्या दर्ज करें। (Please enter a valid question number between 1 and 80)');
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        window.onload = () => {
            loadQuestion();
        };
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
