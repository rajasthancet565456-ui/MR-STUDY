<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md py-4 px-6 sticky top-0 z-50">

            <div>
                <h1 class="text-xl font-bold text-cyan-400">Haryana District Exam Quiz (Rewari & Mahendragarh)</h1>
                <p class="text-xs text-slate-400">Bilingual Exam Practice (90 Unique Questions)</p>
            </div>
            <div class="flex items-center gap-4">

                </div>
                <div class="text-sm bg-slate-700 px-3 py-1 rounded-full border border-slate-600">

            </div>
        </div>

            <div id="progress-bar" class="bg-cyan-500 h-full w-0 transition-all duration-300"></div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 my-auto">
        <div id="quiz-card" class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-6 relative">
            
            <!-- Question Meta / Tag -->
            <div class="flex justify-between items-center mb-4">
                <span id="question-tag" class="text-xs font-semibold uppercase tracking-wider bg-cyan-950 text-cyan-300 px-2.5 py-1 rounded-md border border-cyan-800">Rewari District</span>
                <span id="question-number-badge" class="text-xs text-slate-400">Question 1 of 90</span>
            </div>

            <!-- Question Text (Bilingual) -->
            <div class="mb-6 space-y-2">
                <h2 id="question-hindi" class="text-lg sm:text-xl font-medium text-slate-100"></h2>
                <h3 id="question-english" class="text-sm sm:text-base text-slate-400 italic"></h3>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamic Options -->
            </div>

            <!-- Hint Section -->
            <div class="mb-4">
                <button onclick="toggleHint()" class="text-xs text-amber-400 hover:underline flex items-center gap-1 focus:outline-none">
                    <span>💡 Toggle Hint / संकेत</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-950/40 border border-amber-800/50 rounded-lg text-xs text-amber-200">
                    <!-- Hint Text -->
                </div>
            </div>

            <!-- Explanation Box (Revealed on Answer) -->
            <div id="explanation-box" class="hidden mt-4 p-4 rounded-xl border transition-all">
                <h4 id="explanation-title" class="font-semibold text-sm mb-1"></h4>
                <p id="explanation-text" class="text-xs sm:text-sm text-slate-300 leading-relaxed"></p>
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-8 pt-4 border-t border-slate-700">
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <button onclick="jumpToQuestionPrompt()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg border border-slate-600 transition-colors w-full sm:w-auto">
                        Jump to Q# 🎯
                    </button>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                    <button id="prev-btn" onclick="prevQuestion()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                        Previous
                    </button>
                    <button id="next-btn" onclick="nextQuestion()" class="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-sm font-medium transition-colors shadow-lg shadow-cyan-900/30">
                        Next
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-500">
        Haryana GK Interactive Assessment Application • Built with Tailwind CSS & JavaScript
    </footer>

                options: ["कानोड / Kanod", "सिरमौर / Sirmour", "विशालगढ़ / Vishalgarh", "इन्द्रप्रस्थ / Indraprastha"],
                answer: 0,
                hint: "कानोडिया ब्राह्मणों के नाम पर इसका पुराना नाम यह पड़ा था।",

            {
                tag: "Mahendragarh District",
                hindi: "हरियाणा के किस जिले में सर्वाधिक शुष्क मरुस्थलीय वन पाए जाते हैं?",
                english: "In which district of Haryana are dry desert forests mostly found?",
                options: ["महेंद्रगढ़ / Mahendragarh", "सिरसा / Sirsa", "भिवानी / Bhiwani", "फतेहाबाद / Fatehabad"],
                answer: 0,
                hint: "यह राज्य का सबसे शुष्क जिला भी है।",
                explanation: "महेंद्रगढ़ जिले में सर्वाधिक शुष्क मरुस्थलीय वन पाए जाते हैं।"

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredCurrent = false;

        const questionTag = document.getElementById("question-tag");
        const questionNumberBadge = document.getElementById("question-number-badge");
        const questionHindi = document.getElementById("question-hindi");
        const questionEnglish = document.getElementById("question-english");
        const optionsContainer = document.getElementById("options-container");
        const hintBox = document.getElementById("hint-box");
        const explanationBox = document.getElementById("explanation-box");
        const explanationTitle = document.getElementById("explanation-title");
        const explanationText = document.getElementById("explanation-text");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const scoreDisplay = document.getElementById("score-display");
        const currentQNumDisplay = document.getElementById("current-q-num");
        const progressBar = document.getElementById("progress-bar");

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            questionTag.textContent = q.tag;
            questionNumberBadge.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            currentQNumDisplay.textContent = currentQuestionIndex + 1;
            questionHindi.textContent = `${currentQuestionIndex + 1}. ${q.hindi}`;
            questionEnglish.textContent = q.english;

            // Progress bar update
            const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Reset UI states
            hintBox.classList.add("hidden");
            explanationBox.classList.add("hidden");
            optionsContainer.innerHTML = "";
            answeredCurrent = userAnswers[currentQuestionIndex] !== null;

            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-700/40 hover:bg-slate-700 hover:border-cyan-500 transition-all text-sm sm:text-base flex items-center justify-between group";
                
                const spanText = document.createElement("span");
                spanText.textContent = opt;
                btn.appendChild(spanText);

                const badge = document.createElement("span");
                badge.className = "text-xs px-2 py-1 rounded bg-slate-800 text-slate-400 group-hover:text-cyan-300";
                badge.textContent = String.fromCharCode(65 + idx);
                btn.appendChild(badge);

                if (userAnswers[currentQuestionIndex] !== null) {
                    btn.disabled = true;
                    if (idx === q.answer) {
                        btn.classList.add("bg-emerald-950/60", "border-emerald-500", "text-emerald-200");
                        badge.className = "text-xs px-2 py-1 rounded bg-emerald-900 text-emerald-200";
                    } else if (idx === userAnswers[currentQuestionIndex]) {
                        btn.classList.add("bg-rose-950/60", "border-rose-500", "text-rose-200");
                        badge.className = "text-xs px-2 py-1 rounded bg-rose-900 text-rose-200";
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentQuestionIndex] !== null) {
                showExplanation(userAnswers[currentQuestionIndex] === q.answer, q);
            }

            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Finish / Summary 🏆" : "Next";
        }

        function selectOption(selectedIdx) {
            if (userAnswers[currentQuestionIndex] !== null) return;
            userAnswers[currentQuestionIndex] = selectedIdx;
            
            const q = quizData[currentQuestionIndex];
            const isCorrect = selectedIdx === q.answer;

            if (isCorrect) {
                score++;
                scoreDisplay.textContent = score;
            }

            loadQuestion();
        }

        function showExplanation(isCorrect, q) {
            explanationBox.classList.remove("hidden");
            if (isCorrect) {
                explanationBox.className = "mt-4 p-4 rounded-xl border bg-emerald-950/30 border-emerald-800/50 text-emerald-200";
                explanationTitle.textContent = "✅ Correct! / सही उत्तर!";
            } else {
                explanationBox.className = "mt-4 p-4 rounded-xl border bg-rose-950/30 border-rose-800/50 text-rose-200";
                explanationTitle.textContent = `❌ Incorrect. Correct Answer: ${q.options[q.answer]}`;
            }
            explanationText.textContent = q.explanation;
        }

        function toggleHint() {
            const q = quizData[currentQuestionIndex];
            hintBox.textContent = q.hint;
            hintBox.classList.toggle("hidden");
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showFinalScore();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestionPrompt() {
            const jump = prompt(`Jump to Question (1 to ${quizData.length}):`, currentQuestionIndex + 1);
            if (jump !== null) {
                const qNum = parseInt(jump, 10);
                if (!isNaN(qNum) && qNum >= 1 && qNum <= quizData.length) {
                    currentQuestionIndex = qNum - 1;
                    loadQuestion();
                } else {
                    alert("Please enter a valid question number.");
                }
            }
        }

        function showFinalScore() {
            const card = document.getElementById("quiz-card");
            card.innerHTML = `
                <div class="text-center py-8 space-y-6">
                    <div class="inline-flex p-4 bg-cyan-950/50 border border-cyan-800 rounded-full text-cyan-400 text-3xl">🏆</div>
                    <h2 class="text-2xl font-bold text-slate-100">Quiz Completed Successfully!</h2>
                    <p class="text-slate-300">You have completed all 90 unique questions from Rewari and Mahendragarh district syllabus.</p>
                    <div class="text-3xl font-extrabold text-emerald-400 bg-slate-900/60 py-4 px-6 rounded-2xl border border-slate-700 inline-block">
                        Final Score: ${score} / 90
                    </div>
                    <div class="pt-4">
                        <button onclick="resetQuiz()" class="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-medium shadow-lg transition-all">
                            Restart Quiz 🔄
                        </button>
                    </div>
                </div>
            `;
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = new Array(quizData.length).fill(null);
            scoreDisplay.textContent = score;
            // Re-render card layout if needed, or reload page structure
            window.location.reload();
        }

        // Initial Load
        loadQuestion();
    </script>
