                qHi: "हरियाणा में अशोक चक्र प्राप्तकर्ता को कितनी नकद राशि मिलती है?",
                qEn: "What cash reward does an Ashok Chakra recipient get in Haryana?",
                options: ["50 लाख", "1 करोड़", "2 करोड़", "25 लाख"],
                answer: 1,
                hint: "यह 1 करोड़ रुपये है।",
                expHi: "स्पष्टीकरण: अशोक चक्र विजेता को 1 करोड़ रुपये की राशि दी जाती है।",
                expEn: "Explanation: A cash reward of 1 crore rupees is given for the Ashok Chakra."
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let userAnswers = new Array(rawQuizData.length).fill(null);

        // Randomize options for each question securely while keeping track of the correct answer
        const quizData = rawQuizData.map((item) => {
            let optionsWithIndex = item.options.map((opt, idx) => ({ text: opt, originalIdx: idx }));
            // Shuffle options
            for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
            }
            const newCorrectIdx = optionsWithIndex.findIndex(opt => opt.originalIdx === item.answer);
            return {
                qHi: item.qHi,
                qEn: item.qEn,
                options: optionsWithIndex.map(o => o.text),
                answer: newCorrectIdx,
                hint: item.hint,
                expHi: item.expHi,
                expEn: item.expEn
            };
        });

        const qIndicator = document.getElementById('question-indicator');
        const scoreTracker = document.getElementById('score-tracker');
        const progressBar = document.getElementById('progress-bar');
        const qText = document.getElementById('question-text');
        const qTextEn = document.getElementById('question-text-en');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const current = quizData[currentIdx];
            qIndicator.innerText = `प्रश्न (Question) ${currentIdx + 1} of ${quizData.length}`;
            scoreTracker.innerText = `स्कोर (Score): ${score}`;
            progressBar.style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;

            qText.innerText = current.qHi;
            qTextEn.innerText = current.qEn;

            optionsContainer.innerHTML = '';
            hintBox.classList.add('hidden');
            hintBox.innerText = current.hint;
            explanationBox.classList.add('hidden');

            current.options.forEach((option, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 font-medium text-slate-700 transition flex items-center justify-between shadow-sm";
                btn.innerHTML = `<span><strong class="mr-2 text-indigo-600">${String.fromCharCode(65 + idx)}.</strong> ${option}</span>`;
                
                // If already answered, style accordingly
                if (userAnswers[currentIdx] !== null) {
                    btn.disabled = true;
                    if (idx === current.answer) {
                        btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                    } else if (userAnswers[currentIdx] === idx) {
                        btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-900');
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }
                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentIdx] !== null) {
                showExplanation();
            }

            prevBtn.disabled = currentIdx === 0;
            nextBtn.innerText = currentIdx === quizData.length - 1 ? "समाप्त (Finish)" : "अगला (Next) →";
        }

        function selectOption(selectedIdx) {
            if (userAnswers[currentIdx] !== null) return;
            userAnswers[currentIdx] = selectedIdx;

            const current = quizData[currentIdx];
            if (selectedIdx === current.answer) {
                score++;
            }

            loadQuestion();
        }

        function showExplanation() {
            const current = quizData[currentIdx];
            const isCorrect = userAnswers[currentIdx] === current.answer;
            
            explanationBox.className = `mb-6 p-4 rounded-lg border text-sm transition-all ${isCorrect ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'}`;
            explanationBox.innerHTML = `
                <p class="font-bold mb-1">${isCorrect ? '✔ सही उत्तर! (Correct Answer!)' : '✖ गलत उत्तर! (Incorrect!)'}</p>
                <p class="mb-1">${current.expHi}</p>
                <p class="italic text-xs opacity-85">${current.expEn}</p>
            `;
            explanationBox.classList.remove('hidden');
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showScoreCard();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value) - 1;
            if (val >= 0 && val < quizData.length) {
                currentIdx = val;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert('कृपया 1 से 80 के बीच वैध प्रश्न संख्या दर्ज करें। (Please enter a valid question number between 1 and 80.)');
            }
        }

        function showScoreCard() {
            document.querySelector('main').innerHTML = `
                <div class="text-center py-8">
                    <h2 class="text-2xl font-bold text-indigo-900 mb-4">🎉 क्विज़ समाप्त! (Quiz Completed!)</h2>
                    <p class="text-lg text-slate-600 mb-6">आपका कुल स्कोर (Your Final Score): <span class="font-bold text-indigo-600">${score}</span> / 80</p>
                    <div class="inline-block p-4 bg-indigo-50 border border-indigo-200 rounded-xl mb-6 text-indigo-900 font-medium">
                        ${score >= 65 ? 'उत्कृष्ट प्रदर्शन! (Excellent Performance!)' : score >= 45 ? 'अच्छा प्रयास! (Good Effort!)' : 'और अधिक अभ्यास की आवश्यकता है। (Needs more practice.)'}
                    </div>
                    <div>
                        <button onclick="location.reload()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition">
                            पुनः प्रयास करें (Retake Quiz)
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize first question on load
        window.onload = loadQuestion;
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
