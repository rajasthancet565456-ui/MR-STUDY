        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const qCurrentEl = document.getElementById("q-current");
        const scoreDisplay = document.getElementById("score-display");
        const progressDisplay = document.getElementById("progress-display");
        const progressBar = document.getElementById("progress-bar");
        const questionCategoryEl = document.getElementById("question-category");
        const questionTextEnEl = document.getElementById("question-text-en");
        const questionTextHiEl = document.getElementById("question-text-hi");
        const optionsContainer = document.getElementById("options-container");
        const hintBox = document.getElementById("hint-box");
        const explanationBox = document.getElementById("explanation-box");
        const explanationText = document.getElementById("explanation-text");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const jumpInput = document.getElementById("jump-input");

        function loadQuestion() {
            const currentQ = quizData[currentIndex];
            qCurrentEl.textContent = currentIndex + 1;
            progressDisplay.textContent = `${currentIndex + 1} / ${quizData.length}`;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;

            questionCategoryEl.textContent = currentQ.cat;
            questionTextEnEl.textContent = `${currentIndex + 1}. ${currentQ.en}`;
            questionTextHiEl.textContent = currentQ.hi;

            hintBox.textContent = currentQ.hint;
            hintBox.classList.add("hidden");
            explanationBox.classList.add("hidden");
            explanationText.textContent = currentQ.exp;

            optionsContainer.innerHTML = "";
            
            // Create option objects with original index
            let indexedOptions = currentQ.options.map((opt, idx) => ({ opt, idx }));
            
            // Randomly shuffle option display order
            indexedOptions.sort(() => Math.random() - 0.5);

            indexedOptions.forEach((item) => {
                const button = document.createElement("button");
                button.className = "w-full text-left p-3.5 md:p-4 rounded-xl border border-slate-200 hover:border-emerald-400 hover:bg-emerald-50/40 transition-all font-medium text-xs md:text-sm text-slate-800 flex justify-between items-center group shadow-sm";
                
                const span = document.createElement("span");
                span.textContent = item.opt;
                button.appendChild(span);

                const existingAnswer = userAnswers[currentIndex];
                
                if (existingAnswer !== null) {
                    button.disabled = true;
                    if (item.idx === currentQ.answer) {
                        button.classList.add("bg-emerald-100/80", "border-emerald-500", "text-emerald-950", "font-semibold");
                    } else if (existingAnswer === item.idx) {
                        button.classList.add("bg-rose-100/80", "border-rose-400", "text-rose-950");
                    }
                    explanationBox.classList.remove("hidden");
                } else {
                    button.onclick = () => selectOption(item.idx, currentQ.answer, button);
                }

                optionsContainer.appendChild(button);
            });

            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? "Finish" : "Next";
        }

        function selectOption(selectedIndex, correctIndex, buttonElement) {
            userAnswers[currentIndex] = selectedIndex;
            
            const buttons = optionsContainer.getElementsByTagName("button");
            Array.from(buttons).forEach(btn => {
                btn.disabled = true;
            });

            if (selectedIndex === correctIndex) {
                score++;
                scoreDisplay.textContent = score;
                buttonElement.classList.add("bg-emerald-100/80", "border-emerald-500", "text-emerald-950", "font-semibold");
            } else {
                buttonElement.classList.add("bg-rose-100/80", "border-rose-400", "text-rose-950");
                Array.from(buttons).forEach(btn => {
                    if (btn.textContent.includes(quizData[currentIndex].options[correctIndex])) {
                        btn.classList.add("bg-emerald-100/80", "border-emerald-500", "text-emerald-950", "font-semibold");
                    }
                });
            }

            explanationBox.classList.remove("hidden");
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion();
                jumpInput.value = "";
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function toggleHint() {
            hintBox.classList.toggle("hidden");
        }

        window.onload = loadQuestion;
    </script>
