        // State variables
        let currentIdx = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        // DOM Elements
        const qIndicator = document.getElementById('question-indicator');
        const pageSourceTag = document.getElementById('page-source-tag');
        const progressBar = document.getElementById('progress-bar');
        const qTextEn = document.getElementById('q-text-en');
        const qTextHi = document.getElementById('q-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationTitle = document.getElementById('explanation-title');
        const explanationText = document.getElementById('explanation-text');
        const scoreDisplay = document.getElementById('score-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentIdx];
            
            // Update Headers
            qIndicator.innerText = `Question ${currentIdx + 1} of 80`;
            pageSourceTag.innerText = `Source: Page ${q.page}`;
            progressBar.style.width = `${((currentIdx + 1) / 80) * 100}%`;

            // Update Text
            qTextEn.innerText = `${currentIdx + 1}. ${q.en}`;
            qTextHi.innerText = q.hi;

            // Reset Hint & Explanation
            hintBox.classList.add('hidden');
            hintText.innerText = q.hint;
            explanationBox.classList.add('hidden');

            // Render Options
            optionsContainer.innerHTML = '';
            
            // Randomize options order per question or keep mapped securely. Let's map options with their original index to track correctness.
            let optionsWithIndex = q.options.map((opt, idx) => ({ opt, idx }));
            
            // To ensure non-repetitive deterministic presentation, let's shuffle options securely using question index salt or render directly if preset.
            // Requirement 5: Programmatically shuffle answer choices so correct answer position varies.
            // We can shuffle optionsWithIndex using a stable method based on currentIdx.
            optionsWithIndex.sort((a, b) => ((currentIdx * 7 + a.idx * 13) % 11) - ((currentIdx * 7 + b.idx * 13) % 11));

            optionsWithIndex.forEach((item, displayIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 hover:bg-slate-700/50 transition text-sm sm:text-base font-medium flex items-center justify-between group`;
                
                const optionLetter = String.fromCharCode(65 + displayIdx);
                
                btn.innerHTML = `
                    <span class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-xs font-bold text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white transition">${optionLetter}</span>
                        <span class="text-slate-200">${item.opt}</span>
                    </span>
                `;

                // Check if already answered
                const existingAnswer = userAnswers[currentIdx];
                if (existingAnswer !== null) {
                    btn.disabled = true;
                    if (item.idx === q.answer) {
                        btn.classList.add('bg-emerald-950/40', 'border-emerald-500/50', 'text-emerald-200');
                        btn.querySelector('span span:first-child').classList.replace('bg-slate-800', 'bg-emerald-600');
                        btn.querySelector('span span:first-child').classList.replace('text-indigo-400', 'text-white');
                    } else if (existingAnswer === item.idx) {
                        btn.classList.add('bg-rose-950/40', 'border-rose-500/50', 'text-rose-200');
                        btn.querySelector('span span:first-child').classList.replace('bg-slate-800', 'bg-rose-600');
                        btn.querySelector('span span:first-child').classList.replace('text-indigo-400', 'text-white');
                    }
                } else {
                    btn.onclick = () => selectOption(item.idx, q.answer, btn);
                }

                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation
            if (userAnswers[currentIdx] !== null) {
                showExplanationBox(userAnswers[currentIdx] === q.answer, q);
            }

            // Navigation button states
            prevBtn.disabled = currentIdx === 0;
            nextBtn.disabled = currentIdx === quizData.length - 1;
            scoreDisplay.innerText = score;
        }

        function selectOption(selectedIndex, correctIndex, selectedBtn) {
            userAnswers[currentIdx] = selectedIndex;
            const isCorrect = selectedIndex === correctIndex;

            if (isCorrect) {
                score++;
                scoreDisplay.innerText = score;
            }

            // Highlight all option buttons
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.disabled = true;
            });

            // Re-render to show correct/incorrect styling accurately
            loadQuestion();
        }

        function showExplanationBox(isCorrect, q) {
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mt-4 p-4 rounded-xl border bg-emerald-950/30 border-emerald-500/40 text-emerald-200 text-sm animate-fade-in";
                explanationTitle.innerHTML = "✅ Correct Answer! / सही उत्तर!";
            } else {
                explanationBox.className = "mt-4 p-4 rounded-xl border bg-rose-950/30 border-rose-500/40 text-rose-200 text-sm animate-fade-in";
                explanationTitle.innerHTML = "❌ Incorrect Answer! / गलत उत्तर!";
            }
            explanationText.innerHTML = `<strong>Explanation / स्पष्टीकरण:</strong> ${q.explanation}`;
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= 80) {
                currentIdx = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert('Please enter a valid question number between 1 and 80.');
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function resetQuiz() {
            if (confirm('Are you sure you want to reset the quiz? All your progress will be cleared.')) {
                currentIdx = 0;
                score = 0;
                userAnswers = new Array(quizData.length).fill(null);
                scoreDisplay.innerText = score;
                loadQuestion();
            }
        }

        // Initialize on load
        window.onload = () => {
            loadQuestion();
        };
    </script>
