        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredCurrent = false;

        // DOM Elements
        const questionCounter = document.getElementById('question-counter');
        const questionEn = document.getElementById('question-en');
        const questionHi = document.getElementById('question-hi');
        const optionsContainer = document.getElementById('options-container');
        const hintToggle = document.getElementById('hint-toggle');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const scoreDisplay = document.getElementById('score-display');
        const totalDisplay = document.getElementById('total-display');
        const pageTag = document.getElementById('page-tag');
        const progressBar = document.getElementById('progress-bar');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');

        totalDisplay.textContent = quizData.length;

        function loadQuestion(index) {
            const q = quizData[index];
            questionCounter.textContent = `Question ${index + 1} of ${quizData.length}`;
            questionEn.textContent = `${index + 1}. ${q.qEn}`;
            questionHi.textContent = q.qHi;
            pageTag.textContent = q.page;

            // Progress bar update
            progressBar.style.width = `${((index + 1) / quizData.length) * 100}%`;

            // Hint setup
            hintBox.textContent = q.hint;
            hintBox.classList.add('hidden');

            // Explanation setup
            explanationBox.classList.add('hidden');
            explanationBox.innerHTML = '';
            explanationBox.className = 'hidden mb-6 p-4 rounded-xl border transition-all';

            // Options setup
            optionsContainer.innerHTML = '';
            answeredCurrent = userAnswers[index] !== null;

            q.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 font-medium text-sm sm:text-base transition flex items-center justify-between group';
                
                const spanText = document.createElement('span');
                spanText.textContent = `${String.fromCharCode(65 + optIdx)}. ${opt}`;
                btn.appendChild(spanText);

                if (answeredCurrent) {
                    btn.disabled = true;
                    if (optIdx === q.ans) {
                        btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                    } else if (userAnswers[index] === optIdx) {
                        btn.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                    }
                } else {
                    btn.addEventListener('click', () => selectOption(index, optIdx));
                }

                optionsContainer.appendChild(btn);
            });

            if (answeredCurrent) {
                showExplanation(index);
            }

            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? 'Finish Quiz →' : 'Next →';
        }

        function selectOption(qIdx, optIdx) {
            if (userAnswers[qIdx] !== null) return;

            userAnswers[qIdx] = optIdx;
            answeredCurrent = true;

            const q = quizData[qIdx];
            if (optIdx === q.ans) {
                score++;
                scoreDisplay.textContent = score;
            }

            // Refresh option button styles
            const buttons = optionsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === q.ans) {
                    buttons[i].classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                } else if (i === optIdx) {
                    buttons[i].classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                }
            }

            showExplanation(qIdx);
        }

        function showExplanation(qIdx) {
            const q = quizData[qIdx];
            const isCorrect = userAnswers[qIdx] === q.ans;

            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = 'mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-300 text-emerald-900 transition-all';
                explanationBox.innerHTML = `<h4 class="font-bold text-sm mb-1">✅ Correct! (सत्य उत्तर)</h4><p class="text-xs sm:text-sm leading-relaxed">${q.exp}</p>`;
            } else {
                explanationBox.className = 'mb-6 p-4 rounded-xl border bg-rose-50 border-rose-300 text-rose-900 transition-all';
                explanationBox.innerHTML = `<h4 class="font-bold text-sm mb-1">❌ Incorrect. (असत्य)</h4><p class="text-xs sm:text-sm leading-relaxed"><strong>Correct Answer:</strong> ${q.options[q.ans]}<br><br>${q.exp}</p>`;
            }
        }

        // Event Listeners
        hintToggle.addEventListener('click', () => {
            hintBox.classList.toggle('hidden');
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${quizData.length}.`);
            }
        });

        jumpBtn.addEventListener('click', () => {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion(currentIndex);
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        });

        jumpInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                jumpBtn.click();
            }
        });

        // Initialize First Question
        loadQuestion(currentIndex);
    </script>
