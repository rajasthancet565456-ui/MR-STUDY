                </button>

                <span class="font-bold">Hint:</span> <span id="hint-text"></span>

                <h3 id="q-text-hi" class="text-base font-medium text-teal-200/90"></h3>
            </div>

            <!-- Options Grid -->

                <!-- Options populated dynamically -->
            </div>

            <!-- Explanation Box (Revealed after selection) -->

                <p id="explanation-text" class="text-slate-300 text-xs leading-relaxed"></p>
            </div>
        </div>

        <!-- Navigation Controls -->

            <button id="prev-btn" onclick="prevQuestion()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-5 py-2.5 rounded-xl text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed">

        let currentQuestion = 0;

        let userAnswers = new Array(questionsData.length).fill(null);

        const totalQuestionsCountEl = document.getElementById('total-questions-count');
        const currentQNumEl = document.getElementById('current-q-num');
        const progressBarEl = document.getElementById('progress-bar');
        const progressPercentEl = document.getElementById('progress-percent');
        const scoreEl = document.getElementById('score');
        
        const qSourceBadgeEl = document.getElementById('q-source-badge');
        const qTextEnEl = document.getElementById('q-text-en');
        const qTextHiEl = document.getElementById('q-text-hi');
        const optionsContainerEl = document.getElementById('options-container');
        const hintBoxEl = document.getElementById('hint-box');
        const hintTextEl = document.getElementById('hint-text');
        const explanationBoxEl = document.getElementById('explanation-box');
        const explanationTitleEl = document.getElementById('explanation-title');
        const explanationTextEl = document.getElementById('explanation-text');
        
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        totalQuestionsCountEl.innerText = questionsData.length;

        function loadQuestion(index) {
            currentQuestion = index;
            const q = questionsData[index];

            // Update header & progress
            currentQNumEl.innerText = index + 1;
            const percent = ((index + 1) / questionsData.length) * 100;
            progressBarEl.style.width = percent + '%';
            progressPercentEl.innerText = percent.toFixed(1) + '%';

            // Badge
            qSourceBadgeEl.innerText = `Page ${q.page} • Question ${index + 1}`;

            // Text
            qTextEnEl.innerText = `${index + 1}. ${q.en}`;
            qTextHiEl.innerText = q.hi;

            // Hint
            hintBoxEl.classList.add('hidden');
            hintTextEl.innerText = `${q.hintEn} / ${q.hintHi}`;

            // Options mapping with deterministic assignment based on index to ensure shuffling without random loops
            // We create indexed option objects to track correct choice
            let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            
            // Pseudo-random deterministic shuffle shift based on question index to vary correct option position (A, B, C, D)
            let shift = index % 4;
            for (let s = 0; s < shift; s++) {
                optionsWithIndex.push(optionsWithIndex.shift());
            }

            optionsContainerEl.innerHTML = '';
            optionsWithIndex.forEach((optObj, renderIdx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/50 hover:bg-slate-700/60 transition text-sm flex items-center justify-between group';
                
                const optionLetter = String.fromCharCode(65 + renderIdx);
                
                let optionInnerHtml = `<span class="flex items-center gap-3"><span class="w-6 h-6 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-xs font-bold text-teal-400 group-hover:border-teal-400">${optionLetter}</span><span>${optObj.text}</span></span>`;
                
                btn.innerHTML = optionInnerHtml;

                // Check if already answered
                if (userAnswers[index] !== null) {
                    btn.disabled = true;
                    if (optObj.originalIndex === q.correct) {
                        btn.classList.add('bg-emerald-950/60', 'border-emerald-500/50', 'text-emerald-200');
                    } else if (userAnswers[index] === optObj.originalIndex) {
                        btn.classList.add('bg-rose-950/60', 'border-rose-500/50', 'text-rose-200');
                    }
                } else {
                    btn.onclick = () => selectOption(optObj.originalIndex, q.correct, index);
                }

                optionsContainerEl.appendChild(btn);
            });

            // Explanation box state
            if (userAnswers[index] !== null) {
                showExplanation(q, userAnswers[index] === q.correct);
            } else {
                explanationBoxEl.classList.add('hidden');
            }

            // Nav buttons state
            prevBtn.disabled = index === 0;
            nextBtn.innerText = index === questionsData.length - 1 ? 'Finish Quiz 🏁' : 'Next →';
        }

        function selectOption(selectedIndex, correctIndex, qIdx) {
            userAnswers[qIdx] = selectedIndex;
            const isCorrect = selectedIndex === correctIndex;

            if (isCorrect) {
                score++;
                scoreEl.innerText = score;
            }

            loadQuestion(qIdx);
        }

        function showExplanation(q, isCorrect) {
            explanationBoxEl.classList.remove('hidden');
            if (isCorrect) {
                explanationBoxEl.className = 'mt-6 p-4 rounded-xl border bg-emerald-950/30 border-emerald-500/40 text-sm';
                explanationTitleEl.innerHTML = '<span class="text-emerald-400">✅ Correct Answer! / सही उत्तर!</span>';
            } else {
                explanationBoxEl.className = 'mt-6 p-4 rounded-xl border bg-rose-950/30 border-rose-500/40 text-sm';
                explanationTitleEl.innerHTML = '<span class="text-rose-400">❌ Incorrect Answer. / गलत उत्तर।</span>';
            }
            explanationTextEl.innerHTML = `<strong>English:</strong> ${q.explanationEn}<br><br><strong>हिन्दी:</strong> ${q.explanationHi}`;
        }

        function toggleHint() {
            hintBoxEl.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestion < questionsData.length - 1) {
                loadQuestion(currentQuestion + 1);
            } else {
                alert(`Quiz Completed! 🎉\nYour Final Score: ${score} / ${questionsData.length}`);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                loadQuestion(currentQuestion - 1);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= questionsData.length) {
                loadQuestion(val - 1);
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${questionsData.length}`);
            }
        }

        // Initial load
        loadQuestion(0);
    </script>
