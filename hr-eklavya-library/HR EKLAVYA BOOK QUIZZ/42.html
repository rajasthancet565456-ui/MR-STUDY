<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Haryana GK Master Quiz (80 Qs)</h1>
            <div id="score-display" class="text-sm font-semibold bg-indigo-700 px-3 py-1 rounded-full">Score: 0 / 80</div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto w-full p-4 flex-grow flex flex-col justify-center">
        <!-- Progress Bar -->
        <div class="mb-4">
            <div class="flex justify-between text-xs font-medium text-slate-500 mb-1">
                <span id="progress-text">Question 1 of 80</span>
                <span id="page-indicator">Page 1 Range</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2">
                <div id="progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 1.25%;"></div>
            </div>
        </div>

        <!-- Quiz Card -->
        <div class="bg-white rounded-xl shadow-lg p-6 md:p-8 relative">
            <div class="absolute top-4 right-4 bg-slate-100 text-slate-600 text-xs font-bold px-2.5 py-1 rounded">
                Q.<span id="q-num">1</span>
            </div>
            
            <!-- Question Text -->
            <div class="mb-6">
                <h2 id="q-hindi" class="text-lg font-bold text-slate-900 mb-2"></h2>
                <h3 id="q-english" class="text-sm font-medium text-slate-600 italic"></h3>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Options injected via JS -->
            </div>

            <!-- Hint Section -->
            <div class="mb-4">
                <button onclick="toggleHint()" class="text-xs text-indigo-600 font-semibold hover:underline focus:outline-none">
                    💡 Show Hint / संकेत देखें
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg">
                    <span id="hint-text"></span>
                </div>
            </div>

            <!-- Explanation Section -->
            <div id="explanation-box" class="hidden mb-6 p-4 bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm rounded-lg">
                <h4 class="font-bold mb-1">Explanation / स्पष्टीकरण:</h4>
                <p id="explanation-text"></p>
            </div>

            <!-- Navigation Controls -->
            <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                <button onclick="prevQuestion()" id="prev-btn" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-sm transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Previous / पिछला
                </button>
                
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-500">Jump:</span>
                    <input type="number" id="jump-input" min="1" max="80" class="w-16 px-2 py-1 border border-slate-300 rounded text-center text-sm focus:outline-none focus:border-indigo-500" onchange="jumpToQuestion(this.value)">
                </div>

                <button onclick="nextQuestion()" id="next-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm transition">
                    Next / अगला
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
        Haryana GK Interactive Assessment App &copy; 2026 | Bilingual (Hindi & English)
    </footer>

        let currentQuestion = 0;
        let score = 0;
        let answered = new Array(quizData.length).fill(false);
        let userAnswers = new Array(quizData.length).fill(null);

        // DOM Elements
        const qNumEl = document.getElementById('q-num');
        const qHindiEl = document.getElementById('q-hindi');
        const qEnglishEl = document.getElementById('q-english');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const pageIndicator = document.getElementById('page-indicator');
        const scoreDisplay = document.getElementById('score-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion(index) {
            const q = quizData[index];
            qNumEl.textContent = index + 1;
            qHindiEl.textContent = q.hindi;
            qEnglishEl.textContent = q.english;
            hintText.textContent = q.hint;
            explanationText.textContent = q.explanation;

            // Update Progress
            const progressPercent = ((index + 1) / quizData.length) * 100;
            progressBar.style.width = progressPercent + '%';
            progressText.textContent = `Question ${index + 1} of ${quizData.length}`;
            pageIndicator.textContent = `Source: Page ${q.page}`;
            jumpInput.value = index + 1;

            // Reset UI states
            hintBox.classList.add('hidden');
            if (answered[index]) {
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            // Render Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border text-sm font-medium transition flex justify-between items-center ${
                    answered[index]
                        ? i === q.answer
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-900'
                            : userAnswers[index] === i
                            ? 'bg-rose-50 border-rose-300 text-rose-900'
                            : 'bg-white border-slate-200 text-slate-700 opacity-60'
                        : 'bg-white border-slate-200 hover:border-indigo-300 hover:bg-slate-50 text-slate-700'
                }`;
                btn.innerHTML = `<span>${String.fromCharCode(65 + i)}. ${opt}</span>`;
                if (!answered[index]) {
                    btn.onclick = () => selectOption(index, i);
                } else {
                    btn.disabled = true;
                }
                optionsContainer.appendChild(btn);
            });

            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? 'Finish / समाप्त' : 'Next / अगला';
        }

        function selectOption(qIndex, optIndex) {
            if (answered[qIndex]) return;
            answered[qIndex] = true;
            userAnswers[qIndex] = optIndex;

            const q = quizData[qIndex];
            if (optIndex === q.answer) {
                score++;
                scoreDisplay.textContent = `Score: ${score} / ${quizData.length}`;
            }

            loadQuestion(qIndex);
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion(currentQuestion);
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion(currentQuestion);
            }
        }

        function jumpToQuestion(val) {
            const qNum = parseInt(val) - 1;
            if (qNum >= 0 && qNum < quizData.length) {
                currentQuestion = qNum;
                loadQuestion(currentQuestion);
            } else {
                jumpInput.value = currentQuestion + 1;
            }
        }

        // Initialize first question
        loadQuestion(0);
    </script>
