        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const questionCounter = document.getElementById('question-counter');
        const questionSource = document.getElementById('question-source');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const currentQ = quizData[currentIndex];
            questionCounter.textContent = `Question ${currentIndex + 1} of ${quizData.length}`;
            questionSource.textContent = currentQ.page;
            questionText.innerHTML = `${currentQ.qEng}<br><span class="text-indigo-600 font-normal text-base sm:text-lg">${currentQ.qHindi}</span>`;
            
            hintBox.textContent = currentQ.hint;
            hintBox.classList.add('hidden');
            document.getElementById('hint-btn').textContent = "Show Hint / संकेत दिखाएं";

            explanationText.textContent = currentQ.explanation;
            
            const answeredOption = userAnswers[currentIndex];

            optionsContainer.innerHTML = '';
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-lg border text-sm sm:text-base font-medium transition flex justify-between items-center ${getOptionStyle(index, answeredOption, currentQ.answer)}`;
                btn.innerHTML = `<span>${option}</span>`;
                
                if (answeredOption !== null) {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => selectOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            if (answeredOption !== null) {
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === quizData.length - 1;
            
            updateProgress();
        }

        function getOptionStyle(optionIndex, userSelection, correctIndex) {
            if (userSelection === null) {
                return "bg-white border-slate-200 text-slate-700 hover:bg-indigo-50 hover:border-indigo-300";
            }
            if (optionIndex === correctIndex) {
                return "bg-emerald-50 border-emerald-500 text-emerald-900 font-semibold";
            }
            if (optionIndex === userSelection && userSelection !== correctIndex) {
                return "bg-rose-50 border-rose-500 text-rose-900 font-semibold";
            }
            return "bg-white border-slate-200 text-slate-400 opacity-60";
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentIndex] !== null) return;

            userAnswers[currentIndex] = selectedIndex;
            const currentQ = quizData[currentIndex];

            if (selectedIndex === currentQ.answer) {
                score++;
                scoreDisplay.textContent = score;
            }

            loadQuestion();
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
            const btn = document.getElementById('hint-btn');
            if (hintBox.classList.contains('hidden')) {
                btn.textContent = "Show Hint / संकेत दिखाएं";
            } else {
                btn.textContent = "Hide Hint / संकेत छुपाएं";
            }
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function updateProgress() {
            const percent = ((currentIndex + 1) / quizData.length) * 100;
            progressBar.style.width = `${percent}%`;
        }

        // Initialize first load
        loadQuestion();
    </script>
