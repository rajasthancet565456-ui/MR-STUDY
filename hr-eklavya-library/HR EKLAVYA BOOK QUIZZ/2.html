        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = {}; // stores user selected option index

        const engEl = document.getElementById('question-eng');
        const hinEl = document.getElementById('question-hin');
        const optionsEl = document.getElementById('options-container');
        const sourceEl = document.getElementById('q-source');
        const categoryEl = document.getElementById('q-category');
        const scoreEl = document.getElementById('score-val');
        const currentQNumEl = document.getElementById('current-q-num');
        const progressBar = document.getElementById('progress-bar');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            engEl.textContent = `${currentQuestionIndex + 1}. ${q.eng}`;
            hinEl.textContent = q.hin;
            sourceEl.textContent = `${q.source} • Question ${currentQuestionIndex + 1}`;
            categoryEl.textContent = q.category;
            currentQNumEl.textContent = currentQuestionIndex + 1;
            scoreEl.textContent = score;

            // Update Progress Bar
            const progressPct = ((currentQuestionIndex + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPct}%`;

            // Reset Hint & Explanation
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            
            if (userAnswers[currentQuestionIndex] !== undefined) {
                showExplanationState(q, userAnswers[currentQuestionIndex]);
            } else {
                explanationBox.classList.add('hidden');
                renderOptions(q, null);
            }
        }

        function renderOptions(q, selectedOptIdx) {
            optionsEl.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-xl border transition-all text-sm sm:text-base font-medium flex items-center justify-between `;
                
                let btnStyle = "bg-slate-900/50 border-slate-700 text-slate-200 hover:bg-slate-700/50";
                
                if (selectedOptIdx !== null) {
                    if (idx === q.correct) {
                        btnStyle = "bg-emerald-950/60 border-emerald-600 text-emerald-200";
                    } else if (idx === selectedOptIdx) {
                        btnStyle = "bg-rose-950/60 border-rose-600 text-rose-200";
                    } else {
                        btnStyle = "bg-slate-900/30 border-slate-800 text-slate-500 opacity-60";
                    }
                    btn.disabled = true;
                }

                btn.className += btnStyle;
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${opt}</span>`;
                
                if (selectedOptIdx === null) {
                    btn.onclick = () => selectOption(idx);
                }
                
                optionsEl.appendChild(btn);
            });
        }

        function selectOption(selectedIdx) {
            const q = quizData[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = selectedIdx;

            if (selectedIdx === q.correct) {
                score++;
                scoreEl.textContent = score;
            }

            showExplanationState(q, selectedIdx);
            renderOptions(q, selectedIdx);
        }

        function showExplanationState(q, selectedIdx) {
            explanationBox.classList.remove('hidden');
            const isCorrect = selectedIdx === q.correct;
            explanationText.innerHTML = `<strong class="${isCorrect ? 'text-emerald-400' : 'text-rose-400'}">${isCorrect ? 'Correct! / सही उत्तर!' : 'Incorrect. / गलत उत्तर।'}</strong> ${q.exp}`;
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of 100.`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= 100) {
                currentQuestionIndex = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert('Please enter a valid question number between 1 and 100.');
            }
        }

        // Initialize first question on load
        window.onload = loadQuestion;
    </script>
