        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredQuestions = new Array(quizData.length).fill(false);

        const qTextEn = document.getElementById("q-text-en");
        const qTextHi = document.getElementById("q-text-hi");
        const optionsContainer = document.getElementById("options-container");
        const questionTag = document.getElementById("question-tag");
        const sourcePageTag = document.getElementById("source-page-tag");
        const scoreVal = document.getElementById("score-val");
        const totalVal = document.getElementById("total-val");
        const progressVal = document.getElementById("progress-val");
        const progressBar = document.getElementById("progress-bar");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const hintBox = document.getElementById("hint-box");
        const explanationBox = document.getElementById("explanation-box");
        const explanationText = document.getElementById("explanation-text");
        const jumpInput = document.getElementById("jump-input");

        totalVal.textContent = quizData.length;

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            questionTag.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            sourcePageTag.textContent = q.page;
            qTextEn.textContent = `${currentQuestionIndex + 1}. ${q.en}`;
            qTextHi.textContent = q.hi;

            // Hint setup
            hintBox.textContent = q.hint;
            hintBox.classList.add("hidden");

            // Explanation setup
            if (answeredQuestions[currentQuestionIndex]) {
                explanationText.textContent = q.explanation;
                explanationBox.classList.remove("hidden");
            } else {
                explanationBox.classList.add("hidden");
            }

            // Render Options
            optionsContainer.innerHTML = "";
            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/50 hover:bg-slate-700/50 transition-all duration-200 text-sm md:text-base flex items-center justify-between group";
                
                const spanText = document.createElement("span");
                spanText.textContent = opt;
                btn.appendChild(spanText);

                const badge = document.createElement("span");
                badge.className = "text-xs px-2 py-1 rounded bg-slate-800 text-slate-400 group-hover:bg-slate-700 group-hover:text-slate-200";
                badge.textContent = String.fromCharCode(65 + idx);
                btn.appendChild(badge);

                if (answeredQuestions[currentQuestionIndex]) {
                    btn.disabled = true;
                    if (idx === q.answer) {
                        btn.classList.add("bg-emerald-900/40", "border-emerald-500", "text-emerald-200");
                        badge.classList.add("bg-emerald-600", "text-white");
                    } else if (userAnswers[currentQuestionIndex] === idx) {
                        btn.classList.add("bg-rose-900/40", "border-rose-500", "text-rose-200");
                        badge.classList.add("bg-rose-600", "text-white");
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                optionsContainer.appendChild(btn);
            });

            // Nav buttons state
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Finish" : "Next";

            updateProgress();
        }

        function selectOption(selectedIdx) {
            if (answeredQuestions[currentQuestionIndex]) return;

            answeredQuestions[currentQuestionIndex] = true;
            userAnswers[currentQuestionIndex] = selectedIdx;

            const q = quizData[currentQuestionIndex];
            if (selectedIdx === q.answer) {
                score++;
                scoreVal.textContent = score;
            }

            explanationText.textContent = q.explanation;
            explanationBox.classList.remove("hidden");

            loadQuestion();
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentQuestionIndex = val - 1;
                loadQuestion();
                jumpInput.value = "";
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function toggleHint() {
            hintBox.classList.toggle("hidden");
        }

        function updateProgress() {
            const answeredCount = answeredQuestions.filter(Boolean).length;
            const percentage = Math.round((answeredCount / quizData.length) * 100);
            progressVal.textContent = `${percentage}%`;
            progressBar.style.width = `${percentage}%`;
        }

        // Initialize Quiz on Load
        window.onload = loadQuestion;
    </script>
