        let currentIdx = 0;
        let score = 0;
        let answered = new Array(questions.length).fill(false);
        let userAnswers = new Array(questions.length).fill(null);

        const questionCounter = document.getElementById('question-counter');
        const sourceTag = document.getElementById('source-tag');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const quizCard = document.getElementById('quiz-card');
        const completionScreen = document.getElementById('completion-screen');

        function loadQuestion() {
            const q = questions[currentIdx];
            questionCounter.innerText = `Question ${currentIdx + 1} of ${questions.length}`;
            sourceTag.innerText = q.page;
            questionText.innerText = q.question;
            jumpInput.value = currentIdx + 1;

            // Reset hint and explanation
            hintBox.classList.add('hidden');
            hintBox.innerText = q.hint;
            explanationBox.classList.add('hidden');
            explanationText.innerText = q.explanation;

            // Render options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-lg border text-sm sm:text-base font-medium transition flex justify-between items-center ${getOptionStyle(index, q.answer)}`;
                btn.innerText = `${String.fromCharCode(65 + index)}. ${opt}`;
                
                if (answered[currentIdx]) {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => selectOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            // Update navigation buttons
            prevBtn.disabled = currentIdx === 0;
            nextBtn.innerText = currentIdx === questions.length - 1 ? 'समाप्त / Finish →' : 'अगला / Next →';

            // Update Progress Bar
            const progress = ((currentIdx + 1) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;
            scoreDisplay.innerText = `Score: ${score} / ${questions.length}`;
        }

        function getOptionStyle(index, correctIndex) {
            if (!answered[currentIdx]) {
                return 'bg-white border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer';
            }
            if (index === correctIndex) {
                return 'bg-emerald-100 border-emerald-400 text-emerald-900 font-semibold';
            }
            if (index === userAnswers[currentIdx] && index !== correctIndex) {
                return 'bg-rose-100 border-rose-400 text-rose-900';
            }
            return 'bg-white border-slate-200 text-slate-400 opacity-60';
        }

        function selectOption(index) {
            if (answered[currentIdx]) return;
            answered[currentIdx] = true;
            userAnswers[currentIdx] = index;

            if (index === questions[currentIdx].answer) {
                score++;
            }

            explanationBox.classList.remove('hidden');
            loadQuestion();
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showCompletion();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            let num = parseInt(val);
            if (num >= 1 && num <= questions.length) {
                currentIdx = num - 1;
                loadQuestion();
            } else {
                jumpInput.value = currentIdx + 1;
            }
        }

        function showCompletion() {
            quizCard.classList.add('hidden');
            completionScreen.classList.remove('hidden');
            document.getElementById('final-score-text').innerText = `You scored ${score} out of ${questions.length} (${Math.round((score/questions.length)*100)}%)`;
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            answered.fill(false);
            userAnswers.fill(null);
            completionScreen.classList.add('hidden');
            quizCard.classList.remove('hidden');
            loadQuestion();
        }

        // Initialize quiz on load
        loadQuestion();
    </script>
