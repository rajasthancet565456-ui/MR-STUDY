        let currentIdx = 0;
        let score = 0;
        let attempted = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        // Shuffle options once for randomization while keeping track of correct answer index
        const processedQuiz = quizData.map((q) => {
            let options = [...q.options];
            let correctOptionText = options[q.correct];
            // Shuffle options array
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            let newCorrectIdx = options.indexOf(correctOptionText);
            return {
                ...q,
                options: options,
                correct: newCorrectIdx
            };
        });

        function loadQuestion() {
            const q = processedQuiz[currentIdx];
            document.getElementById('current-q-num').textContent = currentIdx + 1;
            document.getElementById('page-source-badge').textContent = q.page;
            document.getElementById('question-text').textContent = `${currentIdx + 1}. ${q.qEn}`;
            document.getElementById('question-text-hi').textContent = q.qHi;

            // Progress bar
            const progressPercent = ((currentIdx + 1) / processedQuiz.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Hint
            document.getElementById('hint-text').textContent = q.hint;
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-btn').textContent = "💡 Show Hint / संकेत देखें";

            // Explanation
            const explanationBox = document.getElementById('explanation-box');
            document.getElementById('explanation-text').textContent = q.explanation;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const userAns = userAnswers[currentIdx];

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 font-medium text-slate-700 bg-white hover:bg-slate-50 transition flex items-center justify-between group";
                
                let indicatorTag = String.fromCharCode(65 + idx); // A, B, C, D
                
                btn.innerHTML = `
                    <span class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg bg-slate-100 group-hover:bg-indigo-100 group-hover:text-indigo-600 flex items-center justify-center text-xs font-bold text-slate-500 transition">${indicatorTag}</span>
                        <span>${opt}</span>
                    </span>
                `;

                if (userAns !== null) {
                    // Already answered
                    btn.disabled = true;
                    if (idx === q.correct) {
                        btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                    } else if (idx === userAns) {
                        btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-900');
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                optionsContainer.appendChild(btn);
            });

            if (userAns !== null) {
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            // Buttons state
            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').textContent = currentIdx === processedQuiz.length - 1 ? "Finish / Summary" : "Next →";
        }

        function selectOption(selectedIdx) {
            if (userAnswers[currentIdx] !== null) return; // already answered

            userAnswers[currentIdx] = selectedIdx;
            attempted++;
            document.getElementById('attempted').textContent = attempted;

            const q = processedQuiz[currentIdx];
            if (selectedIdx === q.correct) {
                score++;
                document.getElementById('score').textContent = score;
            }

            loadQuestion();
        }

        function nextQuestion() {
            if (currentIdx < processedQuiz.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showFinalSummary();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (!isNaN(val) && val >= 1 && val <= processedQuiz.length) {
                currentIdx = val - 1;
                loadQuestion();
                document.getElementById('jump-input').value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${processedQuiz.length}.`);
            }
        }

        function toggleHint() {
            const box = document.getElementById('hint-box');
            const btn = document.getElementById('hint-btn');
            if (box.classList.contains('hidden')) {
                box.classList.remove('hidden');
                btn.textContent = "💡 Hide Hint / संकेत छुपाएं";
            } else {
                box.classList.add('hidden');
                btn.textContent = "💡 Show Hint / संकेत देखें";
            }
        }

        function showFinalSummary() {
            const mainContainer = document.querySelector('main');
            let percentage = ((score / processedQuiz.length) * 100).toFixed(1);
            let performanceMsg = percentage >= 75 ? "Excellent! Outstanding Haryana GK preparation on Folk Songs & Saang." : percentage >= 50 ? "Good job! Keep revising for competitive exams." : "Keep practicing! Review the source material thoroughly.";

            mainContainer.innerHTML = `
                <div class="text-center py-8">
                    <div class="inline-flex p-4 bg-indigo-100 text-indigo-600 rounded-full text-4xl mb-4">🏆</div>
                    <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">Quiz Completed!</h2>
                    <p class="text-slate-600 mb-6">Here is your final performance overview for Haryana GK (Page 93 & 94).</p>
                    
                    <div class="max-w-xs mx-auto bg-slate-50 border border-slate-200 rounded-2xl p-6 mb-6 shadow-sm">
                        <div class="text-4xl font-extrabold text-indigo-600 mb-1">${score} / ${processedQuiz.length}</div>
                        <div class="text-sm font-semibold text-slate-500 mb-4">Score Percentage: ${percentage}%</div>
                        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden mb-2">
                            <div class="bg-indigo-600 h-2 rounded-full" style="width: ${percentage}%"></div>
                        </div>
                        <p class="text-xs text-slate-500 font-medium">${performanceMsg}</p>
                    </div>

                    <div class="flex justify-center gap-4">
                        <button onclick="restartQuiz()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition shadow-md">
                            🔄 Retake Quiz / पुनः प्रयास करें
                        </button>
                    </div>
                </div>
            `;
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            attempted = 0;
            userAnswers = new Array(processedQuiz.length).fill(null);
            document.getElementById('score').textContent = score;
            document.getElementById('attempted').textContent = attempted;
            location.reload();
        }

        // Initialize quiz on load
        window.onload = loadQuestion;
    </script>
