            </div>
        </div>

        <!-- Quiz Card -->

            <!-- Question Header / Meta -->
            <div class="flex justify-between items-center mb-4">
                <span id="q-number-tag" class="text-xs font-bold uppercase tracking-wider bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-md">Q1</span>
                <button id="hint-btn" onclick="toggleHint()" class="text-xs font-medium text-amber-600 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1">
                    💡 <span id="hint-btn-text">Show Hint</span>
                </button>
            </div>

            <!-- Hint Box -->
            <div id="hint-box" class="hidden mb-4 p-3 bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-lg">
                <strong>Hint:</strong> <span id="hint-text"></span>
            </div>

            <!-- Question Text (Bilingual) -->
            <div class="mb-6 space-y-2">
                <h2 id="q-text-en" class="text-lg sm:text-xl font-bold text-slate-900 leading-snug"></h2>
                <h3 id="q-text-hi" class="text-base sm:text-lg font-medium text-slate-700 leading-snug"></h3>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected options -->
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden mt-6 p-4 rounded-xl border transition-all">
                <div class="flex items-center gap-2 font-semibold mb-1" id="explanation-header">
                    <!-- Status Icon & Title -->
                </div>
                <p id="explanation-text" class="text-sm text-slate-700 leading-relaxed"></p>
            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-6">
            <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-start">
                <button onclick="prevQuestion()" id="prev-btn" class="px-4 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium rounded-xl text-sm shadow-sm transition disabled:opacity-50 disabled:cursor-not-allowed">
                    ← Previous
                </button>
                <div class="flex items-center gap-1 text-sm text-slate-600">
                    <span>Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="90" class="w-16 px-2 py-1 border border-slate-300 rounded-lg text-center text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" onchange="jumpToQuestion(this.value)">
                </div>
            </div>
            <button onclick="nextQuestion()" id="next-btn" class="w-full sm:w-auto px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl text-sm shadow-md transition">
                Next →
            </button>
        </div>

    </main>

        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredState = new Array(quizData.length).fill(false);

        const qNumberTag = document.getElementById('q-number-tag');
        const progressText = document.getElementById('progress-text');
        const pageTag = document.getElementById('page-tag');
        const progressBar = document.getElementById('progress-bar');
        const qTextEn = document.getElementById('q-text-en');
        const qTextHi = document.getElementById('q-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const hintBtnText = document.getElementById('hint-btn-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const currentScoreEl = document.getElementById('current-score');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const currentQ = quizData[currentIndex];
            
            // Meta updates
            qNumberTag.textContent = `Q${currentIndex + 1}`;
            progressText.textContent = `Question ${currentIndex + 1} of ${quizData.length}`;
            pageTag.textContent = `Page ${currentQ.page}`;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            jumpInput.value = currentIndex + 1;

            // Text updates
            qTextEn.textContent = currentQ.en;
            qTextHi.textContent = currentQ.hi;

            // Hint reset
            hintBox.classList.add('hidden');
            hintText.textContent = `${currentQ.hintEn} / ${currentQ.hintHi}`;
            hintBtnText.textContent = "Show Hint";

            // Options render
            optionsContainer.innerHTML = '';
            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border font-medium text-sm sm:text-base transition-all flex justify-between items-center ${
                    answeredState[currentIndex]
                        ? idx === currentQ.correct
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-semibold'
                            : userAnswers[currentIndex] === idx
                                ? 'bg-rose-50 border-rose-300 text-rose-900'
                                : 'bg-white border-slate-200 text-slate-600 opacity-60'
                        : 'bg-white border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/30 text-slate-700 shadow-sm'
                }`;
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${opt}</span>`;
                btn.disabled = answeredState[currentIndex];
                btn.onclick = () => selectOption(idx);
                optionsContainer.appendChild(btn);
            });

            // Explanation render
            if (answeredState[currentIndex]) {
                showExplanation(userAnswers[currentIndex] === currentQ.correct, currentQ);
            } else {
                explanationBox.classList.add('hidden');
            }

            // Button states
            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? "Finish Quiz" : "Next →";
        }

        function selectOption(selectedIndex) {
            if (answeredState[currentIndex]) return;

            answeredState[currentIndex] = true;
            userAnswers[currentIndex] = selectedIndex;

            const currentQ = quizData[currentIndex];
            const isCorrect = selectedIndex === currentQ.correct;

            if (isCorrect) {
                score++;
                currentScoreEl.textContent = score;
            }

            loadQuestion();
        }

        function showExplanation(isCorrect, currentQ) {
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mt-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900 transition-all";
                explanationHeader.innerHTML = `✅ <span class="text-emerald-800 font-bold">Correct Answer! (सही उत्तर)</span>`;
            } else {
                explanationBox.className = "mt-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900 transition-all";
                explanationHeader.innerHTML = `❌ <span class="text-rose-800 font-bold">Incorrect Answer (गलत उत्तर). Correct option was ${String.fromCharCode(65 + currentQ.correct)}.</span>`;
            }
            explanationText.innerHTML = `<strong>Explanation (स्पष्टीकरण):</strong><br>${currentQ.explanationEn}<br><span class="text-slate-600">${currentQ.explanationHindi}</span>`;
        }

        function toggleHint() {
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBtnText.textContent = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintBtnText.textContent = "Show Hint";
            }
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score: ${score} / ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            const qNum = parseInt(val);
            if (qNum >= 1 && qNum <= quizData.length) {
                currentIndex = qNum - 1;
                loadQuestion();
            } else {
                jumpInput.value = currentIndex + 1;
            }
        }

        // Initialize Quiz on load
        window.onload = loadQuestion;
    </script>
