    </header>

            </div>
            <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-500 h-2.5 transition-all duration-300" style="width: 1.25%;"></div>
            </div>
        </div>

        <!-- Question Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 sm:p-8 shadow-xl">
            
            <!-- Question Text -->
            <div class="mb-6">
                <h2 id="question-text" class="text-base sm:text-lg font-semibold text-slate-100 leading-relaxed mb-2">
                    <!-- Dynamic Question text loaded via JS -->
                </h2>
                <p id="question-text-hi" class="text-sm sm:text-base text-indigo-200 font-medium leading-relaxed border-l-2 border-indigo-500 pl-3">
                    <!-- Dynamic Hindi Text -->
                </p>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically Generated Options -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs font-medium text-amber-400 hover:text-amber-300 flex items-center gap-1.5 transition">
                    <span>💡 Toggle Hint / संकेत देखें</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-950/30 border border-amber-700/40 rounded-lg text-xs text-amber-200">
                    <!-- Hint text -->
                </div>
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden mt-4 p-4 rounded-lg border text-sm">
                <!-- Explanation text -->
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-wrap justify-between items-center gap-4 mt-8 pt-4 border-t border-slate-700">
                <button onclick="prevQuestion()" id="prev-btn" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed">
                    &larr; Previous / पिछला
                </button>

                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400">Jump to Q:</span>
                    <input type="number" id="jump-input" min="1" max="80" class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-center text-sm text-slate-200 focus:outline-none focus:border-indigo-500" onchange="jumpToQuestion(this.value)">
                </div>

                <button onclick="nextQuestion()" id="next-btn" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition shadow-lg shadow-indigo-600/20">
                    Next / अगला &rarr;
                </button>
            </div>

        </div>
    </main>

        let currentIndex = 0;
        let score = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredStatus = new Array(quizData.length).fill(false);

        // DOM elements
        const questionTextEl = document.getElementById('question-text');
        const questionTextHiEl = document.getElementById('question-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const currentQNumEl = document.getElementById('current-q-num');
        const totalQNumEl = document.getElementById('total-q-num');
        const progressBar = document.getElementById('progress-bar');
        const scoreValEl = document.getElementById('score-val');
        const correctCountEl = document.getElementById('correct-count');
        const incorrectCountEl = document.getElementById('incorrect-count');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const jumpInput = document.getElementById('jump-input');
        const pageIndicator = document.getElementById('page-indicator');

        totalQNumEl.textContent = quizData.length;

        function loadQuestion(index) {
            const q = quizData[index];
            currentQNumEl.textContent = index + 1;
            jumpInput.value = index + 1;
            
            // Set page range indicator
            if (q.page === 1) {
                pageIndicator.textContent = "Page 1 Range (Q1 - Q40)";
                pageIndicator.className = "font-medium bg-indigo-900/50 text-indigo-300 px-2.5 py-1 rounded text-xs border border-indigo-700/55";
            } else {
                pageIndicator.textContent = "Page 2 Range (Q41 - Q80)";
                pageIndicator.className = "font-medium bg-purple-900/50 text-purple-300 px-2.5 py-1 rounded text-xs border border-purple-700/55";
            }

            questionTextEl.textContent = `${index + 1}. ${q.qEn}`;
            questionTextHiEl.textContent = q.qHi;

            // Progress bar update
            const progressPct = ((index + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPct}%`;

            // Reset hint and explanation boxes
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            explanationBox.classList.add('hidden');
            explanationBox.textContent = "";

            // Render options
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-lg border border-slate-700 bg-slate-900/60 hover:bg-slate-700/50 text-slate-200 text-sm font-medium transition flex items-center justify-between group";
                
                const spanText = document.createElement('span');
                spanText.textContent = `${String.fromCharCode(65 + optIdx)}. ${opt}`;
                btn.appendChild(spanText);

                // If already answered, style appropriately
                if (answeredStatus[index]) {
                    btn.disabled = true;
                    if (optIdx === q.correct) {
                        btn.className = "w-full text-left p-3.5 rounded-lg border border-emerald-500 bg-emerald-950/40 text-emerald-200 text-sm font-medium flex items-center justify-between";
                    } else if (userAnswers[index] === optIdx) {
                        btn.className = "w-full text-left p-3.5 rounded-lg border border-rose-500 bg-rose-950/40 text-rose-200 text-sm font-medium flex items-center justify-between";
                    }
                } else {
                    btn.onclick = () => selectOption(index, optIdx);
                }

                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation
            if (answeredStatus[index]) {
                showExplanation(index);
            }

            // Button controls
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? "Finish / समाप्त" : "Next / अगला \u2192";
        }

        function selectOption(qIndex, selectedOptIdx) {
            if (answeredStatus[qIndex]) return;

            answeredStatus[qIndex] = true;
            userAnswers[qIndex] = selectedOptIdx;

            const q = quizData[qIndex];
            const isCorrect = selectedOptIdx === q.correct;

            if (isCorrect) {
                score += 2;
                correctCount += 1;
            } else {
                incorrectCount += 1;
            }

            scoreValEl.textContent = score;
            correctCountEl.textContent = correctCount;
            incorrectCountEl.textContent = incorrectCount;

            // Refresh options styling
            loadQuestion(qIndex);
        }

        function showExplanation(index) {
            const q = quizData[index];
            const userAns = userAnswers[index];
            const isCorrect = userAns === q.correct;

            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mt-4 p-4 rounded-lg border border-emerald-600/50 bg-emerald-950/30 text-emerald-200 text-sm";
                explanationBox.innerHTML = `<strong>Correct! / सही उत्तर!</strong><br>${q.explanation}`;
            } else {
                explanationBox.className = "mt-4 p-4 rounded-lg border border-rose-600/50 bg-rose-950/30 text-rose-200 text-sm";
                explanationBox.innerHTML = `<strong>Incorrect! / गलत उत्तर!</strong><br>Correct Option was: <strong>${String.fromCharCode(65 + q.correct)}</strong><br>${q.explanation}`;
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`Quiz Completed! \nYour Final Score: ${score} / ${quizData.length * 2}\nCorrect: ${correctCount}\nIncorrect: ${incorrectCount}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion(val) {
            const target = parseInt(val) - 1;
            if (target >= 0 && target < quizData.length) {
                currentIndex = target;
                loadQuestion(currentIndex);
            } else {
                jumpInput.value = currentIndex + 1;
            }
        }

        // Initial Load
        loadQuestion(currentIndex);
