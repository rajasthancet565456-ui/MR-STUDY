                <p class="text-xs text-indigo-200">Bilingual (English & Hindi) • Faridabad & Palwal Districts</p>

                    <span id="score-display" class="font-bold text-white text-sm">0</span> / <span id="total-questions-top" class="text-indigo-200">90</span>

                <div class="text-xs">

            </div>
        </div>

            <div id="progress-bar" class="bg-emerald-400 h-full transition-all duration-300" style="width: 1.11%;"></div>
        </div>
    </header>

    <!-- Main Quiz Container -->

        <div id="quiz-card" class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8 transition-all">
            
            <!-- Question Meta -->

                <span id="question-badge" class="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full border border-indigo-100">
                    Question 1 of 90
                </span>
                <span id="subtopic-badge" class="text-xs text-slate-400 font-medium">
                    Faridabad District General Facts
                </span>
            </div>

            <!-- Question Text -->
            <div class="mb-6 space-y-2">
                <h2 id="question-en" class="text-lg sm:text-xl font-semibold text-slate-900 leading-snug">
                    <!-- English Question -->
                </h2>
                <h3 id="question-hi" class="text-base sm:text-lg font-medium text-indigo-900/85 leading-snug">
                    <!-- Hindi Question -->
                </h3>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Options populated dynamically -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span id="hint-toggle-text">Show Hint</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-800">
                    <!-- Hint text goes here -->
                </div>
            </div>

            <!-- Explanation Box (Revealed on Answer) -->
            <div id="explanation-box" class="hidden mb-6 p-4 rounded-xl border transition-all">
                <div class="flex items-center gap-2 font-semibold text-sm mb-1" id="explanation-header">
                    <!-- Correct/Incorrect header -->
                </div>
                <p id="explanation-text" class="text-xs sm:text-sm text-slate-700 leading-relaxed">
                    <!-- Detailed Rationale -->
                </p>
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-slate-100">
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <button onclick="prevQuestion()" id="prev-btn" class="flex-1 sm:flex-none px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                        Previous
                    </button>
                    <button onclick="nextQuestion()" id="next-btn" class="flex-1 sm:flex-none px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 shadow-sm shadow-indigo-200 transition-colors">
                        Next
                    </button>
                </div>

                <!-- Jump to Question Input -->
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <span class="text-xs text-slate-500 whitespace-nowrap">Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="90" class="w-16 px-2 py-1.5 text-center border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="1-90">
                    <button onclick="jumpToQuestion()" class="px-3 py-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200 text-sm font-medium rounded-lg transition-colors">
                        Go
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->

        Haryana Competitive Exams Practice Set • Designed with Tailwind CSS & Vanilla JS
    ></footer>

        let currentIdx = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const questionBadge = document.getElementById('question-badge');
        const subtopicBadge = document.getElementById('subtopic-badge');
        const questionEn = document.getElementById('question-en');
        const questionHi = document.getElementById('question-hi');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const hintToggleText = document.getElementById('hint-toggle-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const scoreDisplay = document.getElementById('score-display');
        const progressDisplay = document.getElementById('progress-display');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentIdx];
            questionBadge.textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
            subtopicBadge.textContent = q.subtopic;
            questionEn.textContent = q.qEn;
            questionHi.textContent = q.qHi;

            // Reset hint
            hintBox.classList.add('hidden');
            hintToggleText.textContent = "Show Hint";
            hintBox.textContent = q.hint;

            // Render options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border text-sm font-medium transition-all flex items-center justify-between ${getOptionStyle(idx, q.correct)}`;
                btn.innerHTML = `<span>${opt}</span>`;
                
                if (userAnswers[currentIdx] === null) {
                    btn.onclick = () => selectAnswer(idx);
                    btn.classList.add('hover:border-indigo-400', 'hover:bg-indigo-50/30', 'cursor-pointer');
                } else {
                    btn.disabled = true;
                    btn.classList.add('cursor-default');
                }
                optionsContainer.appendChild(btn);
            });

            // Render explanation if already answered
            if (userAnswers[currentIdx] !== null) {
                showExplanationUI(userAnswers[currentIdx] === q.correct, q.explanation);
            } else {
                explanationBox.classList.add('hidden');
            }

            // Update navigation
            prevBtn.disabled = currentIdx === 0;
            nextBtn.textContent = currentIdx === quizData.length - 1 ? 'Finish' : 'Next';

            // Update progress
            scoreDisplay.textContent = score;
            progressDisplay.textContent = currentIdx + 1;
            progressBar.style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;
            jumpInput.value = currentIdx + 1;
        }

        function getOptionStyle(optIdx, correctIdx) {
            const selected = userAnswers[currentIdx];
            if (selected === null) {
                return 'bg-white border-slate-200 text-slate-700';
            }
            if (optIdx === correctIdx) {
                return 'bg-emerald-50 border-emerald-500 text-emerald-900 font-semibold';
            }
            if (selected === optIdx && optIdx !== correctIdx) {
                return 'bg-rose-50 border-rose-500 text-rose-900';
            }
            return 'bg-slate-50 border-slate-200 text-slate-400 opacity-60';
        }

        function selectAnswer(idx) {
            if (userAnswers[currentIdx] !== null) return;
            userAnswers[currentIdx] = idx;
            const q = quizData[currentIdx];
            const isCorrect = idx === q.correct;

            if (isCorrect) {
                score++;
            }

            loadQuestion();
        }

        function showExplanationUI(isCorrect, explanationStr) {
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = 'mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900';
                explanationHeader.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-600" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg> Correct Answer!`;
            } else {
                explanationBox.className = 'mb-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900';
                explanationHeader.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-rose-600" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg> Incorrect Answer.`;
            }
            explanationText.textContent = explanationStr;
        }

        function toggleHint() {
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintToggleText.textContent = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintToggleText.textContent = "Show Hint";
            }
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentIdx = val - 1;
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Initialize quiz on load
        window.onload = loadQuestion;
    </script>
