<body class="bg-slate-50 text-slate-800 min-p-4 flex flex-col min-h-screen">

        </div>

            <div class="flex justify-between items-center mb-4 text-xs font-semibold uppercase tracking-wider text-indigo-600">
                <span id="question-badge">Page 1 • Question 1 of 90</span>
                <span id="exam-tag" class="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded border border-indigo-100">HSSC / State Exam Level</span>
            </div>

            <!-- Question Statement (Bilingual) -->
            <div class="mb-6 space-y-2">
                <h2 id="question-text-en" class="text-lg sm:text-xl font-semibold text-slate-900 leading-snug">
                    <!-- Loaded dynamically -->
                </h2>
                <h3 id="question-text-hi" class="text-base sm:text-lg font-medium text-slate-600 leading-snug border-l-4 border-indigo-500 pl-3">
                    <!-- Loaded dynamically -->
                </h3>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Loaded dynamically -->
            </div>

                    <!-- Loaded dynamically -->
                </div>

            <!-- Explanation Box (Hidden initially) -->
            <div id="explanation-box" class="hidden mb-6 p-4 rounded-xl border text-sm">
                <!-- Loaded dynamically -->
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-100">
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <button onclick="prevQuestion()" id="prev-btn" class="flex-1 sm:flex-none px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg text-sm transition disabled:opacity-50 disabled:cursor-not-allowed">
                        ← Previous
                    </button>
                    <button onclick="nextQuestion()" id="next-btn" class="flex-1 sm:flex-none px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition shadow-sm">

            </div>

        </div>
    </main>

    <!-- Footer -->

        Haryana District General Studies Interactive Assessment Module &bull; 90 Unique Questions Dataset

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = {}; // Stores user selections

        const questionBadge = document.getElementById('question-badge');
        const questionTextEn = document.getElementById('question-text-en');
        const questionTextHi = document.getElementById('question-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const scoreDisplay = document.getElementById('score-display');
        const progressDisplay = document.getElementById('progress-display');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            
            // Meta updates
            questionBadge.innerText = `Page ${q.page} • Question ${currentQuestionIndex + 1} of 90`;
            progressDisplay.innerText = `${currentQuestionIndex + 1} / 90`;
            progressBar.style.width = `${((currentQuestionIndex + 1) / 90) * 100}%`;

            // Text updates
            questionTextEn.innerText = `${currentQuestionIndex + 1}. ${q.en}`;
            questionTextHi.innerText = q.hi;

            // Hint update
            hintBox.innerText = q.hint;
            hintBox.classList.add('hidden');

            // Options generation
            optionsContainer.innerHTML = '';
            const selectedOpt = userAnswers[currentQuestionIndex];

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border text-sm sm:text-base font-medium transition flex items-center justify-between `;
                
                let stateClass = "border-slate-200 bg-white hover:bg-slate-50 text-slate-700";
                
                if (selectedOpt !== undefined) {
                    // Already answered
                    if (opt.id === q.correct) {
                        stateClass = "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
                    } else if (opt.id === selectedOpt && selectedOpt !== q.correct) {
                        stateClass = "border-rose-500 bg-rose-50 text-rose-900";
                    } else {
                        stateClass = "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
                    }
                    btn.disabled = true;
                }

                btn.className += stateClass;
                btn.innerHTML = `
                    <span class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-600 border border-slate-200">${opt.id}</span>
                        <span>${opt.textEn} <span class="block text-xs font-normal opacity-80">${opt.textHi}</span></span>
                    </span>
                `;

                if (selectedOpt === undefined) {
                    btn.onclick = () => selectOption(opt.id);
                }

                optionsContainer.appendChild(btn);
            });

            // Explanation handling
            if (selectedOpt !== undefined) {
                showExplanation(q, selectedOpt);
            } else {
                explanationBox.classList.add('hidden');
            }

            // Button states
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.innerText = currentQuestionIndex === quizData.length - 1 ? "Finish / Summary" : "Next →";
        }

        function selectOption(optId) {
            userAnswers[currentQuestionIndex] = optId;
            const q = quizData[currentQuestionIndex];
            if (optId === q.correct) {
                score++;
            }
            scoreDisplay.innerText = `${score} / 90`;
            loadQuestion();
        }

        function showExplanation(q, userOpt) {
            const isCorrect = userOpt === q.correct;
            explanationBox.className = `mb-6 p-4 rounded-xl border text-sm ${isCorrect ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'}`;
            explanationBox.innerHTML = `
                <div class="font-bold mb-1 flex items-center gap-1.5">
                    <span>${isCorrect ? '✅ Correct Answer!' : '❌ Incorrect. Correct Option was ' + q.correct}</span>
                </div>
                <p class="mb-1"><strong>English Rationale:</strong> ${q.explanationEn}</p>
                <p><strong>हिंदी स्पष्टीकरण:</strong> ${q.explanationHi}</p>
            `;
            explanationBox.classList.remove('hidden');
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of 90.`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= 90) {
                currentQuestionIndex = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert("Please enter a valid question number between 1 and 90.");
            }
        }

        // Initialize first question
        loadQuestion();
    </script>
