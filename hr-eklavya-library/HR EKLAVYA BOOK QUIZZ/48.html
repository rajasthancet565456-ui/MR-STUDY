        let currentIdx = 0;
        let score = 0;
        let attempted = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptionsCache = {};

        const qTextEn = document.getElementById('q-text-en');
        const qTextHi = document.getElementById('q-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const scoreVal = document.getElementById('score-val');
        const totalVal = document.getElementById('total-val');
        const attemptedVal = document.getElementById('attempted-val');
        const questionTracker = document.getElementById('question-tracker');
        const sectionTag = document.getElementById('section-tag');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const jumpInput = document.getElementById('jump-input');

        totalVal.textContent = quizData.length;

        function getShuffledOptions(qIndex) {
            if (shuffledOptionsCache[qIndex]) {
                return shuffledOptionsCache[qIndex];
            }
            const q = quizData[qIndex];
            const originalOptions = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            
            let seed = qIndex + 1;
            function pseudoRandom() {
                let x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            }

            for (let i = originalOptions.length - 1; i > 0; i--) {
                const j = Math.floor(pseudoRandom() * (i + 1));
                [originalOptions[i], originalOptions[j]] = [originalOptions[j], originalOptions[i]];
            }

            const newCorrectMapping = originalOptions.findIndex(item => item.originalIndex === q.correct);
            
            shuffledOptionsCache[qIndex] = {
                options: originalOptions,
                correctIndex: newCorrectMapping
            };
            return shuffledOptionsCache[qIndex];
        }

        function loadQuestion() {
            const q = quizData[currentIdx];
            questionTracker.textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
            sectionTag.textContent = `Page ${q.page} Source`;
            sectionTag.className = q.page === 1 
                ? "bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded text-[10px]" 
                : "bg-blue-900 text-blue-300 px-2 py-0.5 rounded text-[10px]";
            
            progressBar.style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;

            qTextEn.textContent = `${currentIdx + 1}. ${q.en}`;
            qTextHi.textContent = q.hi;

            hintText.textContent = q.hint;
            hintBox.classList.add('hidden');
            explanationText.textContent = q.explanation;
            explanationBox.classList.add('hidden');

            optionsContainer.innerHTML = '';
            const shuffleData = getShuffledOptions(currentIdx);
            const selectedOpt = userAnswers[currentIdx];

            shuffleData.options.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border text-sm sm:text-base font-medium transition-all flex items-center justify-between ${
                    selectedOpt !== null 
                        ? (idx === shuffleData.correctIndex 
                            ? 'bg-emerald-950/60 border-emerald-500 text-emerald-200' 
                            : (idx === selectedOpt ? 'bg-rose-950/60 border-rose-500 text-rose-200' : 'bg-slate-900 border-slate-700 text-slate-300 opacity-60'))
                        : 'bg-slate-900 border-slate-700 hover:border-slate-500 text-slate-200 hover:bg-slate-800'
                }`;
                
                btn.innerHTML = `<span><strong class="mr-2 text-slate-400">${String.fromCharCode(65 + idx)}.</strong> ${item.text}</span>`;
                
                if (selectedOpt === null) {
                    btn.onclick = () => selectOption(idx);
                } else {
                    btn.disabled = true;
                }

                optionsContainer.appendChild(btn);
            });

            if (selectedOpt !== null) {
                explanationBox.classList.remove('hidden');
            }

            prevBtn.disabled = currentIdx === 0;
            nextBtn.textContent = currentIdx === quizData.length - 1 ? 'Finish' : 'Next';
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentIdx] !== null) return;

            const shuffleData = getShuffledOptions(currentIdx);
            userAnswers[currentIdx] = selectedIndex;
            attempted++;
            attemptedVal.textContent = attempted;

            if (selectedIndex === shuffleData.correctIndex) {
                score++;
                scoreVal.textContent = score;
            }

            loadQuestion();
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIdx = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        loadQuestion();
    </script>
