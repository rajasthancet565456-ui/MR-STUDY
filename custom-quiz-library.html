<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmic Quiz Library</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
:root{--void:#09041f;--violet:#7654cc;--pink:#d95ea6;--gold:#edc05e;--lav:#eadcff;--ink:#282047;--muted:#766a89;--line:#d9cbed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 88% 0,#814b82,transparent 28%),linear-gradient(135deg,#08031d,#1b0e38);color:#fff;font:16px Manrope,system-ui}.wrap{width:min(1400px,calc(100% - 40px));margin:auto}.top{min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #4e336c}.brand,.back{color:#fff;text-decoration:none;font:800 .76rem 'DM Mono';letter-spacing:.1em;text-transform:uppercase}.brand:before{content:'✦';font-size:1.55rem;color:var(--gold);margin-right:9px}.back{border:1px solid #725a8e;border-radius:8px;padding:10px 12px}.back:hover{border-color:#d779b5}.hero{padding:70px 0 38px}.eyebrow{color:var(--gold);font:800 .68rem 'DM Mono';letter-spacing:.15em;text-transform:uppercase}.hero h1{margin:10px 0;font:700 clamp(3.5rem,7vw,6.4rem)/.9 'Playfair Display'}.hero p{max-width:650px;color:#cdc0dc;line-height:1.7}.count{font:800 .72rem 'DM Mono';letter-spacing:.08em;color:#d6c4e7;text-transform:uppercase}.count b{font:700 1.6rem 'Playfair Display';color:var(--gold);margin-right:5px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:22px 0 78px}.card{position:relative;overflow:hidden;min-height:184px;padding:20px;text-align:left;border:1px solid #66458a;border-radius:17px;background:linear-gradient(145deg,#231344,#321b59);color:#fff;cursor:pointer;font:inherit;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#d779b5}.card:after{content:'';position:absolute;right:-44px;top:-53px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#fff1c8 0 22%,#d779b5 24% 30%,#7654cc 34% 41%,transparent 44%)}.card>*{position:relative}.card small{color:var(--gold);font:800 .64rem 'DM Mono';letter-spacing:.1em}.card h2{font:700 1.55rem/1.1 'Playfair Display';margin:25px 0 8px}.card p{color:#d2c5df;font-size:.85rem;line-height:1.5;margin:0}.open{display:block;margin-top:17px;color:#f19dc9;font:800 .65rem 'DM Mono';letter-spacing:.08em}.empty{grid-column:1/-1;padding:48px;text-align:center;border:1px dashed #70528e;border-radius:16px;color:#d5c7e2}.player{position:fixed;inset:0;z-index:50;background:#09041f;overflow:auto}.hidden{display:none}.runner-head{background:radial-gradient(circle at 80% 0,#82487b,transparent 28%),#09041f;border-bottom:1px solid #4e336c;padding:17px max(24px,calc((100% - 1640px)/2))}.runner-line{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.runner-brand{font:800 .8rem 'DM Mono';letter-spacing:.08em}.runner-brand:before{content:'✦';color:var(--gold);font-size:1.4rem;margin-right:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:9px 11px;border:1px solid #70598e;border-radius:8px;background:transparent;color:#fff;font:800 .65rem 'DM Mono';letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.actions button:hover{border-color:#df7cbb}.title-line{margin-top:15px;padding-top:13px;border-top:1px solid #392650}.title-line h2{font:700 1.55rem 'Playfair Display';margin:5px 0}.title-line small{color:var(--gold);font:800 .67rem 'DM Mono';letter-spacing:.09em}.stage{background:radial-gradient(circle at 10% 0,#f8efff,transparent 30%),var(--lav);min-height:calc(100vh - 168px);padding:28px 0 56px;color:var(--ink)}.stage-inner{width:min(1400px,calc(100% - 40px));margin:auto}.stats{display:flex;gap:11px;justify-content:flex-end;flex-wrap:wrap}.stat{background:#fff;border-radius:23px;padding:9px 15px;font-weight:800;color:#513774}.tabs{display:flex;gap:13px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #d4c2e7;padding:18px 0 14px;margin-bottom:25px}.tabs b{background:#7654cc;color:#fff;border-radius:10px;padding:11px 14px}.tabs span{font-weight:700;color:#70607d}.utility{margin-left:auto;display:flex;gap:8px}.utility button{border:1px solid #d7c7e8;background:#fff;border-radius:9px;padding:9px 12px;color:#7654cc;font-weight:800;cursor:pointer}.paper{background:#fffdfd;border:1px solid #d8c8e9;border-radius:18px;padding:32px 38px;box-shadow:0 14px 30px #51367416}.qrow{display:flex;justify-content:space-between;gap:10px;color:#7654cc;font:800 .7rem 'DM Mono';letter-spacing:.05em;text-transform:uppercase}.progress{height:8px;background:#e0d5ed;border-radius:20px;overflow:hidden;margin:11px 0 27px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#7654cc,#d95ea6)}.question{font:800 clamp(1.45rem,2.45vw,2.25rem)/1.34 Manrope;margin:0 0 24px}.hint{padding:10px 13px;border:1px solid #dacbeb;border-radius:9px;background:#f9f4ff;color:#7654cc;font-weight:800;cursor:pointer}.options{display:grid;gap:12px;margin-top:22px}.option{padding:16px 19px;border:1px solid #d8c8e8;border-radius:14px;background:#fff;color:#342550;text-align:left;font:700 1rem Manrope;cursor:pointer}.option:hover:not(:disabled){border-color:#7654cc;background:#faf6ff}.option.correct{background:#e7faee;border-color:#36a168}.option.wrong{background:#fff0f3;border-color:#db587b}.feedback{margin-top:16px;padding:14px;border-radius:10px;background:#f1e8fb;color:#564668}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:25px;padding-top:18px;border-top:1px solid #dfd1ec}.footer button{padding:10px 13px;border:1px solid #d8c8e8;border-radius:9px;background:#fff;color:#4c326a;font-weight:800;cursor:pointer}.footer .next{background:#7654cc;color:#fff;border:0}.footer input{width:60px;padding:9px;border:1px solid #d8c8e8;border-radius:8px}.iframe-wrap{padding:25px;background:#eadcff;min-height:calc(100vh - 168px)}.iframe-wrap iframe{display:block;margin:auto;width:min(1200px,100%);height:calc(100vh - 225px);min-height:600px;border:1px solid #d7c6e8;border-radius:14px;background:#fff}@media(max-width:760px){.grid{grid-template-columns:1fr}.stage-inner,.wrap{width:min(100% - 28px,1400px)}.paper{padding:22px}.runner-head{padding:16px 14px}.actions{gap:6px}.actions button{padding:8px;font-size:.58rem}.question{font-size:1.35rem}.utility{margin-left:0}}
</style></head><body>
<header class="wrap top"><a class="brand" href="cosmic-quiz-master.html">Cosmic Quiz Universe</a><a class="back" href="cosmic-quiz-master.html#libraries">← All Libraries</a></header><main class="wrap"><section class="hero"><p class="eyebrow" id="tag">Quiz library</p><h1 id="libraryTitle">Library</h1><p id="description"></p><p class="count"><b id="count">0</b> quizzes available</p></section><section class="grid" id="grid"></section></main>
<section id="player" class="player hidden"><div class="runner-head"><div class="runner-line"><span class="runner-brand" id="runnerBrand">Cosmic Quiz Library</span><div class="actions"><button id="full">Full Screen</button><button id="topReset">Reset Quiz</button><button id="attempted">Mark Attempted</button><button id="previousQuiz">← Previous Quiz</button><button id="nextQuiz">Next Quiz →</button><button id="exit">Home</button></div></div><div class="title-line"><small id="runnerTag">Quiz Library</small><h2 id="runnerTitle">Quiz</h2></div></div><div id="runnerBody"></div></section>
<script>
const KEY='cosmicQuizStudioV1', $=s=>document.querySelector(s);let library,quizzes=[],active,position=0,answers=[],hints=[],bookmarks=[];
const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getData(){try{return JSON.parse(localStorage.getItem(KEY)||'{"libraries":[],"quizzes":[]}')}catch{return {libraries:[],quizzes:[]}}}
function load(){const route=location.hash.replace(/^#library\//,'').split('&quiz='),id=decodeURIComponent(route[0]),quizToOpen=route[1]?decodeURIComponent(route[1]):'';const d=getData();library=d.libraries.find(l=>l.id===id);if(!library){$('#libraryTitle').textContent='Library not found';return}quizzes=d.quizzes.filter(q=>q.libraryId===id);document.title=library.name+' · Cosmic Quiz Universe';$('#tag').textContent=library.tag||'Quiz library';$('#libraryTitle').textContent=library.name;$('#description').textContent=library.description||'Your interactive quiz collection.';$('#count').textContent=quizzes.length;$('#grid').innerHTML=quizzes.length?quizzes.map(q=>`<button class="card" data-quiz="${esc(q.id)}"><small>${q.importedHtml?'Original HTML Quiz':(q.questions||[]).length+' Questions'}</small><h2>${esc(q.title||'Untitled Quiz')}</h2><p>${q.importedHtml?'Open the complete original quiz with all of its tools.':'Open interactive quiz with hints, bookmark, summary and navigation tools.'}</p><span class="open">Start Quiz →</span></button>`).join(''):'<div class="empty">No quizzes yet. Add one with AI Quiz Developer on the main page.</div>';document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>openQuiz(b.dataset.quiz));if(quizToOpen&&quizzes.some(q=>q.id===quizToOpen))openQuiz(quizToOpen)}
function openQuiz(id){active=quizzes.find(q=>q.id===id);if(!active)return;if(!active.importedHtml){location.href=`ai-quiz-runner.html?quiz=${encodeURIComponent(active.id)}`;return}position=0;answers=Array((active.questions||[]).length).fill(null);hints=Array((active.questions||[]).length).fill(false);bookmarks=Array((active.questions||[]).length).fill(false);$('#player').classList.remove('hidden');$('#runnerBrand').textContent=(library.tag||library.name)+' · Cosmic Energy';$('#runnerTag').textContent=library.name.toUpperCase()+' · COSMIC ENERGY';$('#runnerTitle').textContent=active.title||'Quiz';$('#runnerBody').innerHTML=`<div class="iframe-wrap"><iframe id="originalQuiz" title="${esc(active.title)}" sandbox="allow-scripts allow-forms allow-popups"></iframe></div>`;$('#originalQuiz').srcdoc=active.importedHtml}
function score(){return answers.reduce((n,a,i)=>n+(a===active.questions[i].answer?1:0),0)}function accuracy(){const done=answers.filter(a=>a!==null).length;return done?Math.round(score()/done*100):0}
function renderQuestion(){const q=active.questions[position],total=active.questions.length,chosen=answers[position],done=chosen!==null;const feedback=done?(chosen===q.answer?'Correct! ':'The correct answer is highlighted. ')+(q.explanation||''):hints[position]?(q.explanation||'Read the question and options carefully.') : '';$('#runnerBody').innerHTML=`<main class="stage"><div class="stage-inner"><div class="stats"><span class="stat">🏆 Score: ${score()}/${total}</span><span class="stat">📊 ${accuracy()}% Acc</span><span class="stat">🔖 ${bookmarks.filter(Boolean).length} Saved</span></div><div class="tabs"><b>All (${total})</b><span>AI Practice Questions</span><span>Interactive Study Mode</span><div class="utility"><button id="bookmark">${bookmarks[position]?'🔖 Saved':'🔖 Bookmark'}</button><button id="summary">📈 Summary</button></div></div><article class="paper"><div class="qrow"><span>Question ${position+1} of ${total}</span><span>${done?'Answered':'Unanswered'}</span></div><div class="progress"><i style="width:${(position+1)/total*100}%"></i></div><h3 class="question">${esc(q.question)}</h3><button class="hint" id="hint">💡 ${hints[position]?'Hint Shown':'Show Hint'}⌄</button><div class="options">${q.options.map((o,i)=>`<button class="option ${done&&i===q.answer?'correct':''} ${done&&i===chosen&&i!==q.answer?'wrong':''}" data-answer="${i}" ${done?'disabled':''}><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</button>`).join('')}</div><div class="feedback" style="display:${feedback?'block':'none'}">${esc(feedback)}</div><div class="footer"><button id="prev" ${position===0?'disabled':''}>← Previous</button><div>Jump to Q: <input id="jump" type="number" min="1" max="${total}" value="${position+1}"> <button id="go">Go</button></div><div><button id="reset">↻ Reset</button> <button class="next" id="next">${position===total-1?'Finish':'Next →'}</button></div></div></article></div></main>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[position]=Number(b.dataset.answer);renderQuestion()});$('#hint').onclick=()=>{hints[position]=true;renderQuestion()};$('#bookmark').onclick=()=>{bookmarks[position]=!bookmarks[position];renderQuestion()};$('#prev').onclick=()=>{if(position){position--;renderQuestion()}};$('#next').onclick=()=>{if(position<total-1){position++;renderQuestion()}else showResult()};$('#go').onclick=()=>{const n=Number($('#jump').value);if(n>=1&&n<=total){position=n-1;renderQuestion()}};$('#reset').onclick=resetQuiz;$('#summary').onclick=showSummary}
function resetQuiz(){if(active?.questions&&confirm('Reset this quiz and clear all answers?')){answers=Array(active.questions.length).fill(null);hints=Array(active.questions.length).fill(false);bookmarks=Array(active.questions.length).fill(false);position=0;renderQuestion()}}
function showResult(){$('#runnerBody').innerHTML=`<main class="stage"><div class="stage-inner"><article class="paper" style="text-align:center"><p class="eyebrow">Quiz Completed</p><h2 style="font:700 3rem 'Playfair Display';margin:10px">${score()} / ${active.questions.length}</h2><p>You answered ${answers.filter(a=>a!==null).length} questions with ${accuracy()}% accuracy.</p><button class="hint" id="again">Try Again</button></article></div></main>`;$('#again').onclick=resetQuiz}
function showSummary(){const items=active.questions.map((q,i)=>`<button class="option" data-go="${i}">Q ${i+1} · ${answers[i]===null?'Unanswered':answers[i]===q.answer?'Correct':'Review answer'} ${bookmarks[i]?'🔖':''}</button>`).join('');$('#runnerBody').innerHTML=`<main class="stage"><div class="stage-inner"><article class="paper"><h2 style="margin-top:0">Quiz Summary</h2><p>Score ${score()}/${active.questions.length} · ${accuracy()}% accuracy</p><div class="options">${items}</div></article></div></main>`;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{position=Number(b.dataset.go);renderQuestion()})}
function adjacent(step){const i=quizzes.indexOf(active),next=quizzes[i+step];if(next)openQuiz(next.id)}$('#exit').onclick=()=>$('#player').classList.add('hidden');$('#full').onclick=()=>$('#player').requestFullscreen?.();$('#topReset').onclick=resetQuiz;$('#attempted').onclick=e=>{e.currentTarget.textContent=e.currentTarget.textContent.includes('Mark')?'✓ Attempted':'Mark Attempted'};$('#previousQuiz').onclick=()=>adjacent(-1);$('#nextQuiz').onclick=()=>adjacent(1);load();
</script></body></html>
