            document.getElementById('total-questions-display').textContent = quizData.length;
            document.getElementById('jump-input').max = quizData.length;
            
            // Populate question order directly 0 to 99 (25 from each page, perfectly balanced)
            questionOrder = Array.from({length: quizData.length}, (_, i) => i);
            
            loadQuestion();
        }

        function loadQuestion() {
            const dataIndex = questionOrder[currentIndex];
            const q = quizData[dataIndex];

            // Update progress
            const progressPercent = ((currentIndex + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('question-indicator').textContent = `Question ${currentIndex + 1} of ${quizData.length}`;
            document.getElementById('page-source-badge').textContent = `Source: Page ${q.page} (Q${(currentIndex % 25) + 1} of 25)`;

            // Display question text
            document.getElementById('question-text').textContent = q.question;

            // Hint setup
            const hintBox = document.getElementById('hint-box');
            hintBox.textContent = q.hint;
            hintBox.classList.add('hidden');
            document.getElementById('hint-toggle-text').textContent = "Show Exam Hint";

            // Explanation setup
            const expBox = document.getElementById('explanation-box');
            document.getElementById('explanation-text').textContent = q.explanation;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // Shuffle options deterministically per question render or keep fixed random shuffle
            // To ensure options randomization requirement is met robustly:
            if (!q.shuffledOptions) {
                // Shuffle options once per question load
                let indexedOpts = q.options.map((opt, idx) => ({ opt, originalIdx: idx }));
                // Simple pseudo-random shuffle based on question index string sum to keep it stable during navigation
                indexedOpts.sort(() => Math.random() - 0.5);
                q.shuffledOptions = indexedOpts;
            }

            q.shuffledOptions.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-900/50 hover:bg-slate-700/60 transition-all text-sm font-medium flex items-center justify-between group";
                btn.innerHTML = `<span><strong class="text-emerald-400 mr-2">${String.fromCharCode(65 + idx)}.</strong> ${item.opt}</span>`;
                
                const isAnswered = userAnswers[currentIndex] !== undefined;
                
                if (isAnswered) {
                    btn.disabled = true;
                    if (item.opt === q.correct) {
                        btn.classList.add('bg-emerald-950/60', 'border-emerald-500', 'text-emerald-200');
                    } else if (userAnswers[currentIndex] === item.opt) {
                        btn.classList.add('bg-rose-950/60', 'border-rose-500', 'text-rose-200');
                    }
                } else {
                    btn.onclick = () => selectOption(item.opt, btn);
                }
                
                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentIndex] !== undefined) {
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            // Navigation buttons state
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('jump-input').value = currentIndex + 1;
        }

        function selectOption(selectedOpt, btnElement) {
            const dataIndex = questionOrder[currentIndex];
            const q = quizData[dataIndex];
            
            userAnswers[currentIndex] = selectedOpt;

            const optionsContainer = document.getElementById('options-container');
            const buttons = optionsContainer.getElementsByTagName('button');

            let isCorrect = (selectedOpt === q.correct);
            if (isCorrect) {
                score++;
                document.getElementById('score').textContent = score;
                btnElement.classList.add('bg-emerald-950/60', 'border-emerald-500', 'text-emerald-200');
            } else {
                btnElement.classList.add('bg-rose-950/60', 'border-rose-500', 'text-rose-200');
                // Highlight correct one
                for (let b of buttons) {
                    if (b.textContent.includes(q.correct)) {
                        b.classList.add('bg-emerald-950/60', 'border-emerald-500', 'text-emerald-200');
                    }
                }
            }

            // Disable all buttons after selection
            for (let b of buttons) {
                b.disabled = true;
                b.onclick = null;
            }

            // Reveal explanation
            document.getElementById('explanation-box').classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            let target = parseInt(val) - 1;
            if (!isNaN(target) && target >= 0 && target < quizData.length) {
                currentIndex = target;
                loadQuestion();
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            const toggleText = document.getElementById('hint-toggle-text');
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                toggleText.textContent = "Hide Exam Hint";
            } else {
                hintBox.classList.add('hidden');
                toggleText.textContent = "Show Exam Hint";
            }
        }

        // Run initialization on load
        window.onload = initQuiz;
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
