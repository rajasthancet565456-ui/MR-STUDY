<body class="bg-slate-900 text-slate-100 h-full flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->

            <div>

            </div>
            <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 text-sm">
                    Score: <span id="score-display" class="font-bold text-emerald-400">0</span> / <span id="total-display">75</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400">Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="75" class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm text-center focus:outline-none focus:border-indigo-500" placeholder="1-75">
                    <button onclick="jumpToQuestion()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded text-sm transition-colors">Go</button>
                </div>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="max-w-4xl mx-auto mt-3 w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-indigo-500 h-full transition-all duration-300 w-0"></div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 my-auto">
        <div id="quiz-card" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl relative">
            
            <!-- Question Meta Header -->
            <div class="flex justify-between items-center text-xs text-slate-400 mb-4 pb-2 border-b border-slate-700/60">
                <span id="question-tracker" class="font-semibold text-indigo-300">Question 1 of 75</span>
                <span id="source-tag" class="bg-slate-900 px-2.5 py-1 rounded border border-slate-700">Source: Page 1</span>
            </div>

            <!-- Question Statement -->
            <h2 id="question-text" class="text-lg sm:text-xl font-medium text-slate-200 mb-6 leading-relaxed">
                Loading question...
            </h2>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected options -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs text-amber-400 hover:text-amber-300 flex items-center gap-1.5 font-medium transition-colors">
                    <span>💡 Toggle Hint</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-500/10 border border-amber-500/30 rounded-lg text-xs text-amber-200">
                    <!-- Hint Text -->
                </div>
            </div>

            <!-- Explanation Box (Hidden initially) -->
            <div id="explanation-box" class="hidden mt-4 p-4 rounded-xl border text-sm transition-all">
                <!-- Dynamic Explanation -->
            </div>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <button onclick="prevQuestion()" id="prev-btn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                ← Previous
            </button>
            <div id="completion-status" class="text-xs text-slate-400 hidden sm:block">Select an option to record your progress</div>
            <button onclick="nextQuestion()" id="next-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-indigo-600/20">
                Next →
            </button>
        </div>
    </footer>

        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptionsCache = {};

        // Shuffle options once for each question to keep positions randomized yet consistent during navigation
        function getShuffledOptions(index) {
            if (shuffledOptionsCache[index]) {
                return shuffledOptionsCache[index];
            }
            const qObj = quizData[index];
            const optionsWithMeta = qObj.options.map((opt) => ({
                text: opt,
                isCorrect: opt === qObj.answer
            }));
            
            // Fisher-Yates shuffle
            for (let i = optionsWithMeta.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsWithMeta[i], optionsWithMeta[j]] = [optionsWithMeta[j], optionsWithMeta[i]];
            }
            
            shuffledOptionsCache[index] = optionsWithMeta;
            return optionsWithMeta;
        }

        function loadQuestion() {
            const q = quizData[currentQuestion];
            const tracker = document.getElementById('question-tracker');
            const sourceTag = document.getElementById('source-tag');
            const qText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const hintBox = document.getElementById('hint-box');
            const explanationBox = document.getElementById('explanation-box');
            const progressBar = document.getElementById('progress-bar');
            const scoreDisplay = document.getElementById('score-display');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            tracker.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
            sourceTag.textContent = `Source: ${q.page}`;
            qText.textContent = q.q;
            hintBox.textContent = q.hint;
            hintBox.classList.add('hidden');
            
            scoreDisplay.textContent = score;
            progressBar.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;

            prevBtn.disabled = currentQuestion === 0;
            nextBtn.textContent = currentQuestion === quizData.length - 1 ? 'Finish Quiz' : 'Next →';

            optionsContainer.innerHTML = '';
            const randomizedOpts = getShuffledOptions(currentQuestion);
            const savedAnswer = userAnswers[currentQuestion];

            randomizedOpts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border text-sm sm:text-base font-medium transition-all flex items-center justify-between ${
                    savedAnswer !== null
                        ? opt.isCorrect
                            ? 'bg-emerald-500/20 border-emerald-500 text-emerald-200'
                            : savedAnswer === opt.text
                                ? 'bg-rose-500/20 border-rose-500 text-rose-200'
                                : 'bg-slate-900 border-slate-700 text-slate-400 opacity-60'
                        : 'bg-slate-900 hover:bg-slate-700/60 border-slate-700 text-slate-200 hover:border-slate-500'
                }`;
                
                btn.innerHTML = `<span><strong class="mr-2 text-indigo-400">${String.fromCharCode(65 + idx)}.</strong> ${opt.text}</span>`;
                
                if (savedAnswer === null) {
                    btn.onclick = () => selectOption(opt.text, opt.isCorrect);
                } else {
                    btn.disabled = true;
                }
                optionsContainer.appendChild(btn);
            });

            if (savedAnswer !== null) {
                explanationBox.innerHTML = `<strong class="${savedAnswer === q.answer ? 'text-emerald-400' : 'text-rose-400'}">
                    ${savedAnswer === q.answer ? '✓ Correct!' : '✗ Incorrect.'}</strong> ${q.explanation}`;
                explanationBox.className = `mt-4 p-4 rounded-xl border text-sm transition-all ${
                    savedAnswer === q.answer ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200' : 'bg-rose-500/10 border-rose-500/30 text-rose-200'
                }`;
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }
        }

        function selectOption(selectedText, isCorrect) {
            if (userAnswers[currentQuestion] !== null) return;
            
            userAnswers[currentQuestion] = selectedText;
            if (isCorrect) {
                score++;
            }
            loadQuestion();
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value);
            if (val >= 1 && val <= quizData.length) {
                currentQuestion = val - 1;
                input.value = '';
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function showResults() {
            const card = document.getElementById('quiz-card');
            const percentage = Math.round((score / quizData.length) * 100);
            card.innerHTML = `
                <div class="text-center py-8">
                    <h2 class="text-2xl font-bold text-indigo-400 mb-2">Quiz Completed! 🎉</h2>
                    <p class="text-slate-300 mb-6">You have successfully answered all exam-aligned Haryana questions.</p>
                    <div class="inline-block bg-slate-900 border border-slate-700 px-6 py-4 rounded-2xl mb-6">
                        <div class="text-4xl font-extrabold text-emerald-400 mb-1">${score} / ${quizData.length}</div>
                        <div class="text-xs text-slate-400 uppercase tracking-wider">Final Score (${percentage}%)</div>
                    </div>
                    <div>
                        <button onclick="resetQuiz()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition-colors shadow-lg shadow-indigo-600/20">
                            Restart Quiz
                        </button>
                    </div>
                </div>
            `;
            document.querySelector('footer').style.display = 'none';
        }

        function resetQuiz() {
            currentQuestion = 0;
            score = 0;
            userAnswers = new Array(quizData.length).fill(null);
            shuffledOptionsCache = {};
            document.querySelector('footer').style.display = 'block';
            loadQuestion();
        }

        // Initialize on load
        window.onload = loadQuestion;
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
