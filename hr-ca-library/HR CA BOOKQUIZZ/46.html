        // Application State
        let currentIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let currentScore = 0;

        // Shuffle Function (Fisher-Yates) for randomizing option positions
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize Option Arrays for each question ONCE to keep shuffled state consistent
        const questionOptionsMap = quizData.map(q => shuffleArray(q.options));

        // Render Current Question
        function renderQuestion() {
            const q = quizData[currentIndex];
            const options = questionOptionsMap[currentIndex];

            // Update Page Tag & Question Counters
            document.getElementById("page-source-tag").innerText = `Source Material: ${q.page}`;
            document.getElementById("current-q-num").innerText = currentIndex + 1;
            document.getElementById("total-q-num").innerText = quizData.length;
            document.getElementById("total-q-badge").innerText = quizData.length;

            // Update Progress Bar
            const progressPct = ((currentIndex + 1) / quizData.length) * 100;
            document.getElementById("progress-bar").style.width = `${progressPct}%`;

            // Question Texts
            document.getElementById("q-text-en").innerText = `Q${currentIndex + 1}. ${q.q_en}`;
            document.getElementById("q-text-hi").innerText = `प्र. ${q.q_hi}`;

            // Hint Text
            document.getElementById("hint-box").innerText = `Hint / संकेत: ${q.hint_en} | ${q.hint_hi}`;
            document.getElementById("hint-box").classList.add("hidden");

            // Render Options
            const container = document.getElementById("options-container");
            container.innerHTML = "";

            const optionLabels = ["A", "B", "C", "D"];
            const answered = userAnswers[currentIndex] !== null;

            options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-lg border transition flex items-start gap-3 text-sm sm:text-base font-medium ";
                
                if (!answered) {
                    btn.className += "bg-white border-slate-300 hover:border-indigo-500 hover:bg-indigo-50/50 text-slate-800";
                    btn.onclick = () => selectOption(idx);
                } else {
                    btn.disabled = true;
                    const selectedIdx = userAnswers[currentIndex];
                    if (opt.correct) {
                        btn.className += "bg-green-100 border-green-500 text-green-900 font-semibold";
                    } else if (selectedIdx === idx) {
                        btn.className += "bg-red-100 border-red-500 text-red-900 font-semibold";
                    } else {
                        btn.className += "bg-slate-50 border-slate-200 text-slate-400 opacity-70";
                    }
                }

                btn.innerHTML = `
                    <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-200 text-slate-700 text-xs font-bold shrink-0">${optionLabels[idx]}</span>
                    <div class="flex-grow">
                        <div>${opt.en}</div>
                        <div class="text-xs sm:text-sm text-slate-500 mt-0.5">${opt.hi}</div>
                    </div>
                `;
                container.appendChild(btn);
            });

            // Handle Explanation Display
            const expBox = document.getElementById("explanation-box");
            if (answered) {
                const selectedOpt = options[userAnswers[currentIndex]];
                const statusDiv = document.getElementById("result-status");
                if (selectedOpt.correct) {
                    statusDiv.className = "font-bold text-base mb-1 text-green-600 flex items-center gap-1";
                    statusDiv.innerHTML = "✓ Correct Answer!";
                } else {
                    statusDiv.className = "font-bold text-base mb-1 text-red-600 flex items-center gap-1";
                    statusDiv.innerHTML = "✗ Incorrect Choice";
                }
                document.getElementById("exp-text-en").innerText = q.exp_en;
                document.getElementById("exp-text-hi").innerText = q.exp_hi;
                expBox.classList.remove("hidden");
            } else {
                expBox.classList.add("hidden");
            }

            // Controls State
            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").innerText = currentIndex === quizData.length - 1 ? "Finish" : "Next";
        }

        // Handle Choice Selection
        function selectOption(optionIndex) {
            userAnswers[currentIndex] = optionIndex;
            const chosenOption = questionOptionsMap[currentIndex][optionIndex];
            
            if (chosenOption.correct) {
                currentScore++;
            }
            
            updateScoreDisplay();
            renderQuestion();
        }

        // Toggle Hint Box
        function toggleHint() {
            const hint = document.getElementById("hint-box");
            hint.classList.toggle("hidden");
        }

        // Update Score Bar
        function updateScoreDisplay() {
            document.getElementById("score-display").innerText = `Score: ${currentScore} / ${quizData.length}`;
        }

        // Next Question
        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                alert(`Quiz Finished! Your Final Score is ${currentScore} out of ${quizData.length}`);
            }
        }

        // Previous Question
        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        // Jump to Question
        function jumpToQuestion() {
            const input = document.getElementById("jump-q");
            const qNum = parseInt(input.value);
            if (qNum >= 1 && qNum <= quizData.length) {
                currentIndex = qNum - 1;
                renderQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        // Initial Load
        window.onload = function() {
            renderQuestion();
        };
    </script>
