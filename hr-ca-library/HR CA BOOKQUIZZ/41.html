<body class="bg-slate-900 text-slate-100 min-p-4 min-h-screen flex flex-col justify-between">

    <!-- Header Container -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-emerald-400">Haryana Current Affairs 2026 - Master Quiz</h1>
                <p class="text-xs text-slate-400">Bilingual (Hindi/English) | Exam Level: SSC, RRB, HSSC, State PCS (90 Unique Questions)</p>
            </div>
            <div class="flex items-center gap-4 bg-slate-700/50 px-4 py-2 rounded-lg border border-slate-600">
                <div class="text-sm">Score: <span id="score-val" class="font-bold text-emerald-400">0</span>/<span id="total-val">90</span></div>
                <div class="text-sm">Progress: <span id="progress-val" class="font-bold text-amber-400">1</span>/90</div>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="max-w-4xl mx-auto w-full bg-slate-700 h-2 mt-3 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 1.11%;"></div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 my-auto">
        <div id="quiz-card" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl relative">
            
            <!-- Question Meta Header -->
            <div class="flex justify-between items-center mb-4 text-xs font-semibold uppercase tracking-wider text-slate-400">
                <span id="q-category" class="bg-emerald-900/60 text-emerald-300 px-2.5 py-1 rounded border border-emerald-700/50">Page 1 • General Studies</span>
                <span id="q-badge" class="text-amber-400">Question 1 of 90</span>
            </div>

            <!-- Question Text Box (Bilingual) -->
            <div class="mb-6 space-y-2">
                <h2 id="q-text-hi" class="text-lg sm:text-xl font-bold text-slate-100 leading-snug">
                    <!-- Hindi Q text -->
                </h2>
                <h3 id="q-text-en" class="text-sm sm:text-base font-medium text-slate-300 leading-snug italic border-l-2 border-emerald-500 pl-3">
                    <!-- English Q text -->
                </h3>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected options -->
            </div>

            <!-- Hint Section -->
            <div class="mb-4">
                <button onclick="toggleHint()" class="text-xs text-amber-400 hover:text-amber-300 flex items-center gap-1 font-medium underline">
                    💡 Toggle Hint / संकेत देखें
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-950/30 border border-amber-800/50 rounded-lg text-xs text-amber-200">
                    <!-- Hint Text -->
                </div>
            </div>

            <!-- Explanation Box (Hidden by default, shown on select) -->
            <div id="explanation-box" class="hidden mt-4 p-4 rounded-xl border text-sm transition-all">
                <div class="font-bold mb-1 flex items-center gap-2" id="explanation-title"></div>
                <p id="explanation-text-hi" class="text-slate-200 mb-1"></p>
                <p id="explanation-text-en" class="text-slate-300 italic text-xs"></p>
            </div>

            <!-- Card Navigation Footer -->
            <div class="flex flex-wrap justify-between items-center mt-6 pt-4 border-t border-slate-700 gap-3">
                <button onclick="prevQuestion()" id="prev-btn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">
                    ← Previous
                </button>
                
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400 hidden sm:inline">Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="90" class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-center text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="1-90">
                    <button onclick="jumpToQuestion()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-medium">Go</button>
                </div>

                <button onclick="nextQuestion()" id="next-btn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-medium transition">
                    Next →
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-400">
        Haryana Current Affairs Interactive Module &bull; Total 90 Unique Exam-Grade Questions
    </footer>

        let currentIndex = 0;

        // DOM Elements
        const qCategory = document.getElementById('q-category');
        const qBadge = document.getElementById('q-badge');
        const qTextHi = document.getElementById('q-text-hi');
        const qTextEn = document.getElementById('q-text-en');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationTitle = document.getElementById('explanation-title');
        const explanationTextHi = document.getElementById('explanation-text-hi');
        const explanationTextEn = document.getElementById('explanation-text-en');
        const scoreVal = document.getElementById('score-val');
        const progressVal = document.getElementById('progress-val');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const currentQ = quizData[currentIndex];
            qCategory.innerText = currentQ.category;
            qBadge.innerText = `Question ${currentIndex + 1} of ${quizData.length}`;
            qTextHi.innerText = `${currentIndex + 1}. ${currentQ.hi}`;
            qTextEn.innerText = currentQ.en;

            // Reset hint and explanation
            hintBox.classList.add('hidden');
            hintBox.innerText = currentQ.hint;
            explanationBox.classList.add('hidden');

            // Render options
            optionsContainer.innerHTML = '';
            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-700/30 hover:bg-slate-700 hover:border-slate-500 transition text-sm sm:text-base flex items-center justify-between group";
                
                const optSpan = document.createElement('span');
                optSpan.innerText = opt;
                btn.appendChild(optSpan);

                const letterSpan = document.createElement('span');
                letterSpan.className = "text-xs font-bold text-slate-400 group-hover:text-emerald-400 px-2 py-1 bg-slate-800 rounded";
                letterSpan.innerText = ['A', 'B', 'C', 'D'][idx];
                btn.appendChild(letterSpan);

                // Check if already answered
                if (userAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                    if (idx === currentQ.correct) {
                        btn.classList.add('bg-emerald-950/60', 'border-emerald-500', 'text-emerald-200');
                    } else if (idx === userAnswers[currentIndex]) {
                        btn.classList.add('bg-rose-950/60', 'border-rose-500', 'text-rose-200');
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation
            if (userAnswers[currentIndex] !== null) {
                showExplanation(userAnswers[currentIndex] === currentQ.correct, currentQ);
            }

            // Update progress
            scoreVal.innerText = score;
            progressVal.innerText = currentIndex + 1;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.innerText = currentIndex === quizData.length - 1 ? "Finish 🎉" : "Next →";
        }

        function selectOption(selectedIndex) {
            const currentQ = quizData[currentIndex];
            userAnswers[currentIndex] = selectedIndex;
            const isCorrect = selectedIndex === currentQ.correct;

            if (isCorrect) {
                score++;
            }

            loadQuestion();
        }

        function showExplanation(isCorrect, currentQ) {
            explanationBox.classList.remove('hidden', 'bg-emerald-950/40', 'border-emerald-800', 'bg-rose-950/40', 'border-rose-800');
            if (isCorrect) {
                explanationBox.classList.add('bg-emerald-950/40', 'border-emerald-800');
                explanationTitle.innerHTML = `<span class="text-emerald-400">✅ Correct Answer! / सही उत्तर!</span>`;
            } else {
                explanationBox.classList.add('bg-rose-950/40', 'border-rose-800');
                explanationTitle.innerHTML = `<span class="text-rose-400">❌ Incorrect Answer / गलत उत्तर</span>`;
            }
            explanationTextHi.innerText = currentQ.expHi;
            explanationTextEn.innerText = currentQ.expEn;
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score}/${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const target = parseInt(jumpInput.value) - 1;
            if (target >= 0 && target < quizData.length) {
                currentIndex = target;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        // Initialize quiz on load
        window.onload = loadQuestion;
    </script>
<script src="../../quiz-question-controls.js"></script>
