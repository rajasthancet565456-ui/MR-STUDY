        let currentQIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        function loadQuestion(index) {
            const data = quizData[index];
            document.getElementById("page-tag").innerText = "Source: " + data.page;
            document.getElementById("q-type-tag").innerText = data.type;
            document.getElementById("question-text").innerText = `${index + 1}. ${data.question}`;
            
            // Progress Update
            document.getElementById("progress-text").innerText = `Question ${index + 1} of ${quizData.length}`;
            const percent = Math.round(((index + 1) / quizData.length) * 100);
            document.getElementById("progress-percent").innerText = `${percent}%`;
            document.getElementById("progress-bar").style.width = `${percent}%`;

            // Reset UI states
            document.getElementById("hint-box").classList.add("hidden");
            document.getElementById("hint-btn").innerHTML = `
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Show Hint</span>`;
            document.getElementById("hint-box").innerText = data.hint;
            document.getElementById("explanation-text").innerText = data.explanation;

            const expBox = document.getElementById("explanation-box");
            if (userAnswers[index] !== null) {
                expBox.classList.remove("hidden");
            } else {
                expBox.classList.add("hidden");
            }

            // Render Options
            const container = document.getElementById("options-container");
            container.innerHTML = "";

            data.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-700/80 bg-slate-800/50 hover:bg-slate-700/50 transition duration-200 flex items-center justify-between group";
                
                let badgeClass = "bg-slate-700 text-slate-300 group-hover:bg-slate-600";
                
                if (userAnswers[index] !== null) {
                    btn.disabled = true;
                    if (idx === data.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-emerald-500/50 bg-emerald-950/30 text-emerald-200 flex items-center justify-between";
                        badgeClass = "bg-emerald-600 text-white";
                    } else if (userAnswers[index] === idx) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-rose-500/50 bg-rose-950/30 text-rose-200 flex items-center justify-between";
                        badgeClass = "bg-rose-600 text-white";
                    }
                }

                const char = String.fromCharCode(65 + idx);
                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg ${badgeClass} text-xs font-bold flex items-center justify-center transition-colors">${char}</span>
                        <span class="text-sm font-medium">${opt}</span>
                    </div>
                `;

                btn.onclick = () => selectOption(idx);
                container.appendChild(btn);
            });

            // Update Nav Buttons
            document.getElementById("prev-btn").disabled = index === 0;
            document.getElementById("next-btn").disabled = index === quizData.length - 1;
        }

        function selectOption(optIndex) {
            if (userAnswers[currentQIndex] !== null) return;
            
            userAnswers[currentQIndex] = optIndex;
            if (optIndex === quizData[currentQIndex].correct) {
                score++;
                document.getElementById("score-display").innerText = `${score} / ${quizData.length}`;
            }

            loadQuestion(currentQIndex);
        }

        function toggleHint() {
            const box = document.getElementById("hint-box");
            const btn = document.getElementById("hint-btn");
            if (box.classList.contains("hidden")) {
                box.classList.remove("hidden");
                btn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Hide Hint</span>`;
            } else {
                box.classList.add("hidden");
                btn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Show Hint</span>`;
            }
        }

        function nextQuestion() {
            if (currentQIndex < quizData.length - 1) {
                currentQIndex++;
                loadQuestion(currentQIndex);
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--;
                loadQuestion(currentQIndex);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById("jump-input").value);
            if (val >= 1 && val <= quizData.length) {
                currentQIndex = val - 1;
                loadQuestion(currentQIndex);
            }
        }

        // Initialize App
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
