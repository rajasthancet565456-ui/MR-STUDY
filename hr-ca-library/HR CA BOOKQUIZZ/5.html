                    <button id="hint-toggle-btn" onclick="toggleHint()" class="text-xs font-semibold text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-md border border-amber-200 transition-colors flex items-center gap-1">

                    </div>
                </div>

                <!-- Options List -->
                <div id="options-container" class="space-y-3 mb-6">

                </div>
            </div>

            <!-- Explanation Box -->

            </div>

        </div>

                </button>

            </div>

                </button>
            </div>
        </div>

    </main>

        // Shuffle Options Helper Function (ensures random placement of correct answer)
        function getShuffledOptions(questionObj) {
            const originalOptions = [...questionObj.options];
            
            // Create array of objects with original indices
            let indexedOptions = originalOptions.map((opt, index) => ({ text: opt, originalIndex: index }));
            
            // Deterministic pseudo-shuffle based on question ID to maintain consistency during re-renders
            for (let i = indexedOptions.length - 1; i > 0; i--) {
                const j = (questionObj.id * 7 + i * 3) % (i + 1);
                [indexedOptions[i], indexedOptions[j]] = [indexedOptions[j], indexedOptions[i]];
            }
            
            return indexedOptions;

            shuffledOptions.forEach((optObj, idx) => {

                btn.className = "w-full text-left p-3.5 rounded-lg border border-slate-200 hover:bg-slate-50 transition-all flex items-start gap-3 text-sm sm:text-base font-medium text-slate-700";
                
                const optionLabel = String.fromCharCode(65 + idx); // A, B, C, D

                    if (optObj.originalIndex === q.answer) {
                        btn.classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-900", "font-semibold");
                    } else if (userSelection === optObj.originalIndex) {
                        btn.classList.add("bg-rose-50", "border-rose-500", "text-rose-900");

                        btn.classList.add("opacity-60");
                    }

            }

            // Controls state
            document.getElementById("prev-btn").disabled = currentQuestionIndex === 0;
            document.getElementById("next-btn").disabled = currentQuestionIndex === rawQuizData.length - 1;
            
            // Score Display
            document.getElementById("score-display").innerText = `${score} / ${rawQuizData.length}`;
        }

        // Handle Option Selection
        function selectOption(selectedIndex) {
            if (userAnswers[currentQuestionIndex] !== null) return; // Prevent re-selection
            
            userAnswers[currentQuestionIndex] = selectedIndex;
            if (selectedIndex === rawQuizData[currentQuestionIndex].answer) {
                score++;
            }
            renderQuestion();
        }

        // Toggle Hint Box
        function toggleHint() {
            const hintBox = document.getElementById("hint-box");
            hintBox.classList.toggle("hidden");
        }

        // Navigation Functions
        function nextQuestion() {
            if (currentQuestionIndex < rawQuizData.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById("jump-input");
            const val = parseInt(input.value);
            if (val >= 1 && val <= rawQuizData.length) {
                currentQuestionIndex = val - 1;
                renderQuestion();
                input.value = "";
            }
        }

        // Keyboard Shortcut Navigation
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") nextQuestion();
            if (e.key === "ArrowLeft") prevQuestion();
        });

        // Initializing App
        renderQuestion();
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
