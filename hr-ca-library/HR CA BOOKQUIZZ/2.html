<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-md py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Haryana GK & Current Affairs Quiz</h1>
                <p class="text-xs text-indigo-200">75 Unique Questions extracted directly from RBC Source Material (25 per Page)</p>
            </div>
            <div class="flex items-center gap-4 bg-indigo-950 px-4 py-2 rounded-lg border border-indigo-700">
                <div class="text-center">
                    <span class="block text-xs text-indigo-300 uppercase font-semibold">Score / अंक</span>
                    <span id="score-display" class="text-lg font-bold text-yellow-300">0 / 0</span>
                </div>
                <div class="h-8 w-px bg-indigo-700"></div>
                <div class="text-center">
                    <span class="block text-xs text-indigo-300 uppercase font-semibold">Progress / प्रगति</span>
                    <span id="progress-text" class="text-lg font-bold text-white">1 / 75</span>
                </div>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="w-full bg-indigo-950 h-2 mt-3 rounded-full overflow-hidden max-w-4xl mx-auto">
            <div id="progress-bar" class="bg-yellow-400 h-full w-0 transition-all duration-300"></div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-between">
        
        <!-- Quiz Card -->
        <div id="quiz-card" class="bg-white rounded-xl shadow-md border border-slate-200 p-6 mb-6 flex-grow flex flex-col justify-between">
            
            <div>
                <!-- Question Meta Header -->
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                    <span id="question-number" class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">
                        Question 1
                    </span>
                    <span id="subtopic-tag" class="text-xs font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded">
                        Topic: General
                    </span>
                </div>

                <!-- Question Text -->
                <div id="question-text" class="text-base sm:text-lg font-semibold text-slate-800 mb-6 leading-relaxed whitespace-pre-line">
                    Loading question...
                </div>

                <!-- Hint Collapsible Button -->
                <div class="mb-4">
                    <button id="hint-toggle-btn" onclick="toggleHint()" class="text-xs font-semibold text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-md border border-amber-200 transition-colors flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Need a Hint? / संकेत
                    </button>
                    <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border-l-4 border-amber-400 text-xs text-amber-800 rounded">
                        <span id="hint-text">Hint content...</span>
                    </div>
                </div>

                <!-- Options List -->
                <div id="options-container" class="space-y-3 mb-6">
                    <!-- Options populated dynamically -->
                </div>
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden mt-4 p-4 bg-slate-50 border-l-4 border-indigo-500 rounded-r-lg">
                <h4 class="text-xs font-bold text-indigo-900 uppercase tracking-wider mb-1">Explanation / व्याख्या:</h4>
                <p id="explanation-text" class="text-sm text-slate-700 leading-relaxed"></p>
            </div>

        </div>

        <!-- Navigation & Controls Footer -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <button id="prev-btn" onclick="prevQuestion()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Previous / पिछला
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    Next / अगला
                </button>
            </div>

            <div class="flex items-center gap-2">
                <label for="jump-input" class="text-xs text-slate-500 font-medium">Jump to:</label>
                <input type="number" id="jump-input" min="1" max="75" class="w-16 px-2 py-1 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center" placeholder="1-75">
                <button onclick="jumpToQuestion()" class="px-3 py-1 bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium rounded transition-colors">
                    Go
                </button>
            </div>
        </div>

    </main>

        // State variables
        let currentQuestionIndex = 0;
        let userAnswers = new Array(rawQuizData.length).fill(null);
        let score = 0;

        // Shuffle Options Helper Function (ensures random placement of correct answer)
        function getShuffledOptions(questionObj) {
            const originalOptions = [...questionObj.options];
            const correctAnswerText = originalOptions[questionObj.answer];
            
            // Create array of objects with original indices
            let indexedOptions = originalOptions.map((opt, index) => ({ text: opt, originalIndex: index }));
            
            // Deterministic pseudo-shuffle based on question ID to maintain consistency during re-renders
            for (let i = indexedOptions.length - 1; i > 0; i--) {
                const j = (questionObj.id * 7 + i * 3) % (i + 1);
                [indexedOptions[i], indexedOptions[j]] = [indexedOptions[j], indexedOptions[i]];
            }
            
            return indexedOptions;
        }

        // Render Current Question
        function renderQuestion() {
            const q = rawQuizData[currentQuestionIndex];
            
            // Update Header & Progress
            document.getElementById("question-number").innerText = `Question ${currentQuestionIndex + 1} of ${rawQuizData.length} (Page ${q.page})`;
            document.getElementById("subtopic-tag").innerText = `Topic: ${q.subtopic}`;
            document.getElementById("progress-text").innerText = `${currentQuestionIndex + 1} / ${rawQuizData.length}`;
            
            const progressPercent = ((currentQuestionIndex + 1) / rawQuizData.length) * 100;
            document.getElementById("progress-bar").style.width = `${progressPercent}%`;

            // Update Question Text & Hint
            document.getElementById("question-text").innerText = q.question;
            document.getElementById("hint-text").innerText = q.hint;
            document.getElementById("hint-box").classList.add("hidden");

            // Build Options List
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            const shuffledOptions = getShuffledOptions(q);
            const userSelection = userAnswers[currentQuestionIndex];

            shuffledOptions.forEach((optObj, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-lg border border-slate-200 hover:bg-slate-50 transition-all flex items-start gap-3 text-sm sm:text-base font-medium text-slate-700";
                
                const optionLabel = String.fromCharCode(65 + idx); // A, B, C, D
                
                // Option state styling
                if (userSelection !== null) {
                    btn.disabled = true;
                    if (optObj.originalIndex === q.answer) {
                        btn.classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-900", "font-semibold");
                    } else if (userSelection === optObj.originalIndex) {
                        btn.classList.add("bg-rose-50", "border-rose-500", "text-rose-900");
                    } else {
                        btn.classList.add("opacity-60");
                    }
                }

                btn.onclick = () => selectOption(optObj.originalIndex);
                btn.innerHTML = `
                    <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold shrink-0 mt-0.5 border border-slate-200">
                        ${optionLabel}
                    </span>
                    <span>${optObj.text}</span>
                `;
                optionsContainer.appendChild(btn);
            });

            // Explanation Display
            const expBox = document.getElementById("explanation-box");
            if (userSelection !== null) {
                document.getElementById("explanation-text").innerText = q.explanation;
                expBox.classList.remove("hidden");
            } else {
                expBox.classList.add("hidden");
            }

            // Controls state
            document.getElementById("prev-btn").disabled = currentQuestionIndex === 0;
            document.getElementById("next-btn").disabled = currentQuestionIndex === rawQuizData.length - 1;
            
            // Score Display
            document.getElementById("score-display").innerText = `${score} / ${rawQuizData.length}`;
        }

        // Handle Option Selection
        function selectOption(selectedIndex) {
            if (userAnswers[currentQuestionIndex] !== null) return; // Prevent re-selection
            
            userAnswers[currentQuestionIndex] = selectedIndex;
            if (selectedIndex === rawQuizData[currentQuestionIndex].answer) {
                score++;
            }
            renderQuestion();
        }

        // Toggle Hint Box
        function toggleHint() {
            const hintBox = document.getElementById("hint-box");
            hintBox.classList.toggle("hidden");
        }

        // Navigation Functions
        function nextQuestion() {
            if (currentQuestionIndex < rawQuizData.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById("jump-input");
            const val = parseInt(input.value);
            if (val >= 1 && val <= rawQuizData.length) {
                currentQuestionIndex = val - 1;
                renderQuestion();
                input.value = "";
            }
        }

        // Keyboard Shortcut Navigation
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") nextQuestion();
            if (e.key === "ArrowLeft") prevQuestion();
        });

        // Initializing App
        renderQuestion();
    </script>
