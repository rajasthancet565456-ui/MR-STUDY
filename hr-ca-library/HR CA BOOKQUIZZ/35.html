<!DOCTYPE html>

    <style>

<style id="celestial-quiz-theme">

go-400,.text-indigo-300,.text-emerald-400,.text-yellow-300{color:var(--edge)!important}.border-slate-700,.border-slate-700\/60,.border-indigo-700,.border-slate-200{border-color:color-mix(in srgb,var(--edge) 27%,transparent)!important}button:not(.bg-green-600):not(.bg-red-600){background:color-mix(in srgb,var(--panel2) 54%,var(--panel))!important;color:var(--ink)!important;border:1px solid color-mix(in srgb,var(--edge) 25%,transparent)!important;box-shadow:0 3px 10px color-mix(in srgb,var(--edge) 10%,transparent)!important}button.bg-indigo-600,button.bg-slate-800,button.bg-slate-900,button.bg-indigo-900{background:linear-gradient(120deg,var(--edge),var(--accent))!important;color:#fff!important;border:0!important}button.bg-indigo-600 *,button.bg-slate-800 *,button.bg-slate-900 *,button.bg-indigo-900 *{color:#fff!important}button:hover{filter:brightness(1.04);transform:translateY(-1px)}input,select,textarea{background:color-mix(in srgb,var(--panel) 72%,var(--panel2))!important;border-color:color-mix(in srgb,var(--edge) 34%,transparent)!important;color:var(--ink)!important}input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--edge)!important;box-shadow:0 0 0 3px var(--mist)!important}.bg-indigo-500,#progress-bar{background:linear-gradient(90deg,var(--edge),var(--accent),var(--glow))!important}.rounded-2xl{border-radius:1.25rem!important}@media(max-width:640px){body:before{opacity:.5}main{padding-top:1rem!important}}

<body class="bg-slate-900 text-slate-100 h-full flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header Section -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-indigo-400 flex items-center gap-2">
                    Haryana Current Affairs Quiz <span class="text-xs bg-indigo-900 text-indigo-200 py-1 px-2.5 rounded-full border border-indigo-700">Bilingual (हिन्दी / English)</span>
                </h1>
                <p class="text-xs text-slate-400 mt-1">Exam-Level Depth: SSC, RRB, HSSC, State Exams Aligned</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 text-sm">
                    <span class="text-slate-400">Score:</span> <span id="score" class="font-bold text-emerald-400">0</span> / <span id="total-score">90</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 flex-grow flex flex-col justify-center">
        
        <!-- Progress & Info Bar -->
        <div class="mb-4">
            <div class="flex justify-between items-center text-xs sm:text-sm text-slate-400 mb-2">
                <span id="question-tracker">Question 1 of 90</span>
                <span id="source-badge" class="bg-slate-800 px-2 py-0.5 rounded text-indigo-300 font-medium">Page 1 Source</span>
            </div>
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700">
                <div id="progress-bar" class="bg-indigo-500 h-full transition-all duration-300" style="width: 1.11%;"></div>
            </div>
        </div>

        <!-- Quiz Card -->
        <div id="quiz-card" class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-5 sm:p-8 relative">
            
            <!-- Question Text -->
            <div class="mb-6">
                <h2 id="question-text" class="text-base sm:text-lg font-semibold text-slate-100 leading-relaxed mb-2">
                    <!-- Dynamic Question text injected here -->
                </h2>
                <p id="question-text-en" class="text-xs sm:text-sm text-indigo-300 italic">
                    <!-- Dynamic English translation injected here -->
                </p>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamic options injected here -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs text-amber-400 hover:text-amber-300 flex items-center gap-1 font-medium transition-colors">
                    💡 View Hint / संकेत देखें
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-950/40 border border-amber-800/50 rounded-lg text-xs text-amber-200">
                    <!-- Hint text -->
                </div>
            </div>

            <!-- Explanation Box (Hidden initially) -->
            <div id="explanation-box" class="hidden mt-6 p-4 bg-slate-900/80 border border-slate-700 rounded-xl text-sm">
                <h3 class="font-bold text-indigo-400 mb-1 flex items-center gap-1.5">
                    <span>📖</span> Explanation / व्याख्या:
                </h3>
                <p id="explanation-text" class="text-slate-300 text-xs sm:text-sm leading-relaxed"></p>
            </div>

        </div>

        <!-- Navigation Controls -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-6">
            <div class="flex items-center gap-2 w-full sm:w-auto justify-between">
                <button onclick="prevQuestion()" id="prev-btn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    ← Previous
                </button>
                <button onclick="nextQuestion()" id="next-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-indigo-600/20">
                    Next →
                </button>
            </div>

            <!-- Jump to Question Input -->
            <div class="flex items-center gap-2 text-sm w-full sm:w-auto justify-end">
                <span class="text-slate-400 text-xs">Jump to:</span>
                <input type="number" id="jump-input" min="1" max="90" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center text-slate-100 text-sm focus:outline-none focus:border-indigo-500" placeholder="1-90">
                <button onclick="jumpToQuestion()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-medium transition-colors">Go</button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-500">
        Haryana Current Affairs Quiz Application • Total 90 Unique Questions (30 per page)
    </footer>

    <!-- Script Application Logic -->

                qHindi: "अंकुश मिगलानी को भारतीय रेडक्रॉस सोसायटी की राष्ट्रीय प्रबंध कार्यकारिणी में किस रूप में चुना गया है?",
                qEnglish: "In what capacity has Ankush Miglani been elected to the National Managing Body of the Indian Red Cross Society?",
                options: [
                    "राष्ट्रीय राष्ट्रपति द्वारा मनोनीत सदस्य (National President's Nominee)",
                    "राज्य प्रतिनिधि",
                    "चुना हुआ अध्यक्ष",
                    "सलाहकार"
                ],
                correct: 0,
                hint: "राष्ट्रीय मुख्यालय की प्रबंध कार्यकारिणी में कुल 18 सदस्य होते हैं, जिनमें से केवल 6 सदस्यों को राष्ट्रपति (जो सोसायटी के अध्यक्ष होते हैं) द्वारा मनोनीत किया जाता है।",
                explanation: "उन्हें राष्ट्रपति द्वारा मनोनीत सदस्य के रूप में चुना गया है।"
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let answered = new Array(questionsData.length).fill(false);
        let userAnswers = new Array(questionsData.length).fill(null);

        const questionTracker = document.getElementById('question-tracker');
        const sourceBadge = document.getElementById('source-badge');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const questionTextEn = document.getElementById('question-text-en');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const scoreDisplay = document.getElementById('score');
        const totalScoreDisplay = document.getElementById('total-score');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        totalScoreDisplay.textContent = questionsData.length;

        function loadQuestion(index) {
            const q = questionsData[index];
            questionTracker.textContent = `Question ${index + 1} of ${questionsData.length}`;
            sourceBadge.textContent = q.page;
            progressBar.style.width = `${((index + 1) / questionsData.length) * 100}%`;

            questionText.textContent = q.qHindi;
            questionTextEn.textContent = q.qEnglish;

            // Hide hint and explanation initially for this card, or restore state
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;

            if (answered[index]) {
                explanationBox.classList.remove('hidden');
                explanationText.textContent = q.explanation;
            } else {
                explanationBox.classList.add('hidden');
            }

            // Render options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border text-sm sm:text-base transition-all flex items-center justify-between font-medium ${
                    getOptionStyle(index, i)
                }`;
                btn.innerHTML = `<span>${opt}</span> <span class="text-xs opacity-70">${String.fromCharCode(65 + i)}</span>`;
                
                if (!answered[index]) {
                    btn.onclick = () => selectOption(index, i);
                } else {
                    btn.disabled = true;
                }
                optionsContainer.appendChild(btn);
            });

            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === questionsData.length - 1 ? 'Finish' : 'Next →';
        }

        function getOptionStyle(qIndex, optIndex) {
            if (!answered[qIndex]) {
                return "bg-slate-900/50 border-slate-700 hover:bg-slate-700/50 hover:border-indigo-500 text-slate-200 cursor-pointer";
            }
            const q = questionsData[qIndex];
            if (optIndex === q.correct) {
                return "bg-emerald-950/60 border-emerald-600 text-emerald-200 font-semibold cursor-default";
            }
            if (userAnswers[qIndex] === optIndex && optIndex !== q.correct) {
                return "bg-rose-950/60 border-rose-600 text-rose-200 cursor-default";
            }
            return "bg-slate-900/30 border-slate-800 text-slate-500 cursor-default opacity-50";
        }

        function selectOption(qIndex, optIndex) {
            if (answered[qIndex]) return;
            answered[qIndex] = true;
            userAnswers[qIndex] = optIndex;

            const q = questionsData[qIndex];
            if (optIndex === q.correct) {
                score++;
                scoreDisplay.textContent = score;
            }

            loadQuestion(qIndex);
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < questionsData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`Quiz completed! Your final score is ${score} / ${questionsData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value) - 1;
            if (val >= 0 && val < questionsData.length) {
                currentIndex = val;
                loadQuestion(currentIndex);
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${questionsData.length}`);
            }
        }

        // Initialize first question
        loadQuestion(currentIndex);
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
