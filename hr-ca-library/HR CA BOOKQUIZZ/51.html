        let currentIdx = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressText = document.getElementById('progress-text');
        const progressPercentage = document.getElementById('progress-percentage');
        const progressBar = document.getElementById('progress-bar');
        const scoreDisplay = document.getElementById('score-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const questionCategory = document.getElementById('question-category');
        const questionFormat = document.getElementById('question-format');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentIdx];
            
            // Update metadata tags
            questionCategory.innerText = `Source: ${q.page}`;
            questionFormat.innerText = q.format;

            // Bilingual Question Display
            questionText.innerHTML = `
                <div class="mb-2 text-indigo-900">${currentIdx + 1}. ${q.questionHindi}</div>
                <div class="text-sm font-normal text-slate-600 italic">Q${currentIdx + 1}. ${q.questionEnglish}</div>
            `;

            // Clear hint and explanation boxes
            hintBox.classList.add('hidden');
            hintBox.innerHTML = `
                <p><strong>संकेत:</strong> ${q.hintHindi}</p>
                <p class="text-slate-600 mt-1"><strong>Hint:</strong> ${q.hintEnglish}</p>
            `;

            explanationBox.classList.add('hidden');
            explanationBox.innerHTML = '';

            // Render options (shuffled index preserved or randomized per session)
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, oIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition-all flex flex-col gap-1 text-sm sm:text-base font-medium `;
                
                const isSelected = userAnswers[currentIdx] === oIdx;
                
                if (userAnswers[currentIdx] !== null) {
                    // Already answered state
                    if (opt.isCorrect) {
                        btn.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
                    } else if (isSelected && !opt.isCorrect) {
                        btn.classList.add('bg-rose-50', 'border-rose-300', 'text-rose-900');
                    } else {
                        btn.classList.add('bg-white', 'border-slate-200', 'text-slate-600', 'opacity-70');
                    }
                    btn.disabled = true;
                } else {
                    // Unanswered state
                    btn.classList.add('bg-white', 'border-slate-200', 'hover:border-indigo-300', 'hover:bg-indigo-50/30', 'text-slate-700', 'shadow-sm');
                    btn.onclick = () => selectOption(oIdx);
                }

                btn.innerHTML = `
                    <div class="flex items-start gap-2">
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold shrink-0 mt-0.5">${String.fromCharCode(65 + oIdx)}</span>
                        <div>
                            <div>${opt.textHindi}</div>
                            <div class="text-xs text-slate-500 font-normal mt-0.5">${opt.textEnglish}</div>
                        </div>
                    </div>
                `;
                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation
            if (userAnswers[currentIdx] !== null) {
                showExplanationBox();
            }

            // Update Progress UI
            const progressVal = ((currentIdx + 1) / quizData.length) * 100;
            progressText.innerText = `Question ${currentIdx + 1} of ${quizData.length}`;
            progressPercentage.innerText = `${Math.round(progressVal)}%`;
            progressBar.style.width = `${progressVal}%`;
            scoreDisplay.innerText = score;

            // Nav buttons state
            prevBtn.disabled = currentIdx === 0;
            nextBtn.disabled = currentIdx === quizData.length - 1;
        }

        function selectOption(oIdx) {
            const q = quizData[currentIdx];
            userAnswers[currentIdx] = oIdx;

            if (q.options[oIdx].isCorrect) {
                score++;
            }

            loadQuestion();
        }

        function showExplanationBox() {
            const q = quizData[currentIdx];
            const isCorrectUser = q.options[userAnswers[currentIdx]].isCorrect;

            explanationBox.className = `mt-6 p-4 rounded-xl border transition-all ${isCorrectUser ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'}`;
            explanationBox.classList.remove('hidden');
            explanationBox.innerHTML = `
                <div class="font-bold text-sm mb-1 flex items-center gap-1.5">
                    <span>${isCorrectUser ? '✅ Correct! / सही उत्तर!' : '❌ Incorrect! / गलत उत्तर!'}</span>
                </div>
                <p class="text-xs sm:text-sm mb-1"><strong>स्पष्टीकरण:</strong> ${q.explanationHindi}</p>
                <p class="text-xs sm:text-sm text-slate-600 italic"><strong>Explanation:</strong> ${q.explanationEnglish}</p>
            `;
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIdx = val - 1;
                jumpInput.value = '';
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Initial Load
        loadQuestion();
    </script>
