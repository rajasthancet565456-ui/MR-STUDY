igo-400,.text-indigo-300,.text-emerald-400,.text-yellow-300{color:var(--edge)!important}.border-slate-700,.border-slate-700\/60,.border-indigo-700,.border-slate-200{border-color:color-mix(in srgb,var(--edge) 27%,transparent)!important}button:not(.bg-green-600):not(.bg-red-600){background:color-mix(in srgb,var(--panel2) 54%,var(--panel))!important;color:var(--ink)!important;border:1px solid color-mix(in srgb,var(--edge) 25%,transparent)!important;box-shadow:0 3px 10px color-mix(in srgb,var(--edge) 10%,transparent)!important}button.bg-indigo-600,button.bg-slate-800,button.bg-slate-900,button.bg-indigo-900{background:linear-gradient(120deg,var(--edge),var(--accent))!important;color:#fff!important;border:0!important}button.bg-indigo-600 *,button.bg-slate-800 *,button.bg-slate-900 *,button.bg-indigo-900 *{color:#fff!important}button:hover{filter:brightness(1.04);transform:translateY(-1px)}input,select,textarea{background:color-mix(in srgb,var(--panel) 72%,var(--panel2))!important;border-color:color-mix(in srgb,var(--edge) 34%,transparent)!important;color:var(--ink)!important}input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--edge)!important;box-shadow:0 0 0 3px var(--mist)!important}.bg-indigo-500,#progress-bar{background:linear-gradient(90deg,var(--edge),var(--accent),var(--glow))!important}.rounded-2xl{border-radius:1.25rem!important}@media(max-width:640px){body:before{opacity:.5}main{padding-top:1rem!important}}

<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-md py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Haryana Current Affairs Quiz (2026-27)</h1>
                <p class="text-xs text-indigo-200">75 Unique Exam-Level Questions (25 per Page: Pages 20, 21 & 22)</p>
            </div>
            <div class="flex items-center gap-4 bg-indigo-950 px-4 py-2 rounded-lg border border-indigo-700">
                <div class="text-center">
                    <span class="block text-xs text-indigo-300 uppercase font-semibold">Score / अंक</span>
                    <span id="score-display" class="text-lg font-bold text-yellow-300">0 / 0</span>
                </div>
                <div class="h-8 w-px bg-indigo-700"></div>
                <div class="text-center">
                    <span class="block text-xs text-indigo-300 uppercase font-semibold">Progress / प्रगति</span>
                    <span id="progress-text" class="text-lg font-bold text-white">1 / 75</span>
                </div>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="w-full bg-indigo-950 h-2 mt-3 rounded-full overflow-hidden max-w-4xl mx-auto">
            <div id="progress-bar" class="bg-yellow-400 h-full w-0 transition-all duration-300"></div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-between">
        
        <!-- Quiz Card -->
        <div id="quiz-card" class="bg-white rounded-xl shadow-md border border-slate-200 p-6 mb-6 flex-grow flex flex-col justify-between">
            
            <div>
                <!-- Question Meta Header -->
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                    <span id="question-number" class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">
                        Question 1
                    </span>
                    <span id="subtopic-tag" class="text-xs font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded">
                        Topic: General
                    </span>
                </div>

                <!-- Question Text -->
                <div id="question-text" class="text-base sm:text-lg font-semibold text-slate-800 mb-6 leading-relaxed whitespace-pre-line">
                    Loading question...
                </div>

                <!-- Hint Collapsible Button -->
                <div class="mb-4">
                    <button id="hint-toggle-btn" onclick="toggleHint()" class="text-xs font-semibold text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-md border border-amber-200 transition-colors flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Need a Hint? / संकेत
                    </button>
                    <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border-l-4 border-amber-400 text-xs text-amber-800 rounded">
                        <span id="hint-text">Hint content...</span>
                    </div>
                </div>

                <!-- Options List -->
                <div id="options-container" class="space-y-3 mb-6">
                    <!-- Options populated dynamically -->
                </div>
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden mt-4 p-4 bg-slate-50 border-l-4 border-indigo-500 rounded-r-lg">
                <h4 class="text-xs font-bold text-indigo-900 uppercase tracking-wider mb-1">Explanation / व्याख्या:</h4>
                <p id="explanation-text" class="text-sm text-slate-700 leading-relaxed"></p>
            </div>

        </div>

        <!-- Navigation & Controls Footer -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <button id="prev-btn" onclick="prevQuestion()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Previous / पिछला
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    Next / अगला
                </button>
            </div>

            <div class="flex items-center gap-2">
                <label for="jump-input" class="text-xs text-slate-500 font-medium">Jump to:</label>
                <input type="number" id="jump-input" min="1" max="75" class="w-16 px-2 py-1 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center" placeholder="1-75">
                <button onclick="jumpToQuestion()" class="px-3 py-1 bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium rounded transition-colors">
                    Go
                </button>
            </div>
        </div>

    </main>

        // Shuffle Options Algorithm to randomize answer positions unpredictably
        function prepareQuizData(data) {
            return data.map(q => {
                const optionsObj = q.options.map((opt, index) => ({
                    text: opt,
                    isCorrect: index === q.answer
                }));

                // Fisher-Yates Shuffle
                for (let i = optionsObj.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsObj[i], optionsObj[j]] = [optionsObj[j], optionsObj[i]];
                }

                const newOptions = optionsObj.map(o => o.text);
                const newAnswerIndex = optionsObj.findIndex(o => o.isCorrect);

                return {
                    ...q,
                    options: newOptions,
                    answer: newAnswerIndex
                };
            });
        }

        const quizData = prepareQuizData(rawQuizData);

        // Application State Variables
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        // DOM Elements
        const questionNumberEl = document.getElementById("question-number");
        const subtopicTagEl = document.getElementById("subtopic-tag");
        const questionTextEl = document.getElementById("question-text");
        const optionsContainerEl = document.getElementById("options-container");
        const hintBoxEl = document.getElementById("hint-box");
        const hintTextEl = document.getElementById("hint-text");
        const explanationBoxEl = document.getElementById("explanation-box");
        const explanationTextEl = document.getElementById("explanation-text");
        const scoreDisplayEl = document.getElementById("score-display");
        const progressTextEl = document.getElementById("progress-text");
        const progressBarEl = document.getElementById("progress-bar");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const jumpInput = document.getElementById("jump-input");

        // Render Current Question
        function renderQuestion() {
            const currentQ = quizData[currentQuestionIndex];

            // Reset States
            hintBoxEl.classList.add("hidden");
            explanationBoxEl.classList.add("hidden");

            // Header info
            questionNumberEl.textContent = `Question ${currentQ.id} / ${quizData.length} (Page ${currentQ.page})`;
            subtopicTagEl.textContent = `Topic: ${currentQ.subtopic}`;
            questionTextEl.textContent = currentQ.question;
            hintTextEl.textContent = currentQ.hint;
            explanationTextEl.textContent = currentQ.explanation;

            // Render Options
            optionsContainerEl.innerHTML = "";
            const optionLabels = ["A", "B", "C", "D"];

            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-lg border text-sm font-medium transition-all flex items-start gap-3 bg-white border-slate-200 hover:border-indigo-300 hover:bg-indigo-50/30";
                
                const badge = document.createElement("span");
                badge.className = "w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs flex items-center justify-center font-bold flex-shrink-0 mt-0.5 border border-slate-200";
                badge.textContent = optionLabels[idx];

                const optText = document.createElement("span");
                optText.className = "flex-grow pt-0.5";
                optText.textContent = opt;

                btn.appendChild(badge);
                btn.appendChild(optText);

                btn.onclick = () => selectOption(idx);

                // If answered previously
                if (userAnswers[currentQuestionIndex] !== null) {
                    const selectedIdx = userAnswers[currentQuestionIndex];
                    btn.disabled = true;

                    if (idx === currentQ.answer) {
                        btn.className = "w-full text-left p-3.5 rounded-lg border text-sm font-medium flex items-start gap-3 bg-emerald-50 border-emerald-500 text-emerald-900";
                        badge.className = "w-6 h-6 rounded-full bg-emerald-600 text-white text-xs flex items-center justify-center font-bold flex-shrink-0 mt-0.5";
                    } else if (idx === selectedIdx) {
                        btn.className = "w-full text-left p-3.5 rounded-lg border text-sm font-medium flex items-start gap-3 bg-rose-50 border-rose-500 text-rose-900";
                        badge.className = "w-6 h-6 rounded-full bg-rose-600 text-white text-xs flex items-center justify-center font-bold flex-shrink-0 mt-0.5";
                    } else {
                        btn.className = "w-full text-left p-3.5 rounded-lg border text-sm font-medium flex items-start gap-3 bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                    }
                }

                optionsContainerEl.appendChild(btn);
            });

            // Show explanation if already answered
            if (userAnswers[currentQuestionIndex] !== null) {
                explanationBoxEl.classList.remove("hidden");
            }

            // Update Header & Footer Controls
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.disabled = currentQuestionIndex === quizData.length - 1;
            
            progressTextEl.textContent = `${currentQuestionIndex + 1} / ${quizData.length}`;
            const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
            progressBarEl.style.width = `${progressPercent}%`;
            scoreDisplayEl.textContent = `${score} / ${quizData.length}`;
        }

        // Option Selection Event
        function selectOption(index) {
            if (userAnswers[currentQuestionIndex] !== null) return;

            userAnswers[currentQuestionIndex] = index;
            if (index === quizData[currentQuestionIndex].answer) {
                score++;
            }

            renderQuestion();
        }

        // Toggle Hint Box
        function toggleHint() {
            hintBoxEl.classList.toggle("hidden");
        }

        // Navigation Functions
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const targetVal = parseInt(jumpInput.value);
            if (targetVal >= 1 && targetVal <= quizData.length) {
                currentQuestionIndex = targetVal - 1;
                renderQuestion();
                jumpInput.value = "";
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        // Initialize App on load
        window.onload = () => {
            renderQuestion();
        };
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
