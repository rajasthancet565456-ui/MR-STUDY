                expEn: "The 3-day exhibition was organized from Feb 6 to Feb 8, 2026."
            },
            {
                page: "134",
                qHi: "स्पेशल ओलंपिक भारत एथलेटिक्स नेशनल चैंपियनशिप 2026 के अवसर पर किस जिले में 'दिव्यांग स्टेडियम' बनाने का निर्णय लिया गया?",
                qEn: "On the occasion of Special Olympics Bharat Athletics 2026, in which district was 'Divyang Stadium' announced?",
                options: [
                    { hi: "रोहतक", en: "Rohtak" },
                    { hi: "पंचकुला", en: "Panchkula" },
                    { hi: "गुरुग्राम", en: "Gurugram" },
                    { hi: "हिसार", en: "Hisar" }
                ],
                answer: 0,
                hintHi: "यह विश्वविद्यालय शहर MDU के लिए प्रसिद्ध है।",
                hintEn: "This university town is famous for MDU.",
                expHi: "MDU रोहतक में आयोजित स्पेशल ओलंपिक में सीएम सैनी ने रोहतक में दिव्यांग स्टेडियम बनाने की घोषणा की।",
                expEn: "CM Saini announced construction of Divyang Stadium in Rohtak during the Special Olympics event at MDU."
            },
            {
                page: "134",
                qHi: "हरियाणा सरकार द्वारा 'अमृत भारत स्टेशन योजना' के तहत कुल कितने रेलवे स्टेशनों का पुनर्विकास किया जा रहा है?",
                qEn: "Under 'Amrit Bharat Station Scheme', redevelopment of how many railway stations is being done in Haryana?",
                options: [
                    { hi: "34 रेलवे स्टेशन", en: "34 Railway Stations" },
                    { hi: "10 रेलवे स्टेशन", en: "10 Railway Stations" },
                    { hi: "50 रेलवे स्टेशन", en: "50 Railway Stations" },
                    { hi: "20 रेलवे स्टेशन", en: "20 Railway Stations" }
                ],
                answer: 0,
                hintHi: "इसी योजना के तहत 8 नई वंदे भारत ट्रेनें भी संचालित होंगी।",
                hintEn: "8 new Vande Bharat trains will also run under this plan.",
                expHi: "बजट आवंटन के तहत अमृत भारत स्टेशन योजना में हरियाणा के 34 स्टेशनों का पुनर्विकास और 8 नई वंदे भारत ट्रेनें शामिल हैं।",
                expEn: "34 stations in Haryana are being redeveloped under the Amrit Bharat Station Scheme alongside 8 Vande Bharat trains."
            }
        ];

        // --- APP STATE ---
        let currentIdx = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let currentOptionsOrder = [];

        // --- SHUFFLE FUNCTION (Fisher-Yates) ---
        function getShuffledOptions(qObj) {
            let optionsWithOriginalIndex = qObj.options.map((opt, idx) => ({
                ...opt,
                originalIndex: idx
            }));
            for (let i = optionsWithOriginalIndex.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsWithOriginalIndex[i], optionsWithOriginalIndex[j]] = [optionsWithOriginalIndex[j], optionsWithOriginalIndex[i]];
            }
            return optionsWithOriginalIndex;
        }

        // --- RENDER QUESTION ---
        function renderQuestion() {
            const q = quizData[currentIdx];

            // Shuffle options for unpredictable position
            currentOptionsOrder = getShuffledOptions(q);

            // Update Header & Tags
            document.getElementById("question-number").innerText = `Question ${currentIdx + 1} of ${quizData.length}`;
            document.getElementById("page-tag").innerText = `Source: Page ${q.page}`;
            
            // Progress Bar
            const progressPct = ((currentIdx + 1) / quizData.length) * 100;
            document.getElementById("progress-bar").style.width = `${progressPct}%`;

            // Question Text
            document.getElementById("question-text-hi").innerText = q.qHi;
            document.getElementById("question-text-en").innerText = q.qEn;

            // Reset Hint Box
            document.getElementById("hint-box").classList.add("hidden");
            document.getElementById("hint-text").innerText = `${q.hintHi} / ${q.hintEn}`;

            // Reset Explanation Box
            const expBox = document.getElementById("explanation-box");
            if (userAnswers[currentIdx] !== null) {
                expBox.classList.remove("hidden");
                document.getElementById("explanation-text-hi").innerText = q.expHi;
                document.getElementById("explanation-text-en").innerText = q.expEn;
            } else {
                expBox.classList.add("hidden");
            }

            // Render Options
            const container = document.getElementById("options-container");
            container.innerHTML = "";

            const labels = ["A", "B", "C", "D"];
            currentOptionsOrder.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn w-full text-left p-3.5 rounded-lg border-2 font-medium flex items-center justify-between text-sm md:text-base focus:outline-none";
                
                const isSelected = userAnswers[currentIdx] === opt.originalIndex;
                const isCorrect = opt.originalIndex === q.answer;

                if (userAnswers[currentIdx] !== null) {
                    if (isCorrect) {
                        btn.classList.add("border-emerald-500", "bg-emerald-50", "text-emerald-900");
                    } else if (isSelected && !isCorrect) {
                        btn.classList.add("border-rose-500", "bg-rose-50", "text-rose-900");
                    } else {
                        btn.classList.add("border-slate-200", "bg-slate-50", "text-slate-400", "opacity-60");
                    }
                } else {
                    btn.classList.add("border-slate-200", "bg-white", "hover:border-indigo-400", "hover:bg-indigo-50/30", "text-slate-700");
                }

                btn.onclick = () => handleOptionClick(opt.originalIndex);

                btn.innerHTML = `
                    <div class="flex items-start gap-3">
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-200 text-slate-700 font-bold text-xs shrink-0 mt-0.5">
                            ${labels[idx]}
                        </span>
                        <div>
                            <div class="font-semibold text-slate-800">${opt.hi}</div>
                            <div class="text-xs text-slate-500 italic font-normal">${opt.en}</div>
                        </div>
                    </div>
                `;
                container.appendChild(btn);
            });

            // Update Control Buttons
            document.getElementById("prev-btn").disabled = (currentIdx === 0);
            document.getElementById("next-btn").disabled = (currentIdx === quizData.length - 1);
            
            updateScoreDisplay();
        }

        // --- HANDLE OPTION SELECTION ---
        function handleOptionClick(originalIdx) {
            if (userAnswers[currentIdx] !== null) return; // Prevent changing choice once made

            userAnswers[currentIdx] = originalIdx;

            // Show Explanation
            const q = quizData[currentIdx];
            document.getElementById("explanation-text-hi").innerText = q.expHi;
            document.getElementById("explanation-text-en").innerText = q.expEn;
            document.getElementById("explanation-box").classList.remove("hidden");

            renderQuestion();
        }

        // --- UPDATE SCORE ---
        function updateScoreDisplay() {
            let correctCount = 0;
            let attemptedCount = 0;

            userAnswers.forEach((ans, idx) => {
                if (ans !== null) {
                    attemptedCount++;
                    if (ans === quizData[idx].answer) {
                        correctCount++;
                    }
                }
            });

            document.getElementById("live-score").innerText = `${correctCount} / ${attemptedCount}`;
        }

        // --- HINT TOGGLE ---
        function toggleHint() {
            const hintBox = document.getElementById("hint-box");
            hintBox.classList.toggle("hidden");
        }

        // --- NAVIGATION ---
        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById("jump-input").value);
            if (val && val >= 1 && val <= quizData.length) {
                currentIdx = val - 1;
                renderQuestion();
                document.getElementById("jump-input").value = "";
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        // --- INITIALIZATION ---
        window.onload = () => {
            renderQuestion();
        };
    </script>
