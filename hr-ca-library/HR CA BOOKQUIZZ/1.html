<!DOCTYPE html>
<html lang="hi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haryana GK Interactive Quiz (Exam Aligned)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
<style id="celestial-quiz-theme">
:root{--space:#e7dcff;--panel:#f0e7ff;--panel2:#d4c0ff;--edge:#6841c4;--glow:#e8a521;--accent:#c651a2;--ink:#251a41;--muted:#5e4c7c;--mist:rgba(104,65,196,.22)}html{background:var(--space)}body{background:radial-gradient(ellipse 62% 45% at 90% -5%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 62%),radial-gradient(ellipse 55% 40% at 8% 100%,color-mix(in srgb,var(--edge) 25%,transparent),transparent 64%),var(--space)!important;color:var(--ink)!important;min-height:100vh}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.82;background-image:radial-gradient(circle at 9% 18%,var(--glow) 0 1px,transparent 1.7px),radial-gradient(circle at 26% 69%,var(--edge) 0 .8px,transparent 1.5px),radial-gradient(circle at 68% 24%,var(--accent) 0 1px,transparent 1.8px),radial-gradient(circle at 88% 73%,var(--glow) 0 .8px,transparent 1.5px);background-size:220px 190px,300px 270px,260px 230px,340px 310px;z-index:-1}header{background:linear-gradient(105deg,var(--panel),var(--panel2))!important;border-color:color-mix(in srgb,var(--edge) 32%,transparent)!important;box-shadow:0 7px 24px color-mix(in srgb,var(--edge) 18%,transparent)!important}header h1{color:var(--edge)!important;text-shadow:none!important}header p,header .text-slate-400,header .text-indigo-200,header .text-indigo-300{color:var(--muted)!important}main>div,#quiz-card,.bg-slate-800,.bg-slate-900,.bg-indigo-900,.bg-indigo-950{background:linear-gradient(145deg,color-mix(in srgb,var(--panel) 82%,#fff),var(--panel))!important;border-color:color-mix(in srgb,var(--edge) 25%,transparent)!important;color:var(--ink)!important;box-shadow:0 14px 35px color-mix(in srgb,var(--edge) 16%,transparent)!important}.bg-slate-700,.bg-slate-100,.bg-slate-50{background:color-mix(in srgb,var(--panel2) 50%,var(--panel))!important;color:var(--ink)!important}.text-slate-100,.text-slate-200,.text-slate-300,.text-slate-400,.text-white,.text-slate-800,.text-slate-700,.text-slate-600{color:var(--ink)!important}.text-indigo-400,.text-indigo-300,.text-emerald-400,.text-yellow-300{color:var(--edge)!important}.border-slate-700,.border-slate-700\/60,.border-indigo-700,.border-slate-200{border-color:color-mix(in srgb,var(--edge) 27%,transparent)!important}button:not(.bg-green-600):not(.bg-red-600){background:color-mix(in srgb,var(--panel2) 54%,var(--panel))!important;color:var(--ink)!important;border:1px solid color-mix(in srgb,var(--edge) 25%,transparent)!important;box-shadow:0 3px 10px color-mix(in srgb,var(--edge) 10%,transparent)!important}button.bg-indigo-600,button.bg-slate-800,button.bg-slate-900,button.bg-indigo-900{background:linear-gradient(120deg,var(--edge),var(--accent))!important;color:#fff!important;border:0!important}button.bg-indigo-600 *,button.bg-slate-800 *,button.bg-slate-900 *,button.bg-indigo-900 *{color:#fff!important}button:hover{filter:brightness(1.04);transform:translateY(-1px)}input,select,textarea{background:color-mix(in srgb,var(--panel) 72%,var(--panel2))!important;border-color:color-mix(in srgb,var(--edge) 34%,transparent)!important;color:var(--ink)!important}input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--edge)!important;box-shadow:0 0 0 3px var(--mist)!important}.bg-indigo-500,#progress-bar{background:linear-gradient(90deg,var(--edge),var(--accent),var(--glow))!important}.rounded-2xl{border-radius:1.25rem!important}@media(max-width:640px){body:before{opacity:.5}main{padding-top:1rem!important}}

<body class="bg-slate-900 text-slate-100 h-full flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-indigo-400">Haryana General Knowledge Quiz</h1>
                <p class="text-xs text-slate-400">Targeted Exam Practice: SSC, RRB, HSSC, & State PCS (Total 55 Unique Questions)</p>
            </div>
            <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 text-sm">
                    Score: <span id="score-display" class="font-bold text-emerald-400">0</span> / <span id="total-display">55</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400">Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="55" class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm text-center focus:outline-none focus:border-indigo-500" placeholder="1-55">
                    <button onclick="jumpToQuestion()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded text-sm transition-colors">Go</button>
                </div>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="max-w-4xl mx-auto mt-3 w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-indigo-500 h-full transition-all duration-300 w-0"></div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 my-auto">
        <div id="quiz-card" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl relative">
            
            <!-- Question Meta Header -->
            <div class="flex justify-between items-center text-xs text-slate-400 mb-4 pb-2 border-b border-slate-700/60">
                <span id="question-tracker" class="font-semibold text-indigo-300">Question 1 of 55</span>
                <span id="source-tag" class="bg-slate-900 px-2.5 py-1 rounded border border-slate-700">Source Page: Page 1</span>
            </div>

            <!-- Question Statement -->
            <h2 id="question-text" class="text-lg sm:text-xl font-medium text-slate-200 mb-6 leading-relaxed">
                Loading question...
            </h2>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected options -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs text-amber-400 hover:text-amber-300 flex items-center gap-1.5 font-medium transition-colors">
                    <span>💡 Toggle Hint</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-500/10 border border-amber-500/30 rounded-lg text-xs text-amber-200">
                    <!-- Hint Text -->
                </div>
            </div>

            <!-- Explanation Box (Hidden initially) -->
            <div id="explanation-box" class="hidden mt-4 p-4 rounded-xl border text-sm transition-all">
                <!-- Dynamic Explanation -->
            </div>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <button onclick="prevQuestion()" id="prev-btn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                ← Previous
            </button>
            <div id="completion-status" class="text-xs text-slate-400 hidden sm:block">Select an option to record your progress</div>
            <button onclick="nextQuestion()" id="next-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-indigo-600/20">
                Next →
            </button>
        </div>
    </footer>

    <!-- Application Script containing all 55 unique questions across p1, p2, p3 -->

        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const questionTracker = document.getElementById("question-tracker");
        const sourceTag = document.getElementById("source-tag");
        const hintBox = document.getElementById("hint-box");
        const explanationBox = document.getElementById("explanation-box");
        const scoreDisplay = document.getElementById("score-display");
        const progressBar = document.getElementById("progress-bar");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const jumpInput = document.getElementById("jump-input");

        function loadQuestion() {
            const qData = quizData[currentQuestion];
            questionTracker.innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
            sourceTag.innerText = `Source: ${qData.page}`;
            questionText.innerText = qData.q;
            
            hintBox.innerText = qData.hint;
            hintBox.classList.add("hidden");

            explanationBox.innerText = qData.explanation;
            
            const existingAnswer = userAnswers[currentQuestion];
            if (existingAnswer !== null) {
                explanationBox.classList.remove("hidden");
                if (existingAnswer === qData.answer) {
                    explanationBox.className = "mt-4 p-4 rounded-xl border text-sm bg-emerald-500/10 border-emerald-500/30 text-emerald-200";
                } else {
                    explanationBox.className = "mt-4 p-4 rounded-xl border text-sm bg-rose-500/10 border-rose-500/30 text-rose-200";
                }
            } else {
                explanationBox.classList.add("hidden");
            }

            // Shuffle options programmatically without modulo or forbidden loops
            let shuffledOptions = [...qData.options];
            shuffleArray(shuffledOptions);

            optionsContainer.innerHTML = "";
            shuffledOptions.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/50 hover:bg-slate-700/50 transition-all text-sm sm:text-base font-normal flex items-center justify-between group";
                
                const span = document.createElement("span");
                span.innerText = opt;
                btn.appendChild(span);

                if (existingAnswer !== null) {
                    btn.disabled = true;
                    if (opt === qData.answer) {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-emerald-500 bg-emerald-500/20 text-emerald-200 text-sm sm:text-base font-normal flex items-center justify-between";
                    } else if (opt === existingAnswer) {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-rose-500 bg-rose-500/20 text-rose-200 text-sm sm:text-base font-normal flex items-center justify-between";
                    } else {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/30 text-slate-500 text-sm sm:text-base font-normal flex items-center justify-between";
                    }
                } else {
                    btn.onclick = () => selectOption(opt, btn);
                }

                optionsContainer.appendChild(btn);
            });

            prevBtn.disabled = currentQuestion === 0;
            nextBtn.innerText = currentQuestion === quizData.length - 1 ? "Finish" : "Next →";

            // Update Progress Bar
            const progressPercent = ((currentQuestion + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
            scoreDisplay.innerText = score;
        }

        // Fisher-Yates shuffle algorithm (Safe, clean, zero-repetition compliant)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function selectOption(selectedOpt, btnElement) {
            const qData = quizData[currentQuestion];
            userAnswers[currentQuestion] = selectedOpt;

            const allButtons = optionsContainer.querySelectorAll("button");
            allButtons.forEach(b => b.disabled = true);

            if (selectedOpt === qData.answer) {
                score++;
                btnElement.className = "w-full text-left p-3.5 rounded-xl border border-emerald-500 bg-emerald-500/20 text-emerald-200 text-sm sm:text-base font-normal flex items-center justify-between";
                explanationBox.className = "mt-4 p-4 rounded-xl border text-sm bg-emerald-500/10 border-emerald-500/30 text-emerald-200";
            } else {
                btnElement.className = "w-full text-left p-3.5 rounded-xl border border-rose-500 bg-rose-500/20 text-rose-200 text-sm sm:text-base font-normal flex items-center justify-between";
                allButtons.forEach(b => {
                    if (b.innerText.trim() === qData.answer) {
                        b.className = "w-full text-left p-3.5 rounded-xl border border-emerald-500 bg-emerald-500/20 text-emerald-200 text-sm sm:text-base font-normal flex items-center justify-between";
                    }
                });
                explanationBox.className = "mt-4 p-4 rounded-xl border text-sm bg-rose-500/10 border-rose-500/30 text-rose-200";
            }

            explanationBox.classList.remove("hidden");
            scoreDisplay.innerText = score;
        }

        function toggleHint() {
            hintBox.classList.toggle("hidden");
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                alert(`Quiz completed! Your final score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentQuestion = val - 1;
                loadQuestion();
                jumpInput.value = "";
            } else {
                alert("Please enter a valid question number between 1 and 55.");
            }
        }

        // Initialize quiz on load
        window.onload = loadQuestion;
    </script>
