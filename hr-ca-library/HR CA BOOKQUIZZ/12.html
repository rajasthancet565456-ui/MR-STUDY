        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredList = new Array(quizData.length).fill(false);

        const qText = document.getElementById('q-text');
        const optionsContainer = document.getElementById('options-container');
        const qCounter = document.getElementById('q-counter');
        const qCategory = document.getElementById('q-category');
        const scoreVal = document.getElementById('score-val');
        const totalVal = document.getElementById('total-val');
        const pageIndicator = document.getElementById('page-indicator');
        const progressBar = document.getElementById('progress-bar');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        totalVal.textContent = quizData.length;

        function loadQuestion() {
            const currentQ = quizData[currentIndex];
            qCounter.textContent = `Question ${currentIndex + 1} of ${quizData.length}`;
            qCategory.textContent = currentQ.category;
            pageIndicator.textContent = currentQ.page;
            qText.textContent = currentQ.question;
            
            hintBox.classList.add('hidden');
            hintBox.textContent = currentQ.hint;
            
            explanationBox.classList.add('hidden');
            explanationText.textContent = currentQ.explanation;

            optionsContainer.innerHTML = '';
            
            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between text-sm sm:text-base ${
                    userAnswers[currentIndex] !== null
                        ? opt.correct
                            ? 'bg-emerald-950/60 border-emerald-500 text-emerald-200'
                            : userAnswers[currentIndex] === idx
                                ? 'bg-rose-950/60 border-rose-500 text-rose-200'
                                : 'bg-slate-900 border-slate-700 text-slate-400 opacity-60'
                        : 'bg-slate-900 border-slate-700 hover:border-slate-500 text-slate-200 hover:bg-slate-800/80'
                }`;
                
                btn.innerHTML = `<span><span class="font-bold mr-2 text-slate-400">${String.fromCharCode(65 + idx)}.</span> ${opt.text}</span>`;
                
                if (userAnswers[currentIndex] === null) {
                    btn.onclick = () => selectOption(idx);
                } else {
                    btn.disabled = true;
                }
                
                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentIndex] !== null) {
                explanationBox.classList.remove('hidden');
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? 'Finish Quiz' : 'Next Question';
            
            // Progress bar update
            const progress = ((currentIndex + 1) / quizData.length) * 100;
            progressBar.style.width = `${progress}%`;
            scoreVal.textContent = score;
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentIndex] !== null) return;
            
            const currentQ = quizData[currentIndex];
            userAnswers[currentIndex] = selectedIndex;
            
            const isCorrect = currentQ.options[selectedIndex].correct;
            if (isCorrect) {
                score++;
                scoreVal.textContent = score;
            }
            
            answeredList[currentIndex] = true;
            loadQuestion();
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestionInput() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Initial Load
        loadQuestion();
    </script>
