<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Haryana CA 2026-27 Quiz (Bilingual)</h1>
            <div class="mt-2 sm:mt-0 text-sm bg-indigo-800 px-3 py-1 rounded-full">
                Total Unique Questions: <span id="total-questions-badge" class="font-bold">90</span>
            </div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl w-full mx-auto px-4 py-8 flex-grow">
        <div id="quiz-card" class="bg-white rounded-xl shadow-lg p-6 sm:p-8 transition-all">
            
            <!-- Progress & Stats Bar -->
            <div class="flex justify-between items-center mb-4 text-sm text-slate-500 font-medium">
                <div>Question <span id="current-q-num" class="text-indigo-600 font-bold">1</span> of <span id="total-q-num">90</span></div>
                <div>Score: <span id="score-val" class="text-emerald-600 font-bold">0</span></div>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 h-2 rounded-full mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 1.11%;"></div>
            </div>

            <!-- Question Text Box -->
            <div class="mb-6">
                <span id="question-source-tag" class="inline-block bg-slate-100 text-slate-600 text-xs font-semibold px-2.5 py-1 rounded mb-2">Page 1</span>
                <h2 id="question-text" class="text-lg sm:text-xl font-semibold text-slate-900 leading-relaxed">
                    <!-- Dynamic Question Text -->
                </h2>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamic Options -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs font-medium text-indigo-600 hover:text-indigo-800 underline focus:outline-none">
                    💡 Toggle Hint / संकेत देखें
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg">
                    <!-- Dynamic Hint -->
                </div>
            </div>

            <!-- Explanation Box (Hidden Initially) -->
            <div id="explanation-box" class="hidden mb-6 p-4 bg-slate-50 border-l-4 border-indigo-500 text-slate-700 text-sm rounded-r-lg">
                <h3 class="font-bold text-slate-900 mb-1">Explanation / स्पष्टीकरण:</h3>
                <p id="explanation-text"></p>
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-slate-100">
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <button onclick="prevQuestion()" id="prev-btn" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-lg text-sm transition disabled:opacity-50 disabled:cursor-not-allowed w-1/2 sm:w-auto">
                        ← Previous
                    </button>
                    <button onclick="nextQuestion()" id="next-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition w-1/2 sm:w-auto">
                        Next →
                    </button>
                </div>

                <!-- Jump to Question Input -->
                <div class="flex items-center gap-2 text-sm w-full sm:w-auto justify-end">
                    <span class="text-slate-500">Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="90" class="w-16 px-2 py-1 border border-slate-300 rounded text-center focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="1-90">
                    <button onclick="jumpToQuestion()" class="px-3 py-1 bg-slate-700 hover:bg-slate-800 text-white rounded text-sm transition">
                        Go
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Haryana Competitive Exams Practice Suite &bull; Bilingual SSC/State PCS Pattern
    </footer>

        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const qNumEl = document.getElementById("current-q-num");
        const totalQEl = document.getElementById("total-q-num");
        const scoreEl = document.getElementById("score-val");
        const progressBar = document.getElementById("progress-bar");
        const sourceTag = document.getElementById("question-source-tag");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const hintBox = document.getElementById("hint-box");
        const explanationBox = document.getElementById("explanation-box");
        const explanationText = document.getElementById("explanation-text");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const jumpInput = document.getElementById("jump-input");

        document.getElementById("total-questions-badge").innerText = quizData.length;
        totalQEl.innerText = quizData.length;

        function loadQuestion() {
            const currentQ = quizData[currentIndex];
            qNumEl.innerText = currentIndex + 1;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            sourceTag.innerText = `Page ${currentQ.page} Syllabus Content`;
            questionText.innerHTML = currentQ.question;
            hintBox.innerText = currentQ.hint;
            hintBox.classList.add("hidden");
            
            explanationText.innerText = currentQ.explanation;
            if (userAnswers[currentIndex] !== null) {
                explanationBox.classList.remove("hidden");
            } else {
                explanationBox.classList.add("hidden");
            }

            optionsContainer.innerHTML = "";
            currentQ.options.forEach((option, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3 rounded-lg border border-slate-200 hover:bg-slate-50 transition text-sm sm:text-base font-medium flex items-center justify-between";
                btn.innerHTML = `<span>${option}</span>`;
                
                const isAnswered = userAnswers[currentIndex] !== null;
                if (isAnswered) {
                    btn.disabled = true;
                    if (idx === currentQ.answer) {
                        btn.classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-900");
                    } else if (userAnswers[currentIndex] === idx) {
                        btn.classList.add("bg-rose-50", "border-rose-500", "text-rose-900");
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }
                optionsContainer.appendChild(btn);
            });

            prevBtn.disabled = currentIndex === 0;
            nextBtn.innerText = currentIndex === quizData.length - 1 ? "Finish" : "Next →";
        }

        function selectOption(selectedIndex) {
            const currentQ = quizData[currentIndex];
            userAnswers[currentIndex] = selectedIndex;

            if (selectedIndex === currentQ.answer) {
                score++;
                scoreEl.innerText = score;
            }

            explanationBox.classList.remove("hidden");
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function toggleHint() {
            hintBox.classList.toggle("hidden");
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value) - 1;
            if (val >= 0 && val < quizData.length) {
                currentIndex = val;
                loadQuestion();
                jumpInput.value = "";
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function showResults() {
            const quizCard = document.getElementById("quiz-card");
            quizCard.innerHTML = `
                <div class="text-center py-8">
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">Quiz Completed! 🎉</h2>
                    <p class="text-slate-600 mb-6">You have successfully completed all unique questions from the source syllabus.</p>
                    <div class="inline-block bg-indigo-50 border border-indigo-200 rounded-xl p-6 mb-6">
                        <div class="text-3xl font-extrabold text-indigo-600 mb-1">${score} / ${quizData.length}</div>
                        <div class="text-sm text-slate-500">Your Final Score</div>
                    </div>
                    <div>
                        <button onclick="resetQuiz()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition shadow-md">
                            Restart Quiz
                        </button>
                    </div>
                </div>
            `;
        }

        function resetQuiz() {
            currentIndex = 0;
            score = 0;
            userAnswers = new Array(quizData.length).fill(null);
            scoreEl.innerText = score;
            location.reload();
        }

        // Initialize first question
        loadQuestion();
    </script>
