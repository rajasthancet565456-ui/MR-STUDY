<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-cyan-400">Haryana Current Affairs Quiz (HR CA)</h1>
                <p class="text-xs text-slate-400">75 Comprehensive Exam-Level Questions Across 3 Pages (25 per page)</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-sm bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-600">
                    Score: <span id="score-val" class="font-bold text-emerald-400">0</span> / <span id="total-val">75</span>
                </div>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="max-w-4xl mx-auto mt-3 bg-slate-700 h-2 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-cyan-500 h-full w-0 transition-all duration-300"></div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 my-auto">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl relative">
            
            <!-- Question Meta Header -->
            <div class="flex justify-between items-center mb-4 text-xs font-semibold tracking-wider text-cyan-400 uppercase">
                <span id="page-indicator">Page 1 of 3</span>
                <span id="question-counter">Question 1 of 75</span>
            </div>

            <!-- Question Text -->
            <div id="question-container" class="text-lg font-medium mb-6 text-slate-200 leading-relaxed">
                Loading question...
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="grid grid-cols-1 gap-3 mb-6">
                <!-- Dynamically injected options -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs text-amber-400 hover:text-amber-300 font-medium flex items-center gap-1 transition-colors">
                    <span>💡 Toggle Hint</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-950/40 border border-amber-800/50 text-amber-200 text-xs rounded-lg">
                    <!-- Hint text -->
                </div>
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden mb-6 p-4 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-slate-300">
                <h4 class="font-bold text-cyan-400 mb-1">Explanation / Rationale:</h4>
                <p id="explanation-text"></p>
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-700">
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <button onclick="prevQuestion()" id="prev-btn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed w-1/2 sm:w-auto">Previous</button>
                    <button onclick="nextQuestion()" id="next-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition w-1/2 sm:w-auto">Next</button>
                </div>

                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <span class="text-xs text-slate-400">Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="75" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm w-16 text-center text-slate-200 focus:outline-none focus:border-cyan-500" placeholder="1-75">
                    <button onclick="jumpToQuestion()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1 rounded text-sm transition">Go</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        Haryana Current Affairs Exam Prep Module &bull; Powered by Tailwind CSS
    </footer>

        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptionsList = [];

        // Initialize randomized option positions for each question so correct answer varies
        function initQuiz() {
            quizData.forEach((q, qIndex) => {
                let originalOptions = [...q.options];
                let correctText = originalOptions[q.answer];
                
                // Shuffle options array
                for (let i = originalOptions.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [originalOptions[i], originalOptions[j]] = [originalOptions[j], originalOptions[i]];
                }
                
                let newCorrectIndex = originalOptions.indexOf(correctText);
                shuffledOptionsList.push({
                    options: originalOptions,
                    correctIndex: newCorrectIndex
                });
            });
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentIndex];
            const shuffled = shuffledOptionsList[currentIndex];

            // Page & Question Indicators
            document.getElementById('page-indicator').innerText = `Page ${q.page} of 3`;
            document.getElementById('question-counter').innerText = `Question ${currentIndex + 1} of ${quizData.length}`;
            
            // Progress Bar
            const progress = ((currentIndex + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Question Text
            document.getElementById('question-container').innerHTML = q.question.replace(/\n/g, '<br>');

            // Options Container
            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';

            shuffled.options.forEach((optText, idx) => {
                let btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-3.5 rounded-lg border border-slate-700 bg-slate-900/50 hover:bg-slate-700/60 text-slate-200 text-sm font-medium flex items-center justify-between transition-all";
                
                let letterSpan = document.createElement('span');
                letterSpan.className = "inline-flex items-center justify-center bg-slate-800 text-cyan-400 font-bold w-6 h-6 rounded-full text-xs mr-3 border border-slate-700";
                letterSpan.innerText = String.fromCharCode(65 + idx);

                let textSpan = document.createElement('span');
                textSpan.className = "flex-grow";
                textSpan.innerText = optText;

                btn.appendChild(letterSpan);
                btn.appendChild(textSpan);

                // Check if user already answered this question
                const savedAns = userAnswers[currentIndex];
                if (savedAns !== null) {
                    btn.disabled = true;
                    if (idx === shuffled.correctIndex) {
                        btn.classList.add('bg-emerald-950/60', 'border-emerald-600', 'text-emerald-200');
                        letterSpan.className = "inline-flex items-center justify-center bg-emerald-600 text-white font-bold w-6 h-6 rounded-full text-xs mr-3";
                    } else if (idx === savedAns && savedAns !== shuffled.correctIndex) {
                        btn.classList.add('bg-rose-950/60', 'border-rose-600', 'text-rose-200');
                        letterSpan.className = "inline-flex items-center justify-center bg-rose-600 text-white font-bold w-6 h-6 rounded-full text-xs mr-3";
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                optContainer.appendChild(btn);
            });

            // Hint Box
            const hintBox = document.getElementById('hint-box');
            hintBox.innerText = q.hint;
            hintBox.classList.add('hidden');

            // Explanation Box
            const expBox = document.getElementById('explanation-box');
            if (userAnswers[currentIndex] !== null) {
                document.getElementById('explanation-text').innerText = q.explanation;
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            // Buttons State
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').innerText = currentIndex === quizData.length - 1 ? 'Finish' : 'Next';
            document.getElementById('jump-input').value = currentIndex + 1;
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentIndex] !== null) return; // already answered

            userAnswers[currentIndex] = selectedIndex;
            const correctIdx = shuffledOptionsList[currentIndex].correctIndex;

            if (selectedIndex === correctIdx) {
                score++;
                document.getElementById('score-val').innerText = score;
            }

            // Reveal explanation
            document.getElementById('explanation-text').innerText = quizData[currentIndex].explanation;
            document.getElementById('explanation-box').classList.remove('hidden');

            // Reload to update option styles
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} / ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            let target = parseInt(input.value) - 1;
            if (target >= 0 && target < quizData.length) {
                currentIndex = target;
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Run initializer on load
        window.onload = initQuiz;
    </script>
