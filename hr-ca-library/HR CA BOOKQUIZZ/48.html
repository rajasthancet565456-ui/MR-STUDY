        qEn: "What type of body is NCLT (National Company Law Tribunal)?",
        options: [
          { hi: "राष्ट्रीय कंपनी कानून न्यायाधिकरण (अर्ध-न्यायिक निकाय)", en: "National Company Law Tribunal (Quasi-judicial body)", correct: true },
          { hi: "संवैधानिक बैंक", en: "Constitutional Bank", correct: false },
          { hi: "गैर-सरकारी संगठन", en: "Non-Governmental Organization", correct: false },
          { hi: "पुलिस आयोग", en: "Police Commission", correct: false }
        ],
        hint: "कंपनी कानून मामलों का केंद्रीय न्यायाधिकरण।",
        expHi: "NCLT भारत में कंपनियों से जुड़े विवादों का निपटारा करने वाला एक न्यायाधिकरण है।",
        expEn: "NCLT is a quasi-judicial authority that adjudicates issues relating to Indian companies."
      },
      {
        page: "Page 152",
        qHi: "90. 'ज्ञान भारतम राष्ट्रीय पाण्डुलिपि सर्वेक्षण' की आधिकारिक शुरुआत किस तिथि को हुई थी?",
        qEn: "On which date was the 'Gyan Bharatam National Manuscript Survey' officially inaugurated?",
        options: [
          { hi: "16 मार्च 2026", en: "16 March 2026", correct: true },
          { hi: "26 जनवरी 2026", en: "26 January 2026", correct: false },
          { hi: "01 अप्रैल 2026", en: "01 April 2026", correct: false },
          { hi: "15 अगस्त 2026", en: "15 August 2026", correct: false }
        ],
        hint: "मार्च 2026 के मध्य में।",
        expHi: "भारत सरकार द्वारा 16 मार्च 2026 से इस अभियान की शुरुआत की गई है।",
        expEn: "The campaign officially started on 16 March 2026."
      }
    ];

    // App State
    let currentIndex = 0;
    let score = 0;
    let userAnswers = new Array(questionsData.length).fill(null);
    let shuffledOptionsList = [];

    // Utility: Fisher-Yates Shuffle algorithm
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Pre-shuffle option positions for all questions on init
    function initializeShuffledOptions() {
      shuffledOptionsList = questionsData.map(q => shuffleArray(q.options));
    }

    // DOM Elements
    const qHiElem = document.getElementById('question-hi');
    const qEnElem = document.getElementById('question-en');
    const optionsContainer = document.getElementById('options-container');
    const pageTagElem = document.getElementById('source-page-tag');
    const currentIndexElem = document.getElementById('current-index-display');
    const scoreElem = document.getElementById('score-display');
    const totalAnsweredElem = document.getElementById('total-answered');
    const progressBar = document.getElementById('progress-bar');

    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const jumpInput = document.getElementById('jump-input');
    const jumpBtn = document.getElementById('jump-btn');

    const hintToggleBtn = document.getElementById('hint-toggle-btn');
    const hintBox = document.getElementById('hint-box');
    const hintText = document.getElementById('hint-text');

    const explanationBox = document.getElementById('explanation-box');
    const resultStatus = document.getElementById('result-status');
    const expHiElem = document.getElementById('explanation-hi');
    const expEnElem = document.getElementById('explanation-en');

    // Render Current Question
    function renderQuestion() {
      const currentQ = questionsData[currentIndex];
      const currentOptions = shuffledOptionsList[currentIndex];

      // Update UI Text
      pageTagElem.textContent = currentQ.page;
      currentIndexElem.textContent = currentIndex + 1;
      qHiElem.textContent = currentQ.qHi;
      qEnElem.textContent = currentQ.qEn;

      // Reset Hint
      hintBox.classList.add('hidden');
      hintText.textContent = currentQ.hint;

      // Clear previous options
      optionsContainer.innerHTML = '';

      const optionPrefixes = ['A', 'B', 'C', 'D'];

      // Render Options
      currentOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3 sm:p-4 rounded-lg border transition-all flex items-start gap-3 bg-slate-50 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300";

        const prefixSpan = document.createElement('span');
        prefixSpan.className = "font-bold text-xs bg-slate-200 text-slate-700 px-2 py-1 rounded shrink-0 mt-0.5";
        prefixSpan.textContent = optionPrefixes[idx];

        const textDiv = document.createElement('div');
        textDiv.className = "flex-grow";
        textDiv.innerHTML = `<div class="text-sm sm:text-base font-semibold text-slate-800">${opt.hi}</div>
                             <div class="text-xs sm:text-sm text-slate-500 italic">${opt.en}</div>`;

        btn.appendChild(prefixSpan);
        btn.appendChild(textDiv);

        // Check if user already answered
        if (userAnswers[currentIndex] !== null) {
          const selectedOpt = userAnswers[currentIndex];
          btn.disabled = true;

          if (opt.correct) {
            btn.className = "w-full text-left p-3 sm:p-4 rounded-lg border flex items-start gap-3 bg-green-50 border-green-500 text-green-900";
            prefixSpan.className = "font-bold text-xs bg-green-600 text-white px-2 py-1 rounded shrink-0 mt-0.5";
          } else if (selectedOpt === opt && !opt.correct) {
            btn.className = "w-full text-left p-3 sm:p-4 rounded-lg border flex items-start gap-3 bg-red-50 border-red-400 text-red-900";
            prefixSpan.className = "font-bold text-xs bg-red-600 text-white px-2 py-1 rounded shrink-0 mt-0.5";
          } else {
            btn.className = "w-full text-left p-3 sm:p-4 rounded-lg border flex items-start gap-3 bg-slate-50 border-slate-200 opacity-60";
          }
        } else {
          btn.onclick = () => handleOptionSelect(opt);
        }

        optionsContainer.appendChild(btn);
      });

      // Show/Hide Explanation
      if (userAnswers[currentIndex] !== null) {
        const isCorrect = userAnswers[currentIndex].correct;
        explanationBox.classList.remove('hidden');
        if (isCorrect) {
          explanationBox.className = "p-4 rounded-lg bg-green-50 border border-green-200 mt-4";
          resultStatus.className = "font-bold text-base text-green-700 mb-1";
          resultStatus.textContent = "✓ Correct Answer! / सही उत्तर!";
        } else {
          explanationBox.className = "p-4 rounded-lg bg-red-50 border border-red-200 mt-4";
          resultStatus.className = "font-bold text-base text-red-700 mb-1";
          resultStatus.textContent = "✗ Incorrect Answer! / गलत उत्तर!";
        }
        expHiElem.textContent = currentQ.expHi;
        expEnElem.textContent = currentQ.expEn;
      } else {
        explanationBox.classList.add('hidden');
      }

      // Update Controls State
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === questionsData.length - 1;

      // Update Progress Bar & Header
      updateStats();
    }

    // Handle Option Click
    function handleOptionSelect(selectedOption) {
      if (userAnswers[currentIndex] !== null) return; // Prevent re-answering

      userAnswers[currentIndex] = selectedOption;
      if (selectedOption.correct) {
        score++;
      }

      renderQuestion();
    }

    // Update Stats & Progress Bar
    function updateStats() {
      const answeredCount = userAnswers.filter(a => a !== null).length;
      scoreElem.textContent = score;
      totalAnsweredElem.textContent = answeredCount;

      const progressPercent = ((currentIndex + 1) / questionsData.length) * 100;
      progressBar.style.width = `${progressPercent}%`;
    }

    // Event Listeners
    prevBtn.onclick = () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    };

    nextBtn.onclick = () => {
      if (currentIndex < questionsData.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    };

    jumpBtn.onclick = () => {
      const val = parseInt(jumpInput.value, 10);
      if (val >= 1 && val <= questionsData.length) {
        currentIndex = val - 1;
        renderQuestion();
        jumpInput.value = '';
      }
    };

    hintToggleBtn.onclick = () => {
      hintBox.classList.toggle('hidden');
    };

    // Initialize Quiz
    initializeShuffledOptions();
    renderQuestion();
  </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
