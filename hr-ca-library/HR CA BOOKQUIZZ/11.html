        // --- Application State ---
        let questions = [];
        let currentIndex = 0;
        let userAnswers = {};

        // Utility: Fisher-Yates Shuffle Algorithm for Option Shuffling
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize and Shuffle Data
        function initData() {
            questions = rawQuizData.map(q => {
                const originalCorrectOption = q.options[q.answer];
                const shuffledOptions = shuffleArray(q.options);
                const newCorrectIndex = shuffledOptions.indexOf(originalCorrectOption);

                return {
                    ...q,
                    options: shuffledOptions,
                    answer: newCorrectIndex
                };
            });
        }

        // Render Current Question
        function renderQuestion() {
            const q = questions[currentIndex];
            
            // Meta updates
            document.getElementById('question-number').innerText = `Question ${currentIndex + 1} of ${questions.length} (Page ${q.page})`;
            document.getElementById('subtopic-tag').innerText = `Topic: ${q.subtopic}`;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('hint-text').innerText = q.hint;

            // Reset Hint
            document.getElementById('hint-box').classList.add('hidden');

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const isAnswered = userAnswers.hasOwnProperty(currentIndex);
            const selectedAnswer = userAnswers[currentIndex];

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-lg border text-sm sm:text-base transition-all flex items-start justify-between gap-3 `;
                
                if (!isAnswered) {
                    btn.className += `bg-slate-50 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700 font-medium`;
                    btn.onclick = () => handleSelectOption(idx);
                } else {
                    btn.disabled = true;
                    if (idx === q.answer) {
                        btn.className += `bg-emerald-50 border-emerald-500 text-emerald-900 font-semibold shadow-sm`;
                    } else if (idx === selectedAnswer) {
                        btn.className += `bg-rose-50 border-rose-500 text-rose-900 font-semibold shadow-sm`;
                    } else {
                        btn.className += `bg-slate-50 border-slate-200 text-slate-400 opacity-60`;
                    }
                }

                btn.innerHTML = `
                    <div class="flex items-start gap-3">
                        <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-700 text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">
                            ${String.fromCharCode(65 + idx)}
                        </span>
                        <span>${opt}</span>
                    </div>
                    ${isAnswered && idx === q.answer ? '<span class="text-emerald-600 font-bold text-sm">✓ Correct</span>' : ''}
                    ${isAnswered && idx === selectedAnswer && idx !== q.answer ? '<span class="text-rose-600 font-bold text-sm">✗ Incorrect</span>' : ''}
                `;

                optionsContainer.appendChild(btn);
            });

            // Handle Explanation Display
            const explanationBox = document.getElementById('explanation-box');
            if (isAnswered) {
                document.getElementById('explanation-text').innerText = q.explanation;
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            // Update Controls State
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === questions.length - 1;

            // Update Header Stats
            updateStats();
        }

        // Handle Option Selection
        function handleSelectOption(index) {
            userAnswers[currentIndex] = index;
            renderQuestion();
        }

        // Toggle Hint Box
        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        // Navigation Controls
        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value);
            if (val >= 1 && val <= questions.length) {
                currentIndex = val - 1;
                renderQuestion();
                input.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}.`);
            }
        }

        // Update Header Progress & Score Display
        function updateStats() {
            const answeredCount = Object.keys(userAnswers).length;
            let correctCount = 0;

            Object.keys(userAnswers).forEach(idx => {
                if (userAnswers[idx] === questions[idx].answer) {
                    correctCount++;
                }
            });

            document.getElementById('score-display').innerText = `${correctCount} / ${answeredCount}`;
            document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${questions.length}`;

            const progressPct = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;
        }

        // Run Initialization on Load
        window.onload = () => {
            initData();
            renderQuestion();
        };
    </script>
