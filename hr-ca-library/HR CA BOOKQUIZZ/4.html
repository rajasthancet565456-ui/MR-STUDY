        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptionsCache = {};

        // Shuffle options once for each question to keep positions randomized yet consistent during navigation
        function getShuffledOptions(index) {
            if (shuffledOptionsCache[index]) {
                return shuffledOptionsCache[index];
            }
            const qObj = quizData[index];
            const optionsWithMeta = qObj.options.map((opt) => ({
                text: opt,
                isCorrect: opt === qObj.answer
            }));
            
            // Fisher-Yates shuffle
            for (let i = optionsWithMeta.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsWithMeta[i], optionsWithMeta[j]] = [optionsWithMeta[j], optionsWithMeta[i]];
            }
            
            shuffledOptionsCache[index] = optionsWithMeta;
            return optionsWithMeta;
        }

        function loadQuestion() {
            const q = quizData[currentQuestion];
            const tracker = document.getElementById('question-tracker');
            const sourceTag = document.getElementById('source-tag');
            const qText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const hintBox = document.getElementById('hint-box');
            const explanationBox = document.getElementById('explanation-box');
            const progressBar = document.getElementById('progress-bar');
            const scoreDisplay = document.getElementById('score-display');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            tracker.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
            sourceTag.textContent = `Source: ${q.page}`;
            qText.textContent = q.q;
            hintBox.textContent = q.hint;
            hintBox.classList.add('hidden');
            
            scoreDisplay.textContent = score;
            progressBar.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;

            prevBtn.disabled = currentQuestion === 0;
            nextBtn.textContent = currentQuestion === quizData.length - 1 ? 'Finish Quiz' : 'Next →';

            optionsContainer.innerHTML = '';
            const randomizedOpts = getShuffledOptions(currentQuestion);
            const savedAnswer = userAnswers[currentQuestion];

            randomizedOpts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border text-sm sm:text-base font-medium transition-all flex items-center justify-between ${
                    savedAnswer !== null
                        ? opt.isCorrect
                            ? 'bg-emerald-500/20 border-emerald-500 text-emerald-200'
                            : savedAnswer === opt.text
                                ? 'bg-rose-500/20 border-rose-500 text-rose-200'
                                : 'bg-slate-900 border-slate-700 text-slate-400 opacity-60'
                        : 'bg-slate-900 hover:bg-slate-700/60 border-slate-700 text-slate-200 hover:border-slate-500'
                }`;
                
                btn.innerHTML = `<span><strong class="mr-2 text-indigo-400">${String.fromCharCode(65 + idx)}.</strong> ${opt.text}</span>`;
                
                if (savedAnswer === null) {
                    btn.onclick = () => selectOption(opt.text, opt.isCorrect);
                } else {
                    btn.disabled = true;
                }
                optionsContainer.appendChild(btn);
            });

            if (savedAnswer !== null) {
                explanationBox.innerHTML = `<strong class="${savedAnswer === q.answer ? 'text-emerald-400' : 'text-rose-400'}">
                    ${savedAnswer === q.answer ? '✓ Correct!' : '✗ Incorrect.'}</strong> ${q.explanation}`;
                explanationBox.className = `mt-4 p-4 rounded-xl border text-sm transition-all ${
                    savedAnswer === q.answer ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200' : 'bg-rose-500/10 border-rose-500/30 text-rose-200'
                }`;
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }
        }

        function selectOption(selectedText, isCorrect) {
            if (userAnswers[currentQuestion] !== null) return;
            
            userAnswers[currentQuestion] = selectedText;
            if (isCorrect) {
                score++;
            }
            loadQuestion();
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value);
            if (val >= 1 && val <= quizData.length) {
                currentQuestion = val - 1;
                input.value = '';
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function showResults() {
            const card = document.getElementById('quiz-card');
            const percentage = Math.round((score / quizData.length) * 100);
            card.innerHTML = `
                <div class="text-center py-8">
                    <h2 class="text-2xl font-bold text-indigo-400 mb-2">Quiz Completed! 🎉</h2>
                    <p class="text-slate-300 mb-6">You have successfully completed all 75 exam-aligned questions from pages 11, 12, and 13.</p>
                    <div class="inline-block bg-slate-900 border border-slate-700 px-6 py-4 rounded-2xl mb-6">
                        <div class="text-4xl font-extrabold text-emerald-400 mb-1">${score} / ${quizData.length}</div>
                        <div class="text-xs text-slate-400 uppercase tracking-wider">Final Score (${percentage}%)</div>
                    </div>
                    <div>
                        <button onclick="resetQuiz()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition-colors shadow-lg shadow-indigo-600/20">
                            Restart Quiz
                        </button>
                    </div>
                </div>
            `;
            document.querySelector('footer').style.display = 'none';
        }

        function resetQuiz() {
            currentQuestion = 0;
            score = 0;
            userAnswers = new Array(quizData.length).fill(null);
            shuffledOptionsCache = {};
            document.querySelector('footer').style.display = 'block';
            loadQuestion();
        }

        // Initialize on load
        window.onload = loadQuestion;
    </script>
