        // Global State Variables
        let currentQIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let score = 0;

        // Shuffle Options Helper (Fisher-Yates) while tracking correct index
        function prepareQuestionData() {
            quizData.forEach(q => {
                if (!q.shuffled) {
                    let indexedOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
                    // Shuffle array
                    for (let i = indexedOptions.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [indexedOptions[i], indexedOptions[j]] = [indexedOptions[j], indexedOptions[i]];
                    }
                    q.shuffledOptions = indexedOptions.map(o => o.text);
                    q.correctIndex = indexedOptions.findIndex(o => o.isCorrect);
                    q.shuffled = true;
                }
            });
        }

        // Initialize Quiz Application
        function initQuiz() {
            prepareQuestionData();
            renderQuestion();
            updateControls();
            
            // Event Listeners
            document.getElementById('prev-btn').addEventListener('click', () => navigate(-1));
            document.getElementById('next-btn').addEventListener('click', () => navigate(1));
            document.getElementById('hint-btn').addEventListener('click', toggleHint);
            document.getElementById('jump-btn').addEventListener('click', jumpToQuestion);
        }

        // Render Current Question
        function renderQuestion() {
            const q = quizData[currentQIndex];
            
            // Text updates
            document.getElementById('page-tag').innerText = q.page;
            document.getElementById('q-number').innerText = `Question ${currentQIndex + 1} of ${quizData.length}`;
            document.getElementById('q-text').innerText = q.question;
            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('explanation-text').innerText = q.explanation;

            // Reset Hint Box Visibility
            document.getElementById('hint-box').classList.add('hidden');

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const letters = ['A', 'B', 'C', 'D'];
            const hasAnswered = userAnswers[currentQIndex] !== null;

            q.shuffledOptions.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-lg border text-sm font-medium transition flex items-center gap-3 `;
                
                if (!hasAnswered) {
                    btn.className += `border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700`;
                    btn.onclick = () => selectOption(idx);
                } else {
                    btn.disabled = true;
                    if (idx === q.correctIndex) {
                        btn.className += `border-green-500 bg-green-50 text-green-900 font-bold`;
                    } else if (idx === userAnswers[currentQIndex]) {
                        btn.className += `border-red-500 bg-red-50 text-red-900`;
                    } else {
                        btn.className += `border-slate-200 bg-slate-50 text-slate-400 opacity-60`;
                    }
                }

                btn.innerHTML = `
                    <span class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-200 text-slate-700 font-bold text-xs shrink-0">${letters[idx]}</span>
                    <span>${optText}</span>
                `;
                optionsContainer.appendChild(btn);
            });

            // Handle Explanation Display
            const expBox = document.getElementById('explanation-box');
            const expTitle = document.getElementById('explanation-title');

            if (hasAnswered) {
                expBox.classList.remove('hidden');
                if (userAnswers[currentQIndex] === q.correctIndex) {
                    expBox.className = "mt-4 p-4 rounded-lg text-xs leading-relaxed bg-green-50 border border-green-200 text-green-900";
                    expTitle.innerText = "✓ Correct Rationale";
                } else {
                    expBox.className = "mt-4 p-4 rounded-lg text-xs leading-relaxed bg-red-50 border border-red-200 text-red-900";
                    expTitle.innerText = "✕ Incorrect Rationale";
                }
            } else {
                expBox.classList.add('hidden');
            }

            updateProgressBar();
        }

        // Option Selection Handling
        function selectOption(index) {
            const q = quizData[currentQIndex];
            userAnswers[currentQIndex] = index;

            if (index === q.correctIndex) {
                score++;
            }

            updateScoreCounter();
            renderQuestion();
        }

        // Navigate Next/Prev
        function navigate(direction) {
            currentQIndex += direction;
            if (currentQIndex < 0) currentQIndex = 0;
            if (currentQIndex >= quizData.length) currentQIndex = quizData.length - 1;
            renderQuestion();
            updateControls();
        }

        // Direct Question Jump
        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val >= 1 && val <= quizData.length) {
                currentQIndex = val - 1;
                renderQuestion();
                updateControls();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Toggle Hint Box
        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        // Update UI Button States & Progress
        function updateControls() {
            document.getElementById('prev-btn').disabled = (currentQIndex === 0);
            document.getElementById('next-btn').disabled = (currentQIndex === quizData.length - 1);
            document.getElementById('jump-input').value = currentQIndex + 1;
        }

        function updateScoreCounter() {
            const answeredCount = userAnswers.filter(a => a !== null).length;
            document.getElementById('score-counter').innerText = score;
            document.getElementById('total-answered').innerText = answeredCount;
        }

        function updateProgressBar() {
            const progress = ((currentQIndex + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        // Start Application on Load
        window.onload = initQuiz;
    </script>
