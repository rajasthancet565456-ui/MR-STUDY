        // Dynamic State
        let questions = [];
        let currentIndex = 0;
        let userAnswers = {};
        let score = 0;

        // Shuffle Options Function (Ensures unpredictable position of correct answers)
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize Dataset with shuffled options
        function initDataset() {
            questions = questionsRaw.map((q, idx) => {
                const shuffledOpts = shuffleArray(q.opts);
                return {
                    id: idx + 1,
                    page: q.p,
                    en: q.en,
                    hi: q.hi,
                    opts: shuffledOpts,
                    hint_en: q.hint_en,
                    hint_hi: q.hint_hi,
                    exp_en: q.exp_en,
                    exp_hi: q.exp_hi
                };
            });
        }

        // Render Current Question
        function renderQuestion() {
            const q = questions[currentIndex];
            
            // Meta & Progress
            document.getElementById('question-meta').innerText = `Page ${q.page} • Question ${q.id} of ${questions.length}`;
            document.getElementById('subtopic-tag').innerText = `Source: Page ${q.page}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
            
            // Question Text
            document.getElementById('question-text-en').innerText = `Q${q.id}. ${q.en}`;
            document.getElementById('question-text-hi').innerText = `प्र. ${q.hi}`;

            // Reset UI States
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-box').innerHTML = `<strong>En:</strong> ${q.hint_en}<br><strong>Hi:</strong> ${q.hint_hi}`;
            
            const expBox = document.getElementById('explanation-box');
            expBox.classList.add('hidden');
            document.getElementById('explanation-en').innerText = q.exp_en;
            document.getElementById('explanation-hi').innerText = q.exp_hi;

            // Render Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const optionLabels = ['A', 'B', 'C', 'D'];
            const savedAns = userAnswers[currentIndex];

            q.opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-3.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 flex items-start space-x-3 transition`;
                
                let badgeClass = "bg-slate-200 text-slate-700";
                
                if (savedAns !== undefined) {
                    btn.disabled = true;
                    if (opt.c) {
                        btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                        badgeClass = "bg-emerald-600 text-white";
                    } else if (savedAns === idx) {
                        btn.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                        badgeClass = "bg-rose-600 text-white";
                    }
                }

                btn.innerHTML = `
                    <span class="font-bold text-xs px-2 py-1 rounded ${badgeClass}">${optionLabels[idx]}</span>
                    <div class="text-sm">
                        <div class="font-medium">${opt.en}</div>
                        <div class="text-xs text-slate-500 mt-0.5">${opt.hi}</div>
                    </div>
                `;

                btn.onclick = () => selectOption(idx);
                container.appendChild(btn);
            });

            // If question was already answered, reveal explanation
            if (savedAns !== undefined) {
                expBox.classList.remove('hidden');
            }

            // Controls state
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').innerText = currentIndex === questions.length - 1 ? 'Finish Quiz' : 'Next →';
        }

        // Handle Option Click
        function selectOption(optionIdx) {
            if (userAnswers[currentIndex] !== undefined) return;

            userAnswers[currentIndex] = optionIdx;
            const q = questions[currentIndex];
            
            if (q.opts[optionIdx].c) {
                score++;
            }

            updateScore();
            renderQuestion();
        }

        // Toggle Hint
        function toggleHint() {
            const box = document.getElementById('hint-box');
            box.classList.toggle('hidden');
        }

        // Update Score UI
        function updateScore() {
            const totalAttempted = Object.keys(userAnswers).length;
            document.getElementById('score-display').innerText = `${score} / ${totalAttempted}`;
        }

        // Navigation
        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                alert(`Quiz Completed!\nYour Final Score: ${score} out of ${questions.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val >= 1 && val <= questions.length) {
                currentIndex = val - 1;
                renderQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}`);
            }
        }

        // Start Quiz on Load
        window.onload = () => {
            initDataset();
            renderQuestion();
        };
    </script>
