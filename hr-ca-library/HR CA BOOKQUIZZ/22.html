                hint: "इन्होंने पैरालंपिक में मेडल जीता है और यह आर्चरी (आर्चर) खेलते हैं।",
                explanation: "हरविन्द्र सिंह पैरालिम्पिक (आर्चर) खेल, कैथल से हैं जिन्होंने पेरिस में गोल्ड व टोक्यो में कांस्य जीता।"
            },
            {
                page: "Page 72",
                type: "Padma Awards 2025",
                q: "पद्म पुरस्कार 2025 से सम्मानित डॉ. संत राम देशवाल (सोनीपत) का मुख्य क्षेत्र क्या रहा है?",
                options: ["साहित्य एवं शिक्षा", "कृषि अनुसंधान", "चिकित्सा विज्ञान", "पर्यावरण संरक्षण"],
                correct: 0,
                hint: "यह छोटूराम आर्य कॉलेज में हिन्दी के एसोसिएट प्रोफेसर रहे हैं।",
                explanation: "डॉ. संत राम देशवाल (सोनीपत) को साहित्य एवं शिक्षा के क्षेत्र में बेहतरीन कार्य हेतु पद्म पुरस्कार मिला।"
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let answered = new Array(questions.length).fill(false);
        let userAnswers = new Array(questions.length).fill(null);

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const scoreDisplay = document.getElementById("score");
        const currentQDisplay = document.getElementById("current-q");
        const progressBar = document.getElementById("progress-bar");
        const pageTag = document.getElementById("page-tag");
        const qType = document.getElementById("q-type");
        const hintBox = document.getElementById("hint-box");
        const explanationBox = document.getElementById("explanation-box");
        const explanationText = document.getElementById("explanation-text");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const jumpInput = document.getElementById("jump-input");

        function loadQuestion() {
            const q = questions[currentIdx];
            currentQDisplay.textContent = currentIdx + 1;
            jumpInput.value = currentIdx + 1;
            progressBar.style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
            pageTag.textContent = q.page;
            qType.textContent = q.type;
            questionText.textContent = q.q;

            hintBox.classList.add("hidden");
            hintBox.textContent = q.hint;

            if (answered[currentIdx]) {
                explanationBox.classList.remove("hidden");
                explanationText.textContent = q.explanation;
            } else {
                explanationBox.classList.add("hidden");
            }

            optionsContainer.innerHTML = "";
            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3 rounded-xl border border-slate-700 bg-slate-900/50 hover:bg-slate-700/50 transition flex items-center justify-between font-medium text-sm sm:text-base";
                
                let optionLetter = String.fromCharCode(65 + idx);
                btn.innerHTML = `<span><strong class="text-emerald-400 mr-2">${optionLetter}.</strong> ${opt}</span>`;

                if (answered[currentIdx]) {
                    btn.disabled = true;
                    if (idx === q.correct) {
                        btn.classList.add("bg-emerald-900/40", "border-emerald-500", "text-emerald-200");
                    } else if (userAnswers[currentIdx] === idx) {
                        btn.classList.add("bg-rose-900/40", "border-rose-500", "text-rose-200");
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                optionsContainer.appendChild(btn);
            });

            prevBtn.disabled = currentIdx === 0;
            nextBtn.textContent = currentIdx === questions.length - 1 ? "समाप्त (Finish)" : "अगला (Next) →";
        }

        function selectOption(selectedIdx) {
            if (answered[currentIdx]) return;
            answered[currentIdx] = true;
            userAnswers[currentIdx] = selectedIdx;

            const q = questions[currentIdx];
            if (selectedIdx === q.correct) {
                score++;
                scoreDisplay.textContent = score;
            }

            explanationText.textContent = q.explanation;
            explanationBox.classList.remove("hidden");
            loadQuestion();
        }

        function toggleHint() {
            hintBox.classList.toggle("hidden");
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                alert(`क्विज़ समाप्त! आपका कुल स्कोर: ${score} / ${questions.length}`);
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            let num = parseInt(val);
            if (num >= 1 && num <= questions.length) {
                currentIdx = num - 1;
                loadQuestion();
            } else {
                jumpInput.value = currentIdx + 1;
            }
        }

        loadQuestion();
    </script>
<script src="../../quiz-question-controls.js"></script>
