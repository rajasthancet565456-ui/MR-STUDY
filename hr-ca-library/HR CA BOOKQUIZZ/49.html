<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide text-center sm:text-left">Haryana Current Affairs 2026-27 (HR CA)</h1>
            <div class="mt-2 sm:mt-0 bg-indigo-800 px-3 py-1 rounded-full text-sm font-medium">
                Total Unique Questions: <span id="total-questions-count">90</span>
            </div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl w-full mx-auto px-4 py-8 flex-grow">
        
        <!-- Progress Bar & Stats -->
        <div class="mb-6">
            <div class="flex justify-between text-sm font-semibold text-slate-600 mb-2">
                <span id="progress-text">Question 1 of 90</span>
                <span>Score: <span id="score-val" class="text-indigo-600">0</span></span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 1.11%;"></div>
            </div>
        </div>

        <!-- Quiz Card -->
        <div id="quiz-card" class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8 transition-all">
            
            <!-- Page Source Tag -->
            <div class="inline-block bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-md mb-3" id="page-badge">
                Page 1
            </div>

            <!-- Question Text (Bilingual) -->
            <h2 id="question-text" class="text-lg sm:text-xl font-bold text-slate-900 mb-6 leading-snug">
                <!-- Question injected via JS -->
            </h2>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Options injected via JS -->
            </div>

            <!-- Hint Section -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 focus:outline-none">
                    <span>💡 Toggle Hint / संकेत देखें</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-indigo-50 border border-indigo-100 rounded-lg text-xs text-indigo-900 italic">
                    <!-- Hint injected via JS -->
                </div>
            </div>

            <!-- Explanation / Rationale Box -->
            <div id="explanation-box" class="hidden mt-4 p-4 rounded-xl border text-sm transition-all">
                <!-- Explanation injected via JS -->
            </div>

        </div>

        <!-- Navigation Controls -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mt-6">
            <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-start">
                <button onclick="prevQuestion()" id="prev-btn" class="px-4 py-2 bg-white border border-slate-300 rounded-xl text-sm font-semibold text-slate-700 hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm transition-all">
                    ← Previous
                </button>
                <button onclick="nextQuestion()" id="next-btn" class="px-5 py-2 bg-indigo-600 rounded-xl text-sm font-semibold text-white hover:bg-indigo-700 shadow-md transition-all">
                    Next →
                </button>
            </div>

            <!-- Jump to Question -->
            <div class="flex items-center gap-2">
                <label for="jump-input" class="text-xs font-medium text-slate-500">Jump to #:</label>
                <input type="number" id="jump-input" min="1" max="90" class="w-16 px-2 py-1 bg-white border border-slate-300 rounded-lg text-sm text-center focus:outline-none focus:ring-2 focus:ring-indigo-500" onchange="jumpToQuestion(this.value)">
                <span class="text-xs text-slate-400">/ 90</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Haryana Current Affairs 2026-27 Interactive Quiz App &bull; Designed for Competitive Exams (SSC, RRB, HSSC, State PCS)

            container.innerHTML = '';

            shuffleData.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border text-sm font-medium transition-all flex items-center justify-between `;
                
                let isSelected = userChoices[currentIdx] === idx;
                let isAnswered = answered[currentIdx];

                if (isAnswered) {
                    if (idx === shuffleData.correctIndex) {
                        btn.className += `bg-emerald-50 border-emerald-300 text-emerald-900 shadow-sm`;
                    } else if (isSelected) {
                        btn.className += `bg-rose-50 border-rose-300 text-rose-900 shadow-sm`;
                    } else {
                        btn.className += `bg-white border-slate-200 text-slate-600 opacity-60`;
                    }
                    btn.disabled = true;
                } else {
                    btn.className += `bg-white border-slate-200 hover:border-indigo-300 hover:bg-indigo-50/30 text-slate-700 shadow-sm cursor-pointer`;
                    btn.onclick = () => selectOption(idx, shuffleData.correctIndex);
                }

                btn.innerHTML = `<span>${optText}</span>`;
                container.appendChild(btn);
            });

            // Explanation box
            const expBox = document.getElementById('explanation-box');
            if (answered[currentIdx]) {
                expBox.classList.remove('hidden');
                let isCorrectUser = userChoices[currentIdx] === shuffleData.correctIndex;
                if (isCorrectUser) {
                    expBox.className = `mt-4 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900 text-sm`;
                    expBox.innerHTML = `<strong>✔ Correct! / सही उत्तर!</strong><br>${q.explanation}`;
                } else {
                    expBox.className = `mt-4 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900 text-sm`;
                    expBox.innerHTML = `<strong>✖ Incorrect! / गलत उत्तर!</strong><br>${q.explanation}`;
                }
            } else {
                expBox.classList.add('hidden');
            }

            // Navigation buttons
            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === quizData.length - 1 ? 'Finish Quiz' : 'Next →';
        }

        function selectOption(selectedOptIdx, correctOptIdx) {
            if (answered[currentIdx]) return;
            answered[currentIdx] = true;
            userChoices[currentIdx] = selectedOptIdx;

            if (selectedOptIdx === correctOptIdx) {
                score++;
            }
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            let num = parseInt(val);
            if (num >= 1 && num <= quizData.length) {
                currentIdx = num - 1;
                loadQuestion();
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function showSummary() {
            const card = document.getElementById('quiz-card');
            document.getElementById('progress-text').innerText = "Quiz Completed! / परीक्षा समाप्त!";
            document.getElementById('progress-bar').style.width = `100%`;
            
            card.innerHTML = `
                <div class="text-center py-8">
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">Quiz Completed Successfully! 🎉</h2>
                    <p class="text-slate-600 mb-6">You have completed all 90 unique bilingual questions based on the exam syllabus.</p>
                    <div class="inline-block bg-indigo-50 border border-indigo-200 rounded-2xl p-6 mb-6">
                        <p class="text-sm font-medium text-indigo-900 mb-1">Your Final Score</p>
                        <p class="text-4xl font-extrabold text-indigo-600">${score} / ${quizData.length}</p>
                    </div>
                    <div>
                        <button onclick="resetQuiz()" class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl shadow-md hover:bg-indigo-700 transition-all">
                            Retake Quiz / पुनः प्रयास करें
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('prev-btn.style.display') = 'none';
            document.getElementById('next-btn.style.display') = 'none';
        }

        function resetQuiz() {
            currentIdx = 0;
            score = 0;
            answered = new Array(quizData.length).fill(false);
            userChoices = new Array(quizData.length).fill(null);
            shuffledOptionsCache = {};
            loadQuestion();
        }

        // Initial Load
        window.onload = function() {
            document.getElementById('total-questions-count').innerText = quizData.length;
            loadQuestion();
        };
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
