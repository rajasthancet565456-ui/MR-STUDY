        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answered = new Array(quizData.length).fill(false);

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const scoreElement = document.getElementById("score");
        const progressBar = document.getElementById("progress-bar");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const jumpInput = document.getElementById("jump-input");
        const questionSourceTag = document.getElementById("question-source-tag");
        const questionFormatTag = document.getElementById("question-format-tag");
        const currentPageTag = document.getElementById("current-page-tag");
        const qPageNum = document.getElementById("q-page-num");
        const hintBtnText = document.getElementById("hint-btn-text");
        const hintBox = document.getElementById("hint-box");
        const explanationBox = document.getElementById("explanation-box");

        function loadQuestion() {
            const q = quizData[currentIndex];
            
            // Update tags & numbers
            questionSourceTag.innerText = `Page ${q.page} - Q${currentIndex + 1}`;
            questionFormatTag.innerText = q.format;
            currentPageTag.innerText = q.page;
            // Calculate page-wise question number (1 to 25 per page)
            let pageQNum = (currentIndex % 25) + 1;
            qPageNum.innerText = pageQNum;
            
            questionText.innerText = q.question;

            // Reset hint & explanation
            hintBox.classList.add("hidden");
            hintBox.innerText = q.hint;
            hintBtnText.innerText = "Show Hint";
            
            if (answered[currentIndex]) {
                explanationBox.innerHTML = `<strong>स्पष्टीकरण:</strong> ${q.explanation}`;
                explanationBox.className = userAnswers[currentIndex] === q.correct 
                    ? "mb-6 p-4 rounded-xl border border-emerald-500/50 bg-emerald-950/30 text-emerald-200 text-sm block"
                    : "mb-6 p-4 rounded-xl border border-rose-500/50 bg-rose-950/30 text-rose-200 text-sm block";
            } else {
                explanationBox.classList.add("hidden");
            }

            // Render options
            optionsContainer.innerHTML = "";
            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = getOptionClass(idx);
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx);
                optionsContainer.appendChild(btn);
            });

            // Update progress & controls
            scoreElement.innerText = score;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            jumpInput.value = currentIndex + 1;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.innerText = currentIndex === quizData.length - 1 ? "Finish Quiz" : "Next →";
        }

        function getOptionClass(idx) {
            let baseClass = "w-full text-left p-3.5 rounded-xl border text-sm font-medium transition duration-200 flex items-center justify-between ";
            const q = quizData[currentIndex];

            if (!answered[currentIndex]) {
                return baseClass + "bg-slate-700/50 border-slate-600 hover:bg-slate-700 text-slate-200 hover:border-indigo-500";
            }

            if (idx === q.correct) {
                return baseClass + "bg-emerald-950/60 border-emerald-500 text-emerald-200 shadow-lg shadow-emerald-900/20";
            } else if (userAnswers[currentIndex] === idx) {
                return baseClass + "bg-rose-950/60 border-rose-500 text-rose-200 shadow-lg shadow-rose-900/20";
            } else {
                return baseClass + "bg-slate-800 border-slate-700 text-slate-400 opacity-60";
            }
        }

        function selectOption(idx) {
            if (answered[currentIndex]) return;

            answered[currentIndex] = true;
            userAnswers[currentIndex] = idx;
            const q = quizData[currentIndex];

            if (idx === q.correct) {
                score++;
            }

            loadQuestion();
        }

        function toggleHint() {
            if (hintBox.classList.contains("hidden")) {
                hintBox.classList.remove("hidden");
                hintBtnText.innerText = "Hide Hint";
            } else {
                hintBox.classList.add("hidden");
                hintBtnText.innerText = "Show Hint";
            }
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showFinalScore();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            let qNum = parseInt(val);
            if (qNum >= 1 && qNum <= quizData.length) {
                currentIndex = qNum - 1;
                loadQuestion();
            } else {
                jumpInput.value = currentIndex + 1;
            }
        }

        function showFinalScore() {
            document.getElementById("quiz-card").innerHTML = `
                <div class="text-center py-8">
                    <div class="text-5xl mb-4">🏆</div>
                    <h2 class="text-2xl font-bold text-slate-100 mb-2">क्विज़ पूर्ण हुई!</h2>
                    <p class="text-slate-300 mb-6">आपने 75 में से <span class="text-emerald-400 font-bold text-xl">${score}</span> अंक प्राप्त किए हैं।</p>
                    <button onclick="resetQuiz()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg transition">
                        पुनः प्रयास करें (Restart Quiz)
                    </button>
                </div>
            `;
        }

        function resetQuiz() {
            currentIndex = 0;
            score = 0;
            userAnswers = new Array(quizData.length).fill(null);
            answered = new Array(quizData.length).fill(false);
            location.reload();
        }

        // Initialize first question on load
        loadQuestion();
    </script>
