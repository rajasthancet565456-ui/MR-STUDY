        let quizData = [];
        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(75).fill(null);

        // Initialize and Shuffle Options
        function initQuiz() {
            quizData = rawQuizData.map(q => {
                const originalOptions = [...q.options];
                const correctAnswerText = originalOptions[q.answer];
                
                // Shuffle options
                const shuffledOptions = [...originalOptions].sort(() => Math.random() - 0.5);
                const newAnswerIndex = shuffledOptions.indexOf(correctAnswerText);

                return {
                    ...q,
                    options: shuffledOptions,
                    answer: newAnswerIndex
                };
            });

            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentQuestion];
            
            // UI elements update
            document.getElementById('current-q-num').innerText = currentQuestion + 1;
            document.getElementById('source-tag').innerText = q.tag;
            document.getElementById('question-text').innerText = `${currentQuestion + 1}. ${q.question}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / 75) * 100}%`;

            // Reset boxes
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('explanation-box').classList.add('hidden');

            // Render options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const optionLabels = ['A', 'B', 'C', 'D'];

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-lg border transition-all flex items-center justify-between text-sm ${getOptionStyle(idx)}`;
                btn.onclick = () => selectOption(idx);
                if (userAnswers[currentQuestion] !== null) {
                    btn.disabled = true;
                }

                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs border border-slate-600">${optionLabels[idx]}</span>
                        <span>${opt}</span>
                    </div>
                `;
                container.appendChild(btn);
            });

            // Update Nav buttons
            document.getElementById('prev-btn').disabled = currentQuestion === 0;
            document.getElementById('next-btn').innerText = currentQuestion === 74 ? 'Finish' : 'Next';

            // If already answered, show explanation
            if (userAnswers[currentQuestion] !== null) {
                showExplanation();
            }
        }

        function getOptionStyle(idx) {
            const answered = userAnswers[currentQuestion];
            if (answered === null) {
                return "bg-slate-700/50 border-slate-600 hover:bg-slate-700 hover:border-amber-400/50 text-slate-200";
            }
            const correct = quizData[currentQuestion].answer;
            if (idx === correct) {
                return "bg-emerald-950/60 border-emerald-500 text-emerald-200 font-semibold";
            }
            if (idx === answered && idx !== correct) {
                return "bg-rose-950/60 border-rose-500 text-rose-200";
            }
            return "bg-slate-800/40 border-slate-700/50 text-slate-400 opacity-60";
        }

        function selectOption(index) {
            if (userAnswers[currentQuestion] !== null) return;
            
            userAnswers[currentQuestion] = index;
            if (index === quizData[currentQuestion].answer) {
                score++;
                document.getElementById('score').innerText = score;
            }
            
            loadQuestion();
        }

        function showExplanation() {
            const q = quizData[currentQuestion];
            const userAns = userAnswers[currentQuestion];
            const expBox = document.getElementById('explanation-box');
            const resHeader = document.getElementById('result-header');
            const expText = document.getElementById('explanation-text');

            expBox.classList.remove('hidden');

            if (userAns === q.answer) {
                resHeader.innerText = "Correct! 🎉";
                resHeader.className = "font-bold text-base mb-1 text-emerald-400";
            } else {
                resHeader.innerText = "Incorrect ❌";
                resHeader.className = "font-bold text-base mb-1 text-rose-400";
            }

            expText.innerText = q.explanation;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestion < 74) {
                currentQuestion++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Total Score: ${score} / 75`);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val >= 1 && val <= 75) {
                currentQuestion = val - 1;
                loadQuestion();
            } else {
                alert('Please enter a question number between 1 and 75.');
            }
        }

        // Initialize Quiz on load
        window.onload = initQuiz;
    </script>
