        </div>

        let currentQIndex = 0;
        let score = 0;
        let answeredQuestions = new Set();

        // DOM Elements
        const qNumEl = document.getElementById('q-num');
        const qTotalEl = document.getElementById('q-total');
        const pageTagEl = document.getElementById('page-tag');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const hintBoxEl = document.getElementById('hint-box');
        const explanationBoxEl = document.getElementById('explanation-box');
        const explanationTextEl = document.getElementById('explanation-text');
        const scoreCounterEl = document.getElementById('score-counter');
        const totalAnsweredEl = document.getElementById('total-answered');
        const progressBarEl = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Fisher-Yates Shuffle for Options Randomization
        function getShuffledOptions(qObj) {
            if (qObj.shuffled) return qObj.shuffledData;

            let optionsWithIndices = qObj.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            
            // Perform shuffle
            for (let i = optionsWithIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsWithIndices[i], optionsWithIndices[j]] = [optionsWithIndices[j], optionsWithIndices[i]];
            }

            qObj.shuffled = true;
            qObj.shuffledData = optionsWithIndices;
            return optionsWithIndices;
        }

        function loadQuestion(index) {
            const currentQ = questionsData[index];
            qNumEl.textContent = index + 1;
            qTotalEl.textContent = questionsData.length;
            pageTagEl.textContent = `Page ${currentQ.page}`;
            questionTextEl.textContent = currentQ.q;

            // Reset UI states
            hintBoxEl.classList.add('hidden');
            hintBoxEl.textContent = currentQ.hint;
            explanationBoxEl.classList.add('hidden');
            explanationTextEl.textContent = currentQ.exp;

            // Render Options
            optionsContainerEl.innerHTML = '';
            const shuffledOpts = getShuffledOptions(currentQ);

            const labels = ['A', 'B', 'C', 'D'];

            shuffledOpts.forEach((optObj, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-lg border border-slate-200 hover:bg-slate-50 transition flex items-start gap-3 font-medium cursor-pointer option-btn`;
                btn.dataset.originalIndex = optObj.originalIndex;

                btn.innerHTML = `
                    <span class="w-7 h-7 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-sm font-bold flex-shrink-0 border border-slate-300">
                        ${labels[optIdx]}
                    </span>
                    <span class="mt-0.5">${optObj.text}</span>
                `;

                btn.onclick = () => selectOption(index, optObj.originalIndex, btn);

                // If already answered
                if (currentQ.selectedOption !== undefined) {
                    btn.disabled = true;
                    if (optObj.originalIndex === currentQ.ans) {
                        btn.classList.add('bg-green-100', 'border-green-500', 'text-green-900');
                        btn.querySelector('span').classList.add('bg-green-500', 'text-white', 'border-green-600');
                    }
                    if (optObj.originalIndex === currentQ.selectedOption && currentQ.selectedOption !== currentQ.ans) {
                        btn.classList.add('bg-red-100', 'border-red-500', 'text-red-900');
                        btn.querySelector('span').classList.add('bg-red-500', 'text-white', 'border-red-600');
                    }
                }

                optionsContainerEl.appendChild(btn);
            });

            if (currentQ.selectedOption !== undefined) {
                explanationBoxEl.classList.remove('hidden');
            }

            // Update Nav Buttons
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === questionsData.length - 1;

            // Update Progress Bar
            const progress = ((index + 1) / questionsData.length) * 100;
            progressBarEl.style.width = `${progress}%`;
        }

        function selectOption(qIdx, selectedOptIdx, selectedBtn) {
            const currentQ = questionsData[qIdx];
            if (currentQ.selectedOption !== undefined) return;

            currentQ.selectedOption = selectedOptIdx;
            answeredQuestions.add(qIdx);

            if (selectedOptIdx === currentQ.ans) {
                score++;
            }

            // Update Score & Answered Counter
            scoreCounterEl.textContent = score;
            totalAnsweredEl.textContent = answeredQuestions.size;

            // Refresh option button styles
            const allBtns = optionsContainerEl.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                const origIdx = parseInt(btn.dataset.originalIndex);
                if (origIdx === currentQ.ans) {
                    btn.classList.add('bg-green-100', 'border-green-500', 'text-green-900');
                    btn.querySelector('span').className = 'w-7 h-7 rounded-full bg-green-500 text-white flex items-center justify-center text-sm font-bold flex-shrink-0 border border-green-600';
                } else if (origIdx === selectedOptIdx) {
                    btn.classList.add('bg-red-100', 'border-red-500', 'text-red-900');
                    btn.querySelector('span').className = 'w-7 h-7 rounded-full bg-red-500 text-white flex items-center justify-center text-sm font-bold flex-shrink-0 border border-red-600';
                }
            });

            // Show Rationale
            explanationBoxEl.classList.remove('hidden');
        }

        function toggleHint() {
            hintBoxEl.classList.toggle('hidden');
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--;
                loadQuestion(currentQIndex);
            }
        }

        function nextQuestion() {
            if (currentQIndex < questionsData.length - 1) {
                currentQIndex++;
                loadQuestion(currentQIndex);
            }
        }

        function jumpToQuestion() {
            const inputVal = parseInt(document.getElementById('jump-input').value);
            if (inputVal >= 1 && inputVal <= questionsData.length) {
                currentQIndex = inputVal - 1;
                loadQuestion(currentQIndex);
                document.getElementById('jump-input').value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${questionsData.length}`);
            }
        }

        // Initialize App
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
