                options: ["Javelin Throw (भाला फेंक)", "Club Throw", "Discus Throw", "High Jump"],
                correct: 0,
                hint: "F-41 Javelin throw.",
                explanation: "Page 75 lists: 'नवदीप श्योराण (पानीपत) - स्वर्ण पदक (भाला फेंक)'."
            },
            {
                page: "Page 75",
                format: "Direct Factual",
                question: "How many SILVER Medals were won by Haryanvi athletes at Paris Paralympics 2024 according to Page 75?",
                options: ["3 Silver Medals", "5 Silver Medals", "2 Silver Medals", "4 Silver Medals"],
                correct: 0,
                hint: "Three silver medals.",
                explanation: "Page 75 header states: 'रजत पदक (3)'."
            },
            {
                page: "Page 75",
                format: "Matching",
                question: "Match the Silver Medal winner at Paris Paralympics 2024 with their respective event/district as per Page 75:\n1. Pranav Soorma (Faridabad) -> A. Silver (Club Throw)\n2. Manish Narwal (Faridabad) -> B. Silver (10m Air Pistol Shooting)\n3. Yogesh Kathuniya (Bahadurgarh) -> C. Silver (Discus Throw / चक्का फेंक)",
                options: ["1-A, 2-B, 3-C", "1-B, 2-A, 3-C", "1-C, 2-B, 3-A", "1-A, 2-C, 3-B"],
                correct: 0,
                hint: "Pranav - Club throw; Manish - 10m Pistol; Yogesh - Discus throw.",
                explanation: "Page 75 details: Pranav Soorma (Faridabad) - Silver in Club Throw; Manish Narwal (Faridabad) - Silver in 10m Air Pistol; Yogesh Kathuniya (Bahadurgarh) - Silver in Discus Throw."
            },
            {
                page: "Page 75",
                format: "Direct Factual",
                question: "Sarabjot Singh (Ambala) won the Olympic Bronze Medal at Paris 2024 in 10m Air Pistol Mixed Team alongside which shooter?",
                options: ["Manu Bhaker", "Suruchi Phogat", "Rhythm Sangwan", "Esha Singh"],
                correct: 0,
                hint: "Double Olympic medalist from Jhajjar.",
                explanation: "Page 75 lists: 'मनुभाकर व सरबजोत सिंह mixed, 10 मीटर एयर पिस्टल (कांस्य पदक)'."
            }
        ];

        // Fisher-Yates Shuffle Algorithm for Option Randomization
        function shuffleOptions(q) {
            let indices = [0, 1, 2, 3];
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            
            const shuffledOptions = indices.map(idx => q.options[idx]);
            const newCorrect = indices.indexOf(q.correct);
            
            return {
                ...q,
                options: shuffledOptions,
                correct: newCorrect
            };
        }

        // Initialize Dataset with Randomized Options
        const dataset = rawQuestions.map(q => shuffleOptions(q));

        // State Tracking
        let currentIndex = 0;
        let userAnswers = new Array(dataset.length).fill(null);

        // Render Current Question
        function renderQuestion() {
            const q = dataset[currentIndex];
            
            // Header Info
            document.getElementById('current-q-num').innerText = currentIndex + 1;
            document.getElementById('page-tag').innerText = q.page;
            document.getElementById('format-tag').innerText = q.format;
            document.getElementById('question-text').innerText = `Q${currentIndex + 1}. ${q.question}`;
            
            // Progress Bar
            const progress = ((currentIndex + 1) / dataset.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Reset Hint & Explanation UI
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-box').innerText = q.hint;
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('explanation-text').innerText = q.explanation;

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const optionPrefixes = ['A', 'B', 'C', 'D'];
            const isAnswered = userAnswers[currentIndex] !== null;

            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-3.5 sm:p-4 rounded-lg border font-medium text-sm sm:text-base flex items-center justify-between transition-all duration-150`;
                
                // Base Style
                if (!isAnswered) {
                    btn.className += ` bg-slate-700/60 border-slate-600 text-slate-200 hover:bg-slate-700 hover:border-amber-500/50`;
                    btn.onclick = () => selectOption(optIdx);
                } else {
                    btn.disabled = true;
                    if (optIdx === q.correct) {
                        btn.className += ` bg-emerald-950/80 border-emerald-500 text-emerald-200 font-semibold`;
                    } else if (optIdx === userAnswers[currentIndex]) {
                        btn.className += ` bg-rose-950/80 border-rose-500 text-rose-200`;
                    } else {
                        btn.className += ` bg-slate-800/40 border-slate-700/60 text-slate-500 opacity-60`;
                    }
                }

                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 rounded-full bg-slate-800 text-xs font-bold flex items-center justify-center border border-slate-600 shrink-0 text-amber-400">
                            ${optionPrefixes[optIdx]}
                        </span>
                        <span>${optText}</span>
                    </div>
                    ${isAnswered && optIdx === q.correct ? '<span class="text-emerald-400 font-bold ml-2">✓</span>' : ''}
                    ${isAnswered && optIdx === userAnswers[currentIndex] && optIdx !== q.correct ? '<span class="text-rose-400 font-bold ml-2">✗</span>' : ''}
                `;
                optionsContainer.appendChild(btn);
            });

            // Reveal explanation if already answered
            if (isAnswered) {
                document.getElementById('explanation-box').classList.remove('hidden');
            }

            // Update Nav Controls
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').innerText = currentIndex === dataset.length - 1 ? "Finish" : "Next →";
            
            // Score Update
            updateScoreDisplay();
        }

        // Handle Option Selection
        function selectOption(index) {
            if (userAnswers[currentIndex] !== null) return;
            userAnswers[currentIndex] = index;
            renderQuestion();
        }

        // Toggle Hint
        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        // Navigation Controls
        function nextQuestion() {
            if (currentIndex < dataset.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                alert(`Quiz Completed! Final Score: ${calculateScore()} / ${dataset.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value);
            if (val >= 1 && val <= dataset.length) {
                currentIndex = val - 1;
                renderQuestion();
                input.value = '';
            } else {
                alert(`Please enter a question number between 1 and ${dataset.length}.`);
            }
        }

        function calculateScore() {
            return userAnswers.reduce((score, ans, idx) => {
                return ans === dataset[idx].correct ? score + 1 : score;
            }, 0);
        }

        function updateScoreDisplay() {
            const answeredCount = userAnswers.filter(a => a !== null).length;
            const score = calculateScore();
            document.getElementById('score').innerText = score;
            document.getElementById('total-answered').innerText = answeredCount;
        }

        // Keyboard Navigation Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'ArrowLeft') prevQuestion();
        });

        // Initialize on Load
        window.onload = () => {
            renderQuestion();
        };
    </script>
<script src="../../quiz-question-controls.js"></script>
