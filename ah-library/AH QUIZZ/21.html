                    userAnswers[index] !== null
                        ? i === q.answer
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-900'
                            : userAnswers[index] === i
                            ? 'bg-rose-50 border-rose-300 text-rose-900'
                            : 'bg-white border-slate-200 text-slate-600 opacity-60'
                        : 'bg-white border-slate-200 hover:border-indigo-300 hover:bg-slate-50 text-slate-700'
                }`;

                const optionLetter = String.fromCharCode(65 + i);
                btn.innerHTML = `<span><strong class="mr-2 text-indigo-600">${optionLetter}.</strong> ${opt}</span>`;

                if (userAnswers[index] === null) {
                    btn.onclick = () => selectAnswer(index, i);
                } else {
                    btn.disabled = true;
                }

                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation
            if (userAnswers[index] !== null) {
                showExplanation(index, userAnswers[index]);
            }

            // Update Navigation state
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? 'Finish / Summary →' : 'Next →';

            // Update Progress bar
            const progress = ((index + 1) / quizData.length) * 100;
            progressBar.style.width = `${progress}%`;
            progressText.textContent = `Question ${index + 1} of ${quizData.length}`;
            progressPercentage.textContent = `${Math.round(progress)}% Completed`;
        }

        function selectAnswer(qIndex, selectedOption) {
            if (userAnswers[qIndex] !== null) return; // already answered

            userAnswers[qIndex] = selectedOption;
            const q = quizData[qIndex];

            if (selectedOption === q.answer) {
                score += 1;
                correctCount += 1;
            } else {
                incorrectCount += 1;
            }

            scoreDisplay.textContent = score;
            correctCountDisplay.textContent = correctCount;
            incorrectCountDisplay.textContent = incorrectCount;

            loadQuestion(qIndex);
        }

        function showExplanation(qIndex, selectedOption) {
            const q = quizData[qIndex];
            const isCorrect = selectedOption === q.answer;

            explanationBox.classList.remove('hidden', 'bg-emerald-50', 'bg-rose-50', 'border-emerald-200', 'border-rose-200');
            if (isCorrect) {
                explanationBox.classList.add('bg-emerald-50', 'border-emerald-200');
                explanationTitle.className = "font-bold mb-1 flex items-center gap-1.5 text-emerald-800";
                explanationTitle.innerHTML = `✅ Correct! (सत्य)`;
            } else {
                explanationBox.classList.add('bg-rose-50', 'border-rose-200');
                explanationTitle.className = "font-bold mb-1 flex items-center gap-1.5 text-rose-800";
                explanationTitle.innerHTML = `❌ Incorrect! (असत्य) - Correct Answer was (${String.fromCharCode(65 + q.answer)})`;
            }
            explanationText.textContent = q.explanation;
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`Quiz Completed! Final Score: ${score} / ${quizData.length}\nCorrect: ${correctCount}\nIncorrect: ${incorrectCount}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion(currentIndex);
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Initialize first question
        loadQuestion(currentIndex);
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
