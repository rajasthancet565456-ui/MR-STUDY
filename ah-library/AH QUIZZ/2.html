            <div class="mb-4">

        // Utility Function to Shuffle Options dynamic and prevent fixed position patterns
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize and randomize options for all unique questions
        function initQuestions() {
            questions = rawDataset.map((item, idx) => {
                const originalOptions = item.options;
                const correctText = originalOptions[item.correct];
                const shuffledOpts = shuffleArray(originalOptions);
                const newCorrectIndex = shuffledOpts.indexOf(correctText);

                return {
                    id: idx + 1,
                    page: item.page,
                    qHi: item.qHi,
                    qEn: item.qEn,
                    options: shuffledOpts,
                    correct: newCorrectIndex,
                    hint: item.hint,
                    exp: item.exp
                };
            });
        }

            q.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-3.5 rounded-lg border text-sm md:text-base font-medium flex items-center justify-between transition-all`;
                
                let prefix = String.fromCharCode(65 + optIdx); // A, B, C, D
                
                if (!isAnswered) {
                    btn.className += ` border-slate-300 bg-white hover:bg-indigo-50 hover:border-indigo-400 text-slate-800`;
                    btn.onclick = () => selectOption(index, optIdx);
                } else {
                    btn.disabled = true;
                    if (optIdx === q.correct) {
                        btn.className += ` bg-emerald-100 border-emerald-500 text-emerald-900 font-semibold`;
                    } else if (optIdx === selectedOpt) {
                        btn.className += ` bg-rose-100 border-rose-500 text-rose-900 font-semibold`;
                    } else {
                        btn.className += ` border-slate-200 bg-slate-50 text-slate-400`;
                    }
                }

                btn.innerHTML = `<span><strong class="mr-2">${prefix}.</strong> ${opt}</span>`;
                optionsContainer.appendChild(btn);
            });

            // Handle Hint
            const hintBox = document.getElementById('hint-box');
            hintBox.innerText = q.hint;
            hintBox.classList.add('hidden');

            // Handle Explanation
            const expBox = document.getElementById('explanation-box');
            if (isAnswered) {
                expBox.classList.remove('hidden');
                if (selectedOpt === q.correct) {
                    expBox.className = "p-4 rounded-lg text-sm bg-emerald-50 border border-emerald-300 text-emerald-900";
                    expBox.innerHTML = `<strong>✔ Correct! / सही उत्तर!</strong><br>${q.exp}`;
                } else {
                    expBox.className = "p-4 rounded-lg text-sm bg-rose-50 border border-rose-300 text-rose-900";
                    expBox.innerHTML = `<strong>✖ Incorrect. / गलत उत्तर!</strong><br><strong>Correct Answer:</strong> Option ${String.fromCharCode(65 + q.correct)}<br>${q.exp}`;
                }
            } else {
                expBox.classList.add('hidden');
            }

            // Controls state
            document.getElementById('prev-btn').disabled = (index === 0);
            document.getElementById('next-btn').disabled = (index === questions.length - 1);
            document.getElementById('jump-input').value = index + 1;
        }

        function selectOption(qIdx, optIdx) {
            userAnswers[qIdx] = optIdx;
            
            // Update Score if correct
            if (optIdx === questions[qIdx].correct) {
                score++;
            }
            
            document.getElementById('score-display').innerText = `${score} / ${questions.length}`;
            loadQuestion(qIdx);
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val >= 1 && val <= questions.length) {
                currentIndex = val - 1;
                loadQuestion(currentIndex);
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}.`);
            }
        }

        // Initialize on load
        window.onload = function() {
            initQuestions();
            loadQuestion(0);
        };
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
