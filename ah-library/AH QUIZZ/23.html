    <style>

<style id="cosmic-readable-quiz-theme">

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-emerald-400">Animal Husbandry & Agriculture Science</h1>
                <p class="text-xs text-slate-400">Bilingual Exam Prep (English / हिन्दी) | SSC, RRB, HSSC & State Exams</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 text-sm">
                    Score: <span id="score-display" class="font-bold text-emerald-400">0</span> / <span id="total-questions-display">100</span>
                </div>
                <button onclick="resetQuiz()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Reset</button>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="max-w-4xl mx-auto w-full bg-slate-700 h-2 rounded-full mt-3 overflow-hidden">
            <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl mx-auto w-full p-4 sm:p-6 my-auto">
        <div id="quiz-card" class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-6 relative">
            
            <!-- Question Meta -->
            <div class="flex justify-between items-center mb-4 text-xs font-semibold tracking-wider text-slate-400 uppercase">
                <span id="question-counter">Question 1 of 100</span>
                <span id="question-category" class="bg-emerald-900/60 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-700/50">Plant Nutrients & Fertilizers</span>
            </div>

            <!-- Question Text -->
            <div class="mb-6 space-y-2">
                <h2 id="question-text-en" class="text-lg sm:text-xl font-semibold text-white"></h2>
                <h2 id="question-text-hi" class="text-base sm:text-lg font-medium text-emerald-200"></h2>
            </div>

            <!-- Options List -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically inserted options -->
            </div>

            <!-- Hint Box -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-xs text-amber-400 hover:text-amber-300 font-medium flex items-center gap-1 transition">
                    💡 <span id="hint-toggle-text">Show Hint</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-950/40 border border-amber-700/50 rounded-lg text-xs text-amber-200"></div>
            </div>

            <!-- Explanation Box -->
            <div id="explanation-container" class="hidden mb-6 p-4 bg-slate-900/80 border border-slate-700 rounded-xl">
                <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-1">Explanation / Rationale:</h4>
                <p id="explanation-text-en" class="text-sm text-slate-300 mb-1"></p>
                <p id="explanation-text-hi" class="text-xs text-slate-400"></p>
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-700">
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <button onclick="prevQuestion()" id="prev-btn" class="flex-1 sm:flex-none bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Previous</button>
                    <button onclick="nextQuestion()" id="next-btn" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Next</button>
                </div>
                
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <span class="text-xs text-slate-400">Jump to:</span>
                    <input type="number" id="jump-input" min="1" max="100" class="w-16 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-center text-sm text-white focus:outline-none focus:border-emerald-500" onchange="jumpToQuestion(this.value)">
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-400">
        Interactive Exam Quiz Application &bull; Built with Tailwind CSS
    </footer>

            const hintBox = document.getElementById('hint-box');
            hintBox.innerText = q.hint;
            hintBox.classList.add('hidden');
            document.getElementById('hint-toggle-text').innerText = "Show Hint";

            // Explanation Box
            const expContainer = document.getElementById('explanation-container');
            if (selectedOption !== undefined) {
                document.getElementById('explanation-text-en').innerText = q.expEn;
                document.getElementById('explanation-text-hi').innerText = q.expHi;
                expContainer.classList.remove('hidden');
            } else {
                expContainer.classList.add('hidden');
            }

            // Navigation Buttons
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').disabled = index === totalQuestions - 1;
            document.getElementById('jump-input').value = index + 1;
        }

        function selectOption(optionId) {
            if (userAnswers[currentIndex] !== undefined) return; // already answered

            userAnswers[currentIndex] = optionId;
            const q = questions[currentIndex];
            const chosen = q.options.find(o => o.id === optionId);

            if (chosen && chosen.correct) {
                score++;
                document.getElementById('score-display').innerText = score;
            }

            loadQuestion(currentIndex);
        }

        function nextQuestion() {
            if (currentIndex < totalQuestions - 1) {
                loadQuestion(currentIndex + 1);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                loadQuestion(currentIndex - 1);
            }
        }

        function jumpToQuestion(val) {
            const num = parseInt(val);
            if (!isNaN(num) && num >= 1 && num <= totalQuestions) {
                loadQuestion(num - 1);
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            const toggleText = document.getElementById('hint-toggle-text');
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                toggleText.innerText = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                toggleText.innerText = "Show Hint";
            }
        }

        function resetQuiz() {
            score = 0;
            userAnswers = {};
            document.getElementById('score-display').innerText = score;
            loadQuestion(0);
        }

        // Initialize first question on load
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
