<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Husbandry & Poultry Farming Interactive Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .font-hindi { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  </style>
<style id="cosmic-readable-quiz-theme">
:root{--space:#e8dcff;--panel:#f3eaff;--panel2:#dcc6ff;--edge:#6a45bf;--glow:#d28b28;--accent:#d15f9f;--ink:#2c1b4d;--muted:#66547c;--mist:rgba(106,69,191,.2)}html{background:var(--space)}body{background:radial-gradient(ellipse 62% 45% at 90% -5%,rgba(209,95,159,.28),transparent 62%),radial-gradient(ellipse 55% 40% at 8% 100%,rgba(65,164,207,.26),transparent 64%),var(--space)!important;color:var(--ink)!important;min-height:100vh}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.78;background-image:radial-gradient(circle at 9% 18%,var(--glow) 0 1px,transparent 1.7px),radial-gradient(circle at 26% 69%,var(--edge) 0 .8px,transparent 1.5px),radial-gradient(circle at 68% 24%,var(--accent) 0 1px,transparent 1.8px),radial-gradient(circle at 88% 73%,#47a8d3 0 .8px,transparent 1.5px);background-size:220px 190px,300px 270px,260px 230px,340px 310px;z-index:-1}header{background:linear-gradient(105deg,var(--panel),var(--panel2))!important;border-color:rgba(106,69,191,.25)!important;box-shadow:0 7px 24px rgba(84,48,142,.14)!important}header h1{color:var(--edge)!important;text-shadow:none!important}header p,header .text-slate-400,header .text-indigo-200,header .text-indigo-300{color:var(--muted)!important}main>div,#quiz-card,.bg-slate-800,.bg-slate-900,.bg-indigo-900,.bg-indigo-950{background:linear-gradient(145deg,#f8f0ff,var(--panel))!important;border-color:rgba(106,69,191,.22)!important;color:var(--ink)!important;box-shadow:0 14px 35px rgba(84,48,142,.12)!important}.bg-slate-700,.bg-slate-100,.bg-slate-50{background:#eadffd!important;color:var(--ink)!important}.text-slate-100,.text-slate-200,.text-slate-300,.text-slate-400,.text-white,.text-slate-800,.text-slate-700,.text-slate-600{color:var(--ink)!important}.text-indigo-400,.text-indigo-300,.text-emerald-400,.text-yellow-300{color:var(--edge)!important}.border-slate-700,.border-slate-700\/60,.border-indigo-700,.border-slate-200{border-color:rgba(106,69,191,.25)!important}button:not(.bg-green-600):not(. <body class="bg-slate-100 min-h-screen text-slate-800 font-sans antialiased">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center">
      <div>
        <h1 class="text-xl md:text-2xl font-bold tracking-tight">Animal Husbandry Quiz (पशुपालन एवं कुक्कुट पालन)</h1>
        <p class="text-xs md:text-sm text-indigo-200">Exam-Level Practice Questions (Bilingual: Hindi & English)</p>
      </div>
      <div class="mt-2 md:mt-0 bg-indigo-900/60 px-4 py-2 rounded-lg text-right">
        <span class="text-xs uppercase tracking-wider text-indigo-300 block">Total Questions</span>
        <span class="text-lg font-extrabold text-yellow-400">105 Unique Questions</span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6">
    <!-- Quiz Card Container -->
    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
      
      <!-- Top Control Bar & Stats -->
      <div class="bg-slate-50 border-b border-slate-200 p-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-2">
          <span class="text-sm font-semibold text-slate-600">Question:</span>
          <span id="q-number" class="text-lg font-bold text-indigo-700">1</span>
          <span class="text-sm text-slate-400">/ 105</span>
        </div>

        <div class="flex items-center space-x-4">
          <div class="text-sm font-semibold">
            Score: <span id="live-score" class="text-emerald-600 font-bold">0</span> / <span id="attempted-count">0</span>
          </div>
          <div class="flex items-center space-x-1">
            <label for="jump-input" class="text-xs font-semibold text-slate-500">Jump to:</label>
            <input type="number" id="jump-input" min="1" max="105" class="w-16 border border-slate-300 rounded px-2 py-1 text-sm text-center focus:ring-2 focus:ring-indigo-500 outline-none" />
            <button onclick="jumpToQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-2.5 py-1.5 rounded font-medium transition">Go</button>
          </div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-slate-200 h-2">
        <div id="progress-bar" class="bg-indigo-600 h-2 transition-all duration-300" style="width: 0.95%;"></div>
      </div>

      <!-- Main Question Section -->
      <div class="p-6">
        <!-- Question Badge / Source -->
        <div class="mb-3 flex justify-between items-center">
          <span id="page-tag" class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded bg-indigo-100 text-indigo-800">Page 1</span>
          <button id="hint-btn" onclick="toggleHint()" class="text-xs font-semibold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-300 px-3 py-1 rounded-full flex items-center gap-1 transition">
            💡 Show Hint
          </button>
        </div>

        <!-- Hint Box -->
        <div id="hint-box" class="hidden mb-4 p-3 bg-amber-50 border-l-4 border-amber-500 text-amber-900 text-sm rounded-r">
          <p id="hint-text" class="italic"></p>
        </div>

        <!-- Question Text -->
        <div class="mb-6">
          <h2 id="question-text" class="text-base md:text-lg font-semibold text-slate-800 leading-relaxed font-hindi"></h2>
        </div>

        <!-- Options Grid -->
        <div id="options-container" class="space-y-3 mb-6">
          <!-- Options dynamically rendered here -->
        </div>

        <!-- Explanation / Rationale Box -->
        <div id="explanation-box" class="hidden p-4 rounded-lg border">
          <h3 id="exp-title" class="font-bold text-sm uppercase tracking-wider mb-1"></h3>
          <p id="explanation-text" class="text-sm font-hindi leading-relaxed"></p>
        </div>
      </div>

      <!-- Bottom Navigation Footer -->
      <div class="bg-slate-50 border-t border-slate-200 p-4 flex justify-between items-center">
        <button id="prev-btn" onclick="prevQuestion()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm transition disabled:opacity-50 disabled:cursor-not-allowed">
          &larr; Previous
        </button>
        <button id="next-btn" onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-lg text-sm transition shadow">
          Next &rarr;
        </button>
      </div>

    </div>
  </main>

    // State variables
    let currentIdx = 0;
    let userAnswers = new Array(rawQuestions.length).fill(null);
    let questionsData = [];

    // Fisher-Yates Shuffle Algorithm for Options
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Initialize Questions Dataset with Randomized Option Positions
    function initDataset() {
      questionsData = rawQuestions.map((qObj) => {
        return {
          ...qObj,
          shuffledOptions: shuffleArray(qObj.options)
        };
      });
    }

    // Render Current Question
    function renderQuestion() {
      const q = questionsData[currentIdx];
      const total = questionsData.length;

      // Update Header & Progress Bar
      document.getElementById("q-number").innerText = currentIdx + 1;
      document.getElementById("page-tag").innerText = q.page;
      const progressPercent = ((currentIdx + 1) / total) * 100;
      document.getElementById("progress-bar").style.width = `${progressPercent}%`;

      // Question text
      document.getElementById("question-text").innerText = `Q${currentIdx + 1}. ${q.q}`;

      // Reset Hint
      document.getElementById("hint-box").classList.add("hidden");
      document.getElementById("hint-text").innerText = q.hint;

      // Render Options
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      const selectedOpt = userAnswers[currentIdx];

      q.shuffledOptions.forEach((optText, i) => {
        const btn = document.createElement("button");
        btn.className = `w-full text-left p-3.5 rounded-lg border text-sm md:text-base font-medium transition duration-150 flex items-center justify-between font-hindi `;
        
        const optionLabel = String.fromCharCode(65 + i); // A, B, C, D

        if (selectedOpt === null) {
          btn.className += "border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700";
          btn.onclick = () => selectOption(optText);
        } else {
          btn.disabled = true;
          if (optText === q.answer) {
            btn.className += "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
          } else if (optText === selectedOpt) {
            btn.className += "border-rose-500 bg-rose-50 text-rose-900 font-semibold";
          } else {
            btn.className += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
          }
        }

        btn.innerHTML = `
          <span><strong class="text-indigo-600 mr-2">${optionLabel}.</strong> ${optText}</span>
          ${selectedOpt !== null && optText === q.answer ? '<span class="text-emerald-600 text-lg">✓</span>' : ''}
          ${selectedOpt !== null && optText === selectedOpt && optText !== q.answer ? '<span class="text-rose-600 text-lg">✕</span>' : ''}
        `;

        optionsContainer.appendChild(btn);
      });

      // Render Explanation Box
      const expBox = document.getElementById("explanation-box");
      const expTitle = document.getElementById("exp-title");
      const expText = document.getElementById("explanation-text");

      if (selectedOpt !== null) {
        expBox.classList.remove("hidden");
        if (selectedOpt === q.answer) {
          expBox.className = "p-4 rounded-lg border border-emerald-300 bg-emerald-50 text-emerald-900";
          expTitle.innerText = "✓ Correct Answer!";
        } else {
          expBox.className = "p-4 rounded-lg border border-rose-300 bg-rose-50 text-rose-900";
          expTitle.innerText = `✕ Incorrect! Correct Answer: ${q.answer}`;
        }
        expText.innerText = q.exp;
      } else {
        expBox.classList.add("hidden");
      }

      // Button State
      document.getElementById("prev-btn").disabled = currentIdx === 0;
      document.getElementById("next-btn").innerText = currentIdx === total - 1 ? "Finish Quiz" : "Next \u2192";

      // Update Live Score Stats
      updateScoreStats();
    }

    // Handle Option Selection
    function selectOption(selectedOpt) {
      if (userAnswers[currentIdx] === null) {
        userAnswers[currentIdx] = selectedOpt;
        renderQuestion();
      }
    }

    // Toggle Hint Box
    function toggleHint() {
      const hintBox = document.getElementById("hint-box");
      hintBox.classList.toggle("hidden");
    }

    // Update Live Score Counter
    function updateScoreStats() {
      let score = 0;
      let attempted = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans !== null) {
          attempted++;
          if (ans === questionsData[idx].answer) {
            score++;
          }
        }
      });
      document.getElementById("live-score").innerText = score;
      document.getElementById("attempted-count").innerText = attempted;
    }

    // Next Question Button
    function nextQuestion() {
      if (currentIdx < questionsData.length - 1) {
        currentIdx++;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        alert(`Quiz Finished!\nYour Final Score: ${document.getElementById("live-score").innerText} out of ${questionsData.length}`);
      }
    }

    // Previous Question Button
    function prevQuestion() {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // Jump to Question Input
    function jumpToQuestion() {
      const val = parseInt(document.getElementById("jump-input").value, 10);
      if (val >= 1 && val <= questionsData.length) {
        currentIdx = val - 1;
        renderQuestion();
        document.getElementById("jump-input").value = "";
      } else {
        alert(`Please enter a question number between 1 and ${questionsData.length}`);
      }
    }

    // Start App on Load
    window.onload = () => {
      initDataset();
      renderQuestion();
    };
  </script>
