        // State variables
        let currentQuestionIndex = 0;
        let userAnswers = new Array(rawQuestions.length).fill(null);
        let randomizedQuestions = [];

        // Seeded/Predictable Fisher-Yates shuffle algorithm for answer choices
        function setupRandomizedQuestions() {
            randomizedQuestions = rawQuestions.map((q, qIndex) => {
                const optionsWithOrigIndex = q.options.map((opt, idx) => ({
                    text: opt,
                    isCorrect: idx === q.answer
                }));

                // Simple shuffle per question
                for (let i = optionsWithOrigIndex.length - 1; i > 0; i--) {
                    const j = Math.floor((qIndex + 1) * 17 + i * 3) % (i + 1);
                    [optionsWithOrigIndex[i], optionsWithOrigIndex[j]] = [optionsWithOrigIndex[j], optionsWithOrigIndex[i]];
                }

                const newCorrectIndex = optionsWithOrigIndex.findIndex(o => o.isCorrect);

                return {
                    ...q,
                    shuffledOptions: optionsWithOrigIndex.map(o => o.text),
                    correctAnswer: newCorrectIndex
                };
            });
        }

        // Render current question
        function renderQuestion() {
            const q = randomizedQuestions[currentQuestionIndex];

            // Header info
            document.getElementById('question-badge').innerText = `Question ${currentQuestionIndex + 1} of ${randomizedQuestions.length}`;
            document.getElementById('page-source-tag').innerText = `Source Material: Page ${q.page}`;

            // Progress bar
            const pct = ((currentQuestionIndex + 1) / randomizedQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            // Question text
            document.getElementById('question-text-en').innerText = `${currentQuestionIndex + 1}. ${q.en}`;
            document.getElementById('question-text-hi').innerText = q.hi;

            // Hint
            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('hint-box').classList.add('hidden');

            // Options container
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const selectedAnswer = userAnswers[currentQuestionIndex];

            q.shuffledOptions.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border text-sm transition-all duration-150 flex items-start space-x-3 focus:outline-none ";

                if (selectedAnswer === null) {
                    btn.className += "bg-slate-50 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 text-slate-800";
                } else {
                    if (optIdx === q.correctAnswer) {
                        btn.className += "bg-emerald-50 border-emerald-500 text-emerald-900 font-medium ring-1 ring-emerald-500";
                    } else if (optIdx === selectedAnswer) {
                        btn.className += "bg-rose-50 border-rose-400 text-rose-900 ring-1 ring-rose-400";
                    } else {
                        btn.className += "bg-slate-50 border-slate-200 opacity-60 text-slate-600";
                    }
                }

                const optionLetter = String.fromCharCode(65 + optIdx);
                btn.innerHTML = `
                    <span class="inline-flex items-center justify-center w-6 h-6 rounded-md font-bold text-xs ${selectedAnswer === optIdx ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-700'} shrink-0">${optionLetter}</span>
                    <span class="flex-1 mt-0.5">${optText}</span>
                `;

                btn.onclick = () => selectOption(optIdx);
                optionsContainer.appendChild(btn);
            });

            // Explanation box state
            const expBox = document.getElementById('explanation-box');
            const expTitle = document.getElementById('explanation-title');
            const expText = document.getElementById('explanation-text');

            if (selectedAnswer !== null) {
                expBox.classList.remove('hidden');
                expText.innerText = q.explanation;

                if (selectedAnswer === q.correctAnswer) {
                    expBox.className = "mt-4 p-4 rounded-xl border bg-emerald-50/80 border-emerald-200 text-emerald-900";
                    expTitle.innerHTML = "<span>✅ Correct / सही उत्तर!</span>";
                } else {
                    expBox.className = "mt-4 p-4 rounded-xl border bg-rose-50/80 border-rose-200 text-rose-900";
                    expTitle.innerHTML = "<span>❌ Incorrect / गलत उत्तर</span>";
                }
            } else {
                expBox.classList.add('hidden');
            }

            // Prev/Next buttons
            document.getElementById('prev-btn').disabled = (currentQuestionIndex === 0);
            document.getElementById('next-btn').innerText = (currentQuestionIndex === randomizedQuestions.length - 1) ? "Finish / समाप्त" : "Next / अगला →";

            // Update Score
            calculateScore();
        }

        function selectOption(index) {
            if (userAnswers[currentQuestionIndex] !== null) return; // Prevent changing after selection
            userAnswers[currentQuestionIndex] = index;
            renderQuestion();
        }

        function calculateScore() {
            let score = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans !== null && ans === randomizedQuestions[idx].correctAnswer) {
                    score++;
                }
            });
            document.getElementById('score-display').innerText = score;
        }

        // Event Listeners
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentQuestionIndex < randomizedQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                alert(`Quiz Completed! Final Score: ${document.getElementById('score-display').innerText} / ${randomizedQuestions.length}`);
            }
        });

        document.getElementById('toggle-hint-btn').addEventListener('click', () => {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        });

        document.getElementById('jump-btn').addEventListener('click', () => {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val && val >= 1 && val <= randomizedQuestions.length) {
                currentQuestionIndex = val - 1;
                renderQuestion();
            }
        });

        // Initialize Application
        window.addEventListener('DOMContentLoaded', () => {
            setupRandomizedQuestions();
            document.getElementById('total-score-display').innerText = randomizedQuestions.length;
            renderQuestion();
        });
    </script>
