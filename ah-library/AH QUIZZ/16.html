        let currentIndex = 0;
        let score = 0;
        const userAnswers = {};

        const qCategory = document.getElementById('question-category');
        const qEng = document.getElementById('question-text-eng');
        const qHin = document.getElementById('question-text-hin');
        const optionsContainer = document.getElementById('options-container');
        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const scoreDisplay = document.getElementById('score-display');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion(index) {
            const q = quizData[index];
            qCategory.textContent = q.category;
            qEng.textContent = `${q.id}. ${q.eng}`;
            qHin.textContent = q.hin;

            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            
            if (userAnswers[q.id] !== undefined) {
                explanationBox.classList.remove('hidden');
                explanationText.textContent = q.explanation;
            } else {
                explanationBox.classList.add('hidden');
            }

            optionsContainer.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border border-slate-200 transition font-medium flex justify-between items-center ${
                    userAnswers[q.id] !== undefined
                        ? opt.key === q.answer
                            ? 'bg-emerald-100 border-emerald-500 text-emerald-900'
                            : userAnswers[q.id] === opt.key
                            ? 'bg-rose-100 border-rose-500 text-rose-900'
                            : 'bg-white text-slate-700 opacity-60'
                        : 'bg-white hover:bg-slate-50 text-slate-700'
                }`;
                btn.innerHTML = `<span><strong class="uppercase mr-2">(${opt.key})</strong> ${opt.eng} <span class="block text-sm text-emerald-900 font-normal mt-0.5">${opt.hin}</span></span>`;
                
                if (userAnswers[q.id] === undefined) {
                    btn.onclick = () => selectAnswer(q.id, opt.key, q.answer);
                } else {
                    btn.disabled = true;
                }
                optionsContainer.appendChild(btn);
            });

            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? "Finish" : "Next";
            progressText.textContent = `Q ${index + 1} of ${quizData.length}`;
            progressBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
            scoreDisplay.textContent = `Score: ${score} / ${quizData.length}`;
            jumpInput.value = index + 1;
        }

        function selectAnswer(qId, selectedKey, correctKey) {
            if (userAnswers[qId] !== undefined) return;
            userAnswers[qId] = selectedKey;

            if (selectedKey === correctKey) {
                score++;
            }

            loadQuestion(currentIndex);
        }

        hintBtn.onclick = () => {
            hintBox.classList.toggle('hidden');
        };

        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        };

        nextBtn.onclick = () => {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${quizData.length}.`);
            }
        };

        jumpInput.onchange = (e) => {
            let val = parseInt(e.target.value) - 1;
            if (val >= 0 && val < quizData.length) {
                currentIndex = val;
                loadQuestion(currentIndex);
            } else {
                e.target.value = currentIndex + 1;
            }
        };

        // Initialize first question
        loadQuestion(0);
    </script>
