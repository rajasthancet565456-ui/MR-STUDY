                    { id: 'd', textEn: "7-7.2, 7.2-7.4", textHi: "7-7.2, 7.2-7.4" }
                ],
                correct: 'b', // Cow milk pH ~6.4-6.6, Buffalo milk pH ~6.7-6.8. Let's verify image choice (b).
                hint: "Fresh milk is slightly acidic; check standard pH bounds.",
                explanation: "Milk pH ranges slightly acidic around 6.4 to 6.8. (Correct Answer: b)"
            },
            {
                category: "Dairy Science / दूध से संबंधित",
                en: "Which acid is naturally found in milk?",
                hi: "दूध में कौन-सा अम्ल पाया जाता है?",
                options: [
                    { id: 'a', textEn: "Acetic acid", textHi: "ऐसीटिक अम्ल" },
                    { id: 'b', textEn: "Tartaric acid", textHi: "टाटरिक अम्ल" },
                    { id: 'c', textEn: "Lactic acid", textHi: "लैक्टिक अम्ल" },
                    { id: 'd', textEn: "Benzoic acid", textHi: "बेंजोइक अम्ल" }
                ],
                correct: 'c',
                hint: "Lactic acid is produced by bacterial fermentation of lactose in milk.",
                explanation: "Lactic acid is present in milk. (Correct Answer: c)"
            },
            {
                category: "Dairy Science / दूध से संबंधित",
                en: "Which element is notably deficient in milk?",
                hi: "दूध में किस तत्व की कमी होती है?",
                options: [
                    { id: 'a', textEn: "Potassium", textHi: "पोटैशियम" },
                    { id: 'b', textEn: "Calcium", textHi: "कैल्शियम" },
                    { id: 'c', textEn: "Iron", textHi: "लोहा (Iron)" },
                    { id: 'd', textEn: "Magnesium", textHi: "मैग्नेशियम" }
                ],
                correct: 'c',
                hint: "Milk is a poor source of Iron.",
                explanation: "Milk is notoriously deficient in Iron. (Correct Answer: c)"
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        // DOM Elements
        const currentQNumElem = document.getElementById('current-q-num');
        const totalScorePoolElem = document.getElementById('total-score-pool');
        const scoreDisplayElem = document.getElementById('score-display');
        const progressTextElem = document.getElementById('progress-text');
        const progressBarElem = document.getElementById('progress-bar');
        const categoryElem = document.getElementById('question-category');
        const qTextEnElem = document.getElementById('question-text-en');
        const qTextHiElem = document.getElementById('question-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        totalScorePoolElem.textContent = quizData.length;

        function loadQuestion() {
            const q = quizData[currentIndex];
            currentQNumElem.textContent = currentIndex + 1;
            progressTextElem.textContent = `${currentIndex + 1} / ${quizData.length}`;
            progressBarElem.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            categoryElem.textContent = q.category;
            qTextEnElem.textContent = `${currentIndex + 1}. ${q.en}`;
            qTextHiElem.textContent = q.hi;

            hintText.textContent = q.hint;
            hintBox.classList.add('hidden');
            explanationBox.classList.add('hidden');

            optionsContainer.innerHTML = '';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `p-4 rounded-xl border text-left font-medium transition flex items-center justify-between text-slate-700 bg-white border-slate-200 hover:bg-slate-50`;
                
                const answered = userAnswers[currentIndex] !== null;
                const selectedOpt = userAnswers[currentIndex];

                if (answered) {
                    btn.disabled = true;
                    if (opt.id === q.correct) {
                        btn.className = "p-4 rounded-xl border text-left font-medium flex items-center justify-between bg-emerald-50 border-emerald-300 text-emerald-900";
                    } else if (opt.id === selectedOpt) {
                        btn.className = "p-4 rounded-xl border text-left font-medium flex items-center justify-between bg-rose-50 border-rose-300 text-rose-900";
                    }
                }

                btn.innerHTML = `
                    <div>
                        <span class="font-bold uppercase mr-2 text-emerald-700">${opt.id}.</span> 
                        <span class="block md:inline">${opt.textEn}</span>
                        <span class="block text-xs text-slate-500 mt-0.5">${opt.textHi}</span>
                    </div>
                `;

                if (!answered) {
                    btn.onclick = () => selectAnswer(opt.id);
                }

                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentIndex] !== null) {
                showExplanation(userAnswers[currentIndex] === q.correct);
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? "Finish" : "Next";
        }

        function selectAnswer(selectedId) {
            const q = quizData[currentIndex];
            userAnswers[currentIndex] = selectedId;

            const isCorrect = selectedId === q.correct;
            if (isCorrect) {
                score++;
            }

            updateScoreDisplay();
            loadQuestion();
        }

        function updateScoreDisplay() {
            scoreDisplayElem.innerHTML = `${score} / <span id="total-score-pool">${quizData.length}</span>`;
        }

        function showExplanation(isCorrect) {
            const q = quizData[currentIndex];
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900";
                explanationHeader.innerHTML = "✅ Correct Answer!";
            } else {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900";
                explanationHeader.innerHTML = `❌ Incorrect. Correct option was <span class="uppercase font-bold">${q.correct}</span>`;
            }
            explanationText.textContent = q.explanation;
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz completed! Your final score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value) - 1;
            if (val >= 0 && val < quizData.length) {
                currentIndex = val;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        }

        // Initialize first question
        loadQuestion();
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
