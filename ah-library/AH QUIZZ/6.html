        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptions = [];

        // Initialize Quiz
        function initQuiz() {
            renderQuestion();
        }

        // Shuffle function to randomize option placement unpredictably
        function getShuffledOptions(qObj) {
            let options = qObj.options_hi.map((optHi, idx) => ({
                hi: optHi,
                en: qObj.options_en[idx],
                originalIndex: idx
            }));

            // Seeded shuffle based on question page and ID to ensure consistency upon reload
            let seed = qObj.page * 100 + (currentIndex + 1);
            for (let i = options.length - 1; i > 0; i--) {
                let j = Math.floor(((seed * (i + 1) * 9301 + 49297) % 233280) / 233280 * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            return options;
        }

        function renderQuestion() {
            const q = quizData[currentIndex];
            
            // Update Header & Progress
            document.getElementById("question-number-badge").innerText = `Question ${currentIndex + 1} of ${quizData.length} (Page ${q.page})`;
            document.getElementById("jump-input").value = currentIndex + 1;
            document.getElementById("progress-bar").style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            document.getElementById("score").innerText = `${score} / ${quizData.length}`;

            // Render Text
            document.getElementById("q-text-hi").innerText = q.q_hi;
            document.getElementById("q-text-en").innerText = q.q_en;

            // Render Hint
            document.getElementById("hint-hi").innerText = "संकेत: " + q.hint_hi;
            document.getElementById("hint-en").innerText = "Hint: " + q.hint_en;
            document.getElementById("hint-box").classList.add("hidden");

            // Hide Explanation Box on fresh question render unless answered
            const expBox = document.getElementById("explanation-box");
            expBox.classList.add("hidden");

            // Options Setup
            shuffledOptions = getShuffledOptions(q);
            const optContainer = document.getElementById("options-container");
            optContainer.innerHTML = "";

            const existingAnswer = userAnswers[currentIndex];

            shuffledOptions.forEach((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                const button = document.createElement("button");
                button.className = `w-full text-left p-3.5 rounded-lg border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 transition flex items-start space-x-3 text-slate-800 font-medium focus:outline-none`;
                
                button.innerHTML = `
                    <span class="font-bold text-indigo-600 bg-indigo-100 rounded-md px-2.5 py-0.5 text-sm">${letter}</span>
                    <div class="flex-grow">
                        <p class="text-sm md:text-base text-slate-900">${opt.hi}</p>
                        <p class="text-xs text-slate-500 italic">${opt.en}</p>
                    </div>
                `;

                if (existingAnswer !== null) {
                    button.disabled = true;
                    if (opt.originalIndex === q.answer) {
                        button.classList.add("bg-emerald-100", "border-emerald-500", "text-emerald-900");
                    }
                    if (existingAnswer === opt.originalIndex && existingAnswer !== q.answer) {
                        button.classList.add("bg-rose-100", "border-rose-500", "text-rose-900");
                    }
                } else {
                    button.onclick = () => selectOption(opt.originalIndex);
                }

                optContainer.appendChild(button);
            });

            if (existingAnswer !== null) {
                showExplanation(existingAnswer === q.answer);
            }

            // Button States
            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").disabled = currentIndex === quizData.length - 1;
        }

        function selectOption(selectedOriginalIdx) {
            const q = quizData[currentIndex];
            userAnswers[currentIndex] = selectedOriginalIdx;

            if (selectedOriginalIdx === q.answer) {
                score++;
            }

            renderQuestion();
        }

        function showExplanation(isCorrect) {
            const q = quizData[currentIndex];
            const expBox = document.getElementById("explanation-box");
            const expTitle = document.getElementById("explanation-title");
            const expHi = document.getElementById("explanation-hi");
            const expEn = document.getElementById("explanation-en");

            expBox.classList.remove("hidden", "bg-emerald-50", "border-emerald-300", "bg-rose-50", "border-rose-300");

            if (isCorrect) {
                expBox.classList.add("bg-emerald-50", "border-emerald-300");
                expTitle.className = "flex items-center mb-1 font-bold text-emerald-800";
                expTitle.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 mr-2"></i> Correct Answer / सही उत्तर!`;
            } else {
                expBox.classList.add("bg-rose-50", "border-rose-300");
                expTitle.className = "flex items-center mb-1 font-bold text-rose-800";
                expTitle.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-600 mr-2"></i> Incorrect Answer / गलत उत्तर!`;
            }

            expHi.innerText = "व्याख्या: " + q.explanation_hi;
            expEn.innerText = "Rationale: " + q.explanation_en;
        }

        function toggleHint() {
            const hintBox = document.getElementById("hint-box");
            hintBox.classList.toggle("hidden");
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById("jump-input").value);
            if (val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                renderQuestion();
            }
        }

        // Initialize on load
        window.onload = initQuiz;
    </script>
