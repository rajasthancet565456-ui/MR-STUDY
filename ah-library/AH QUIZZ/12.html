<body class="bg-slate-900 text-slate-100 min-p-4 md:p-8 flex items-center justify-center min-h-screen">

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            
            // Update Headers & Progress
            questionNumberTag.innerText = `Question ${currentQuestionIndex + 1} of ${totalQuestions}`;
            progressDisplay.innerText = `${currentQuestionIndex + 1} / ${totalQuestions}`;
            progressBar.style.width = `${((currentQuestionIndex + 1) / totalQuestions) * 100}%`;

            // Text
            questionEng.innerText = `${currentQuestionIndex + 1}. ${q.qEng}`;
            questionHin.innerText = q.qHin;

            // Hint
            hintText.innerText = q.hint;
            hintBox.classList.add('hidden');

            // Explanation
            explanationBox.classList.add('hidden');
            explanationText.innerText = q.explanation;

            // Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition-all duration-200 font-medium flex items-center justify-between ${
                    userAnswers[currentQuestionIndex] !== null
                        ? idx === q.correct
                            ? 'bg-emerald-950/40 border-emerald-500 text-emerald-200'
                            : idx === userAnswers[currentQuestionIndex]
                                ? 'bg-rose-950/40 border-rose-500 text-rose-200'
                                : 'bg-slate-900 border-slate-700 text-slate-400 opacity-60'
                        : 'bg-slate-900 border-slate-700 hover:border-blue-500 text-slate-200 hover:bg-slate-900/60'
                }`;
                
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${opt}</span>`;
                
                if (userAnswers[currentQuestionIndex] === null) {
                    btn.onclick = () => selectOption(idx);
                } else {
                    btn.disabled = true;
                }

                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentQuestionIndex] !== null) {
                explanationBox.classList.remove('hidden');
            }

            // Navigation Buttons
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.innerText = currentQuestionIndex === totalQuestions - 1 ? 'Finish 🏁' : 'Next →';
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentQuestionIndex] !== null) return;

            userAnswers[currentQuestionIndex] = selectedIndex;
            const q = quizData[currentQuestionIndex];

            if (selectedIndex === q.correct) {
                score++;
                scoreDisplay.innerText = score;
            }

            loadQuestion();
        }

        function changeQuestion(direction) {
            const newIndex = currentQuestionIndex + direction;
            if (newIndex >= 0 && newIndex < totalQuestions) {
                currentQuestionIndex = newIndex;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value) - 1;
            if (!isNaN(val) && val >= 0 && val < totalQuestions) {
                currentQuestionIndex = val;
                jumpInput.value = '';
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${totalQuestions}`);
            }
        }

            hintBox.classList.toggle('hidden');
