        let currentQuestionIndex = 0;
        let score = 0;
        let attempted = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const questionCounter = document.getElementById('question-counter');
        const questionCategory = document.getElementById('question-category');
        const questionHindi = document.getElementById('question-hindi');
        const questionEnglish = document.getElementById('question-english');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const progressBar = document.getElementById('progress-bar');
        const scoreDisplay = document.getElementById('score-display');
        const attemptedDisplay = document.getElementById('attempted-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            questionCounter.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            questionCategory.innerText = q.category;
            questionHindi.innerText = q.hindi;
            questionEnglish.innerText = q.english;
            hintText.innerText = q.hint;
            explanationText.innerText = q.explanation;

            // Reset UI states
            hintBox.classList.add('hidden');
            if (userAnswers[currentQuestionIndex] !== null) {
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            // Render options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-lg border font-medium text-sm md:text-base transition flex justify-between items-center ${getOptionStyling(idx, q.answer, currentQuestionIndex)}`;
                btn.innerHTML = `<span>${opt}</span>`;
                btn.onclick = () => selectOption(idx);
                optionsContainer.appendChild(btn);
            });

            // Update Progress & Controls
            progressBar.style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.innerText = currentQuestionIndex === quizData.length - 1 ? 'Finish' : 'Next';
            scoreDisplay.innerText = score;
            attemptedDisplay.innerText = attempted;
        }

        function getOptionStyling(optIndex, correctIndex, qIndex) {
            const chosen = userAnswers[qIndex];
            if (chosen === null) {
                return "bg-white border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700";
            }
            if (optIndex === correctIndex) {
                return "bg-emerald-100 border-emerald-500 text-emerald-900 font-semibold";
            }
            if (optIndex === chosen && chosen !== correctIndex) {
                return "bg-rose-100 border-rose-500 text-rose-900 font-semibold";
            }
            return "bg-white border-slate-200 text-slate-400 opacity-60";
        }

        function selectOption(idx) {
            if (userAnswers[currentQuestionIndex] !== null) return; // Already answered

            const q = quizData[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = idx;
            attempted++;

            if (idx === q.answer) {
                score++;
            }

            explanationBox.classList.remove('hidden');
            loadQuestion(); // Refresh options coloring
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentQuestionIndex = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Initialize first load
        loadQuestion();
    </script>
