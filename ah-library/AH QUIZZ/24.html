        let currentIndex = 0;
        let score = 0;
        let answeredQuestions = new Array(quizData.length).fill(false);

        const totalQ = quizData.length;
        document.getElementById('total-q-num').innerText = totalQ;
        document.getElementById('jump-input').max = totalQ;

        function loadQuestion(index) {
            const q = quizData[index];
            currentIndex = index;

            document.getElementById('current-q-num').innerText = index + 1;
            document.getElementById('progress-bar').style.width = `${((index + 1) / totalQ) * 100}%`;
            document.getElementById('jump-input').value = index + 1;

            document.getElementById('question-source-tag').innerText = q.source;
            document.getElementById('question-type-tag').innerText = q.type;
            document.getElementById('question-text-en').innerText = `${index + 1}. ${q.en}`;
            document.getElementById('question-text-hi').innerText = q.hi;

            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('hint-box').classList.add('hidden');
            
            const expBox = document.getElementById('explanation-box');
            if (answeredQuestions[index]) {
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 bg-white hover:bg-emerald-50 hover:border-emerald-300 font-medium text-slate-700 transition-all shadow-sm flex items-center justify-between";
                btn.innerHTML = `<span>${opt.label}</span> <span class="text-xs text-slate-400 font-normal">Option ${String.fromCharCode(65 + optIdx)}</span>`;
                
                if (answeredQuestions[index]) {
                    btn.disabled = true;
                    if (opt.correct) {
                        btn.className = "w-full text-left p-3.5 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-900 font-medium transition-all shadow-sm flex items-center justify-between";
                    }
                } else {
                    btn.onclick = () => selectOption(optIdx);
                }
                container.appendChild(btn);
            });

            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').innerText = index === totalQ - 1 ? "Finish Quiz" : "Next →";
        }

        function selectOption(optIdx) {
            if (answeredQuestions[currentIndex]) return;

            const q = quizData[currentIndex];
            const container = document.getElementById('options-container');
            const buttons = container.getElementsByTagName('button');

            answeredQuestions[currentIndex] = true;

            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (q.options[i].correct) {
                    buttons[i].className = "w-full text-left p-3.5 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-900 font-medium transition-all shadow-sm flex items-center justify-between";
                } else if (i === optIdx) {
                    buttons[i].className = "w-full text-left p-3.5 rounded-xl border border-rose-500 bg-rose-50 text-rose-900 font-medium transition-all shadow-sm flex items-center justify-between";
                } else {
                    buttons[i].classList.add('opacity-50');
                }
            }

            if (q.options[optIdx].correct) {
                score++;
                document.getElementById('score-val').innerText = score;
            }

            // Show Explanation
            const expBox = document.getElementById('explanation-box');
            const expText = document.getElementById('explanation-text');
            const expTitle = document.getElementById('explanation-title');

            if (q.options[optIdx].correct) {
                expTitle.innerText = "Correct! Rationale:";
                expBox.className = "mt-4 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-sm text-emerald-900";
            } else {
                expTitle.innerText = "Incorrect. Correct Rationale:";
                expBox.className = "mt-4 p-4 rounded-xl border bg-rose-50 border-rose-200 text-sm text-rose-900";
            }
            expText.innerText = q.explanation;
            expBox.classList.remove('hidden');
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < totalQ - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${totalQ}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                loadQuestion(currentIndex - 1);
            }
        }

        function jumpToQuestion(val) {
            const target = parseInt(val) - 1;
            if (target >= 0 && target < totalQ) {
                loadQuestion(target);
            } else {
                alert(`Please enter a valid question number between 1 and ${totalQ}`);
                document.getElementById('jump-input').value = currentIndex + 1;
            }
        }

        // Initialize first question on load
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
