        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const questionCounter = document.getElementById('question-counter');
        const questionCategory = document.getElementById('question-category');
        const questionTextEn = document.getElementById('question-text-en');
        const questionTextHi = document.getElementById('question-text-hi');
        const optionsContainer = document.getElementById('options-container');
        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationTitle = document.getElementById('explanation-title');
        const explanationTextEn = document.getElementById('explanation-text-en');
        const explanationTextHi = document.getElementById('explanation-text-hi');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentIndex];
            questionCounter.textContent = `Question ${currentIndex + 1} of ${quizData.length}`;
            questionCategory.textContent = q.category;
            questionTextEn.textContent = `${currentIndex + 1}. ${q.en}`;
            questionTextHi.textContent = q.hi;

            // Reset Hint & Explanation
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            explanationBox.classList.add('hidden');

            // Render Options
            optionsContainer.innerHTML = '';
            q.options.forEach((option, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-4 py-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 font-medium text-slate-700 transition flex items-center justify-between group";
                
                const spanText = document.createElement('span');
                spanText.textContent = `${String.fromCharCode(65 + idx)}. ${option}`;
                btn.appendChild(spanText);

                const hasAnswered = userAnswers[currentIndex] !== null;
                
                if (hasAnswered) {
                    btn.disabled = true;
                    if (idx === q.answer) {
                        btn.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
                    } else if (userAnswers[currentIndex] === idx) {
                        btn.classList.add('bg-rose-50', 'border-rose-300', 'text-rose-900');
                    }
                } else {
                    btn.onclick = () => selectAnswer(idx);
                }

                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentIndex] !== null) {
                showExplanation(userAnswers[currentIndex] === q.answer);
            }

            // Update Navigation state
            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? "Finish" : "Next";

            // Update Progress Bar
            const progressPct = ((currentIndex + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPct}%`;
            scoreDisplay.textContent = `${score} / ${quizData.length}`;
        }

        function selectAnswer(selectedIndex) {
            const q = quizData[currentIndex];
            userAnswers[currentIndex] = selectedIndex;

            const isCorrect = selectedIndex === q.answer;
            if (isCorrect) {
                score++;
            }

            scoreDisplay.textContent = `${score} / ${quizData.length}`;
            loadQuestion();
        }

        function showExplanation(isCorrect) {
            const q = quizData[currentIndex];
            explanationBox.classList.remove('hidden');
            
            if (isCorrect) {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900";
                explanationTitle.innerHTML = "✅ Correct! / सही उत्तर!";
            } else {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900";
                explanationTitle.innerHTML = "❌ Incorrect. / गलत उत्तर।";
            }

            explanationTextEn.textContent = q.expEn;
            explanationTextHi.textContent = q.expHi;
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Final Score: ${score} / ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Initialize First Question
        loadQuestion();
    </script>
