<body class="bg-slate-50 text-slate-800 min-p-4 flex flex-col justify-between min-h-screen">

    <!-- Top Navigation / Header -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <h1 class="text-xl font-bold tracking-wide text-center sm:text-left">🌿 Agricultural Science & Medicinal Plants Quiz</h1>
            <div class="flex items-center gap-4 bg-indigo-700 px-3 py-1.5 rounded-lg text-sm font-medium">
                <span>Score: <span id="score-val" class="font-bold text-amber-300">0</span></span>
                <span>|</span>
                <span>Question: <span id="current-q-num" class="font-bold">1</span> / <span id="total-q-num">90</span></span>
            </div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 my-auto">
        
        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2.5 rounded-full mb-6 overflow-hidden">
            <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 1.11%;"></div>
        </div>

        <!-- Question Card Box -->
        <div id="quiz-card" class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8 transition-all">
            
            <!-- Metadata and Page Tag -->
            <div class="flex justify-between items-center mb-4 text-xs font-semibold uppercase tracking-wider text-indigo-600">
                <span id="question-source-tag" class="bg-indigo-50 px-2.5 py-1 rounded-md">Page 1 Source Material</span>
                <span id="question-type-tag" class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md">Direct Factual MCQ</span>
            </div>

            <!-- Bilingual Question Text -->
            <div class="space-y-3 mb-6">
                <h2 id="question-text-en" class="text-lg sm:text-xl font-bold text-slate-900 leading-snug">
                    Loading Question...
                </h2>
                <h3 id="question-text-hi" class="text-base sm:text-lg font-medium text-slate-600 leading-relaxed border-l-4 border-indigo-400 pl-3">
                    प्रश्न लोड हो रहा है...
                </h3>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Injected via JS -->
            </div>

            <!-- Action Toolbar (Hint & Jump) -->
            <div class="flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-slate-100">
                <button id="hint-btn" onclick="toggleHint()" class="text-sm font-medium text-amber-600 bg-amber-50 hover:bg-amber-100 px-3.5 py-2 rounded-lg transition-colors flex items-center gap-1.5">
                    💡 Show Hint
                </button>
                
                <div class="flex items-center gap-2">
                    <label for="jump-input" class="text-xs font-medium text-slate-500">Jump to:</label>
                    <input type="number" id="jump-input" min="1" max="90" class="w-16 px-2 py-1 text-sm border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center" onchange="jumpToQuestion(this.value)">
                </div>
            </div>

            <!-- Hint Box -->
            <div id="hint-box" class="hidden mt-4 p-3.5 bg-amber-50 border border-amber-200 rounded-xl text-sm text-amber-900">
                <span class="font-bold">Hint:</span> <span id="hint-text">No hint available.</span>
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden mt-4 p-4 rounded-xl border text-sm">
                <h4 id="explanation-title" class="font-bold mb-1">Explanation / Rationale:</h4>
                <p id="explanation-text" class="text-slate-700 leading-relaxed"></p>
            </div>

        </div>

        <!-- Navigation Footprint Buttons -->
        <div class="flex justify-between items-center mt-6">
            <button id="prev-btn" onclick="prevQuestion()" class="px-5 py-2.5 bg-white border border-slate-300 text-slate-700 font-medium rounded-xl hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed shadow-sm transition-all">
                ← Previous
            </button>
            <button id="next-btn" onclick="nextQuestion()" class="px-6 py-2.5 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed shadow-md transition-all">
                Next →
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400">
        Interactive Exam Quiz Application &bull; Strict Syllabus Aligned
    </footer>

        let currentIndex = 0;
        let score = 0;
        let selectedOptionIndex = null;
        let answeredQuestions = new Array(quizData.length).false;

        const totalQ = quizData.length;
        document.getElementById('total-q-num').innerText = totalQ;
        document.getElementById('jump-input').max = totalQ;

        function loadQuestion(index) {
            const q = quizData[index];
            currentIndex = index;
            selectedOptionIndex = null;

            document.getElementById('current-q-num').innerText = index + 1;
            document.getElementById('progress-bar').style.width = `${((index + 1) / totalQ) * 100}%`;
            document.getElementById('jump-input').value = index + 1;

            document.getElementById('question-source-tag').innerText = q.source;
            document.getElementById('question-type-tag').innerText = q.type;
            document.getElementById('question-text-en').innerText = `${index + 1}. ${q.en}`;
            document.getElementById('question-text-hi').innerText = q.hi;

            document.getElementById('hint-text').innerText = q.hint;
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('explanation-box').classList.add('hidden');

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 bg-white hover:bg-indigo-50 hover:border-indigo-300 font-medium text-slate-700 transition-all shadow-sm flex items-center justify-between";
                btn.innerHTML = `<span>${opt.label}</span> <span class="text-xs text-slate-400 font-normal">Option ${String.fromCharCode(65 + optIdx)}</span>`;
                btn.onclick = () => selectOption(optIdx);
                container.appendChild(btn);
            });

            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').innerText = index === totalQ - 1 ? "Finish Quiz" : "Next →";
        }

        function selectOption(optIdx) {
            const q = quizData[currentIndex];
            const container = document.getElementById('options-container');
            const buttons = container.getElementsByTagName('button');

            // Disable all buttons after choice
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (q.options[i].correct) {
                    buttons[i].classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                } else if (i === optIdx) {
                    buttons[i].classList.add('bg-rose-50', 'border-rose-500', 'text-rose-900');
                } else {
                    buttons[i].classList.add('opacity-50');
                }
            }

            if (q.options[optIdx].correct && !answeredQuestions[currentIndex]) {
                score++;
                document.getElementById('score-val').innerText = score;
            }

            if (!answeredQuestions[currentIndex]) {
                answeredQuestions[currentIndex] = true;
            }

            // Show Explanation
            const expBox = document.getElementById('explanation-box');
            const expText = document.getElementById('explanation-text');
            const expTitle = document.getElementById('explanation-title');

            if (q.options[optIdx].correct) {
                expTitle.innerText = "Correct! Rationale:";
                expBox.className = "mt-4 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-sm text-emerald-900";
            } else {
                expTitle.innerText = "Incorrect. Correct Rationale:";
                expBox.className = "mt-4 p-4 rounded-xl border bg-rose-50 border-rose-200 text-sm text-rose-900";
            }
            expText.innerText = q.explanation;
            expBox.classList.remove('hidden');
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < totalQ - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${totalQ}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                loadQuestion(currentIndex - 1);
            }
        }

        function jumpToQuestion(val) {
            const target = parseInt(val) - 1;
            if (target >= 0 && target < totalQ) {
                loadQuestion(target);
            } else {
                alert(`Please enter a valid question number between 1 and ${totalQ}`);
                document.getElementById('jump-input').value = currentIndex + 1;
            }
        }

        // Initialize first question on load
        window.onload = () => {
            loadQuestion(0);
        };
    </script>
