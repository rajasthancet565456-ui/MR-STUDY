        }

        function selectOption(qIndex, optIndex) {
            if (userAnswers[qIndex] !== undefined) return;
            userAnswers[qIndex] = optIndex;
            
            attemptedCount = Object.keys(userAnswers).length;
            attemptedDisplay.innerText = attemptedCount;

            // Calculate current score
            let score = 0;
            for (let q in userAnswers) {
                if (questions[q].options[userAnswers[q]].correct) {
                    score++;
                }
            }
            scoreDisplay.innerText = `${score} / 80`;

            loadQuestion(qIndex);
        }

        function nextQuestion() {
            if (currentQuestion < 79) {
                currentQuestion++;
                loadQuestion(currentQuestion);
            } else {
                alert(`Quiz Completed! Your final score is: ${calculateScore()} / 80`);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion(currentQuestion);
            }
        }

        function jumpToQuestion() {
            let val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= 80) {
                currentQuestion = val - 1;
                loadQuestion(currentQuestion);
                jumpInput.value = '';
            } else {
                alert("Please enter a valid question number between 1 and 80.");
            }
        }

        function calculateScore() {
            let score = 0;
            for (let q in userAnswers) {
                if (questions[q].options[userAnswers[q]].correct) {
                    score++;
                }
            }
            return score;
        }

        // Initial Load
        loadQuestion(currentQuestion);
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
