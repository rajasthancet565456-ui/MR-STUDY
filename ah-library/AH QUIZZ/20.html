                </div>
            ` : '';

            let explanationHTML = '';
            if (selectedOption !== undefined) {
                explanationHTML = `
                    <div class="mt-6 p-5 bg-slate-100 border border-slate-200 rounded-xl animate-fadeIn">
                        <h4 class="font-bold text-slate-800 text-sm uppercase tracking-wider mb-1">📖 Explanation / Rationale</h4>
                        <p class="text-slate-600 text-sm leading-relaxed">${q.explanation}</p>
                    </div>
                `;
            }

            questionContainer.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold uppercase tracking-wider text-emerald-600 bg-emerald-100 px-3 py-1 rounded-full">Question ${index + 1} of 100</span>
                    </div>
                    
                    <!-- Bilingual Questions -->
                    <div class="space-y-2">
                        <h3 class="text-lg md:text-xl font-bold text-slate-800">${index + 1}. ${q.qEng}</h3>
                        <h4 class="text-base md:text-lg font-semibold text-slate-600">${q.qHin}</h4>
                    </div>

                    <!-- Options Grid -->
                    <div class="grid grid-cols-1 gap-3 pt-2">
                        ${optionsHTML}
                    </div>

                    ${hintHTML}
                    ${explanationHTML}
                </div>
            `;

            // Update Progress
            const progress = ((index + 1) / 100) * 100;
            progressBar.style.width = `${progress}%`;
            progressText.innerText = `Question ${index + 1} of 100`;
            progressPercent.innerText = `${Math.round(progress)}%`;

            // Update Buttons
            prevBtn.disabled = index === 0;
            nextBtn.innerText = index === 99 ? "Finish Quiz" : "Next";
        }

        function selectOption(qIndex, optIndex) {
            if (userAnswers[qIndex] !== undefined) return; // already answered
            userAnswers[qIndex] = optIndex;
            
            attemptedCount = Object.keys(userAnswers).length;
            attemptedDisplay.innerText = attemptedCount;

            // Calculate current score
            let score = 0;
            for (let q in userAnswers) {
                if (questions[q].options[userAnswers[q]].correct) {
                    score++;
                }
            }
            scoreDisplay.innerText = `${score} / 100`;

            loadQuestion(qIndex);
        }

        function nextQuestion() {
            if (currentQuestion < 99) {
                currentQuestion++;
                loadQuestion(currentQuestion);
            } else {
                alert(`Quiz Completed! Your final score is: ${calculateScore()} / 100`);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion(currentQuestion);
            }
        }

        function jumpToQuestion() {
            let val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= 100) {
                currentQuestion = val - 1;
                loadQuestion(currentQuestion);
                jumpInput.value = '';
            } else {
                alert("Please enter a valid question number between 1 and 100.");
            }
        }

        function calculateScore() {
            let score = 0;
            for (let q in userAnswers) {
                if (questions[q].options[userAnswers[q]].correct) {
                    score++;
                }
            }
            return score;
        }

        // Initial Load
        loadQuestion(currentQuestion);
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
