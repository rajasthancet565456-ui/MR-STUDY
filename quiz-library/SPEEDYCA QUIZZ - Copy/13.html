                buttons[i].disabled = true;
                if (i === q.correct) {
                    buttons[i].classList.add('bg-emerald-900/40', 'border-emerald-500', 'text-emerald-200');
                } else if (i === selectedIndex) {
                    buttons[i].classList.add('bg-rose-900/40', 'border-rose-500', 'text-rose-200');
                }
            }
        }

        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        };

        nextBtn.onclick = () => {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of 90.`);
            }
        };

        hintToggleBtn.onclick = () => {
            hintBox.classList.toggle('hidden');
        };

        jumpBtn.onclick = () => {
            const val = parseInt(jumpInput.value) - 1;
            if (val >= 0 && val < questions.length) {
                currentIndex = val;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert("Please enter a valid question number between 1 and 90.");
            }
        };

        // Initial Load
        loadQuestion();
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
