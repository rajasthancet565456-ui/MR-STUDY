            pageBadge.textContent = `Page ${q.page}`;
            questionTextEl.textContent = q.question;
            
            hintText.textContent = q.hint;
            hintBox.classList.add("hidden");
            explanationBox.classList.add("hidden");

            optionsContainerEl.innerHTML = "";
            answeredCurrent = userAnswers[currentQuestionIndex] !== null;

            q.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 hover:bg-slate-700/50 transition-all text-sm font-medium flex items-center justify-between group";
                btn.innerHTML = `<span><span class="inline-block w-6 text-indigo-400 font-bold">${String.fromCharCode(65 + index)}.</span> ${option}</span>`;
                
                if (answeredCurrent) {
                    btn.disabled = true;
                    if (index === q.correctIndex) {
                        btn.classList.add("bg-emerald-950/60", "border-emerald-600", "text-emerald-200");
                    } else if (index === userAnswers[currentQuestionIndex]) {
                        btn.classList.add("bg-rose-950/60", "border-rose-600", "text-rose-200");
                    }
                } else {
                    btn.onclick = () => selectOption(index);
                }

                optionsContainerEl.appendChild(btn);
            });

            if (answeredCurrent) {
                explanationText.textContent = q.explanation;
                explanationBox.classList.remove("hidden");
            }

            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? "Finish" : "Next";

            // Update Progress Bar
            const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
            progressBarEl.style.width = `${progress}%`;
            jumpInput.value = currentQuestionIndex + 1;
        }

        function selectOption(selectedIndex) {
            if (answeredCurrent) return;
            answeredCurrent = true;

            const q = quizData[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = selectedIndex;

            const optionButtons = optionsContainerEl.children;
            if (selectedIndex === q.correctIndex) {
                score++;
                scoreEl.textContent = score;
                optionButtons[selectedIndex].classList.add("bg-emerald-950/60", "border-emerald-600", "text-emerald-200");
            } else {
                optionButtons[selectedIndex].classList.add("bg-rose-950/60", "border-rose-600", "text-rose-200");
                optionButtons[q.correctIndex].classList.add("bg-emerald-950/60", "border-emerald-600", "text-emerald-200");
            }

            for (let btn of optionButtons) {
                btn.disabled = true;
            }

            explanationText.textContent = q.explanation;
            explanationBox.classList.remove("hidden");
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showCompletionSummary();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function toggleHint() {
            hintBox.classList.toggle("hidden");
        }

        function jumpToQuestion() {
            let qNum = parseInt(jumpInput.value);
            if (qNum >= 1 && qNum <= quizData.length) {
                currentQuestionIndex = qNum - 1;
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function showCompletionSummary() {
            const card = document.getElementById("quiz-card");
            const percentage = Math.round((score / quizData.length) * 100);
            card.innerHTML = `
                <div class="text-center py-8 space-y-4">
                    <h2 class="text-2xl sm:text-3xl font-bold text-indigo-400">🎉 Quiz Completed!</h2>
                    <p class="text-slate-300">You have successfully completed all 90 questions from Pages 35 & 36.</p>
                    <div class="inline-block bg-slate-900 border border-slate-700 px-6 py-4 rounded-2xl my-4">
                        <div class="text-3xl font-extrabold text-emerald-400">${score} / 90</div>
                        <div class="text-xs text-slate-400 uppercase tracking-wider mt-1">Final Score (${percentage}%)</div>
                    </div>
                    <div>
                        <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-xl transition-colors shadow-lg shadow-indigo-600/30">
                            Restart Quiz
                        </button>
                    </div>
                </div>
            `;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            scoreEl.textContent = 0;
            userAnswers = new Array(quizData.length).fill(null);
            // Re-render original card structure
            location.reload();
        }

        // Initialize first question on load
        window.onload = loadQuestion;
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
