        let currentIndex = 0;
        let score = 0;
        let userAnswers = {}; // stores selected option for each question index

        const questionCounter = document.getElementById('question-counter');
        const pageBadge = document.getElementById('page-badge');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const scoreDisplay = document.getElementById('score-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        // Shuffle helper function (Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Pre-shuffle options for each question once to ensure stable randomness across navigation
        const randomizedOptions = quizData.map(q => {
            return {
                ...q,
                shuffledOptions: shuffle([...q.options])
            };
        });

        function loadQuestion() {
            const currentQ = randomizedOptions[currentIndex];
            
            questionCounter.textContent = `Question ${currentIndex + 1} of ${quizData.length}`;
            pageBadge.textContent = `Page ${currentQ.page}`;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            
            questionText.textContent = currentQ.question;
            hintBox.textContent = currentQ.hint;
            hintBox.classList.add('hidden');
            
            explanationText.textContent = currentQ.explanation;
            
            // Render options
            optionsContainer.innerHTML = '';
            const savedAnswer = userAnswers[currentIndex];

            currentQ.shuffledOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.textContent = option;
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 font-medium text-sm transition flex items-center justify-between bg-white hover:bg-slate-50 focus:outline-none";
                
                if (savedAnswer !== undefined) {
                    btn.disabled = true;
                    if (option === currentQ.answer) {
                        btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                    } else if (option === savedAnswer) {
                        btn.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                    }
                } else {
                    btn.onclick = () => selectOption(option, currentQ.answer, btn);
                }

                optionsContainer.appendChild(btn);
            });

            if (savedAnswer !== undefined) {
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? 'Finish' : 'Next';
        }

        function selectOption(selected, correct, buttonElement) {
            userAnswers[currentIndex] = selected;
            
            const allBtns = optionsContainer.querySelectorAll('button');
            allBtns.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correct) {
                    btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                } else if (btn.textContent === selected && selected !== correct) {
                    btn.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                }
            });

            if (selected === correct) {
                score++;
                scoreDisplay.textContent = score;
            }

            explanationBox.classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} / ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                jumpInput.value = '';
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        // Initialize Quiz on load
        window.onload = () => {
            loadQuestion();
        };
    </script>
