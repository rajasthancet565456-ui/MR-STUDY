        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const scoreDisplay = document.getElementById('score-display');
        const categoryDisplay = document.getElementById('question-category');
        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationContainer = document.getElementById('explanation-container');
        const explanationTitle = document.getElementById('explanation-title');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = questions[currentQuestion];
            categoryDisplay.textContent = q.category;
            questionText.textContent = `${currentQuestion + 1}. ${q.q}`;
            
            hintText.textContent = q.hint;
            hintBox.classList.add('hidden');
            hintBtn.textContent = "💡 Show Hint";

            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const button = document.createElement('button');
                button.className = `w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between font-medium text-slate-200 
                    ${userAnswers[currentQuestion] !== null ? 
                        (index === q.correct ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-200' : 
                            (userAnswers[currentQuestion] === index ? 'bg-rose-950/40 border-rose-500/50 text-rose-200' : 'bg-slate-700/50 border-slate-700 opacity-60')) : 
                        'bg-slate-700/50 border-slate-700 hover:bg-slate-700 hover:border-slate-500'}`;
                
                button.innerHTML = `<span><span class="font-bold mr-2 text-blue-400">${String.fromCharCode(65 + index)}.</span> ${opt}</span>`;
                
                if (userAnswers[currentQuestion] === null) {
                    button.onclick = () => selectOption(index);
                } else {
                    button.disabled = true;
                }
                optionsContainer.appendChild(button);
            });

            if (userAnswers[currentQuestion] !== null) {
                showExplanation(userAnswers[currentQuestion] === q.correct, q.explanation);
            } else {
                explanationContainer.classList.add('hidden');
            }

            progressText.textContent = `${currentQuestion + 1} / 90`;
            progressBar.style.width = `${((currentQuestion + 1) / 90) * 100}%`;
            scoreDisplay.textContent = `${score} / 90`;

            prevBtn.disabled = currentQuestion === 0;
            nextBtn.textContent = currentQuestion === questions.length - 1 ? 'Finish →' : 'Next →';
            jumpInput.value = currentQuestion + 1;
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentQuestion] !== null) return;

            userAnswers[currentQuestion] = selectedIndex;
            const q = questions[currentQuestion];
            const isCorrect = selectedIndex === q.correct;

            if (isCorrect) {
                score++;
            }

            scoreDisplay.textContent = `${score} / 90`;
            loadQuestion();
            showExplanation(isCorrect, q.explanation);
        }

        function showExplanation(isCorrect, text) {
            explanationContainer.classList.remove('hidden', 'bg-emerald-950/30', 'border-emerald-500/30', 'bg-rose-950/30', 'border-rose-500/30');
            if (isCorrect) {
                explanationContainer.classList.add('bg-emerald-950/30', 'border-emerald-500/30');
                explanationTitle.innerHTML = '<span class="text-emerald-400 text-base">✅ Correct Answer!</span>';
            } else {
                explanationContainer.classList.add('bg-rose-950/30', 'border-rose-500/30');
                explanationTitle.innerHTML = '<span class="text-rose-400 text-base">❌ Incorrect Answer.</span>';
            }
            explanationText.textContent = text;
        }

        function toggleHint() {
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBtn.textContent = "💡 Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintBtn.textContent = "💡 Show Hint";
            }
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} / 90.`);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value) - 1;
            if (val >= 0 && val < questions.length) {
                currentQuestion = val;
                loadQuestion();
            } else {
                alert("Please enter a valid question number between 1 and 90.");
            }
        }

        // Initialize quiz
        loadQuestion();
    </script>
