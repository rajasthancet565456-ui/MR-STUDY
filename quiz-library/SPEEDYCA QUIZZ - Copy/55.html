        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let timerSeconds = 0;
        let timerInterval = null;

        // DOM Elements
        const questionTracker = document.getElementById('question-tracker');
        const examPatternTag = document.getElementById('exam-pattern-tag');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const explanationContainer = document.getElementById('explanation-container');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const scoreDisplay = document.getElementById('score-display');
        const jumpInput = document.getElementById('jump-input');
        const timerDisplay = document.getElementById('timer-display');

        function startTimer() {
            timerInterval = setInterval(() => {
                timerSeconds++;
                let mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                let secs = (timerSeconds % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `Time: ${mins}:${secs}`;
            }, 1000);
        }

        function loadQuestion(index) {
            const q = quizData[index];
            questionTracker.textContent = `Question ${index + 1} of ${quizData.length}`;
            examPatternTag.textContent = `Pattern: ${q.type}`;
            questionText.textContent = q.q;
            
            // Reset hint & explanation
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            explanationContainer.classList.add('hidden');
            explanationText.textContent = q.explanation;

            // Render options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border border-slate-200 bg-white hover:bg-indigo-50 hover:border-indigo-300 font-medium text-slate-700 text-sm sm:text-base flex items-center justify-between shadow-sm`;
                
                const optionLabel = String.fromCharCode(65 + optIndex); // A, B, C, D
                btn.innerHTML = `<span class="font-bold mr-3 text-indigo-600">${optionLabel}.</span> <span class="flex-1">${opt}</span>`;

                // Check if user already answered this question
                if (userAnswers[index] !== null) {
                    btn.disabled = true;
                    if (optIndex === q.answer) {
                        btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                    } else if (userAnswers[index] === optIndex) {
                        btn.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                    }
                } else {
                    btn.onclick = () => selectOption(index, optIndex);
                }

                optionsContainer.appendChild(btn);
            });

            // Update navigation buttons
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? "Finish / Summary" : "Next";

            // Update progress bar
            const progressPercent = ((index + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
        }

        function selectOption(qIndex, optIndex) {
            if (userAnswers[qIndex] !== null) return; // Already answered

            userAnswers[qIndex] = optIndex;
            const q = quizData[qIndex];
            
            if (optIndex === q.answer) {
                score++;
                scoreDisplay.textContent = `Score: ${score} / ${quizData.length}`;
            }

            // Reveal explanation
            explanationContainer.classList.remove('hidden');

            // Refresh options view to reflect correctness state
            loadQuestion(qIndex);
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            } else {
                showSummary();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion(currentQuestionIndex);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentQuestionIndex = val - 1;
                loadQuestion(currentQuestionIndex);
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function showSummary() {
            clearInterval(timerInterval);
            let mins = Math.floor(timerSeconds / 60);
            let secs = timerSeconds % 60;

            document.querySelector('main').innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl p-8 text-center">
                    <h2 class="text-2xl font-bold text-slate-900 mb-4">Quiz Completed Successfully! 🎉</h2>
                    <p class="text-slate-600 mb-6">Here is a comprehensive summary of your performance in the Current Affairs 2026 Examination Quiz:</p>
                    
                    <div class="inline-block bg-indigo-50 border border-indigo-200 rounded-xl p-6 mb-6 text-left space-y-2">
                        <p class="text-lg font-semibold text-slate-700">Total Questions: <span class="text-indigo-600">${quizData.length}</span></p>
                        <p class="text-lg font-semibold text-slate-700">Correct Answers: <span class="text-emerald-600">${score}</span></p>
                        <p class="text-lg font-semibold text-slate-700">Incorrect / Unanswered: <span class="text-rose-600">${quizData.length - score}</span></p>
                        <p class="text-lg font-semibold text-slate-700">Percentage Score: <span class="text-indigo-600">${((score / quizData.length) * 100).toFixed(2)}%</span></p>
                        <p class="text-lg font-semibold text-slate-700">Total Time Taken: <span class="text-slate-900">${mins} mins ${secs} secs</span></p>
                    </div>

                    <div>
                        <button onclick="location.reload()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow transition">
                            Restart Quiz
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize App on Load
        window.onload = () => {
            loadQuestion(currentQuestionIndex);
            startTimer();
        };
    </script>
