        // State Management
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptionsCache = new Array(quizData.length).fill(null);

        const questionCounterEl = document.getElementById('question-counter');

        const optionsContainerEl = document.getElementById('options-container');

        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const jumpBtn = document.getElementById('jump-btn');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const resetQuizBtn = document.getElementById('reset-quiz-btn');

        // Fisher-Yates Shuffle Utility for options randomization
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize / Load Question
        function loadQuestion(index) {
            const qData = quizData[index];
            questionCounterEl.textContent = `Question ${index + 1} of 90`;
            questionTextEl.textContent = qData.q;
            
            // Hide hint box by default on new question
            hintBoxEl.classList.add('hidden');
            hintBtnText.textContent = "Show Hint";
            hintTextEl.textContent = qData.hint;

            // Generate or retrieve shuffled options
            if (!shuffledOptionsCache[index]) {
                shuffledOptionsCache[index] = shuffleArray(qData.options);
            }
            const currentOptions = shuffledOptionsCache[index];

            // Render Options
            optionsContainerEl.innerHTML = '';
            const selectedAnswer = userAnswers[index];

            currentOptions.forEach((option, optIdx) => {
                const button = document.createElement('button');
                button.className = `w-full text-left p-4 rounded-xl border text-sm font-medium transition-all flex items-center justify-between shadow-sm ${
                    selectedAnswer !== null 
                        ? (option === qData.correct 
                            ? 'bg-emerald-950/60 border-emerald-500/80 text-emerald-200' 
                            : (selectedAnswer === option 
                                ? 'bg-rose-950/60 border-rose-500/80 text-rose-200' 
                                : 'bg-slate-900/60 border-slate-700/80 text-slate-400 opacity-60'))
                        : 'bg-slate-900 hover:bg-slate-700/70 border-slate-700 hover:border-slate-500 text-slate-200'
                }`;
                
                button.innerHTML = `
                    <span><strong class="text-cyan-400 mr-2">${String.fromCharCode(65 + optIdx)}.</strong> ${option}</span>
                    ${selectedAnswer !== null && option === qData.correct ? '<span class="text-emerald-400 text-xs font-bold bg-emerald-900/50 px-2 py-0.5 rounded border border-emerald-700">Correct Answer</span>' : ''}
                    ${selectedAnswer !== null && selectedAnswer === option && option !== qData.correct ? '<span class="text-rose-400 text-xs font-bold bg-rose-900/50 px-2 py-0.5 rounded border border-rose-700">Your Choice</span>' : ''}
                `;

                if (selectedAnswer === null) {
                    button.addEventListener('click', () => selectOption(option, qData));
                } else {
                    button.disabled = true;
                }

                optionsContainerEl.appendChild(button);
            });

            // Render Explanation if answered
            if (selectedAnswer !== null) {
                showExplanationBox(selectedAnswer === qData.correct, qData.explanation);
            } else {
                explanationBoxEl.classList.add('hidden');
            }

            // Update Nav Controls
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? 'Finish Quiz' : 'Next →';
            jumpInput.value = index + 1;
            progressBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
        }

        // Handle Option Selection
        function selectOption(selectedOption, qData) {
            userAnswers[currentQuestionIndex] = selectedOption;
            
            const isCorrect = selectedOption === qData.correct;
            if (isCorrect) {
                score++;
                scoreDisplay.textContent = `${score} / 90`;
            }

            loadQuestion(currentQuestionIndex);
        }

        // Show Explanation Box
        function showExplanationBox(isCorrect, explanation) {
            explanationBoxEl.classList.remove('hidden');
            if (isCorrect) {
                explanationBoxEl.className = "mt-6 p-4 rounded-xl border bg-emerald-950/40 border-emerald-800/80 text-emerald-200 text-sm transition-all duration-300";
                explanationTitleEl.innerHTML = `✅ Correct! Excellent exam preparation.`;
            } else {
                explanationBoxEl.className = "mt-6 p-4 rounded-xl border bg-rose-950/40 border-rose-800/80 text-rose-200 text-sm transition-all duration-300";
                explanationTitleEl.innerHTML = `❌ Incorrect. Review the rationale below:`;
            }
            explanationTextEl.textContent = explanation;
        }

        // Toggle Hint Visibility
        toggleHintBtn.addEventListener('click', () => {
            const isHidden = hintBoxEl.classList.contains('hidden');
            if (isHidden) {
                hintBoxEl.classList.remove('hidden');
                hintBtnText.textContent = "Hide Hint";
            } else {
                hintBoxEl.classList.add('hidden');
                hintBtnText.textContent = "Show Hint";
            }
        });

        // Navigation Button Listeners
        prevBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion(currentQuestionIndex);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            } else {
                alert(`Quiz Completed! Final Score: ${score} / 90 (${((score/90)*100).toFixed(1)}%)`);
            }
        });

        jumpBtn.addEventListener('click', () => {
            const target = parseInt(jumpInput.value) - 1;
            if (target >= 0 && target < quizData.length) {
                currentQuestionIndex = target;
                loadQuestion(currentQuestionIndex);
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}.`);
            }
        });

        jumpInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                jumpBtn.click();
            }
        });

        // Reset Quiz Listener
        resetQuizBtn.addEventListener('click', () => {
            if (confirm("Are you sure you want to reset your quiz progress and start over?")) {
                currentQuestionIndex = 0;
                score = 0;
                userAnswers = new Array(quizData.length).fill(null);
                shuffledOptionsCache = new Array(quizData.length).fill(null);
                scoreDisplay.textContent = `0 / 90`;
                loadQuestion(0);
            }
        });

        // Initial Load
        loadQuestion(0);
    </script>
