        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptionsCache = {};

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const scoreDisplay = document.getElementById('score-display');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const pageBadge = document.getElementById('page-badge');
        const qNumberBadge = document.getElementById('q-number-badge');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion(index) {
            const qData = quizData[index];
            qNumberBadge.textContent = `Question ${index + 1} of ${quizData.length}`;
            pageBadge.textContent = qData.page;
            questionText.textContent = qData.q;
            hintBox.textContent = qData.hint;
            hintBox.classList.add('hidden');
            explanationBox.classList.add('hidden');

            // Generate or retrieve randomized options to keep order consistent during review
            if (!shuffledOptionsCache[index]) {
                let optionsWithIndex = qData.options.map((opt, i) => ({ text: opt, originalIndex: i }));
                // Shuffle without modulo/while loops
                for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
                }
                shuffledOptionsCache[index] = optionsWithIndex;
            }

            const currentShuffled = shuffledOptionsCache[index];
            optionsContainer.innerHTML = '';

            currentShuffled.forEach((item) => {
                const button = document.createElement('button');
                button.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 font-medium transition flex items-center justify-between group";
                button.innerHTML = `<span>${item.text}</span>`;
                
                const selectedAnswer = userAnswers[index];
                if (selectedAnswer !== null) {
                    button.disabled = true;
                    if (item.originalIndex === qData.correct) {
                        button.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-900');
                    } else if (selectedAnswer === item.originalIndex) {
                        button.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-900');
                    }
                } else {
                    button.onclick = () => selectOption(item.originalIndex, qData.correct, index);
                }
                optionsContainer.appendChild(button);
            });

            if (userAnswers[index] !== null) {
                explanationText.textContent = qData.explanation;
                explanationBox.classList.remove('hidden');
            }

            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? "Finish Quiz" : "Next →";
            
            // Update Progress
            const progressPercent = ((index + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
            progressText.textContent = `Q ${index + 1} of ${quizData.length}`;
            scoreDisplay.textContent = `Score: ${score} / ${quizData.length}`;
        }

        function selectOption(selectedIndex, correctIndex, index) {
            userAnswers[index] = selectedIndex;
            if (selectedIndex === correctIndex) {
                score++;
            }
            loadQuestion(index);
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                showCompletionScreen();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function jumpToQuestion() {
            const target = parseInt(jumpInput.value) - 1;
            if (target >= 0 && target < quizData.length) {
                currentIndex = target;
                loadQuestion(currentIndex);
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function showCompletionScreen() {
            const card = document.getElementById('quiz-card');
            const percentage = Math.round((score / quizData.length) * 100);
            card.innerHTML = `
                <div class="text-center py-8">
                    <h2 class="text-3xl font-bold text-slate-900 mb-4">Quiz Completed! 🎉</h2>
                    <p class="text-lg text-slate-600 mb-6">You have successfully answered all 90 exam-level questions.</p>
                    <div class="inline-block bg-indigo-50 border border-indigo-200 rounded-2xl p-6 mb-6">
                        <span class="block text-sm text-indigo-600 font-semibold uppercase tracking-wider mb-1">Final Score</span>
                        <span class="text-4xl font-extrabold text-indigo-700">${score} / ${quizData.length}</span>
                        <span class="block text-sm text-slate-500 mt-2">Accuracy: ${percentage}%</span>
                    </div>
                    <div>
                        <button onclick="resetQuiz()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-md">
                            Restart Quiz
                        </button>
                    </div>
                </div>
            `;
            progressBar.style.width = '100%';
        }

        function resetQuiz() {
            currentIndex = 0;
            score = 0;
            userAnswers = new Array(quizData.length).fill(null);
            shuffledOptionsCache = {};
            location.reload();
        }

        // Initialize first question on load
        window.onload = () => {
            loadQuestion(currentIndex);
        };
