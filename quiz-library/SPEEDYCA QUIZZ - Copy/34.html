        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const explanationContainer = document.getElementById("explanation-container");
        const explanationText = document.getElementById("explanation-text");
        const questionCounter = document.getElementById("question-counter");
        const scoreDisplay = document.getElementById("score-display");
        const progressBar = document.getElementById("progress-bar");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const jumpInput = document.getElementById("jump-input");
        const hintBox = document.getElementById("hint-box");
        const hintText = document.getElementById("hint-text");

        function loadQuestion() {
            const q = quizData[currentQuestion];
            questionCounter.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
            questionText.textContent = q.q;
            
            // Hint setup
            hintText.textContent = q.hint;
            hintBox.classList.add("hidden");

            // Render options
            optionsContainer.innerHTML = "";
            q.options.forEach((opt, index) => {
                const button = document.createElement("button");
                button.textContent = opt;
                button.className = "w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700/80 transition font-medium text-sm text-slate-200 flex items-center justify-between";
                
                // Check if already answered
                if (userAnswers[currentQuestion] !== null) {
                    button.disabled = true;
                    if (index === q.correct) {
                        button.classList.add("bg-emerald-950/40", "border-emerald-600", "text-emerald-200");
                    } else if (index === userAnswers[currentQuestion]) {
                        button.classList.add("bg-rose-950/40", "border-rose-600", "text-rose-200");
                    }
                } else {
                    button.onclick = () => selectAnswer(index);
                }

                optionsContainer.appendChild(button);
            });

            // Explanation visibility
            if (userAnswers[currentQuestion] !== null) {
                explanationText.textContent = q.explanation;
                explanationContainer.classList.remove("hidden");
            } else {
                explanationContainer.classList.add("hidden");
            }

            // Controls state
            prevBtn.disabled = currentQuestion === 0;
            nextBtn.textContent = currentQuestion === quizData.length - 1 ? "Finish" : "Next";
            
            // Progress update
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            progressBar.style.width = `${progress}%`;
            scoreDisplay.textContent = score;
        }

        function selectAnswer(selectedIndex) {
            const q = quizData[currentQuestion];
            userAnswers[currentQuestion] = selectedIndex;

            if (selectedIndex === q.correct) {
                score++;
            }

            loadQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                alert(`Quiz completed! Your final score is ${score} out of ${quizData.length}.`);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentQuestion = val - 1;
                loadQuestion();
                jumpInput.value = "";
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function toggleHint() {
            hintBox.classList.toggle("hidden");
        }

        // Initialize Quiz
        loadQuestion();
    </script>
