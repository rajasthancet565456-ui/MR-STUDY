                question: "What is the health insurance coverage limit per family under Punjab's 'Mukhyamantri Sehat Yojana'?",
                options: ["Rs 10 Lakh", "Rs 5 Lakh", "Rs 15 Lakh", "Rs 2 Lakh"],
                answer: "Rs 10 Lakh",
                hint: "Ten lakh rupees free coverage.",
                explanation: "Punjab's Mukhyamantri Sehat Yojana provides medical coverage up to Rs 10 lakh per family."
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let answeredQuestions = new Array(quizData.length).fill(false);
        let currentOptionsOrder = [];

        const questionBadge = document.getElementById('question-badge');
        const pageBadge = document.getElementById('page-badge');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const hintToggleText = document.getElementById('hint-toggle-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const scoreDisplay = document.getElementById('score');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentIdx];
            questionBadge.innerText = `Question ${currentIdx + 1} of ${quizData.length}`;
            pageBadge.innerText = q.page;
            questionText.innerText = q.question;
            jumpInput.value = currentIdx + 1;

            // Reset hint
            hintBox.classList.add('hidden');
            hintToggleText.innerText = "Show Hint";
            hintBox.innerText = q.hint;

            // Handle options randomization if not already shuffled for this session
            if (!q.shuffledOptions) {
                let opts = [...q.options];
                // Shuffle array
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                q.shuffledOptions = opts;
            }

            optionsContainer.innerHTML = '';
            q.shuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-700/30 hover:bg-slate-700/70 transition-all text-slate-200 text-sm sm:text-base font-medium flex items-center justify-between group";
                
                const spanText = document.createElement('span');
                spanText.innerText = opt;
                btn.appendChild(spanText);

                const letterSpan = document.createElement('span');
                letterSpan.className = "text-xs font-semibold px-2 py-1 rounded bg-slate-800 text-slate-400 group-hover:text-slate-200";
                letterSpan.innerText = String.fromCharCode(65 + idx);
                btn.appendChild(letterSpan);

                // If already answered
                if (answeredQuestions[currentIdx]) {
                    btn.disabled = true;
                    if (opt === q.answer) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-500/20 text-emerald-200 text-sm sm:text-base font-medium flex items-center justify-between";
                    } else if (userAnswers[currentIdx] === opt) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-500/20 text-rose-200 text-sm sm:text-base font-medium flex items-center justify-between";
                    } else {
                        btn.className = "w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-800/50 opacity-50 text-slate-400 text-sm sm:text-base font-medium flex items-center justify-between";
                    }
                } else {
                    btn.onclick = () => selectOption(opt, btn);
                }

                optionsContainer.appendChild(btn);
            });

            // Explanation handling
            if (answeredQuestions[currentIdx]) {
                explanationBox.classList.remove('hidden');
                explanationText.innerText = q.explanation;
            } else {
                explanationBox.classList.add('hidden');
            }

            // Buttons state
            prevBtn.disabled = currentIdx === 0;
            nextBtn.innerText = currentIdx === quizData.length - 1 ? "Finish" : "Next";

            updateProgress();
        }

        function selectOption(selectedOpt, btnElement) {
            if (answeredQuestions[currentIdx]) return;
            answeredQuestions[currentIdx] = true;
            userAnswers[currentIdx] = selectedOpt;

            const q = quizData[currentIdx];
            const isCorrect = selectedOpt === q.answer;

            if (isCorrect) {
                score++;
                scoreDisplay.innerText = score;
                btnElement.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-500/20 text-emerald-200 text-sm sm:text-base font-medium flex items-center justify-between";
            } else {
                btnElement.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-500/20 text-rose-200 text-sm sm:text-base font-medium flex items-center justify-between";
                // Highlight correct one
                const allBtns = optionsContainer.getElementsByTagName('button');
                for (let b of allBtns) {
                    if (b.firstChild.innerText === q.answer) {
                        b.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-500/20 text-emerald-200 text-sm sm:text-base font-medium flex items-center justify-between";
                    }
                }
            }

            // Disable all option buttons
            const allBtns = optionsContainer.getElementsByTagName('button');
            for (let b of allBtns) {
                b.disabled = true;
                if (b.firstChild.innerText !== q.answer && b.firstChild.innerText !== selectedOpt) {
                    b.classList.add('opacity-50');
                }
            }

            // Show explanation
            explanationBox.classList.remove('hidden');
            explanationText.innerText = q.explanation;

            updateProgress();
        }

        function toggleHint() {
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintToggleText.innerText = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintToggleText.innerText = "Show Hint";
            }
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                // Quiz completed view
                showCompletionScreen();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            const num = parseInt(val);
            if (num >= 1 && num <= quizData.length) {
                currentIdx = num - 1;
                loadQuestion();
            } else {
                jumpInput.value = currentIdx + 1;
            }
        }

        function updateProgress() {
            const answeredCount = answeredQuestions.filter(Boolean).length;
            const pct = Math.round((answeredCount / quizData.length) * 100);
            progressText.innerText = `${pct}%`;
            progressBar.style.width = `${pct}%`;
        }

        function showCompletionScreen() {
            const quizCard = document.getElementById('quiz-card');
            quizCard.innerHTML = `
                <div class="text-center py-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full mb-4 border border-emerald-500/30">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-100 mb-2">Quiz Completed Successfully!</h2>
                    <p class="text-slate-400 text-sm mb-6">You have completed all 90 exam-level questions from Pages 31 & 32.</p>
                    <div class="bg-slate-700/40 border border-slate-600 rounded-xl p-6 max-w-sm mx-auto mb-8">
                        <div class="text-sm text-slate-400 mb-1">Final Score</div>
                        <div class="text-4xl font-extrabold text-indigo-400">${score} <span class="text-xl text-slate-500">/ 90</span></div>
                        <div class="text-xs text-emerald-400 mt-2 font-medium">Percentage: ${Math.round((score/90)*100)}%</div>
                    </div>
                    <button onclick="location.reload()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition-colors shadow-lg">Restart Quiz</button>
                </div>
            `;
        }

        // Initialize first question on load
        window.onload = loadQuestion;
    </script>
<script src="../../quiz-question-controls.js"></script>
<script src="../../quiz-app-ui-v2.js"></script></body>
