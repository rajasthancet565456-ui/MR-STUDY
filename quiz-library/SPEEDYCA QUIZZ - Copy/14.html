        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let answeredQuestions = new Array(questions.length).fill(false);

        const questionSourceEl = document.getElementById('question-source');
        const currentQNumEl = document.getElementById('current-q-num');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const hintBoxEl = document.getElementById('hint-box');
        const hintBtnTextEl = document.getElementById('hint-btn-text');
        const explanationBoxEl = document.getElementById('explanation-box');
        const explanationTextEl = document.getElementById('explanation-text');
        const progressBarEl = document.getElementById('progress-bar');
        const scoreEl = document.getElementById('score');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = questions[currentIndex];
            questionSourceEl.textContent = q.page;
            currentQNumEl.textContent = currentIndex + 1;
            questionTextEl.textContent = q.question;

            // Reset Hint & Explanation
            hintBoxEl.classList.add('hidden');
            hintBoxEl.textContent = q.hint;
            hintBtnTextEl.textContent = "Show Hint";
            
            if (answeredQuestions[currentIndex]) {
                explanationBoxEl.classList.remove('hidden');
                explanationTextEl.textContent = q.explanation;
            } else {
                explanationBoxEl.classList.add('hidden');
            }

            // Render Options
            optionsContainerEl.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl font-medium text-sm sm:text-base border transition flex justify-between items-center ${getOptionStyle(idx, q.answer)}`;
                btn.innerHTML = `<span><span class="font-bold mr-2 text-slate-400">${String.fromCharCode(65 + idx)}.</span> ${opt}</span>`;
                
                if (answeredQuestions[currentIndex]) {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => selectOption(idx);
                }
                optionsContainerEl.appendChild(btn);
            });

            // Update Progress & Navigation
            progressBarEl.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
            scoreEl.textContent = score;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === questions.length - 1 ? "Finish" : "Next";
        }

        function getOptionStyle(optIdx, correctIdx) {
            if (!answeredQuestions[currentIndex]) {
                return "bg-slate-900 border-slate-700 hover:border-emerald-500 hover:bg-slate-800 text-slate-200";
            }
            if (optIdx === correctIdx) {
                return "bg-emerald-950/60 border-emerald-500 text-emerald-200 font-semibold";
            }
            if (userAnswers[currentIndex] === optIdx && optIdx !== correctIdx) {
                return "bg-rose-950/60 border-rose-500 text-rose-200";
            }
            return "bg-slate-900 border-slate-800 text-slate-500 opacity-60";
        }

        function selectOption(selectedIdx) {
            if (answeredQuestions[currentIndex]) return;
            
            answeredQuestions[currentIndex] = true;
            userAnswers[currentIndex] = selectedIdx;

            if (selectedIdx === questions[currentIndex].answer) {
                score++;
            }

            scoreEl.textContent = score;
            explanationTextEl.textContent = questions[currentIndex].explanation;
            explanationBoxEl.classList.remove('hidden');

            loadQuestion();
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of 90.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const qNum = parseInt(jumpInput.value);
            if (qNum >= 1 && qNum <= questions.length) {
                currentIndex = qNum - 1;
                jumpInput.value = '';
                loadQuestion();
            } else {
                alert("Please enter a valid question number between 1 and 90.");
            }
        }

        function toggleHint() {
            if (hintBoxEl.classList.contains('hidden')) {
                hintBoxEl.classList.remove('hidden');
                hintBtnTextEl.textContent = "Hide Hint";
            } else {
                hintBoxEl.classList.add('hidden');
                hintBtnTextEl.textContent = "Show Hint";
            }
        }

        function resetQuiz() {
            if (confirm("Are you sure you want to reset the quiz? All progress will be lost.")) {
                currentIndex = 0;
                score = 0;
                userAnswers = new Array(questions.length).fill(null);
                answeredQuestions = new Array(questions.length).fill(false);
                loadQuestion();
            }
        }

        // Initialize Quiz on Load
        window.onload = loadQuestion;
    </script>
