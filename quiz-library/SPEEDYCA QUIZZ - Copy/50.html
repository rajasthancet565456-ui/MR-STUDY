        function startTimer() {
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `Time: ${mins}:${secs}`;
            }, 1000);
        }

        // Shuffle options to randomize answer position
        function getShuffledOptions(item) {
            const optionsWithIndex = item.options.map((opt, idx) => ({ opt, originalIndex: idx }));
            // Shuffle array
            for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
            }
            return {
                shuffledOpts: optionsWithIndex.map(x => x.opt),
                newCorrectIndex: optionsWithIndex.findIndex(x => x.originalIndex === item.correct)
            };
        }

        const quizData = rawQuizData.map(item => {

                correct: newCorrectIndex
            };
        });

            if (selectedIndex === qData.correct) {
                score++;
                scoreDisplay.textContent = `Score: ${score} / ${quizData.length}`;
            }

            showExplanation(currentQuestion);
        }

        function showExplanation(index) {
            const qData = quizData[index];
            const selectedAns = userAnswers[index];
            const isCorrect = selectedAns === qData.correct;

            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "p-4 rounded-xl text-sm border bg-emerald-50 border-emerald-200 text-emerald-900";
                explanationBox.innerHTML = `<strong>Correct!</strong> ${qData.exp}`;
            } else {
                explanationBox.className = "p-4 rounded-xl text-sm border bg-rose-50 border-rose-200 text-rose-900";
                explanationBox.innerHTML = `<strong>Incorrect.</strong> ${qData.exp}`;
            }
        }

        hintToggle.onclick = () => {
            hintBox.classList.toggle('hidden');
        };

        nextBtn.onclick = () => {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion(currentQuestion);
            } else {
                showResults();
            }
        };

        prevBtn.onclick = () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion(currentQuestion);
            }
        };

        jumpBtn.onclick = () => {
            const val = parseInt(jumpInput.value) - 1;
            if (val >= 0 && val < quizData.length) {
                currentQuestion = val;
                loadQuestion(currentQuestion);
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        };

        function showResults() {
            clearInterval(timerInterval);
            const percentage = Math.round((score / quizData.length) * 100);
            let feedback = percentage >= 80 ? "Outstanding preparation for Indian Competitive Exams!" : percentage >= 50 ? "Good effort, revise the explanations to sharpen your score." : "Needs more revision. Go through the current affairs modules thoroughly.";

            document.getElementById('quiz-box').innerHTML = `
                <div class="text-center py-8">
                    <h2 class="text-3xl font-bold text-slate-900 mb-2">Quiz Completed! 🎉</h2>
                    <p class="text-slate-600 mb-6">${feedback}</p>
                    <div class="inline-block p-6 bg-indigo-50 rounded-2xl border border-indigo-100 mb-6">
                        <div class="text-4xl font-extrabold text-indigo-600 mb-1">${score} / ${quizData.length}</div>
                        <div class="text-sm font-semibold text-slate-700">Final Score (${percentage}%)</div>
                    </div>
                    <div>
                        <button onclick="location.reload()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-medium hover:bg-indigo-700 transition shadow-md">
                            Restart Quiz
                        </button>
                    </div>
                </div>
            `;
            document.querySelector('.flex.justify-between.items-center.mt-6').style.display = 'none';
        }

        // Initialize Quiz
        startTimer();
        loadQuestion(currentQuestion);
    </script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
