<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedy Current Affairs August 2026 - Pages 97 & 98 Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style id="cosmic-readable-quiz-theme">
:root{--space:#e8dcff;--panel:#f3eaff;--panel2:#dcc6ff;--edge:#6a45bf;--glow:#d28b28;--accent:#d15f9f;--ink:#2c1b4d;--muted:#66547c;--mist:rgba(106,69,191,.2)}html{background:var(--space)}body{background:radial-gradient(ellipse 62% 45% at 90% -5%,rgba(209,95,159,.28),transparent 62%),radial-gradient(ellipse 55% 40% at 8% 100%,rgba(65,164,207,.26),transparent 64%),var(--space)!important;color:var(--ink)!important;min-height:100vh}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.78;background-image:radial-gradient(circle at 9% 18%,var(--glow) 0 1px,transparent 1.7px),radial-gradient(circle at 26% 69%,var(--edge) 0 .8px,transparent 1.5px),radial-gradient(circle at 68% 24%,var(--accent) 0 1px,transparent 1.8px),radial-gradient(circle at 88% 73%,#47a8d3 0 .8px,transparent 1.5px);background-size:220px 190px,300px 270px,260px 230px,340px 310px;z-index:-1}header{background:linear-gradient(105deg,var(--panel),var(--panel2))!important;border-color:rgba(106,69,191,.25)!important;box-shadow:0 7px 24px rgba(84,48,142,.14)!important}header h1{color:var(--edge)!important;text-shadow:none!important}header p,header .text-slate-400,header .text-indigo-200,header .text-indigo-300{color:var(--muted)!important}main>div,#quiz-card,.bg-slate-800,.bg-slate-900,.bg-indigo-900,.bg-indigo-950{background:linear-gradient(145deg,#f8f0ff,var(--panel))!important;border-color:rgba(106,69,191,.22)!important;color:var(--ink)!important;box-shadow:0 14px 35px rgba(84,48,142,.12)!important}.bg-slate-700,.bg-slate-100,.bg-slate-50{background:#eadffd!important;color:var(--ink)!important}.text-slate-100,.text-slate-200,.text-slate-300,.text-slate-400,.text-white,.text-slate-800,.text-slate-700,.text-slate-600{color:var(--ink)!important}.text-indigo-400,.text-indigo-300,.text-emerald-400,.text-yellow-300{color:var(--edge)!important}.border-slate-700,.border-slate-700\/60,.border-indigo-700,.border-slate-200{border-color:rgba(106,69,191,.25)!important}button:not(.bg-green-600):not(.bg-red-600){background:#f9f2ff!important;color:var(--ink)!important;border:1px solid rgba(106,69,191,.25)!important;box-shadow:0 3px 10px rgba(84,48,142,.09)!important}button.bg-indigo-600,button.bg-slate-800,button.bg-slate-900,button.bg-indigo-900{background:linear-gradient(120deg,var(--edge),var(--accent))!important;color:#fff!important;border:0!important}button.bg-indigo-600 *,button.bg-slate-800 *,button.bg-slate-900 *,button.bg-indigo-900 *{color:#fff!important}button:hover{filter:brightness(1.04);transform:translateY(-1px)}input,select,textarea{background:#f9f2ff!important;border-color:rgba(106,69,191,.35)!important;color:var(--ink)!important}input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--edge)!important;box-shadow:0 0 0 3px var(--mist)!important}.bg-indigo-500,#progress-bar{background:linear-gradient(90deg,var(--edge),var(--accent),var(--glow))!important}.rounded-2xl{border-radius:1.25rem!important}
</style></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between" x-data="quizApp()">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Current Affairs Master Quiz</h1>
                <p class="text-xs text-indigo-200">Speedy CA August 2026 | Pages 97 & 98 (90 Exam-Level Questions)</p>
            </div>
            <div class="flex items-center gap-4 bg-indigo-800 px-4 py-2 rounded-lg text-sm">
                <div>Score: <span class="font-bold text-yellow-300" x-text="score"></span>/<span x-text="questions.length"></span></div>
                <div>|</div>
                <div>Progress: <span class="font-bold text-emerald-300" x-text="Math.round(((currentIndex + 1) / questions.length) * 100)"></span>%</div>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="w-full bg-indigo-900 h-1.5 mt-3 max-w-4xl mx-auto rounded-full overflow-hidden">
            <div class="bg-yellow-400 h-full transition-all duration-300" :style="`width: ${((currentIndex + 1) / questions.length) * 100}%`"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl w-full mx-auto px-4 py-8 flex-grow">

        <!-- Quiz Screen -->
        <template x-if="!quizFinished">
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-8 transition-all">
                
                <!-- Question Meta Header -->
                <div class="flex justify-between items-center text-xs text-slate-500 font-medium mb-3 uppercase tracking-wider">
                    <span>Question <span x-text="currentIndex + 1"></span> of <span x-text="questions.length"></span></span>
                    <div class="flex gap-1">
                        <template x-for="tag in currentQuestion.tags">
                            <span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded text-[10px] font-semibold" x-text="tag"></span>
                        </template>
                    </div>
                </div>

                <!-- Question Text -->
                <h2 class="text-lg sm:text-xl font-semibold text-slate-900 mb-6 leading-relaxed" x-text="currentQuestion.question"></h2>

                <!-- Answer Options -->
                <div class="space-y-3 mb-6">
                    <template x-for="(option, index) in shuffledOptions" :key="index">
                        <button 
                            @click="selectOption(option)"
                            :disabled="isAnswered"
                            :class="{
                                'border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 text-slate-700': !isAnswered,
                                'border-emerald-500 bg-emerald-50 text-emerald-900 font-medium': isAnswered && option.isCorrect,
                                'border-rose-300 bg-rose-50 text-rose-900': isAnswered && selectedOption === option && !option.isCorrect,
                                'border-slate-200 opacity-60 text-slate-500': isAnswered && !option.isCorrect && selectedOption !== option
                            }"
                            class="w-full text-left p-4 rounded-xl border-2 transition-all flex items-center justify-between text-sm sm:text-base shadow-sm">
                            <div class="flex items-center gap-3">
                                <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold uppercase"
                                    :class="{
                                        'bg-slate-100 text-slate-600': !isAnswered,
                                        'bg-emerald-600 text-white': isAnswered && option.isCorrect,
                                        'bg-rose-600 text-white': isAnswered && selectedOption === option && !option.isCorrect,
                                        'bg-slate-200 text-slate-500': isAnswered && !option.isCorrect && selectedOption !== option
                                    }"
                                    x-text="String.fromCharCode(65 + index)"></span>
                                <span x-text="option.text"></span>
                            </div>
                            <template x-if="isAnswered && option.isCorrect">
                                <span class="text-emerald-600 text-xs font-bold uppercase tracking-wider bg-emerald-100 px-2.5 py-1 rounded-full">Correct</span>
                            </template>
                            <template x-if="isAnswered && selectedOption === option && !option.isCorrect">
                                <span class="text-rose-600 text-xs font-bold uppercase tracking-wider bg-rose-100 px-2.5 py-1 rounded-full">Your Choice</span>
                            </template>
                        </button>
                    </template>
                </div>

                <!-- Hint Section -->
                <div class="mb-6" x-show="currentQuestion.hint">
                    <button @click="showHint = !showHint" class="text-xs font-medium text-amber-600 hover:text-amber-700 flex items-center gap-1.5 focus:outline-none">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span x-text="showHint ? 'Hide Hint' : 'Need a Hint?'"></span>
                    </button>
                    <div x-show="showHint" x-transition class="mt-2 p-3 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-800" x-text="currentQuestion.hint"></div>
                </div>

                <!-- Rationale Box (Revealed upon answering) -->
                <div x-show="isAnswered" x-transition class="mb-6 p-4 rounded-xl bg-indigo-50 border border-indigo-100 text-sm text-indigo-950">
                    <h4 class="font-bold text-xs uppercase tracking-wider text-indigo-700 mb-1">Explanation / Rationale</h4>
                    <p x-text="selectedOption ? selectedOption.rationale : currentQuestion.answerOptions.find(o => o.isCorrect).rationale"></p>
                </div>

                <!-- Navigation Controls -->
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-100">
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <span class="text-xs text-slate-500">Jump to Q#:</span>
                        <input type="number" min="1" :max="questions.length" @keyup.enter="jumpToQuestion($event.target.value)" placeholder="1-90" class="w-20 px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div class="flex gap-3 w-full sm:w-auto justify-end">
                        <button @click="prevQuestion()" :disabled="currentIndex === 0" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-medium text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">Previous</button>
                        <button @click="nextQuestion()" x-show="isAnswered && currentIndex < questions.length - 1" class="px-6 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 shadow-md">Next Question</button>
                        <button @click="finishQuiz()" x-show="isAnswered && currentIndex === questions.length - 1" class="px-6 py-2 bg-emerald-600 text-white rounded-xl text-sm font-medium hover:bg-emerald-700 shadow-md">View Results</button>
                    </div>
                </div>

            </div>
        </template>

        <!-- Completion Screen -->
        <template x-if="quizFinished">
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">🎉</div>
                <h2 class="text-2xl font-bold text-slate-900 mb-2">Quiz Completed Successfully!</h2>
                <p class="text-slate-600 mb-6 text-sm">You have completed all 90 exam-level current affairs questions from pages 97 and 98.</p>
                
                <div class="bg-indigo-50 border border-indigo-100 p-6 rounded-xl max-w-sm mx-auto mb-8">
                    <div class="text-xs uppercase tracking-wider text-indigo-600 font-bold mb-1">Your Final Score</div>
                    <div class="text-4xl font-extrabold text-indigo-900"><span x-text="score"></span> / <span x-text="questions.length"></span></div>
                    <div class="text-xs text-slate-500 mt-2">Accuracy: <span x-text="Math.round((score / questions.length) * 100)"></span>%</div>
                </div>

                <button @click="restartQuiz()" class="px-8 py-3 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 shadow-md transition-all">Retake Quiz</button>
            </div>
        </template>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-8">
        <p>Speedy Current Affairs August 2026 Interactive Preparation Tool — Designed for Indian Competitive Exams (SSC, RRB, PCS)</p>
    </footer>

    <!-- Alpine.js Application Logic -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('quizApp', () => ({
                questions: [
                    {
                        "questionNumber": 1,
                        "question": "Which state's cabinet approved the 'Mukhyamantri Mawan Dhiyan Satkar Yojana' on April 2, 2026?",
                        "answerOptions": [
                            {"text": "Punjab", "isCorrect": true, "rationale": "The Punjab government cabinet approved the 'Mukhyamantri Mawan Dhiyan Satkar Yojana' on April 2, 2026."},
                            {"text": "Haryana", "isCorrect": false, "rationale": "Haryana is a neighboring state but did not launch this specific maternal welfare initiative."},
                            {"text": "Himachal Pradesh", "isCorrect": false, "rationale": "Himachal Pradesh launched separate welfare schemes during this period, not this exact scheme."},
                            {"text": "Uttar Pradesh", "isCorrect": false, "rationale": "Uttar Pradesh was not the state that approved this scheme."}
                        ],
                        "hint": "This state government is known for introducing various cultural and familial welfare initiatives in early 2026.",
                        "tags": ["Current Affairs", "State Schemes", "Punjab"]
                    },
                    {
                        "questionNumber": 2,
                        "question": "According to Energy Statistics India 2026, which state secured the first position in renewable energy?",
                        "answerOptions": [
                            {"text": "Rajasthan", "isCorrect": true, "rationale": "Rajasthan secured the first position in renewable energy according to Energy Statistics India 2026."},
                            {"text": "Gujarat", "isCorrect": false, "rationale": "While Gujarat leads in several clean energy metrics, Rajasthan topped this specific Energy Statistics report."},
                            {"text": "Tamil Nadu", "isCorrect": false, "rationale": "Tamil Nadu ranks high in wind and solar power but did not top this specific index."},
                            {"text": "Karnataka", "isCorrect": false, "rationale": "Karnataka has robust solar installations but is not the top-ranked state in this report."}
                        ],
                        "hint": "This desert-abundant state leads the country in solar capacity installations.",
                        "tags": ["Energy Statistics", "Rajasthan", "Renewable Energy"]
                    },
                    {
                        "questionNumber": 3,
                        "question": "Which country started the world's first digital census?",
                        "answerOptions": [
                            {"text": "India", "isCorrect": true, "rationale": "India initiated the world's first digital census as part of its modern administrative overhaul."},
                            {"text": "Singapore", "isCorrect": false, "rationale": "Singapore uses advanced digital tools for administration, but India pioneered this scale of digital census."},
                            {"text": "Estonia", "isCorrect": false, "rationale": "Estonia is a digital leader, but the specific mention in the report refers to India."},
                            {"text": "South Korea", "isCorrect": false, "rationale": "South Korea has high digital penetration but was not noted for this historical digital census first."}
                        ],
                        "hint": "Think of the country undertaking massive digital governance transformations heading into 2026.",
                        "tags": ["Census", "Digital Governance", "India"]
                    },
                    {
                        "questionNumber": 4,
                        "question": "What scheme was launched by the Indian government to provide assistance to Himalayan states?",
                        "answerOptions": [
                            {"text": "Praid of Hills", "isCorrect": true, "rationale": "The Indian government launched the 'Pride of Hills' scheme to provide targeted assistance and support to Himalayan states."},
                            {"text": "Himalayan Vikas Abhiyan", "isCorrect": false, "rationale": "This is a plausible sounding alternative, but the official scheme name listed is Pride of Hills."},
                            {"text": "Parvat Mala Mission", "isCorrect": false, "rationale": "Parvat Mala is focused on ropeway development, whereas Pride of Hills focuses on broader state assistance."},
                            {"text": "North-East Special Grant", "isCorrect": false, "rationale": "This targets the Northeast broadly rather than the specific Himalayan state assistance program."}
                        ],
                        "hint": "The scheme's name translates directly to pride associated with mountainous terrains.",
                        "tags": ["Himalayan States", "Government Schemes", "Pride of Hills"]
                    },
                    {
                        "questionNumber": 5,
                        "question": "Which police forces were honored with the prestigious 'Presidents Police Color 2026'?",
                        "answerOptions": [
                            {"text": "Odisha and Uttarakhand Police", "isCorrect": true, "rationale": "Odisha and Uttarakhand Police were awarded the Presidents Police Color 2026 for exceptional service."},
                            {"text": "Maharashtra and Kerala Police", "isCorrect": false, "rationale": "These states received other accolades, but not this specific joint police color award."},
                            {"text": "Uttar Pradesh and Bihar Police", "isCorrect": false, "rationale": "Neither of these police forces received the Presidents Police Color 2026 in this announcement."},
                            {"text": "Tamil Nadu and Karnataka Police", "isCorrect": false, "rationale": "This pair was not the recipient of this honor."}
                        ],
                        "hint": "One is an eastern coastal state and the other is a northern hill state.",
                        "tags": ["Police Awards", "Odisha", "Uttarakhand"]
                    },
                    {
                        "questionNumber": 6,
                        "question": "Which state government launched the 'Lakhpati Bitiya Yojana'?",
                        "answerOptions": [
                            {"text": "Delhi", "isCorrect": true, "rationale": "The Delhi government launched the 'Lakhpati Bitiya Yojana' to empower young girls."},
                            {"text": "Madhya Pradesh", "isCorrect": false, "rationale": "Madhya Pradesh has Ladli Behna, but Delhi launched this specific Bitiya Yojana."},

                        "hint": "This Union Territory / National Capital region introduced the scheme.",
                        "tags": ["Welfare Schemes", "Delhi", "Lakhpati Bitiya Yojana"]
                    },
                    {
                        "questionNumber": 7,
                        "question": "Which space agency launched the crewed mission named 'Artemis-II' sent near the Moon?",
                        "answerOptions": [
                            {"text": "NASA (USA)", "isCorrect": true, "rationale": "NASA of the United States launched the crewed Artemis-II mission near the Moon."},
                            {"text": "ISRO (India)", "isCorrect": false, "rationale": "ISRO has Gaganyaan and Chandrayaan missions, but Artemis is NASA's flagship program."},
                            {"text": "ESA (Europe)", "isCorrect": false, "rationale": "European Space Agency collaborates on Artemis but the mission is led by NASA."},

                        ],
                        "hint": "The premier American space exploration agency.",
                        "tags": ["Space Missions", "NASA", "Artemis-II"]
                    },
                    {
                        "questionNumber": 8,
                        "question": "What is India's global ranking in renewable energy capacity?",
                        "answerOptions": [
                            {"text": "Third", "isCorrect": true, "rationale": "India holds the third global rank in renewable energy capacity."},
                            {"text": "First", "isCorrect": false, "rationale": "India is growing rapidly in renewables but ranks third globally overall."},
                            {"text": "Second", "isCorrect": false, "rationale": "India is not second; it stands at third position."},
                            {"text": "Fourth", "isCorrect": false, "rationale": "India's rank is higher than fourth place in renewable capacity."}

                        "hint": "It is among the top three nations globally in green energy adoption.",
                        "tags": ["Renewable Energy", "Global Rankings", "India"]
                    },
                    {
                        "questionNumber": 9,
                        "question": "Who became the first Indian player to join the US Major League Cricket on April 3, 2026?",
                        "answerOptions": [
                            {"text": "Ravichandran Ashwin", "isCorrect": true, "rationale": "Ravichandran Ashwin became the first Indian player to join the US Major League Cricket."},
                            {"text": "Virat Kohli", "isCorrect": false, "rationale": "Virat Kohli remains active in international and IPL cricket."},
                            {"text": "Rohit Sharma", "isCorrect": false, "rationale": "Rohit Sharma was not the player who joined the US league."},

                    {

                    {

                            {"text": "Odisha", "isCorrect": true, "rationale": "India's first indigenous coal-to-ammonium nitrate project was established in Odisha."},

                        "hint": "An eastern coastal state known for major heavy industry and mining projects.",
                        "tags": ["Industry", "Odisha", "Coal-to-Ammonium Nitrate"]
                    },
                    {
                        "questionNumber": 12,
                        "question": "Which state government announced the establishment of animal welfare committees in all districts on April 4, 2026?",
                        "answerOptions": [
                            {"text": "Delhi", "isCorrect": true, "rationale": "The Delhi government announced the creation of animal welfare committees across all districts."},
                            {"text": "Punjab", "isCorrect": false, "rationale": "Punjab focused on other social welfare initiatives around this date."},
                            {"text": "Maharashtra", "isCorrect": false, "rationale": "Maharashtra did not issue this specific district-level animal welfare committee order."},

                    {
