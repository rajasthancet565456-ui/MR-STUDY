        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(questionsData.length).fill(null);

        const questionCategory = document.getElementById('question-category');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressText = document.getElementById('progress-text');
        const progressPercent = document.getElementById('progress-percent');
        const progressBar = document.getElementById('progress-bar');
        const scoreDisplay = document.getElementById('score-display');
        const sectionBadge = document.getElementById('section-badge');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const explanationTitle = document.getElementById('explanation-title');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = questionsData[currentQuestionIndex];
            questionCategory.textContent = q.category;
            questionText.textContent = `${currentQuestionIndex + 1}. ${q.question}`;
            
            // Progress Update
            const progress = ((currentQuestionIndex + 1) / questionsData.length) * 100;
            progressText.textContent = `Question ${currentQuestionIndex + 1} of ${questionsData.length}`;
            progressPercent.textContent = `${Math.round(progress)}%`;
            progressBar.style.width = `${progress}%`;

            // Section Badge Update
            if (currentQuestionIndex < 45) {
                sectionBadge.textContent = `Section 1: Q ${currentQuestionIndex + 1}/45`;
            } else {
                sectionBadge.textContent = `Section 2: Q ${currentQuestionIndex + 1}/90`;
            }

            // Hint setup
            hintBox.textContent = q.hint;
            hintBox.classList.add('hidden');

            // Options setup
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border font-medium transition flex items-center justify-between ${getOptionStyle(idx, q.correct)}`;
                btn.innerHTML = `<span><strong class="mr-2 text-slate-400">${String.fromCharCode(65 + idx)}.</strong> ${opt}</span>`;
                
                if (userAnswers[currentQuestionIndex] !== null) {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => selectOption(idx);
                }
                optionsContainer.appendChild(btn);
            });

            // Explanation setup
            if (userAnswers[currentQuestionIndex] !== null) {
                showExplanation(userAnswers[currentQuestionIndex] === q.correct, q.explanation);
            } else {
                explanationBox.classList.add('hidden');
            }

            // Buttons state
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.textContent = currentQuestionIndex === questionsData.length - 1 ? "Finish" : "Next";
        }

        function getOptionStyle(idx, correctIdx) {
            const selected = userAnswers[currentQuestionIndex];
            if (selected === null) {
                return "bg-white border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/30 text-slate-700";
            }
            if (idx === correctIdx) {
                return "bg-emerald-50 border-emerald-500 text-emerald-900 font-semibold";
            }
            if (idx === selected && selected !== correctIdx) {
                return "bg-rose-50 border-rose-500 text-rose-900";
            }
            return "bg-white border-slate-200 text-slate-400 opacity-60";
        }

        function selectOption(idx) {
            userAnswers[currentQuestionIndex] = idx;
            const q = questionsData[currentQuestionIndex];
            
            if (idx === q.correct) {
                score++;
                scoreDisplay.textContent = `Score: ${score} / 90`;
            }

            loadQuestion();
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function showExplanation(isCorrect, explanation) {
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mb-6 p-4 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-900 text-sm";
                explanationTitle.innerHTML = "✅ Correct Answer!";
            } else {
                explanationBox.className = "mb-6 p-4 rounded-xl border border-rose-200 bg-rose-50 text-rose-900 text-sm";
                explanationTitle.innerHTML = "❌ Incorrect Answer";
            }
            explanationText.textContent = explanation;
        }

        function nextQuestion() {
            if (currentQuestionIndex < questionsData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showSummary();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= questionsData.length) {
                currentQuestionIndex = val - 1;
                jumpInput.value = '';
                loadQuestion();
            } else {
                alert("Please enter a valid question number between 1 and 90.");
            }
        }

        function showSummary() {
            const percentage = Math.round((score / questionsData.length) * 100);
            document.querySelector('main').innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-100">
                    <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 font-bold">
                        ${percentage}%
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">Quiz Completed Successfully!</h2>
                    <p class="text-slate-600 mb-6">You scored <span class="font-bold text-indigo-600">${score}</span> out of <span class="font-bold">${questionsData.length}</span> questions correctly.</p>
                    <div class="flex justify-center gap-4">
                        <button onclick="restartQuiz()" class="px-6 py-2.5 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition shadow-md">Restart Quiz</button>
                    </div>
                </div>
            `;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = new Array(questionsData.length).fill(null);
            scoreDisplay.textContent = `Score: 0 / 90`;
            location.reload();
        }

        // Initial Load
        loadQuestion();
    </script>
