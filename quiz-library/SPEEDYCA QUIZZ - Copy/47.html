        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const questionSourceEl = document.getElementById('question-source');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const progressTextEl = document.getElementById('progress-text');
        const progressPercentageEl = document.getElementById('progress-percentage');
        const progressBarEl = document.getElementById('progress-bar');
        const scoreEl = document.getElementById('score');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = quizData[currentQuestion];
            questionSourceEl.textContent = q.page;
            questionTextEl.textContent = `${currentQuestion + 1}. ${q.question}`;
            hintText.textContent = q.hint;
            hintBox.classList.add('hidden');
            explanationBox.classList.add('hidden');

            // Render options
            optionsContainerEl.innerHTML = '';
            q.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = `w-full text-left p-3.5 rounded-lg border transition font-medium flex items-center justify-between ${getOptionStyle(index, q.correct)}`;
                button.innerHTML = `<span>${String.fromCharCode(65 + index)}. ${option}</span>`;
                
                if (userAnswers[currentQuestion] !== null) {
                    button.disabled = true;
                } else {
                    button.onclick = () => selectAnswer(index);
                }
                optionsContainerEl.appendChild(button);
            });

            // Show explanation if already answered
            if (userAnswers[currentQuestion] !== null) {
                showExplanation(q);
            }

            // Update progress
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            progressTextEl.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
            progressPercentageEl.textContent = `${Math.round(progress)}%`;
            progressBarEl.style.width = `${progress}%`;
            scoreEl.textContent = score;

            // Navigation state
            prevBtn.disabled = currentQuestion === 0;
            nextBtn.textContent = currentQuestion === quizData.length - 1 ? 'Finish' : 'Next →';
        }

        function getOptionStyle(index, correctIndex) {
            const answered = userAnswers[currentQuestion];
            if (answered === null) {
                return "bg-white border-gray-200 hover:bg-indigo-50 hover:border-indigo-300 text-gray-700";
            }
            if (index === correctIndex) {
                return "bg-green-100 border-green-400 text-green-800 font-semibold";
            }
            if (index === answered && answered !== correctIndex) {
                return "bg-red-100 border-red-400 text-red-800 font-semibold";
            }
            return "bg-white border-gray-200 opacity-60 text-gray-500";
        }

        function selectAnswer(index) {
            const q = quizData[currentQuestion];
            userAnswers[currentQuestion] = index;

            if (index === q.correct) {
                score++;
            }

            scoreEl.textContent = score;
            loadQuestion();
        }

        function showExplanation(q) {
            explanationBox.classList.remove('hidden');
            const isCorrect = userAnswers[currentQuestion] === q.correct;
            explanationBox.className = `mb-6 p-4 rounded-lg border-l-4 text-sm ${isCorrect ? 'bg-green-50 border-green-500 text-green-900' : 'bg-red-50 border-red-500 text-red-900'}`;
            document.getElementById('explanation-title').textContent = isCorrect ? '✅ Correct Answer!' : '❌ Incorrect Answer.';
            explanationText.textContent = q.explanation;
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentQuestion = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Initialize Quiz on Load
        window.onload = loadQuestion;
    </script>
