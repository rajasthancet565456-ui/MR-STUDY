        let currentIdx = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);

        const questionTag = document.getElementById('question-tag');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const scoreDisplay = document.getElementById('score-display');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationTitle = document.getElementById('explanation-title');
        const explanationText = document.getElementById('explanation-text');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const q = questions[currentIdx];
            questionTag.textContent = `Question ${currentIdx + 1} of 90`;
            questionText.textContent = q.q;
            hintText.textContent = q.hint;
            hintBox.classList.add('hidden');
            
            // Randomize options for this render
            let shuffledOptions = [...q.options];
            // Simple deterministic shuffle seeded or standard sort based on question index to keep state during navigation
            shuffledOptions.sort((a, b) => (a.length + currentIdx) % 3 - 1);

            optionsContainer.innerHTML = '';
            shuffledOptions.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border font-medium transition flex justify-between items-center ${
                    userAnswers[currentIdx] !== null 
                        ? (opt === q.correct 
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-900' 
                            : (userAnswers[currentIdx] === opt ? 'bg-rose-50 border-rose-300 text-rose-900' : 'bg-white border-slate-200 text-slate-700'))
                        : 'bg-white border-slate-200 hover:border-indigo-300 hover:bg-slate-50 text-slate-700'
                }`;
                btn.innerHTML = `<span>${opt}</span>`;
                btn.disabled = userAnswers[currentIdx] !== null;
                btn.onclick = () => selectOption(opt, q.correct);
                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentIdx] !== null) {
                showExplanation(userAnswers[currentIdx] === q.correct, q.exp);
            } else {
                explanationBox.classList.add('hidden');
            }

            progressText.textContent = `Question ${currentIdx + 1} of 90`;
            progressBar.style.width = `${((currentIdx + 1) / 90) * 100}%`;
            prevBtn.disabled = currentIdx === 0;
            nextBtn.textContent = currentIdx === questions.length - 1 ? 'Finish Quiz' : 'Next →';
            jumpInput.value = currentIdx + 1;
        }

        function selectOption(selected, correct) {
            userAnswers[currentIdx] = selected;
            if (selected === correct) {
                score++;
            }
            scoreDisplay.textContent = `Score: ${score} / 90`;
            loadQuestion();
        }

        function showExplanation(isCorrect, exp) {
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mt-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900 text-sm transition-all";
                explanationTitle.innerHTML = `<span class="text-emerald-600 font-bold">✔ Correct Answer!</span> Rationale:`;
            } else {
                explanationBox.className = "mt-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-900 text-sm transition-all";
                explanationTitle.innerHTML = `<span class="text-rose-600 font-bold">✖ Incorrect.</span> Rationale:`;
            }
            explanationText.textContent = exp;
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showCompletionSummary();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            let val = parseInt(jumpInput.value);
            if (val >= 1 && val <= 90) {
                currentIdx = val - 1;
                loadQuestion();
            } else {
                alert("Please enter a valid question number between 1 and 90.");
            }
        }

        function showCompletionSummary() {
            const card = document.getElementById('quiz-card');
            card.innerHTML = `
                <div class="text-center py-8">
                    <h2 class="text-2xl font-bold text-indigo-700 mb-3">Quiz Completed Successfully! 🎉</h2>

                    </div>
                    <div>
                        <button onclick="resetQuiz()" class="px-6 py-2.5 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 shadow-md transition">
                            Retake Quiz
                        </button>
                    </div>
                </div>
            `;
            document.querySelector('.flex.justify-between').style.display = 'none';
        }

        function resetQuiz() {
            currentIdx = 0;
            score = 0;
            userAnswers = new Array(questions.length).fill(null);
            scoreDisplay.textContent = `Score: 0 / 90`;
            document.querySelector('.flex.justify-between').style.display = 'flex';
            loadQuestion();
        }

        loadQuestion();
