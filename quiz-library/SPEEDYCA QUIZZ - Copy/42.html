        let currentIndex = 0;
        let score = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let randomizedOptionsMap = {};

        // Shuffle helper function
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function loadQuestion() {
            const q = quizData[currentIndex];
            
            // Update Headers & Indicators
            document.getElementById('question-counter').innerText = `Question ${currentIndex + 1} of 90`;
            document.getElementById('page-badge').innerText = `Page ${q.page}`;
            document.getElementById('question-text').innerText = q.question;
            
            // Progress Bar
            const progress = ((currentIndex + 1) / 90) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Hint
            document.getElementById('hint-box').innerText = q.hint;
            document.getElementById('hint-box').classList.add('hidden');

            // Explanation
            document.getElementById('explanation-text').innerText = q.explanation;
            const explanationBox = document.getElementById('explanation-box');

            // Randomize options for this question if not already stored
            if (!randomizedOptionsMap[currentIndex]) {
                randomizedOptionsMap[currentIndex] = shuffleArray(q.options);
            }
            const currentOptions = randomizedOptionsMap[currentIndex];

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            currentOptions.forEach((option) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-900/50 hover:bg-slate-700/50 text-sm sm:text-base font-medium transition flex justify-between items-center`;
                btn.innerText = option;

                const existingAnswer = userAnswers[currentIndex];

                if (existingAnswer !== null) {
                    btn.disabled = true;
                    if (option === q.answer) {
                        btn.className += ` bg-emerald-950/60 border-emerald-500 text-emerald-200`;
                    } else if (existingAnswer === option) {
                        btn.className += ` bg-rose-950/60 border-rose-500 text-rose-200`;
                    }
                } else {
                    btn.onclick = () => selectOption(option, q.answer);
                }

                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentIndex] !== null) {
                explanationBox.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
            }

            // Button states
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').innerText = currentIndex === 89 ? "Finish" : "Next";
        }

        function selectOption(selected, correct) {
            if (userAnswers[currentIndex] !== null) return; // already answered

            userAnswers[currentIndex] = selected;

            if (selected === correct) {
                score += 1;
                correctCount += 1;
            } else {
                incorrectCount += 1;
            }

            // Update Score Display
            document.getElementById('score-display').innerText = score;
            document.getElementById('correct-display').innerText = correctCount;
            document.getElementById('incorrect-display').innerText = incorrectCount;

            // Reveal explanation
            document.getElementById('explanation-box').classList.remove('hidden');

            // Refresh options view to show correct/incorrect colors
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your final score is ${score} out of 90.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value);
            if (val >= 1 && val <= 90) {
                currentIndex = val - 1;
                loadQuestion();
                input.value = '';
            } else {
                alert('Please enter a valid question number between 1 and 90.');
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        // Initialize Quiz on load
        window.onload = () => {
            loadQuestion();
        };
    </script>
