        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let answeredCurrent = false;

        // DOM Elements
        const questionBadge = document.getElementById('question-badge');
        const sourcePageBadge = document.getElementById('source-page-badge');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const hintBtnText = document.getElementById('hint-btn-text');
        const explanationBox = document.getElementById('explanation-box');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');
        const pageTag = document.getElementById('page-tag');

        function loadQuestion() {
            const q = questions[currentIndex];
            questionBadge.innerText = `Question ${currentIndex + 1} of ${questions.length}`;
            sourcePageBadge.innerText = `Source: Page ${q.page}`;
            pageTag.innerText = q.page === 37 ? "Page 37 (Environment)" : "Page 38 (Sports)";
            questionText.innerText = q.question;

            // Hide hint and explanation initially for the new question
            hintBox.classList.add('hidden');
            hintBtnText.innerText = "Show Hint";
            hintBox.innerText = q.hint;

            explanationBox.classList.add('hidden');
            answeredCurrent = userAnswers[currentIndex] !== null;

            // Render Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between text-sm sm:text-base font-medium ${getOptionStyle(idx, q.correct, userAnswers[currentIndex])}`;
                btn.innerHTML = `<span><span class="font-bold mr-2 text-slate-400">${String.fromCharCode(65 + idx)}.</span> ${opt}</span>`;
                
                if (!answeredCurrent) {
                    btn.onclick = () => selectOption(idx);
                } else {
                    btn.disabled = true;
                }
                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation
            if (answeredCurrent) {
                showExplanation(userAnswers[currentIndex] === q.correct, q.explanation);
            }

            // Update Progress & Controls
            progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.innerText = currentIndex === questions.length - 1 ? "Finish" : "Next";
            scoreDisplay.innerText = score;
            jumpInput.value = currentIndex + 1;
        }

        function getOptionStyle(idx, correctIdx, userAns) {
            if (userAns === null) {
                return "bg-slate-900/60 border-slate-700 hover:border-indigo-500 hover:bg-slate-900 text-slate-200 cursor-pointer";
            }
            if (idx === correctIdx) {
                return "bg-emerald-950/40 border-emerald-500 text-emerald-200";
            }
            if (idx === userAns && userAns !== correctIdx) {
                return "bg-rose-950/40 border-rose-500 text-rose-200";
            }
            return "bg-slate-900/30 border-slate-800 text-slate-500 opacity-50";
        }

        function selectOption(selectedIdx) {
            if (answeredCurrent) return;
            answeredCurrent = true;
            userAnswers[currentIndex] = selectedIdx;

            const q = questions[currentIndex];
            const isCorrect = selectedIdx === q.correct;
            if (isCorrect) {
                score++;
            }

            scoreDisplay.innerText = score;
            loadQuestion(); // Reload to apply styling and show explanation
        }

        function showExplanation(isCorrect, explanationStr) {
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-emerald-950/30 border-emerald-500/40 text-emerald-200 transition-all";
                explanationHeader.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> Correct Answer!`;
            } else {
                explanationBox.className = "mb-6 p-4 rounded-xl border bg-rose-950/30 border-rose-500/40 text-rose-200 transition-all";
                explanationHeader.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-400"></i> Incorrect Answer.`;
            }
            explanationText.innerText = explanationStr;
        }

        function toggleHint() {
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBtnText.innerText = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintBtnText.innerText = "Show Hint";
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of ${questions.length}.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= questions.length) {
                currentIndex = val - 1;
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}.`);
            }
        }

        // Initialize Quiz on load
        window.onload = () => {
            loadQuestion();
        };
    </script>
