        </div>

        <!-- Quiz Card -->

            <!-- Question Text -->

                Loading question...
            </h2>

            <!-- Options Container -->

            </div>

            <!-- Hint Section -->

                <button onclick="toggleHint()" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1 focus:outline-none">
                    <span>💡 Toggle Hint</span>
                </button>
                <div id="hint-box" class="hidden mt-2 p-3 bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-lg">
                    <!-- Hint text -->
                </div>
            </div>

            <!-- Explanation Box (Revealed on choice selection) -->
            <div id="explanation-container" class="hidden mb-6 p-4 rounded-xl bg-slate-100 border border-slate-300 text-sm">
                <h3 class="font-bold text-slate-700 mb-1">Explanation / Rationale:</h3>
                <p id="explanation-text" class="text-slate-600 leading-normal"></p>
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-100">
                <div class="flex items-center gap-2 w-full sm:w-auto">

                    <button id="next-btn" onclick="nextQuestion()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition w-full sm:w-auto">Next</button>
                </div>

                    <label for="jump-input">Jump to:</label>
                    <input type="number" id="jump-input" min="1" max="90" class="w-16 px-2 py-1 border border-slate-300 rounded-md text-center focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="1-90">
                    <button onclick="jumpToQuestion()" class="px-3 py-1 bg-slate-700 text-white rounded-md hover:bg-slate-800 transition">Go</button>
                </div>
            </div>

        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);

        const questionIndicator = document.getElementById("question-indicator");
        const scoreDisplay = document.getElementById("score-display");
        const progressBar = document.getElementById("progress-bar");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const hintBox = document.getElementById("hint-box");
        const explanationContainer = document.getElementById("explanation-container");
        const explanationText = document.getElementById("explanation-text");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const quizCard = document.getElementById("quiz-card");
        const completionScreen = document.getElementById("completion-screen");
        const finalScoreText = document.getElementById("final-score-text");
        const jumpInput = document.getElementById("jump-input");

        function shuffleArray(array) {
            let currentIndex = array.length, temporaryValue, randomIndex;
            while (0 !== currentIndex) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex -= 1;
                temporaryValue = array[currentIndex];
                array[currentIndex] = array[randomIndex];
                array[randomIndex] = temporaryValue;
            }
            return array;
        }

        // Shuffle options for each question to meet requirement #5 (Randomization)
        const processedQuestions = questions.map((item) => {
            const shuffledOpts = shuffleArray([...item.options]);
            return {
                ...item,
                shuffledOptions: shuffledOpts
            };
        });

        function loadQuestion() {
            const currentQ = processedQuestions[currentIndex];
            questionIndicator.innerText = `Question ${currentIndex + 1} of ${processedQuestions.length}`;
            scoreDisplay.innerText = `Score: ${score}`;
            progressBar.style.width = `${((currentIndex + 1) / processedQuestions.length) * 100}%`;

            questionText.innerText = currentQ.q;
            hintBox.innerText = currentQ.hint;
            hintBox.classList.add("hidden");

            optionsContainer.innerHTML = "";
            explanationContainer.classList.add("hidden");

            const selectedAns = userAnswers[currentIndex];

            currentQ.shuffledOptions.forEach((option) => {
                const btn = document.createElement("button");
                btn.innerText = option;
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 bg-white hover:bg-indigo-50 hover:border-indigo-300 transition font-medium text-slate-700 focus:outline-none";

                if (selectedAns !== null) {
                    btn.disabled = true;
                    if (option === currentQ.answer) {
                        btn.classList.add("bg-emerald-100", "border-emerald-500", "text-emerald-800");
                    } else if (option === selectedAns) {
                        btn.classList.add("bg-rose-100", "border-rose-500", "text-rose-800");
                    }
                } else {
                    btn.onclick = () => selectOption(option, currentQ.answer);
                }

                optionsContainer.appendChild(btn);
            });

            if (selectedAns !== null) {
                explanationText.innerText = currentQ.explanation;
                explanationContainer.classList.remove("hidden");
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.innerText = currentIndex === processedQuestions.length - 1 ? "Finish" : "Next";
        }

        function selectOption(selectedOption, correctAnswer) {
            userAnswers[currentIndex] = selectedOption;
            const currentQ = processedQuestions[currentIndex];

            if (selectedOption === correctAnswer) {
                score++;
            }

            scoreDisplay.innerText = `Score: ${score}`;
            explanationText.innerText = currentQ.explanation;
            explanationContainer.classList.remove("hidden");

            // Refresh buttons state
            const buttons = optionsContainer.getElementsByTagName("button");
            for (let btn of buttons) {
                btn.disabled = true;
                if (btn.innerText === correctAnswer) {
                    btn.classList.add("bg-emerald-100", "border-emerald-500", "text-emerald-800");
                } else if (btn.innerText === selectedOption) {
                    btn.classList.add("bg-rose-100", "border-rose-500", "text-rose-800");
                }
            }
        }

        function nextQuestion() {
            if (currentIndex < processedQuestions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showCompletionScreen();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function toggleHint() {
            hintBox.classList.toggle("hidden");
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= processedQuestions.length) {
                currentIndex = val - 1;
                jumpInput.value = "";
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${processedQuestions.length}`);
            }
        }

        function showCompletionScreen() {
            quizCard.classList.add("hidden");
            completionScreen.classList.remove("hidden");
            finalScoreText.innerText = `You scored ${score} out of ${processedQuestions.length}.`;
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            userAnswers = new Array(processedQuestions.length).fill(null);
            completionScreen.classList.add("hidden");
            quizCard.classList.remove("hidden");
            loadQuestion();
        }

        // Initialize first question on load
        window.onload = loadQuestion;
    </script>
