                hintBox.textContent = q.hint;
                hintBox.classList.remove("hidden");
                hintToggleText.textContent = "Hide Exam Hint";
            } else {
                hintBox.classList.add("hidden");
                hintToggleText.textContent = "Show Exam Hint";
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questionsData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showCompletionScreen();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= questionsData.length) {
                currentQuestionIndex = val - 1;
                loadQuestion();
                jumpInput.value = "";
            } else {
                alert(`Please enter a valid question number between 1 and ${questionsData.length}`);
            }
        }

        function showCompletionScreen() {
            const card = document.getElementById("quiz-card");
            const percentage = Math.round((score / questionsData.length) * 100);
            
            let performanceMsg = "Outstanding preparation! You are fully aligned with competitive exam standards.";
            if (percentage < 50) {
                performanceMsg = "Good effort! Review Pages 89 and 90 thoroughly to boost your current affairs accuracy.";
            } else if (percentage < 80) {
                performanceMsg = "Strong performance! Just a little more revision needed for top-tier government exams.";
            }

            card.innerHTML = `
                <div class="text-center py-8">
                    <h2 class="text-2xl sm:text-3xl font-bold text-slate-100 mb-2">Quiz Completed Successfully!</h2>
                    <p class="text-slate-400 text-sm mb-6">You have completed all 90 exam-level questions from Pages 89 & 90.</p>
                    
                    <div class="inline-block bg-slate-900 border border-slate-700 rounded-2xl p-6 mb-6 shadow-inner">
                        <div class="text-4xl sm:text-5xl font-extrabold text-cyan-400 mb-2">${score} / 90</div>
                        <div class="text-sm font-medium text-slate-300">Final Score Percentage: <span class="text-emerald-400 font-bold">${percentage}%</span></div>
                    </div>

                    <p class="text-slate-300 text-sm max-w-md mx-auto mb-8 leading-relaxed">${performanceMsg}</p>

                    <button onclick="restartQuiz()" class="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-xl transition shadow-lg shadow-cyan-900/40">
                        Restart Master Quiz
                    </button>
                </div>
            `;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = new Array(questionsData.length).fill(null);
            scoreDisplay.textContent = "0";
            
            // Rebuild initial card structure if it was overwritten by completion screen
            location.reload();
        }

        // Initialize First Question on load
        window.onload = loadQuestion;
    </script>
<script src="../../quiz-app-ui-v2.js"></script></body>
</html>
