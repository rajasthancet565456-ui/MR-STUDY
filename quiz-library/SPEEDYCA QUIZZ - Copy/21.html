        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const currentQ = quizData[currentIndex];
            questionSourceEl.textContent = `Source: ${currentQ.page}`;
            questionTextEl.textContent = `${currentIndex + 1}. ${currentQ.question}`;
            currentQNumEl.textContent = currentIndex + 1;
            progressBarEl.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;

            // Reset hint
            hintBoxEl.classList.add('hidden');
            hintTextToggleEl.textContent = 'Show Hint';
            hintContentEl.textContent = currentQ.hint;

            // Render options (randomized order per question or fixed based on data, but let's keep clean mapping)
            optionsContainerEl.innerHTML = '';
            
            // We can map options with original indices to track correctness securely
            const optionsWithIndex = currentQ.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            
            // Programmatically shuffle options so correct answer varies across positions A, B, C, D
            // Seed-free shuffle based on question id to maintain stability during navigation
            const shuffled = [...optionsWithIndex].sort((a, b) => {
                return ((currentQ.id + a.originalIndex) % 3) - 1;
            });

            shuffled.forEach((item, displayIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-800/60 hover:bg-slate-700/80 transition flex items-center justify-between group`;
                btn.innerHTML = `
                    <span class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg bg-slate-700 group-hover:bg-slate-600 flex items-center justify-center text-xs font-bold text-slate-300">
                            ${String.fromCharCode(65 + displayIdx)}
                        </span>
                        <span class="text-slate-200 text-sm sm:text-base">${item.text}</span>
                    </span>
                `;

                const isAnswered = answeredQuestions[currentIndex];
                const selectedOrigIdx = selectedOptions[currentIndex];

                if (isAnswered) {
                    btn.disabled = true;
                    if (item.originalIndex === currentQ.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-950/40 flex items-center justify-between";
                    } else if (item.originalIndex === selectedOrigIdx) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-950/40 flex items-center justify-between";
                    } else {
                        btn.className = "w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-800/40 opacity-50 flex items-center justify-between";
                    }
                } else {
                    btn.onclick = () => selectOption(item.originalIndex, currentQ.correct);
                }

                optionsContainerEl.appendChild(btn);
            });

            if (answeredQuestions[currentIndex]) {
                explanationTextEl.textContent = currentQ.explanation;
                explanationBoxEl.classList.remove('hidden');
            } else {
                explanationBoxEl.classList.add('hidden');
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? 'Finish' : 'Next →';
        }

        function selectOption(selectedOrigIdx, correctOrigIdx) {
            if (answeredQuestions[currentIndex]) return;

            answeredQuestions[currentIndex] = true;
            selectedOptions[currentIndex] = selectedOrigIdx;

            if (selectedOrigIdx === correctOrigIdx) {
                score++;
                scoreEl.textContent = score;
            }

            loadQuestion();
        }

            } else {
                alert(`Quiz Completed! Your Final Score is ${score} / ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= quizData.length) {
                currentIndex = val - 1;
                jumpInput.value = '';
                loadQuestion();
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        // Initialize quiz
        loadQuestion();
    </script>
<script src="../../quiz-question-controls.js"></script>
