        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let timerSeconds = 0;
        let timerInterval;

        // DOM Elements
        const questionTitle = document.getElementById('question-title');
        const optionsContainer = document.getElementById('options-container');
        const progressText = document.getElementById('progress-text');
        const progressPercentage = document.getElementById('progress-percentage');
        const progressBar = document.getElementById('progress-bar');
        const scoreDisplay = document.getElementById('score-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const quizCard = document.getElementById('quiz-card');
        const resultsScreen = document.getElementById('results-screen');
        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const explanationBox = document.getElementById('explanation-box');
        const jumpInput = document.getElementById('jump-input');
        const timerDisplay = document.getElementById('timer-display');

        function startTimer() {
            timerInterval = setInterval(() => {
                timerSeconds++;
                const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                const secs = (timerSeconds % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `Time: ${mins}:${secs}`;
            }, 1000);
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            questionTitle.textContent = `${q.id}. ${q.question}`;
            
            // Hide hint and explanation initially for this question
            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;
            explanationBox.classList.add('hidden');

            // Render options
            optionsContainer.innerHTML = '';
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition flex justify-between items-center text-sm sm:text-base font-medium `;
                
                const isSelected = userAnswers[currentQuestionIndex] === option;
                const hasAnswered = userAnswers[currentQuestionIndex] !== null;

                if (hasAnswered) {
                    if (option === q.answer) {
                        btn.className += `bg-emerald-50 border-emerald-300 text-emerald-900`;
                    } else if (isSelected) {
                        btn.className += `bg-rose-50 border-rose-300 text-rose-900`;
                    } else {
                        btn.className += `bg-white border-slate-200 text-slate-700 opacity-60`;
                    }
                    btn.disabled = true;
                } else {
                    btn.className += `bg-white border-slate-200 hover:border-indigo-300 hover:bg-indigo-50/30 text-slate-700`;
                    btn.onclick = () => selectOption(option);
                }

                btn.innerHTML = `<span>${option}</span>`;
                optionsContainer.appendChild(btn);
            });

            if (userAnswers[currentQuestionIndex] !== null) {
                showExplanation();
            }

            // Update Progress
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            progressText.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            progressPercentage.textContent = `${Math.round(progress)}%`;
            progressBar.style.width = `${progress}%`;

            // Navigation buttons state
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 'Finish Quiz →' : 'Next →';
        }

        function selectOption(selectedOption) {
            const q = questions[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = selectedOption;

            if (selectedOption === q.answer) {
                score++;
            }

            scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
            loadQuestion();
        }

        function showExplanation() {
            const q = questions[currentQuestionIndex];
            const isCorrect = userAnswers[currentQuestionIndex] === q.answer;
            
            explanationBox.className = `mt-4 p-4 rounded-xl border text-sm ${isCorrect ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'}`;
            explanationBox.innerHTML = `<strong>${isCorrect ? '✅ Correct!' : '❌ Incorrect.'}</strong> Rationale: ${q.explanation}`;
            explanationBox.classList.remove('hidden');
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (val >= 1 && val <= questions.length) {
                currentQuestionIndex = val - 1;
                loadQuestion();
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}`);
            }
        }

        function showResults() {
            clearInterval(timerInterval);
            quizCard.parentElement.querySelector('.mb-6:first-child').style.display = 'none'; // hide progress bar wrapper
            quizCard.style.display = 'none';
            document.querySelector('.flex.justify-between.items-center.gap-4.bg-white').style.display = 'none'; // hide nav controls
            
            document.getElementById('final-score').textContent = `${score} / ${questions.length}`;
            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('final-percentage').textContent = `${percentage}%`;
            
            resultsScreen.classList.remove('hidden');
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = new Array(questions.length).fill(null);
            timerSeconds = 0;
            clearInterval(timerInterval);
            startTimer();

            scoreDisplay.textContent = `Score: 0 / ${questions.length}`;
            resultsScreen.classList.add('hidden');
            quizCard.parentElement.querySelector('.mb-6:first-child').style.display = 'block';
            quizCard.style.display = 'block';
            document.querySelector('.flex.justify-between.items-center.gap-4.bg-white').style.display = 'flex';

            loadQuestion();
        }

        // Initialize Quiz on Load
        startTimer();
        loadQuestion();
    </script>
