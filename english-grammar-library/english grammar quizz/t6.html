                <div class="text-xs text-slate-300">Progress: <span id="progress-text" class="font-bold text-indigo-400 text-sm">1</span>/50</div>

        </div>

        </div>
    </header>

    <main class="max-w-3xl w-full mx-auto px-4 py-8 flex-grow">
        <div id="quiz-card" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-xl relative">
            
            <!-- Question Meta Header -->
            <div class="flex justify-between items-center mb-4">
                <span id="question-tag" class="text-xs font-semibold px-2.5 py-1 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Direct Factual MCQ</span>
                <span id="question-number-badge" class="text-xs font-medium text-slate-400">Question 1 of 50</span>
            </div>

            <!-- Question Title / Statement -->
            <h2 id="question-title" class="text-lg sm:text-xl font-medium text-slate-200 mb-6 leading-relaxed">
                Loading question...
            </h2>

            <!-- Options Grid -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamically injected option buttons -->
            </div>

            <!-- Action Toolbar (Hint & Jump Controls) -->
            <div class="flex flex-wrap justify-between items-center gap-4 pt-4 border-t border-slate-700/60 mb-6">
                <button id="hint-btn" onclick="toggleHint()" class="text-xs font-medium text-amber-400 hover:text-amber-300 bg-amber-500/10 border border-amber-500/20 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5">
                    <span>💡 Show Hint</span>
                </button>
                <div class="flex items-center gap-2">
                    <label for="jump-input" class="text-xs text-slate-400">Jump to:</label>
                    <input type="number" id="jump-input" min="1" max="50" class="w-16 bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded px-2 py-1 focus:outline-none focus:border-indigo-500 text-center" onchange="jumpToQuestion(this.value)">
                </div>
            </div>

            <!-- Hint Box (Hidden by default) -->
            <div id="hint-box" class="hidden bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 mb-6 text-sm text-amber-200/90">
                <span class="font-bold block mb-1 text-amber-400">Hint:</span>
                <p id="hint-text"></p>
            </div>

            <!-- Explanation Box (Hidden until answered) -->
            <div id="explanation-box" class="hidden bg-slate-900/90 border border-slate-700 rounded-xl p-5 mb-6 text-sm transition-all">
                <div class="flex items-center gap-2 mb-2">
                    <span id="result-indicator" class="font-bold text-base"></span>
                </div>
                <p class="text-slate-300 leading-relaxed" id="explanation-text"></p>
            </div>

            <!-- Navigation Footers -->
            <div class="flex justify-between items-center pt-2">
                <button id="prev-btn" onclick="previousQuestion()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium rounded-xl transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                    ← Previous
                </button>

                    Next →
                </button>
            </div>

        </div>
    </main>

        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const questionTitle = document.getElementById('question-title');
        const optionsContainer = document.getElementById('options-container');
        const questionTag = document.getElementById('question-tag');
        const questionNumberBadge = document.getElementById('question-number-badge');
        const scoreDisplay = document.getElementById('score-display');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const explanationBox = document.getElementById('explanation-box');
        const resultIndicator = document.getElementById('result-indicator');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion(index) {
            const q = quizData[index];
            questionNumberBadge.innerText = `Question ${index + 1} of 50`;
            questionTag.innerText = q.tag;
            questionTitle.innerText = q.question;
            hintText.innerText = q.hint;
            
            // Reset hint and explanation boxes
            hintBox.classList.add('hidden');
            explanationBox.classList.add('hidden');

            // Render options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition-all text-sm font-medium flex items-center justify-between ${
                    userAnswers[index] !== null
                        ? idx === q.correct
                            ? 'bg-emerald-500/20 border-emerald-500 text-emerald-200'
                            : userAnswers[index] === idx
                                ? 'bg-rose-500/20 border-rose-500 text-rose-200'
                                : 'bg-slate-900/40 border-slate-700/60 text-slate-400 opacity-60'
                        : 'bg-slate-900/60 border-slate-700 hover:border-indigo-500 hover:bg-slate-900 text-slate-200'
                }`;
                btn.innerHTML = `<span>${opt}</span>`;
                if (userAnswers[index] === null) {
                    btn.onclick = () => selectOption(idx);
                } else {
                    btn.disabled = true;
                }
                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation
            if (userAnswers[index] !== null) {
                showExplanationState(userAnswers[index] === q.correct, q.explanation);
            }

            // Update navigation controls
            prevBtn.disabled = index === 0;
            nextBtn.innerText = index === quizData.length - 1 ? 'Finish' : 'Next →';
            jumpInput.value = index + 1;
            progressText.innerText = index + 1;
            progressBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
        }

        function selectOption(selectedIndex) {
            const q = quizData[currentIndex];
            userAnswers[currentIndex] = selectedIndex;
            
            const isCorrect = selectedIndex === q.correct;
            if (isCorrect) {
                score++;
                scoreDisplay.innerText = score;
            }

            loadQuestion(currentIndex);
        }

        function showExplanationState(isCorrect, explanationStr) {
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                resultIndicator.innerHTML = '<span class="text-emerald-400">✅ Correct Answer!</span>';
                explanationBox.className = 'bg-emerald-950/30 border border-emerald-500/40 rounded-xl p-5 mb-6 text-sm transition-all';
            } else {
                resultIndicator.innerHTML = '<span class="text-rose-400">❌ Incorrect Answer!</span>';
                explanationBox.className = 'bg-rose-950/30 border border-rose-500/40 rounded-xl p-5 mb-6 text-sm transition-all';
            }
            explanationText.innerText = explanationStr;
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert(`Quiz Completed! Your final score is ${score} / 50.`);
            }
        }

        function previousQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function jumpToQuestion(val) {
            const qNum = parseInt(val);
            if (qNum >= 1 && qNum <= quizData.length) {
                currentIndex = qNum - 1;
                loadQuestion(currentIndex);
            } else {
                jumpInput.value = currentIndex + 1;
            }
        }

        // Initialize first question on load
        window.onload = () => {
            loadQuestion(currentIndex);
        };
    </script>
