        let currentQuestionIndex = 0;

        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');

        const totalQuestionsLabel = document.getElementById('total-questions-label');
        const jumpInput = document.getElementById('jump-input');

        totalQuestionsLabel.textContent = quizData.length;

        function loadQuestion(index) {
            const q = quizData[index];
            questionIndicator.textContent = `Question ${index + 1} of ${quizData.length}`;
            
            const progress = ((index + 1) / quizData.length) * 100;
            progressBar.style.width = `${progress}%`;
            progressPercentage.textContent = `${Math.round(progress)}%`;

            questionText.textContent = q.q;
            optionsContainer.innerHTML = '';

            hintBox.classList.add('hidden');
            hintBox.textContent = q.hint;

            const answered = userAnswers[index] !== null;

            q.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between text-sm sm:text-base font-medium `;
                
                let btnStyle = "border-slate-200 bg-white hover:border-indigo-300 hover:bg-slate-50 text-slate-700";
                
                if (answered) {
                    btn.disabled = true;
                    if (optIdx === q.correct) {
                        btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
                    } else if (userAnswers[index] === optIdx) {
                        btnStyle = "border-rose-500 bg-rose-50 text-rose-900 font-semibold";
                    } else {
                        btnStyle = "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
                    }
                }

                btn.className += btnStyle;
                btn.innerHTML = `<span>${opt}</span>`;
                
                if (!answered) {
                    btn.onclick = () => selectOption(index, optIdx);
                }

                optionsContainer.appendChild(btn);
            });

            if (answered) {
                showExplanation(index);
            } else {
                explanationBox.classList.add('hidden');
            }

            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === quizData.length - 1 ? 'Finish / Review' : 'Next →';
        }

        function selectOption(qIdx, optIdx) {
            userAnswers[qIdx] = optIdx;
            const q = quizData[qIdx];
            
            if (optIdx === q.correct) {
                score++;
                currentScoreEl.textContent = score;
            }

            loadQuestion(qIdx);
        }

        function showExplanation(index) {
            const q = quizData[index];
            const userAns = userAnswers[index];
            const isCorrect = userAns === q.correct;

            explanationBox.classList.remove('hidden', 'bg-emerald-50', 'bg-rose-50', 'border-emerald-200', 'border-rose-200');
            
            if (isCorrect) {
                explanationBox.classList.add('bg-emerald-50', 'border-emerald-200');
                explanationTitle.innerHTML = `<span class="text-emerald-700 text-base">✅ Correct! Excellent exam application.</span>`;
            } else {
                explanationBox.classList.add('bg-rose-50', 'border-rose-200');
                explanationTitle.innerHTML = `<span class="text-rose-700 text-base">❌ Incorrect. Review rule explanation below:</span>`;
            }

            explanationText.textContent = q.explanation;
            explanationText.className = `text-sm leading-relaxed ${isCorrect ? 'text-emerald-900' : 'text-rose-900'}`;
        }

        function toggleHint() {
            hintBox.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            } else {
                alert(`Quiz Completed! Your final score is ${score} / ${quizData.length}`);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion(currentQuestionIndex);
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInput.value);
            if (!isNaN(val) && val >= 1 && val <= quizData.length) {
                currentQuestionIndex = val - 1;
                loadQuestion(currentQuestionIndex);
                jumpInput.value = '';
            } else {
                alert(`Please enter a valid question number between 1 and ${quizData.length}`);
            }
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            currentScoreEl.textContent = score;
            userAnswers = new Array(quizData.length).fill(null);
            loadQuestion(0);
        }

        // Initialize first question on load
        loadQuestion(0);
