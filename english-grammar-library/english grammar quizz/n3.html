"A is true, but R is false.",
"A is false, but R is true."
],
a:0,
e:"Both statements are true. Page 30 explicitly treats “could” as permission in this example and reports it as “was not allowed to.”"
},

{
p:"21–30",
type:"MATCH",
q:"Match the direct expression with its indirect treatment: (1) I shall come tomorrow (2) May God pardon him (3) I used to go to school by bus (4) I prepared the tea and he fried the chips.",
o:[
"1-would come the next day; 2-might pardon him; 3-used to go; 4-prepared/fried retained",
"1-should come tomorrow; 2-would pardon him; 3-had used to go; 4-had prepared/had fried",
"1-would come tomorrow; 2-might pardoned him; 3-would use to go; 4-prepares/fries",
"1-shall come the next day; 2-should pardon him; 3-past perfect; 4-future tense"
],
a:0,
e:"This combines four supplied examples: shall→would with tomorrow→the next day; may→might in the optative; used to remains unchanged; simultaneous past-indefinite actions retain their tense."
},

{
p:"21–30",
type:"NOT",
q:"Which of the following is NOT a correct principle for mastering the rules on pages 21–30?",
o:[
"Choose the transformation only by counting how far back the reporting verb is.",
"Identify whether the sentence is exclamatory or optative.",
"Check special tense cases such as historical events and time clauses.",
"Interpret modals according to their contextual meaning."
],
a:0,
e:"The first option is NOT correct. The supplied pages show that direct-to-indirect conversion cannot be performed through mechanical tense backshift alone."
}

];


let current=0;
let score=0;

const answered=Array(questions.length).fill(false);
const selected=Array(questions.length).fill(null);


/* RANDOMIZE OPTIONS */

const shuffled=questions.map(q=>{

const arr=q.o.map((text,i)=>({
text:text,
correct:i===q.a
}));

/*
Fisher-Yates shuffle.
No modulo operator.
No while loop.
Every question gets its own randomized option order.
*/

for(let i=arr.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[arr[i],arr[j]]=[arr[j],arr[i]];

}

return arr;

});


const labels=["A","B","C","D"];


function typeName(t){

if(t==="AR")
return "Assertion–Reason";

if(t==="MATCH")
return "Statement Matching";

if(t==="NOT")
return "NOT Correct";

return "MCQ";

}


function hintFor(q){

const s=q.q.toLowerCase();

if(
s.includes("optative") ||
s.includes("may god") ||
s.includes("may you")
)
return "Look for a wish, prayer or blessing and identify the reporting verb used for that meaning.";

if(
s.includes("wow") ||
s.includes("ugh") ||
s.includes("fi!") ||
s.includes("bravo")
)
return "First identify the emotion expressed by the exclamation.";

if(
s.includes("historical") ||
s.includes("time clause") ||
s.includes("simultaneous") ||
s.includes("used to")
)
return "Check the special no-tense-change rules before applying normal backshift.";

if(s.includes("shall"))
return "Ask whether “shall” is expressing ordinary future meaning or advice in a question.";

if(
s.includes("modal") ||
s.includes("could") ||
s.includes("need") ||
s.includes("must")
)
return "Interpret the modal according to its meaning in the particular sentence.";

return "Check sentence type, pronouns, tense and the reporting context.";

}


function render(){

const q=questions[current];

document.getElementById("question").textContent=
(current+1)+". "+q.q;

document.getElementById("pageTag").textContent=
"Source page "+q.p;

document.getElementById("typeTag").textContent=
typeName(q.type);

document.getElementById("statusTag").textContent=
answered[current] ? "Answered" : "Unanswered";


document.getElementById("progressText").textContent=
"Question "+(current+1)+" of "+questions.length;


const percent=Math.round(
((current+1)/questions.length)*100
);

document.getElementById("pct").textContent=
percent+"%";

document.getElementById("bar").style.width=
percent+"%";


document.getElementById("hint").textContent=
hintFor(q);

document.getElementById("hint").classList.add("hidden");


document.getElementById("explanation").classList.toggle(
"hidden",
!answered[current]
);

document.getElementById("expText").textContent=
q.e;


document.getElementById("prev").disabled=
current===0;

document.getElementById("prev").classList.toggle(
"opacity-40",
current===0
);


document.getElementById("next").textContent=
current===questions.length-1
?"Finish →"
:"Next →";


const box=document.getElementById("options");

box.innerHTML="";


shuffled[current].forEach((opt,i)=>{

const btn=document.createElement("button");

btn.className=
"option w-full text-left p-4 rounded-2xl border-2 border-slate-200 bg-white font-semibold hover:border-indigo-400";


btn.innerHTML=
"<span class='inline-flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 mr-3 font-black'>"+
labels[i]+
"</span>"+
opt.text;


if(answered[current]){

btn.classList.add("disabled");

if(opt.correct)
btn.classList.add("correct");

if(
selected[current]===i &&
!opt.correct
)
btn.classList.add("wrong");

}


btn.onclick=()=>choose(i);

box.appendChild(btn);

});


document.getElementById("score").textContent=
score;

}


function choose(i){

if(answered[current])
return;

answered[current]=true;

selected[current]=i;


if(shuffled[current][i].correct)
score++;


render();

}


function go(n){

current=Math.max(
0,
Math.min(
questions.length-1,
n
)
);

render();

}


document.getElementById("prev").onclick=
()=>go(current-1);


document.getElementById("next").onclick=()=>{

if(current===questions.length-1){

document.getElementById("finalScore").textContent=
score+" / "+questions.length;

document.getElementById("result")
.classList.remove("hidden");

document.getElementById("result")
.scrollIntoView({
behavior:"smooth"
});

}else{

go(current+1);

}

};


document.getElementById("hintBtn").onclick=()=>{

document.getElementById("hint")
.classList.toggle("hidden");

};


document.getElementById("jumpBtn").onclick=()=>{

const n=Number(
document.getElementById("jump").value
);

if(n>=1 && n<=questions.length)
go(n-1);

};


document
.getElementById("jump")
.addEventListener(
"keydown",
e=>{
if(e.key==="Enter")
document.getElementById("jumpBtn").click();
}
);


document.getElementById("restart").onclick=
()=>location.reload();


render();

</script>
