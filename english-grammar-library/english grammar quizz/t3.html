                q: "Spot the error part in: '(a) When I went there / (b) Charles is playing / (c) a game of chess / (d) No error'",
                options: [
                    "(a)",
                    "(b)",
                    "(c)",
                    "(d)"
                ],
                correct: 1,
                hint: "Past tense in the first clause ('When I went there') requires past tense in the second clause.",
                explanation: "Correct! Part (b) `is playing` must be `was playing` to maintain past tense consistency."
            },
            {
                q: "Spot the error part in: '(a) The victim tried to tell us / (b) what has happened but / (c) his voice was not audible. / (d) No error'",
                options: [
                    "(a)",
                    "(b)",
                    "(c)",
                    "(d)"
                ],
                correct: 1,
                hint: "Narrative in past tense ('tried', 'was') requires Past Perfect for the prior action ('happened').",
                explanation: "Correct! Part (b) `has happened` should be `had happened`."
            },
            {
                q: "Spot the error part in: '(a) Madhuri Dixit / (b) is having / (c) a large fan following. / (d) No error'",
                options: [
                    "(a)",
                    "(b)",
                    "(c)",
                    "(d)"
                ],
                correct: 1,
                hint: "Possession/ownership verbs cannot take continuous '-ing' form.",
                explanation: "Correct! Part (b) `is having` should be `has` because 'have' here denotes possession."
            },
            {
                q: "Spot the error part in: '(a) No one heard anything / (b) about him since / (c) he left India for good. / (d) No error'",
                options: [
                    "(a)",
                    "(b)",
                    "(c)",
                    "(d)"
                ],
                correct: 0,
                hint: "Apply the 'since + Simple Past' rule to the main clause.",
                explanation: "Correct! Part (a) `No one heard` should be `No one has heard` (Present Perfect)."
            },
            {
                q: "Spot the error part in: '(a) Perhaps you do not know / (b) I am owning / (c) a farm house besides two bungalows. / (d) No error'",
                options: [
                    "(a)",
                    "(b)",
                    "(c)",
                    "(d)"
                ],
                correct: 1,
                hint: "'Own' is a verb of possession; it rejects continuous form.",
                explanation: "Correct! Part (b) `I am owning` must be corrected to `I own`."
            },
            {
                q: "Spot the error part in: '(a) This custom / (b) has come down / (c) since times immemorial. / (d) No error'",
                options: [
                    "(a)",
                    "(b)",
                    "(c)",
                    "(d)"
                ],
                correct: 2,
                hint: "Check the standard idiom phrase: 'time immemorial' vs 'times immemorial'.",
                explanation: "Correct! Part (c) contains 'times' which should be singular **'time immemorial'**."
            },
            {
                q: "Spot the error part in: '(a) It is time / (b) we should have done / (c) something useful / (d) No error'",
                options: [
                    "(a)",
                    "(b)",
                    "(c)",
                    "(d)"
                ],
                correct: 1,
                hint: "Look at page 8 rule: 'It's time' + subject takes V2 (Simple Past), not modal perfect.",
                explanation: "Correct! Part (b) `we should have done` must be replaced with `we did` (Simple Past)."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let shuffledOptionsCache = [];

        // Initialize shuffled options for randomization requirement
        function initQuiz() {
            shuffledOptionsCache = quizData.map(q => {
                let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIdx: idx }));
                // Shuffle array
                for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
                }
                let newCorrectIdx = optionsWithIndex.findIndex(item => item.originalIdx === q.correct);
                return {
                    shuffledOpts: optionsWithIndex,
                    newCorrect: newCorrectIdx
                };
            });
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentQuestion];
            const cache = shuffledOptionsCache[currentQuestion];
            
            // Update UI elements
            document.getElementById('question-badge').innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('jump-input').value = currentQuestion + 1;
            document.getElementById('total-q-count').innerText = quizData.length;
            
            // Progress Bar
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Render Options
            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';

            cache.shuffledOpts.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between text-sm sm:text-base font-medium `;
                
                const isSelected = userAnswers[currentQuestion] === idx;
                const isAnswered = userAnswers[currentQuestion] !== null;

                if (isAnswered) {
                    if (idx === cache.newCorrect) {
                        btn.className += `bg-emerald-500/20 border-emerald-500 text-emerald-200`;
                    } else if (isSelected && idx !== cache.newCorrect) {
                        btn.className += `bg-rose-500/20 border-rose-500 text-rose-200`;
                    } else {
                        btn.className += `bg-slate-900/40 border-slate-700 text-slate-400 opacity-60`;
                    }
                    btn.disabled = true;
                } else {
                    btn.className += `bg-slate-900/60 border-slate-700 hover:border-slate-500 text-slate-200 hover:bg-slate-900`;
                    btn.onclick = () => selectOption(idx);
                }

                btn.innerHTML = `<span><strong class="mr-2 text-slate-400">${String.fromCharCode(65 + idx)}.</strong> ${item.text}</span>`;
                optContainer.appendChild(btn);
            });

            // Hint box setup
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.add('hidden');
            hintBox.innerText = q.hint;
            document.getElementById('hint-toggle-text').innerText = "Show Hint";

            // Explanation box setup
            const expBox = document.getElementById('explanation-box');
            if (userAnswers[currentQuestion] !== null) {
                expBox.classList.remove('hidden');
                const isCorrect = userAnswers[currentQuestion] === cache.newCorrect;
                expBox.className = `mt-6 p-4 rounded-xl border ${isCorrect ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200' : 'bg-rose-500/10 border-rose-500/30 text-rose-200'}`;
                document.getElementById('explanation-title').innerHTML = isCorrect ? '<span>✅ Correct! Rationale:</span>' : '<span>❌ Incorrect. Explanation:</span>';
                document.getElementById('explanation-text').innerText = q.explanation;
            } else {
                expBox.classList.add('hidden');
            }

            // Navigation button states
            document.getElementById('prev-btn').disabled = currentQuestion === 0;
            document.getElementById('live-score').innerText = score;
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentQuestion] !== null) return;
            
            userAnswers[currentQuestion] = selectedIndex;
            const cache = shuffledOptionsCache[currentQuestion];
            
            if (selectedIndex === cache.newCorrect) {
                score++;
            }

            loadQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function jumpToQuestion(val) {
            let qNum = parseInt(val);
            if (qNum >= 1 && qNum <= quizData.length) {
                currentQuestion = qNum - 1;
                loadQuestion();
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            const toggleText = document.getElementById('hint-toggle-text');
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                toggleText.innerText = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                toggleText.innerText = "Show Hint";
            }
        }

        function resetQuiz() {
            currentQuestion = 0;
            score = 0;
            userAnswers = new Array(quizData.length).fill(null);
            initQuiz();
        }

        // Run on load
        window.onload = initQuiz;
    </script>
