<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Modal Auxiliaries Mastery Quiz</h1>
                <p class="text-xs text-indigo-200">KD Publication Verbs Chapter (Pages 9 to 19) - 50 Unique Questions</p>
            </div>
            <div class="flex items-center gap-4 bg-indigo-800 px-4 py-2 rounded-lg border border-indigo-600">
                <div class="text-center">
                    <span class="block text-xs text-indigo-300 uppercase font-semibold">Score</span>
                    <span id="score-display" class="text-lg font-bold text-yellow-300">0 / 0</span>
                </div>
                <div class="h-8 w-px bg-indigo-600"></div>
                <div class="text-center">
                    <span class="block text-xs text-indigo-300 uppercase font-semibold">Progress</span>
                    <span id="progress-text" class="text-lg font-bold text-white">1 / 50</span>
                </div>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="w-full bg-indigo-900 h-2 mt-3 rounded-full overflow-hidden max-w-4xl mx-auto">
            <div id="progress-bar" class="bg-yellow-400 h-full w-0 transition-all duration-300"></div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-between">
        
        <!-- Quiz Card -->
        <div id="quiz-card" class="bg-white rounded-xl shadow-md border border-slate-200 p-6 mb-6 flex-grow flex flex-col justify-between">
            
            <div>
                <!-- Question Meta Header -->
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                    <span id="question-number" class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">
                        Question 1
                    </span>
                    <span id="subtopic-tag" class="text-xs font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded">
                        Topic
                    </span>
                </div>

                <!-- Question Text -->
                <div id="question-text" class="text-base sm:text-lg font-semibold text-slate-800 mb-6 leading-relaxed">
                    Loading question...
                </div>

                <!-- Hint Collapsible Button -->
                <div class="mb-4">
                    <button id="hint-toggle-btn" onclick="toggleHint()" class="text-xs font-semibold text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-md border border-amber-200 transition-colors flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>

                        <span id="hint-text">Hint content...</span>
                    </div>
                </div>

                <!-- Options List -->
                <div id="options-container" class="space-y-3 mb-6">
                    <!-- Options populated dynamically -->
                </div>
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden mt-4 p-4 bg-slate-50 border-l-4 border-indigo-500 rounded-r-lg">
                <h4 class="text-xs font-bold text-indigo-900 uppercase tracking-wider mb-1">Detailed Rationale / Explanation:</h4>
                <p id="explanation-text" class="text-sm text-slate-700 leading-relaxed"></p>
            </div>

        </div>

        <!-- Navigation & Controls Footer -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <button id="prev-btn" onclick="prevQuestion()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    â† Previous
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    Next â†’
                </button>
            </div>

                <input type="number" id="jump-input" min="1" max="50" class="w-16 px-2 py-1 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center" placeholder="Q#">
                <button id="jump-btn" onclick="jumpToQuestion()" class="px-3 py-1 bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium rounded transition-colors">
                    Go
                </button>
            </div>
        </div>

    </main>

    <!-- Quiz Dataset and Logic Script -->
    <script>
const quizData = [
    // MODULE 1
    [
        {
            q: "Select the correct option: 'It _______ rain tonight, but the sky is quite clear.'",
            options: ["A) must", "B) might", "C) will definitely", "D) shall"],
            answer: 1,
            tag: "May vs Might",
            exp: "Rule 4 (P. 10): 'Might' is used to express 'less possibility' (कम संभावना), whereas 'May' is used for higher possibility."
        },
        {
            q: "Identify the error: 'We eat (A) / so that we (B) / might live. (C) / No error (D)'",
            options: ["A) We eat", "B) so that we", "C) might live", "D) No error"],
            answer: 2,
            tag: "Subordinate Clause",
            exp: "Rule 3 (P. 9): If the Principal Clause is in Present Tense and subordinate clause starts with 'so that' expressing purpose, use 'may' instead of 'might'."
        },
        {
            q: "Find the incorrect part: 'We may (A) / possibly come (B) / tomorrow for the meeting. (C) / No error (D)'",
            options: ["A) We may", "B) possibly come", "C) tomorrow for the meeting", "D) No error"],
            answer: 1,
            tag: "Superfluous Usage",
            exp: "Note (P. 11): Do not use 'possibly' or 'likely' with 'may' or 'might' because both indicate possibility, making the sentence superfluous."
        },
        {
            q: "Choose the correct sentence for strong deduction/high probability:",
            options: [
                "He stays in five-star hotels and travels by flight; he might be poor.",
                "He stays in five-star hotels and travels by flight; he must be very rich.",
                "He stays in five-star hotels and travels by flight; he can be rich.",
                "He stays in five-star hotels and travels by flight; he shall be rich."
            ],
            answer: 1,
            tag: "Must Probability",
            exp: "Rule 5 (P. 10): If the possibility is very high (strong certainty/deduction), use 'Must'."
        },
        {
            q: "In an optative sentence expressing a wish, which modal is appropriate?",
            options: ["A) Would", "B) Might", "C) May", "D) Must"],
            answer: 2,
            tag: "Optative Sentences",
            exp: "Rule 2 (P. 9): 'May' is used in Optative sentences to express a wish/blessing (e.g., 'May you live long!')."
        },
        {
            q: "Spotting Error: 'He worked hard (A) / so that he (B) / may pass the examination. (C) / No error (D)'",
            options: ["A) He worked hard", "B) so that he", "C) may pass the examination", "D) No error"],
            answer: 2,
            tag: "Tense Agreement",
            exp: "Rule 3 (P. 9): Since the principal clause 'He worked hard' is in Past Tense, the subordinate clause purpose takes 'might', not 'may'."
        },
        {
            q: "Which sentence correctly requests permission with respect?",
            options: ["A) Can I come in, sir?", "B) May I come in, sir?", "C) Would I come in, sir?", "D) Shall I come in, sir?"],
            answer: 1,
            tag: "Requests",
            exp: "Rule 6 (P. 11): 'May' is used in interrogative sentences to ask permission or make requests with respect."
        },
        {
            q: "Correct the sentence: 'We will possibly reach on time.'",
            options: [
                "A) Correct as written",
                "B) We may possibly reach on time",
                "C) We might possibly reach on time",
                "D) We shall possibly reaching on time"
            ],
            answer: 0,
            tag: "Superfluous Rules",
            exp: "Note (P. 11): 'Will' can be combined with 'possibly' (e.g., 'We will possibly come tomorrow'). Only 'May/Might' cannot be combined with 'possibly'."
        },
        {
            q: "Complete the sentence: 'He has not eaten anything for two days; he _____ be very hungry.'",
            options: ["A) might", "B) must", "C) shall", "D) can"],
            answer: 1,
            tag: "Strong Deduction",
            exp: "Rule 5 (P. 10): High probability or factual deduction requires 'must'."
        },
        {
            q: "Choose the sentence that correctly avoids redundancy:",
            options: [
                "A) She may likely win the trophy.",
                "B) She is likely to win the trophy.",
                "C) She might possibly win the trophy.",
                "D) She may possibly win the trophy."
            ],
            answer: 1,
            tag: "Redundancy",
            exp: "Note (P. 11): Do not use 'may/might' with 'likely'. Option B correctly uses 'is likely to'."
        }
    ],
    // MODULE 2
    [
        {
            q: "Standard rule for Future Tense: Which subject pair takes 'Shall' for general future actions?",
            options: ["A) You, He", "B) I, We", "C) They, It", "D) She, You"],
            answer: 1,
            tag: "Shall/Will Standard",
            exp: "Rule 1 (P. 11): 'Shall' is used with 1st person subjects (I/We) in simple future tense."
        },
        {
            q: "When 'Shall' is used with 2nd (You) and 3rd Person (He, She, They) subjects, it expresses:",
            options: ["A) Simple future only", "B) Past habits", "C) Command, Promise, Threat, Determination, or Compulsion", "D) Remote possibility"],
            answer: 2,
            tag: "Inverted Modals",
            exp: "Note (P. 11): 'Shall' with 2nd/3rd person subjects expresses Command, Promise, Threat, Determination, Compulsion, or Advice."
        },
        {
            q: "Identify the meaning of 'Shall' in: 'You shall leave the room at once.'",
            options: ["A) Promise", "B) Command", "C) Suggestion", "D) Request"],

            exp: "Rule 1(a) (P. 11): 'You shall leave...' expresses a direct Command."
        },
        {
            q: "Which interrogative question tag is grammatically correct for imperative sentences starting with 'Let us'?",

                "Let us dance together, shall we?",
                "Let us dance together, don't we?",

            answer: 1,
            tag: "Question Tag",
            exp: "Rule 2 (P. 12): Imperative sentences starting with 'Let us / let's' take 'shall we?' in question tags."
        },
        {
            q: "Spot the Error: 'Will I go (A) / to the market (B) / with you? (C) / No error (D)'",
            options: ["A) Will I go", "B) to the market", "C) with you?", "D) No error"],
            answer: 0,
            tag: "Modern English Exception",
            exp: "Rule 1 (P. 11): Although modern English accepts 'Will' with I/We in affirmative sentences, in interrogative sentences 'Shall' must still be used with 'I/We'."
        },
        {
            q: "Identify the nature of Modal in: 'Trespassers shall be prosecuted.'",
            options: ["A) Threat / Warning", "B) Wish", "C) Habit", "D) Theoretical Possibility"],
            answer: 0,
            tag: "Threat Concept",
            exp: "Rule 1(c) (P. 11): 'Shall' with 3rd person (Trespassers) expresses a legal Threat/Warning."
        },
        {
            q: "Spot the Error: 'He hoped that (A) / he will pass (B) / the test with good marks. (C) / No error (D)'",
            options: ["A) He hoped that", "B) he will pass", "C) the test with good marks", "D) No error"],
            answer: 1,
            tag: "Past Tense Sequence",
            exp: "Note 1 (P. 14): If a sentence starts in the Past Tense ('hoped'), change 'will/shall' to 'would/should'."
        },
        {
            q: "Find the error: 'He said that (A) / the sun was (B) / a star. (C) / No error (D)'",
            options: ["A) He said that", "B) the sun was", "C) a star", "D) No error"],
            answer: 1,
            tag: "Universal Truth",
            exp: "Note Exception (P. 14): Universal truths remain in Simple Present Tense even if the starting clause is in Past Tense ('the sun is a star')."
        },
        {
            q: "Conditionals Rule: 'If I will come, I will meet you.' Correct version is:",
            options: [
                "A) If I will come, I meet you.",
                "B) If I come, I will meet you.",
                "C) If I coming, I will meet you.",
                "D) If I shall come, I will meet you."
            ],
            answer: 1,
            tag: "Conditional Clause",
            exp: "Rule 2 (P. 15): In conditional sentences with two future events, the conditional clause takes Simple Present Tense, not simple future."
        },
        {
            q: "Which word strictly prohibits immediate simple future tense following it?",
            options: ["A) Unless", "B) Provided", "C) As soon as", "D) All of the above"],
            answer: 3,
            tag: "Conditional Conjunctions",
            exp: "Rule 2 Bullet (P. 15): Words like If, as soon as, in case, provided, unless, until, before, after, when do not take Simple Future directly after them."
        }
    ],
    // MODULE 3
    [
        {
            q: "What does 'Would' express in: 'He would rather die than beg.'",
            options: ["A) Past routine", "B) Preference / Choice", "C) Threat", "D) Moral obligation"],
            answer: 1,
            tag: "Would Preference",
            exp: "Rule 2 (P. 16): 'Would' is used to express 'preference' or 'choice', usually paired with 'rather...than'."
        },
        {
            q: "Choose the correct sentence expressing pure imaginary condition (Present/Past unreal):",
            options: [
                "A) If I was a bird, I would fly in the sky.",
                "B) If I were a bird, I would fly in the sky.",
                "C) If I am a bird, I would fly in the sky.",
                "D) If I be a bird, I will fly in the sky."
            ],
            answer: 1,
            tag: "Imaginary Conditional",
            exp: "Rule 5 & Note (P. 17): In imaginary present conditions, all subjects take 'were' in the conditional clause and 'would' in the main clause."
        },
        {
            q: "Find the error: 'If I had been a doctor, (A) / I would help (B) / the poor patients. (C) / No error (D)'",
            options: ["A) If I had been a doctor,", "B) I would help", "C) the poor patients.", "D) No error"],
            answer: 1,
            tag: "Past Unfulfilled Condition",
            exp: "Rule 5 Note (P. 17): If the conditional clause relates to past ('had been'), the principal clause structure requires 'would have + V3' (would have helped)."
        },
        {
            q: "Which verb pattern correctly describes past routine actions in series?",
            options: [
                "I used to go to school by bus. I would return on foot. We played for hours.",
                "I used to go to school by bus. I used to return on foot. We used to play for hours.",
                "I would go to school by bus. I used to return on foot. We play for hours.",
                "I play to school by bus. I would return on foot. We played for hours."
            ],
            answer: 0,
            tag: "Past Routine Combination",
            exp: "Rule 4 (P. 16-17): 'Used to', 'Would', and 'Simple Past Tense (V2)' are all combined to express continuous past routines without repetitive phrasing."
        },
        {
            q: "Which word forces the sentence to be imaginary and avoids 'was'?",
            options: ["A) I wish", "B) As if", "C) Would that", "D) All of the above"],
            answer: 3,
            tag: "Imaginary Markers",
            exp: "Rule 5 List (P. 18): Words like 'I wish', 'as though', 'if', 'as if', 'would that', and 'suppose' indicate imagination and use 'were' instead of 'was'."
        },
        {
            q: "Convert Direct to Indirect: He said, 'He will go there.'",
            options: [
                "A) He said that he will go there.",
                "B) He said that he would go there.",
                "C) He said that he shall go there.",
                "D) He said that he should go there."
            ],
            answer: 1,
            tag: "Indirect Speech",
            exp: "Rule 6 (P. 18): 'Would' acts as the past form of 'will' in Indirect speech."
        },
        {
            q: "What modal expresses polite request in interrogative form?",
            options: ["A) Would you help me?", "B) Must you help me?", "C) Shall you help me?", "D) Should you help me?"],
            answer: 0,
            tag: "Polite Request",
            exp: "Rule 7 (P. 18): 'Would' is used in interrogative sentences for polite requests."
        },
        {
            q: "Identify the incorrect usage: 'He uses to study till 10 p.m. daily.'",
            options: [
                "A) Correct as written",
                "B) Replace 'uses to study' with 'studies'",
                "C) Replace 'uses to study' with 'used to study'",
                "D) Replace 'uses to study' with 'would study'"
            ],
            answer: 1,
            tag: "Present Routine Error",
            exp: "USED TO Rule (P. 21): 'Use to' or 'uses to' is NOT used for present routine actions. Use Simple Present Tense ('He studies...')."
        },
        {
            q: "Identify the role of 'used to' in: 'I am used to sleeping late at night.'",
            options: ["A) Modal Auxiliary", "B) Adjective", "C) Main Verb", "D) Noun"],
            answer: 1,
            tag: "Marginal Auxiliary",
            exp: "Marginal Auxiliary Rule (P. 4): When preceded by 'be' verb (is/am/are/was), 'used to' acts as an Adjective followed by a Gerund (V1+ing)."
        },
        {
            q: "Spot the Error: 'I would rather (A) / die (B) / then accept defeat. (C) / No error (D)'",
            options: ["A) I would rather", "B) die", "C) then accept defeat", "D) No error"],
            answer: 2,
            tag: "Comparative Conjunction",
            exp: "Rule 2 (P. 16): 'Would rather' takes comparative conjunction 'than', not adverb 'then'."
        }
    ],
    // MODULE 4
    [
        {
            q: "Rule for 'LEST': 'Run fast lest you _______ miss the train.'",
            options: ["A) will", "B) shall", "C) should", "D) may"],
            answer: 2,
            tag: "Lest Conjunction",
            exp: "Rule 3 (P. 18): 'Lest' is followed by 'Should' to express negative purpose."
        },
        {
            q: "Alternate rule for 'Lest': If 'should' is absent after 'lest', which form of verb must be used?",
            options: ["A) V1 with s/es", "B) Bare V1 without s/es", "C) V2", "D) V3"],
            answer: 1,
            tag: "Lest Subjunctive",
            exp: "Rule 3 Note (P. 18): 'Lest' can also take 'V1' without 's/es' (e.g., 'Take care lest you fall', 'Help him lest he fail')."
        },
        {
            q: "Which modal expresses Moral Duty or Ethical Obligation?",
            options: ["A) Must", "B) Should", "C) Ought to", "D) Could"],
            answer: 2,
            tag: "Moral Obligation",
            exp: "Rule 1 (P. 19): 'Ought to' expresses moral obligation or social duty (e.g., 'We ought to love our country')."
        },
        {
            q: "Correct structure check: Which modals MUST be followed by infinitive 'to + V1'?",
            options: ["A) Can, Could", "B) Ought, Used", "C) May, Might", "D) Shall, Will"],

            tag: "Infinitive Rules",
            exp: "Rule 3 (P. 6 / P. 19): 'Ought' and 'Used' are followed by 'to + V1'."
        },
        {
            q: "Find the error: 'He ran fast (A) / lest he (B) / should not miss the train. (C) / No error (D)'",
            options: ["A) He ran fast", "B) lest he", "C) should not miss the train", "D) No error"],
            answer: 2,
            tag: "Negative Redundancy",
            exp: "Rule 3 (P. 18): 'Lest' itself has a negative meaning. Adding 'not' after 'lest' makes it an error."

        {

            exp: "Rule 1 & 2 (P. 18): 'Should' is used to give general advice or suggestions."

        },
        {
            q: "What does 'Should' indicate in advice contexts?",

            tag: "Should Concept",
            exp: "Rule 2 (P. 18): 'Should' expresses advice or opinion on what is right/desirable."
        },
        {
            q: "Identify the mistake: 'Help him (A) / lest he (B) / fails in the exam. (C) / No error (D)'",
            options: ["A) Help him", "B) lest he", "C) fails in the exam", "D) No error"],
            answer: 2,
            tag: "Subjunctive Form",
            exp: "Rule 3 Note (P. 18): When using V1 after 'lest', do not attach 's/es'. It must be 'lest he fail'."
        },
        {
            q: "Select the sentence showing formal/polite obligation:",
            options: [
                "A) You must go now.",
                "B) You ought to love your nation.",
                "C) You can bring books.",
                "D) You will run fast."

            answer: 1,
            tag: "Moral Duty",
            exp: "Rule 1 (P. 19): Loving one's nation is a moral obligation expressed via 'ought to'."

            answer: 0,
            tag: "Marginal Need",
            exp: "When 'need' acts as a helper modal in negative sentences ('need not'), it does NOT take 's/es'. Change 'needs not' to 'need not'."

        {
            q: "Spot the Error (SSC PYQ): 'The Government cannot (A) / be able to contain (B) / Encephalitis by spending 1% GDP. (C) / No error (D)'",
            options: ["A) The Government cannot", "B) be able to contain", "C) Encephalitis by spending 1% GDP.", "D) No error"],
            answer: 1,
            tag: "Superfluous Ability",
            exp: "'Can/Cannot' already denotes ability. Adding 'be able to' is superfluous. Remove 'be able to'."
        },
        {
            q: "Spot the Error (UPSC CSAT Pattern): 'He returned the purse (A) / though he could keep (B) / it very easily. (C) / No error (D)'",
            options: ["A) He returned the purse", "B) though he could keep", "C) it very easily.", "D) No error"],
            answer: 1,
            tag: "Past Unfulfilled Action",
            exp: "To express an action that was possible in the past but didn't happen, use 'could have + V3' ('could have kept')."
        },
        {
            q: "Spot the Error: 'If you get good marks (A) / I shall happy (B) / as much as you. (C) / No error (D)'",
            options: ["A) If you get good marks", "B) I shall happy", "C) as much as you.", "D) No error"],
            answer: 1,
            tag: "Missing Main Verb",
            exp: "Modals require a principal verb. Add 'be' after 'shall' -> 'I shall be happy'."
        },
        {
            q: "Spot the Error: 'It is very cold here (A) / I should bring (B) / my woolen clothes but I didn't. (C) / No error (D)'",
            options: ["A) It is very cold here", "B) I should bring", "C) my woolen clothes but I didn't.", "D) No error"],
            answer: 1,
            tag: "Past Regret",
            exp: "To express past regret/unfulfilled obligation, use 'should have + V3' ('I should have brought')."
        }
    ]
];

var rawModules = quizData;
var flatQuizData = [];
rawModules.forEach(function(mod, modIdx) {
    mod.forEach(function(item) {
        flatQuizData.push({
            id: flatQuizData.length + 1,
            topic: item.tag || ("Module " + (modIdx + 1)),
            question: item.q,
            options: item.options.map(function(opt) { return opt.replace(/^[A-D]\)\s*/, ""); }),
            answer: item.answer,
            hint: "Check KD Publication Modal Auxiliaries rules for this question.",
            explanation: item.exp
        });
    });
});
var quizData = flatQuizData;

        // State Management
        let currentQuestionIdx = 0;
        const randomizedData = [...quizData];
        const userAnswers = new Array(randomizedData.length).fill(null);

        // Prepare randomized options
        randomizedData.forEach(q => {
            const rawOpts = (Array.isArray(q.options) ? q.options : q.o).map((text, i) => ({
                text: text,
                isCorrect: i === (q.answer !== undefined ? q.answer : q.a)
            }));
            q.shuffledOptions = rawOpts;
        });

        // DOM Elements
        const questionNumberEl = document.getElementById("question-number");
        const subtopicTagEl = document.getElementById("subtopic-tag");
        const questionTextEl = document.getElementById("question-text");
        const hintBoxEl = document.getElementById("hint-box");
        const hintTextEl = document.getElementById("hint-text");
        const optionsContainerEl = document.getElementById("options-container");
        const explanationBoxEl = document.getElementById("explanation-box");
        const explanationTextEl = document.getElementById("explanation-text");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const jumpInputEl = document.getElementById("jump-input");
        const scoreDisplayEl = document.getElementById("score-display");
        const progressTextEl = document.getElementById("progress-text");
        const progressBarEl = document.getElementById("progress-bar");

        function renderQuestion() {
            const q = randomizedData[currentQuestionIdx];

            // Reset view state
            hintBoxEl.classList.add("hidden");
            explanationBoxEl.classList.add("hidden");

            // Populate content
            questionNumberEl.textContent = `Question ${currentQuestionIdx + 1}`;
            subtopicTagEl.textContent = q.topic || "Grammar";
            questionTextEl.textContent = q.question || q.q;
            hintTextEl.textContent = q.hint || "Review the KD Publication Verb rules for this question.";
            explanationTextEl.textContent = q.explanation || q.e || q.exp || "";

            // Render Options
            optionsContainerEl.innerHTML = "";
            const currentSelected = userAnswers[currentQuestionIdx];

            q.shuffledOptions.forEach((opt, optIdx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-lg border transition-all text-sm font-medium flex items-center justify-between ";

                if (currentSelected === null) {
                    btn.className += "border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 bg-white text-slate-700";
                    btn.onclick = () => selectOption(optIdx);
                } else {
                    btn.disabled = true;
                    if (opt.isCorrect) {
                        btn.className += "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
                    } else if (currentSelected === optIdx) {
                        btn.className += "border-rose-500 bg-rose-50 text-rose-900";
                    } else {
                        btn.className += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
                    }
                }

                const prefix = String.fromCharCode(65 + optIdx);
                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 rounded-full border border-current flex items-center justify-center text-xs font-bold">${prefix}</span>
                        <span>${opt.text}</span>
                    </div>
                `;

                if (currentSelected !== null) {
                    if (opt.isCorrect) {
                        btn.innerHTML += `<svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                    } else if (currentSelected === optIdx) {
                        btn.innerHTML += `<svg class="w-5 h-5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                    }
                }

                optionsContainerEl.appendChild(btn);
            });

            // Show explanation if already answered
            if (currentSelected !== null) {
                explanationBoxEl.classList.remove("hidden");
            }

            // Update Navigation state
            prevBtn.disabled = currentQuestionIdx === 0;
            nextBtn.disabled = currentQuestionIdx === randomizedData.length - 1;

            updateStats();
        }

        function selectOption(optIdx) {
            userAnswers[currentQuestionIdx] = optIdx;
            renderQuestion();
        }

        function toggleHint() {
            hintBoxEl.classList.toggle("hidden");
        }

        function updateStats() {
            let score = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans !== null && randomizedData[idx].shuffledOptions[ans].isCorrect) {
                    score++;
                }
            });

            scoreDisplayEl.textContent = `${score} / ${randomizedData.length}`;
            progressTextEl.textContent = `${currentQuestionIdx + 1} / ${randomizedData.length}`;
            
            const progressPercent = ((currentQuestionIdx + 1) / randomizedData.length) * 100;
            progressBarEl.style.width = `${progressPercent}%`;
        }

        function prevQuestion() {
            if (currentQuestionIdx > 0) {
                currentQuestionIdx--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIdx < randomizedData.length - 1) {
                currentQuestionIdx++;
                renderQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInputEl.value);
            if (val >= 1 && val <= randomizedData.length) {
                currentQuestionIdx = val - 1;
                renderQuestion();
                jumpInputEl.value = "";
            } else {
                alert(`Please enter a question number between 1 and ${randomizedData.length}`);
            }
        }

        renderQuestion();
    </script>
