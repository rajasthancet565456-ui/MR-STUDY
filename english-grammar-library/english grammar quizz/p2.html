/* =========================================================
   STATE
========================================================= */

let currentQuestion = 0;

let score = 0;

let answered = new Array(questions.length).fill(false);

let selectedAnswers = new Array(questions.length).fill(null);

let shuffledOptions = [];


/* =========================================================
   SHUFFLE FUNCTION
   Fisher-Yates style shuffle.
   No modulo operator.
   No array cycling.
========================================================= */

function shuffleArray(arr) {

    const copy = [...arr];

    for (let i = copy.length - 1; i > 0; i--) {

        const randomIndex =
            Math.floor(Math.random() * (i + 1));

        const temp = copy[i];

        copy[i] = copy[randomIndex];

        copy[randomIndex] = temp;
    }

    return copy;
}


/* =========================================================
   DISPLAY QUESTION
========================================================= */

function loadQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Q" + (currentQuestion + 1);

    document.getElementById("question").textContent = q.q;

    document.getElementById("hintBox").textContent = q.hint;

    document.getElementById("hintBox").classList.add("hidden");

    document.getElementById("difficulty").textContent =
        currentQuestion < 40
        ? "SSC / RRB / HSSC"
        : "Advanced Exam Practice";

    document.getElementById("progressText").textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    const progress =
        ((currentQuestion + 1) / questions.length) * 100;

    document.getElementById("progressBar").style.width =
        progress + "%";

    document.getElementById("percentage").textContent =
        Math.round(progress) + "%";


    /* SCORE */

    document.getElementById("score").textContent =
        score + " / " + questions.length;


    /* OPTIONS */

    const optionContainer =
        document.getElementById("options");

    optionContainer.innerHTML = "";

    shuffledOptions =
        shuffleArray(q.options);


    shuffledOptions.forEach((option, index) => {

        const button = document.createElement("button");

        button.className =
            "option-btn w-full text-left border-2 border-slate-200 rounded-xl p-4 font-semibold bg-white hover:bg-indigo-50 hover:border-indigo-300";

        button.innerHTML =
            "<span class='inline-flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 mr-3 text-sm font-bold'>" +
            String.fromCharCode(65 + index) +
            "</span>" +
            option;

        button.onclick = function() {

            selectAnswer(option, button);
        };

        optionContainer.appendChild(button);
    });


    /* PREVIOUSLY ANSWERED */

    if (answered[currentQuestion]) {

        const buttons =
            document.querySelectorAll(".option-btn");

        buttons.forEach(btn => {

            const text =
                btn.textContent.substring(1).trim();

            btn.disabled = true;

            btn.classList.add("disabled-option");

            if (text === q.answer) {
                btn.classList.add("correct");
            }

            if (
                text === selectedAnswers[currentQuestion] &&
                text !== q.answer
            ) {
                btn.classList.add("wrong");
            }
        });

        showExplanation();
    }
    else {

        document.getElementById("resultBox")
            .classList.add("hidden");

        document.getElementById("explanationBox")
            .classList.add("hidden");
    }
}


/* =========================================================
   ANSWER SELECTION
========================================================= */

function selectAnswer(selected, clickedButton) {

    if (answered[currentQuestion]) {
        return;
    }

    const q = questions[currentQuestion];

    answered[currentQuestion] = true;

    selectedAnswers[currentQuestion] = selected;

    const isCorrect = selected === q.answer;


    if (isCorrect) {

        score++;

        clickedButton.classList.add("correct");

        showResult(
            true,
            "✓ Correct! Excellent."
        );

    }
    else {

        clickedButton.classList.add("wrong");

        showResult(
            false,
            "✗ Incorrect. Correct answer: " + q.answer
        );
    }


    const buttons =
        document.querySelectorAll(".option-btn");

    buttons.forEach(btn => {

        btn.disabled = true;

        btn.classList.add("disabled-option");

        const text =
            btn.textContent.substring(1).trim();

        if (text === q.answer) {

            btn.classList.add("correct");
        }
    });


    document.getElementById("score").textContent =
        score + " / " + questions.length;

    showExplanation();
}


/* =========================================================
   RESULT
========================================================= */

function showResult(correct, message) {

    const box =
        document.getElementById("resultBox");

    box.classList.remove("hidden");

    if (correct) {

        box.className =
            "mt-5 p-4 rounded-xl bg-green-50 border border-green-200 text-green-800 font-bold";

    }
    else {

        box.className =
            "mt-5 p-4 rounded-xl bg-red-50 border border-red-200 text-red-800 font-bold";
    }

    box.textContent = message;
}


/* =========================================================
   EXPLANATION
========================================================= */

function showExplanation() {

    const q = questions[currentQuestion];

    document.getElementById("explanation")
        .textContent = q.explanation;

    document.getElementById("explanationBox")
        .classList.remove("hidden");
}


/* =========================================================
   HINT
========================================================= */

function toggleHint() {

    document.getElementById("hintBox")
        .classList.toggle("hidden");
}


/* =========================================================
   NAVIGATION
========================================================= */

function nextQuestion() {

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        loadQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
    else {

        finishQuiz();
    }
}


function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        loadQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }
}


function jumpQuestion() {

    const input =
        document.getElementById("jumpInput");

    const number =
        parseInt(input.value);

    if (
        Number.isNaN(number) ||
        number < 1 ||
        number > questions.length
    ) {

        alert("Please enter a question number from 1 to 50.");

        return;
    }

    currentQuestion = number - 1;

    input.value = "";

    loadQuestion();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   FINISH QUIZ
========================================================= */

function finishQuiz() {

    document.getElementById("quizCard")
        .classList.add("hidden");

    document.getElementById("finalCard")
        .classList.remove("hidden");

    document.getElementById("finalScore")
        .textContent =
        score + " / " + questions.length;

    let message = "";

    const percentage =
        (score / questions.length) * 100;

    if (percentage >= 90) {

        message =
            "🔥 Excellent! Your Passive Voice concepts are extremely strong.";

    }
    else if (percentage >= 75) {

        message =
            "💪 Very good! Your concepts are strong, but revise the tricky structures.";

    }
    else if (percentage >= 60) {

        message =
            "📚 Good attempt. Revise Continuous vs Perfect Passive carefully.";

    }
    else {

        message =
            "🧠 Re-study pages 6–10 and attempt the quiz again. Focus on the formulas.";
    }

    document.getElementById("finalMessage")
        .textContent = message;
}


/* =========================================================
   RESTART
========================================================= */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    answered =
        new Array(questions.length).fill(false);

    selectedAnswers =
        new Array(questions.length).fill(null);

    document.getElementById("finalCard")
        .classList.add("hidden");

    document.getElementById("quizCard")
        .classList.remove("hidden");

    loadQuestion();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {

        nextQuestion();

    }

    if (event.key === "ArrowLeft") {

        previousQuestion();
    }
});


/* =========================================================
   START
========================================================= */

loadQuestion();

</script>
