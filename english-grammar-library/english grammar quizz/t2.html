                question: "Identify the error part in: '(a) I have not seen him since twenty years / (b) and so I cannot say / (c) whether he is alive or dead / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 0,
                hint: "'Twenty years' is a duration, so 'since' should be replaced by 'for'.",
                explanation: "Correct! Part (a) has an error: 'twenty years' is a duration of time, so 'for' must be used instead of 'since'."
            },
            {
                tag: "Spotting Error - Indirect Question Word Order",
                question: "Spot the error in: '(a) When he did not find his cook in the kitchen / (b) he asked his wife / (c) where had he gone / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 2,
                hint: "In indirect questions embedded inside a statement, the subject comes before the auxiliary verb.",
                explanation: "Correct! Part (c) is incorrect because 'where had he gone' is in question form. In an indirect question clause, it must be assertive: 'where he had gone'."
            },
            {
                tag: "Spotting Error - Tense Mismatch with Time Clause",
                question: "Find the error part in: '(a) I passed / (b) the examination / (c) two years ago / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 3,
                hint: "Check if explicit past time ('two years ago') matches Simple Past.",
                explanation: "Correct! (d) No error. 'I passed' (Simple Past) is correctly used because of the past time marker 'two years ago'."
            },
            {
                tag: "Spotting Error - 'Since' clause structure",
                question: "Identify the error in: '(a) Since he joined / (b) this post, he did not take / (c) any bribe / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 1,
                hint: "When 'since + Simple Past' starts the sentence, the main clause requires Present Perfect.",
                explanation: "Correct! Part (b) is incorrect. 'he did not take' should be changed to 'he has not taken' (Present Perfect) to match the rule 'Since + S + V2, S + has/have + V3'."
            },
            {
                tag: "Spotting Error - Future Time Clause Rule",
                question: "Spot the error: '(a) By the time / (b) we will get our tickets and enter the cinema theatre, / (c) the show will have already begun / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 1,
                hint: "In future time clauses with 'By the time', the primary clause uses Future Perfect, but the time clause itself uses Simple Present.",
                explanation: "Correct! Part (b) contains an error: 'we will get' should be Simple Present ('we get'). The structure is 'By the time + Simple Present, Future Perfect'."
            },
            {
                tag: "Spotting Error - 'Time Immemorial' preposition",
                question: "Find the error part in: '(a) For time immemorial / (b) sea shells have been used by man / (c) in many ways / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 0,
                hint: "'Time immemorial' denotes a beginning point in antiquity, not a measured duration.",
                explanation: "Correct! Part (a) has an error: 'For time immemorial' should be 'Since time immemorial' because time immemorial denotes a starting point."
            },
            {
                tag: "Spotting Error - Overflow V3 form",
                question: "Identify the error in: '(a) The river is in spate / (b) and it has overflown / (c) its banks / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 1,
                hint: "Check the third form (V3) of the verb overflow.",
                explanation: "Correct! Part (b) is incorrect because the V3 form of overflow is 'overflowed' (overflown is incorrect/belongs to fly)."
            },
            {
                tag: "Spotting Error - Subjunctive Wish Tense",
                question: "Spot the error: '(a) I wish / (b) I have learnt swimming / (c) when I was young / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 1,
                hint: "'I wish' expressing an unfulfilled past desire requires past subjunctive formatting.",
                explanation: "Correct! Part (b) is incorrect; 'I have learnt' should be 'I had learnt' to express an unreal past wish."
            },
            {
                tag: "Spotting Error - 'It's high time' rule",
                question: "Identify the error part: '(a) It is time / (b) we should have done / (c) something useful / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 1,
                hint: "'It's high time' followed by a subject requires the Simple Past (V2) form.",
                explanation: "Correct! Part (b) has an error: 'we should have done' must be replaced by Simple Past 'we did'."
            },
            {
                tag: "Spotting Error - Stative Verb 'Believe'",
                question: "Find the error: '(a) Believe me, I / (b) am believing / (c) whatever you have said / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 1,
                hint: "'Believe' expresses feelings/state of mind and cannot take continuous form.",
                explanation: "Correct! Part (b) is incorrect because 'am believing' violates stative verb rules; it should be 'believe'."
            },
            {
                tag: "Spotting Error - 'Already' in Future",
                question: "Spot the error in: '(a) She will already return / (b) home / (c) when he arrives / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 0,
                hint: "An action completed prior to another future action uses Future Perfect tense.",
                explanation: "Correct! Part (a) is incorrect; 'She will already return' should be 'She will have already returned' (Future Perfect)."
            },
            {
                tag: "Spotting Error - Double Past Sequence",
                question: "Find the error part: '(a) When Anand reached his village / (b) he found that / (c) the news about him preceded him / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 2,
                hint: "The news arriving before his arrival represents an action prior to another past action.",
                explanation: "Correct! Part (c) is incorrect because the news preceding him happened before he reached, requiring Past Perfect: 'had preceded him'."
            },
            {
                tag: "Spotting Error - 'Each one' auxiliary agreement",
                question: "Identify the error in: '(a) Each one of them / (b) has have his share / (c) of joy and sorrow / (d) No error'",
                options: [
                    "a",
                    "b",
                    "c",
                    "d"
                ],
                correct: 1,
                hint: "Check the combination of auxiliary 'has' with main verb form V3.",
                explanation: "Correct! Part (b) is incorrect because 'has' must be followed by V3 'had' ('has had'), fitting the Present Perfect formula."
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const questionTag = document.getElementById('question-tag');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const scoreDisplay = document.getElementById('score-display');
        const currentQNum = document.getElementById('current-q-num');
        const progressBar = document.getElementById('progress-bar');
        const hintBox = document.getElementById('hint-box');
        const hintToggleText = document.getElementById('hint-toggle-text');
        const explanationBox = document.getElementById('explanation-box');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const jumpInput = document.getElementById('jump-input');

        function loadQuestion() {
            const currentQ = quizData[currentIndex];
            questionTag.textContent = currentQ.tag;
            questionText.textContent = `${currentIndex + 1}. ${currentQ.question}`;
            currentQNum.textContent = currentIndex + 1;
            scoreDisplay.textContent = score;
            progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;

            // Reset UI states
            hintBox.classList.add('hidden');
            hintToggleText.textContent = "Show Hint";
            explanationBox.classList.add('hidden');
            explanationBox.className = "hidden p-4 rounded-xl border transition-all";

            // Render options
            optionsContainer.innerHTML = '';
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between text-sm sm:text-base font-medium 
                    ${userAnswers[currentIndex] !== null 
                        ? (index === currentQ.correct 
                            ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-200' 
                            : (userAnswers[currentIndex] === index ? 'bg-rose-500/20 border-rose-500/50 text-rose-200' : 'bg-slate-900/50 border-slate-700 text-slate-300 opacity-60'))
                        : 'bg-slate-900 border-slate-700 hover:border-slate-500 text-slate-200 hover:bg-slate-700/50'}`;
                
                btn.innerHTML = `<span>${option}</span>`;
                btn.disabled = userAnswers[currentIndex] !== null;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });

            // If already answered, show explanation
            if (userAnswers[currentIndex] !== null) {
                showExplanationUI(userAnswers[currentIndex] === currentQ.correct);
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? "Finish Quiz" : "Next Question";
        }

        function selectOption(selectedIndex) {
            const currentQ = quizData[currentIndex];
            userAnswers[currentIndex] = selectedIndex;
            
            const isCorrect = selectedIndex === currentQ.correct;
            if (isCorrect) {
                score++;
            }
            scoreDisplay.textContent = score;

            // Re-render options to show correct/incorrect colors
            loadQuestion();
            showExplanationUI(isCorrect);
        }

        function showExplanationUI(isCorrect) {
            const currentQ = quizData[currentIndex];
            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "p-4 rounded-xl border bg-emerald-500/10 border-emerald-500/30 text-emerald-200 text-sm leading-relaxed";
            } else {
                explanationBox.className = "p-4 rounded-xl border bg-rose-500/10 border-rose-500/30 text-rose-200 text-sm leading-relaxed";
            }
            explanationBox.innerHTML = `
                <div class="font-bold mb-1 flex items-center gap-2">
                    <span>${isCorrect ? '✔ Correct!' : '✖ Incorrect.'}</span>
                </div>
                <p>${currentQ.explanation}</p>
            `;
        }

        function toggleHint() {
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBox.textContent = quizData[currentIndex].hint;
                hintToggleText.textContent = "Hide Hint";
            } else {
                hintBox.classList.add('hidden');
                hintToggleText.textContent = "Show Hint";
            }
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Completed! Your Final Score is ${score} out of 50.`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function jumpToQuestion() {
            const qNum = parseInt(jumpInput.value);
            if (qNum >= 1 && qNum <= quizData.length) {
                currentIndex = qNum - 1;
                jumpInput.value = '';
                loadQuestion();
            } else {
                alert("Please enter a valid question number between 1 and 50.");
            }
        }

        // Initialize Quiz
        loadQuestion();
    </script>
<script src="../../quiz-app-ui-v2.js"></script>
