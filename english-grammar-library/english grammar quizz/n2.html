/* =========================================================
APPLICATION STATE
========================================================= */

let currentQuestion = 0;
let userAnswers = new Array(questions.length).fill(null);
let shuffledOptions = [];
let score = 0;


/* =========================================================
SHUFFLE OPTIONS
No modulo operator.
No while loop.
No question cycling.
========================================================= */

function shuffleArray(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
}


/* =========================================================
PREPARE UNIQUE OPTION ORDER FOR EVERY QUESTION
========================================================= */

shuffledOptions = questions.map(question => {
    return shuffleArray(question.options);
});


/* =========================================================
RENDER QUESTION
========================================================= */

function renderQuestion() {

    const question = questions[currentQuestion];
    const options = shuffledOptions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1);

    document.getElementById("sourcePage").textContent =
        "PDF Page " + question.page;

    document.getElementById("questionText").textContent =
        question.q;

    document.getElementById("progressText").textContent =
        "Question " + (currentQuestion + 1) +
        " of " + questions.length;

    const percentage =
        Math.round(((currentQuestion + 1) / questions.length) * 100);

    document.getElementById("percentageText").textContent =
        percentage + "%";

    document.getElementById("progressBar").style.width =
        percentage + "%";

    document.getElementById("hintBox").textContent =
        question.hint;

    document.getElementById("hintBox").classList.add("hidden");

    const optionsContainer =
        document.getElementById("optionsContainer");

    optionsContainer.innerHTML = "";

    options.forEach((option, index) => {

        const button = document.createElement("button");

        button.type = "button";

        button.className =
            "option-btn w-full text-left border-2 border-slate-200 " +
            "bg-white rounded-xl p-4 font-medium text-slate-800 " +
            "hover:border-blue-400 hover:bg-blue-50";

        const letter =
            String.fromCharCode(65 + index);

        button.innerHTML =
            '<span class="font-bold mr-3">' +
            letter +
            ".</span>" +
            escapeHTML(option);

        button.onclick = function() {
            selectAnswer(option);
        };

        optionsContainer.appendChild(button);
    });

    restorePreviousAnswer();

    document.getElementById("explanationBox").classList.add("hidden");

    updateNavigationButtons();
    updateQuestionGrid();
}


/* =========================================================
ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
ANSWER SELECTION
========================================================= */

function selectAnswer(selectedOption) {

    if (userAnswers[currentQuestion] !== null) {
        return;
    }

    const question = questions[currentQuestion];

    userAnswers[currentQuestion] = selectedOption;

    if (selectedOption === question.answer) {
        score++;
    }

    updateScore();

    const buttons =
        document.querySelectorAll("#optionsContainer button");

    buttons.forEach(button => {

        button.disabled = true;

        button.classList.add("disabled-option");

        const buttonText =
            button.textContent
                .replace(/^[A-D]\.\s*/, "");

        if (buttonText === question.answer) {
            button.classList.add("correct");
        }

        if (
            buttonText === selectedOption &&
            selectedOption !== question.answer
        ) {
            button.classList.add("wrong");
        }
    });

    const resultBox =
        document.getElementById("resultBox");

    if (selectedOption === question.answer) {

        resultBox.className =
            "rounded-xl p-4 mb-4 bg-green-100 border border-green-300 text-green-900";

        resultBox.innerHTML =
            "<strong>✓ Correct!</strong> Excellent. Review the explanation below to strengthen the rule.";

    } else {

        resultBox.className =
            "rounded-xl p-4 mb-4 bg-red-100 border border-red-300 text-red-900";

        resultBox.innerHTML =
            "<strong>✗ Incorrect.</strong> Correct answer: <strong>" +
            escapeHTML(question.answer) +
            "</strong>";
    }

    document.getElementById("explanationText").textContent =
        question.explanation;

    document.getElementById("explanationBox")
        .classList.remove("hidden");

    updateQuestionGrid();

    checkCompletion();
}


/* =========================================================
RESTORE ANSWER WHEN RETURNING TO A QUESTION
========================================================= */

function restorePreviousAnswer() {

    const previousAnswer =
        userAnswers[currentQuestion];

    if (previousAnswer === null) {
        return;
    }

    const question =
        questions[currentQuestion];

    const buttons =
        document.querySelectorAll("#optionsContainer button");

    buttons.forEach(button => {

        button.disabled = true;

        button.classList.add("disabled-option");

        const buttonText =
            button.textContent
                .replace(/^[A-D]\.\s*/, "");

        if (buttonText === question.answer) {
            button.classList.add("correct");
        }

        if (
            buttonText === previousAnswer &&
            previousAnswer !== question.answer
        ) {
            button.classList.add("wrong");
        }
    });

    const resultBox =
        document.getElementById("resultBox");

    if (previousAnswer === question.answer) {

        resultBox.className =
            "rounded-xl p-4 mb-4 bg-green-100 border border-green-300 text-green-900";

        resultBox.innerHTML =
            "<strong>✓ Correct!</strong>";

    } else {

        resultBox.className =
            "rounded-xl p-4 mb-4 bg-red-100 border border-red-300 text-red-900";

        resultBox.innerHTML =
            "<strong>✗ Incorrect.</strong> Correct answer: <strong>" +
            escapeHTML(question.answer) +
            "</strong>";
    }

    document.getElementById("explanationText").textContent =
        question.explanation;

    document.getElementById("explanationBox")
        .classList.remove("hidden");
}


/* =========================================================
SCORE
========================================================= */

function updateScore() {

    const attempted =
        userAnswers.filter(answer => answer !== null).length;

    document.getElementById("score").textContent =
        score + " / " + attempted;
}


/* =========================================================
NEXT QUESTION
========================================================= */

function nextQuestion() {

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        renderQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        showFinalResult();
    }
}


/* =========================================================
PREVIOUS QUESTION
========================================================= */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        renderQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }
}


/* =========================================================
JUMP
========================================================= */

function jumpToQuestion() {

    const value =
        Number(document.getElementById("jumpInput").value);

    if (
        Number.isInteger(value) &&
        value >= 1 &&
        value <= questions.length
    ) {

        currentQuestion = value - 1;

        renderQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        alert("Please enter a question number from 1 to " + questions.length + ".");
    }
}


/* =========================================================
NAVIGATION BUTTONS
========================================================= */

function updateNavigationButtons() {

    const previous =
        document.getElementById("prevBtn");

    const next =
        document.getElementById("nextBtn");

    previous.disabled =
        currentQuestion === 0;

    previous.classList.toggle(
        "opacity-50",
        currentQuestion === 0
    );

    if (currentQuestion === questions.length - 1) {

        next.textContent = "Finish ✓";

    } else {

        next.textContent = "Next →";
    }
}


/* =========================================================
HINT
========================================================= */

function toggleHint() {

    document.getElementById("hintBox")
        .classList.toggle("hidden");
}


/* =========================================================
QUESTION GRID
========================================================= */

function updateQuestionGrid() {

    const grid =
        document.getElementById("questionGrid");

    grid.innerHTML = "";

    questions.forEach((question, index) => {

        const button =
            document.createElement("button");

        button.textContent =
            index + 1;

        button.className =
            "h-9 rounded-lg text-sm font-bold border transition";

        if (index === currentQuestion) {

            button.classList.add(
                "bg-blue-600",
                "text-white",
                "border-blue-600"
            );

        } else if (userAnswers[index] !== null) {

            if (userAnswers[index] === question.answer) {

                button.classList.add(
                    "bg-green-100",
                    "text-green-700",
                    "border-green-300"
                );

            } else {

                button.classList.add(
                    "bg-red-100",
                    "text-red-700",
                    "border-red-300"
                );
            }

        } else {

            button.classList.add(
                "bg-slate-50",
                "text-slate-700",
                "border-slate-200",
                "hover:bg-slate-100"
            );
        }

        button.onclick = function() {

            currentQuestion = index;

            renderQuestion();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        };

        grid.appendChild(button);
    });
}


/* =========================================================
COMPLETION
========================================================= */

function checkCompletion() {

    const completed =
        userAnswers.every(answer => answer !== null);

    if (completed) {
        showFinalResult();
    }
}


/* =========================================================
FINAL RESULT
========================================================= */

function showFinalResult() {

    const attempted =
        userAnswers.filter(answer => answer !== null).length;

    if (attempted !== questions.length) {

        if (currentQuestion === questions.length - 1) {

            const unanswered =
                questions.length - attempted;

            const proceed =
                confirm(
                    "You still have " +
                    unanswered +
                    " unanswered question(s). Finish anyway?"
                );

            if (!proceed) {
                return;
            }

        } else {
            return;
        }
    }

    document.getElementById("finalBox")
        .classList.remove("hidden");

    document.getElementById("finalScore").textContent =
        "Your Score: " +
        score +
        " / " +
        questions.length;

    const percentage =
        Math.round(
            (score / questions.length) * 100
        );

    let message = "";

    if (percentage >= 90) {

        message =
            "Outstanding! Your narration concepts are very strong.";

    } else if (percentage >= 75) {

        message =
            "Very good! Revise the rules behind your incorrect answers.";

    } else if (percentage >= 60) {

        message =
            "Good attempt. Focus on tense, pronoun, conjunction and reporting-verb changes.";

    } else {

        message =
            "Keep practising. Re-read pages 11–20 and attempt the quiz again.";
    }

    document.getElementById("finalMessage").textContent =
        message;

    document.getElementById("finalBox")
        .scrollIntoView({
            behavior: "smooth"
        });
}


/* =========================================================
RESTART
========================================================= */

function restartQuiz() {

    currentQuestion = 0;

    userAnswers =
        new Array(questions.length).fill(null);

    score = 0;

    shuffledOptions =
        questions.map(question => {
            return shuffleArray(question.options);
        });

    document.getElementById("finalBox")
        .classList.add("hidden");

    updateScore();

    renderQuestion();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
KEYBOARD SUPPORT
========================================================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
        nextQuestion();
    }

    if (event.key === "ArrowLeft") {
        previousQuestion();
    }

    if (event.key === "Enter") {

        const active =
            document.activeElement;

        if (active &&
            active.id === "jumpInput") {

            jumpToQuestion();
        }
    }
});


/* =========================================================
INITIALIZE
========================================================= */

updateScore();
renderQuestion();

</script>
