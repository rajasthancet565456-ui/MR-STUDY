/* =====================================================
STATE
===================================================== */

let currentQuestion = 0;
let score = 0;
let answered = new Array(questions.length).fill(false);
let selectedAnswers = new Array(questions.length).fill(null);


/* =====================================================
RANDOMIZE OPTIONS
No modulo operator.
No while loop.
No array cycling.
Fisher-Yates shuffle.
===================================================== */

function shuffleOptions(options) {

    const arr = options.map(function(option) {
        return option;
    });

    for (let i = arr.length - 1; i > 0; i--) {

        const randomIndex = Math.floor(Math.random() * (i + 1));

        const temp = arr[i];
        arr[i] = arr[randomIndex];
        arr[randomIndex] = temp;
    }

    return arr;
}


/* =====================================================
INITIALIZE RANDOMIZED OPTIONS ONCE
===================================================== */

const randomizedOptions = questions.map(function(q) {
    return shuffleOptions(q.options);
});


/* =====================================================
LOAD QUESTION
===================================================== */

function loadQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Q" + (currentQuestion + 1);

    document.getElementById("sourcePage").textContent =
        "Source: Page " + q.page;

    document.getElementById("difficulty").textContent =
        q.level;

    document.getElementById("question").textContent =
        q.q;

    document.getElementById("hint").textContent =
        q.hint;

    document.getElementById("hint").classList.add("hidden");

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    randomizedOptions[currentQuestion].forEach(function(option, index) {

        const button = document.createElement("button");

        button.className =
            "option-btn w-full text-left border-2 border-slate-200 bg-white hover:bg-slate-50 rounded-xl p-4 font-semibold text-slate-700 flex gap-3 items-start";

        const letter = String.fromCharCode(65 + index);

        button.innerHTML =
            '<span class="min-w-[32px] h-8 rounded-lg bg-slate-100 flex items-center justify-center font-extrabold">' +
            letter +
            '</span>' +
            '<span class="leading-relaxed">' +
            escapeHTML(option) +
            '</span>';

        button.onclick = function() {
            selectAnswer(option, button);
        };

        optionsContainer.appendChild(button);
    });

    const explanation =
        document.getElementById("explanation");

    explanation.classList.add("hidden");
    explanation.innerHTML = "";

    if (answered[currentQuestion]) {

        showPreviousAnswer();

    }

    updateProgress();
    updateScore();

    document.getElementById("quizCard").classList.remove("fade");

    void document.getElementById("quizCard").offsetWidth;

    document.getElementById("quizCard").classList.add("fade");
}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
SELECT ANSWER
===================================================== */

function selectAnswer(option, clickedButton) {

    if (answered[currentQuestion]) {
        return;
    }

    const q = questions[currentQuestion];

    answered[currentQuestion] = true;
    selectedAnswers[currentQuestion] = option;

    const allButtons =
        document.querySelectorAll("#options button");

    allButtons.forEach(function(button) {

        button.disabled = true;
        button.classList.add("disabled-option");

        const optionText =
            button.querySelector("span:last-child").textContent;

        if (optionText === q.answer) {
            button.classList.add("correct");
        }
    });

    if (option === q.answer) {

        score++;

        clickedButton.classList.add("correct");

    } else {

        clickedButton.classList.add("wrong");
    }

    showExplanation(option);
    updateScore();

    if (currentQuestion === questions.length - 1) {
        setTimeout(function() {
            showResult();
        }, 600);
    }
}


/* =====================================================
SHOW EXPLANATION
===================================================== */

function showExplanation(selected) {

    const q = questions[currentQuestion];

    const explanation =
        document.getElementById("explanation");

    const correct =
        selected === q.answer;

    explanation.className =
        "explanation-box mt-7 rounded-xl border-2 p-5 " +
        (correct
            ? "bg-green-50 border-green-300"
            : "bg-red-50 border-red-300");

    explanation.innerHTML =
        '<div class="font-extrabold text-lg mb-3 ' +
        (correct ? "text-green-700" : "text-red-700") +
        '">' +
        (correct ? "✓ Correct Answer" : "✗ Incorrect Answer") +
        '</div>' +

        '<div class="mb-3">' +
        '<strong>Correct Answer:</strong> ' +
        escapeHTML(q.answer) +
        '</div>' +

        '<div class="text-slate-700 leading-relaxed">' +
        '<strong>Expert Explanation:</strong><br>' +
        escapeHTML(q.explanation) +
        '</div>' +

        '<div class="mt-4 pt-3 border-t border-slate-300 text-sm text-slate-500">' +
        '<strong>Source:</strong> Uploaded PDF, Page ' +
        q.page +
        '</div>';

    explanation.classList.remove("hidden");
}


/* =====================================================
SHOW PREVIOUS ANSWER
===================================================== */

function showPreviousAnswer() {

    const q = questions[currentQuestion];

    const allButtons =
        document.querySelectorAll("#options button");

    allButtons.forEach(function(button) {

        button.disabled = true;

        const optionText =
            button.querySelector("span:last-child").textContent;

        if (optionText === q.answer) {
            button.classList.add("correct");
        }

        if (
            selectedAnswers[currentQuestion] !== null &&
            optionText === selectedAnswers[currentQuestion] &&
            optionText !== q.answer
        ) {
            button.classList.add("wrong");
        }
    });

    showExplanation(selectedAnswers[currentQuestion]);
}


/* =====================================================
HINT
===================================================== */

function toggleHint() {

    const hint =
        document.getElementById("hint");

    hint.classList.toggle("hidden");
}


/* =====================================================
NEXT
===================================================== */

function nextQuestion() {

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        loadQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        showResult();
    }
}


/* =====================================================
PREVIOUS
===================================================== */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        loadQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }
}


/* =====================================================
JUMP
===================================================== */

function jumpQuestion() {

    const input =
        document.getElementById("jumpInput");

    const number =
        parseInt(input.value, 10);

    if (
        Number.isNaN(number) ||
        number < 1 ||
        number > questions.length
    ) {

        alert("Please enter a question number from 1 to 50.");

        return;
    }

    currentQuestion = number - 1;

    input.value = "";

    loadQuestion();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =====================================================
PROGRESS
===================================================== */

function updateProgress() {

    const total = questions.length;

    const current = currentQuestion + 1;

    const percentage =
        Math.round((current / total) * 100);

    document.getElementById("progressText").textContent =
        "Question " + current + " of " + total;

    document.getElementById("percentage").textContent =
        percentage + "%";

    document.getElementById("progressBar").style.width =
        percentage + "%";
}


/* =====================================================
SCORE
===================================================== */

function updateScore() {

    document.getElementById("score").textContent =
        score + " / " + questions.length;
}


/* =====================================================
RESULT
===================================================== */

function showResult() {

    const resultCard =
        document.getElementById("resultCard");

    const finalScore =
        document.getElementById("finalScore");

    const performance =
        document.getElementById("performance");

    const percentage =
        Math.round((score / questions.length) * 100);

    finalScore.textContent =
        score + " / " + questions.length +
        " (" + percentage + "%)";

    let message = "";

    if (percentage >= 90) {

        message =
            "🏆 Excellent! Your Narration concepts are very strong.";

    } else if (percentage >= 75) {

        message =
            "🔥 Very Good! Revise the questions you missed and attempt again.";

    } else if (percentage >= 60) {

        message =
            "👍 Good attempt. Strengthen tense, pronoun and time-expression rules.";

    } else if (percentage >= 40) {

        message =
            "📚 Keep practicing. Revisit pages 4–10 before another attempt.";

    } else {

        message =
            "💪 Start again after revising the basic narration rules carefully.";
    }

    performance.textContent = message;

    resultCard.classList.remove("hidden");

    resultCard.scrollIntoView({
        behavior: "smooth"
    });
}


/* =====================================================
RESTART
===================================================== */

function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    answered =
        new Array(questions.length).fill(false);

    selectedAnswers =
        new Array(questions.length).fill(null);

    randomizedOptions.length = 0;

    questions.forEach(function(q) {

        randomizedOptions.push(
            shuffleOptions(q.options)
        );
    });

    document.getElementById("resultCard")
        .classList.add("hidden");

    loadQuestion();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =====================================================
KEYBOARD SHORTCUTS
===================================================== */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
        nextQuestion();
    }

    if (event.key === "ArrowLeft") {
        previousQuestion();
    }
});


/* =====================================================
START
===================================================== */

loadQuestion();
updateScore();

</script>
